# Leetcode Solu Workflow Add Static Demo Page

## Action

Follow the add-static-demo-page workflow:
1. Create a new directory under project/ with a descriptive name for the demo or feature.
2. Add an index.html file (or multiple .html files) to serve as the demo page.
3. Optionally add supporting files such as README.md, JavaScript (.js), and CSS (.css) files for richer demos.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: project/*/index.html, project/*/*.html, project/*/*.js

