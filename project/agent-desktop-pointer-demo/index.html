<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pointer-token" content="__TOKEN__">
<title>桌面光标 · 本机控制台</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101820;color:#edf6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:clamp(24px,6vw,86px);display:grid;align-items:center}
main{max-width:960px;width:100%;margin:auto;display:grid;grid-template-columns:minmax(260px,1fr) minmax(240px,340px);gap:clamp(24px,6vw,84px);align-items:center}
small{color:#87ded0;font:600 12px ui-monospace,monospace;letter-spacing:.12em}
h1{font-size:clamp(36px,7vw,74px);letter-spacing:-.07em;margin:12px 0}
p{color:#b8c7d0;line-height:1.7;max-width:38ch}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 12px}
.controls button{border:1px solid #49616e;border-radius:9px;background:#20323e;color:#fff;font:inherit;padding:9px 15px;cursor:pointer}
.controls button:first-child{background:#96ede0;color:#102521;border-color:transparent;font-weight:650}
button:disabled{opacity:.48;cursor:default}
#status{min-height:3.5em;color:#87ded0}
.panel{padding:18px;background:#182632;border:1px solid #344755;border-radius:21px;box-shadow:0 18px 70px #0005}
.panel small{display:block;margin:3px 0 13px}
#presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
#presets button{background:#20323e;color:#edf6fb;border:1px solid #49616e;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
#presets button:disabled{cursor:default}
#stage{position:relative;overflow:hidden;isolation:isolate;aspect-ratio:230/408;background:#0f1922;border-radius:13px;touch-action:none}
#stage:empty::before{content:'等待连接';position:absolute;inset:0;display:grid;place-items:center;color:#a4b6c2}
#readout{position:absolute;right:7%;top:12%;text-align:right;pointer-events:none}
#readout span{display:block;color:#a4b6c2;min-height:1.4em}
#readout strong{display:block;font-size:clamp(27px,4vw,48px);font-weight:500;font-variant-numeric:tabular-nums}
.key{position:absolute;padding:0;border:0;border-radius:50%;background:#2b3d4b;color:#fff;font:500 clamp(16px,2vw,27px) system-ui}
.key:hover:not(:disabled),.key:focus-visible,.key.is-step{background:#96ede0;color:#102521;outline:2px solid #c8fff6}
.key:disabled{opacity:1}
.paint-panel{grid-column:1/-1;padding:24px;border:1px solid #4b4562;border-radius:20px;background:#191f30}
.paint-grid{display:grid;grid-template-columns:minmax(250px,1fr) minmax(240px,1.25fr);gap:24px;align-items:start}
.paint-panel h2{font-size:28px;font-weight:600;margin:10px 0}
.paint-panel p{max-width:48ch}
.paint-panel .controls{margin:18px 0}
.paint-preview{margin:0;align-self:center;background:#101820;border-radius:12px;overflow:hidden}
.paint-preview img{display:block;width:100%;height:auto}
.paint-preview img[hidden]{display:none}
.paint-preview figcaption{padding:14px;color:#b8c7d0;font-size:13px;line-height:1.6}
#paint-progress{display:block;width:100%;accent-color:#bf9bff;height:8px;margin:14px 0}
#paint-tools{padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
#paint-tools li{padding:5px 9px;border:1px solid #485063;border-radius:6px;font-size:12px;color:#a7b6c4}
#paint-tools li.current{color:#f6edff;border-color:#bf9bff;background:#594375}
#paint-tools li.done{color:#a9edde;border-color:#467669}
#paint-status{min-height:3.5em}
@media(max-width:630px){main{grid-template-columns:1fr}.panel{width:min(100%,310px);margin:auto}}
@media(max-width:760px){.paint-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <section>
    <small>本机联动 / MACOS</small>
    <h1>桌面光标</h1>
    <p>把 Mac 计算器放在另一块屏幕或浏览器旁边。在右侧操作区移动和点击，观察真实窗口中的虚拟光标与计算结果。</p>
    <div class="controls">
      <button id="connect">连接计算器</button>
      <button id="refresh" disabled>刷新位置</button>
      <button id="disconnect" disabled>断开</button>
    </div>
    <p id="status" role="status">请先打开 Mac 自带的计算器。</p>
  </section>
  <section class="panel" aria-label="计算器操作区">
    <small>计算器操作区</small>
    <small>预设演示</small>
    <div id="presets" role="group" aria-label="预设演示">
      <button type="button" data-preset="multiply" disabled>23 × 17</button>
      <button type="button" data-preset="divide" disabled>144 ÷ 12</button>
      <button type="button" data-preset="add" disabled>18 + 24</button>
    </div>
    <div id="stage"></div>
  </section>
  <section id="paint-demo" class="paint-panel" aria-label="Safari 画图演示">
    <small>SAFARI / JS PAINT</small>
    <div class="paint-grid">
      <div>
        <h2>画一个霸天虎</h2>
        <p>连接后打开 Safari 中的空白画布。虚拟光标依次使用 10 种工具，画出紫色面甲徽记。</p>
        <div class="controls">
          <button id="paint-connect" type="button">连接 Safari 画图</button>
          <button id="paint-start" type="button" disabled>绘制霸天虎</button>
          <button id="paint-stop" type="button" disabled>停止</button>
        </div>
        <progress id="paint-progress" value="0" max="10" aria-label="绘画进度"></progress>
        <p id="paint-status" role="status">请连接画图，准备 Safari 空白画布。</p>
        <ol id="paint-tools" aria-label="十种画图工具"></ol>
      </div>
      <figure class="paint-preview">
        <img id="paint-preview" alt="Safari 画图窗口的最新画面" hidden>
        <figcaption id="paint-caption">连接后显示画布。绘画时可在 Safari 窗口观察虚拟光标，每完成一种工具，这里更新一次画面。</figcaption>
      </figure>
    </div>
  </section>
</main>
<script src="/client.js" defer></script>
</body>
</html>
