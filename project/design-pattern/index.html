<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设计模式实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto max-w-5xl px-6 py-16">
      <p
        class="text-sm font-semibold uppercase tracking-[0.3em] text-amber-400"
      >
        Design Pattern Lab
      </p>
      <h1 class="mt-3 text-4xl font-bold">设计模式实验室</h1>
      <p class="mt-4 text-stone-400">通过浏览器示例理解常见设计原则与模式。</p>
      <div class="mt-10 grid gap-5 md:grid-cols-3">
        <a
          class="rounded-2xl border border-stone-800 bg-stone-900 p-6 transition hover:-translate-y-1 hover:border-amber-400"
          href="./设计原则/"
        >
          <h2 class="text-lg font-semibold">设计原则</h2>
          <p class="mt-2 text-sm text-stone-400">从职责和依赖理解代码边界。</p>
        </a>
        <a
          class="rounded-2xl border border-stone-800 bg-stone-900 p-6 transition hover:-translate-y-1 hover:border-amber-400"
          href="./策略模式/"
        >
          <h2 class="text-lg font-semibold">策略模式</h2>
          <p class="mt-2 text-sm text-stone-400">在运行时选择可替换的行为。</p>
        </a>
        <a
          class="rounded-2xl border border-stone-800 bg-stone-900 p-6 transition hover:-translate-y-1 hover:border-amber-400"
          href="./状态模式/"
        >
          <h2 class="text-lg font-semibold">状态模式</h2>
          <p class="mt-2 text-sm text-stone-400">让对象行为随内部状态变化。</p>
        </a>
      </div>
    </main>
  </body>
</html>
