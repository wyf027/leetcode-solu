<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拖拽排序实验室</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-5xl px-6 py-16">
      <p class="text-sm font-semibold uppercase tracking-[0.3em] text-cyan-400">
        Drag Sort Lab
      </p>
      <h1 class="mt-3 text-4xl font-bold">拖拽排序实验室</h1>
      <p class="mt-4 text-slate-400">
        三个无需安装即可体验的排序与动画示例。
      </p>
      <div class="mt-10 grid gap-5 md:grid-cols-3">
        <a
          class="rounded-2xl border border-slate-800 bg-slate-900 p-6 transition hover:-translate-y-1 hover:border-cyan-400"
          href="./192.html"
        >
          <h2 class="text-lg font-semibold">原生拖放排序</h2>
          <p class="mt-2 text-sm text-slate-400">使用拖放事件调整列表顺序。</p>
        </a>
        <a
          class="rounded-2xl border border-slate-800 bg-slate-900 p-6 transition hover:-translate-y-1 hover:border-cyan-400"
          href="./flip.html"
        >
          <h2 class="text-lg font-semibold">FLIP 动画</h2>
          <p class="mt-2 text-sm text-slate-400">观察列表重排时的平滑过渡。</p>
        </a>
        <a
          class="rounded-2xl border border-slate-800 bg-slate-900 p-6 transition hover:-translate-y-1 hover:border-cyan-400"
          href="./sortable.html"
        >
          <h2 class="text-lg font-semibold">Sortable 排序</h2>
          <p class="mt-2 text-sm text-slate-400">体验可拖拽的网格排序。</p>
        </a>
      </div>
    </main>
  </body>
</html>
