# Only loaded by this project's start:ghostty launcher.
# Preserve editor Command modifiers; native paste also serves login/search inputs.
keybind = super+c=csi:99;9u
keybind = super+x=csi:120;9u
keybind = super+v=paste_from_clipboard
keybind = super+a=csi:97;9u
keybind = super+z=csi:122;9u
keybind = super+shift+z=csi:122;10u
keybind = super+s=csi:115;9u
keybind = super+f=csi:102;9u
keybind = super+g=csi:103;9u
keybind = super+shift+g=csi:103;10u
keybind = super+d=csi:100;9u
keybind = super+i=csi:105;9u
keybind = super+slash=csi:47;9u
keybind = super+arrow_left=csi:1;9D
keybind = super+arrow_right=csi:1;9C
keybind = super+arrow_up=csi:1;9A
keybind = super+arrow_down=csi:1;9B
keybind = super+shift+arrow_left=csi:1;10D
keybind = super+shift+arrow_right=csi:1;10C
keybind = super+shift+arrow_up=csi:1;10A
keybind = super+shift+arrow_down=csi:1;10B
