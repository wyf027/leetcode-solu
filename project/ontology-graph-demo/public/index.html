<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ontology · 图谱工作台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%239e9afa' d='m12 2 9 5v10l-9 5-9-5V7z'/%3E%3Cpath fill='none' stroke='%23171333' stroke-width='1.5' d='m4 7 8 5 8-5m-8 5v9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script defer src="/g6.min.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-mark" viewBox="0 0 24 24"><path d="m12 2.8 8 4.6v9.2l-8 4.6-8-4.6V7.4zM4.1 7.5 12 12l8-4.5M12 12v9.1"/><circle cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.2-3A7.5 7.5 0 1 1 20 11.5Z"/><path d="M9 11.5h.1m3.4 0h.1m3.4 0h.1" stroke-width="2.4"/></symbol>
    <symbol id="i-network" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.8"/><circle cx="5" cy="17" r="2.8"/><circle cx="19" cy="17" r="2.8"/><path d="m10.6 7.4-4.2 7.2m7-7.2 4.2 7.2M8 17h8"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7V5Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/><rect x="9" y="9" width="6" height="6" rx="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m6.5 8 4 4-4 4m7.5 0h4"/><rect x="3" y="4" width="18" height="16" rx="3"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M13 5h6v6m0-6-8 8m6 0v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  </svg>

  <div class="workspace">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark"><svg><use href="#i-mark"/></svg></span>
        <div><span class="brand-name">Ontology</span><span class="brand-divider"></span><span class="brand-caption">图谱工作台</span></div>
      </div>
      <div class="runtime">
        <span class="connection" id="connection" data-status="waiting"><i></i><span id="connection-label">连接中</span></span>
        <a class="source-link" href="https://www.modelscope.cn/skills/@oswalpalash/ontology" target="_blank" rel="noopener noreferrer" aria-label="ModelScope ontology skill">ModelScope <svg><use href="#i-link"/></svg></a>
      </div>
    </header>

    <main class="panes">
      <section class="chat panel" aria-labelledby="chat-heading">
        <div class="panel-head">
          <h1 id="chat-heading"><svg><use href="#i-chat"/></svg> 对话</h1>
          <button class="text-button" id="new-chat" type="button" title="开启空白对话，保留当前图谱"><svg><use href="#i-plus"/></svg> 新对话</button>
        </div>
        <div class="messages" id="messages" role="log" aria-label="对话记录" aria-live="polite"></div>
        <div class="composer">
          <div class="suggestions" id="suggestions" aria-label="示例消息"></div>
          <form id="message-form">
            <label class="sr-only" for="message">输入消息</label>
            <textarea id="message" rows="2" maxlength="1000" placeholder="给图谱发一条消息…" required></textarea>
            <button class="send" id="send" type="submit" title="发送消息" aria-label="发送消息"><svg><use href="#i-send"/></svg></button>
          </form>
          <div class="composer-status" id="composer-status" role="status"></div>
        </div>
      </section>
      <section class="network panel" aria-labelledby="graph-heading">
        <div class="panel-head graph-head">
          <h2 id="graph-heading"><svg><use href="#i-network"/></svg> 知识图谱</h2>
          <div class="graph-stats" id="graph-stats" aria-live="polite"><span><b id="node-count">0</b> 节点</span><span><b id="edge-count">0</b> 关系</span></div>
        </div>
        <div class="stage">
          <div class="graph-canvas" id="graph-canvas" aria-label="AntV G6 知识图谱"></div>
          <div class="empty" id="empty-graph">
            <div class="empty-symbol"><svg><use href="#i-network"/></svg></div>
            <strong>图谱为空</strong>
          </div>
          <div class="graph-controls" aria-label="图谱视图">
            <button type="button" id="zoom-in" aria-label="放大" title="放大" disabled><svg><use href="#i-plus"/></svg></button>
            <button type="button" id="zoom-out" aria-label="缩小" title="缩小" disabled><svg><use href="#i-minus"/></svg></button>
            <button type="button" id="fit-graph" aria-label="适应视图" title="适应视图" disabled><svg><use href="#i-fit"/></svg></button>
          </div>
          <aside class="inspector" id="inspector" aria-label="图谱详情" hidden></aside>
        </div>
        <div class="graph-footer">
          <div class="legend" id="legend" aria-label="节点类型"></div>
          <a class="source-link g6" href="https://g6.antv.antgroup.com/" target="_blank" rel="noopener noreferrer">AntV G6 <svg><use href="#i-link"/></svg></a>
        </div>
      </section>
    </main>
  </div>

  <template id="welcome-template">
    <div class="welcome">
      <div class="welcome-mark"><svg><use href="#i-mark"/></svg></div>
      <h2>从一条消息开始</h2>
      <p>创建项目、指派任务或查询关系，看看图谱如何随对话改变。</p>
      <button id="play-demo" class="demo-button" type="button"><svg><use href="#i-play"/></svg><span>演示一段对话</span></button>
    </div>
  </template>
</body>
</html>
