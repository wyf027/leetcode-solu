<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 全流程演示 Demo</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #647184;
      --line: #d9e0ea;
      --soft: #eef3f8;
      --blue: #1f6feb;
      --green: #108a57;
      --amber: #b87503;
      --red: #cf222e;
      --purple: #8250df;
      --teal: #087ea4;
      --shadow: 0 14px 42px rgba(30, 45, 72, 0.08);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(247,248,251,0.92)),
        radial-gradient(circle at 20% 0%, rgba(8,126,164,0.12), transparent 32%),
        radial-gradient(circle at 82% 4%, rgba(31,111,235,0.11), transparent 30%);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 760;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status-pill {
      border: 1px solid #badbcc;
      color: #0f6848;
      background: #e8f6ee;
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }

    main {
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(320px, 420px) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
    }

    .control-panel {
      position: sticky;
      top: 86px;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .panel-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 740;
    }

    .panel-body {
      padding: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      color: #344055;
      font-size: 12px;
      font-weight: 690;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 102px;
      resize: vertical;
      border: 1px solid #c9d4e2;
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--ink);
      background: #fbfcfe;
      outline: none;
      line-height: 1.55;
    }

    textarea:focus,
    input[type="range"]:focus-visible,
    button:focus-visible {
      outline: 3px solid rgba(31, 111, 235, 0.18);
      outline-offset: 2px;
    }

    .scenario-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .scenario {
      min-height: 40px;
      border: 1px solid #cbd7e5;
      background: #fff;
      color: #273244;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      padding: 9px 10px;
      text-align: left;
    }

    .scenario:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .primary {
      width: 100%;
      border: none;
      background: var(--blue);
      color: #fff;
      border-radius: 8px;
      min-height: 44px;
      cursor: pointer;
      font-weight: 720;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .primary:hover {
      background: #185abc;
    }

    .secondary {
      border: 1px solid #cbd7e5;
      background: #fff;
      color: #273244;
      border-radius: 8px;
      min-height: 36px;
      cursor: pointer;
      padding: 0 11px;
      font-size: 13px;
      font-weight: 650;
    }

    .secondary:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .slider-row {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }

    .range-value {
      font-family: var(--mono);
      font-size: 12px;
      color: #243044;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 7px;
      text-align: center;
    }

    .toggle-row {
      display: grid;
      gap: 8px;
      margin: 16px 0;
    }

    .toggle {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: #273244;
      background: #fbfcfe;
      border: 1px solid #d8e1eb;
      border-radius: 8px;
      padding: 10px 11px;
      font-size: 13px;
    }

    .toggle input {
      inline-size: 18px;
      block-size: 18px;
      accent-color: var(--blue);
    }

    .doc-list {
      display: grid;
      gap: 10px;
      max-height: 360px;
      overflow: auto;
      padding-right: 4px;
    }

    .doc-item {
      border: 1px solid #d8e1eb;
      border-radius: 8px;
      padding: 11px;
      background: #fbfcfe;
    }

    .doc-item strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
    }

    .doc-meta {
      margin-top: 7px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      min-height: 22px;
      padding: 0 8px;
      background: #edf2f7;
      color: #4b596d;
      font-size: 11px;
      border: 1px solid #dce4ee;
      white-space: nowrap;
    }

    .stage-board {
      display: grid;
      gap: 14px;
    }

    .answer-panel {
      border: 1px solid #badbcc;
      background: #f3fbf6;
      border-radius: 8px;
      padding: 16px;
    }

    .answer-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      margin-bottom: 10px;
    }

    .answer-top h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }

    .confidence {
      font-family: var(--mono);
      font-size: 12px;
      color: #07543a;
      border: 1px solid #badbcc;
      background: #e8f6ee;
      border-radius: 999px;
      padding: 7px 9px;
      white-space: nowrap;
    }

    .answer-text {
      margin: 0;
      line-height: 1.72;
      color: #203047;
      font-size: 15px;
    }

    .citation {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 6px;
      margin: 0 2px;
      border-radius: 999px;
      background: #dff3e8;
      color: #0f6848;
      border: 1px solid #badbcc;
      font-family: var(--mono);
      font-size: 11px;
      vertical-align: 1px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      background: #fff;
      border: 1px solid #dce4ee;
      border-radius: 8px;
      padding: 12px;
      min-height: 78px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 780;
      line-height: 1;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.35;
    }

    details.stage {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(30, 45, 72, 0.04);
    }

    details.stage[open] {
      box-shadow: var(--shadow);
    }

    summary {
      cursor: pointer;
      list-style: none;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid transparent;
    }

    details[open] summary {
      border-bottom-color: var(--line);
    }

    summary::-webkit-details-marker {
      display: none;
    }

    .step-index {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      background: #344055;
      font-weight: 800;
      font-family: var(--mono);
      font-size: 13px;
    }

    .stage:nth-of-type(3n + 1) .step-index {
      background: var(--teal);
    }

    .stage:nth-of-type(3n + 2) .step-index {
      background: var(--purple);
    }

    .stage:nth-of-type(3n) .step-index {
      background: var(--amber);
    }

    .stage-title {
      min-width: 0;
    }

    .stage-title strong {
      display: block;
      font-size: 14px;
      line-height: 1.35;
    }

    .stage-title span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 2px;
    }

    .stage-badge {
      font-family: var(--mono);
      color: #4b596d;
      font-size: 12px;
      background: #edf2f7;
      border: 1px solid #dce4ee;
      border-radius: 999px;
      padding: 6px 9px;
      white-space: nowrap;
    }

    .stage-content {
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .artifact {
      border: 1px solid #dce4ee;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 12px;
      overflow: auto;
    }

    .artifact-title {
      margin: 0 0 8px;
      color: #344055;
      font-size: 12px;
      font-weight: 760;
      text-transform: uppercase;
    }

    .artifact p {
      margin: 0;
      line-height: 1.6;
      color: #2e3a4f;
      font-size: 13px;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #243044;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      min-width: 620px;
    }

    th,
    td {
      padding: 9px 8px;
      border-bottom: 1px solid #dce4ee;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #344055;
      background: #f0f4f8;
      position: sticky;
      top: 0;
    }

    td code,
    .inline-code {
      font-family: var(--mono);
      font-size: 11px;
      color: #203047;
      background: #edf2f7;
      border: 1px solid #dce4ee;
      border-radius: 6px;
      padding: 2px 5px;
    }

    .scorebar {
      position: relative;
      height: 8px;
      width: 90px;
      background: #e7edf4;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 5px;
    }

    .scorebar span {
      display: block;
      height: 100%;
      background: var(--blue);
      border-radius: inherit;
    }

    mark {
      background: #fff2b8;
      color: inherit;
      border-radius: 4px;
      padding: 0 2px;
    }

    .flowline {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .flow-chip {
      background: #fff;
      border: 1px solid #d8e1eb;
      border-radius: 8px;
      min-height: 54px;
      padding: 9px;
      display: grid;
      align-content: center;
      gap: 3px;
    }

    .flow-chip strong {
      font-size: 12px;
      line-height: 1.25;
    }

    .flow-chip span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1020px) {
      main {
        grid-template-columns: 1fr;
      }

      .control-panel {
        position: static;
      }

      .metrics,
      .grid-2,
      .flowline {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .header-actions {
        justify-content: flex-start;
      }

      main {
        padding: 14px;
      }

      .scenario-grid,
      .metrics,
      .grid-2,
      .flowline {
        grid-template-columns: 1fr;
      }

      summary {
        grid-template-columns: auto 1fr;
      }

      .stage-badge {
        grid-column: 2;
        justify-self: start;
      }

      .answer-top {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header>
      <div class="topbar">
        <div>
          <h1>RAG 全流程演示工作台</h1>
          <p class="subtitle">从文档接入到回答评估，逐环节展示输入、算法、中间产物与最终引用。</p>
        </div>
        <div class="header-actions">
          <span class="status-pill" id="runStatus">Ready</span>
          <button class="secondary" id="expandAll" type="button">展开全部</button>
          <button class="secondary" id="collapseAll" type="button">收起全部</button>
        </div>
      </div>
    </header>

    <main>
      <aside class="panel control-panel">
        <div class="panel-header">
          <h2 class="panel-title">输入与配置</h2>
        </div>
        <div class="panel-body">
          <div class="field">
            <label for="question">用户问题</label>
            <textarea id="question">如果员工周五请病假，还能报销打车费吗？分别需要满足什么条件？</textarea>
          </div>

          <div class="field">
            <label>示例问题</label>
            <div class="scenario-grid">
              <button class="scenario" data-question="如果员工周五请病假，还能报销打车费吗？分别需要满足什么条件？" type="button">病假 + 打车</button>
              <button class="scenario" data-question="生产事故 P1 的响应流程是什么？需要多久升级？" type="button">事故响应</button>
              <button class="scenario" data-question="外包人员访问代码仓库和客户数据时需要哪些审批和安全要求？" type="button">权限安全</button>
              <button class="scenario" data-question="差旅报销需要提交哪些凭证？逾期会怎样？" type="button">差旅报销</button>
            </div>
          </div>

          <div class="field">
            <label>索引参数</label>
            <div class="slider-row">
              <input id="chunkSize" type="range" min="60" max="180" step="10" value="110">
              <span class="range-value" id="chunkSizeValue">110</span>
            </div>
            <div class="slider-row">
              <input id="overlap" type="range" min="0" max="50" step="10" value="20">
              <span class="range-value" id="overlapValue">20</span>
            </div>
            <div class="slider-row">
              <input id="topK" type="range" min="2" max="6" step="1" value="4">
              <span class="range-value" id="topKValue">4</span>
            </div>
          </div>

          <div class="toggle-row" aria-label="RAG 开关">
            <label class="toggle">查询改写 <input id="useRewrite" type="checkbox" checked></label>
            <label class="toggle">重排序 Rerank <input id="useRerank" type="checkbox" checked></label>
            <label class="toggle">上下文压缩 <input id="useCompression" type="checkbox" checked></label>
          </div>

          <button class="primary" id="runButton" type="button">运行 RAG 流程</button>

          <div class="field" style="margin-top:18px;">
            <label>内置知识库</label>
            <div class="doc-list" id="docList"></div>
          </div>
        </div>
      </aside>

      <section class="stage-board">
        <div class="flowline" aria-label="RAG 流程概览">
          <div class="flow-chip"><strong>1. 接入</strong><span>文档 + 元数据</span></div>
          <div class="flow-chip"><strong>2. 索引</strong><span>清洗/切块/向量</span></div>
          <div class="flow-chip"><strong>3. 检索</strong><span>改写/召回/重排</span></div>
          <div class="flow-chip"><strong>4. 构造</strong><span>压缩/提示词</span></div>
          <div class="flow-chip"><strong>5. 生成</strong><span>回答 + 引用</span></div>
          <div class="flow-chip"><strong>6. 评估</strong><span>质量/观测</span></div>
        </div>

        <section class="answer-panel">
          <div class="answer-top">
            <h2>最终回答</h2>
            <span class="confidence" id="confidence">confidence: --</span>
          </div>
          <p class="answer-text" id="answerText">点击“运行 RAG 流程”查看答案。</p>
        </section>

        <section class="metrics" id="metrics"></section>

        <div id="stages"></div>
      </section>
    </main>
  </div>

  <script>
    const documents = [
      {
        id: "HR-001",
        title: "员工休假与病假政策",
        owner: "人力资源部",
        updated: "2026-03-14",
        tags: ["HR", "leave"],
        text: "员工申请病假需要在当日 10:00 前通过 HR 系统提交申请，并在返岗后三个工作日内补交医院证明或线上问诊记录。病假期间不计入年假额度。连续病假超过三天时，直属经理需要在系统中确认工作交接。周五或节假日前后的病假不会被自动拒绝，但系统会要求补充说明和证明材料。"
      },
      {
        id: "FIN-014",
        title: "差旅与交通费报销规范",
        owner: "财务部",
        updated: "2026-04-02",
        tags: ["finance", "expense"],
        text: "员工因客户拜访、跨城会议或经主管批准的加班产生交通费用时，可以提交打车费报销。报销需要上传发票、行程截图和业务事由，单笔超过 200 元需要部门负责人二次审批。通勤、私人行程和未说明业务目的的打车费不予报销。报销单需要在费用发生后 30 天内提交，逾期需要财务经理批准。"
      },
      {
        id: "SEC-007",
        title: "外包人员访问与数据安全要求",
        owner: "安全办公室",
        updated: "2026-02-20",
        tags: ["security", "access"],
        text: "外包人员默认不能访问生产环境、客户隐私数据或核心代码仓库。确需访问时，必须由业务负责人发起权限申请，安全办公室审批，有效期最长 14 天。访问客户数据前必须完成数据脱敏培训并签署保密承诺。所有访问行为会被记录，异常下载会触发安全告警。"
      },
      {
        id: "OPS-021",
        title: "生产事故响应手册",
        owner: "运维团队",
        updated: "2026-05-09",
        tags: ["incident", "ops"],
        text: "生产事故按影响范围分为 P0、P1、P2。P1 事故指核心流程不可用但有临时替代方案，值班工程师需要在 10 分钟内确认影响面，30 分钟内建立事故频道，并每 20 分钟同步一次进展。若 45 分钟内无法恢复，需要升级给研发负责人和业务负责人。事故结束后两个工作日内完成复盘。"
      },
      {
        id: "CRM-033",
        title: "客户拜访记录标准",
        owner: "销售运营",
        updated: "2026-01-18",
        tags: ["sales", "crm"],
        text: "客户拜访记录应包含客户名称、拜访目的、参会人员、关键诉求、下一步行动和预计完成时间。若拜访产生差旅或交通费用，记录编号需要填写在报销单的业务事由中。缺少拜访记录的费用，财务会要求补充材料后再审核。"
      },
      {
        id: "AI-009",
        title: "企业知识助手回答规范",
        owner: "AI 平台组",
        updated: "2026-06-01",
        tags: ["ai", "rag"],
        text: "知识助手必须优先基于检索到的上下文回答，并在关键结论后标注引用来源。若上下文没有覆盖用户问题，应明确说明无法从知识库确认。回答生成前需要去除重复片段，优先保留更新时间更近、权限等级更高或与问题更匹配的内容。系统需要记录查询、召回结果、提示词版本和人工反馈，用于持续评估。"
      }
    ];

    const stopwords = new Set([
      "的", "了", "和", "或", "与", "在", "时", "是", "为", "需要", "可以", "必须",
      "what", "the", "and", "or", "to", "of", "a", "in", "on"
    ]);

    const pipelineMeta = [
      ["数据接入", "加载原始文档、来源、更新时间、标签和权限信息。"],
      ["解析与清洗", "去除噪声、统一空白、保留元数据，形成可索引文本。"],
      ["文档切块", "按 chunk size 与 overlap 切分，保留 doc id 和位置。"],
      ["Embedding", "把 chunk 转成稀疏 TF-IDF 向量，用于透明演示。"],
      ["向量索引", "构建可查询的向量表，模拟 Vector DB。"],
      ["查询理解", "识别关键词、实体和意图，可选做查询改写。"],
      ["召回检索", "使用查询向量和 chunk 向量计算 cosine 相似度。"],
      ["重排序", "融合相似度、关键词覆盖、更新时间和业务规则提升结果质量。"],
      ["上下文压缩", "抽取最相关句子，控制 token 预算并减少噪声。"],
      ["提示词构造", "把系统规则、用户问题和上下文拼成 LLM 输入。"],
      ["回答生成", "基于上下文合成答案，并在关键结论后添加引用。"],
      ["后处理与评估", "计算引用覆盖、置信度、延迟和可观测日志。"]
    ];

    const state = {
      lastResult: null
    };

    const $ = (selector) => document.querySelector(selector);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeText(text) {
      return text
        .replace(/\s+/g, " ")
        .replace(/[，。；：！？、]/g, (match) => ({
          "，": "， ",
          "。": "。 ",
          "；": "； ",
          "：": "： ",
          "！": "！ ",
          "？": "？ ",
          "、": "、 "
        })[match])
        .trim();
    }

    function tokenize(text) {
      const lower = text.toLowerCase();
      const latin = lower.match(/[a-z0-9]+/g) || [];
      const chinese = lower.match(/[\u4e00-\u9fa5]{2,}/g) || [];
      const biGrams = [];
      chinese.forEach((segment) => {
        for (let i = 0; i < segment.length - 1; i += 1) {
          biGrams.push(segment.slice(i, i + 2));
        }
        for (let i = 0; i < segment.length - 3; i += 2) {
          biGrams.push(segment.slice(i, i + 4));
        }
      });
      return [...latin, ...biGrams].filter((token) => token.length > 1 && !stopwords.has(token));
    }

    function chunkDocument(doc, chunkSize, overlap) {
      const clean = normalizeText(doc.text);
      const chunks = [];
      const step = Math.max(20, chunkSize - overlap);
      let cursor = 0;
      let index = 1;

      while (cursor < clean.length) {
        const end = Math.min(clean.length, cursor + chunkSize);
        const text = clean.slice(cursor, end).trim();
        if (text) {
          chunks.push({
            id: `${doc.id}#${index}`,
            docId: doc.id,
            title: doc.title,
            owner: doc.owner,
            updated: doc.updated,
            tags: doc.tags,
            position: index,
            start: cursor,
            end,
            text
          });
        }
        if (end === clean.length) break;
        cursor += step;
        index += 1;
      }
      return chunks;
    }

    function buildEmbeddings(chunks) {
      const tokenized = chunks.map((chunk) => tokenize(`${chunk.title} ${chunk.tags.join(" ")} ${chunk.text}`));
      const docFreq = new Map();
      tokenized.forEach((tokens) => {
        new Set(tokens).forEach((token) => docFreq.set(token, (docFreq.get(token) || 0) + 1));
      });
      const total = chunks.length;
      const vectors = tokenized.map((tokens, idx) => {
        const counts = new Map();
        tokens.forEach((token) => counts.set(token, (counts.get(token) || 0) + 1));
        const vector = new Map();
        counts.forEach((count, token) => {
          const tf = count / tokens.length;
          const idf = Math.log((total + 1) / ((docFreq.get(token) || 0) + 1)) + 1;
          vector.set(token, tf * idf);
        });
        return {
          ...chunks[idx],
          tokens,
          vector,
          topTerms: [...vector.entries()]
            .sort((a, b) => b[1] - a[1])
            .slice(0, 8)
            .map(([token, weight]) => ({ token, weight }))
        };
      });
      return { vectors, vocabulary: [...docFreq.keys()].sort(), docFreq };
    }

    function embedQuery(query, docFreq, total) {
      const tokens = tokenize(query);
      const counts = new Map();
      tokens.forEach((token) => counts.set(token, (counts.get(token) || 0) + 1));
      const vector = new Map();
      counts.forEach((count, token) => {
        const tf = count / Math.max(1, tokens.length);
        const idf = Math.log((total + 1) / ((docFreq.get(token) || 0) + 1)) + 1;
        vector.set(token, tf * idf);
      });
      return { tokens, vector };
    }

    function norm(vector) {
      let sum = 0;
      vector.forEach((weight) => {
        sum += weight * weight;
      });
      return Math.sqrt(sum);
    }

    function cosine(a, b) {
      let dot = 0;
      a.forEach((weight, token) => {
        dot += weight * (b.get(token) || 0);
      });
      const denom = norm(a) * norm(b);
      return denom === 0 ? 0 : dot / denom;
    }

    function extractKeywords(query) {
      const tokens = tokenize(query);
      const readable = query.match(/[\u4e00-\u9fa5]{2,}|[A-Za-z0-9]+/g) || [];
      const merged = [...readable, ...tokens];
      return [...new Set(merged)]
        .filter((item) => item.length > 1 && !stopwords.has(item.toLowerCase()))
        .slice(0, 16);
    }

    function rewriteQuery(question) {
      const replacements = [
        [/打车/g, "打车 交通费用 报销 发票 行程截图 业务事由"],
        [/病假/g, "病假 HR 系统 医院证明 补充说明"],
        [/事故|P1/gi, "P1 生产事故 响应 升级 事故频道"],
        [/外包|权限|代码仓库|客户数据/g, "外包人员 访问 权限 安全审批 客户数据 核心代码仓库"],
        [/差旅|报销/g, "差旅 交通费用 报销 凭证 30 天"]
      ];
      let rewritten = question;
      replacements.forEach(([pattern, replacement]) => {
        if (pattern.test(question)) {
          rewritten += ` ${replacement}`;
        }
      });
      return normalizeText(rewritten);
    }

    function sentenceSplit(text) {
      return text.split(/(?<=[。！？；])/).map((item) => item.trim()).filter(Boolean);
    }

    function keywordCoverage(text, keywords) {
      if (!keywords.length) return 0;
      const lower = text.toLowerCase();
      const hits = keywords.filter((keyword) => lower.includes(keyword.toLowerCase()));
      return hits.length / keywords.length;
    }

    function recencyScore(date) {
      const newest = Math.max(...documents.map((doc) => Date.parse(doc.updated)));
      const oldest = Math.min(...documents.map((doc) => Date.parse(doc.updated)));
      const current = Date.parse(date);
      if (newest === oldest) return 1;
      return (current - oldest) / (newest - oldest);
    }

    function retrieve(vectors, queryVector, keywords, topK) {
      return vectors
        .map((chunk) => {
          const similarity = cosine(queryVector, chunk.vector);
          const coverage = keywordCoverage(`${chunk.title} ${chunk.text}`, keywords);
          return {
            ...chunk,
            similarity,
            coverage,
            initialScore: similarity
          };
        })
        .sort((a, b) => b.initialScore - a.initialScore)
        .slice(0, Math.max(topK + 3, 8));
    }

    function rerank(results, keywords, enabled) {
      return results
        .map((result) => {
          const recency = recencyScore(result.updated);
          const policyBoost = /HR|FIN|SEC|OPS|AI/.test(result.docId) ? 0.04 : 0;
          const rerankScore = enabled
            ? result.similarity * 0.62 + result.coverage * 0.28 + recency * 0.06 + policyBoost
            : result.initialScore;
          return {
            ...result,
            recency,
            policyBoost,
            rerankScore,
            matchedKeywords: keywords.filter((keyword) => `${result.title} ${result.text}`.toLowerCase().includes(keyword.toLowerCase()))
          };
        })
        .sort((a, b) => b.rerankScore - a.rerankScore);
    }

    function compressContext(results, keywords, enabled, limit) {
      return results.slice(0, limit).map((result) => {
        const sentences = sentenceSplit(result.text);
        const rankedSentences = sentences
          .map((sentence) => ({
            sentence,
            score: keywordCoverage(sentence, keywords) + (sentence.length > 22 ? 0.05 : 0)
          }))
          .sort((a, b) => b.score - a.score);
        const selected = enabled
          ? rankedSentences.slice(0, 2).map((item) => item.sentence).join("")
          : result.text;
        return {
          source: result,
          compressed: selected || result.text
        };
      });
    }

    function buildPrompt(question, rewritten, contexts) {
      const contextBlock = contexts.map((item, index) => {
        return `[S${index + 1}] ${item.source.docId} ${item.source.title} (${item.source.updated})\n${item.compressed}`;
      }).join("\n\n");

      return [
        "SYSTEM:",
        "你是企业知识助手。只基于 CONTEXT 回答；关键结论必须带 [Sx] 引用；没有依据时明确说明无法确认。",
        "",
        "USER QUESTION:",
        question,
        "",
        "REWRITTEN QUERY:",
        rewritten,
        "",
        "CONTEXT:",
        contextBlock
      ].join("\n");
    }

    function generateAnswer(question, contexts, keywords) {
      if (!contexts.length) {
        return {
          answer: "知识库中没有找到足够相关的上下文，因此无法确认该问题的答案。",
          claims: []
        };
      }

      const claimCandidates = [];
      contexts.forEach((item, index) => {
        sentenceSplit(item.compressed).forEach((sentence) => {
          claimCandidates.push({
            sentence,
            citation: `S${index + 1}`,
            source: item.source,
            score: keywordCoverage(sentence, keywords) + item.source.rerankScore
          });
        });
      });

      const selected = claimCandidates
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);

      const hasLeave = /病假|休假/.test(question);
      const hasExpense = /报销|打车|交通/.test(question);
      const hasIncident = /事故|P1|响应|升级/i.test(question);
      const hasSecurity = /外包|权限|代码|客户数据|安全/.test(question);

      let intro = "根据当前知识库：";
      if (hasLeave && hasExpense) {
        intro = "可以分开判断病假与打车报销两个条件：";
      } else if (hasIncident) {
        intro = "P1 生产事故需要按响应时限推进：";
      } else if (hasSecurity) {
        intro = "外包访问需要先满足审批、期限和审计要求：";
      }

      const answerParts = selected.map((claim) => {
        return `${claim.sentence}<span class="citation">${claim.citation}</span>`;
      });

      const missing = selected.length < 2
        ? " 当前上下文较少，建议补充更多制度文档后再做强结论。"
        : "";

      return {
        answer: `${intro}${answerParts.join(" ")}${missing}`,
        claims: selected
      };
    }

    function evaluateRun({ retrieved, reranked, contexts, claims, startedAt }) {
      const topScores = reranked.slice(0, contexts.length).map((item) => item.rerankScore);
      const avgScore = topScores.reduce((sum, value) => sum + value, 0) / Math.max(1, topScores.length);
      const citationCoverage = claims.length
        ? claims.filter((claim) => claim.citation).length / claims.length
        : 0;
      const contextPrecision = contexts.length
        ? contexts.filter((item) => item.source.coverage > 0).length / contexts.length
        : 0;
      const latency = Math.round(performance.now() - startedAt);
      const recallBreadth = new Set(retrieved.slice(0, 8).map((item) => item.docId)).size;
      return {
        confidence: Math.min(0.96, Math.max(0.12, avgScore * 1.7 + citationCoverage * 0.24)),
        citationCoverage,
        contextPrecision,
        recallBreadth,
        latency
      };
    }

    function runPipeline() {
      const startedAt = performance.now();
      const question = $("#question").value.trim();
      const chunkSize = Number($("#chunkSize").value);
      const overlap = Number($("#overlap").value);
      const topK = Number($("#topK").value);
      const useRewrite = $("#useRewrite").checked;
      const useRerank = $("#useRerank").checked;
      const useCompression = $("#useCompression").checked;

      const cleanedDocs = documents.map((doc) => ({
        ...doc,
        cleanText: normalizeText(doc.text)
      }));
      const chunks = cleanedDocs.flatMap((doc) => chunkDocument(doc, chunkSize, overlap));
      const { vectors, vocabulary, docFreq } = buildEmbeddings(chunks);
      const keywords = extractKeywords(question);
      const rewritten = useRewrite ? rewriteQuery(question) : question;
      const queryEmbedding = embedQuery(rewritten, docFreq, vectors.length);
      const retrieved = retrieve(vectors, queryEmbedding.vector, keywords, topK);
      const reranked = rerank(retrieved, keywords, useRerank);
      const selected = reranked.slice(0, topK);
      const contexts = compressContext(selected, keywords, useCompression, topK);
      const prompt = buildPrompt(question, rewritten, contexts);
      const generated = generateAnswer(question, contexts, keywords);
      const evals = evaluateRun({
        retrieved,
        reranked,
        contexts,
        claims: generated.claims,
        startedAt
      });

      state.lastResult = {
        question,
        chunkSize,
        overlap,
        topK,
        useRewrite,
        useRerank,
        useCompression,
        cleanedDocs,
        chunks,
        vectors,
        vocabulary,
        keywords,
        rewritten,
        queryEmbedding,
        retrieved,
        reranked,
        selected,
        contexts,
        prompt,
        generated,
        evals
      };

      renderResults(state.lastResult);
    }

    function formatPercent(value) {
      return `${Math.round(value * 100)}%`;
    }

    function highlightKeywords(text, keywords) {
      let safe = escapeHtml(text);
      keywords
        .filter((keyword) => keyword.length >= 2)
        .sort((a, b) => b.length - a.length)
        .slice(0, 10)
        .forEach((keyword) => {
          const escaped = escapeHtml(keyword).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          safe = safe.replace(new RegExp(escaped, "gi"), (match) => `<mark>${match}</mark>`);
        });
      return safe;
    }

    function table(headers, rows) {
      return `
        <div class="artifact">
          <table>
            <thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>
            <tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>`).join("")}</tbody>
          </table>
        </div>
      `;
    }

    function artifact(title, content, isPre = false) {
      return `
        <div class="artifact">
          <h3 class="artifact-title">${escapeHtml(title)}</h3>
          ${isPre ? `<pre>${escapeHtml(content)}</pre>` : content}
        </div>
      `;
    }

    function scorebar(value) {
      const width = Math.max(2, Math.round(value * 100));
      return `<div class="scorebar" aria-hidden="true"><span style="width:${width}%"></span></div>`;
    }

    function renderMetrics(evals) {
      const items = [
        ["置信度", formatPercent(evals.confidence), "由重排分、上下文覆盖和引用覆盖估算"],
        ["引用覆盖", formatPercent(evals.citationCoverage), "回答中的关键句是否带来源"],
        ["上下文精度", formatPercent(evals.contextPrecision), "进入提示词的片段是否命中问题关键词"],
        ["延迟", `${evals.latency}ms`, "浏览器本地模拟端到端耗时"]
      ];
      $("#metrics").innerHTML = items.map(([label, value, desc]) => `
        <div class="metric">
          <div class="metric-value">${escapeHtml(value)}</div>
          <div class="metric-label"><strong>${escapeHtml(label)}</strong><br>${escapeHtml(desc)}</div>
        </div>
      `).join("");
    }

    function renderResults(result) {
      $("#answerText").innerHTML = result.generated.answer;
      $("#confidence").textContent = `confidence: ${formatPercent(result.evals.confidence)}`;
      $("#runStatus").textContent = `Last run: ${new Date().toLocaleTimeString("zh-CN", { hour12: false })}`;
      renderMetrics(result.evals);

      const stages = [
        {
          badge: `${documents.length} docs`,
          content: artifact("原始文档样例", documents.map((doc) => `${doc.id} | ${doc.title} | ${doc.owner} | ${doc.updated} | ${doc.tags.join(", ")}`).join("\n"), true)
        },
        {
          badge: "clean text",
          content: table(
            ["Doc", "清洗后文本"],
            result.cleanedDocs.map((doc) => [
              `<code>${escapeHtml(doc.id)}</code>`,
              highlightKeywords(doc.cleanText, result.keywords)
            ])
          )
        },
        {
          badge: `${result.chunks.length} chunks`,
          content: table(
            ["Chunk", "来源", "字符范围", "内容"],
            result.chunks.slice(0, 12).map((chunk) => [
              `<code>${escapeHtml(chunk.id)}</code>`,
              escapeHtml(chunk.title),
              `<code>${chunk.start}-${chunk.end}</code>`,
              highlightKeywords(chunk.text, result.keywords)
            ])
          ) + artifact("切块参数", `chunkSize=${result.chunkSize}, overlap=${result.overlap}\n超过 12 个 chunk 时表格只展示前 12 个。`, true)
        },
        {
          badge: `${result.vocabulary.length} terms`,
          content: table(
            ["Chunk", "Top terms", "向量说明"],
            result.vectors.slice(0, 10).map((vector) => [
              `<code>${escapeHtml(vector.id)}</code>`,
              vector.topTerms.map((item) => `<span class="inline-code">${escapeHtml(item.token)}:${item.weight.toFixed(3)}</span>`).join(" "),
              "TF-IDF sparse vector"
            ])
          )
        },
        {
          badge: "vector db",
          content: artifact(
            "索引结构",
            JSON.stringify({
              collection: "enterprise_knowledge_demo",
              vectorType: "sparse_tfidf_for_demo",
              dimensions: result.vocabulary.length,
              rows: result.vectors.length,
              metadata: ["docId", "title", "owner", "updated", "tags", "position"]
            }, null, 2),
            true
          )
        },
        {
          badge: result.useRewrite ? "rewrite on" : "rewrite off",
          content: artifact("查询理解结果", JSON.stringify({
            originalQuestion: result.question,
            rewrittenQuery: result.rewritten,
            keywords: result.keywords,
            queryVectorTopTerms: [...result.queryEmbedding.vector.entries()]
              .sort((a, b) => b[1] - a[1])
              .slice(0, 12)
              .map(([token, weight]) => ({ token, weight: Number(weight.toFixed(4)) }))
          }, null, 2), true)
        },
        {
          badge: `${result.retrieved.length} recalled`,
          content: table(
            ["Rank", "Chunk", "Cosine", "Keyword Coverage", "Snippet"],
            result.retrieved.slice(0, 8).map((item, index) => [
              `<code>${index + 1}</code>`,
              `<code>${escapeHtml(item.id)}</code><br>${escapeHtml(item.title)}`,
              `${item.similarity.toFixed(4)}${scorebar(item.similarity)}`,
              `${formatPercent(item.coverage)}${scorebar(item.coverage)}`,
              highlightKeywords(item.text, result.keywords)
            ])
          )
        },
        {
          badge: result.useRerank ? "rerank on" : "rerank off",
          content: table(
            ["Rank", "Chunk", "Final Score", "Signals", "Matched Keywords"],
            result.reranked.slice(0, 8).map((item, index) => [
              `<code>${index + 1}</code>`,
              `<code>${escapeHtml(item.id)}</code><br>${escapeHtml(item.title)}`,
              `${item.rerankScore.toFixed(4)}${scorebar(item.rerankScore)}`,
              `cos=${item.similarity.toFixed(3)}<br>coverage=${formatPercent(item.coverage)}<br>recency=${item.recency.toFixed(2)}`,
              item.matchedKeywords.map((keyword) => `<span class="tag">${escapeHtml(keyword)}</span>`).join(" ") || `<span class="tag">none</span>`
            ])
          )
        },
        {
          badge: result.useCompression ? "compressed" : "raw chunks",
          content: table(
            ["Source", "压缩后上下文"],
            result.contexts.map((item, index) => [
              `<code>S${index + 1}</code> <code>${escapeHtml(item.source.id)}</code><br>${escapeHtml(item.source.title)}`,
              highlightKeywords(item.compressed, result.keywords)
            ])
          )
        },
        {
          badge: "prompt",
          content: artifact("LLM 输入 Prompt", result.prompt, true)
        },
        {
          badge: `${result.generated.claims.length} claims`,
          content: artifact("生成器输出", result.generated.answer) + table(
            ["Claim", "Citation", "Source"],
            result.generated.claims.map((claim) => [
              highlightKeywords(claim.sentence, result.keywords),
              `<code>${escapeHtml(claim.citation)}</code>`,
              `<code>${escapeHtml(claim.source.id)}</code> ${escapeHtml(claim.source.title)}`
            ])
          )
        },
        {
          badge: "eval logs",
          content: artifact("评估与可观测事件", JSON.stringify({
            metrics: {
              confidence: Number(result.evals.confidence.toFixed(3)),
              citationCoverage: Number(result.evals.citationCoverage.toFixed(3)),
              contextPrecision: Number(result.evals.contextPrecision.toFixed(3)),
              recallBreadth: result.evals.recallBreadth,
              latencyMs: result.evals.latency
            },
            trace: [
              "query_received",
              "documents_loaded",
              "chunks_created",
              "embeddings_built",
              "vector_search_done",
              result.useRerank ? "rerank_done" : "rerank_skipped",
              result.useCompression ? "context_compressed" : "context_raw",
              "prompt_built",
              "answer_generated",
              "eval_recorded"
            ],
            nextProductionConcerns: [
              "权限过滤 ACL",
              "增量索引与版本管理",
              "真实 embedding 模型和向量数据库",
              "答案事实性评估与人工反馈闭环",
              "缓存、限流、成本监控"
            ]
          }, null, 2), true)
        }
      ];

      $("#stages").innerHTML = stages.map((stage, index) => {
        const [title, desc] = pipelineMeta[index];
        const open = index < 4 ? "open" : "";
        return `
          <details class="stage" ${open}>
            <summary>
              <span class="step-index">${String(index + 1).padStart(2, "0")}</span>
              <span class="stage-title">
                <strong>${escapeHtml(title)}</strong>
                <span>${escapeHtml(desc)}</span>
              </span>
              <span class="stage-badge">${escapeHtml(stage.badge)}</span>
            </summary>
            <div class="stage-content">${stage.content}</div>
          </details>
        `;
      }).join("");
    }

    function renderDocs() {
      $("#docList").innerHTML = documents.map((doc) => `
        <article class="doc-item">
          <strong>${escapeHtml(doc.id)} · ${escapeHtml(doc.title)}</strong>
          <div class="doc-meta">
            <span class="tag">${escapeHtml(doc.owner)}</span>
            <span class="tag">${escapeHtml(doc.updated)}</span>
            ${doc.tags.map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
          </div>
        </article>
      `).join("");
    }

    function bindEvents() {
      ["chunkSize", "overlap", "topK"].forEach((id) => {
        const input = $(`#${id}`);
        const output = $(`#${id}Value`);
        input.addEventListener("input", () => {
          output.textContent = input.value;
        });
      });

      document.querySelectorAll(".scenario").forEach((button) => {
        button.addEventListener("click", () => {
          $("#question").value = button.dataset.question;
          runPipeline();
        });
      });

      $("#runButton").addEventListener("click", runPipeline);
      $("#expandAll").addEventListener("click", () => {
        document.querySelectorAll("details.stage").forEach((detail) => detail.open = true);
      });
      $("#collapseAll").addEventListener("click", () => {
        document.querySelectorAll("details.stage").forEach((detail) => detail.open = false);
      });
    }

    renderDocs();
    bindEvents();
    runPipeline();
  </script>
</body>
</html>
