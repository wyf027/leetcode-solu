<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Boulder Dash</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
      <section class="w-full max-w-xl rounded-lg border border-stone-700 bg-stone-900 p-4 shadow-2xl">
        <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Boulder Dash</h1>
            <p class="mt-1 text-sm text-stone-400">收集全部宝石后进入出口，石块可以推开。</p>
          </div>
          <button
            id="resetButton"
            class="rounded bg-emerald-500 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-emerald-400"
            type="button"
          >
            重新开始
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-stone-700 bg-stone-800 p-2">
            <div class="text-stone-400">宝石</div>
            <div id="gemStatus" class="font-semibold">0 / 0</div>
          </div>
          <div class="rounded border border-stone-700 bg-stone-800 p-2">
            <div class="text-stone-400">步数</div>
            <div id="moveStatus" class="font-semibold">0</div>
          </div>
          <div class="rounded border border-stone-700 bg-stone-800 p-2">
            <div class="text-stone-400">分数</div>
            <div id="scoreStatus" class="font-semibold">0</div>
          </div>
        </div>

        <canvas
          id="gameCanvas"
          class="mt-4 block w-full rounded border border-stone-700 bg-stone-950"
          width="400"
          height="400"
        ></canvas>

        <div id="message" class="mt-3 min-h-6 text-center text-sm font-semibold text-emerald-300"></div>

        <div class="mt-4 grid grid-cols-3 gap-2">
          <span></span>
          <button class="moveButton rounded bg-stone-700 py-2 hover:bg-stone-600" data-dir="up" type="button">上</button>
          <span></span>
          <button class="moveButton rounded bg-stone-700 py-2 hover:bg-stone-600" data-dir="left" type="button">左</button>
          <button class="moveButton rounded bg-stone-700 py-2 hover:bg-stone-600" data-dir="down" type="button">下</button>
          <button class="moveButton rounded bg-stone-700 py-2 hover:bg-stone-600" data-dir="right" type="button">右</button>
        </div>
      </section>
    </main>

    <script>
      const levelMap = [
        "##########",
        "#P..G...E#",
        "#.##.R##.#",
        "#..G..R..#",
        "#.R.##...#",
        "#...G..#.#",
        "###..R...#",
        "#..##.G..#",
        "#....R...#",
        "##########",
      ];

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const gemStatus = document.getElementById("gemStatus");
      const moveStatus = document.getElementById("moveStatus");
      const scoreStatus = document.getElementById("scoreStatus");
      const message = document.getElementById("message");
      const resetButton = document.getElementById("resetButton");
      const tileSize = canvas.width / 10;

      let grid;
      let player;
      let totalGems;
      let collectedGems;
      let moves;
      let score;
      let gameWon;

      function resetGame() {
        grid = levelMap.map((row) => row.split(""));
        totalGems = 0;
        collectedGems = 0;
        moves = 0;
        score = 0;
        gameWon = false;
        message.textContent = "方向键或 WASD 移动。";

        for (let y = 0; y < grid.length; y += 1) {
          for (let x = 0; x < grid[y].length; x += 1) {
            if (grid[y][x] === "P") {
              player = { x, y };
              grid[y][x] = " ";
            }
            if (grid[y][x] === "G") {
              totalGems += 1;
            }
          }
        }

        renderBoard();
        updateStatus();
      }

      function renderBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < grid.length; y += 1) {
          for (let x = 0; x < grid[y].length; x += 1) {
            drawTile(grid[y][x], x, y);
          }
        }

        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        ctx.arc(player.x * tileSize + tileSize / 2, player.y * tileSize + tileSize / 2, tileSize * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111827";
        ctx.fillRect(player.x * tileSize + 14, player.y * tileSize + 14, 4, 4);
        ctx.fillRect(player.x * tileSize + 22, player.y * tileSize + 14, 4, 4);
      }

      function drawTile(tile, x, y) {
        const left = x * tileSize;
        const top = y * tileSize;
        ctx.fillStyle = "#0c0a09";
        ctx.fillRect(left, top, tileSize, tileSize);

        if (tile === "#") {
          ctx.fillStyle = "#44403c";
          ctx.fillRect(left + 2, top + 2, tileSize - 4, tileSize - 4);
        } else if (tile === ".") {
          ctx.fillStyle = "#7c2d12";
          ctx.fillRect(left + 5, top + 5, tileSize - 10, tileSize - 10);
        } else if (tile === "G") {
          ctx.fillStyle = "#22d3ee";
          ctx.beginPath();
          ctx.moveTo(left + tileSize / 2, top + 7);
          ctx.lineTo(left + tileSize - 8, top + tileSize / 2);
          ctx.lineTo(left + tileSize / 2, top + tileSize - 7);
          ctx.lineTo(left + 8, top + tileSize / 2);
          ctx.closePath();
          ctx.fill();
        } else if (tile === "R") {
          ctx.fillStyle = "#78716c";
          ctx.beginPath();
          ctx.arc(left + tileSize / 2, top + tileSize / 2, tileSize * 0.33, 0, Math.PI * 2);
          ctx.fill();
        } else if (tile === "E") {
          ctx.fillStyle = collectedGems === totalGems ? "#10b981" : "#57534e";
          ctx.fillRect(left + 8, top + 5, tileSize - 16, tileSize - 10);
        }

        ctx.strokeStyle = "#1c1917";
        ctx.strokeRect(left, top, tileSize, tileSize);
      }

      function movePlayer(dx, dy) {
        if (gameWon) {
          return;
        }

        const nextX = player.x + dx;
        const nextY = player.y + dy;
        const target = grid[nextY][nextX];

        if (target === "R" && !pushRock(nextX, nextY, dx, dy)) {
          message.textContent = "石块后面没有空间。";
          return;
        }

        if (!canMoveTo(grid[nextY][nextX])) {
          message.textContent = grid[nextY][nextX] === "E" ? "先收集所有宝石。" : "这里过不去。";
          return;
        }

        player = { x: nextX, y: nextY };
        moves += 1;
        collectGem(nextX, nextY);
        checkWin();
        renderBoard();
        updateStatus();
      }

      function canMoveTo(tile) {
        if (tile === "#" || tile === "R") {
          return false;
        }
        if (tile === "E" && collectedGems < totalGems) {
          return false;
        }
        return true;
      }

      function collectGem(x, y) {
        if (grid[y][x] !== "G") {
          return;
        }

        grid[y][x] = " ";
        collectedGems += 1;
        score += 100;
        message.textContent = collectedGems === totalGems ? "出口已开启。" : "拿到宝石。";
      }

      function checkWin() {
        if (grid[player.y][player.x] !== "E" || collectedGems < totalGems) {
          return;
        }

        gameWon = true;
        score += Math.max(0, 300 - moves * 5);
        message.textContent = "完成！";
      }

      function pushRock(x, y, dx, dy) {
        const pushX = x + dx;
        const pushY = y + dy;
        const destination = grid[pushY][pushX];

        if (destination !== " ") {
          return false;
        }

        grid[pushY][pushX] = "R";
        grid[y][x] = " ";
        return true;
      }

      function updateStatus() {
        gemStatus.textContent = `${collectedGems} / ${totalGems}`;
        moveStatus.textContent = String(moves);
        scoreStatus.textContent = String(score);
      }

      const directions = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0],
      };

      document.addEventListener("keydown", (event) => {
        const direction = directions[event.key];
        if (!direction) {
          return;
        }
        event.preventDefault();
        movePlayer(direction[0], direction[1]);
      });

      document.querySelectorAll(".moveButton").forEach((button) => {
        button.addEventListener("click", () => {
          const map = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          };
          const direction = map[button.dataset.dir];
          movePlayer(direction[0], direction[1]);
        });
      });

      resetButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
