<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Bulls and Cows</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-neutral-950 text-neutral-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Bulls and Cows</h1><p class="text-sm text-neutral-300">Guess the hidden 4-digit code. Bulls are exact matches; cows are right digits in other spots.</p></div><button id="newGameBtn" class="rounded bg-emerald-300 px-4 py-2 font-semibold text-neutral-950 hover:bg-emerald-200">New Game</button></header><section class="grid gap-3 rounded border border-neutral-700 bg-neutral-900 p-3 sm:grid-cols-3"><div>Attempts: <b id="attemptCount">0</b></div><div>Best hint: <b id="bestHint">0 bulls</b></div><div id="message">Enter 4 unique digits.</div></section><form id="guessForm" class="flex flex-wrap gap-3 rounded border border-neutral-700 bg-neutral-900 p-4"><input id="guessInput" class="min-w-0 flex-1 rounded bg-white px-4 py-2 text-2xl font-bold tracking-widest text-neutral-950" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="0123"><button class="rounded bg-sky-300 px-5 py-2 font-semibold text-neutral-950 hover:bg-sky-200">Guess</button></form><section id="history" class="grid gap-2"></section></main><script>
let secret,attempts,over,best;const el=id=>document.getElementById(id),guessForm=el('guessForm'),guessInput=el('guessInput'),historyEl=el('history'),attemptCount=el('attemptCount'),bestHint=el('bestHint'),message=el('message'),newGameBtn=el('newGameBtn');function makeSecret(){const d='0123456789'.split('');let s='';while(s.length<4){const i=Math.floor(Math.random()*d.length);s+=d.splice(i,1)[0]}return s}function validGuess(g){return /^\d{4}$/.test(g)&&new Set(g).size===4}function scoreGuess(g){let bulls=0,cows=0;for(let i=0;i<4;i++){if(g[i]===secret[i])bulls++;else if(secret.includes(g[i]))cows++}return{bulls,cows}}function addHistory(g,s){const row=document.createElement('div');row.className='flex items-center justify-between rounded border border-neutral-700 bg-neutral-900 p-3';row.innerHTML=`<span class="font-mono text-xl tracking-widest">${g}</span><span>${s.bulls} bulls, ${s.cows} cows</span>`;historyEl.prepend(row)}function submitGuess(e){e.preventDefault();if(over)return;const g=guessInput.value.trim();if(!validGuess(g)){message.textContent='Use exactly 4 different digits.';return}const s=scoreGuess(g);attempts++;best=Math.max(best,s.bulls);addHistory(g,s);attemptCount.textContent=attempts;bestHint.textContent=`${best} bulls`;guessInput.value='';if(s.bulls===4){over=true;message.textContent=`Solved in ${attempts} attempts.`;guessInput.disabled=true}else message.textContent=s.bulls?`Close: ${s.bulls} exact.`:'No exact matches yet.'}function newGame(){secret=makeSecret();attempts=0;best=0;over=false;historyEl.innerHTML='';attemptCount.textContent='0';bestHint.textContent='0 bulls';message.textContent='Enter 4 unique digits.';guessInput.disabled=false;guessInput.value='';guessInput.focus()}guessForm.addEventListener('submit',submitGuess);newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
