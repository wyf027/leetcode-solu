<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Breakthrough</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-normal text-white">Mini Breakthrough</h1>
        <p class="mt-1 text-sm text-slate-300">向前推进，斜向吃子，先抵达对方底线的一方获胜。</p>
      </div>
      <button id="resetBtn" class="rounded-md bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400">
        重新开始
      </button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <div class="rounded-lg border border-slate-700 bg-slate-900 p-3 shadow-xl">
        <div id="board" class="grid aspect-square w-full grid-cols-6 overflow-hidden rounded-md border border-slate-700"></div>
      </div>

      <aside class="rounded-lg border border-slate-700 bg-slate-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs uppercase text-slate-400">当前回合</p>
            <p id="turnText" class="mt-1 text-2xl font-bold text-white">白方</p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded-md bg-slate-800 p-3">
              <p class="text-slate-400">白方</p>
              <p id="whiteCount" class="text-xl font-semibold text-white">12</p>
            </div>
            <div class="rounded-md bg-slate-800 p-3">
              <p class="text-slate-400">黑方</p>
              <p id="blackCount" class="text-xl font-semibold text-white">12</p>
            </div>
          </div>
          <p id="statusText" class="rounded-md bg-slate-800 p-3 text-sm leading-6 text-slate-200">
            白方先手。选择自己的棋子，再点亮色目标格移动。
          </p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const statusText = document.getElementById("statusText");
    const whiteCount = document.getElementById("whiteCount");
    const blackCount = document.getElementById("blackCount");
    const resetBtn = document.getElementById("resetBtn");

    let board = [];
    let turn = "W";
    let selected = null;
    let winner = null;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(""));
      for (let col = 0; col < size; col++) {
        board[0][col] = "B";
        board[1][col] = "B";
        board[size - 2][col] = "W";
        board[size - 1][col] = "W";
      }
      turn = "W";
      selected = null;
      winner = null;
      render();
    }

    function pieceName(piece) {
      return piece === "W" ? "白方" : "黑方";
    }

    function legalMoves(row, col) {
      const piece = board[row][col];
      if (!piece || winner) return [];
      const direction = piece === "W" ? -1 : 1;
      const nextRow = row + direction;
      const moves = [];
      if (nextRow < 0 || nextRow >= size) return moves;
      if (!board[nextRow][col]) moves.push([nextRow, col]);
      for (const nextCol of [col - 1, col + 1]) {
        if (nextCol >= 0 && nextCol < size && board[nextRow][nextCol] && board[nextRow][nextCol] !== piece) {
          moves.push([nextRow, nextCol]);
        }
      }
      return moves;
    }

    function checkWinner() {
      const whitePieces = board.flat().filter((cell) => cell === "W").length;
      const blackPieces = board.flat().filter((cell) => cell === "B").length;
      if (whitePieces === 0) return "B";
      if (blackPieces === 0) return "W";
      if (board[0].includes("W")) return "W";
      if (board[size - 1].includes("B")) return "B";
      return null;
    }

    function movePiece(row, col) {
      const piece = board[selected.row][selected.col];
      board[row][col] = piece;
      board[selected.row][selected.col] = "";
      winner = checkWinner();
      if (!winner) turn = turn === "W" ? "B" : "W";
      selected = null;
      render();
    }

    function handleCell(row, col) {
      if (winner) return;
      const cell = board[row][col];
      if (selected) {
        const moves = legalMoves(selected.row, selected.col);
        if (moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col)) {
          movePiece(row, col);
          return;
        }
      }
      if (cell === turn) {
        selected = { row, col };
      } else {
        selected = null;
      }
      render();
    }

    function render() {
      const moves = selected ? legalMoves(selected.row, selected.col) : [];
      boardEl.innerHTML = "";
      board.forEach((line, row) => {
        line.forEach((cell, col) => {
          const button = document.createElement("button");
          const dark = (row + col) % 2 === 1;
          const isSelected = selected && selected.row === row && selected.col === col;
          const isMove = moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col);
          button.className = [
            "flex aspect-square items-center justify-center border border-slate-800 text-2xl font-black transition",
            dark ? "bg-slate-700" : "bg-slate-500",
            isSelected ? "ring-4 ring-emerald-300 ring-inset" : "",
            isMove ? "bg-emerald-500 hover:bg-emerald-400" : "hover:brightness-110"
          ].join(" ");
          button.setAttribute("aria-label", `${row + 1}-${col + 1}`);
          button.addEventListener("click", () => handleCell(row, col));
          if (cell) {
            const disk = document.createElement("span");
            disk.className = [
              "flex h-3/5 w-3/5 items-center justify-center rounded-full border-2 shadow-lg",
              cell === "W" ? "border-white bg-slate-100 text-slate-950" : "border-slate-400 bg-slate-950 text-white"
            ].join(" ");
            disk.textContent = cell === "W" ? "W" : "B";
            button.appendChild(disk);
          }
          boardEl.appendChild(button);
        });
      });

      const whitePieces = board.flat().filter((cell) => cell === "W").length;
      const blackPieces = board.flat().filter((cell) => cell === "B").length;
      whiteCount.textContent = whitePieces;
      blackCount.textContent = blackPieces;
      turnText.textContent = winner ? `${pieceName(winner)}获胜` : pieceName(turn);
      statusText.textContent = winner
        ? `${pieceName(winner)}完成突破。点击重新开始再来一局。`
        : selected
          ? `${pieceName(turn)}已选中棋子，可移动到 ${moves.length} 个目标格。`
          : `${pieceName(turn)}行动。选择自己的棋子，再点击合法目标格。`;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
