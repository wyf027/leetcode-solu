<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Word Scramble</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-fuchsia-950 text-fuchsia-50">
  <main class="mx-auto flex min-h-screen max-w-2xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Word Scramble</h1>
        <p class="text-sm text-fuchsia-200">Unscramble each classic game word before your skips run out.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-fuchsia-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-fuchsia-700 bg-fuchsia-900 p-3 sm:grid-cols-4">
      <div>Score: <b id="scoreText">0</b></div>
      <div>Round: <b id="roundText">1</b></div>
      <div>Skips: <b id="skipText">3</b></div>
      <div id="message">Type the word.</div>
    </section>

    <section class="rounded border border-fuchsia-700 bg-fuchsia-900 p-5 text-center">
      <div class="text-sm uppercase tracking-wide text-fuchsia-200">Scrambled word</div>
      <div id="scrambleText" class="my-4 break-all text-5xl font-black text-amber-200"></div>
      <input id="answerInput" class="w-full rounded border border-fuchsia-700 bg-white px-4 py-3 text-center text-xl font-semibold text-fuchsia-950 outline-none focus:ring-2 focus:ring-amber-300" autocomplete="off" placeholder="answer">
    </section>

    <section class="flex flex-wrap gap-3">
      <button id="checkBtn" class="rounded bg-lime-300 px-5 py-3 font-semibold text-fuchsia-950 hover:bg-lime-200">Check</button>
      <button id="skipBtn" class="rounded bg-sky-300 px-5 py-3 font-semibold text-fuchsia-950 hover:bg-sky-200">Skip</button>
      <button id="hintBtn" class="rounded bg-rose-300 px-5 py-3 font-semibold text-fuchsia-950 hover:bg-rose-200">Hint</button>
    </section>
  </main>

  <script>
    const words = ["arcade", "puzzle", "tokens", "marbles", "shuffle", "target", "player", "ladder", "castle", "rocket", "memory", "bridge"];
    const el = (id) => document.getElementById(id);
    const scoreText = el("scoreText");
    const roundText = el("roundText");
    const skipText = el("skipText");
    const message = el("message");
    const scrambleText = el("scrambleText");
    const answerInput = el("answerInput");
    const checkBtn = el("checkBtn");
    const skipBtn = el("skipBtn");
    const hintBtn = el("hintBtn");
    const newGameBtn = el("newGameBtn");

    let deck;
    let currentWord;
    let scrambled;
    let score;
    let round;
    let skips;
    let finished;

    function shuffleLetters(word) {
      const letters = word.split("");
      for (let i = letters.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [letters[i], letters[j]] = [letters[j], letters[i]];
      }
      const result = letters.join("");
      return result === word ? shuffleLetters(word) : result;
    }

    function drawWord() {
      if (!deck.length) deck = [...words].sort(() => Math.random() - 0.5);
      currentWord = deck.pop();
      scrambled = shuffleLetters(currentWord);
      answerInput.value = "";
      message.textContent = "Type the word.";
      render();
      answerInput.focus();
    }

    function checkAnswer() {
      if (finished) return;
      const answer = answerInput.value.trim().toLowerCase();
      if (answer !== currentWord) {
        message.textContent = "Not quite. Try again.";
        return;
      }
      score += Math.max(1, currentWord.length - answerInput.value.length + currentWord.length);
      round += 1;
      message.textContent = "Correct.";
      if (round > 10) endGame("You solved ten words.");
      else drawWord();
    }

    function skipWord() {
      if (finished) return;
      if (skips === 0) {
        endGame(`No skips left. The word was ${currentWord}.`);
        return;
      }
      skips -= 1;
      round += 1;
      if (round > 10) endGame("Game over.");
      else drawWord();
    }

    function showHint() {
      if (finished) return;
      message.textContent = `Hint: starts with ${currentWord[0].toUpperCase()}, ${currentWord.length} letters.`;
    }

    function endGame(text) {
      finished = true;
      message.textContent = `${text} Final score: ${score}.`;
      render();
    }

    function render() {
      scoreText.textContent = score;
      roundText.textContent = Math.min(round, 10);
      skipText.textContent = skips;
      scrambleText.textContent = scrambled || "-";
      checkBtn.disabled = finished;
      skipBtn.disabled = finished;
      hintBtn.disabled = finished;
    }

    function newGame() {
      deck = [...words].sort(() => Math.random() - 0.5);
      score = 0;
      round = 1;
      skips = 3;
      finished = false;
      drawWord();
    }

    checkBtn.addEventListener("click", checkAnswer);
    skipBtn.addEventListener("click", skipWord);
    hintBtn.addEventListener("click", showHint);
    newGameBtn.addEventListener("click", newGame);
    answerInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") checkAnswer();
    });
    newGame();
  </script>
</body>
</html>
