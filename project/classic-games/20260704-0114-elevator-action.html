<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Elevator Action</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <section class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-normal text-red-200">Mini Elevator Action</h1>
        <p class="text-sm text-zinc-300">Ride the elevator, collect secret files, and reach the exit while guards close in.</p>
      </div>
      <div class="flex flex-wrap gap-2 text-sm">
        <div class="rounded bg-zinc-800 px-3 py-2">Score <span id="score" class="font-semibold text-red-200">0</span></div>
        <div class="rounded bg-zinc-800 px-3 py-2">Files <span id="files" class="font-semibold text-amber-200">0</span></div>
        <div class="rounded bg-zinc-800 px-3 py-2">Lives <span id="lives" class="font-semibold text-emerald-200">3</span></div>
      </div>
    </section>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
        <canvas id="game" width="704" height="528" class="aspect-[4/3] w-full rounded bg-zinc-950"></canvas>
      </div>
      <aside class="rounded border border-zinc-700 bg-zinc-900 p-4 text-sm text-zinc-300">
        <div class="mb-4">
          <h2 class="mb-2 font-semibold text-white">Controls</h2>
          <p>Arrow keys or WASD move.</p>
          <p>Space fires a short shot.</p>
          <p>Enter restarts after game over.</p>
        </div>
        <button id="restart" class="w-full rounded bg-red-300 px-4 py-2 font-semibold text-zinc-950 hover:bg-red-200">Restart</button>
        <div id="status" class="mt-4 rounded bg-zinc-950 p-3 text-zinc-200">Collect 6 files, then reach the red exit at the bottom.</div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const filesEl = document.getElementById("files");
    const livesEl = document.getElementById("lives");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");

    const width = canvas.width;
    const height = canvas.height;
    const floorYs = [72, 138, 204, 270, 336, 402, 468];
    const shaftX = 334;
    const keys = new Set();
    let player;
    let elevator;
    let guards;
    let files;
    let bullets;
    let score;
    let collected;
    let lives;
    let running;
    let won;
    let tick;
    let lastTime;

    function floorForY(y) {
      let best = 0;
      let bestDist = Infinity;
      floorYs.forEach((floorY, index) => {
        const dist = Math.abs(y - floorY);
        if (dist < bestDist) {
          best = index;
          bestDist = dist;
        }
      });
      return best;
    }

    function resetGame() {
      player = { x: 82, y: floorYs[0] - 34, w: 22, h: 32, vx: 0, face: 1, floor: 0, cooldown: 0 };
      elevator = { x: shaftX, y: floorYs[0] - 42, w: 44, h: 48, target: 0, moving: 0 };
      guards = [
        { x: 560, y: floorYs[1] - 34, w: 24, h: 32, floor: 1, vx: -1.2, wait: 20 },
        { x: 110, y: floorYs[3] - 34, w: 24, h: 32, floor: 3, vx: 1.2, wait: 80 },
        { x: 590, y: floorYs[5] - 34, w: 24, h: 32, floor: 5, vx: -1.25, wait: 120 }
      ];
      files = [0, 1, 2, 3, 4, 5].map((floor, index) => ({
        x: index % 2 === 0 ? 180 : 486,
        y: floorYs[floor] - 28,
        w: 18,
        h: 22,
        floor,
        taken: false
      }));
      bullets = [];
      score = 0;
      collected = 0;
      lives = 3;
      running = true;
      won = false;
      tick = 0;
      lastTime = 0;
      statusEl.textContent = "Collect 6 files, then reach the red exit at the bottom.";
      updateHud();
      renderElevatorAction();
    }

    function updateHud() {
      scoreEl.textContent = score;
      filesEl.textContent = collected;
      livesEl.textContent = lives;
    }

    function overlaps(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function nearElevator(actor) {
      return actor.x + actor.w > elevator.x && actor.x < elevator.x + elevator.w && Math.abs(actor.y + actor.h - (elevator.y + elevator.h)) < 18;
    }

    function setFloor(actor, floor) {
      actor.floor = Math.max(0, Math.min(floorYs.length - 1, floor));
      actor.y = floorYs[actor.floor] - actor.h - 2;
    }

    function moveElevator() {
      if (elevator.target > floorForY(elevator.y + elevator.h)) elevator.moving = 1;
      else if (elevator.target < floorForY(elevator.y + elevator.h)) elevator.moving = -1;
      else elevator.moving = 0;

      elevator.y += elevator.moving * 2;
      const targetY = floorYs[elevator.target] - elevator.h + 6;
      if (Math.abs(elevator.y - targetY) <= 2) {
        elevator.y = targetY;
        elevator.moving = 0;
      }
    }

    function updatePlayer() {
      player.vx = 0;
      if (player.cooldown > 0) player.cooldown--;
      const left = keys.has("ArrowLeft") || keys.has("a");
      const right = keys.has("ArrowRight") || keys.has("d");
      const up = keys.has("ArrowUp") || keys.has("w");
      const down = keys.has("ArrowDown") || keys.has("s");

      if (left) {
        player.vx = -3.1;
        player.face = -1;
      }
      if (right) {
        player.vx = 3.1;
        player.face = 1;
      }

      if (nearElevator(player)) {
        if (up) elevator.target = Math.max(0, elevator.target - 1);
        if (down) elevator.target = Math.min(floorYs.length - 1, elevator.target + 1);
        if (elevator.moving !== 0 || Math.abs(player.x - elevator.x) < 38) {
          player.y = elevator.y + elevator.h - player.h - 4;
          player.floor = floorForY(player.y + player.h);
        }
      }

      player.x += player.vx;
      player.x = Math.max(38, Math.min(width - 60, player.x));
      if (!nearElevator(player)) setFloor(player, player.floor);
    }

    function fireShot() {
      if (!running || player.cooldown > 0) return;
      bullets.push({ x: player.x + player.w / 2, y: player.y + 13, w: 10, h: 4, vx: player.face * 6 });
      player.cooldown = 24;
    }

    function updateBullets() {
      bullets.forEach((bullet) => {
        bullet.x += bullet.vx;
      });
      guards = guards.filter((guard) => {
        const hit = bullets.some((bullet) => overlaps(bullet, guard));
        if (hit) {
          score += 200;
          updateHud();
          return false;
        }
        return true;
      });
      bullets = bullets.filter((bullet) => bullet.x > 20 && bullet.x < width - 20);
    }

    function updateFiles() {
      files.forEach((file) => {
        if (!file.taken && overlaps(player, file)) {
          file.taken = true;
          collected++;
          score += 150;
          statusEl.textContent = collected >= 6 ? "All files secured. Reach the red exit." : "File collected.";
          updateHud();
        }
      });
      if (collected >= 6 && player.floor === floorYs.length - 1 && player.x > 598) {
        running = false;
        won = true;
        score += 1000;
        updateHud();
        statusEl.textContent = "Mission complete. Press Restart to play again.";
      }
    }

    function updateGuards() {
      if (tick % 160 === 0 && guards.length < 4) {
        const floor = 1 + Math.floor(Math.random() * 5);
        guards.push({ x: Math.random() < 0.5 ? 64 : 608, y: floorYs[floor] - 34, w: 24, h: 32, floor, vx: Math.random() < 0.5 ? -1.2 : 1.2, wait: 40 });
      }
      guards.forEach((guard) => {
        if (guard.wait > 0) {
          guard.wait--;
          return;
        }
        if (guard.floor === player.floor) guard.vx = player.x < guard.x ? -1.45 : 1.45;
        guard.x += guard.vx;
        if (guard.x < 44 || guard.x > width - 70) guard.vx *= -1;
        guard.y = floorYs[guard.floor] - guard.h - 2;
      });
    }

    function loseLife() {
      lives--;
      updateHud();
      if (lives <= 0) {
        running = false;
        statusEl.textContent = "Game over. Press Enter or Restart.";
        return;
      }
      statusEl.textContent = "Caught by a guard. Keep moving.";
      player.x = 82;
      setFloor(player, 0);
      elevator.target = 0;
      elevator.y = floorYs[0] - elevator.h + 6;
      bullets = [];
    }

    function checkGuardCollision() {
      if (guards.some((guard) => overlaps(player, guard))) loseLife();
    }

    function updateGame() {
      if (!running) return;
      tick++;
      moveElevator();
      updatePlayer();
      updateBullets();
      updateFiles();
      updateGuards();
      checkGuardCollision();
    }

    function drawBuilding() {
      ctx.fillStyle = "#18181b";
      ctx.fillRect(28, 34, width - 56, height - 58);
      floorYs.forEach((floorY, index) => {
        ctx.fillStyle = index % 2 === 0 ? "#27272a" : "#1f2937";
        ctx.fillRect(40, floorY, width - 80, 10);
        for (let x = 76; x < width - 78; x += 58) {
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(x, floorY - 44, 28, 32);
          ctx.fillStyle = "#334155";
          ctx.fillRect(x + 4, floorY - 39, 20, 7);
        }
      });
      ctx.fillStyle = "#3f3f46";
      ctx.fillRect(shaftX - 6, 34, 56, height - 96);
      ctx.strokeStyle = "#71717a";
      ctx.strokeRect(shaftX - 6, 34, 56, height - 96);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(624, floorYs[floorYs.length - 1] - 44, 30, 34);
    }

    function drawActor(actor, color, hat) {
      ctx.fillStyle = color;
      ctx.fillRect(actor.x + 4, actor.y + 12, actor.w - 8, actor.h - 10);
      ctx.fillStyle = "#f8d0aa";
      ctx.beginPath();
      ctx.arc(actor.x + actor.w / 2, actor.y + 9, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = hat;
      ctx.fillRect(actor.x + 3, actor.y + 2, actor.w - 6, 5);
    }

    function renderElevatorAction() {
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#09090b";
      ctx.fillRect(0, 0, width, height);
      drawBuilding();

      ctx.fillStyle = "#52525b";
      ctx.fillRect(elevator.x, elevator.y, elevator.w, elevator.h);
      ctx.fillStyle = "#a1a1aa";
      ctx.fillRect(elevator.x + 7, elevator.y + 8, elevator.w - 14, elevator.h - 14);

      files.forEach((file) => {
        if (file.taken) return;
        ctx.fillStyle = "#facc15";
        ctx.fillRect(file.x, file.y, file.w, file.h);
        ctx.fillStyle = "#713f12";
        ctx.fillRect(file.x + 4, file.y + 5, file.w - 8, 3);
      });

      bullets.forEach((bullet) => {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(bullet.x, bullet.y, bullet.w, bullet.h);
      });

      guards.forEach((guard) => drawActor(guard, "#7f1d1d", "#111827"));
      drawActor(player, "#1d4ed8", "#e5e7eb");

      if (!running) {
        ctx.fillStyle = "rgba(9, 9, 11, 0.76)";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = won ? "#bbf7d0" : "#fecaca";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(won ? "Mission Complete" : "Game Over", width / 2, height / 2);
        ctx.font = "18px sans-serif";
        ctx.fillText("Press Enter or Restart", width / 2, height / 2 + 34);
      }
    }

    function gameLoop(time) {
      if (!lastTime) lastTime = time;
      if (time - lastTime > 16) {
        updateGame();
        renderElevatorAction();
        lastTime = time;
      }
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "w", "a", "s", "d", "Enter"].includes(key)) {
        event.preventDefault();
      }
      if (key === " ") fireShot();
      else if (key === "Enter" && !running) resetGame();
      else keys.add(key);
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    restartBtn.addEventListener("click", resetGame);
    resetGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
