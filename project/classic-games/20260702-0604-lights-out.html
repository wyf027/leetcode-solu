<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Lights Out</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col gap-5 px-4 py-6 sm:py-8">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-zinc-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-normal text-white">Mini Lights Out</h1>
        <p class="mt-1 text-sm text-zinc-400">Turn every tile dark. Each move flips the tapped tile and its neighbors.</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="newGame" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-200">
          New
        </button>
        <button id="resetGame" class="rounded-md border border-zinc-700 px-4 py-2 text-sm font-semibold text-zinc-100 hover:bg-zinc-900 focus:outline-none focus:ring-2 focus:ring-zinc-500">
          Reset
        </button>
      </div>
    </header>

    <section class="grid gap-4 sm:grid-cols-[1fr_12rem]">
      <div class="flex justify-center">
        <div id="board" class="grid aspect-square w-full max-w-[28rem] grid-cols-5 gap-2 rounded-md border border-zinc-800 bg-zinc-900 p-3 shadow-2xl shadow-cyan-950/30" aria-label="Lights Out board"></div>
      </div>

      <aside class="grid content-start gap-3">
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <div class="text-xs uppercase tracking-wider text-zinc-500">Moves</div>
          <div id="moves" class="mt-1 text-3xl font-bold text-white">0</div>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <div class="text-xs uppercase tracking-wider text-zinc-500">Lights</div>
          <div id="lights" class="mt-1 text-3xl font-bold text-cyan-300">0</div>
        </div>
        <div id="status" class="rounded-md border border-zinc-800 bg-zinc-900 p-4 text-sm leading-6 text-zinc-300">
          Clear the board in as few moves as possible.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const boardEl = document.querySelector("#board");
    const movesEl = document.querySelector("#moves");
    const lightsEl = document.querySelector("#lights");
    const statusEl = document.querySelector("#status");
    const newGameBtn = document.querySelector("#newGame");
    const resetGameBtn = document.querySelector("#resetGame");
    let board = [];
    let startBoard = [];
    let moves = 0;
    let locked = false;

    function index(row, col) {
      return row * size + col;
    }

    function clone(values) {
      return values.slice();
    }

    function flipAt(values, row, col) {
      [[0, 0], [1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
        const nextRow = row + dr;
        const nextCol = col + dc;
        if (nextRow >= 0 && nextRow < size && nextCol >= 0 && nextCol < size) {
          const cell = index(nextRow, nextCol);
          values[cell] = !values[cell];
        }
      });
    }

    function makePuzzle() {
      const values = Array(size * size).fill(false);
      const moveCount = 8 + Math.floor(Math.random() * 8);
      for (let move = 0; move < moveCount; move++) {
        const row = Math.floor(Math.random() * size);
        const col = Math.floor(Math.random() * size);
        flipAt(values, row, col);
      }
      if (!values.some(Boolean)) {
        flipAt(values, 2, 2);
      }
      return values;
    }

    function countLights() {
      return board.filter(Boolean).length;
    }

    function render() {
      boardEl.innerHTML = "";
      board.forEach((isOn, cell) => {
        const button = document.createElement("button");
        const row = Math.floor(cell / size);
        const col = cell % size;
        button.type = "button";
        button.setAttribute("aria-label", `Row ${row + 1}, column ${col + 1}`);
        button.className = [
          "aspect-square rounded-md border text-lg font-bold transition focus:outline-none focus:ring-2 focus:ring-cyan-200",
          isOn
            ? "border-cyan-200 bg-cyan-300 text-cyan-950 shadow-lg shadow-cyan-400/30"
            : "border-zinc-700 bg-zinc-950 text-zinc-700 hover:border-zinc-500"
        ].join(" ");
        button.textContent = isOn ? "ON" : "";
        button.addEventListener("click", () => play(row, col));
        boardEl.appendChild(button);
      });

      const lights = countLights();
      movesEl.textContent = moves;
      lightsEl.textContent = lights;
      if (lights === 0) {
        locked = true;
        statusEl.textContent = `Solved in ${moves} move${moves === 1 ? "" : "s"}. Start a new board or replay this one.`;
      } else {
        statusEl.textContent = "Clear the board in as few moves as possible.";
      }
    }

    function play(row, col) {
      if (locked) return;
      flipAt(board, row, col);
      moves += 1;
      render();
    }

    function startNewGame() {
      board = makePuzzle();
      startBoard = clone(board);
      moves = 0;
      locked = false;
      render();
    }

    function resetGame() {
      board = clone(startBoard);
      moves = 0;
      locked = false;
      render();
    }

    newGameBtn.addEventListener("click", startNewGame);
    resetGameBtn.addEventListener("click", resetGame);
    startNewGame();
  </script>
</body>
</html>
