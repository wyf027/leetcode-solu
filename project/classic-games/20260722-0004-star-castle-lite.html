<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Star Castle</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.25em] text-violet-300">Classic Games</p>
        <h1 class="text-3xl font-bold text-white">Mini Star Castle</h1>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-xs text-neutral-400">得分</p>
          <p id="score" class="font-semibold text-violet-200">0</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-xs text-neutral-400">生命</p>
          <p id="lives" class="font-semibold text-emerald-200">3</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-xs text-neutral-400">护环</p>
          <p id="rings" class="font-semibold text-amber-200">0</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-xs text-neutral-400">阶段</p>
          <p id="stage" class="font-semibold text-sky-200">1</p>
        </div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_270px]">
      <div class="rounded border border-neutral-800 bg-neutral-900 p-3 shadow-2xl shadow-black/30">
        <canvas id="game" width="720" height="520" class="h-auto w-full rounded bg-black"></canvas>
      </div>
      <aside class="rounded border border-neutral-800 bg-neutral-900 p-4">
        <h2 class="text-lg font-semibold text-white">任务</h2>
        <p class="mt-2 text-sm leading-6 text-neutral-300">绕着中心堡垒移动，打碎旋转护环后攻击核心。核心会发射追踪弹，靠节奏和角度躲开。</p>
        <dl class="mt-4 space-y-3 text-sm">
          <div>
            <dt class="font-semibold text-violet-200">旋转移动</dt>
            <dd class="text-neutral-300">方向键 / A D</dd>
          </div>
          <div>
            <dt class="font-semibold text-violet-200">靠近 / 远离</dt>
            <dd class="text-neutral-300">W S / 上下键</dd>
          </div>
          <div>
            <dt class="font-semibold text-violet-200">射击</dt>
            <dd class="text-neutral-300">空格键</dd>
          </div>
          <div>
            <dt class="font-semibold text-violet-200">重新开始</dt>
            <dd class="text-neutral-300">R</dd>
          </div>
        </dl>
        <button id="restart" class="mt-5 w-full rounded bg-violet-300 px-4 py-2 font-semibold text-neutral-950 hover:bg-violet-200">重新开始</button>
        <p id="status" class="mt-4 min-h-14 rounded border border-neutral-700 bg-neutral-950 p-3 text-sm text-neutral-300">打碎外层护环，等待核心暴露。</p>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const ringsEl = document.getElementById("rings");
    const stageEl = document.getElementById("stage");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");

    const W = canvas.width;
    const H = canvas.height;
    const center = { x: W / 2, y: H / 2 };
    const keys = new Set();
    let ship;
    let shots;
    let mines;
    let rings;
    let sparks;
    let score;
    let lives;
    let stage;
    let cooldown;
    let mineTimer;
    let coreOpen;
    let coreFlash;
    let running;
    let message;
    let lastTime = 0;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function pointFromPolar(radius, angle) {
      return {
        x: center.x + Math.cos(angle) * radius,
        y: center.y + Math.sin(angle) * radius,
      };
    }

    function resetGame() {
      ship = { angle: -Math.PI / 2, radius: 218, spin: 2.35, radialSpeed: 170, invulnerable: 0 };
      shots = [];
      mines = [];
      sparks = [];
      score = 0;
      lives = 3;
      stage = 1;
      cooldown = 0;
      mineTimer = 1.3;
      coreOpen = false;
      coreFlash = 0;
      running = true;
      message = "打碎外层护环，等待核心暴露。";
      buildRings();
      updateHud();
    }

    function buildRings() {
      rings = [];
      const layers = [
        { radius: 64, count: 10, color: "#facc15", speed: 0.7 },
        { radius: 96, count: 14, color: "#22d3ee", speed: -0.52 },
        { radius: 130, count: 18, color: "#a78bfa", speed: 0.38 },
      ];
      for (const layer of layers) {
        for (let i = 0; i < layer.count; i += 1) {
          rings.push({
            radius: layer.radius,
            angle: (Math.PI * 2 * i) / layer.count,
            size: 10,
            color: layer.color,
            speed: layer.speed + stage * 0.03,
            alive: true,
          });
        }
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      ringsEl.textContent = rings.filter((ring) => ring.alive).length;
      stageEl.textContent = stage;
      statusEl.textContent = message;
    }

    function burst(x, y, color, amount) {
      for (let i = 0; i < amount; i += 1) {
        sparks.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 210,
          vy: (Math.random() - 0.5) * 210,
          life: 0.35 + Math.random() * 0.45,
          color,
        });
      }
    }

    function shoot() {
      if (!running || cooldown > 0) return;
      const pos = pointFromPolar(ship.radius, ship.angle);
      const dir = Math.atan2(center.y - pos.y, center.x - pos.x);
      shots.push({
        x: pos.x + Math.cos(dir) * 14,
        y: pos.y + Math.sin(dir) * 14,
        vx: Math.cos(dir) * 440,
        vy: Math.sin(dir) * 440,
        life: 1.1,
      });
      cooldown = 0.16;
    }

    function nextStage() {
      stage += 1;
      coreOpen = false;
      coreFlash = 0;
      mines = [];
      shots = [];
      ship.radius = 218;
      ship.invulnerable = 1.4;
      message = `第 ${stage} 阶段：护环重组，速度提升。`;
      buildRings();
      updateHud();
    }

    function loseLife() {
      if (ship.invulnerable > 0) return;
      const pos = pointFromPolar(ship.radius, ship.angle);
      burst(pos.x, pos.y, "#f8fafc", 24);
      lives -= 1;
      if (lives <= 0) {
        running = false;
        message = "飞船被核心防御击毁。按 R 重新开始。";
      } else {
        ship.radius = 218;
        ship.angle = -Math.PI / 2;
        ship.invulnerable = 1.8;
        mines = [];
        message = "损失一架飞船，短暂无敌。";
      }
      updateHud();
    }

    function fireMine(dt) {
      mineTimer -= dt;
      if (mineTimer > 0) return;
      const pos = pointFromPolar(ship.radius, ship.angle);
      const dir = Math.atan2(pos.y - center.y, pos.x - center.x);
      mines.push({
        x: center.x,
        y: center.y,
        vx: Math.cos(dir) * (115 + stage * 18),
        vy: Math.sin(dir) * (115 + stage * 18),
        turn: 0.8 + stage * 0.08,
        life: 4,
      });
      mineTimer = Math.max(0.52, 1.45 - stage * 0.09);
    }

    function updateShip(dt) {
      if (keys.has("arrowleft") || keys.has("a")) ship.angle -= ship.spin * dt;
      if (keys.has("arrowright") || keys.has("d")) ship.angle += ship.spin * dt;
      if (keys.has("arrowup") || keys.has("w")) ship.radius -= ship.radialSpeed * dt;
      if (keys.has("arrowdown") || keys.has("s")) ship.radius += ship.radialSpeed * dt;
      ship.radius = clamp(ship.radius, 158, 236);
      ship.invulnerable = Math.max(0, ship.invulnerable - dt);
      cooldown = Math.max(0, cooldown - dt);
    }

    function updateRings(dt) {
      for (const ring of rings) {
        if (!ring.alive) continue;
        ring.angle += ring.speed * dt;
      }
      coreOpen = rings.every((ring) => !ring.alive);
      if (coreOpen) {
        coreFlash += dt;
        message = "核心暴露，直接命中中心即可推进阶段。";
        updateHud();
      }
    }

    function updateShots(dt) {
      for (const shot of shots) {
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
        shot.life -= dt;

        for (const ring of rings) {
          if (!ring.alive) continue;
          const p = pointFromPolar(ring.radius, ring.angle);
          if (Math.hypot(shot.x - p.x, shot.y - p.y) < ring.size + 4) {
            ring.alive = false;
            shot.dead = true;
            score += 25;
            burst(p.x, p.y, ring.color, 10);
            message = "护环碎片被击破。";
            updateHud();
            break;
          }
        }

        if (!shot.dead && coreOpen && distance(shot, center) < 28) {
          shot.dead = true;
          score += 300 + stage * 80;
          burst(center.x, center.y, "#f472b6", 36);
          message = "核心被摧毁，堡垒重组。";
          updateHud();
          nextStage();
          return;
        }
      }
      shots = shots.filter((shot) => shot.life > 0 && !shot.dead);
    }

    function updateMines(dt) {
      const shipPos = pointFromPolar(ship.radius, ship.angle);
      for (const mine of mines) {
        const desired = Math.atan2(shipPos.y - mine.y, shipPos.x - mine.x);
        const current = Math.atan2(mine.vy, mine.vx);
        let delta = desired - current;
        while (delta > Math.PI) delta -= Math.PI * 2;
        while (delta < -Math.PI) delta += Math.PI * 2;
        const angle = current + clamp(delta, -mine.turn * dt, mine.turn * dt);
        const speed = Math.hypot(mine.vx, mine.vy);
        mine.vx = Math.cos(angle) * speed;
        mine.vy = Math.sin(angle) * speed;
        mine.x += mine.vx * dt;
        mine.y += mine.vy * dt;
        mine.life -= dt;
        if (distance(mine, shipPos) < 17) {
          mine.dead = true;
          loseLife();
        }
      }
      mines = mines.filter((mine) => mine.life > 0 && !mine.dead);
    }

    function updateSparks(dt) {
      sparks = sparks.filter((spark) => spark.life > 0);
      for (const spark of sparks) {
        spark.life -= dt;
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
      }
    }

    function update(dt) {
      if (!running) return;
      updateShip(dt);
      updateRings(dt);
      updateShots(dt);
      updateMines(dt);
      updateSparks(dt);
      fireMine(dt);
    }

    function drawShip() {
      const pos = pointFromPolar(ship.radius, ship.angle);
      const facing = Math.atan2(center.y - pos.y, center.x - pos.x);
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(facing);
      ctx.fillStyle = ship.invulnerable > 0 ? "#e0f2fe" : "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(-12, -10);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-12, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawCastle() {
      ctx.save();
      ctx.translate(center.x, center.y);
      ctx.strokeStyle = coreOpen ? "#f472b6" : "#64748b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 26 + Math.sin(coreFlash * 9) * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = coreOpen ? "#f9a8d4" : "#334155";
      ctx.beginPath();
      ctx.arc(0, 0, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      for (const ring of rings) {
        if (!ring.alive) continue;
        const p = pointFromPolar(ring.radius, ring.angle);
        ctx.fillStyle = ring.color;
        ctx.fillRect(p.x - ring.size / 2, p.y - ring.size / 2, ring.size, ring.size);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#334155";
      for (let i = 0; i < 95; i += 1) {
        ctx.fillRect((i * 73 + stage * 17) % W, (i * 41) % H, 1.5, 1.5);
      }

      drawCastle();

      ctx.fillStyle = "#f8fafc";
      for (const shot of shots) {
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#fb7185";
      for (const mine of mines) {
        ctx.beginPath();
        ctx.arc(mine.x, mine.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }

      drawShip();

      for (const spark of sparks) {
        ctx.globalAlpha = Math.max(0, spark.life);
        ctx.fillStyle = spark.color;
        ctx.fillRect(spark.x, spark.y, 3, 3);
      }
      ctx.globalAlpha = 1;

      if (!running) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.78)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 32px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Castle Wins", W / 2, H / 2 - 12);
        ctx.font = "18px system-ui";
        ctx.fillText("按 R 或点击重新开始", W / 2, H / 2 + 24);
        ctx.textAlign = "left";
      }
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      keys.add(key);
      if (event.code === "Space") {
        event.preventDefault();
        shoot();
      }
      if (key === "r") resetGame();
    });

    document.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    restartBtn.addEventListener("click", resetGame);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
