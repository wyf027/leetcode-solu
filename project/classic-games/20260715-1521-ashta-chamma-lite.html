<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Ashta Chamma</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-indigo-700 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Mini Ashta Chamma</h1>
        <p class="mt-1 max-w-2xl text-sm text-indigo-200">掷四枚贝壳移动棋子。掷出 4 或 8 可连掷，踩到对手棋子会把它送回起点。</p>
      </div>
      <button id="resetBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-bold text-indigo-950 hover:bg-amber-200">重新开始</button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_320px]">
      <div class="rounded border border-indigo-700 bg-indigo-900/70 p-4 shadow">
        <div id="board" class="grid aspect-square grid-cols-5 gap-2"></div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-indigo-700 bg-indigo-900/70 p-4 shadow">
          <div class="text-xs font-semibold uppercase tracking-widest text-indigo-300">当前回合</div>
          <div id="turnText" class="mt-1 text-2xl font-bold"></div>
          <p id="statusText" class="mt-3 min-h-16 text-sm leading-6 text-indigo-100"></p>
          <button id="rollBtn" class="mt-3 w-full rounded bg-emerald-400 px-4 py-3 font-bold text-indigo-950 hover:bg-emerald-300">掷贝壳</button>
        </div>

        <div class="rounded border border-indigo-700 bg-indigo-900/70 p-4 shadow">
          <div class="text-xs font-semibold uppercase tracking-widest text-indigo-300">贝壳</div>
          <div id="shells" class="mt-3 grid grid-cols-4 gap-2"></div>
          <div id="rollText" class="mt-3 text-center text-xl font-black text-amber-200">等待掷出</div>
        </div>

        <div class="rounded border border-indigo-700 bg-indigo-900/70 p-4 shadow">
          <div class="text-xs font-semibold uppercase tracking-widest text-indigo-300">棋子</div>
          <div id="pieces" class="mt-3 grid gap-2"></div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const turnText = document.getElementById('turnText');
    const statusText = document.getElementById('statusText');
    const rollBtn = document.getElementById('rollBtn');
    const resetBtn = document.getElementById('resetBtn');
    const shellsEl = document.getElementById('shells');
    const rollText = document.getElementById('rollText');
    const piecesEl = document.getElementById('pieces');

    const players = [
      { name: '金方', color: 'bg-amber-300', text: 'text-amber-200', pieceText: 'text-indigo-950' },
      { name: '青方', color: 'bg-cyan-300', text: 'text-cyan-200', pieceText: 'text-indigo-950' }
    ];
    const path = [0, 1, 2, 3, 4, 9, 14, 19, 24, 23, 22, 21, 20, 15, 10, 5];
    const safeSpaces = new Set([0, 4, 20, 24]);
    let game;

    function resetGame() {
      game = {
        turn: 0,
        pieces: [
          [{ pos: -1, done: false }, { pos: -1, done: false }],
          [{ pos: -1, done: false }, { pos: -1, done: false }]
        ],
        shells: [false, false, false, false],
        roll: 0,
        mustMove: false,
        winner: null,
        message: '金方先手。掷贝壳后选择一枚棋子移动，走满一圈即可回家。'
      };
      render();
    }

    function throwShells() {
      const shells = Array.from({ length: 4 }, () => Math.random() < 0.5);
      const open = shells.filter(Boolean).length;
      const move = open === 0 ? 8 : open;
      return { shells, move };
    }

    function rollShells() {
      if (game.winner !== null || game.mustMove) return;
      const result = throwShells();
      game.shells = result.shells;
      game.roll = result.move;
      game.mustMove = true;
      game.message = `${players[game.turn].name} 掷出 ${game.roll}，请选择可移动棋子。`;
      if (!movablePieces(game.turn).length) {
        game.mustMove = false;
        const extra = game.roll === 4 || game.roll === 8;
        if (!extra) game.turn = 1 - game.turn;
        game.message = `没有棋子可走。${extra ? '奖励连掷。' : `轮到${players[game.turn].name}。`}`;
      }
      render();
    }

    function movablePieces(playerIndex) {
      return game.pieces[playerIndex]
        .map((piece, index) => ({ piece, index }))
        .filter(({ piece }) => !piece.done && piece.pos + game.roll <= path.length);
    }

    function movePiece(pieceIndex) {
      if (!game.mustMove || game.winner !== null) return;
      const current = game.turn;
      const opponent = 1 - current;
      const piece = game.pieces[current][pieceIndex];
      if (!piece || piece.done || piece.pos + game.roll > path.length) return;

      piece.pos += game.roll;
      let captured = false;
      if (piece.pos >= path.length) {
        piece.done = true;
        game.message = `${players[current].name} 有一枚棋子回家。`;
      } else {
        const cell = path[piece.pos];
        if (!safeSpaces.has(cell)) {
          game.pieces[opponent].forEach((enemy) => {
            if (!enemy.done && enemy.pos >= 0 && path[enemy.pos] === cell) {
              enemy.pos = -1;
              captured = true;
            }
          });
        }
        game.message = captured ? `${players[current].name} 吃掉一枚对手棋子。` : `${players[current].name} 移动完成。`;
      }

      game.mustMove = false;
      checkWinner();
      if (game.winner === null) {
        const extra = game.roll === 4 || game.roll === 8 || captured;
        game.roll = 0;
        if (!extra) game.turn = opponent;
        game.message += extra ? ' 获得一次连掷。' : ` 轮到${players[game.turn].name}。`;
      }
      render();
    }

    function checkWinner() {
      if (game.pieces[game.turn].every((piece) => piece.done)) {
        game.winner = game.turn;
        game.message = `${players[game.turn].name} 两枚棋子全部回家，获得胜利。`;
      }
    }

    function badgesAt(pathIndex) {
      const badges = [];
      game.pieces.forEach((side, playerIndex) => {
        side.forEach((piece, pieceIndex) => {
          if (!piece.done && piece.pos === pathIndex) {
            badges.push(`<span class="${players[playerIndex].color} ${players[playerIndex].pieceText} flex h-7 w-7 items-center justify-center rounded-full text-xs font-black">${pieceIndex + 1}</span>`);
          }
        });
      });
      return badges.join('');
    }

    function renderBoardCell(cell) {
      const pathIndex = path.indexOf(cell);
      const isPath = pathIndex !== -1;
      const safe = safeSpaces.has(cell);
      return `
        <div class="relative flex min-h-16 items-center justify-center rounded ${isPath ? 'border-2 border-indigo-500 bg-indigo-950/60' : 'bg-indigo-900/30'} ${safe ? 'ring-2 ring-amber-300' : ''}">
          ${isPath ? `<span class="absolute left-1 top-1 text-xs font-semibold text-indigo-400">${pathIndex + 1}</span><div class="flex gap-1">${badgesAt(pathIndex)}</div>` : ''}
        </div>
      `;
    }

    function render() {
      turnText.textContent = game.winner === null ? players[game.turn].name : `${players[game.winner].name}胜利`;
      turnText.className = `mt-1 text-2xl font-bold ${players[game.turn].text}`;
      statusText.textContent = game.message;
      rollBtn.disabled = game.winner !== null || game.mustMove;
      rollBtn.className = `mt-3 w-full rounded px-4 py-3 font-bold ${rollBtn.disabled ? 'bg-indigo-700 text-indigo-400' : 'bg-emerald-400 text-indigo-950 hover:bg-emerald-300'}`;
      rollText.textContent = game.roll ? `本次点数：${game.roll}` : '等待掷出';
      shellsEl.innerHTML = game.shells.map((open) => `
        <div class="flex h-16 items-center justify-center rounded-full border ${open ? 'border-amber-200 bg-amber-100 text-indigo-950' : 'border-indigo-500 bg-indigo-950 text-indigo-300'}">
          <span class="text-lg font-black">${open ? '开' : '合'}</span>
        </div>
      `).join('');
      boardEl.innerHTML = Array.from({ length: 25 }, (_, cell) => renderBoardCell(cell)).join('');
      piecesEl.innerHTML = players.map((player, playerIndex) => `
        <div class="rounded border border-indigo-700 p-3">
          <div class="mb-2 font-semibold ${player.text}">${player.name}</div>
          <div class="grid grid-cols-2 gap-2">
            ${game.pieces[playerIndex].map((piece, pieceIndex) => {
              const canMove = game.mustMove && game.turn === playerIndex && !piece.done && piece.pos + game.roll <= path.length;
              const label = piece.done ? '回家' : piece.pos < 0 ? '起点' : `第 ${piece.pos + 1} 格`;
              return `<button class="rounded border px-3 py-2 text-sm font-semibold ${canMove ? 'border-amber-300 bg-indigo-950 hover:bg-indigo-800' : 'border-indigo-800 bg-indigo-900/50 text-indigo-400'}" ${canMove ? '' : 'disabled'} data-piece="${pieceIndex}">棋 ${pieceIndex + 1}<br><span class="text-xs font-normal">${label}</span></button>`;
            }).join('')}
          </div>
        </div>
      `).join('');
      piecesEl.querySelectorAll('button[data-piece]').forEach((button) => {
        button.addEventListener('click', () => movePiece(Number(button.dataset.piece)));
      });
    }

    rollBtn.addEventListener('click', rollShells);
    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
