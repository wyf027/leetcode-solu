<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Quantik</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-5 px-4 py-6 sm:px-6">
    <header class="flex flex-col gap-3 border-b border-zinc-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-medium uppercase tracking-widest text-cyan-300">Classic Games</p>
        <h1 class="mt-1 text-3xl font-bold text-white">Mini Quantik</h1>
      </div>
      <button id="reset" class="w-fit rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-cyan-300">重新开始</button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
      <div class="rounded-lg border border-zinc-800 bg-zinc-900/80 p-4 shadow-2xl shadow-black/30">
        <div id="board" class="grid aspect-square w-full grid-cols-4 gap-2"></div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded-lg border border-zinc-800 bg-zinc-900 p-4">
          <div class="text-sm text-zinc-400">当前回合</div>
          <div id="turn" class="mt-1 text-2xl font-bold text-white"></div>
          <p id="status" class="mt-3 min-h-12 text-sm leading-6 text-zinc-300"></p>
        </div>

        <div class="rounded-lg border border-zinc-800 bg-zinc-900 p-4">
          <div class="mb-3 text-sm font-semibold text-zinc-300">选择棋形</div>
          <div id="pieces" class="grid grid-cols-2 gap-2"></div>
        </div>

        <div class="rounded-lg border border-zinc-800 bg-zinc-900 p-4 text-sm leading-6 text-zinc-300">
          <p>放置棋子时，同一行、同一列或同一 2x2 区域内不能出现对手相同形状的棋子。</p>
          <p class="mt-2">任意行、列或区域集齐四种形状时获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const shapes = [
      { id: "circle", label: "圆", mark: "●" },
      { id: "square", label: "方", mark: "■" },
      { id: "tri", label: "角", mark: "▲" },
      { id: "diamond", label: "菱", mark: "◆" }
    ];
    const players = [
      { name: "蓝方", text: "text-cyan-300", border: "border-cyan-400" },
      { name: "玫方", text: "text-rose-300", border: "border-rose-400" }
    ];
    const boardEl = document.getElementById("board");
    const piecesEl = document.getElementById("pieces");
    const turnEl = document.getElementById("turn");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    let board;
    let current;
    let selected;
    let winner;

    function startGame() {
      board = Array.from({ length: 16 }, () => null);
      current = 0;
      selected = shapes[0].id;
      winner = null;
      render();
    }

    function zoneCells(index) {
      const row = Math.floor(index / 4);
      const col = index % 4;
      const startRow = row < 2 ? 0 : 2;
      const startCol = col < 2 ? 0 : 2;
      return [0, 1, 4, 5].map(offset => startRow * 4 + startCol + (offset % 4) + Math.floor(offset / 4) * 4);
    }

    function lineCells(index) {
      const row = Math.floor(index / 4);
      const col = index % 4;
      const rowCells = [0, 1, 2, 3].map(n => row * 4 + n);
      const colCells = [0, 1, 2, 3].map(n => n * 4 + col);
      return [rowCells, colCells, zoneCells(index)];
    }

    function canPlace(index, shapeId) {
      if (winner || board[index]) return false;
      const opponent = 1 - current;
      return lineCells(index).every(cells =>
        cells.every(cell => !(board[cell] && board[cell].owner === opponent && board[cell].shape === shapeId))
      );
    }

    function findWin() {
      const rows = [0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => r * 4 + c));
      const cols = [0, 1, 2, 3].map(c => [0, 1, 2, 3].map(r => r * 4 + c));
      const zones = [0, 2, 8, 10].map(start => [start, start + 1, start + 4, start + 5]);
      return [...rows, ...cols, ...zones].find(cells => {
        const marks = cells.map(cell => board[cell] && board[cell].shape);
        return marks.every(Boolean) && new Set(marks).size === 4;
      });
    }

    function handleCell(index) {
      if (!canPlace(index, selected)) {
        statusEl.textContent = winner ? "对局已经结束，请重新开始。" : "这个位置违反 Quantik 限制，换个位置或棋形。";
        return;
      }
      board[index] = { owner: current, shape: selected };
      const winLine = findWin();
      if (winLine) {
        winner = current;
        statusEl.textContent = players[current].name + "集齐四种形状，赢得本局。";
      } else if (board.every(Boolean)) {
        statusEl.textContent = "棋盘已满，本局平局。";
      } else {
        current = 1 - current;
        statusEl.textContent = "选择棋形并落子。";
      }
      render();
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      board.forEach((piece, index) => {
        const button = document.createElement("button");
        const playable = canPlace(index, selected);
        button.className = [
          "flex aspect-square items-center justify-center rounded-md border bg-zinc-950 text-4xl font-black transition",
          piece ? players[piece.owner].border + " " + players[piece.owner].text : "border-zinc-700 text-zinc-600",
          playable ? "hover:border-cyan-300 hover:bg-zinc-800" : "opacity-80"
        ].join(" ");
        button.setAttribute("aria-label", "格子 " + (index + 1));
        button.textContent = piece ? shapes.find(shape => shape.id === piece.shape).mark : "";
        button.addEventListener("click", () => handleCell(index));
        boardEl.appendChild(button);
      });
    }

    function renderPieces() {
      piecesEl.innerHTML = "";
      shapes.forEach(shape => {
        const button = document.createElement("button");
        button.className = [
          "rounded-md border px-3 py-3 text-left transition",
          selected === shape.id ? "border-cyan-300 bg-cyan-300 text-zinc-950" : "border-zinc-700 bg-zinc-950 text-zinc-100 hover:border-zinc-400"
        ].join(" ");
        button.innerHTML = '<span class="mr-2 text-xl font-black">' + shape.mark + '</span><span class="text-sm font-semibold">' + shape.label + '</span>';
        button.addEventListener("click", () => {
          selected = shape.id;
          statusEl.textContent = "已选择「" + shape.label + "」。";
          render();
        });
        piecesEl.appendChild(button);
      });
    }

    function render() {
      turnEl.textContent = winner === null ? players[current].name : players[winner].name + "获胜";
      turnEl.className = "mt-1 text-2xl font-bold " + players[winner === null ? current : winner].text;
      if (!statusEl.textContent) statusEl.textContent = "选择棋形并落子。";
      renderPieces();
      renderBoard();
    }

    resetEl.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
