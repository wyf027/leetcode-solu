<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Cryptogram</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-zinc-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-cyan-300">Classic Games</p>
          <h1 class="mt-1 text-3xl font-bold">Mini Cryptogram</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-zinc-800 bg-zinc-900 px-3 py-2">
            <div id="filledCount" class="text-lg font-bold text-cyan-200">0</div>
            <div class="text-zinc-400">filled</div>
          </div>
          <div class="rounded border border-zinc-800 bg-zinc-900 px-3 py-2">
            <div id="mistakeCount" class="text-lg font-bold text-amber-200">0</div>
            <div class="text-zinc-400">misses</div>
          </div>
          <div class="rounded border border-zinc-800 bg-zinc-900 px-3 py-2">
            <div id="hintCount" class="text-lg font-bold text-emerald-200">2</div>
            <div class="text-zinc-400">hints</div>
          </div>
        </div>
      </header>

      <section class="grid gap-4 lg:grid-cols-[1fr_18rem]">
        <div class="rounded border border-zinc-800 bg-zinc-900 p-4">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-zinc-400">Cipher Text</h2>
            <span id="statusText" class="text-sm font-medium text-zinc-300">Decode the phrase.</span>
          </div>
          <div id="cipherText" class="break-words rounded bg-zinc-950 p-4 font-mono text-3xl font-bold leading-relaxed tracking-[0.16em] text-cyan-100"></div>
          <div id="previewText" class="mt-4 min-h-20 break-words rounded border border-zinc-800 bg-zinc-950 p-4 font-mono text-3xl font-bold leading-relaxed tracking-[0.16em] text-emerald-100"></div>
        </div>

        <aside class="rounded border border-zinc-800 bg-zinc-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-zinc-400">Actions</h2>
          <div class="mt-4 grid gap-3">
            <button id="checkBtn" class="rounded bg-cyan-400 px-4 py-2 font-semibold text-zinc-950 hover:bg-cyan-300">Check</button>
            <button id="hintBtn" class="rounded border border-zinc-700 px-4 py-2 font-semibold text-zinc-100 hover:bg-zinc-800">Hint</button>
            <button id="resetBtn" class="rounded border border-zinc-700 px-4 py-2 font-semibold text-zinc-100 hover:bg-zinc-800">Reset</button>
          </div>
          <p class="mt-4 text-sm leading-6 text-zinc-400">
            Each cipher letter always stands for the same decoded letter. Fill the table and check your phrase.
          </p>
        </aside>
      </section>

      <section class="rounded border border-zinc-800 bg-zinc-900 p-4">
        <div class="mb-3 flex items-center justify-between">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-zinc-400">Substitution Table</h2>
          <span class="text-sm text-zinc-500">Cipher to plain</span>
        </div>
        <div id="keyGrid" class="grid grid-cols-4 gap-2 sm:grid-cols-7 md:grid-cols-9"></div>
      </section>
    </main>

    <script>
      const plainPhrase = "CODE BREAK";
      const cipherPhrase = "JVKL IYLHR";
      const cipherLetters = [...new Set(cipherPhrase.replace(/[^A-Z]/g, "").split(""))].sort();
      const solution = {};
      cipherPhrase.split("").forEach((char, index) => {
        if (/[A-Z]/.test(char)) {
          solution[char] = plainPhrase[index];
        }
      });

      const cipherText = document.getElementById("cipherText");
      const previewText = document.getElementById("previewText");
      const keyGrid = document.getElementById("keyGrid");
      const filledCount = document.getElementById("filledCount");
      const mistakeCount = document.getElementById("mistakeCount");
      const hintCount = document.getElementById("hintCount");
      const statusText = document.getElementById("statusText");
      const checkBtn = document.getElementById("checkBtn");
      const hintBtn = document.getElementById("hintBtn");
      const resetBtn = document.getElementById("resetBtn");

      let hintsLeft = 2;

      function mapping() {
        return Object.fromEntries(
          [...document.querySelectorAll("[data-cipher]")].map((input) => [
            input.dataset.cipher,
            input.value.toUpperCase(),
          ]),
        );
      }

      function decodedPreview() {
        const key = mapping();
        return cipherPhrase
          .split("")
          .map((char) => {
            if (char === " ") return " ";
            return key[char] || "_";
          })
          .join("");
      }

      function countMistakes() {
        const key = mapping();
        return cipherLetters.filter((letter) => key[letter] && key[letter] !== solution[letter]).length;
      }

      function renderPreview() {
        const key = mapping();
        filledCount.textContent = cipherLetters.filter((letter) => key[letter]).length;
        mistakeCount.textContent = countMistakes();
        hintCount.textContent = hintsLeft;
        previewText.textContent = decodedPreview();
      }

      function checkSolved() {
        renderPreview();
        if (decodedPreview() === plainPhrase) {
          statusText.textContent = "Solved.";
          statusText.className = "text-sm font-medium text-emerald-300";
          return;
        }
        if (countMistakes() > 0) {
          statusText.textContent = "Some letters are incorrect.";
          statusText.className = "text-sm font-medium text-amber-300";
          return;
        }
        statusText.textContent = "Keep decoding.";
        statusText.className = "text-sm font-medium text-zinc-300";
      }

      function useHint() {
        if (hintsLeft < 1) return;
        const emptyLetter = cipherLetters.find((letter) => {
          const input = document.querySelector(`[data-cipher="${letter}"]`);
          return input && input.value.toUpperCase() !== solution[letter];
        });
        if (!emptyLetter) return;
        const input = document.querySelector(`[data-cipher="${emptyLetter}"]`);
        input.value = solution[emptyLetter];
        hintsLeft -= 1;
        statusText.textContent = `Hint filled ${emptyLetter}.`;
        statusText.className = "text-sm font-medium text-cyan-300";
        renderPreview();
      }

      function resetGame() {
        document.querySelectorAll("[data-cipher]").forEach((input) => {
          input.value = "";
        });
        hintsLeft = 2;
        statusText.textContent = "Decode the phrase.";
        statusText.className = "text-sm font-medium text-zinc-300";
        renderPreview();
      }

      function createKeyGrid() {
        keyGrid.innerHTML = "";
        cipherLetters.forEach((letter) => {
          const label = document.createElement("label");
          label.className = "rounded border border-zinc-800 bg-zinc-950 p-2 text-center";
          label.innerHTML = `
            <span class="block font-mono text-lg font-bold text-cyan-200">${letter}</span>
            <input data-cipher="${letter}" maxlength="1" aria-label="Plain letter for ${letter}"
              class="mt-2 h-10 w-full rounded border border-zinc-700 bg-zinc-900 text-center font-mono text-xl font-bold uppercase text-zinc-100 outline-none focus:border-cyan-300"
            />
          `;
          keyGrid.appendChild(label);
        });
      }

      cipherText.textContent = cipherPhrase;
      createKeyGrid();
      keyGrid.addEventListener("input", (event) => {
        if (!event.target.matches("[data-cipher]")) return;
        event.target.value = event.target.value.replace(/[^a-z]/gi, "").toUpperCase();
        renderPreview();
      });
      checkBtn.addEventListener("click", checkSolved);
      hintBtn.addEventListener("click", useHint);
      resetBtn.addEventListener("click", resetGame);
      renderPreview();
    </script>
  </body>
</html>
