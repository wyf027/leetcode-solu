<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Racetrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6 md:px-6">
    <header class="flex flex-col gap-3 border-b border-slate-800 pb-4 md:flex-row md:items-end md:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.22em] text-orange-300">Classic Games</p>
        <h1 class="mt-1 text-3xl font-bold text-white">Mini Racetrack</h1>
      </div>
      <button id="resetBtn" class="w-fit rounded bg-orange-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-orange-300">
        重新开始
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_320px]">
      <div class="rounded border border-slate-800 bg-slate-900 p-3 shadow-2xl">
        <div id="track" class="grid aspect-square w-full grid-cols-13 gap-1 rounded bg-slate-800 p-2"></div>
      </div>

      <aside class="space-y-4">
        <div class="rounded border border-slate-800 bg-slate-900 p-4">
          <h2 class="text-lg font-semibold text-white">仪表</h2>
          <div class="mt-4 grid grid-cols-2 gap-3 text-sm">
            <div class="rounded bg-slate-800 p-3">
              <p class="text-slate-400">速度</p>
              <p id="speedText" class="mt-1 text-2xl font-bold text-sky-300">0, 0</p>
            </div>
            <div class="rounded bg-slate-800 p-3">
              <p class="text-slate-400">步数</p>
              <p id="turnText" class="mt-1 text-2xl font-bold text-orange-300">0</p>
            </div>
          </div>
          <p id="status" class="mt-4 min-h-12 rounded bg-slate-800 p-3 text-sm leading-6 text-slate-200"></p>
        </div>

        <div class="rounded border border-slate-800 bg-slate-900 p-4">
          <h2 class="text-lg font-semibold text-white">加速度</h2>
          <div id="controls" class="mt-3 grid grid-cols-3 gap-2"></div>
        </div>

        <div class="rounded border border-slate-800 bg-slate-900 p-4 text-sm leading-6 text-slate-300">
          <h2 class="text-lg font-semibold text-white">规则</h2>
          <p class="mt-3">每回合选择横向与纵向加速度，速度会累积。赛车按新速度移动到下一格。</p>
          <p class="mt-2">撞墙会回到起点并清空速度。抵达绿色终点即获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const rows = 13;
    const cols = 13;
    const start = { r: 11, c: 1 };
    const finish = { r: 1, c: 11 };
    const trackEl = document.getElementById("track");
    const controlsEl = document.getElementById("controls");
    const statusEl = document.getElementById("status");
    const speedText = document.getElementById("speedText");
    const turnText = document.getElementById("turnText");
    const resetBtn = document.getElementById("resetBtn");

    let pos;
    let speed;
    let turns;
    let trail;
    let gameOver;

    const walls = new Set();
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const outer = r === 0 || c === 0 || r === rows - 1 || c === cols - 1;
        const innerBlock = (r >= 3 && r <= 9 && c >= 3 && c <= 9);
        const chicane = (r === 6 && c >= 9 && c <= 11) || (c === 6 && r >= 1 && r <= 3);
        if (outer || innerBlock || chicane) walls.add(keyOf(r, c));
      }
    }
    walls.delete(keyOf(start.r, start.c));
    walls.delete(keyOf(finish.r, finish.c));

    function keyOf(r, c) {
      return `${r},${c}`;
    }

    function startGame() {
      pos = { ...start };
      speed = { r: 0, c: 0 };
      turns = 0;
      trail = [keyOf(pos.r, pos.c)];
      gameOver = false;
      setStatus("选择一个加速度。小心速度会累积，提前为弯道减速。");
      render();
    }

    function applyAcceleration(dr, dc) {
      if (gameOver) return;
      const nextSpeed = { r: speed.r + dr, c: speed.c + dc };
      const next = { r: pos.r + nextSpeed.r, c: pos.c + nextSpeed.c };
      turns += 1;
      if (isBlocked(next.r, next.c) || crossesWall(pos, next)) {
        pos = { ...start };
        speed = { r: 0, c: 0 };
        trail = [keyOf(pos.r, pos.c)];
        setStatus("撞墙了，赛车回到起点，速度归零。");
        render();
        return;
      }
      speed = nextSpeed;
      pos = next;
      trail.push(keyOf(pos.r, pos.c));
      if (pos.r === finish.r && pos.c === finish.c) {
        gameOver = true;
        setStatus(`冲线成功，用了 ${turns} 步。`);
      } else {
        setStatus("继续调整速度，驶向右上角绿色终点。");
      }
      render();
    }

    function isBlocked(r, c) {
      return r < 0 || c < 0 || r >= rows || c >= cols || walls.has(keyOf(r, c));
    }

    function crossesWall(from, to) {
      const steps = Math.max(Math.abs(to.r - from.r), Math.abs(to.c - from.c));
      for (let i = 1; i <= steps; i++) {
        const r = Math.round(from.r + (to.r - from.r) * i / steps);
        const c = Math.round(from.c + (to.c - from.c) * i / steps);
        if (isBlocked(r, c)) return true;
      }
      return false;
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function renderControls() {
      controlsEl.innerHTML = "";
      const labels = [
        ["↖", -1, -1], ["↑", -1, 0], ["↗", -1, 1],
        ["←", 0, -1],  ["·", 0, 0],  ["→", 0, 1],
        ["↙", 1, -1],  ["↓", 1, 0],  ["↘", 1, 1]
      ];
      for (const [label, dr, dc] of labels) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "rounded bg-slate-800 px-3 py-3 text-xl font-bold text-white hover:bg-orange-400 hover:text-slate-950 disabled:cursor-not-allowed disabled:bg-slate-700 disabled:text-slate-500";
        btn.textContent = label;
        btn.disabled = gameOver;
        btn.addEventListener("click", () => applyAcceleration(dr, dc));
        controlsEl.appendChild(btn);
      }
    }

    function render() {
      trackEl.innerHTML = "";
      speedText.textContent = `${speed.c}, ${-speed.r}`;
      turnText.textContent = turns;
      const trailSet = new Set(trail);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement("div");
          const wall = walls.has(keyOf(r, c));
          const here = pos.r === r && pos.c === c;
          const finishHere = finish.r === r && finish.c === c;
          const startHere = start.r === r && start.c === c;
          const visited = trailSet.has(keyOf(r, c));
          cell.className = [
            "flex aspect-square items-center justify-center rounded text-xs font-bold",
            wall ? "bg-slate-950" : "bg-slate-700",
            visited && !here ? "bg-sky-900" : "",
            startHere ? "bg-orange-500 text-slate-950" : "",
            finishHere ? "bg-lime-400 text-slate-950" : "",
            here ? "ring-4 ring-white bg-sky-300 text-slate-950" : ""
          ].join(" ");
          cell.textContent = here ? "🏁" : finishHere ? "F" : startHere ? "S" : "";
          trackEl.appendChild(cell);
        }
      }
      renderControls();
    }

    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
