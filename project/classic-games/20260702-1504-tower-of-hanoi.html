<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Tower of Hanoi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-neutral-800 bg-neutral-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal text-white">Mini Tower of Hanoi</h1>
          <p class="mt-1 text-sm text-neutral-400">点击一根柱子拿起最上方圆盘，再点击目标柱放下。</p>
        </div>
        <button id="reset" class="rounded-md bg-orange-400 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-orange-300">
          重新开始
        </button>
      </div>

      <div class="mb-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="rounded-md bg-neutral-800 px-3 py-2">
          <div class="text-neutral-400">步数</div>
          <div id="moves" class="text-xl font-semibold text-white">0</div>
        </div>
        <div class="rounded-md bg-neutral-800 px-3 py-2">
          <div class="text-neutral-400">最佳</div>
          <div class="text-xl font-semibold text-white">15</div>
        </div>
        <div class="rounded-md bg-neutral-800 px-3 py-2">
          <div class="text-neutral-400">状态</div>
          <div id="status" class="text-xl font-semibold text-white">选择圆盘</div>
        </div>
      </div>

      <div id="board" class="grid gap-3 sm:grid-cols-3"></div>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    const diskCount = 4;
    const diskColors = ["bg-sky-400", "bg-emerald-400", "bg-amber-400", "bg-rose-400"];
    let towers = [];
    let selected = null;
    let moves = 0;
    let won = false;

    function resetGame() {
      towers = [[4, 3, 2, 1], [], []];
      selected = null;
      moves = 0;
      won = false;
      render();
    }

    function chooseTower(index) {
      if (won) return;
      if (selected === null) {
        if (towers[index].length === 0) return;
        selected = index;
        render();
        return;
      }
      if (selected === index) {
        selected = null;
        render();
        return;
      }
      const moving = towers[selected][towers[selected].length - 1];
      const target = towers[index][towers[index].length - 1];
      if (target === undefined || moving < target) {
        towers[index].push(towers[selected].pop());
        moves++;
        selected = null;
        won = towers[2].length === diskCount;
      } else {
        selected = index;
      }
      render();
    }

    function render() {
      boardEl.innerHTML = "";
      towers.forEach((tower, index) => {
        const column = document.createElement("button");
        column.type = "button";
        column.className = [
          "relative flex h-72 flex-col justify-end rounded-lg border p-3 transition focus:outline-none focus:ring-2 focus:ring-orange-200",
          selected === index ? "border-orange-300 bg-orange-950" : "border-neutral-700 bg-neutral-800 hover:bg-neutral-700"
        ].join(" ");
        column.setAttribute("aria-label", `第 ${index + 1} 根柱`);
        column.addEventListener("click", () => chooseTower(index));

        const pole = document.createElement("div");
        pole.className = "absolute bottom-8 left-1/2 h-52 w-2 -translate-x-1/2 rounded bg-neutral-600";
        column.appendChild(pole);

        for (const disk of tower) {
          const piece = document.createElement("div");
          piece.className = [
            "z-10 mx-auto mb-1 h-8 rounded-md border border-neutral-950 text-center text-sm font-bold leading-8 text-neutral-950",
            diskColors[disk - 1]
          ].join(" ");
          piece.style.width = `${36 + disk * 14}%`;
          piece.textContent = disk;
          column.appendChild(piece);
        }
        boardEl.appendChild(column);
      });
      movesEl.textContent = moves;
      statusEl.textContent = won ? "完成" : selected === null ? "选择圆盘" : "选择目标";
    }

    resetEl.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
