<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Wolf and Sheep</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.18em] text-emerald-300">Classic Mini Game</p>
        <h1 class="text-3xl font-bold">Mini Wolf and Sheep</h1>
      </div>
      <button id="resetBtn" class="rounded-md bg-emerald-400 px-4 py-2 font-semibold text-slate-950 hover:bg-emerald-300">重新开始</button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_300px]">
      <div class="rounded-lg border border-slate-700 bg-slate-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-8 gap-1"></div>
      </div>

      <aside class="rounded-lg border border-slate-700 bg-slate-900 p-4">
        <div class="rounded-md bg-slate-800 p-3">
          <p class="text-xs text-slate-400">当前回合</p>
          <p id="turnText" class="mt-1 text-lg font-semibold">羊群</p>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-3 text-center">
          <div class="rounded-md bg-slate-800 p-3">
            <p class="text-xs text-slate-400">狼所在行</p>
            <p id="wolfRow" class="text-2xl font-bold text-rose-300">1</p>
          </div>
          <div class="rounded-md bg-slate-800 p-3">
            <p class="text-xs text-slate-400">羊数量</p>
            <p class="text-2xl font-bold text-sky-300">4</p>
          </div>
        </div>
        <div class="mt-4 rounded-md bg-slate-800 p-3">
          <p id="statusText" class="text-sm leading-6 text-slate-200">羊群先走。羊只能向上斜走，狼只能向下斜走。羊把狼困住获胜，狼到达底边获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const resetBtn = document.getElementById("resetBtn");
    const turnTextEl = document.getElementById("turnText");
    const wolfRowEl = document.getElementById("wolfRow");
    const statusTextEl = document.getElementById("statusText");
    const size = 8;
    let cells;
    let turn;
    let selected;
    let gameOver;

    function indexOf(row, col) {
      return row * size + col;
    }

    function rowOf(index) {
      return Math.floor(index / size);
    }

    function colOf(index) {
      return index % size;
    }

    function inside(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function legalTargets(index, piece) {
      const row = rowOf(index);
      const col = colOf(index);
      const dir = piece === "W" ? 1 : -1;
      return [[row + dir, col - 1], [row + dir, col + 1]]
        .filter(([nextRow, nextCol]) => inside(nextRow, nextCol))
        .map(([nextRow, nextCol]) => indexOf(nextRow, nextCol))
        .filter((target) => !cells[target]);
    }

    function resetGame() {
      cells = Array(size * size).fill("");
      cells[indexOf(0, 1)] = "W";
      [1, 3, 5, 7].forEach((col) => {
        cells[indexOf(size - 1, col)] = "S";
      });
      turn = "S";
      selected = null;
      gameOver = false;
      render("羊群先走：选择一只羊，再点向上斜方的空格。");
    }

    function endGame(message) {
      gameOver = true;
      selected = null;
      render(message);
    }

    function checkWin() {
      const wolf = cells.indexOf("W");
      if (rowOf(wolf) === size - 1) {
        endGame("狼抵达底边，狼获胜。");
        return true;
      }
      if (legalTargets(wolf, "W").length === 0) {
        endGame("狼没有合法移动，羊群获胜。");
        return true;
      }
      return false;
    }

    function switchTurn() {
      turn = turn === "S" ? "W" : "S";
      selected = null;
      if (!checkWin()) {
        render(turn === "S" ? "羊群回合：选择一只羊向上斜走。" : "狼回合：选择狼向下斜走。");
      }
    }

    function handleCell(index) {
      if (gameOver) return;
      const piece = cells[index];
      if (selected === null) {
        if ((turn === "S" && piece === "S") || (turn === "W" && piece === "W")) {
          selected = index;
          render(turn === "S" ? "选择这只羊的目标格。" : "选择狼的目标格。");
        }
        return;
      }
      if (selected === index) {
        selected = null;
        render("已取消选择。");
        return;
      }
      const movingPiece = cells[selected];
      if (piece === movingPiece) {
        selected = index;
        render("已切换选择。");
        return;
      }
      if (!legalTargets(selected, movingPiece).includes(index)) {
        render(turn === "S" ? "羊只能向上斜走到空格。" : "狼只能向下斜走到空格。");
        return;
      }
      cells[index] = movingPiece;
      cells[selected] = "";
      switchTurn();
    }

    function render(message) {
      const wolf = cells.indexOf("W");
      turnTextEl.textContent = gameOver ? "游戏结束" : turn === "S" ? "羊群" : "狼";
      wolfRowEl.textContent = rowOf(wolf) + 1;
      statusTextEl.textContent = message;
      boardEl.innerHTML = "";
      cells.forEach((piece, index) => {
        const row = rowOf(index);
        const col = colOf(index);
        const dark = (row + col) % 2 === 1;
        const button = document.createElement("button");
        const active = selected === index;
        button.className = [
          "flex aspect-square items-center justify-center rounded-sm border text-xl font-black transition sm:text-2xl",
          dark ? "border-slate-600 bg-slate-700" : "border-slate-800 bg-slate-900",
          active ? "ring-2 ring-emerald-300" : "hover:brightness-125",
          piece === "W" ? "text-rose-300" : piece === "S" ? "text-sky-300" : "text-slate-500"
        ].join(" ");
        button.setAttribute("aria-label", "row " + (row + 1) + " column " + (col + 1));
        button.textContent = piece === "W" ? "狼" : piece === "S" ? "羊" : "";
        button.addEventListener("click", () => handleCell(index));
        boardEl.appendChild(button);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
