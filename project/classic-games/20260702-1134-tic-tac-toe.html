<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Tic Tac Toe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col gap-5 px-4 py-6 sm:py-8">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-zinc-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-normal text-white">Mini Tic Tac Toe</h1>
        <p class="mt-1 text-sm text-zinc-400">Take turns placing marks. Three in a row wins.</p>
      </div>
      <button id="reset" class="rounded-md bg-lime-300 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-lime-200 focus:outline-none focus:ring-2 focus:ring-lime-100">
        Reset
      </button>
    </header>

    <section class="grid gap-5 sm:grid-cols-[1fr_12rem]">
      <div class="flex justify-center">
        <div id="board" class="grid aspect-square w-full max-w-[28rem] grid-cols-3 gap-3 rounded-md border border-zinc-800 bg-zinc-900 p-3 shadow-2xl shadow-lime-950/30" aria-label="Tic Tac Toe board"></div>
      </div>

      <aside class="grid content-start gap-3">
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <div class="text-xs uppercase tracking-wider text-zinc-500">Turn</div>
          <div id="turn" class="mt-1 text-3xl font-bold text-lime-300">X</div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
            <div class="text-xs uppercase tracking-wider text-zinc-500">X</div>
            <div id="xScore" class="mt-1 text-2xl font-bold text-lime-300">0</div>
          </div>
          <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
            <div class="text-xs uppercase tracking-wider text-zinc-500">O</div>
            <div id="oScore" class="mt-1 text-2xl font-bold text-cyan-300">0</div>
          </div>
        </div>
        <div id="status" class="rounded-md border border-zinc-800 bg-zinc-900 p-4 text-sm leading-6 text-zinc-300">
          X starts.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const wins = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];
    const boardEl = document.querySelector("#board");
    const turnEl = document.querySelector("#turn");
    const statusEl = document.querySelector("#status");
    const xScoreEl = document.querySelector("#xScore");
    const oScoreEl = document.querySelector("#oScore");
    const resetBtn = document.querySelector("#reset");
    let cells = Array(9).fill("");
    let turn = "X";
    let locked = false;
    let scores = { X: 0, O: 0 };

    function winner() {
      return wins.find((line) => line.every((index) => cells[index] && cells[index] === cells[line[0]]));
    }

    function resetBoard() {
      cells = Array(9).fill("");
      turn = "X";
      locked = false;
      statusEl.textContent = "X starts.";
      render();
    }

    function play(index) {
      if (locked || cells[index]) return;
      cells[index] = turn;
      const winLine = winner();
      if (winLine) {
        locked = true;
        scores[turn] += 1;
        statusEl.textContent = `${turn} wins. Reset for another round.`;
      } else if (cells.every(Boolean)) {
        locked = true;
        statusEl.textContent = "Draw. Reset for another round.";
      } else {
        turn = turn === "X" ? "O" : "X";
        statusEl.textContent = `${turn}'s turn.`;
      }
      render();
    }

    function render() {
      const winLine = winner() || [];
      boardEl.innerHTML = "";
      turnEl.textContent = locked ? "-" : turn;
      turnEl.className = `mt-1 text-3xl font-bold ${turn === "X" ? "text-lime-300" : "text-cyan-300"}`;
      xScoreEl.textContent = scores.X;
      oScoreEl.textContent = scores.O;
      cells.forEach((value, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "aspect-square rounded-md border text-6xl font-black transition focus:outline-none focus:ring-2 focus:ring-white",
          value === "X" ? "border-lime-300 bg-lime-300/10 text-lime-300" : "",
          value === "O" ? "border-cyan-300 bg-cyan-300/10 text-cyan-300" : "",
          value === "" ? "border-zinc-700 bg-zinc-950 hover:border-zinc-500" : "",
          winLine.includes(index) ? "ring-2 ring-white" : ""
        ].join(" ");
        button.textContent = value;
        button.setAttribute("aria-label", `Cell ${index + 1}`);
        button.addEventListener("click", () => play(index));
        boardEl.appendChild(button);
      });
    }

    resetBtn.addEventListener("click", resetBoard);
    resetBoard();
  </script>
</body>
</html>
