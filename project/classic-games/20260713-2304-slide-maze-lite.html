<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Slide Maze</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-indigo-800 bg-indigo-900 p-4 shadow-2xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Slide Maze</h1>
          <p class="mt-1 text-sm text-indigo-300">Slide until you hit a wall, then choose another direction to reach the exit.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-indigo-700 px-3 py-2 text-sm">Slides: <strong id="moves">0</strong></span>
          <button id="resetBtn" class="rounded bg-fuchsia-300 px-4 py-2 text-sm font-bold text-indigo-950 hover:bg-fuchsia-200">Reset</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_220px]">
        <div id="board" class="mx-auto grid aspect-square w-full max-w-[540px] grid-cols-7 grid-rows-7 gap-1 rounded-lg bg-indigo-950 p-3"></div>
        <aside class="flex flex-col gap-3 rounded-lg border border-indigo-800 bg-indigo-950 p-3">
          <div class="grid grid-cols-3 gap-2">
            <button data-dir="up" class="col-start-2 rounded bg-indigo-800 py-3 font-bold hover:bg-indigo-700">Up</button>
            <button data-dir="left" class="rounded bg-indigo-800 py-3 font-bold hover:bg-indigo-700">Left</button>
            <button data-dir="down" class="rounded bg-indigo-800 py-3 font-bold hover:bg-indigo-700">Down</button>
            <button data-dir="right" class="rounded bg-indigo-800 py-3 font-bold hover:bg-indigo-700">Right</button>
          </div>
          <div id="message" class="min-h-24 rounded border border-indigo-800 bg-indigo-900 p-3 text-sm text-indigo-200">Use buttons or arrow keys. The puck stops only before a wall.</div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const map = [
      '#######',
      '#S....#',
      '#.###.#',
      '#...#.#',
      '###.#.#',
      '#....E#',
      '#######'
    ];
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const message = document.getElementById('message');
    let walls = new Set();
    let exit = { row: 0, col: 0 };
    let player = { row: 0, col: 0 };
    let moves = 0;
    let won = false;

    function key(row, col) {
      return `${row},${col}`;
    }

    function resetGame() {
      walls = new Set();
      moves = 0;
      won = false;
      map.forEach((line, row) => {
        [...line].forEach((cell, col) => {
          if (cell === '#') walls.add(key(row, col));
          if (cell === 'S') player = { row, col };
          if (cell === 'E') exit = { row, col };
        });
      });
      message.textContent = 'Use buttons or arrow keys. The puck stops only before a wall.';
      render();
    }

    function slide(dir) {
      if (won) return;
      const delta = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
      let next = { row: player.row + delta[0], col: player.col + delta[1] };
      if (walls.has(key(next.row, next.col))) {
        message.textContent = 'A wall blocks that direction.';
        return;
      }
      while (!walls.has(key(next.row, next.col))) {
        player = next;
        next = { row: player.row + delta[0], col: player.col + delta[1] };
        if (player.row === exit.row && player.col === exit.col) break;
      }
      moves += 1;
      checkWin();
      render();
    }

    function checkWin() {
      won = player.row === exit.row && player.col === exit.col;
      message.textContent = won ? `Escaped in ${moves} slides.` : 'Stopped. Choose the next slide.';
    }

    function render() {
      boardEl.innerHTML = '';
      movesEl.textContent = moves;
      for (let row = 0; row < 7; row += 1) {
        for (let col = 0; col < 7; col += 1) {
          const tile = document.createElement('div');
          const isWall = walls.has(key(row, col));
          const isExit = row === exit.row && col === exit.col;
          const isPlayer = row === player.row && col === player.col;
          tile.className = `relative flex items-center justify-center rounded ${isWall ? 'bg-indigo-700' : isExit ? 'bg-emerald-500/30 ring-2 ring-emerald-300' : 'bg-indigo-800'}`;
          if (isExit) {
            const marker = document.createElement('span');
            marker.className = 'absolute text-sm font-black text-emerald-100';
            marker.textContent = 'EXIT';
            tile.appendChild(marker);
          }
          if (isPlayer) {
            const puck = document.createElement('div');
            puck.className = 'z-10 h-10 w-10 rounded-full bg-fuchsia-300 shadow-lg ring-4 ring-white';
            tile.appendChild(puck);
          }
          boardEl.appendChild(tile);
        }
      }
    }

    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('click', () => slide(button.dataset.dir));
    });
    document.addEventListener('keydown', event => {
      const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
      if (keys[event.key]) slide(keys[event.key]);
    });
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
