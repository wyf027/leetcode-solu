<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Lasca</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-slate-300 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-rose-700">Classic draughts variant</p>
        <h1 class="text-3xl font-bold">Mini Lasca</h1>
      </div>
      <button id="resetBtn" class="rounded bg-slate-950 px-4 py-2 text-sm font-semibold text-white hover:bg-slate-700">
        New game
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="rounded border border-slate-300 bg-white p-4 shadow-sm">
        <div id="board" class="mx-auto grid aspect-square max-w-[600px] grid-cols-6 gap-1 rounded bg-slate-800 p-2"></div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-slate-300 bg-white p-4 shadow-sm">
          <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Turn</p>
          <p id="turnText" class="mt-1 text-2xl font-bold">Red</p>
          <p id="statusText" class="mt-3 min-h-16 text-sm leading-6 text-slate-700"></p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="rounded border border-slate-300 bg-white p-4 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Red tops</p>
            <p id="redCount" class="mt-1 text-2xl font-bold text-rose-700">0</p>
          </div>
          <div class="rounded border border-slate-300 bg-white p-4 shadow-sm">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Blue tops</p>
            <p id="blueCount" class="mt-1 text-2xl font-bold text-sky-700">0</p>
          </div>
        </div>

        <div class="rounded border border-slate-300 bg-white p-4 text-sm leading-6 text-slate-700 shadow-sm">
          Move a top stone diagonally forward. Jump diagonally over an enemy top stone to capture it under your stack. Reaching the far row crowns the top stone, allowing movement both ways.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById("board");
    const resetBtn = document.getElementById("resetBtn");
    const turnText = document.getElementById("turnText");
    const statusText = document.getElementById("statusText");
    const redCount = document.getElementById("redCount");
    const blueCount = document.getElementById("blueCount");

    let board = [];
    let turn = "R";
    let selected = null;
    let gameOver = false;

    function startGame() {
      board = Array.from({ length: size * size }, () => []);
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          if ((row + col) % 2 === 1 && row < 2) board[toIndex(row, col)] = ["B"];
          if ((row + col) % 2 === 1 && row > 3) board[toIndex(row, col)] = ["R"];
        }
      }
      turn = "R";
      selected = null;
      gameOver = false;
      statusText.textContent = "Red starts. Select a top stone, then a highlighted square.";
      render();
    }

    function toIndex(row, col) {
      return row * size + col;
    }

    function toPoint(index) {
      return { row: Math.floor(index / size), col: index % size };
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function topPiece(index) {
      const stack = board[index];
      return stack.length ? stack[stack.length - 1] : "";
    }

    function owner(piece) {
      return piece.replace("K", "");
    }

    function isKing(piece) {
      return piece.includes("K");
    }

    function playerName(piece) {
      return piece === "R" ? "Red" : "Blue";
    }

    function opponent(piece) {
      return piece === "R" ? "B" : "R";
    }

    function directions(piece) {
      const top = topPiece(piece);
      if (isKing(top)) return [[1, 1], [1, -1], [-1, 1], [-1, -1]];
      return owner(top) === "R" ? [[-1, 1], [-1, -1]] : [[1, 1], [1, -1]];
    }

    function legalMoves(index) {
      const top = topPiece(index);
      if (!top || owner(top) !== turn) return [];
      const from = toPoint(index);
      const moves = [];

      directions(index).forEach(([dr, dc]) => {
        const step = { row: from.row + dr, col: from.col + dc };
        const jump = { row: from.row + dr * 2, col: from.col + dc * 2 };
        if (inBounds(step.row, step.col)) {
          const stepIndex = toIndex(step.row, step.col);
          if (!board[stepIndex].length) {
            moves.push({ to: stepIndex, capture: null });
          } else if (owner(topPiece(stepIndex)) === opponent(turn) && inBounds(jump.row, jump.col)) {
            const jumpIndex = toIndex(jump.row, jump.col);
            if (!board[jumpIndex].length) moves.push({ to: jumpIndex, capture: stepIndex });
          }
        }
      });

      return moves;
    }

    function allMoves(piece) {
      const current = turn;
      turn = piece;
      const moves = [];
      board.forEach((stack, index) => {
        if (stack.length && owner(topPiece(index)) === piece) {
          legalMoves(index).forEach((move) => moves.push({ from: index, ...move }));
        }
      });
      turn = current;
      return moves;
    }

    function countTops(piece) {
      return board.filter((stack) => stack.length && owner(stack[stack.length - 1]) === piece).length;
    }

    function promoteIfNeeded(index) {
      const stack = board[index];
      const top = stack[stack.length - 1];
      const row = toPoint(index).row;
      if (top === "R" && row === 0) stack[stack.length - 1] = "RK";
      if (top === "B" && row === size - 1) stack[stack.length - 1] = "BK";
    }

    function moveStack(from, move) {
      const moving = board[from];
      board[from] = [];

      if (move.capture !== null) {
        const capturedTop = board[move.capture].pop();
        moving.unshift(capturedTop);
      }

      board[move.to] = moving;
      promoteIfNeeded(move.to);
      finishTurn(move.capture !== null);
    }

    function finishTurn(captured) {
      const enemy = opponent(turn);
      if (countTops(enemy) === 0) {
        gameOver = true;
        statusText.textContent = `${playerName(turn)} wins by controlling every visible stack.`;
        render();
        return;
      }
      if (allMoves(enemy).length === 0) {
        gameOver = true;
        statusText.textContent = `${playerName(turn)} wins by blocking ${playerName(enemy)}.`;
        render();
        return;
      }
      turn = enemy;
      selected = null;
      statusText.textContent = captured
        ? `Captured stack. ${playerName(turn)} to move.`
        : `${playerName(turn)} to move.`;
      render();
    }

    function handleCell(index) {
      if (gameOver) return;
      const top = topPiece(index);

      if (top && owner(top) === turn) {
        selected = selected === index ? null : index;
        statusText.textContent = selected === null
          ? `${playerName(turn)} selection cleared.`
          : `${playerName(turn)} selected a stack.`;
        render();
        return;
      }

      if (selected !== null) {
        const move = legalMoves(selected).find((candidate) => candidate.to === index);
        if (move) moveStack(selected, move);
      }
    }

    function renderStack(stack) {
      const wrap = document.createElement("span");
      wrap.className = "relative mx-auto block h-12 w-12 sm:h-14 sm:w-14";

      stack.slice(0, 4).forEach((piece, layer) => {
        const chip = document.createElement("span");
        chip.className = [
          "absolute left-1/2 h-10 w-10 -translate-x-1/2 rounded-full border-4 shadow sm:h-12 sm:w-12",
          owner(piece) === "R" ? "border-rose-200 bg-rose-600" : "border-sky-200 bg-sky-700"
        ].join(" ");
        chip.style.bottom = `${layer * 4}px`;
        if (isKing(piece)) chip.textContent = "K";
        chip.classList.add("flex", "items-center", "justify-center", "text-xs", "font-black", "text-white");
        wrap.appendChild(chip);
      });

      if (stack.length > 1) {
        const badge = document.createElement("span");
        badge.className = "absolute -right-1 -top-1 rounded bg-slate-950 px-1.5 py-0.5 text-xs font-bold text-white";
        badge.textContent = stack.length;
        wrap.appendChild(badge);
      }
      return wrap;
    }

    function render() {
      boardEl.innerHTML = "";
      const moves = selected === null ? [] : legalMoves(selected).map((move) => move.to);

      board.forEach((stack, index) => {
        const { row, col } = toPoint(index);
        const playable = (row + col) % 2 === 1;
        const isMove = moves.includes(index);
        const isSelected = selected === index;
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = [
          "aspect-square rounded border transition",
          playable ? "border-slate-700 bg-slate-700" : "border-slate-200 bg-slate-200",
          isMove ? "outline outline-4 outline-emerald-400" : "",
          isSelected ? "ring-4 ring-amber-300" : "",
          gameOver ? "cursor-default" : "hover:scale-[1.02]"
        ].join(" ");
        cell.setAttribute("aria-label", `Lasca square ${index + 1}`);
        cell.addEventListener("click", () => handleCell(index));
        if (stack.length) cell.appendChild(renderStack(stack));
        if (!stack.length && isMove) {
          const dot = document.createElement("span");
          dot.className = "mx-auto block h-4 w-4 rounded-full bg-emerald-400";
          cell.appendChild(dot);
        }
        boardEl.appendChild(cell);
      });

      turnText.textContent = gameOver ? "Game over" : playerName(turn);
      redCount.textContent = countTops("R");
      blueCount.textContent = countTops("B");
    }

    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
