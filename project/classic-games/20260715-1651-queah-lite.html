<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Queah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-stone-700 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Mini Queah</h1>
        <p class="mt-1 max-w-2xl text-sm text-stone-300">轮流斜向移动棋子，或跳过对手棋子完成捕获。吃掉 4 枚，或让对手无棋可走，即可获胜。</p>
      </div>
      <button id="resetBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-bold text-stone-950 hover:bg-amber-200">重新开始</button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_320px]">
      <div class="rounded border border-stone-700 bg-stone-900 p-4 shadow">
        <div id="board" class="grid aspect-square grid-cols-5 gap-2"></div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-stone-700 bg-stone-900 p-4 shadow">
          <div class="text-xs font-semibold uppercase tracking-widest text-stone-400">当前回合</div>
          <div id="turnText" class="mt-1 text-2xl font-bold"></div>
          <p id="statusText" class="mt-3 min-h-20 text-sm leading-6 text-stone-300"></p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="rounded border border-stone-700 bg-stone-900 p-4 text-center shadow">
            <div class="text-xs font-semibold uppercase tracking-widest text-stone-400">红方捕获</div>
            <div id="redScore" class="mt-2 text-3xl font-black text-rose-300"></div>
          </div>
          <div class="rounded border border-stone-700 bg-stone-900 p-4 text-center shadow">
            <div class="text-xs font-semibold uppercase tracking-widest text-stone-400">蓝方捕获</div>
            <div id="blueScore" class="mt-2 text-3xl font-black text-sky-300"></div>
          </div>
        </div>

        <div class="rounded border border-stone-700 bg-stone-900 p-4 shadow">
          <div class="text-xs font-semibold uppercase tracking-widest text-stone-400">操作</div>
          <p class="mt-2 text-sm leading-6 text-stone-300">先选己方棋子，再点高亮目标。浅色点为斜走，金色点为跳吃。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const turnText = document.getElementById('turnText');
    const statusText = document.getElementById('statusText');
    const redScore = document.getElementById('redScore');
    const blueScore = document.getElementById('blueScore');
    const resetBtn = document.getElementById('resetBtn');
    const size = 5;
    const players = [
      { name: '红方', key: 'red', color: 'bg-rose-500', text: 'text-rose-300', mark: '红' },
      { name: '蓝方', key: 'blue', color: 'bg-sky-500', text: 'text-sky-300', mark: '蓝' }
    ];
    let game;

    function resetGame() {
      game = {
        turn: 0,
        selected: null,
        winner: null,
        captures: [0, 0],
        cells: Array.from({ length: size * size }, () => null),
        message: '红方先手。选择一枚红棋，斜向移动或跳吃。'
      };
      [1, 3, 5, 9].forEach((index) => { game.cells[index] = 'red'; });
      [15, 19, 21, 23].forEach((index) => { game.cells[index] = 'blue'; });
      render();
    }

    function row(index) {
      return Math.floor(index / size);
    }

    function col(index) {
      return index % size;
    }

    function indexAt(r, c) {
      if (r < 0 || r >= size || c < 0 || c >= size) return -1;
      return r * size + c;
    }

    function ownerAt(index) {
      const piece = game.cells[index];
      return piece === 'red' ? 0 : piece === 'blue' ? 1 : null;
    }

    function legalMoves(index) {
      const owner = ownerAt(index);
      if (owner === null) return [];
      const enemy = players[1 - owner].key;
      const moves = [];
      [-1, 1].forEach((dr) => {
        [-1, 1].forEach((dc) => {
          const step = indexAt(row(index) + dr, col(index) + dc);
          if (step !== -1 && game.cells[step] === null) {
            moves.push({ to: step, capture: null });
          }
          if (step !== -1 && game.cells[step] === enemy) {
            const landing = indexAt(row(index) + dr * 2, col(index) + dc * 2);
            if (landing !== -1 && game.cells[landing] === null) {
              moves.push({ to: landing, capture: step });
            }
          }
        });
      });
      return moves;
    }

    function playerHasMove(playerIndex) {
      return game.cells.some((piece, index) => piece === players[playerIndex].key && legalMoves(index).length > 0);
    }

    function selectCell(index) {
      if (game.winner !== null) return;
      const owner = ownerAt(index);
      if (game.selected === null) {
        if (owner !== game.turn) {
          game.message = `请选择${players[game.turn].name}自己的棋子。`;
          render();
          return;
        }
        if (!legalMoves(index).length) {
          game.message = '这枚棋子没有合法移动。';
          render();
          return;
        }
        game.selected = index;
        game.message = '选择一个高亮目标完成移动。';
        render();
        return;
      }

      if (owner === game.turn) {
        game.selected = index;
        game.message = '已改选棋子。';
        render();
        return;
      }

      const move = legalMoves(game.selected).find((item) => item.to === index);
      if (!move) {
        game.message = '只能斜向走一步，或跳过对手棋子。';
        render();
        return;
      }

      const mover = game.turn;
      game.cells[index] = players[mover].key;
      game.cells[game.selected] = null;
      if (move.capture !== null) {
        game.cells[move.capture] = null;
        game.captures[mover] += 1;
        game.message = `${players[mover].name} 跳吃一枚棋子。`;
      } else {
        game.message = `${players[mover].name} 移动完成。`;
      }
      game.selected = null;
      game.turn = 1 - game.turn;
      checkWinner();
      if (game.winner === null) {
        game.message += ` 轮到${players[game.turn].name}。`;
      }
      render();
    }

    function checkWinner() {
      const previous = 1 - game.turn;
      if (game.captures[previous] >= 4) {
        game.winner = previous;
        game.message = `${players[previous].name} 捕获 4 枚棋子，获得胜利。`;
        return;
      }
      if (!playerHasMove(game.turn)) {
        game.winner = previous;
        game.message = `${players[previous].name} 封住对手所有移动，获得胜利。`;
      }
    }

    function render() {
      const moves = game.selected === null ? [] : legalMoves(game.selected);
      const targets = moves.map((move) => move.to);
      turnText.textContent = game.winner === null ? players[game.turn].name : `${players[game.winner].name}胜利`;
      turnText.className = `mt-1 text-2xl font-bold ${players[game.winner ?? game.turn].text}`;
      statusText.textContent = game.message;
      redScore.textContent = `${game.captures[0]}/4`;
      blueScore.textContent = `${game.captures[1]}/4`;
      boardEl.innerHTML = game.cells.map((piece, index) => {
        const owner = ownerAt(index);
        const selected = game.selected === index;
        const target = targets.includes(index);
        const move = moves.find((item) => item.to === index);
        const player = owner === null ? null : players[owner];
        const dark = (row(index) + col(index)) % 2 === 0;
        return `
          <button class="relative flex items-center justify-center rounded border text-lg font-black transition ${selected ? 'border-amber-300 bg-amber-300/20' : target ? (move.capture === null ? 'border-emerald-300 bg-emerald-300/20' : 'border-amber-300 bg-amber-300/20') : dark ? 'border-stone-700 bg-stone-800 hover:bg-stone-700' : 'border-stone-700 bg-stone-900 hover:bg-stone-800'}" data-index="${index}">
            <span class="absolute left-1 top-1 text-xs font-semibold text-stone-500">${index + 1}</span>
            ${player ? `<span class="flex h-12 w-12 items-center justify-center rounded-full ${player.color} text-white">${player.mark}</span>` : target ? `<span class="h-5 w-5 rounded-full ${move.capture === null ? 'bg-emerald-300' : 'bg-amber-300'}"></span>` : ''}
          </button>
        `;
      }).join('');
      boardEl.querySelectorAll('button[data-index]').forEach((button) => {
        button.addEventListener('click', () => selectCell(Number(button.dataset.index)));
      });
    }

    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
