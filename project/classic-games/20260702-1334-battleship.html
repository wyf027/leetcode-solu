<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Battleship</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-cyan-900 bg-slate-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal text-white">Mini Battleship</h1>
          <p class="mt-1 text-sm text-slate-400">在 6 x 6 海域中找出 3 艘隐藏舰船，18 发炮弹内全数击沉。</p>
        </div>
        <button id="reset" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-300">
          重新布阵
        </button>
      </div>

      <div class="mb-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="rounded-md bg-slate-800 px-3 py-2">
          <div class="text-slate-400">炮弹</div>
          <div id="shots" class="text-xl font-semibold text-white">18</div>
        </div>
        <div class="rounded-md bg-slate-800 px-3 py-2">
          <div class="text-slate-400">命中</div>
          <div id="hits" class="text-xl font-semibold text-white">0 / 7</div>
        </div>
        <div class="rounded-md bg-slate-800 px-3 py-2">
          <div class="text-slate-400">状态</div>
          <div id="status" class="text-xl font-semibold text-white">搜索中</div>
        </div>
      </div>

      <div id="board" class="mx-auto grid w-full max-w-md grid-cols-6 gap-2 rounded-lg bg-slate-950 p-3"></div>
    </section>
  </main>

  <script>
    const size = 6;
    const fleet = [3, 2, 2];
    const maxShots = 18;
    const boardEl = document.getElementById("board");
    const shotsEl = document.getElementById("shots");
    const hitsEl = document.getElementById("hits");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    let ships = new Set();
    let fired = new Set();
    let shots = maxShots;
    let gameOver = false;

    function resetGame() {
      ships = placeFleet();
      fired = new Set();
      shots = maxShots;
      gameOver = false;
      render();
    }

    function placeFleet() {
      const occupied = new Set();
      for (const length of fleet) {
        let placed = false;
        while (!placed) {
          const horizontal = Math.random() > 0.5;
          const row = Math.floor(Math.random() * (horizontal ? size : size - length + 1));
          const col = Math.floor(Math.random() * (horizontal ? size - length + 1 : size));
          const cells = Array.from({ length }, (_, index) => {
            const r = row + (horizontal ? 0 : index);
            const c = col + (horizontal ? index : 0);
            return `${r},${c}`;
          });
          if (cells.every(cell => !occupied.has(cell))) {
            cells.forEach(cell => occupied.add(cell));
            placed = true;
          }
        }
      }
      return occupied;
    }

    function fire(row, col) {
      const key = `${row},${col}`;
      if (gameOver || fired.has(key) || shots === 0) return;
      fired.add(key);
      shots--;
      const hitCount = countHits();
      if (hitCount === ships.size) {
        gameOver = true;
        statusEl.textContent = "胜利";
      } else if (shots === 0) {
        gameOver = true;
        statusEl.textContent = "失败";
      }
      render();
    }

    function countHits() {
      let total = 0;
      for (const cell of fired) {
        if (ships.has(cell)) total++;
      }
      return total;
    }

    function render() {
      boardEl.innerHTML = "";
      const hitCount = countHits();
      shotsEl.textContent = shots;
      hitsEl.textContent = `${hitCount} / ${ships.size}`;
      if (!gameOver) statusEl.textContent = "搜索中";

      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const key = `${row},${col}`;
          const wasFired = fired.has(key);
          const wasHit = wasFired && ships.has(key);
          const tile = document.createElement("button");
          tile.type = "button";
          tile.className = [
            "aspect-square rounded-md border text-lg font-bold transition focus:outline-none focus:ring-2 focus:ring-cyan-200",
            wasHit ? "border-red-300 bg-red-500 text-white" :
            wasFired ? "border-slate-500 bg-slate-700 text-slate-300" :
            "border-cyan-900 bg-cyan-950 text-cyan-100 hover:bg-cyan-800"
          ].join(" ");
          tile.textContent = wasHit ? "X" : wasFired ? "." : "";
          tile.disabled = gameOver || wasFired;
          tile.setAttribute("aria-label", `第 ${row + 1} 行第 ${col + 1} 列`);
          tile.addEventListener("click", () => fire(row, col));
          boardEl.appendChild(tile);
        }
      }
    }

    resetEl.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
