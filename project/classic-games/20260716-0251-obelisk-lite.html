<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Obelisk</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.18em] text-fuchsia-300">Classic Mini Game</p>
        <h1 class="text-3xl font-bold">Mini Obelisk</h1>
      </div>
      <button id="resetBtn" class="rounded-md bg-fuchsia-400 px-4 py-2 font-semibold text-gray-950 hover:bg-fuchsia-300">重新开始</button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_300px]">
      <div class="rounded-lg border border-gray-700 bg-gray-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-4 gap-2"></div>
      </div>

      <aside class="rounded-lg border border-gray-700 bg-gray-900 p-4">
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="rounded-md bg-gray-800 p-3">
            <p class="text-xs text-gray-400">紫方得分</p>
            <p id="scoreA" class="text-2xl font-bold text-fuchsia-300">0</p>
          </div>
          <div class="rounded-md bg-gray-800 p-3">
            <p class="text-xs text-gray-400">青方得分</p>
            <p id="scoreB" class="text-2xl font-bold text-cyan-300">0</p>
          </div>
        </div>
        <div class="mt-4 rounded-md bg-gray-800 p-3">
          <p class="text-xs text-gray-400">当前回合</p>
          <p id="turnText" class="mt-1 text-lg font-semibold">紫方</p>
        </div>
        <div class="mt-4 rounded-md bg-gray-800 p-3">
          <p id="statusText" class="text-sm leading-6 text-gray-200">轮流在未封顶塔上放置一块己方石。塔高达到 4 时封顶，最顶层玩家得 1 分，先得 5 分获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const resetBtn = document.getElementById("resetBtn");
    const scoreAEl = document.getElementById("scoreA");
    const scoreBEl = document.getElementById("scoreB");
    const turnTextEl = document.getElementById("turnText");
    const statusTextEl = document.getElementById("statusText");
    const size = 4;
    const maxHeight = 4;
    const targetScore = 5;
    let towers;
    let scores;
    let turn;
    let gameOver;

    function resetGame() {
      towers = Array(size * size).fill(null).map(() => []);
      scores = { A: 0, B: 0 };
      turn = "A";
      gameOver = false;
      render("紫方先手：选择任意未封顶塔放置石块。");
    }

    function playerName(player) {
      return player === "A" ? "紫方" : "青方";
    }

    function isFull(tower) {
      return tower.length >= maxHeight;
    }

    function boardFull() {
      return towers.every(isFull);
    }

    function endGame(message) {
      gameOver = true;
      render(message);
    }

    function placeStone(index) {
      if (gameOver) return;
      const tower = towers[index];
      if (isFull(tower)) {
        render("这座塔已经封顶，请选择其他塔。");
        return;
      }
      tower.push(turn);
      let message = playerName(turn) + "在第 " + (index + 1) + " 座塔放置石块。";
      if (tower.length === maxHeight) {
        scores[turn]++;
        message = playerName(turn) + "封顶一座方尖塔并获得 1 分。";
      }
      if (scores[turn] >= targetScore) {
        endGame(playerName(turn) + "达到 5 分，赢得 Mini Obelisk。");
        return;
      }
      if (boardFull()) {
        const winner = scores.A === scores.B ? "双方平局" : scores.A > scores.B ? "紫方获胜" : "青方获胜";
        endGame(winner + "，最终比分 " + scores.A + " : " + scores.B + "。");
        return;
      }
      turn = turn === "A" ? "B" : "A";
      render(message);
    }

    function towerBars(tower) {
      const bars = [];
      for (let level = maxHeight - 1; level >= 0; level--) {
        const owner = tower[level];
        bars.push("<span class=\"" + [
          "block h-5 w-14 rounded-sm border",
          owner === "A" ? "border-fuchsia-300 bg-fuchsia-400" : owner === "B" ? "border-cyan-300 bg-cyan-400" : "border-gray-700 bg-gray-800"
        ].join(" ") + "\"></span>");
      }
      return bars.join("");
    }

    function render(message) {
      scoreAEl.textContent = scores.A;
      scoreBEl.textContent = scores.B;
      turnTextEl.textContent = gameOver ? "游戏结束" : playerName(turn);
      statusTextEl.textContent = message;
      boardEl.innerHTML = "";
      towers.forEach((tower, index) => {
        const button = document.createElement("button");
        const top = tower[tower.length - 1];
        button.className = [
          "flex aspect-square flex-col items-center justify-center gap-1 rounded-lg border p-2 transition",
          isFull(tower) ? "border-amber-300 bg-amber-300/10" : "border-gray-700 bg-gray-800 hover:border-fuchsia-300 hover:bg-gray-700",
          top === "A" ? "text-fuchsia-200" : top === "B" ? "text-cyan-200" : "text-gray-400"
        ].join(" ");
        button.setAttribute("aria-label", "tower " + (index + 1));
        button.innerHTML = "<span class=\"text-xs\">塔 " + (index + 1) + " / 高 " + tower.length + "</span><span class=\"flex flex-col-reverse items-center gap-1\">" + towerBars(tower) + "</span>";
        button.addEventListener("click", () => placeStone(index));
        boardEl.appendChild(button);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
