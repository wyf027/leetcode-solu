<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Quick Maze</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-gray-700 bg-gray-900 p-4 shadow-2xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Quick Maze</h1>
          <p class="mt-1 text-sm text-gray-300">Reach the green exit in as few steps as possible.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-gray-700 px-3 py-2 text-sm">Steps: <strong id="steps">0</strong></span>
          <button id="resetBtn" class="rounded bg-green-300 px-4 py-2 text-sm font-bold text-gray-950 hover:bg-green-200">Reset</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_220px]">
        <div id="maze" class="mx-auto grid aspect-square w-full max-w-[520px] grid-cols-9 grid-rows-9 gap-1 rounded-lg bg-gray-950 p-3"></div>
        <aside class="flex flex-col gap-3 rounded-lg border border-gray-700 bg-gray-950 p-3">
          <div class="grid grid-cols-3 gap-2">
            <span></span>
            <button class="move rounded bg-gray-800 p-3 font-bold hover:bg-gray-700" data-dir="up">↑</button>
            <span></span>
            <button class="move rounded bg-gray-800 p-3 font-bold hover:bg-gray-700" data-dir="left">←</button>
            <button class="move rounded bg-gray-800 p-3 font-bold hover:bg-gray-700" data-dir="down">↓</button>
            <button class="move rounded bg-gray-800 p-3 font-bold hover:bg-gray-700" data-dir="right">→</button>
          </div>
          <p id="message" class="min-h-28 rounded border border-gray-700 bg-gray-900 p-3 text-sm text-gray-300">Use arrow keys or buttons. Blue is you, green is the exit.</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const layout = [
      'S..#.....',
      '##.#.###.',
      '...#...#.',
      '.#####.#.',
      '.#.....#.',
      '.#.###.#.',
      '.#...#...',
      '.###.###.',
      '.....#..E'
    ];
    const size = layout.length;
    const mazeEl = document.getElementById('maze');
    const stepsEl = document.getElementById('steps');
    const message = document.getElementById('message');
    const resetBtn = document.getElementById('resetBtn');
    let player = { row: 0, col: 0 };
    let exit = { row: 8, col: 8 };
    let steps = 0;
    let won = false;

    function findTile(symbol) {
      for (let row = 0; row < size; row += 1) {
        const col = layout[row].indexOf(symbol);
        if (col >= 0) return { row, col };
      }
      return { row: 0, col: 0 };
    }

    function resetGame() {
      player = findTile('S');
      exit = findTile('E');
      steps = 0;
      won = false;
      message.textContent = 'Use arrow keys or buttons. Blue is you, green is the exit.';
      render();
    }

    function targetFor(dir) {
      const next = { ...player };
      if (dir === 'up') next.row -= 1;
      if (dir === 'down') next.row += 1;
      if (dir === 'left') next.col -= 1;
      if (dir === 'right') next.col += 1;
      return next;
    }

    function canMove(tile) {
      return tile.row >= 0 && tile.row < size && tile.col >= 0 && tile.col < size && layout[tile.row][tile.col] !== '#';
    }

    function movePlayer(dir) {
      if (won) return;
      const next = targetFor(dir);
      if (!canMove(next)) {
        message.textContent = 'Wall blocked the move.';
        return;
      }
      player = next;
      steps += 1;
      if (player.row === exit.row && player.col === exit.col) {
        won = true;
        message.textContent = `Escaped in ${steps} steps.`;
      } else {
        message.textContent = 'Keep moving toward the exit.';
      }
      render();
    }

    function handleKey(event) {
      const keyMap = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
      if (keyMap[event.key]) {
        event.preventDefault();
        movePlayer(keyMap[event.key]);
      }
    }

    function render() {
      mazeEl.innerHTML = '';
      stepsEl.textContent = steps;
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const cell = document.createElement('div');
          const isPlayer = player.row === row && player.col === col;
          const isExit = exit.row === row && exit.col === col;
          const isWall = layout[row][col] === '#';
          cell.className = `rounded ${isPlayer ? 'bg-sky-400' : isExit ? 'bg-green-400' : isWall ? 'bg-gray-700' : 'bg-gray-900'}`;
          mazeEl.appendChild(cell);
        }
      }
    }

    document.querySelectorAll('.move').forEach(button => {
      button.addEventListener('click', () => movePlayer(button.dataset.dir));
    });
    resetBtn.addEventListener('click', resetGame);
    window.addEventListener('keydown', handleKey);
    resetGame();
  </script>
</body>
</html>
