<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Nim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-slate-700 bg-slate-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-sky-300">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Nim</h1>
        </div>
        <button id="resetBtn" class="rounded bg-sky-400 px-4 py-2 font-semibold text-slate-950 hover:bg-sky-300">
          New Pile
        </button>
      </div>

      <div class="grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-slate-700 bg-slate-800 p-4">
          <p class="text-sm text-slate-400">Pile</p>
          <p id="pileCount" class="text-4xl font-bold text-sky-300">21</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-800 p-4">
          <p class="text-sm text-slate-400">Last Move</p>
          <p id="lastMove" class="text-3xl font-bold">-</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-800 p-4">
          <p class="text-sm text-slate-400">Turn</p>
          <p id="turnText" class="text-3xl font-bold">You</p>
        </div>
      </div>

      <div id="stones" class="my-6 flex min-h-32 flex-wrap content-start gap-2 rounded border border-slate-700 bg-slate-950 p-4"></div>

      <div class="grid grid-cols-3 gap-3">
        <button data-take="1" class="rounded bg-slate-800 px-3 py-4 text-lg font-bold hover:bg-slate-700">Take 1</button>
        <button data-take="2" class="rounded bg-slate-800 px-3 py-4 text-lg font-bold hover:bg-slate-700">Take 2</button>
        <button data-take="3" class="rounded bg-slate-800 px-3 py-4 text-lg font-bold hover:bg-slate-700">Take 3</button>
      </div>

      <p id="statusText" class="mt-5 min-h-6 rounded border border-slate-700 bg-slate-950 p-3 font-semibold">
        Take 1 to 3 stones. Whoever takes the last stone wins.
      </p>
    </section>
  </main>

  <script>
    const startPile = 21;
    const maxTake = 3;
    const state = { pile: startPile, gameOver: false, playerTurn: true };

    const pileCount = document.getElementById("pileCount");
    const lastMove = document.getElementById("lastMove");
    const turnText = document.getElementById("turnText");
    const stones = document.getElementById("stones");
    const statusText = document.getElementById("statusText");
    const resetBtn = document.getElementById("resetBtn");

    function renderStones() {
      stones.innerHTML = "";
      for (let index = 0; index < state.pile; index += 1) {
        const stone = document.createElement("span");
        stone.className = "h-6 w-6 rounded-full bg-sky-300 shadow shadow-sky-900";
        stones.appendChild(stone);
      }
    }

    function render() {
      pileCount.textContent = state.pile;
      turnText.textContent = state.gameOver ? "Done" : state.playerTurn ? "You" : "Computer";
      renderStones();
      document.querySelectorAll("[data-take]").forEach((button) => {
        const amount = Number(button.dataset.take);
        button.disabled = state.gameOver || !state.playerTurn || amount > state.pile;
        button.classList.toggle("opacity-40", button.disabled);
        button.classList.toggle("cursor-not-allowed", button.disabled);
      });
    }

    function legalTake(amount) {
      return Math.max(1, Math.min(maxTake, amount, state.pile));
    }

    function finishMove(actor, amount) {
      state.pile -= amount;
      lastMove.textContent = `${actor} ${amount}`;
      if (state.pile === 0) {
        state.gameOver = true;
        statusText.textContent = actor === "You" ? "You took the last stone. Match won." : "Computer took the last stone. Match lost.";
      }
      render();
    }

    function computerMove() {
      if (state.gameOver) return;
      const target = (state.pile - 1) % (maxTake + 1);
      const amount = legalTake(target === 0 ? 1 : target);
      finishMove("Computer", amount);
      if (!state.gameOver) {
        state.playerTurn = true;
        statusText.textContent = "Your move. Take 1 to 3 stones.";
        render();
      }
    }

    function playerMove(amount) {
      if (state.gameOver || !state.playerTurn || amount > state.pile) return;
      state.playerTurn = false;
      finishMove("You", amount);
      if (!state.gameOver) {
        statusText.textContent = "Computer is choosing a move.";
        window.setTimeout(computerMove, 350);
      }
    }

    function resetGame() {
      state.pile = startPile;
      state.gameOver = false;
      state.playerTurn = true;
      lastMove.textContent = "-";
      statusText.textContent = "Take 1 to 3 stones. Whoever takes the last stone wins.";
      render();
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-take]");
      if (!button) return;
      playerMove(Number(button.dataset.take));
    });

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
