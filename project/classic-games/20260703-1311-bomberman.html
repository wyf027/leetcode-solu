<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Bomberman</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
      <section class="w-full max-w-2xl rounded-lg border border-zinc-700 bg-zinc-900 p-4 shadow-2xl">
        <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Bomberman</h1>
            <p class="mt-1 text-sm text-zinc-400">放置炸弹炸开砖块，找到出口并避开巡逻敌人。</p>
          </div>
          <button
            id="resetButton"
            class="rounded bg-rose-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-rose-300"
            type="button"
          >
            重新开始
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-zinc-700 bg-zinc-800 p-2">
            <div class="text-zinc-400">砖块</div>
            <div id="brickStatus" class="font-semibold">0</div>
          </div>
          <div class="rounded border border-zinc-700 bg-zinc-800 p-2">
            <div class="text-zinc-400">步数</div>
            <div id="moveStatus" class="font-semibold">0</div>
          </div>
          <div class="rounded border border-zinc-700 bg-zinc-800 p-2">
            <div class="text-zinc-400">状态</div>
            <div id="stateStatus" class="font-semibold">探索</div>
          </div>
        </div>

        <canvas
          id="gameCanvas"
          class="mt-4 block w-full rounded border border-zinc-700 bg-zinc-950"
          width="416"
          height="416"
        ></canvas>

        <div id="message" class="mt-3 min-h-6 text-center text-sm font-semibold text-rose-300"></div>

        <div class="mt-4 grid grid-cols-3 gap-2">
          <span></span>
          <button class="moveButton rounded bg-zinc-700 py-2 hover:bg-zinc-600" data-dir="up" type="button">上</button>
          <span></span>
          <button class="moveButton rounded bg-zinc-700 py-2 hover:bg-zinc-600" data-dir="left" type="button">左</button>
          <button class="moveButton rounded bg-zinc-700 py-2 hover:bg-zinc-600" data-dir="bomb" type="button">炸弹</button>
          <button class="moveButton rounded bg-zinc-700 py-2 hover:bg-zinc-600" data-dir="right" type="button">右</button>
          <span></span>
          <button class="moveButton rounded bg-zinc-700 py-2 hover:bg-zinc-600" data-dir="down" type="button">下</button>
          <span></span>
        </div>
      </section>
    </main>

    <script>
      const levelMap = [
        "#############",
        "#P..B..B...E#",
        "#.#.#.#.#.#.#",
        "#B..B..B..B.#",
        "#.#.#.#.#.#.#",
        "#..B..B..B..#",
        "#.#.#.#.#.#.#",
        "#B..N..B..B.#",
        "#.#.#.#.#.#.#",
        "#..B..B..N..#",
        "#.#.#.#.#.#.#",
        "#B..B..B..B.#",
        "#############",
      ];

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const brickStatus = document.getElementById("brickStatus");
      const moveStatus = document.getElementById("moveStatus");
      const stateStatus = document.getElementById("stateStatus");
      const message = document.getElementById("message");
      const resetButton = document.getElementById("resetButton");
      const tileSize = 32;

      let grid;
      let player;
      let enemies;
      let bomb;
      let flames;
      let moves;
      let bricksLeft;
      let gameOver;

      function resetGame() {
        grid = levelMap.map((row) => row.split(""));
        player = { x: 1, y: 1 };
        enemies = [];
        bomb = null;
        flames = [];
        moves = 0;
        bricksLeft = 0;
        gameOver = false;
        message.textContent = "方向键或 WASD 移动，空格放炸弹。";

        for (let y = 0; y < grid.length; y += 1) {
          for (let x = 0; x < grid[y].length; x += 1) {
            if (grid[y][x] === "P") {
              player = { x, y };
              grid[y][x] = ".";
            }
            if (grid[y][x] === "N") {
              enemies.push({ x, y, dir: 1 });
              grid[y][x] = ".";
            }
            if (grid[y][x] === "B") {
              bricksLeft += 1;
            }
          }
        }

        renderBoard();
        updateStatus();
      }

      function renderBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < grid.length; y += 1) {
          for (let x = 0; x < grid[y].length; x += 1) {
            drawTile(grid[y][x], x, y);
          }
        }
        flames.forEach(drawFlame);
        if (bomb) {
          drawBomb(bomb);
        }
        enemies.forEach(drawEnemy);
        drawPlayer();
      }

      function drawTile(tile, x, y) {
        const left = x * tileSize;
        const top = y * tileSize;
        ctx.fillStyle = "#18181b";
        ctx.fillRect(left, top, tileSize, tileSize);

        if (tile === "#") {
          ctx.fillStyle = "#52525b";
          ctx.fillRect(left + 1, top + 1, tileSize - 2, tileSize - 2);
        } else if (tile === "B") {
          ctx.fillStyle = "#92400e";
          ctx.fillRect(left + 3, top + 3, tileSize - 6, tileSize - 6);
          ctx.strokeStyle = "#fed7aa";
          ctx.strokeRect(left + 8, top + 8, tileSize - 16, tileSize - 16);
        } else if (tile === "E") {
          ctx.fillStyle = bricksLeft <= 5 ? "#22c55e" : "#3f3f46";
          ctx.fillRect(left + 7, top + 5, tileSize - 14, tileSize - 10);
        }

        ctx.strokeStyle = "#27272a";
        ctx.strokeRect(left, top, tileSize, tileSize);
      }

      function drawPlayer() {
        const cx = player.x * tileSize + tileSize / 2;
        const cy = player.y * tileSize + tileSize / 2;
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(cx, cy, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(cx - 5, cy - 4, 3, 3);
        ctx.fillRect(cx + 3, cy - 4, 3, 3);
      }

      function drawEnemy(enemy) {
        const cx = enemy.x * tileSize + tileSize / 2;
        const cy = enemy.y * tileSize + tileSize / 2;
        ctx.fillStyle = "#fb7185";
        ctx.beginPath();
        ctx.arc(cx, cy, 11, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBomb(item) {
        const cx = item.x * tileSize + tileSize / 2;
        const cy = item.y * tileSize + tileSize / 2;
        ctx.fillStyle = item.timer % 2 === 0 ? "#111827" : "#f8fafc";
        ctx.beginPath();
        ctx.arc(cx, cy, 10, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawFlame(point) {
        ctx.fillStyle = "#f97316";
        ctx.fillRect(point.x * tileSize + 4, point.y * tileSize + 4, tileSize - 8, tileSize - 8);
      }

      function movePlayer(dx, dy) {
        if (gameOver) {
          return;
        }

        tickBomb();
        const nextX = player.x + dx;
        const nextY = player.y + dy;
        if (!canMoveTo(nextX, nextY)) {
          message.textContent = "这里过不去。";
          moveEnemies();
          checkGameState();
          renderBoard();
          updateStatus();
          return;
        }

        player = { x: nextX, y: nextY };
        moves += 1;
        moveEnemies();
        checkGameState();
        renderBoard();
        updateStatus();
      }

      function canMoveTo(x, y) {
        const tile = grid[y]?.[x];
        if (!tile || tile === "#" || tile === "B") {
          return false;
        }
        if (bomb && bomb.x === x && bomb.y === y) {
          return false;
        }
        if (tile === "E" && bricksLeft > 5) {
          return false;
        }
        return true;
      }

      function placeBomb() {
        if (gameOver || bomb) {
          return;
        }
        bomb = { x: player.x, y: player.y, timer: 3 };
        message.textContent = "炸弹已放置，移动三步后爆炸。";
        renderBoard();
      }

      function tickBomb() {
        if (!bomb) {
          flames = [];
          return;
        }
        bomb.timer -= 1;
        if (bomb.timer <= 0) {
          explodeBomb();
        }
      }

      function explodeBomb() {
        const blast = [{ x: bomb.x, y: bomb.y }];
        const directions = [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
        ];

        directions.forEach(([dx, dy]) => {
          for (let step = 1; step <= 2; step += 1) {
            const x = bomb.x + dx * step;
            const y = bomb.y + dy * step;
            if (grid[y][x] === "#") {
              break;
            }
            blast.push({ x, y });
            if (grid[y][x] === "B") {
              grid[y][x] = ".";
              bricksLeft -= 1;
              break;
            }
          }
        });

        flames = blast;
        enemies = enemies.filter((enemy) => !blast.some((point) => point.x === enemy.x && point.y === enemy.y));
        bomb = null;
        message.textContent = "爆炸清出一条路。";
      }

      function moveEnemies() {
        enemies = enemies.map((enemy) => {
          let nextX = enemy.x + enemy.dir;
          if (!canEnemyMoveTo(nextX, enemy.y)) {
            enemy.dir *= -1;
            nextX = enemy.x + enemy.dir;
          }
          if (canEnemyMoveTo(nextX, enemy.y)) {
            return { x: nextX, y: enemy.y, dir: enemy.dir };
          }
          return enemy;
        });
      }

      function canEnemyMoveTo(x, y) {
        const tile = grid[y]?.[x];
        return tile === "." || tile === "E";
      }

      function checkGameState() {
        const burned = flames.some((point) => point.x === player.x && point.y === player.y);
        const caught = enemies.some((enemy) => enemy.x === player.x && enemy.y === player.y);

        if (burned || caught) {
          gameOver = true;
          stateStatus.textContent = "失败";
          message.textContent = burned ? "被自己的爆炸波及。" : "被敌人抓住了。";
          return;
        }

        if (grid[player.y][player.x] === "E" && bricksLeft <= 5) {
          gameOver = true;
          stateStatus.textContent = "完成";
          message.textContent = "成功找到出口！";
        }
      }

      function updateStatus() {
        brickStatus.textContent = String(bricksLeft);
        moveStatus.textContent = String(moves);
        if (!gameOver) {
          stateStatus.textContent = bricksLeft <= 5 ? "出口开启" : "探索";
        }
      }

      const keyMap = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0],
      };

      document.addEventListener("keydown", (event) => {
        if (event.key === " ") {
          event.preventDefault();
          placeBomb();
          return;
        }
        const direction = keyMap[event.key];
        if (!direction) {
          return;
        }
        event.preventDefault();
        movePlayer(direction[0], direction[1]);
      });

      document.querySelectorAll(".moveButton").forEach((button) => {
        button.addEventListener("click", () => {
          if (button.dataset.dir === "bomb") {
            placeBomb();
            return;
          }
          const map = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          };
          const direction = map[button.dataset.dir];
          movePlayer(direction[0], direction[1]);
        });
      });

      resetButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
