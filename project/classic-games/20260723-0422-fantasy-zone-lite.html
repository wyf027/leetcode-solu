<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Fantasy Zone 梦幻地带</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-100 text-slate-900">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-rose-600">Classic Games</p>
        <h1 class="text-3xl font-bold text-slate-950">Mini Fantasy Zone 梦幻地带</h1>
        <p class="mt-1 max-w-2xl text-sm text-slate-600">
          驾驶小飞船横版出击，击落敌人收集金币，攒够金币会自动升级火力。
        </p>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded-md bg-white/80 px-3 py-2 shadow-sm">
          <div class="text-xs text-slate-500">Score</div>
          <div id="score" class="font-bold">0</div>
        </div>
        <div class="rounded-md bg-white/80 px-3 py-2 shadow-sm">
          <div class="text-xs text-slate-500">Coins</div>
          <div id="coins" class="font-bold">0</div>
        </div>
        <div class="rounded-md bg-white/80 px-3 py-2 shadow-sm">
          <div class="text-xs text-slate-500">Power</div>
          <div id="power" class="font-bold">1</div>
        </div>
      </div>
    </header>

    <section class="rounded-lg border border-sky-200 bg-white p-3 shadow-sm">
      <canvas id="game" width="900" height="520" class="block h-auto w-full rounded-md bg-sky-200"></canvas>
    </section>

    <footer class="flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600">
      <div>方向键 / WASD 移动，Space 射击，R 重新开始</div>
      <button id="restart" class="rounded-md bg-rose-500 px-4 py-2 font-semibold text-white shadow-sm hover:bg-rose-600">
        重新开始
      </button>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const coinsEl = document.getElementById("coins");
    const powerEl = document.getElementById("power");
    const restartBtn = document.getElementById("restart");

    const keys = new Set();
    const player = {
      x: 95,
      y: 245,
      w: 42,
      h: 28,
      speed: 5,
      cooldown: 0,
      lives: 3,
      invincible: 0
    };

    let bullets = [];
    let enemies = [];
    let coins = [];
    let particles = [];
    let clouds = [];
    let boss = null;
    let score = 0;
    let coinCount = 0;
    let power = 1;
    let frame = 0;
    let defeated = 0;
    let gameOver = false;
    let won = false;

    function resetGame() {
      player.x = 95;
      player.y = 245;
      player.lives = 3;
      player.cooldown = 0;
      player.invincible = 0;
      bullets = [];
      enemies = [];
      coins = [];
      particles = [];
      clouds = Array.from({ length: 7 }, (_, i) => ({
        x: i * 150 + Math.random() * 60,
        y: 35 + Math.random() * 190,
        r: 20 + Math.random() * 24,
        speed: 0.25 + Math.random() * 0.45
      }));
      boss = null;
      score = 0;
      coinCount = 0;
      power = 1;
      frame = 0;
      defeated = 0;
      gameOver = false;
      won = false;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      coinsEl.textContent = coinCount;
      powerEl.textContent = power;
    }

    function shoot() {
      if (player.cooldown > 0 || gameOver || won) return;
      const spread = power === 1 ? [0] : power === 2 ? [-5, 5] : [-9, 0, 9];
      spread.forEach((offset) => {
        bullets.push({
          x: player.x + player.w,
          y: player.y + player.h / 2 + offset,
          vx: 8.5,
          vy: offset * 0.05,
          r: 5
        });
      });
      player.cooldown = Math.max(8, 18 - power * 3);
    }

    function spawnEnemy() {
      const type = Math.random() > 0.55 ? "balloon" : "plant";
      enemies.push({
        type,
        x: canvas.width + 35,
        y: 55 + Math.random() * (canvas.height - 130),
        w: type === "balloon" ? 34 : 42,
        h: type === "balloon" ? 34 : 30,
        hp: type === "balloon" ? 1 : 2,
        speed: 2 + Math.random() * 1.6,
        wave: Math.random() * Math.PI * 2
      });
    }

    function spawnBoss() {
      boss = {
        x: canvas.width + 100,
        y: 165,
        w: 104,
        h: 116,
        hp: 36,
        maxHp: 36,
        speed: 1.2,
        phase: 0
      };
    }

    function addBurst(x, y, color) {
      for (let i = 0; i < 14; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5,
          life: 24 + Math.random() * 12,
          color
        });
      }
    }

    function hit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function hitCircleRect(circle, rect) {
      const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
      const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
      return Math.hypot(circle.x - cx, circle.y - cy) < circle.r;
    }

    function collectCoin(coin) {
      coinCount += 1;
      score += 40;
      if (coinCount % 5 === 0 && power < 3) {
        power += 1;
        addBurst(player.x + 24, player.y + 14, "#22c55e");
      }
      updateHud();
    }

    function update() {
      if (gameOver || won) return;
      frame += 1;
      player.cooldown = Math.max(0, player.cooldown - 1);
      player.invincible = Math.max(0, player.invincible - 1);

      if (keys.has("ArrowUp") || keys.has("w")) player.y -= player.speed;
      if (keys.has("ArrowDown") || keys.has("s")) player.y += player.speed;
      if (keys.has("ArrowLeft") || keys.has("a")) player.x -= player.speed;
      if (keys.has("ArrowRight") || keys.has("d")) player.x += player.speed;
      if (keys.has(" ")) shoot();

      player.x = Math.max(8, Math.min(canvas.width - player.w - 8, player.x));
      player.y = Math.max(12, Math.min(canvas.height - player.h - 12, player.y));

      clouds.forEach((cloud) => {
        cloud.x -= cloud.speed;
        if (cloud.x < -80) {
          cloud.x = canvas.width + 80;
          cloud.y = 35 + Math.random() * 190;
        }
      });

      bullets.forEach((bullet) => {
        bullet.x += bullet.vx;
        bullet.y += bullet.vy;
      });
      bullets = bullets.filter((bullet) => bullet.x < canvas.width + 20);

      if (frame % 58 === 0 && defeated < 18) spawnEnemy();
      if (!boss && defeated >= 18) spawnBoss();

      enemies.forEach((enemy) => {
        enemy.x -= enemy.speed;
        enemy.wave += 0.05;
        enemy.y += Math.sin(enemy.wave) * (enemy.type === "balloon" ? 1.5 : 0.6);
      });

      if (boss) {
        boss.phase += 0.035;
        if (boss.x > canvas.width - 150) boss.x -= boss.speed;
        boss.y = 180 + Math.sin(boss.phase) * 105;
      }

      coins.forEach((coin) => {
        coin.x -= 2.6;
        coin.y += Math.sin((frame + coin.seed) * 0.08) * 0.7;
        if (hit(coin, player)) {
          coin.collected = true;
          collectCoin(coin);
        }
      });
      coins = coins.filter((coin) => !coin.collected && coin.x > -30);

      bullets.forEach((bullet) => {
        enemies.forEach((enemy) => {
          if (!enemy.dead && hitCircleRect(bullet, enemy)) {
            bullet.dead = true;
            enemy.hp -= 1;
            addBurst(bullet.x, bullet.y, "#fb7185");
            if (enemy.hp <= 0) {
              enemy.dead = true;
              defeated += 1;
              score += enemy.type === "balloon" ? 100 : 150;
              coins.push({ x: enemy.x + 12, y: enemy.y + 10, w: 18, h: 18, seed: Math.random() * 100 });
              addBurst(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, "#fbbf24");
            }
          }
        });

        if (boss && !boss.dead && hitCircleRect(bullet, boss)) {
          bullet.dead = true;
          boss.hp -= 1;
          score += 15;
          addBurst(bullet.x, bullet.y, "#38bdf8");
          if (boss.hp <= 0) {
            boss.dead = true;
            won = true;
            score += 1500;
            addBurst(boss.x + boss.w / 2, boss.y + boss.h / 2, "#f97316");
          }
        }
      });
      bullets = bullets.filter((bullet) => !bullet.dead);
      enemies = enemies.filter((enemy) => !enemy.dead && enemy.x > -70);

      const playerBox = { x: player.x + 7, y: player.y + 5, w: player.w - 13, h: player.h - 10 };
      const touchedEnemy = enemies.find((enemy) => hit(enemy, playerBox));
      const touchedBoss = boss && !boss.dead && hit(boss, playerBox);
      if ((touchedEnemy || touchedBoss) && player.invincible === 0) {
        player.lives -= 1;
        player.invincible = 90;
        addBurst(player.x + player.w / 2, player.y + player.h / 2, "#ef4444");
        if (touchedEnemy) touchedEnemy.dead = true;
        if (player.lives <= 0) gameOver = true;
      }

      particles.forEach((particle) => {
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life -= 1;
      });
      particles = particles.filter((particle) => particle.life > 0);
      updateHud();
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#7dd3fc");
      sky.addColorStop(0.62, "#bae6fd");
      sky.addColorStop(1, "#fde68a");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      clouds.forEach((cloud) => {
        ctx.fillStyle = "rgba(255,255,255,0.82)";
        ctx.beginPath();
        ctx.arc(cloud.x, cloud.y, cloud.r, 0, Math.PI * 2);
        ctx.arc(cloud.x + cloud.r * 0.8, cloud.y + 5, cloud.r * 0.75, 0, Math.PI * 2);
        ctx.arc(cloud.x - cloud.r * 0.75, cloud.y + 6, cloud.r * 0.65, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.fillStyle = "#34d399";
      for (let x = -80; x < canvas.width + 80; x += 90) {
        const y = canvas.height - 34 - Math.sin((frame + x) * 0.014) * 12;
        ctx.beginPath();
        ctx.arc(x, y, 48, Math.PI, 0);
        ctx.fill();
      }
    }

    function drawPlayer() {
      ctx.save();
      if (player.invincible > 0 && Math.floor(frame / 5) % 2 === 0) ctx.globalAlpha = 0.45;
      ctx.fillStyle = "#f43f5e";
      ctx.beginPath();
      ctx.moveTo(player.x + player.w, player.y + player.h / 2);
      ctx.lineTo(player.x + 8, player.y);
      ctx.lineTo(player.x, player.y + player.h / 2);
      ctx.lineTo(player.x + 8, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#fef3c7";
      ctx.fillRect(player.x + 13, player.y + 7, 13, 7);
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(player.x - 8, player.y + 10, 11, 8);
      ctx.restore();
    }

    function drawEnemy(enemy) {
      ctx.save();
      ctx.translate(enemy.x, enemy.y);
      if (enemy.type === "balloon") {
        ctx.fillStyle = "#a855f7";
        ctx.beginPath();
        ctx.arc(17, 17, 17, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fef3c7";
        ctx.fillRect(8, 12, 7, 6);
        ctx.fillRect(21, 12, 7, 6);
      } else {
        ctx.fillStyle = "#10b981";
        ctx.fillRect(0, 8, 42, 18);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(31, 17, 10, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBoss() {
      if (!boss || boss.dead) return;
      ctx.save();
      ctx.translate(boss.x, boss.y);
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath();
      ctx.ellipse(52, 58, 51, 56, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#7c2d12";
      ctx.fillRect(22, 38, 18, 10);
      ctx.fillRect(65, 38, 18, 10);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(34, 78, 38, 10);
      ctx.restore();

      ctx.fillStyle = "rgba(15,23,42,0.16)";
      ctx.fillRect(canvas.width - 236, 16, 216, 12);
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(canvas.width - 236, 16, 216 * (boss.hp / boss.maxHp), 12);
    }

    function drawCoins() {
      coins.forEach((coin) => {
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(coin.x + 9, coin.y + 9, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f97316";
        ctx.fillRect(coin.x + 7, coin.y + 4, 4, 10);
      });
    }

    function drawOverlay() {
      ctx.fillStyle = "#0f172a";
      ctx.font = "700 18px system-ui, sans-serif";
      ctx.fillText(`Lives: ${player.lives}`, 18, 30);
      ctx.fillText(`Enemies: ${defeated}/18`, 18, 58);

      if (gameOver || won) {
        ctx.fillStyle = "rgba(15,23,42,0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        ctx.textAlign = "center";
        ctx.font = "800 42px system-ui, sans-serif";
        ctx.fillText(won ? "Clear! 梦幻通关" : "Game Over", canvas.width / 2, canvas.height / 2 - 24);
        ctx.font = "500 18px system-ui, sans-serif";
        ctx.fillText("按 R 或点击重新开始", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left";
      }
    }

    function draw() {
      drawBackground();
      bullets.forEach((bullet) => {
        ctx.fillStyle = "#ec4899";
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      });
      enemies.forEach(drawEnemy);
      drawBoss();
      drawCoins();
      drawPlayer();
      particles.forEach((particle) => {
        ctx.globalAlpha = Math.max(0, particle.life / 30);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 4, 4);
        ctx.globalAlpha = 1;
      });
      drawOverlay();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) event.preventDefault();
      if (event.key === "r" || event.key === "R") resetGame();
      keys.add(event.key.length === 1 ? event.key.toLowerCase() : event.key);
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
    });

    restartBtn.addEventListener("click", resetGame);

    resetGame();
    loop();
  </script>
</body>
</html>
