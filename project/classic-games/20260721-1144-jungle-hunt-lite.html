<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Jungle Hunt</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center gap-4 p-4">
    <section class="w-full rounded-lg border border-lime-400/40 bg-emerald-900 p-4 shadow-2xl shadow-black/40">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal text-lime-200">Mini Jungle Hunt</h1>
          <p class="text-sm text-emerald-100">Swing, swim, and leap through three quick jungle scenes.</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-emerald-700 px-3 py-2">
            <div class="text-emerald-200">Score</div>
            <div id="score" class="text-lg font-bold text-lime-200">0</div>
          </div>
          <div class="rounded border border-emerald-700 px-3 py-2">
            <div class="text-emerald-200">Lives</div>
            <div id="lives" class="text-lg font-bold text-rose-200">3</div>
          </div>
          <div class="rounded border border-emerald-700 px-3 py-2">
            <div class="text-emerald-200">Scene</div>
            <div id="scene" class="text-lg font-bold text-sky-200">Vines</div>
          </div>
        </div>
      </div>

      <canvas id="game" width="900" height="520" class="h-auto w-full rounded border border-emerald-700 bg-sky-950"></canvas>

      <div class="mt-3 flex flex-wrap items-center justify-between gap-3 text-sm text-emerald-100">
        <div>Arrow keys move. Space jumps or grabs a vine. Enter restarts.</div>
        <button id="restart" class="rounded bg-lime-300 px-4 py-2 font-semibold text-emerald-950 hover:bg-lime-200">Restart</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const sceneEl = document.getElementById("scene");
    const restartBtn = document.getElementById("restart");

    const keys = new Set();
    const sceneNames = ["Vines", "River", "Camp"];

    const state = {
      score: 0,
      lives: 3,
      scene: 0,
      distance: 0,
      speed: 170,
      player: { x: 95, y: 350, vy: 0, grounded: true, riding: -1 },
      vines: [],
      hazards: [],
      message: "Catch the next vine",
      messageTimer: 1400,
      over: false,
      lastTime: 0
    };

    function setupGame() {
      state.score = 0;
      state.lives = 3;
      state.scene = 0;
      state.distance = 0;
      state.speed = 170;
      state.player = { x: 95, y: 350, vy: 0, grounded: true, riding: -1 };
      state.vines = makeVines();
      state.hazards = makeHazards();
      state.message = "Catch the next vine";
      state.messageTimer = 1400;
      state.over = false;
      state.lastTime = performance.now();
      updateHud();
      requestAnimationFrame(tick);
    }

    function makeVines() {
      return Array.from({ length: 6 }, (_, index) => ({
        x: 190 + index * 135,
        phase: index * 0.9,
        length: 142
      }));
    }

    function makeHazards() {
      if (state.scene === 0) {
        return [
          { x: 390, y: 404, w: 82, h: 30, type: "pit" },
          { x: 710, y: 404, w: 95, h: 30, type: "pit" }
        ];
      }
      if (state.scene === 1) {
        return Array.from({ length: 5 }, (_, index) => ({
          x: 250 + index * 150,
          y: 296 + (index % 2) * 55,
          w: 76,
          h: 28,
          type: "croc",
          dir: index % 2 ? -1 : 1
        }));
      }
      return [
        { x: 280, y: 388, w: 62, h: 36, type: "boulder" },
        { x: 510, y: 388, w: 62, h: 36, type: "boulder" },
        { x: 705, y: 388, w: 62, h: 36, type: "boulder" }
      ];
    }

    function advanceScene() {
      state.score += 250;
      state.scene = (state.scene + 1) % 3;
      state.distance = 0;
      state.speed += 20;
      state.player.x = 95;
      state.player.y = state.scene === 1 ? 270 : 350;
      state.player.vy = 0;
      state.player.grounded = state.scene !== 1;
      state.player.riding = -1;
      state.vines = makeVines();
      state.hazards = makeHazards();
      state.message = state.scene === 0 ? "Catch the next vine" : state.scene === 1 ? "Swim past the crocs" : "Leap the camp traps";
      state.messageTimer = 1400;
      updateHud();
    }

    function tryJumpOrGrab() {
      if (state.over) {
        setupGame();
        return;
      }
      if (state.scene === 0) {
        const vineIndex = nearestVineIndex();
        if (vineIndex >= 0) {
          state.player.riding = vineIndex;
          state.score += 20;
          state.message = "Swing!";
          state.messageTimer = 500;
          updateHud();
          return;
        }
      }
      if (state.player.grounded || state.scene === 1) {
        state.player.vy = state.scene === 1 ? -95 : -430;
        state.player.grounded = false;
      }
    }

    function nearestVineIndex() {
      let best = -1;
      let bestDistance = 42;
      state.vines.forEach((vine, index) => {
        const tip = vineTip(vine);
        const distance = Math.hypot(state.player.x - tip.x, state.player.y - tip.y);
        if (distance < bestDistance) {
          bestDistance = distance;
          best = index;
        }
      });
      return best;
    }

    function updatePlayer(delta) {
      const seconds = delta / 1000;
      const player = state.player;
      const move = (keys.has("ArrowRight") || keys.has("d") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("a") ? 1 : 0);

      if (state.scene === 0 && player.riding >= 0) {
        const tip = vineTip(state.vines[player.riding]);
        player.x = tip.x;
        player.y = tip.y;
        if (keys.has("ArrowRight") || keys.has("d")) {
          player.riding = -1;
          player.vy = -260;
        }
      } else {
        player.x += move * 210 * seconds;
        player.vy += (state.scene === 1 ? 160 : 760) * seconds;
        player.y += player.vy * seconds;
      }

      if (state.scene === 1) {
        if (keys.has("ArrowUp") || keys.has("w")) player.y -= 160 * seconds;
        if (keys.has("ArrowDown") || keys.has("s")) player.y += 160 * seconds;
        player.y = clamp(player.y, 210, 385);
        player.vy *= 0.92;
      } else {
        const ground = 388;
        if (player.y >= ground) {
          player.y = ground;
          player.vy = 0;
          player.grounded = true;
        }
      }

      player.x = clamp(player.x, 48, 846);
      if (player.x > 835) advanceScene();
    }

    function updateHazards(delta) {
      const seconds = delta / 1000;
      const scroll = state.speed * seconds;
      state.distance += scroll;
      for (const hazard of state.hazards) {
        hazard.x -= scroll;
        if (hazard.type === "croc") {
          hazard.y += hazard.dir * 44 * seconds;
          if (hazard.y < 236 || hazard.y > 374) hazard.dir *= -1;
        }
        if (hazard.x < -120) hazard.x = 920 + Math.random() * 180;
      }

      if (state.scene === 0) {
        for (const vine of state.vines) {
          vine.x -= scroll;
          if (vine.x < -50) vine.x = 910 + Math.random() * 120;
        }
      }
    }

    function checkCollisions() {
      const p = { x: state.player.x - 15, y: state.player.y - 28, w: 30, h: 52 };
      for (const hazard of state.hazards) {
        const hit = intersects(p, hazard);
        if (!hit) continue;
        if (hazard.type === "pit" && state.player.y < 386) continue;
        loseLife(hazard.type === "croc" ? "Crocodile snap" : "Trap hit");
        return;
      }
    }

    function loseLife(message) {
      state.lives -= 1;
      state.message = message;
      state.messageTimer = 1000;
      state.player.x = 95;
      state.player.y = state.scene === 1 ? 270 : 350;
      state.player.vy = 0;
      state.player.riding = -1;
      if (state.lives <= 0) {
        state.over = true;
        state.message = "Lost in the jungle - press Enter";
      }
      updateHud();
    }

    function vineTip(vine) {
      const swing = Math.sin(performance.now() / 560 + vine.phase) * 48;
      return { x: vine.x + swing, y: 160 + vine.length };
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      sceneEl.textContent = sceneNames[state.scene];
    }

    function drawBackground() {
      const sky = state.scene === 1 ? "#0c4a6e" : "#14532d";
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#166534";
      for (let i = 0; i < 12; i += 1) {
        const x = (i * 92 - (state.distance * 0.25) % 92);
        ctx.beginPath();
        ctx.arc(x, 96 + (i % 3) * 18, 58, 0, Math.PI * 2);
        ctx.fill();
      }

      if (state.scene === 1) {
        ctx.fillStyle = "#0369a1";
        ctx.fillRect(0, 190, canvas.width, 235);
        ctx.fillStyle = "#7dd3fc";
        for (let x = -60; x < canvas.width; x += 120) {
          ctx.fillRect(x + (state.distance * 0.5) % 120, 282, 70, 5);
        }
      } else {
        ctx.fillStyle = "#365314";
        ctx.fillRect(0, 422, canvas.width, 70);
        ctx.fillStyle = "#854d0e";
        ctx.fillRect(0, 402, canvas.width, 28);
      }

      ctx.fillStyle = "#ecfccb";
      ctx.font = "bold 22px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(state.messageTimer > 0 || state.over ? state.message : sceneNames[state.scene], canvas.width / 2, 44);
    }

    function drawVines() {
      if (state.scene !== 0) return;
      ctx.strokeStyle = "#84cc16";
      ctx.lineWidth = 6;
      for (const vine of state.vines) {
        const tip = vineTip(vine);
        ctx.beginPath();
        ctx.moveTo(vine.x, 78);
        ctx.lineTo(tip.x, tip.y);
        ctx.stroke();
        ctx.fillStyle = "#bef264";
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 9, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawHazards() {
      for (const hazard of state.hazards) {
        if (hazard.type === "pit") {
          ctx.fillStyle = "#111827";
          ctx.fillRect(hazard.x, hazard.y, hazard.w, hazard.h);
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(hazard.x + 8, hazard.y + 8, hazard.w - 16, hazard.h);
        } else if (hazard.type === "croc") {
          ctx.fillStyle = "#65a30d";
          ctx.fillRect(hazard.x, hazard.y, hazard.w, hazard.h);
          ctx.fillStyle = "#ecfccb";
          for (let i = 0; i < 5; i += 1) ctx.fillRect(hazard.x + 12 + i * 11, hazard.y + 4, 6, 7);
          ctx.fillStyle = "#111827";
          ctx.fillRect(hazard.x + 58, hazard.y + 8, 7, 7);
        } else {
          ctx.fillStyle = "#78716c";
          ctx.beginPath();
          ctx.arc(hazard.x + 31, hazard.y + 22, 28, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#44403c";
          ctx.fillRect(hazard.x + 14, hazard.y + 10, 24, 8);
        }
      }
    }

    function drawPlayer() {
      const p = state.player;
      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.arc(p.x, p.y - 33, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f97316";
      ctx.fillRect(p.x - 13, p.y - 20, 26, 34);
      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x - 11, p.y + 12);
      ctx.lineTo(p.x - 23, p.y + 29);
      ctx.moveTo(p.x + 11, p.y + 12);
      ctx.lineTo(p.x + 23, p.y + 29);
      ctx.stroke();
    }

    function drawGoal() {
      if (state.scene !== 2) return;
      ctx.fillStyle = "#facc15";
      ctx.fillRect(828, 342, 38, 58);
      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.arc(847, 328, 16, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawOverlay() {
      if (!state.over) return;
      ctx.fillStyle = "rgba(6, 78, 59, 0.84)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ecfccb";
      ctx.font = "bold 42px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Jungle Run Over", canvas.width / 2, 238);
      ctx.font = "22px ui-sans-serif, system-ui";
      ctx.fillText("Press Enter or Restart", canvas.width / 2, 278);
    }

    function draw() {
      drawBackground();
      drawVines();
      drawHazards();
      drawGoal();
      drawPlayer();
      drawOverlay();
    }

    function tick(now) {
      const delta = Math.min(60, now - state.lastTime);
      state.lastTime = now;
      if (!state.over) {
        updatePlayer(delta);
        updateHazards(delta);
        checkCollisions();
        state.messageTimer = Math.max(0, state.messageTimer - delta);
        state.score += Math.floor(delta / 45);
        updateHud();
      }
      draw();
      requestAnimationFrame(tick);
    }

    function intersects(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    document.addEventListener("keydown", (event) => {
      keys.add(event.key);
      keys.add(event.key.toLowerCase());
      if (event.key === " ") tryJumpOrGrab();
      if (event.key === "Enter") setupGame();
    });

    document.addEventListener("keyup", (event) => {
      keys.delete(event.key);
      keys.delete(event.key.toLowerCase());
    });

    canvas.addEventListener("click", tryJumpOrGrab);
    restartBtn.addEventListener("click", setupGame);
    setupGame();
  </script>
</body>
</html>
