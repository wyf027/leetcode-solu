<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Duck Hunt</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center gap-5 px-4 py-6">
    <section class="w-full rounded-lg border border-sky-300/30 bg-sky-900/90 p-4 shadow-2xl shadow-sky-950/50">
      <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal text-amber-100">Mini Duck Hunt</h1>
          <p class="text-sm text-sky-100/80">Click the moving target before the shots run out.</p>
        </div>
        <button id="restart" class="rounded-md bg-amber-300 px-4 py-2 text-sm font-semibold text-sky-950 hover:bg-amber-200">Restart</button>
      </div>

      <div class="grid gap-4 lg:grid-cols-[1fr_220px]">
        <div id="field" class="relative h-[460px] overflow-hidden rounded-md border-4 border-sky-700 bg-gradient-to-b from-sky-300 via-sky-200 to-lime-500 cursor-crosshair">
          <div class="absolute left-0 right-0 top-8 flex justify-center">
            <div class="rounded-full bg-white/70 px-4 py-1 text-sm font-semibold text-sky-900">Round <span id="roundLabel">1</span></div>
          </div>
          <div id="target" class="absolute flex h-14 w-20 items-center justify-center rounded-[50%] border-4 border-amber-900 bg-amber-500 text-2xl shadow-xl shadow-black/30 transition-transform">
            <span class="block h-5 w-5 rounded-full bg-emerald-800"></span>
          </div>
          <div class="absolute bottom-0 left-0 right-0 h-20 bg-lime-700"></div>
          <div class="absolute bottom-12 left-10 h-24 w-8 rounded-t-full bg-lime-900"></div>
          <div class="absolute bottom-12 right-16 h-20 w-8 rounded-t-full bg-lime-900"></div>
        </div>

        <aside class="space-y-3">
          <div class="grid grid-cols-2 gap-2 text-center lg:grid-cols-1">
            <div class="rounded-md bg-sky-950/80 p-3">
              <div class="text-xs uppercase text-sky-200/70">Score</div>
              <div id="score" class="text-xl font-bold text-amber-200">0</div>
            </div>
            <div class="rounded-md bg-sky-950/80 p-3">
              <div class="text-xs uppercase text-sky-200/70">Hits</div>
              <div id="hits" class="text-xl font-bold text-lime-200">0</div>
            </div>
            <div class="rounded-md bg-sky-950/80 p-3">
              <div class="text-xs uppercase text-sky-200/70">Shots</div>
              <div id="shots" class="text-xl font-bold text-rose-200">3</div>
            </div>
            <div class="rounded-md bg-sky-950/80 p-3">
              <div class="text-xs uppercase text-sky-200/70">Misses</div>
              <div id="misses" class="text-xl font-bold text-cyan-200">0</div>
            </div>
          </div>

          <div id="message" class="rounded-md border border-sky-700 bg-sky-950 p-3 text-center text-sm text-sky-100/80">
            Aim carefully. Each round gives three shots.
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const field = document.getElementById("field");
    const target = document.getElementById("target");
    const scoreEl = document.getElementById("score");
    const hitsEl = document.getElementById("hits");
    const shotsEl = document.getElementById("shots");
    const missesEl = document.getElementById("misses");
    const roundLabel = document.getElementById("roundLabel");
    const messageEl = document.getElementById("message");
    const restart = document.getElementById("restart");

    let score = 0;
    let hits = 0;
    let misses = 0;
    let shots = 3;
    let round = 1;
    let active = true;
    let targetX = 70;
    let targetY = 180;
    let velocityX = 2.2;
    let velocityY = -1.4;
    let lastTime = 0;

    function resetGame() {
      score = 0;
      hits = 0;
      misses = 0;
      shots = 3;
      round = 1;
      active = true;
      targetX = 70;
      targetY = 180;
      velocityX = 2.2;
      velocityY = -1.4;
      messageEl.textContent = "Aim carefully. Each round gives three shots.";
      renderStats();
      placeTarget();
      requestAnimationFrame(gameLoop);
    }

    function renderStats() {
      scoreEl.textContent = score;
      hitsEl.textContent = hits;
      shotsEl.textContent = shots;
      missesEl.textContent = misses;
      roundLabel.textContent = round;
    }

    function placeTarget() {
      target.style.transform = `translate(${targetX}px, ${targetY}px)`;
    }

    function startNextRound(hit) {
      round += 1;
      shots = 3;
      const speed = 2 + round * 0.35;
      targetX = hit ? 30 : field.clientWidth - 120;
      targetY = 90 + Math.random() * 210;
      velocityX = (Math.random() > 0.5 ? 1 : -1) * speed;
      velocityY = (Math.random() > 0.5 ? 1 : -1) * (1.1 + round * 0.18);
      messageEl.textContent = hit ? "Good hit. New target launched." : "Out of shots. New target launched.";
      renderStats();
      placeTarget();
    }

    function registerHit() {
      if (!active) return;
      hits += 1;
      score += Math.max(100, 320 - round * 10) + shots * 25;
      startNextRound(true);
    }

    function registerMiss() {
      if (!active) return;
      shots -= 1;
      misses += 1;
      if (shots <= 0) {
        startNextRound(false);
      } else {
        messageEl.textContent = "Miss. Track the target and try again.";
      }
      renderStats();
    }

    function gameLoop(time) {
      if (!active) return;
      const delta = Math.min(32, time - lastTime || 16);
      lastTime = time;
      const scale = delta / 16;
      const maxX = field.clientWidth - target.offsetWidth - 8;
      const maxY = field.clientHeight - target.offsetHeight - 82;
      targetX += velocityX * scale;
      targetY += velocityY * scale;
      if (targetX <= 8 || targetX >= maxX) velocityX *= -1;
      if (targetY <= 24 || targetY >= maxY) velocityY *= -1;
      targetX = Math.max(8, Math.min(maxX, targetX));
      targetY = Math.max(24, Math.min(maxY, targetY));
      placeTarget();
      requestAnimationFrame(gameLoop);
    }

    target.addEventListener("click", (event) => {
      event.stopPropagation();
      registerHit();
    });

    field.addEventListener("click", () => {
      registerMiss();
    });

    restart.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
