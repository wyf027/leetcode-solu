<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Nim</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-5 px-4 py-6 sm:py-8">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-normal text-white">Mini Nim</h1>
        <p class="mt-1 text-sm text-slate-400">Take stones from one pile. The player who takes the last stone wins.</p>
      </div>
      <button id="reset" class="rounded-md bg-fuchsia-300 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-fuchsia-200 focus:outline-none focus:ring-2 focus:ring-fuchsia-100">
        Reset
      </button>
    </header>

    <section class="grid gap-5 md:grid-cols-[1fr_14rem]">
      <div id="piles" class="grid gap-4"></div>

      <aside class="grid content-start gap-3">
        <div class="rounded-md border border-slate-800 bg-slate-900 p-4">
          <div class="text-xs uppercase tracking-wider text-slate-500">Turn</div>
          <div id="turn" class="mt-1 text-3xl font-bold text-fuchsia-300">A</div>
        </div>
        <div class="rounded-md border border-slate-800 bg-slate-900 p-4">
          <div class="text-xs uppercase tracking-wider text-slate-500">Remaining</div>
          <div id="remaining" class="mt-1 text-3xl font-bold text-white">0</div>
        </div>
        <div id="status" class="rounded-md border border-slate-800 bg-slate-900 p-4 text-sm leading-6 text-slate-300">
          Choose a pile and take stones.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const startPiles = [3, 5, 7];
    const pilesEl = document.querySelector("#piles");
    const turnEl = document.querySelector("#turn");
    const remainingEl = document.querySelector("#remaining");
    const statusEl = document.querySelector("#status");
    const resetBtn = document.querySelector("#reset");
    let piles = [];
    let player = 0;
    let locked = false;

    function resetGame() {
      piles = startPiles.slice();
      player = 0;
      locked = false;
      statusEl.textContent = "Choose a pile and take stones.";
      render();
    }

    function totalStones() {
      return piles.reduce((sum, count) => sum + count, 0);
    }

    function takeStones(pileIndex, amount) {
      if (locked || amount < 1 || amount > piles[pileIndex]) return;
      piles[pileIndex] -= amount;
      if (totalStones() === 0) {
        locked = true;
        statusEl.textContent = `Player ${player === 0 ? "A" : "B"} took the last stone and wins.`;
      } else {
        player = 1 - player;
        statusEl.textContent = `Player ${player === 0 ? "A" : "B"} moves next.`;
      }
      render();
    }

    function renderStones(count) {
      const wrap = document.createElement("div");
      wrap.className = "flex min-h-14 flex-wrap items-center gap-2";
      for (let index = 0; index < count; index += 1) {
        const stone = document.createElement("span");
        stone.className = "h-8 w-8 rounded-full border border-fuchsia-100 bg-fuchsia-300 shadow-lg shadow-fuchsia-500/20";
        wrap.appendChild(stone);
      }
      if (count === 0) {
        const empty = document.createElement("span");
        empty.className = "text-sm text-slate-500";
        empty.textContent = "empty";
        wrap.appendChild(empty);
      }
      return wrap;
    }

    function render() {
      pilesEl.innerHTML = "";
      turnEl.textContent = locked ? "-" : (player === 0 ? "A" : "B");
      remainingEl.textContent = totalStones();
      piles.forEach((count, pileIndex) => {
        const panel = document.createElement("section");
        panel.className = "rounded-md border border-slate-800 bg-slate-900 p-4";

        const header = document.createElement("div");
        header.className = "mb-3 flex items-center justify-between gap-3";
        header.innerHTML = `<div class="text-sm font-semibold text-white">Pile ${pileIndex + 1}</div><div class="text-sm text-slate-400">${count} stone${count === 1 ? "" : "s"}</div>`;
        panel.appendChild(header);
        panel.appendChild(renderStones(count));

        const controls = document.createElement("div");
        controls.className = "mt-4 flex flex-wrap gap-2";
        for (let amount = 1; amount <= count; amount += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "rounded-md border border-slate-700 px-3 py-2 text-sm font-semibold text-slate-100 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-fuchsia-100";
          button.textContent = `Take ${amount}`;
          button.addEventListener("click", () => takeStones(pileIndex, amount));
          controls.appendChild(button);
        }
        panel.appendChild(controls);
        pilesEl.appendChild(panel);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
