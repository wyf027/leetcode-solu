<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini SameGame</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-zinc-800 bg-zinc-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal text-white">Mini SameGame</h1>
          <p class="mt-1 text-sm text-zinc-400">点击 2 个以上相连色块消除，色块下落并向左压缩。</p>
        </div>
        <button id="reset" class="rounded-md bg-emerald-500 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-emerald-400">
          重新开始
        </button>
      </div>

      <div class="mb-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="rounded-md bg-zinc-800 px-3 py-2">
          <div class="text-zinc-400">分数</div>
          <div id="score" class="text-xl font-semibold text-white">0</div>
        </div>
        <div class="rounded-md bg-zinc-800 px-3 py-2">
          <div class="text-zinc-400">剩余</div>
          <div id="left" class="text-xl font-semibold text-white">64</div>
        </div>
        <div class="rounded-md bg-zinc-800 px-3 py-2">
          <div class="text-zinc-400">状态</div>
          <div id="status" class="text-xl font-semibold text-white">可消除</div>
        </div>
      </div>

      <div id="board" class="mx-auto grid w-full max-w-md grid-cols-8 gap-1 rounded-lg bg-zinc-950 p-2"></div>
    </section>
  </main>

  <script>
    const size = 8;
    const colors = [
      "bg-rose-500 hover:bg-rose-400",
      "bg-amber-400 hover:bg-amber-300",
      "bg-sky-500 hover:bg-sky-400",
      "bg-violet-500 hover:bg-violet-400"
    ];
    const boardEl = document.getElementById("board");
    const scoreEl = document.getElementById("score");
    const leftEl = document.getElementById("left");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    let board = [];
    let score = 0;

    function resetGame() {
      score = 0;
      board = Array.from({ length: size }, () =>
        Array.from({ length: size }, () => Math.floor(Math.random() * colors.length))
      );
      render();
    }

    function render() {
      boardEl.innerHTML = "";
      let remaining = 0;
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const tile = document.createElement("button");
          const value = board[row][col];
          tile.type = "button";
          tile.className = [
            "aspect-square rounded-md transition focus:outline-none focus:ring-2 focus:ring-white",
            value === null ? "bg-zinc-900 cursor-default" : colors[value]
          ].join(" ");
          tile.setAttribute("aria-label", value === null ? "空格" : `色块 ${row + 1}-${col + 1}`);
          tile.disabled = value === null;
          tile.addEventListener("click", () => play(row, col));
          if (value !== null) remaining++;
          boardEl.appendChild(tile);
        }
      }
      scoreEl.textContent = score;
      leftEl.textContent = remaining;
      statusEl.textContent = hasMove() ? "可消除" : "结束";
    }

    function play(row, col) {
      const group = collectGroup(row, col);
      if (group.length < 2) return;
      for (const [r, c] of group) board[r][c] = null;
      score += group.length * group.length;
      collapse();
      render();
    }

    function collectGroup(row, col) {
      const target = board[row][col];
      if (target === null) return [];
      const seen = new Set();
      const stack = [[row, col]];
      const group = [];
      while (stack.length) {
        const [r, c] = stack.pop();
        const key = `${r},${c}`;
        if (seen.has(key) || r < 0 || c < 0 || r >= size || c >= size || board[r][c] !== target) continue;
        seen.add(key);
        group.push([r, c]);
        stack.push([r + 1, c], [r - 1, c], [r, c + 1], [r, c - 1]);
      }
      return group;
    }

    function collapse() {
      for (let col = 0; col < size; col++) {
        const kept = [];
        for (let row = size - 1; row >= 0; row--) {
          if (board[row][col] !== null) kept.push(board[row][col]);
        }
        for (let row = size - 1; row >= 0; row--) {
          board[row][col] = kept[size - 1 - row] ?? null;
        }
      }

      const columns = [];
      for (let col = 0; col < size; col++) {
        const values = board.map(row => row[col]);
        if (values.some(value => value !== null)) columns.push(values);
      }
      while (columns.length < size) columns.push(Array(size).fill(null));
      for (let col = 0; col < size; col++) {
        for (let row = 0; row < size; row++) board[row][col] = columns[col][row];
      }
    }

    function hasMove() {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (board[row][col] === null) continue;
          if (row + 1 < size && board[row][col] === board[row + 1][col]) return true;
          if (col + 1 < size && board[row][col] === board[row][col + 1]) return true;
        }
      }
      return false;
    }

    resetEl.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
