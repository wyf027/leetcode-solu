<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Checkers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Mini Checkers</h1>
        <p class="text-sm text-neutral-400">Play red pieces on a 6x6 board. Jump black pieces and crown kings on the far row.</p>
      </div>
      <button id="resetBtn" class="rounded bg-red-400 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-red-300">New Game</button>
    </header>

    <section class="grid gap-4 md:grid-cols-[1fr_16rem]">
      <div class="rounded border border-neutral-800 bg-neutral-900 p-4">
        <div id="board" class="mx-auto grid max-w-[30rem] grid-cols-6 overflow-hidden rounded border border-neutral-700"></div>
      </div>

      <aside class="space-y-3 rounded border border-neutral-800 bg-neutral-900 p-4">
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="rounded bg-neutral-800 p-3">
            <div class="text-neutral-400">Red</div>
            <div id="redCount" class="text-2xl font-bold">6</div>
          </div>
          <div class="rounded bg-neutral-800 p-3">
            <div class="text-neutral-400">Black</div>
            <div id="blackCount" class="text-2xl font-bold">6</div>
          </div>
          <div class="col-span-2 rounded bg-neutral-800 p-3">
            <div class="text-neutral-400">Turn</div>
            <div id="turn" class="text-2xl font-bold">Red</div>
          </div>
        </div>
        <div id="message" class="min-h-20 rounded bg-neutral-800 p-3 text-sm text-neutral-300">Select a red piece, then choose a highlighted move. Captures are preferred when available.</div>
        <div class="space-y-2 text-sm text-neutral-300">
          <div class="flex items-center gap-2"><span class="h-4 w-4 rounded-full bg-red-400"></span> Your pieces</div>
          <div class="flex items-center gap-2"><span class="h-4 w-4 rounded-full bg-slate-900 ring-1 ring-white"></span> CPU pieces</div>
          <div class="flex items-center gap-2"><span class="h-4 w-4 rounded bg-emerald-400"></span> Legal move</div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const redCountEl = document.getElementById('redCount');
    const blackCountEl = document.getElementById('blackCount');
    const turnEl = document.getElementById('turn');
    const messageEl = document.getElementById('message');
    let board;
    let selected;
    let playerTurn;
    let gameOver;

    function resetGame() {
      board = Array.from({ length: 6 }, () => Array(6).fill(null));
      for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 6; col++) if ((row + col) % 2 === 1) board[row][col] = { side: 'black', king: false };
      }
      for (let row = 4; row < 6; row++) {
        for (let col = 0; col < 6; col++) if ((row + col) % 2 === 1) board[row][col] = { side: 'red', king: false };
      }
      selected = null;
      playerTurn = true;
      gameOver = false;
      messageEl.textContent = 'Select a red piece, then choose a highlighted move. Captures are preferred when available.';
      render();
    }

    function inBounds(row, col) {
      return row >= 0 && row < 6 && col >= 0 && col < 6;
    }

    function directions(piece) {
      if (piece.king) return [[1, 1], [1, -1], [-1, 1], [-1, -1]];
      return piece.side === 'red' ? [[-1, 1], [-1, -1]] : [[1, 1], [1, -1]];
    }

    function movesFor(row, col) {
      const piece = board[row][col];
      if (!piece) return [];
      const result = [];
      for (const [dr, dc] of directions(piece)) {
        const stepRow = row + dr;
        const stepCol = col + dc;
        const jumpRow = row + dr * 2;
        const jumpCol = col + dc * 2;
        if (inBounds(stepRow, stepCol) && !board[stepRow][stepCol]) {
          result.push({ from: [row, col], to: [stepRow, stepCol], capture: null });
        }
        if (
          inBounds(jumpRow, jumpCol) &&
          board[stepRow]?.[stepCol] &&
          board[stepRow][stepCol].side !== piece.side &&
          !board[jumpRow][jumpCol]
        ) {
          result.push({ from: [row, col], to: [jumpRow, jumpCol], capture: [stepRow, stepCol] });
        }
      }
      return result;
    }

    function allMoves(side) {
      const moves = [];
      for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 6; col++) {
          if (board[row][col]?.side === side) moves.push(...movesFor(row, col));
        }
      }
      const captures = moves.filter(move => move.capture);
      return captures.length ? captures : moves;
    }

    function legalDestinations() {
      if (!selected) return [];
      const moves = movesFor(selected[0], selected[1]);
      const teamMoves = allMoves('red');
      const mustCapture = teamMoves.some(move => move.capture);
      return moves.filter(move => !mustCapture || move.capture);
    }

    function count(side) {
      return board.flat().filter(piece => piece?.side === side).length;
    }

    function applyMove(move) {
      const piece = board[move.from[0]][move.from[1]];
      board[move.from[0]][move.from[1]] = null;
      board[move.to[0]][move.to[1]] = piece;
      if (move.capture) board[move.capture[0]][move.capture[1]] = null;
      if (piece.side === 'red' && move.to[0] === 0) piece.king = true;
      if (piece.side === 'black' && move.to[0] === 5) piece.king = true;
    }

    function checkGame() {
      const red = count('red');
      const black = count('black');
      if (!red || !allMoves('red').length) {
        gameOver = true;
        messageEl.textContent = 'Black wins. Start a new game to try again.';
      } else if (!black || !allMoves('black').length) {
        gameOver = true;
        messageEl.textContent = 'Red wins. You cleared the board.';
      }
    }

    function chooseCell(row, col) {
      if (gameOver || !playerTurn) return;
      const piece = board[row][col];
      if (piece?.side === 'red') {
        selected = [row, col];
        messageEl.textContent = 'Choose a highlighted destination.';
        render();
        return;
      }
      if (!selected) return;
      const move = legalDestinations().find(item => item.to[0] === row && item.to[1] === col);
      if (!move) return;
      applyMove(move);
      selected = null;
      playerTurn = false;
      checkGame();
      render();
      if (!gameOver) {
        messageEl.textContent = 'CPU is thinking.';
        setTimeout(cpuMove, 450);
      }
    }

    function cpuMove() {
      if (gameOver) return;
      const options = allMoves('black');
      if (!options.length) {
        checkGame();
        render();
        return;
      }
      const capture = options.find(move => move.capture);
      applyMove(capture || options[Math.floor(Math.random() * options.length)]);
      playerTurn = true;
      checkGame();
      if (!gameOver) messageEl.textContent = 'Your turn. Select a red piece.';
      render();
    }

    function render() {
      const legal = new Set(legalDestinations().map(move => `${move.to[0]},${move.to[1]}`));
      boardEl.innerHTML = '';
      for (let row = 0; row < 6; row++) {
        for (let col = 0; col < 6; col++) {
          const cell = document.createElement('button');
          const dark = (row + col) % 2 === 1;
          const id = `${row},${col}`;
          cell.type = 'button';
          cell.className = `aspect-square text-xl font-black ${dark ? 'bg-stone-700' : 'bg-stone-300'} ${legal.has(id) ? 'ring-4 ring-emerald-400' : ''}`;
          const piece = board[row][col];
          if (piece) {
            const color = piece.side === 'red' ? 'bg-red-400 text-red-950' : 'bg-slate-950 text-white';
            const crown = piece.king ? 'K' : '●';
            cell.innerHTML = `<span class="mx-auto flex h-10 w-10 items-center justify-center rounded-full ${color}">${crown}</span>`;
            if (selected?.[0] === row && selected?.[1] === col) cell.className += ' ring-4 ring-sky-300';
          }
          cell.addEventListener('click', () => chooseCell(row, col));
          boardEl.appendChild(cell);
        }
      }
      redCountEl.textContent = count('red');
      blackCountEl.textContent = count('black');
      turnEl.textContent = gameOver ? 'Done' : playerTurn ? 'Red' : 'Black';
    }

    document.getElementById('resetBtn').addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
