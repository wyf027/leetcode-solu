<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Yacht Dice</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-stone-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-sky-300">Classic Games</p>
          <h1 class="mt-1 text-3xl font-bold">Mini Yacht Dice</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-stone-800 bg-stone-900 px-4 py-2">
            <div id="totalScore" class="text-xl font-bold text-sky-200">0</div>
            <div class="text-stone-400">score</div>
          </div>
          <div class="rounded border border-stone-800 bg-stone-900 px-4 py-2">
            <div id="rollsLeft" class="text-xl font-bold text-emerald-200">3</div>
            <div class="text-stone-400">rolls</div>
          </div>
          <div class="rounded border border-stone-800 bg-stone-900 px-4 py-2">
            <div id="roundCount" class="text-xl font-bold text-amber-200">1/6</div>
            <div class="text-stone-400">round</div>
          </div>
        </div>
      </header>

      <section class="grid gap-5 lg:grid-cols-[1fr_20rem]">
        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <div id="diceRow" class="grid grid-cols-5 gap-2"></div>
          <div class="mt-4 flex flex-wrap gap-3">
            <button id="rollBtn" class="rounded bg-sky-400 px-5 py-2 font-semibold text-stone-950 hover:bg-sky-300">Roll Dice</button>
            <button id="newGameBtn" class="rounded border border-stone-700 px-5 py-2 font-semibold hover:bg-stone-800">New Game</button>
          </div>
          <p id="status" class="mt-4 min-h-6 text-sm font-medium text-stone-300">Roll the dice to start. Tap dice to hold them.</p>
        </div>

        <aside class="rounded border border-stone-800 bg-stone-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-stone-400">Score Sheet</h2>
          <div id="scoreSheet" class="mt-3 grid gap-2"></div>
        </aside>
      </section>
    </main>

    <script>
      const categories = [
        { id: "ones", label: "Ones", score: (dice) => sumFace(dice, 1) },
        { id: "twos", label: "Twos", score: (dice) => sumFace(dice, 2) },
        { id: "threes", label: "Threes", score: (dice) => sumFace(dice, 3) },
        { id: "chance", label: "Chance", score: (dice) => dice.reduce((sum, die) => sum + die, 0) },
        { id: "full", label: "Full House", score: (dice) => (hasFullHouse(dice) ? 25 : 0) },
        { id: "yacht", label: "Yacht", score: (dice) => (new Set(dice).size === 1 ? 50 : 0) },
      ];

      const diceRow = document.getElementById("diceRow");
      const scoreSheet = document.getElementById("scoreSheet");
      const totalScore = document.getElementById("totalScore");
      const rollsLeft = document.getElementById("rollsLeft");
      const roundCount = document.getElementById("roundCount");
      const statusEl = document.getElementById("status");
      const rollBtn = document.getElementById("rollBtn");
      const newGameBtn = document.getElementById("newGameBtn");

      let dice = [1, 1, 1, 1, 1];
      let held = [false, false, false, false, false];
      let rolls = 3;
      let scores = {};
      let rolledThisRound = false;

      function sumFace(values, face) {
        return values.filter((value) => value === face).reduce((sum, value) => sum + value, 0);
      }

      function counts(values) {
        return values.reduce((map, value) => {
          map[value] = (map[value] || 0) + 1;
          return map;
        }, {});
      }

      function hasFullHouse(values) {
        const groups = Object.values(counts(values)).sort().join(",");
        return groups === "2,3";
      }

      function roundNumber() {
        return Object.keys(scores).length + 1;
      }

      function gameDone() {
        return Object.keys(scores).length === categories.length;
      }

      function rollDice() {
        if (gameDone() || rolls < 1) return;
        dice = dice.map((value, index) => (held[index] ? value : Math.ceil(Math.random() * 6)));
        rolls -= 1;
        rolledThisRound = true;
        statusEl.textContent = rolls ? "Choose holds or score a category." : "No rolls left. Score a category.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-stone-300";
        render();
      }

      function scoreCategory(id) {
        if (!rolledThisRound || scores[id] !== undefined || gameDone()) return;
        const category = categories.find((item) => item.id === id);
        scores[id] = category.score(dice);
        held = [false, false, false, false, false];
        rolls = 3;
        rolledThisRound = false;
        statusEl.textContent = gameDone() ? "Game complete. Start a new game to play again." : "Category scored. Roll for the next round.";
        statusEl.className = gameDone()
          ? "mt-4 min-h-6 text-sm font-medium text-emerald-300"
          : "mt-4 min-h-6 text-sm font-medium text-stone-300";
        render();
      }

      function toggleHold(index) {
        if (!rolledThisRound || gameDone()) return;
        held[index] = !held[index];
        render();
      }

      function newGame() {
        dice = [1, 1, 1, 1, 1];
        held = [false, false, false, false, false];
        rolls = 3;
        scores = {};
        rolledThisRound = false;
        statusEl.textContent = "Roll the dice to start. Tap dice to hold them.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-stone-300";
        render();
      }

      function renderDice() {
        diceRow.innerHTML = "";
        dice.forEach((value, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = [
            "flex aspect-square items-center justify-center rounded border text-4xl font-black transition",
            held[index] ? "border-sky-200 bg-sky-300 text-stone-950" : "border-stone-700 bg-stone-950 text-stone-100 hover:bg-stone-800",
          ].join(" ");
          button.textContent = value;
          button.addEventListener("click", () => toggleHold(index));
          diceRow.appendChild(button);
        });
      }

      function renderScoreSheet() {
        scoreSheet.innerHTML = "";
        categories.forEach((category) => {
          const used = scores[category.id] !== undefined;
          const preview = rolledThisRound ? category.score(dice) : "--";
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = used || !rolledThisRound || gameDone();
          button.className = [
            "flex items-center justify-between rounded border px-3 py-2 text-left",
            used ? "border-stone-800 bg-stone-950 text-stone-500" : "border-stone-700 bg-stone-950 hover:bg-stone-800",
          ].join(" ");
          button.innerHTML = `<span class="font-semibold">${category.label}</span><span class="font-mono">${used ? scores[category.id] : preview}</span>`;
          button.addEventListener("click", () => scoreCategory(category.id));
          scoreSheet.appendChild(button);
        });
      }

      function render() {
        renderDice();
        renderScoreSheet();
        totalScore.textContent = Object.values(scores).reduce((sum, value) => sum + value, 0);
        rollsLeft.textContent = rolls;
        roundCount.textContent = `${Math.min(roundNumber(), categories.length)}/${categories.length}`;
        rollBtn.disabled = gameDone() || rolls < 1;
        rollBtn.className = rollBtn.disabled
          ? "rounded bg-stone-700 px-5 py-2 font-semibold text-stone-400"
          : "rounded bg-sky-400 px-5 py-2 font-semibold text-stone-950 hover:bg-sky-300";
      }

      rollBtn.addEventListener("click", rollDice);
      newGameBtn.addEventListener("click", newGame);
      newGame();
    </script>
  </body>
</html>
