<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Dice 10000</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-emerald-950 text-emerald-50">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
      <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-amber-300">classic dice</p>
          <h1 class="text-3xl font-bold">Mini Dice 10000</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-emerald-700 bg-emerald-900 p-3">
            <div class="text-amber-200">Bank</div>
            <div id="bankScore" class="text-xl font-bold">0</div>
          </div>
          <div class="rounded border border-emerald-700 bg-emerald-900 p-3">
            <div class="text-amber-200">Turn</div>
            <div id="turnScore" class="text-xl font-bold">0</div>
          </div>
          <div class="rounded border border-emerald-700 bg-emerald-900 p-3">
            <div class="text-amber-200">Goal</div>
            <div class="text-xl font-bold">10000</div>
          </div>
        </div>
      </header>

      <section class="rounded border border-emerald-700 bg-emerald-900/70 p-4">
        <div id="diceGrid" class="grid grid-cols-3 gap-3 sm:grid-cols-6"></div>
        <p id="message" class="mt-4 min-h-6 text-sm text-emerald-100"></p>
      </section>

      <section class="grid gap-3 sm:grid-cols-3">
        <button
          id="rollBtn"
          class="rounded bg-amber-400 px-4 py-3 font-semibold text-emerald-950 hover:bg-amber-300 disabled:cursor-not-allowed disabled:bg-emerald-800 disabled:text-emerald-500"
        >
          Roll Dice
        </button>
        <button
          id="scoreBtn"
          class="rounded bg-emerald-200 px-4 py-3 font-semibold text-emerald-950 hover:bg-white disabled:cursor-not-allowed disabled:bg-emerald-800 disabled:text-emerald-500"
        >
          Keep Selected
        </button>
        <button
          id="bankBtn"
          class="rounded border border-amber-300 px-4 py-3 font-semibold text-amber-100 hover:bg-emerald-800 disabled:cursor-not-allowed disabled:border-emerald-800 disabled:text-emerald-500"
        >
          Bank Turn
        </button>
      </section>

      <section class="grid gap-3 text-sm text-emerald-100 sm:grid-cols-2">
        <div class="rounded border border-emerald-800 p-4">
          <h2 class="mb-2 font-semibold text-amber-200">Scoring</h2>
          <p>Single 1 = 100, single 5 = 50. Three 1s = 1000. Three 2s-6s = face x 100.</p>
        </div>
        <div class="rounded border border-emerald-800 p-4">
          <h2 class="mb-2 font-semibold text-amber-200">Turn</h2>
          <p>Keep scoring dice, roll the rest, or bank your turn. A roll with no scoring dice busts the turn.</p>
        </div>
      </section>
    </main>

    <script>
      const diceGrid = document.getElementById("diceGrid");
      const bankScoreEl = document.getElementById("bankScore");
      const turnScoreEl = document.getElementById("turnScore");
      const messageEl = document.getElementById("message");
      const rollBtn = document.getElementById("rollBtn");
      const scoreBtn = document.getElementById("scoreBtn");
      const bankBtn = document.getElementById("bankBtn");

      let bankScore = 0;
      let turnScore = 0;
      let dice = [];
      let selected = new Set();
      let canScore = false;

      function rollDie() {
        return Math.floor(Math.random() * 6) + 1;
      }

      function scoreDice(values) {
        const counts = [0, 0, 0, 0, 0, 0, 0];
        values.forEach((value) => counts[value]++);
        let score = 0;

        for (let value = 1; value <= 6; value++) {
          if (counts[value] >= 3) {
            score += value === 1 ? 1000 : value * 100;
            counts[value] -= 3;
          }
        }

        score += counts[1] * 100;
        score += counts[5] * 50;
        return score;
      }

      function selectionScoresFully(values) {
        const counts = [0, 0, 0, 0, 0, 0, 0];
        values.forEach((value) => counts[value]++);

        for (let value = 1; value <= 6; value++) {
          if (counts[value] >= 3) {
            counts[value] -= 3;
          }
        }

        for (let value = 2; value <= 6; value++) {
          if (value !== 5 && counts[value] > 0) return false;
        }
        return values.length > 0;
      }

      function hasScoringDice(values) {
        for (let value = 1; value <= 6; value++) {
          if (values.filter((die) => die === value).length >= 3) return true;
        }
        return values.includes(1) || values.includes(5);
      }

      function renderDice() {
        diceGrid.innerHTML = "";
        dice.forEach((value, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = value;
          button.className = [
            "aspect-square rounded border text-3xl font-bold transition",
            selected.has(index)
              ? "border-amber-200 bg-amber-300 text-emerald-950"
              : "border-emerald-600 bg-emerald-800 text-emerald-50 hover:bg-emerald-700",
          ].join(" ");
          button.addEventListener("click", () => toggleDie(index));
          diceGrid.appendChild(button);
        });
      }

      function render() {
        bankScoreEl.textContent = bankScore;
        turnScoreEl.textContent = turnScore;
        rollBtn.disabled = canScore;
        scoreBtn.disabled = !canScore || selected.size === 0;
        bankBtn.disabled = turnScore === 0;
        renderDice();
      }

      function toggleDie(index) {
        if (!canScore) return;
        selected.has(index) ? selected.delete(index) : selected.add(index);
        render();
      }

      function rollDice() {
        if (canScore) {
          messageEl.textContent = "Keep scoring dice or bank before rolling again.";
          render();
          return;
        }
        selected.clear();
        const count = dice.length === 0 ? 6 : dice.length;
        dice = Array.from({ length: count }, rollDie);
        canScore = true;
        if (!hasScoringDice(dice)) {
          turnScore = 0;
          dice = [];
          canScore = false;
          messageEl.textContent = "Bust. No scoring dice on this roll.";
        } else {
          messageEl.textContent = "Select scoring dice, then keep them or bank your turn.";
        }
        render();
      }

      function keepSelectedDice() {
        const kept = [...selected].map((index) => dice[index]);
        if (!selectionScoresFully(kept)) {
          messageEl.textContent = "Every selected die must be part of a scoring set.";
          return;
        }
        const gained = scoreDice(kept);
        turnScore += gained;
        dice = dice.filter((_, index) => !selected.has(index));
        selected.clear();
        canScore = false;
        messageEl.textContent =
          dice.length === 0
            ? `Kept ${gained} points. Hot dice: roll all six again or bank ${turnScore}.`
            : `Kept ${gained} points. Roll again or bank ${turnScore}.`;
        render();
      }

      function bankTurn() {
        bankScore += turnScore;
        const won = bankScore >= 10000;
        turnScore = 0;
        dice = [];
        selected.clear();
        canScore = false;
        messageEl.textContent = won ? "You reached 10000. New game started." : "Turn banked. Roll for a new turn.";
        if (won) bankScore = 0;
        render();
      }

      rollBtn.addEventListener("click", rollDice);
      scoreBtn.addEventListener("click", keepSelectedDice);
      bankBtn.addEventListener("click", bankTurn);

      messageEl.textContent = "Roll all six dice to start.";
      render();
    </script>
  </body>
</html>
