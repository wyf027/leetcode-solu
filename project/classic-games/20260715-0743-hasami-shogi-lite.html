<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Hasami Shogi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-white">Mini Hasami Shogi</h1>
        <p class="mt-1 text-sm text-zinc-300">横纵滑行，用两枚己方棋子夹住敌子即可捕获。</p>
      </div>
      <button id="resetBtn" class="rounded-md bg-orange-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-orange-300">
        重新开始
      </button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_230px]">
      <div class="rounded-lg border border-zinc-700 bg-zinc-900 p-3 shadow-xl">
        <div id="board" class="grid aspect-square w-full grid-cols-5 overflow-hidden rounded-md border border-zinc-700"></div>
      </div>

      <aside class="rounded-lg border border-zinc-700 bg-zinc-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs uppercase text-zinc-400">当前回合</p>
            <p id="turnText" class="mt-1 text-2xl font-bold text-white">金方</p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded-md bg-zinc-800 p-3">
              <p class="text-zinc-400">金方</p>
              <p id="goldCount" class="text-xl font-semibold text-white">5</p>
            </div>
            <div class="rounded-md bg-zinc-800 p-3">
              <p class="text-zinc-400">银方</p>
              <p id="silverCount" class="text-xl font-semibold text-white">5</p>
            </div>
          </div>
          <p id="statusText" class="rounded-md bg-zinc-800 p-3 text-sm leading-6 text-zinc-200">
            金方先手。选择己方棋子，再横向或纵向滑到空格。
          </p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const statusText = document.getElementById("statusText");
    const goldCount = document.getElementById("goldCount");
    const silverCount = document.getElementById("silverCount");
    const resetBtn = document.getElementById("resetBtn");
    const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    let board = [];
    let turn = "G";
    let selected = null;
    let winner = null;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(""));
      for (let col = 0; col < size; col++) {
        board[0][col] = "S";
        board[size - 1][col] = "G";
      }
      turn = "G";
      selected = null;
      winner = null;
      render();
    }

    function sideName(side) {
      return side === "G" ? "金方" : "银方";
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function legalMoves(row, col) {
      if (!board[row][col] || winner) return [];
      const moves = [];
      for (const [rowStep, colStep] of directions) {
        let nextRow = row + rowStep;
        let nextCol = col + colStep;
        while (inBounds(nextRow, nextCol) && !board[nextRow][nextCol]) {
          moves.push([nextRow, nextCol]);
          nextRow += rowStep;
          nextCol += colStep;
        }
      }
      return moves;
    }

    function countPieces(side) {
      return board.flat().filter((cell) => cell === side).length;
    }

    function captureFrom(row, col) {
      const side = board[row][col];
      const enemy = side === "G" ? "S" : "G";
      let captured = 0;
      for (const [rowStep, colStep] of directions) {
        const line = [];
        let nextRow = row + rowStep;
        let nextCol = col + colStep;
        while (inBounds(nextRow, nextCol) && board[nextRow][nextCol] === enemy) {
          line.push([nextRow, nextCol]);
          nextRow += rowStep;
          nextCol += colStep;
        }
        if (line.length && inBounds(nextRow, nextCol) && board[nextRow][nextCol] === side) {
          for (const [captureRow, captureCol] of line) {
            board[captureRow][captureCol] = "";
            captured++;
          }
        }
      }
      return captured;
    }

    function hasMove(side) {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (board[row][col] === side && legalMoves(row, col).length > 0) return true;
        }
      }
      return false;
    }

    function checkWinner(nextTurn) {
      const gold = countPieces("G");
      const silver = countPieces("S");
      if (gold <= 1) return "S";
      if (silver <= 1) return "G";
      if (!hasMove(nextTurn)) return nextTurn === "G" ? "S" : "G";
      return null;
    }

    function movePiece(row, col) {
      if (!selected) return;
      const moves = legalMoves(selected.row, selected.col);
      if (!moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col)) return;
      const side = board[selected.row][selected.col];
      board[selected.row][selected.col] = "";
      board[row][col] = side;
      const captured = captureFrom(row, col);
      const nextTurn = turn === "G" ? "S" : "G";
      winner = checkWinner(nextTurn);
      selected = null;
      turn = nextTurn;
      render(captured);
    }

    function handleCell(row, col) {
      if (winner) return;
      if (selected && !board[row][col]) {
        movePiece(row, col);
        return;
      }
      selected = board[row][col] === turn ? { row, col } : null;
      render();
    }

    function render(captured = 0) {
      const moves = selected ? legalMoves(selected.row, selected.col) : [];
      boardEl.innerHTML = "";
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const isMove = moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col);
          const isSelected = selected && selected.row === row && selected.col === col;
          const button = document.createElement("button");
          button.className = [
            "flex aspect-square items-center justify-center border border-zinc-800 text-xl font-black transition",
            (row + col) % 2 ? "bg-zinc-700" : "bg-zinc-600",
            isMove ? "bg-orange-500 hover:bg-orange-400" : "hover:brightness-110",
            isSelected ? "ring-4 ring-white ring-inset" : ""
          ].join(" ");
          button.setAttribute("aria-label", `${row + 1}-${col + 1}`);
          button.addEventListener("click", () => handleCell(row, col));
          if (board[row][col]) {
            const disk = document.createElement("span");
            disk.className = [
              "flex h-3/5 w-3/5 items-center justify-center rounded-full border-2 shadow-lg",
              board[row][col] === "G" ? "border-amber-100 bg-amber-400 text-zinc-950" : "border-zinc-100 bg-zinc-200 text-zinc-950"
            ].join(" ");
            disk.textContent = board[row][col];
            button.appendChild(disk);
          }
          boardEl.appendChild(button);
        }
      }

      goldCount.textContent = countPieces("G");
      silverCount.textContent = countPieces("S");
      turnText.textContent = winner ? `${sideName(winner)}获胜` : sideName(turn);
      statusText.textContent = winner
        ? `${sideName(winner)}完成夹击优势。点击重新开始再来一局。`
        : selected
          ? `${sideName(turn)}已选中棋子，可滑行到 ${moves.length} 个空格。`
          : captured > 0
            ? `刚刚夹击捕获 ${captured} 枚棋子。${sideName(turn)}行动。`
            : `${sideName(turn)}行动。横纵滑行，让连续敌子被两端夹住。`;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
