<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Track Field</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-5">
      <header class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-orange-300">Classic Games</p>
          <h1 class="text-3xl font-bold md:text-4xl">Mini Track Field</h1>
          <p class="mt-2 max-w-2xl text-sm text-slate-400">
            交替敲击左右键冲刺，到踏板前按跳跃起跳，控制角度完成跳远。
          </p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="rounded-md border border-slate-700 bg-slate-900 px-3 py-2">
            <p class="text-xs text-slate-400">Speed</p>
            <p id="speed" class="text-xl font-bold text-cyan-200">0</p>
          </div>
          <div class="rounded-md border border-slate-700 bg-slate-900 px-3 py-2">
            <p class="text-xs text-slate-400">Best</p>
            <p id="best" class="text-xl font-bold text-emerald-200">0.0m</p>
          </div>
          <div class="rounded-md border border-slate-700 bg-slate-900 px-3 py-2">
            <p class="text-xs text-slate-400">Phase</p>
            <p id="phase" class="text-xl font-bold text-orange-200">Run</p>
          </div>
        </div>
      </header>

      <section class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div class="rounded-lg border border-slate-800 bg-slate-900 p-3 shadow-xl shadow-black/30">
          <canvas
            id="game"
            width="760"
            height="460"
            class="block w-full rounded-md bg-gradient-to-b from-sky-950 via-slate-950 to-stone-900"
          ></canvas>
        </div>

        <aside class="grid content-start gap-3 rounded-lg border border-slate-800 bg-slate-900 p-4">
          <div class="grid grid-cols-2 gap-2">
            <button id="left" class="h-12 rounded-md bg-cyan-400 font-bold text-slate-950 hover:bg-cyan-300">
              A / ←
            </button>
            <button id="right" class="h-12 rounded-md bg-cyan-400 font-bold text-slate-950 hover:bg-cyan-300">
              D / →
            </button>
          </div>
          <button id="jump" class="h-12 rounded-md bg-orange-400 font-bold text-slate-950 hover:bg-orange-300">
            Space 跳跃 / 定角度
          </button>
          <button
            id="restart"
            class="h-11 rounded-md border border-slate-700 bg-slate-950 text-sm font-semibold hover:border-orange-300 hover:text-orange-200"
          >
            重新开始
          </button>
          <div class="rounded-md border border-slate-700 bg-slate-950 p-3">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Power</p>
            <div class="mt-2 h-3 overflow-hidden rounded-full bg-slate-800">
              <div id="power-bar" class="h-full rounded-full bg-cyan-400"></div>
            </div>
          </div>
          <p id="message" class="min-h-20 rounded-md bg-slate-950 p-3 text-sm text-slate-300">
            交替按 A/D 加速，接近白线时按 Space 起跳。
          </p>
        </aside>
      </section>
    </main>

    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const speedEl = document.querySelector("#speed");
      const bestEl = document.querySelector("#best");
      const phaseEl = document.querySelector("#phase");
      const powerBar = document.querySelector("#power-bar");
      const messageEl = document.querySelector("#message");
      const leftBtn = document.querySelector("#left");
      const rightBtn = document.querySelector("#right");
      const jumpBtn = document.querySelector("#jump");
      const restartBtn = document.querySelector("#restart");

      const state = {
        phase: "run",
        runnerX: 80,
        speed: 0,
        angle: 20,
        angleDir: 1,
        flightT: 0,
        distance: 0,
        best: Number(localStorage.getItem("mini-track-field-best") || 0),
        lastStep: "",
        foul: false,
        lastTime: 0,
      };

      const boardX = 575;
      const sandX = 620;
      const groundY = 330;

      const reset = () => {
        state.phase = "run";
        state.runnerX = 80;
        state.speed = 0;
        state.angle = 20;
        state.angleDir = 1;
        state.flightT = 0;
        state.distance = 0;
        state.lastStep = "";
        state.foul = false;
        messageEl.textContent = "交替按 A/D 加速，接近白线时按 Space 起跳。";
        updateHud();
      };

      const updateHud = () => {
        speedEl.textContent = Math.round(state.speed);
        bestEl.textContent = state.best.toFixed(1) + "m";
        phaseEl.textContent = state.phase === "run" ? "Run" : state.phase === "angle" ? "Angle" : "Jump";
        const power = state.phase === "angle" ? state.angle / 45 : Math.min(1, state.speed / 16);
        powerBar.style.width = Math.round(power * 100) + "%";
        powerBar.className = "h-full rounded-full " + (state.phase === "angle" ? "bg-orange-400" : "bg-cyan-400");
      };

      const step = (side) => {
        if (state.phase !== "run") return;
        if (side !== state.lastStep) {
          state.speed = Math.min(16, state.speed + 1.35);
          state.lastStep = side;
          messageEl.textContent = "节奏有效，继续交替加速。";
        } else {
          state.speed = Math.max(0, state.speed - 0.9);
          messageEl.textContent = "需要左右交替，重复按会掉速。";
        }
        updateHud();
      };

      const jump = () => {
        if (state.phase === "run") {
          if (state.runnerX < boardX - 70) {
            messageEl.textContent = "起跳太早，继续冲刺到白线附近。";
            return;
          }
          state.foul = state.runnerX > boardX + 16;
          state.phase = "angle";
          messageEl.textContent = state.foul ? "踩线了！仍可练习角度。" : "再次按 Space 锁定起跳角度。";
        } else if (state.phase === "angle") {
          state.phase = "flight";
          state.flightT = 0;
          const angleFactor = Math.sin((state.angle * Math.PI) / 90);
          state.distance = state.foul ? 0 : Math.max(0, state.speed * angleFactor * 0.72);
          if (state.distance > state.best) {
            state.best = state.distance;
            localStorage.setItem("mini-track-field-best", String(state.best));
          }
          messageEl.textContent = state.foul
            ? "犯规无成绩。"
            : "成绩 " + state.distance.toFixed(1) + "m，按重新开始再跳。";
        } else {
          reset();
        }
        updateHud();
      };

      const drawRunner = () => {
        const x = state.phase === "flight" ? sandX + state.flightT * state.distance * 8 : state.runnerX;
        const arc = state.phase === "flight" ? Math.sin(state.flightT * Math.PI) * state.distance * 18 : 0;
        const y = groundY - arc;
        ctx.strokeStyle = "#f8fafc";
        ctx.lineWidth = 9;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x, y - 52);
        ctx.lineTo(x, y - 18);
        ctx.moveTo(x, y - 42);
        ctx.lineTo(x + 24, y - 30);
        ctx.moveTo(x, y - 40);
        ctx.lineTo(x - 24, y - 27);
        ctx.moveTo(x, y - 18);
        ctx.lineTo(x + 20, y + 10);
        ctx.moveTo(x, y - 18);
        ctx.lineTo(x - 18, y + 12);
        ctx.stroke();
        ctx.fillStyle = "#fed7aa";
        ctx.beginPath();
        ctx.arc(x, y - 70, 15, 0, Math.PI * 2);
        ctx.fill();
      };

      const draw = () => {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#7c2d12";
        ctx.fillRect(0, groundY + 14, sandX, 92);
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(sandX, groundY + 14, 150, 92);
        ctx.fillStyle = "#e5e7eb";
        ctx.fillRect(boardX, groundY + 8, 10, 104);
        ctx.strokeStyle = "#fb923c";
        ctx.lineWidth = 2;
        for (let i = 0; i < 10; i += 1) {
          ctx.beginPath();
          ctx.moveTo(20 + i * 56, groundY + 104);
          ctx.lineTo(55 + i * 56, groundY + 104);
          ctx.stroke();
        }
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "14px system-ui, sans-serif";
        ctx.fillText("Takeoff", boardX - 22, groundY);
        ctx.fillText("Sand", sandX + 42, groundY);

        if (state.phase === "angle") {
          ctx.strokeStyle = "#fb923c";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(boardX, groundY - 30);
          ctx.lineTo(boardX + Math.cos((state.angle * Math.PI) / 180) * 86, groundY - 30 - Math.sin((state.angle * Math.PI) / 180) * 86);
          ctx.stroke();
          ctx.fillStyle = "#fed7aa";
          ctx.fillText(Math.round(state.angle) + "°", boardX + 72, groundY - 72);
        }

        if (state.phase === "flight" && state.distance > 0) {
          ctx.fillStyle = "#38bdf8";
          ctx.fillRect(sandX + state.distance * 8, groundY + 18, 4, 58);
          ctx.fillText(state.distance.toFixed(1) + "m", sandX + state.distance * 8 + 8, groundY + 46);
        }
        drawRunner();
      };

      const tick = (time) => {
        const delta = Math.min(36, time - (state.lastTime || time));
        state.lastTime = time;
        if (state.phase === "run") {
          state.runnerX += state.speed * delta * 0.018;
          state.speed = Math.max(0, state.speed - delta * 0.006);
          if (state.runnerX > boardX + 38) {
            state.foul = true;
            state.phase = "angle";
            messageEl.textContent = "冲过踏板，犯规练习跳。";
          }
        } else if (state.phase === "angle") {
          state.angle += state.angleDir * delta * 0.08;
          if (state.angle > 45 || state.angle < 12) state.angleDir *= -1;
        } else if (state.phase === "flight") {
          state.flightT = Math.min(1, state.flightT + delta * 0.0018);
        }
        updateHud();
        draw();
        requestAnimationFrame(tick);
      };

      leftBtn.addEventListener("click", () => step("left"));
      rightBtn.addEventListener("click", () => step("right"));
      jumpBtn.addEventListener("click", jump);
      restartBtn.addEventListener("click", reset);
      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (key === "a" || event.key === "ArrowLeft") step("left");
        if (key === "d" || event.key === "ArrowRight") step("right");
        if (key === " ") jump();
      });

      reset();
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
