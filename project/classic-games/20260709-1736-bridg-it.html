<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Bridg-it</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Bridg-it</h1><p class="text-sm text-slate-300">Blue connects left to right; Gold connects top to bottom. Click a legal bridge.</p></div><button id="newGameBtn" class="rounded bg-emerald-300 px-4 py-2 font-semibold text-slate-950 hover:bg-emerald-200">New Game</button></header><section class="grid gap-3 rounded border border-slate-700 bg-slate-900 p-3 sm:grid-cols-3"><div>Turn: <b id="turnLabel">Blue</b></div><div>Blue bridges: <b id="blueCount">0</b></div><div id="message">Choose an empty horizontal bridge.</div></section><section id="board" class="mx-auto grid w-full max-w-xl grid-cols-[repeat(9,minmax(0,1fr))] grid-rows-[repeat(9,minmax(0,1fr))] gap-1 rounded border border-slate-700 bg-slate-800 p-3"></section></main><script>
const size=5;let blue,gold,turn,over;const el=id=>document.getElementById(id),boardEl=el('board'),turnLabel=el('turnLabel'),blueCount=el('blueCount'),message=el('message'),newGameBtn=el('newGameBtn');const key=(r,c,d)=>`${r},${c},${d}`;function name(p){return p==='B'?'Blue':'Gold'}function hasWon(p){const seen=new Set(),q=[];if(p==='B'){for(let r=0;r<size;r++)q.push([r,0])}else{for(let c=0;c<size;c++)q.push([0,c])}while(q.length){const [r,c]=q.pop(),id=r+','+c;if(seen.has(id))continue;seen.add(id);if((p==='B'&&c===size-1)||(p==='G'&&r===size-1))return true;const edges=p==='B'?[[0,-1,'h',r,c-1],[0,1,'h',r,c],[-1,0,'v',r-1,c],[1,0,'v',r,c]]:[[0,-1,'h',r,c-1],[0,1,'h',r,c],[-1,0,'v',r-1,c],[1,0,'v',r,c]];for(const[dr,dc,d,er,ec]of edges){if(er>=0&&ec>=0&&er<size&&ec<size&&(p==='B'?blue:gold).has(key(er,ec,d)))q.push([r+dr,c+dc])}}return false}function bridgeClick(r,c,d){if(over)return;const set=turn==='B'?blue:gold;if(set.has(key(r,c,d)))return;if(turn==='B'&&d!=='h'){message.textContent='Blue must place horizontal bridges.';return}if(turn==='G'&&d!=='v'){message.textContent='Gold must place vertical bridges.';return}set.add(key(r,c,d));if(hasWon(turn)){message.textContent=`${name(turn)} wins.`;over=true}else{turn=turn==='B'?'G':'B';message.textContent=`${name(turn)} chooses ${turn==='B'?'horizontal':'vertical'} bridges.`}render()}function render(){turnLabel.textContent=over?'Game Over':name(turn);blueCount.textContent=blue.size;boardEl.innerHTML='';for(let gr=0;gr<9;gr++)for(let gc=0;gc<9;gc++){const cell=document.createElement('button');cell.className='aspect-square rounded text-xs';if(gr%2===0&&gc%2===0){cell.className+=' bg-white'}else if(gr%2===0){const r=gr/2,c=(gc-1)/2,on=blue.has(key(r,c,'h'));cell.className+=' '+(on?'bg-sky-300':'bg-slate-700 hover:bg-sky-500');cell.onclick=()=>bridgeClick(r,c,'h')}else if(gc%2===0){const r=(gr-1)/2,c=gc/2,on=gold.has(key(r,c,'v'));cell.className+=' '+(on?'bg-amber-300':'bg-slate-700 hover:bg-amber-500');cell.onclick=()=>bridgeClick(r,c,'v')}else cell.className+=' bg-slate-900';boardEl.appendChild(cell)}}function newGame(){blue=new Set();gold=new Set();turn='B';over=false;message.textContent='Choose an empty horizontal bridge.';render()}newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
