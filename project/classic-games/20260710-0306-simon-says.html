<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Simon Says</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Simon Says</h1>
        <p class="text-sm text-zinc-300">Watch the pattern, then repeat it by tapping the colors in order.</p>
      </div>
      <button id="startBtn" class="rounded bg-white px-4 py-2 font-semibold text-zinc-950 hover:bg-zinc-200">Start</button>
    </header>

    <section class="grid gap-3 rounded border border-zinc-700 bg-zinc-900 p-3 sm:grid-cols-3">
      <div>Level: <b id="levelText">0</b></div>
      <div>Best: <b id="bestText">0</b></div>
      <div id="message" class="text-zinc-200">Press Start to play.</div>
    </section>

    <section id="pads" class="grid aspect-square max-h-[70vh] grid-cols-2 gap-3 self-center">
      <button data-pad="0" class="pad h-full min-h-32 rounded bg-red-600 shadow-lg transition hover:bg-red-500" aria-label="Red"></button>
      <button data-pad="1" class="pad h-full min-h-32 rounded bg-sky-600 shadow-lg transition hover:bg-sky-500" aria-label="Blue"></button>
      <button data-pad="2" class="pad h-full min-h-32 rounded bg-amber-500 shadow-lg transition hover:bg-amber-400" aria-label="Yellow"></button>
      <button data-pad="3" class="pad h-full min-h-32 rounded bg-emerald-600 shadow-lg transition hover:bg-emerald-500" aria-label="Green"></button>
    </section>
  </main>

  <script>
    const pads = [...document.querySelectorAll(".pad")];
    const startBtn = document.getElementById("startBtn");
    const levelText = document.getElementById("levelText");
    const bestText = document.getElementById("bestText");
    const message = document.getElementById("message");
    let sequence = [];
    let inputIndex = 0;
    let playingBack = false;
    let best = 0;

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function setButtons(enabled) {
      pads.forEach((pad) => {
        pad.disabled = !enabled;
        pad.classList.toggle("cursor-not-allowed", !enabled);
      });
    }

    async function flashPad(index) {
      const pad = pads[index];
      pad.classList.add("scale-95", "brightness-150", "ring-4", "ring-white");
      await sleep(320);
      pad.classList.remove("scale-95", "brightness-150", "ring-4", "ring-white");
      await sleep(140);
    }

    async function playSequence() {
      playingBack = true;
      setButtons(false);
      message.textContent = "Watch the pattern.";
      await sleep(500);
      for (const index of sequence) {
        await flashPad(index);
      }
      inputIndex = 0;
      playingBack = false;
      setButtons(true);
      message.textContent = "Your turn.";
    }

    function addStep() {
      sequence.push(Math.floor(Math.random() * pads.length));
      levelText.textContent = String(sequence.length);
      playSequence();
    }

    function startGame() {
      sequence = [];
      inputIndex = 0;
      levelText.textContent = "0";
      message.textContent = "Get ready.";
      addStep();
    }

    function failGame() {
      best = Math.max(best, sequence.length - 1);
      bestText.textContent = String(best);
      message.textContent = `Missed it. Final level: ${sequence.length - 1}.`;
      sequence = [];
      inputIndex = 0;
      levelText.textContent = "0";
      setButtons(false);
    }

    async function handlePadClick(event) {
      if (playingBack || sequence.length === 0) return;
      const index = Number(event.currentTarget.dataset.pad);
      await flashPad(index);
      if (index !== sequence[inputIndex]) {
        failGame();
        return;
      }
      inputIndex += 1;
      if (inputIndex === sequence.length) {
        best = Math.max(best, sequence.length);
        bestText.textContent = String(best);
        setButtons(false);
        message.textContent = "Correct. Next level.";
        window.setTimeout(addStep, 700);
      }
    }

    pads.forEach((pad) => pad.addEventListener("click", handlePadClick));
    startBtn.addEventListener("click", startGame);
    setButtons(false);
  </script>
</body>
</html>
