<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Mehen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-normal">Mini Mehen</h1>
        <p class="text-sm text-stone-300">沿螺旋蛇盘前进，先抵达蛇头的一方获胜。</p>
      </div>
      <button id="resetBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-amber-200">重新开始</button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_270px]">
      <div class="rounded border border-amber-900 bg-stone-900 p-3">
        <canvas id="board" width="680" height="680" class="mx-auto aspect-square w-full max-w-[680px] rounded bg-amber-50"></canvas>
      </div>

      <aside class="flex flex-col gap-3 rounded border border-stone-700 bg-stone-900 p-4">
        <div class="grid grid-cols-2 gap-2 text-center">
          <div class="rounded bg-stone-800 p-3">
            <div class="text-xs text-stone-400">回合</div>
            <div id="turn" class="text-xl font-bold text-amber-300">红方</div>
          </div>
          <div class="rounded bg-stone-800 p-3">
            <div class="text-xs text-stone-400">骰子</div>
            <div id="die" class="text-2xl font-bold text-sky-300">-</div>
          </div>
        </div>

        <div class="rounded bg-stone-800 p-3 text-sm leading-6">
          <div class="flex justify-between"><span>红方位置</span><span id="redPos">0</span></div>
          <div class="flex justify-between"><span>蓝方位置</span><span id="bluePos">0</span></div>
          <div class="flex justify-between"><span>终点</span><span id="finishPos">28</span></div>
        </div>

        <button id="rollBtn" class="rounded bg-amber-300 px-4 py-3 text-sm font-bold text-stone-950 hover:bg-amber-200">掷骰前进</button>
        <p id="message" class="min-h-20 rounded bg-stone-800 p-3 text-sm leading-6 text-stone-200">每回合掷 1-4 点。超过终点会反弹，停在对手格会把对手推回 2 格。</p>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const turnEl = document.getElementById("turn");
    const dieEl = document.getElementById("die");
    const redPosEl = document.getElementById("redPos");
    const bluePosEl = document.getElementById("bluePos");
    const finishPosEl = document.getElementById("finishPos");
    const messageEl = document.getElementById("message");
    const rollBtn = document.getElementById("rollBtn");
    const resetBtn = document.getElementById("resetBtn");

    const center = { x: 340, y: 340 };
    const finish = 28;
    const cells = [];
    let players = [];
    let current = 0;
    let busy = false;
    let lastDie = "-";

    function buildSpiral() {
      cells.length = 0;
      for (let i = 0; i <= finish; i += 1) {
        const t = i / finish;
        const angle = 4.85 * Math.PI - t * 5.45 * Math.PI;
        const radius = 292 - t * 246;
        cells.push({
          x: center.x + Math.cos(angle) * radius,
          y: center.y + Math.sin(angle) * radius,
          r: 17 - t * 4
        });
      }
    }

    function resetGame() {
      players = [
        { name: "红方", color: "#ef4444", pos: 0 },
        { name: "蓝方", color: "#2563eb", pos: 0 }
      ];
      current = 0;
      busy = false;
      lastDie = "-";
      messageEl.textContent = "每回合掷 1-4 点。超过终点会反弹，停在对手格会把对手推回 2 格。";
      updateHud();
      drawBoard();
    }

    function updateHud() {
      turnEl.textContent = players[current].name;
      turnEl.className = current === 0 ? "text-xl font-bold text-red-300" : "text-xl font-bold text-blue-300";
      dieEl.textContent = lastDie;
      redPosEl.textContent = players[0].pos;
      bluePosEl.textContent = players[1].pos;
      finishPosEl.textContent = finish;
      rollBtn.disabled = busy;
      rollBtn.className = busy
        ? "rounded bg-stone-700 px-4 py-3 text-sm font-bold text-stone-400"
        : "rounded bg-amber-300 px-4 py-3 text-sm font-bold text-stone-950 hover:bg-amber-200";
    }

    function drawBoard() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawSand();
      drawSnakePath();
      drawPlayers();
    }

    function drawSand() {
      const grd = ctx.createRadialGradient(center.x, center.y, 60, center.x, center.y, 330);
      grd.addColorStop(0, "#fde68a");
      grd.addColorStop(1, "#d97706");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(120,53,15,0.16)";
      for (let i = 0; i < 40; i += 1) {
        ctx.beginPath();
        ctx.arc((i * 97) % 680, (i * 53) % 680, 2 + (i % 4), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawSnakePath() {
      ctx.strokeStyle = "#78350f";
      ctx.lineWidth = 28;
      ctx.lineCap = "round";
      ctx.beginPath();
      cells.forEach((cell, index) => {
        if (index === 0) ctx.moveTo(cell.x, cell.y);
        else ctx.lineTo(cell.x, cell.y);
      });
      ctx.stroke();

      cells.forEach((cell, index) => {
        ctx.fillStyle = index === finish ? "#16a34a" : "#fef3c7";
        ctx.beginPath();
        ctx.arc(cell.x, cell.y, cell.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#92400e";
        ctx.lineWidth = 2;
        ctx.stroke();
        if (index % 4 === 0 || index === finish) {
          ctx.fillStyle = "#78350f";
          ctx.font = "bold 12px system-ui";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(index, cell.x, cell.y);
        }
      });

      const head = cells[finish];
      ctx.fillStyle = "#166534";
      ctx.beginPath();
      ctx.arc(head.x + 6, head.y - 10, 28, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.arc(head.x - 4, head.y - 17, 4, 0, Math.PI * 2);
      ctx.arc(head.x + 14, head.y - 17, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayers() {
      players.forEach((player, index) => {
        const cell = cells[player.pos];
        const offset = index === 0 ? -9 : 9;
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(cell.x + offset, cell.y + 18, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 3;
        ctx.stroke();
      });
    }

    function rollDie() {
      if (busy) return;
      busy = true;
      const player = players[current];
      const die = 1 + Math.floor(Math.random() * 4);
      lastDie = die;
      const from = player.pos;
      let target = player.pos + die;
      if (target > finish) {
        target = finish - (target - finish);
      }
      let frame = 0;
      const frames = 22;
      const animate = () => {
        frame += 1;
        const t = frame / frames;
        player.pos = Math.round(from + (target - from) * t);
        updateHud();
        drawBoard();
        if (frame < frames) {
          requestAnimationFrame(animate);
          return;
        }
        player.pos = target;
        resolveLanding(player, die);
      };
      requestAnimationFrame(animate);
    }

    function resolveLanding(player, die) {
      const opponent = players[1 - current];
      let note = `${player.name} 掷出 ${die} 点，停在第 ${player.pos} 格。`;
      if (player.pos === finish) {
        messageEl.textContent = `${note} ${player.name} 抵达蛇头，获胜。`;
        busy = true;
        updateHud();
        drawBoard();
        return;
      }
      if (player.pos === opponent.pos && opponent.pos > 0) {
        opponent.pos = Math.max(0, opponent.pos - 2);
        note += ` 撞到对手，对手退回到第 ${opponent.pos} 格。`;
      }
      current = 1 - current;
      busy = false;
      messageEl.textContent = note;
      updateHud();
      drawBoard();
    }

    rollBtn.addEventListener("click", rollDie);
    resetBtn.addEventListener("click", resetGame);
    buildSpiral();
    resetGame();
  </script>
</body>
</html>
