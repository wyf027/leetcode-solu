<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Lights Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-5 px-4 py-6">
      <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-cyan-300">classic puzzle</p>
          <h1 class="text-3xl font-bold">Mini Lights Out</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
            <div class="text-cyan-200">Moves</div>
            <div id="moveCount" class="text-xl font-bold">0</div>
          </div>
          <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
            <div class="text-cyan-200">Lit</div>
            <div id="litCount" class="text-xl font-bold">0</div>
          </div>
          <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
            <div class="text-cyan-200">Board</div>
            <div class="text-xl font-bold">5x5</div>
          </div>
        </div>
      </header>

      <section class="rounded border border-zinc-700 bg-zinc-900/80 p-4">
        <div id="board" class="mx-auto grid max-w-md grid-cols-5 gap-2"></div>
        <p id="message" class="mt-4 min-h-6 text-sm text-zinc-300"></p>
      </section>

      <section class="grid gap-3 sm:grid-cols-3">
        <button id="newBtn" class="rounded bg-cyan-300 px-4 py-3 font-semibold text-zinc-950 hover:bg-cyan-200">
          New Puzzle
        </button>
        <button id="resetBtn" class="rounded bg-zinc-100 px-4 py-3 font-semibold text-zinc-950 hover:bg-white">
          Reset Puzzle
        </button>
        <button id="hintBtn" class="rounded border border-cyan-300 px-4 py-3 font-semibold text-cyan-100 hover:bg-zinc-800">
          Hint
        </button>
      </section>

      <section class="rounded border border-zinc-800 p-4 text-sm text-zinc-300">
        <h2 class="mb-2 font-semibold text-cyan-200">Goal</h2>
        <p>Turn every light off. Clicking a tile toggles that tile plus its north, south, east, and west neighbors.</p>
      </section>
    </main>

    <script>
      const size = 5;
      const boardEl = document.getElementById("board");
      const moveCountEl = document.getElementById("moveCount");
      const litCountEl = document.getElementById("litCount");
      const messageEl = document.getElementById("message");
      const newBtn = document.getElementById("newBtn");
      const resetBtn = document.getElementById("resetBtn");
      const hintBtn = document.getElementById("hintBtn");

      let board = [];
      let startingBoard = [];
      let moves = 0;
      let solved = false;

      function makeEmptyBoard() {
        return Array.from({ length: size }, () => Array(size).fill(false));
      }

      function cloneBoard(source) {
        return source.map((row) => [...row]);
      }

      function neighbors(row, col) {
        return [
          [row, col],
          [row - 1, col],
          [row + 1, col],
          [row, col - 1],
          [row, col + 1],
        ].filter(([nextRow, nextCol]) => nextRow >= 0 && nextRow < size && nextCol >= 0 && nextCol < size);
      }

      function toggleAt(row, col) {
        neighbors(row, col).forEach(([nextRow, nextCol]) => {
          board[nextRow][nextCol] = !board[nextRow][nextCol];
        });
      }

      function countLit() {
        return board.flat().filter(Boolean).length;
      }

      function renderBoard() {
        boardEl.innerHTML = "";
        board.forEach((row, rowIndex) => {
          row.forEach((isLit, colIndex) => {
            const button = document.createElement("button");
            button.type = "button";
            button.setAttribute("aria-label", `Tile ${rowIndex + 1}, ${colIndex + 1}`);
            button.className = [
              "aspect-square rounded border text-sm font-semibold transition",
              isLit
                ? "border-cyan-100 bg-cyan-300 text-zinc-950 shadow-[0_0_18px_rgba(103,232,249,0.55)]"
                : "border-zinc-700 bg-zinc-950 text-zinc-600 hover:bg-zinc-800",
            ].join(" ");
            button.textContent = isLit ? "ON" : "OFF";
            button.addEventListener("click", () => playMove(rowIndex, colIndex));
            boardEl.appendChild(button);
          });
        });
      }

      function render() {
        moveCountEl.textContent = moves;
        litCountEl.textContent = countLit();
        renderBoard();
      }

      function checkSolved() {
        solved = countLit() === 0;
        if (solved) {
          messageEl.textContent = `Solved in ${moves} moves.`;
        }
      }

      function playMove(row, col) {
        if (solved) return;
        toggleAt(row, col);
        moves += 1;
        messageEl.textContent = "Keep turning lights off.";
        checkSolved();
        render();
      }

      function shufflePuzzle() {
        board = makeEmptyBoard();
        moves = 0;
        solved = false;
        for (let index = 0; index < 12; index++) {
          toggleAt(Math.floor(Math.random() * size), Math.floor(Math.random() * size));
        }
        if (countLit() === 0) toggleAt(2, 2);
        startingBoard = cloneBoard(board);
        messageEl.textContent = "New puzzle ready.";
        render();
      }

      function resetPuzzle() {
        board = cloneBoard(startingBoard);
        moves = 0;
        solved = false;
        messageEl.textContent = "Puzzle reset.";
        render();
      }

      function showHint() {
        if (solved) {
          messageEl.textContent = "All lights are already off.";
          return;
        }
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            if (board[row][col]) {
              messageEl.textContent = `Try pressing near row ${row + 1}, column ${col + 1}.`;
              return;
            }
          }
        }
      }

      newBtn.addEventListener("click", shufflePuzzle);
      resetBtn.addEventListener("click", resetPuzzle);
      hintBtn.addEventListener("click", showHint);

      shufflePuzzle();
    </script>
  </body>
</html>
