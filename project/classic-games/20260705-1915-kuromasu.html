<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Kuromasu</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-6 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-slate-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-cyan-300">Classic Logic Puzzle</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Kuromasu</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="resetBtn" class="rounded-md bg-cyan-300 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-200">
            重新开始
          </button>
          <button id="hintBtn" class="rounded-md border border-slate-600 px-4 py-2 text-sm font-semibold text-slate-100 hover:bg-slate-800">
            提示
          </button>
        </div>
      </header>

      <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div class="rounded-lg border border-slate-800 bg-slate-900/80 p-4 shadow-2xl shadow-black/30">
          <div id="board" class="mx-auto grid aspect-square w-full max-w-[32rem] grid-cols-5 overflow-hidden rounded-md border-4 border-slate-100"></div>
        </div>

        <aside class="space-y-4">
          <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
            <h2 class="text-lg font-semibold text-white">目标</h2>
            <p class="mt-2 text-sm leading-6 text-slate-300">
              涂黑部分空格。数字格不能被涂黑，数字表示从该格上下左右可见的白格总数，黑格会挡住视线。黑格不能相邻，白格必须连通。
            </p>
          </div>

          <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
            <h2 class="text-lg font-semibold text-white">检查</h2>
            <ul class="mt-3 space-y-2 text-sm">
              <li id="clueStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">数字：等待检查</li>
              <li id="blackStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">黑格：无相邻</li>
              <li id="whiteStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">白格：等待检查</li>
            </ul>
          </div>

          <div id="message" class="rounded-lg border border-cyan-300/30 bg-cyan-300/10 p-4 text-sm leading-6 text-cyan-100">
            点击空格切换黑白状态。
          </div>
        </aside>
      </section>
    </main>

    <script>
      const board = document.getElementById("board");
      const resetBtn = document.getElementById("resetBtn");
      const hintBtn = document.getElementById("hintBtn");
      const message = document.getElementById("message");
      const clueStatus = document.getElementById("clueStatus");
      const blackStatus = document.getElementById("blackStatus");
      const whiteStatus = document.getElementById("whiteStatus");

      const size = 5;
      const clues = {
        "0,0": 4,
        "0,3": 4,
        "1,2": 5,
        "2,4": 3,
        "3,1": 6,
        "4,3": 3,
      };
      const solution = new Set(["0,2", "1,4", "2,1", "3,3", "4,0"]);
      const blackCells = new Set();
      const cells = [];

      function keyOf(row, col) {
        return `${row},${col}`;
      }

      function inBounds(row, col) {
        return row >= 0 && row < size && col >= 0 && col < size;
      }

      function isWhite(row, col) {
        return inBounds(row, col) && !blackCells.has(keyOf(row, col));
      }

      function visibleCount(row, col) {
        let count = 1;
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
          let nextRow = row + dr;
          let nextCol = col + dc;
          while (isWhite(nextRow, nextCol)) {
            count += 1;
            nextRow += dr;
            nextCol += dc;
          }
        });
        return count;
      }

      function clueReport() {
        const bad = [];
        Object.entries(clues).forEach(([key, target]) => {
          const [row, col] = key.split(",").map(Number);
          if (visibleCount(row, col) !== target) bad.push(key);
        });
        return { bad, clear: bad.length === 0 };
      }

      function blackReport() {
        const bad = new Set();
        blackCells.forEach((key) => {
          const [row, col] = key.split(",").map(Number);
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
            const nextKey = keyOf(row + dr, col + dc);
            if (blackCells.has(nextKey)) {
              bad.add(key);
              bad.add(nextKey);
            }
          });
        });
        return { bad, clear: bad.size === 0 };
      }

      function whiteReport() {
        const whites = [];
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            if (!blackCells.has(keyOf(row, col))) whites.push(keyOf(row, col));
          }
        }
        if (!whites.length) return { clear: false, reached: 0, total: 0 };
        const seen = new Set([whites[0]]);
        const queue = [whites[0]];
        while (queue.length) {
          const [row, col] = queue.shift().split(",").map(Number);
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
            const nextRow = row + dr;
            const nextCol = col + dc;
            const nextKey = keyOf(nextRow, nextCol);
            if (isWhite(nextRow, nextCol) && !seen.has(nextKey)) {
              seen.add(nextKey);
              queue.push(nextKey);
            }
          });
        }
        return { clear: seen.size === whites.length, reached: seen.size, total: whites.length };
      }

      function setStatus(element, label, state) {
        element.className = "rounded-md px-3 py-2 text-sm";
        if (state === "ok") element.classList.add("bg-emerald-500/15", "text-emerald-200");
        if (state === "warn") element.classList.add("bg-amber-500/15", "text-amber-200");
        if (state === "bad") element.classList.add("bg-rose-500/15", "text-rose-200");
        element.textContent = label;
      }

      function render() {
        const clue = clueReport();
        const black = blackReport();
        const white = whiteReport();
        cells.forEach((cell) => {
          const key = cell.dataset.key;
          const isClue = Boolean(clues[key]);
          const isBlack = blackCells.has(key);
          cell.className = "flex aspect-square items-center justify-center border border-slate-700 text-xl font-bold transition focus:outline-none focus:ring-4 focus:ring-cyan-300";
          cell.classList.add(isClue ? "bg-cyan-200" : isBlack ? "bg-slate-950" : "bg-slate-100");
          cell.classList.add(isClue || !isBlack ? "text-slate-950" : "text-slate-100");
          cell.classList.toggle("ring-4", clue.bad.includes(key) || black.bad.has(key));
          cell.classList.toggle("ring-rose-400", clue.bad.includes(key) || black.bad.has(key));
          cell.textContent = clues[key] || "";
        });

        setStatus(clueStatus, clue.clear ? "数字：可见数量正确" : "数字：可见数量不符", clue.clear ? "ok" : "bad");
        setStatus(blackStatus, black.clear ? "黑格：无相邻" : "黑格：存在相邻", black.clear ? "ok" : "bad");
        setStatus(whiteStatus, white.clear ? "白格：全部连通" : `白格：${white.reached}/${white.total} 连通`, white.clear ? "ok" : "bad");

        const solved = clue.clear && black.clear && white.clear;
        message.textContent = solved ? "完成！数字、黑格和白格连通规则都满足。" : `已涂黑 ${blackCells.size} 格。`;
      }

      function buildBoard() {
        board.innerHTML = "";
        cells.length = 0;
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            const key = keyOf(row, col);
            const cell = document.createElement("button");
            cell.type = "button";
            cell.dataset.key = key;
            cell.addEventListener("click", () => {
              if (clues[key]) return;
              blackCells.has(key) ? blackCells.delete(key) : blackCells.add(key);
              render();
            });
            board.appendChild(cell);
            cells.push(cell);
          }
        }
      }

      resetBtn.addEventListener("click", () => {
        blackCells.clear();
        render();
      });

      hintBtn.addEventListener("click", () => {
        const next = [...solution].find((key) => !blackCells.has(key));
        if (next) blackCells.add(next);
        render();
      });

      buildBoard();
      render();
    </script>
  </body>
</html>
