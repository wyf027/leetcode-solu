<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Mancala</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-stone-800 bg-stone-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal text-white">Mini Mancala</h1>
          <p class="mt-1 text-sm text-stone-400">点击己方坑位播种，最后一颗落入己方仓库可再走一次。</p>
        </div>
        <button id="reset" class="rounded-md bg-amber-400 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-amber-300">
          重新开局
        </button>
      </div>

      <div class="mb-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="rounded-md bg-stone-800 px-3 py-2">
          <div class="text-stone-400">玩家仓库</div>
          <div id="playerStore" class="text-xl font-semibold text-white">0</div>
        </div>
        <div class="rounded-md bg-stone-800 px-3 py-2">
          <div class="text-stone-400">状态</div>
          <div id="status" class="text-xl font-semibold text-white">玩家回合</div>
        </div>
        <div class="rounded-md bg-stone-800 px-3 py-2">
          <div class="text-stone-400">电脑仓库</div>
          <div id="computerStore" class="text-xl font-semibold text-white">0</div>
        </div>
      </div>

      <div class="grid grid-cols-[72px_1fr_72px] gap-3">
        <div id="computerBank" class="flex items-center justify-center rounded-lg border border-stone-700 bg-stone-800 text-3xl font-bold">0</div>
        <div class="grid gap-3">
          <div id="computerRow" class="grid grid-cols-6 gap-2"></div>
          <div id="playerRow" class="grid grid-cols-6 gap-2"></div>
        </div>
        <div id="playerBank" class="flex items-center justify-center rounded-lg border border-amber-400 bg-amber-500 text-3xl font-bold text-stone-950">0</div>
      </div>
    </section>
  </main>

  <script>
    const playerRow = document.getElementById("playerRow");
    const computerRow = document.getElementById("computerRow");
    const playerBank = document.getElementById("playerBank");
    const computerBank = document.getElementById("computerBank");
    const playerStore = document.getElementById("playerStore");
    const computerStore = document.getElementById("computerStore");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    let board = [];
    let turn = "player";
    let ended = false;

    function resetGame() {
      board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
      turn = "player";
      ended = false;
      render();
    }

    function playPit(index) {
      if (ended || turn !== "player" || index < 0 || index > 5 || board[index] === 0) return;
      const extra = sow(index, "player");
      finishMove(extra);
    }

    function computerMove() {
      if (ended || turn !== "computer") return;
      const options = [12, 11, 10, 9, 8, 7].filter(index => board[index] > 0);
      const choice = options.find(index => board[index] === 13 - index) ?? options[0];
      const extra = sow(choice, "computer");
      finishMove(extra);
    }

    function sow(start, side) {
      let stones = board[start];
      board[start] = 0;
      let index = start;
      while (stones > 0) {
        index = (index + 1) % 14;
        if (side === "player" && index === 13) continue;
        if (side === "computer" && index === 6) continue;
        board[index]++;
        stones--;
      }

      if (side === "player" && index >= 0 && index <= 5 && board[index] === 1) {
        const opposite = 12 - index;
        if (board[opposite] > 0) {
          board[6] += board[opposite] + 1;
          board[index] = 0;
          board[opposite] = 0;
        }
      }
      if (side === "computer" && index >= 7 && index <= 12 && board[index] === 1) {
        const opposite = 12 - index;
        if (board[opposite] > 0) {
          board[13] += board[opposite] + 1;
          board[index] = 0;
          board[opposite] = 0;
        }
      }
      return (side === "player" && index === 6) || (side === "computer" && index === 13);
    }

    function finishMove(extra) {
      collectIfDone();
      if (ended) {
        render();
        return;
      }
      if (!extra) turn = turn === "player" ? "computer" : "player";
      render();
      if (turn === "computer") setTimeout(computerMove, 500);
    }

    function collectIfDone() {
      const playerEmpty = board.slice(0, 6).every(value => value === 0);
      const computerEmpty = board.slice(7, 13).every(value => value === 0);
      if (!playerEmpty && !computerEmpty) return;
      board[6] += board.slice(0, 6).reduce((sum, value) => sum + value, 0);
      board[13] += board.slice(7, 13).reduce((sum, value) => sum + value, 0);
      for (let i = 0; i < 6; i++) board[i] = 0;
      for (let i = 7; i < 13; i++) board[i] = 0;
      ended = true;
    }

    function render() {
      playerRow.innerHTML = "";
      computerRow.innerHTML = "";
      playerBank.textContent = board[6];
      computerBank.textContent = board[13];
      playerStore.textContent = board[6];
      computerStore.textContent = board[13];
      statusEl.textContent = ended ? resultText() : turn === "player" ? "玩家回合" : "电脑回合";

      for (let i = 12; i >= 7; i--) computerRow.appendChild(makePit(i, false));
      for (let i = 0; i < 6; i++) playerRow.appendChild(makePit(i, true));
    }

    function makePit(index, activeSide) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = [
        "h-20 rounded-lg border text-2xl font-bold transition focus:outline-none focus:ring-2 focus:ring-amber-200",
        activeSide ? "border-amber-500 bg-stone-800 text-amber-200 hover:bg-stone-700" : "border-stone-700 bg-stone-800 text-stone-400"
      ].join(" ");
      button.textContent = board[index];
      button.disabled = !activeSide || turn !== "player" || board[index] === 0 || ended;
      button.setAttribute("aria-label", `坑位 ${index + 1}`);
      button.addEventListener("click", () => playPit(index));
      return button;
    }

    function resultText() {
      if (board[6] === board[13]) return "平局";
      return board[6] > board[13] ? "玩家获胜" : "电脑获胜";
    }

    resetEl.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
