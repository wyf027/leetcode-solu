<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Kakurasu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col justify-center gap-5 px-4 py-8">
    <section class="grid gap-4 md:grid-cols-[1fr_270px] md:items-start">
      <div class="rounded-lg border border-zinc-700 bg-zinc-900 p-4 shadow-2xl">
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold tracking-normal">Mini Kakurasu</h1>
            <p class="text-sm text-zinc-400">点亮格子，让每行列的权重和等于目标。</p>
          </div>
          <button id="resetBtn" class="rounded-md bg-cyan-400 px-3 py-2 text-sm font-semibold text-cyan-950 hover:bg-cyan-300">重开</button>
        </div>
        <div id="board" class="mx-auto grid w-full max-w-[430px] grid-cols-6 gap-1 rounded-lg bg-zinc-800 p-2"></div>
      </div>
      <aside class="rounded-lg border border-zinc-700 bg-zinc-900 p-4">
        <h2 class="mb-3 text-lg font-semibold">状态</h2>
        <div class="space-y-3 text-sm">
          <p id="rowStatus" class="rounded-md bg-zinc-800 p-3 text-zinc-200"></p>
          <p id="colStatus" class="rounded-md bg-zinc-800 p-3 text-zinc-200"></p>
          <p id="winStatus" class="rounded-md bg-zinc-800 p-3 font-semibold text-zinc-200"></p>
        </div>
        <div class="mt-4 space-y-2 text-xs leading-5 text-zinc-400">
          <p>顶部数字是列权重，左侧数字是行权重。</p>
          <p>一行目标等于该行点亮格子的列权重之和。</p>
          <p>一列目标等于该列点亮格子的行权重之和。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 4;
    const weights = [1, 2, 3, 4];
    const rowTargets = [5, 7, 3, 6];
    const colTargets = [3, 6, 6, 4];
    const solution = [
      [true, false, false, true],
      [false, false, true, true],
      [true, true, false, false],
      [false, true, false, true]
    ];
    const selected = Array.from({ length: size }, () => Array(size).fill(false));
    const board = document.getElementById("board");
    const rowStatus = document.getElementById("rowStatus");
    const colStatus = document.getElementById("colStatus");
    const winStatus = document.getElementById("winStatus");
    const resetBtn = document.getElementById("resetBtn");
    const cells = new Map();

    function key(row, col) {
      return `${row},${col}`;
    }

    function addTile(text, className) {
      const tile = document.createElement("div");
      tile.className = className;
      tile.textContent = text;
      board.appendChild(tile);
      return tile;
    }

    function renderBoard() {
      board.innerHTML = "";
      addTile("", "aspect-square rounded-md bg-transparent");
      weights.forEach((weight) => addTile(weight, "flex aspect-square items-center justify-center rounded-md bg-zinc-700 text-sm font-bold text-cyan-200"));
      addTile("目标", "flex aspect-square items-center justify-center rounded-md bg-zinc-700 text-xs font-bold text-zinc-300");

      for (let row = 0; row < size; row++) {
        addTile(weights[row], "flex aspect-square items-center justify-center rounded-md bg-zinc-700 text-sm font-bold text-cyan-200");
        for (let col = 0; col < size; col++) {
          const button = document.createElement("button");
          button.className = "aspect-square rounded-md bg-zinc-700 text-xl font-bold text-zinc-100 hover:bg-zinc-600";
          button.setAttribute("aria-label", `row ${row + 1} column ${col + 1}`);
          button.addEventListener("click", () => {
            selected[row][col] = !selected[row][col];
            update();
          });
          board.appendChild(button);
          cells.set(key(row, col), button);
        }
        addTile(rowTargets[row], "flex aspect-square items-center justify-center rounded-md bg-amber-300 text-sm font-bold text-amber-950");
      }

      addTile("目标", "flex aspect-square items-center justify-center rounded-md bg-zinc-700 text-xs font-bold text-zinc-300");
      colTargets.forEach((target) => addTile(target, "flex aspect-square items-center justify-center rounded-md bg-amber-300 text-sm font-bold text-amber-950"));
      addTile("", "aspect-square rounded-md bg-transparent");
    }

    function rowSums() {
      return selected.map((row) =>
        row.reduce((total, isOn, col) => total + (isOn ? weights[col] : 0), 0)
      );
    }

    function colSums() {
      return weights.map((_, col) =>
        selected.reduce((total, row, rowIndex) => total + (row[col] ? weights[rowIndex] : 0), 0)
      );
    }

    function compareSums(sums, targets) {
      return sums.map((sum, index) => ({
        index: index + 1,
        sum,
        target: targets[index],
        ok: sum === targets[index]
      }));
    }

    function isSolved() {
      return selected.every((row, rowIndex) =>
        row.every((value, colIndex) => value === solution[rowIndex][colIndex])
      );
    }

    function update() {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const cell = cells.get(key(row, col));
          cell.textContent = selected[row][col] ? "●" : "";
          cell.className = selected[row][col]
            ? "aspect-square rounded-md bg-cyan-400 text-xl font-bold text-cyan-950 shadow-inner shadow-cyan-900 hover:bg-cyan-300"
            : "aspect-square rounded-md bg-zinc-700 text-xl font-bold text-zinc-100 hover:bg-zinc-600";
        }
      }

      const rowReport = compareSums(rowSums(), rowTargets);
      const colReport = compareSums(colSums(), colTargets);
      const badRows = rowReport.filter((item) => !item.ok);
      const badCols = colReport.filter((item) => !item.ok);
      rowStatus.textContent = badRows.length
        ? `行目标未满足：${badRows.map((item) => `${item.index}行 ${item.sum}/${item.target}`).join("，")}`
        : "所有行目标通过";
      colStatus.textContent = badCols.length
        ? `列目标未满足：${badCols.map((item) => `${item.index}列 ${item.sum}/${item.target}`).join("，")}`
        : "所有列目标通过";
      winStatus.textContent = isSolved() ? "完成：Kakurasu 解开了" : "继续切换格子";
      winStatus.className = isSolved()
        ? "rounded-md bg-cyan-400 p-3 font-semibold text-cyan-950"
        : "rounded-md bg-zinc-800 p-3 font-semibold text-zinc-200";
    }

    resetBtn.addEventListener("click", () => {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) selected[row][col] = false;
      }
      update();
    });

    renderBoard();
    update();
  </script>
</body>
</html>
