<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Mahjong Solitaire</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center gap-5 px-4 py-6">
    <section class="w-full rounded-lg border border-emerald-500/30 bg-stone-900 p-4 shadow-2xl shadow-emerald-950/40">
      <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal text-emerald-200">Mini Mahjong Solitaire</h1>
          <p class="text-sm text-stone-400">Clear matching open tiles before the timer runs out.</p>
        </div>
        <div class="flex gap-2">
          <button id="shuffle" class="rounded-md border border-stone-600 px-4 py-2 text-sm font-semibold text-stone-100 hover:bg-stone-800">Shuffle</button>
          <button id="restart" class="rounded-md bg-emerald-300 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-emerald-200">Restart</button>
        </div>
      </div>

      <div class="grid gap-4 lg:grid-cols-[1fr_220px]">
        <div class="overflow-x-auto rounded-md bg-stone-950 p-3">
          <div id="board" class="grid min-w-[640px] gap-2"></div>
        </div>

        <aside class="space-y-3">
          <div class="grid grid-cols-3 gap-2 text-center lg:grid-cols-1">
            <div class="rounded-md bg-stone-800 p-3">
              <div class="text-xs uppercase text-stone-400">Pairs</div>
              <div id="pairs" class="text-xl font-bold text-emerald-200">0</div>
            </div>
            <div class="rounded-md bg-stone-800 p-3">
              <div class="text-xs uppercase text-stone-400">Tiles</div>
              <div id="tiles" class="text-xl font-bold text-amber-200">0</div>
            </div>
            <div class="rounded-md bg-stone-800 p-3">
              <div class="text-xs uppercase text-stone-400">Time</div>
              <div id="time" class="text-xl font-bold text-cyan-200">120</div>
            </div>
          </div>
          <div id="message" class="rounded-md border border-stone-700 bg-stone-950 p-3 text-center text-sm text-stone-300">
            Match identical free tiles. A tile is free when at least one side is open.
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const rows = 6;
    const cols = 12;
    const symbols = ["B1", "B2", "B3", "B4", "C1", "C2", "C3", "C4", "D1", "D2", "D3", "D4"];
    const glyphs = {
      B1: "B1", B2: "B2", B3: "B3", B4: "B4",
      C1: "C1", C2: "C2", C3: "C3", C4: "C4",
      D1: "D1", D2: "D2", D3: "D3", D4: "D4"
    };
    const boardEl = document.getElementById("board");
    const pairsEl = document.getElementById("pairs");
    const tilesEl = document.getElementById("tiles");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");
    const restartEl = document.getElementById("restart");
    const shuffleEl = document.getElementById("shuffle");

    let board = [];
    let selected = null;
    let pairs = 0;
    let timeLeft = 120;
    let timer = null;
    let locked = false;

    boardEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;

    function makeDeck() {
      const deck = [];
      while (deck.length < rows * cols) {
        symbols.forEach((symbol) => {
          deck.push(symbol, symbol);
        });
      }
      return deck.slice(0, rows * cols);
    }

    function shuffleArray(items) {
      for (let i = items.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }

    function resetGame() {
      clearInterval(timer);
      selected = null;
      pairs = 0;
      timeLeft = 120;
      locked = false;
      const deck = shuffleArray(makeDeck());
      board = Array.from({ length: rows }, (_, row) =>
        Array.from({ length: cols }, (_, col) => ({
          id: `${row}-${col}`,
          row,
          col,
          symbol: deck[row * cols + col],
          removed: false
        }))
      );
      messageEl.textContent = "Match identical free tiles. A tile is free when at least one side is open.";
      renderBoard();
      timer = setInterval(tickTimer, 1000);
    }

    function tickTimer() {
      if (locked) return;
      timeLeft -= 1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        locked = true;
        messageEl.textContent = "Time is up. Press Restart to try again.";
      }
      renderStats();
    }

    function tileAt(row, col) {
      if (row < 0 || row >= rows || col < 0 || col >= cols) return null;
      return board[row][col];
    }

    function isTileFree(tile) {
      if (!tile || tile.removed) return false;
      const left = tileAt(tile.row, tile.col - 1);
      const right = tileAt(tile.row, tile.col + 1);
      return !left || left.removed || !right || right.removed;
    }

    function selectTile(tile) {
      if (locked || tile.removed || !isTileFree(tile)) {
        messageEl.textContent = "That tile is blocked. Pick one with an open side.";
        return;
      }
      if (!selected) {
        selected = tile;
        messageEl.textContent = `Selected ${glyphs[tile.symbol]}. Find its pair.`;
        renderBoard();
        return;
      }
      if (selected.id === tile.id) {
        selected = null;
        messageEl.textContent = "Selection cleared.";
        renderBoard();
        return;
      }
      if (selected.symbol === tile.symbol) {
        selected.removed = true;
        tile.removed = true;
        selected = null;
        pairs += 1;
        messageEl.textContent = "Pair removed.";
        checkWin();
      } else {
        selected = tile;
        messageEl.textContent = "No match. New tile selected.";
      }
      renderBoard();
    }

    function checkWin() {
      if (board.flat().every((tile) => tile.removed)) {
        locked = true;
        clearInterval(timer);
        messageEl.textContent = "Board cleared. You won!";
      }
    }

    function shuffleTiles() {
      if (locked) return;
      const live = board.flat().filter((tile) => !tile.removed);
      const symbolsLeft = shuffleArray(live.map((tile) => tile.symbol));
      live.forEach((tile, index) => {
        tile.symbol = symbolsLeft[index];
      });
      selected = null;
      timeLeft = Math.max(10, timeLeft - 8);
      messageEl.textContent = "Remaining tiles shuffled. Time penalty applied.";
      renderBoard();
    }

    function renderStats() {
      const liveCount = board.flat().filter((tile) => !tile.removed).length;
      pairsEl.textContent = pairs;
      tilesEl.textContent = liveCount;
      timeEl.textContent = timeLeft;
    }

    function renderBoard() {
      const tiles = board.flat().map((tile) => {
        const button = document.createElement("button");
        const free = isTileFree(tile);
        const active = selected && selected.id === tile.id;
        button.type = "button";
        button.disabled = tile.removed || locked;
        button.textContent = tile.removed ? "" : glyphs[tile.symbol];
        button.className = [
          "h-14 rounded-md border text-base font-bold transition",
          tile.removed ? "border-transparent bg-transparent" : "border-stone-600 bg-stone-100 text-stone-950 shadow-md shadow-black/30",
          free && !tile.removed ? "hover:-translate-y-0.5 hover:border-emerald-300 hover:bg-emerald-100" : "",
          !free && !tile.removed ? "opacity-45" : "",
          active ? "ring-4 ring-emerald-300" : ""
        ].join(" ");
        button.addEventListener("click", () => selectTile(tile));
        return button;
      });
      boardEl.replaceChildren(...tiles);
      renderStats();
    }

    restartEl.addEventListener("click", resetGame);
    shuffleEl.addEventListener("click", shuffleTiles);
    resetGame();
  </script>
</body>
</html>
