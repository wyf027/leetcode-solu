<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Anagrams</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col justify-center gap-5 px-4 py-8">
    <section class="grid gap-4 md:grid-cols-[1fr_280px] md:items-start">
      <div class="rounded-lg border border-emerald-700 bg-emerald-900 p-4 shadow-2xl">
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold tracking-normal">Mini Anagrams</h1>
            <p class="text-sm text-emerald-200/80">用字母池重排单词，找出全部目标词。</p>
          </div>
          <button id="resetBtn" class="rounded-md bg-amber-300 px-3 py-2 text-sm font-semibold text-amber-950 hover:bg-amber-200">重开</button>
        </div>
        <div class="rounded-lg bg-emerald-950 p-4">
          <div id="letters" class="mb-4 grid grid-cols-7 gap-2"></div>
          <input id="answerInput" class="w-full rounded-md border border-emerald-600 bg-emerald-900 px-3 py-3 text-center text-xl font-bold uppercase tracking-widest outline-none focus:border-amber-300" maxlength="7" placeholder="输入或点击字母">
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button id="submitBtn" class="rounded-md bg-amber-300 px-3 py-2 font-semibold text-amber-950 hover:bg-amber-200">提交</button>
            <button id="clearBtn" class="rounded-md bg-emerald-700 px-3 py-2 font-semibold hover:bg-emerald-600">清除</button>
          </div>
        </div>
      </div>
      <aside class="rounded-lg border border-emerald-700 bg-emerald-900 p-4">
        <h2 class="mb-3 text-lg font-semibold">目标词</h2>
        <div id="wordList" class="grid grid-cols-2 gap-2 text-sm"></div>
        <div class="mt-4 space-y-3 text-sm">
          <p id="hintStatus" class="rounded-md bg-emerald-950 p-3 text-emerald-100"></p>
          <p id="winStatus" class="rounded-md bg-emerald-950 p-3 font-semibold text-emerald-100"></p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const baseLetters = "TRIANGLE".split("");
    const words = ["ANGLE", "GIANT", "TRIAL", "TRIANGLE", "RING", "TILE", "LINE", "REAL"];
    const found = new Set();
    const lettersEl = document.getElementById("letters");
    const wordList = document.getElementById("wordList");
    const answerInput = document.getElementById("answerInput");
    const hintStatus = document.getElementById("hintStatus");
    const winStatus = document.getElementById("winStatus");
    const submitBtn = document.getElementById("submitBtn");
    const clearBtn = document.getElementById("clearBtn");
    const resetBtn = document.getElementById("resetBtn");

    function normalize(value) {
      return value.toUpperCase().replace(/[^A-Z]/g, "");
    }

    function letterCounts(word) {
      return [...word].reduce((map, letter) => {
        map[letter] = (map[letter] || 0) + 1;
        return map;
      }, {});
    }

    function canBuild(word) {
      const pool = letterCounts(baseLetters.join(""));
      const need = letterCounts(word);
      return Object.keys(need).every((letter) => need[letter] <= (pool[letter] || 0));
    }

    function submitAnswer() {
      const answer = normalize(answerInput.value);
      if (!answer) {
        hintStatus.textContent = "先输入一个单词";
      } else if (!canBuild(answer)) {
        hintStatus.textContent = "这个词使用了字母池之外的字母";
      } else if (!words.includes(answer)) {
        hintStatus.textContent = "不在本局目标词中";
      } else if (found.has(answer)) {
        hintStatus.textContent = "这个词已经找到了";
      } else {
        found.add(answer);
        hintStatus.textContent = `找到：${answer}`;
      }
      answerInput.value = "";
      renderAll();
    }

    function renderLetters() {
      lettersEl.innerHTML = "";
      baseLetters.forEach((letter) => {
        const button = document.createElement("button");
        button.className = "aspect-square rounded-md bg-amber-300 text-xl font-black text-amber-950 hover:bg-amber-200";
        button.textContent = letter;
        button.addEventListener("click", () => {
          answerInput.value = normalize(answerInput.value + letter);
          answerInput.focus();
        });
        lettersEl.appendChild(button);
      });
    }

    function renderWords() {
      wordList.innerHTML = "";
      words.forEach((word) => {
        const item = document.createElement("div");
        item.className = found.has(word)
          ? "rounded-md bg-amber-300 px-2 py-2 font-semibold text-amber-950 line-through"
          : "rounded-md bg-emerald-950 px-2 py-2 font-semibold text-emerald-100";
        item.textContent = found.has(word) ? word : `${word.length} 字母`;
        wordList.appendChild(item);
      });
    }

    function updateStatus() {
      winStatus.textContent = found.size === words.length ? "完成：全部单词已解出" : `已找到：${found.size}/${words.length}`;
      winStatus.className = found.size === words.length
        ? "rounded-md bg-amber-300 p-3 font-semibold text-amber-950"
        : "rounded-md bg-emerald-950 p-3 font-semibold text-emerald-100";
    }

    function renderAll() {
      renderLetters();
      renderWords();
      updateStatus();
    }

    answerInput.addEventListener("input", () => {
      answerInput.value = normalize(answerInput.value);
    });
    answerInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitAnswer();
    });
    submitBtn.addEventListener("click", submitAnswer);
    clearBtn.addEventListener("click", () => {
      answerInput.value = "";
      hintStatus.textContent = "已清除输入";
    });
    resetBtn.addEventListener("click", () => {
      found.clear();
      answerInput.value = "";
      hintStatus.textContent = "重新开始";
      renderAll();
    });

    hintStatus.textContent = "字母池：TRIANGLE";
    renderAll();
  </script>
</body>
</html>
