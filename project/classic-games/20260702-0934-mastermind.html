<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Mastermind</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6 lg:px-8">
    <header class="flex flex-col gap-3 border-b border-zinc-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Mini Mastermind</h1>
        <p class="mt-2 max-w-2xl text-sm leading-6 text-zinc-400">
          Guess the hidden four-color code in ten turns. Black pegs mean correct color and position; white pegs mean correct color in the wrong position.
        </p>
      </div>
      <button id="newGame" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-200">
        New game
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_19rem]">
      <div class="rounded-lg border border-zinc-800 bg-zinc-900/70 p-4">
        <div class="mb-3 grid grid-cols-[1fr_6rem] gap-3 text-xs font-semibold uppercase tracking-wide text-zinc-500">
          <span>Guesses</span>
          <span>Feedback</span>
        </div>
        <div id="board" class="space-y-2"></div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded-lg border border-zinc-800 bg-zinc-900/70 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500">Current guess</h2>
          <div id="guess" class="mt-4 grid grid-cols-4 gap-3"></div>
          <div class="mt-4 grid grid-cols-2 gap-3">
            <button id="submitGuess" class="rounded-md bg-emerald-400 px-3 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-emerald-300 focus:outline-none focus:ring-2 focus:ring-emerald-200">
              Submit
            </button>
            <button id="clearGuess" class="rounded-md border border-zinc-700 px-3 py-2 text-sm font-semibold text-zinc-200 transition hover:border-zinc-500 hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-zinc-500">
              Clear
            </button>
          </div>
        </div>

        <div class="rounded-lg border border-zinc-800 bg-zinc-900/70 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500">Palette</h2>
          <div id="palette" class="mt-4 grid grid-cols-3 gap-3"></div>
        </div>

        <div class="rounded-lg border border-zinc-800 bg-zinc-900/70 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500">Status</h2>
          <p id="status" class="mt-3 min-h-12 text-sm leading-6 text-zinc-300"></p>
          <div id="secret" class="mt-4 hidden grid-cols-4 gap-2"></div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const colors = [
      { name: "Ruby", className: "bg-rose-500", ring: "ring-rose-200" },
      { name: "Amber", className: "bg-amber-400", ring: "ring-amber-100" },
      { name: "Emerald", className: "bg-emerald-500", ring: "ring-emerald-200" },
      { name: "Sky", className: "bg-sky-500", ring: "ring-sky-200" },
      { name: "Violet", className: "bg-violet-500", ring: "ring-violet-200" },
      { name: "Pink", className: "bg-pink-400", ring: "ring-pink-100" }
    ];

    const maxTurns = 10;
    const codeLength = 4;
    let secretCode = [];
    let currentGuess = [];
    let guesses = [];
    let gameOver = false;

    const board = document.getElementById("board");
    const guessEl = document.getElementById("guess");
    const palette = document.getElementById("palette");
    const statusEl = document.getElementById("status");
    const secretEl = document.getElementById("secret");
    const submitGuess = document.getElementById("submitGuess");
    const clearGuess = document.getElementById("clearGuess");
    const newGame = document.getElementById("newGame");

    function makeSecret() {
      return Array.from({ length: codeLength }, () => Math.floor(Math.random() * colors.length));
    }

    function colorPeg(colorIndex, label, size = "h-10 w-10") {
      const color = colors[colorIndex];
      const peg = document.createElement("div");
      peg.className = `${size} rounded-full ${color.className} shadow-lg shadow-black/30 ring-2 ring-white/10`;
      peg.setAttribute("role", "img");
      peg.setAttribute("aria-label", label || color.name);
      peg.title = label || color.name;
      return peg;
    }

    function emptyPeg(size = "h-10 w-10") {
      const peg = document.createElement("div");
      peg.className = `${size} rounded-full border border-dashed border-zinc-600 bg-zinc-950/80`;
      return peg;
    }

    function scoreGuess(guess) {
      let black = 0;
      let white = 0;
      const secretUnused = [];
      const guessUnused = [];

      for (let i = 0; i < codeLength; i += 1) {
        if (guess[i] === secretCode[i]) {
          black += 1;
        } else {
          secretUnused.push(secretCode[i]);
          guessUnused.push(guess[i]);
        }
      }

      guessUnused.forEach((color) => {
        const match = secretUnused.indexOf(color);
        if (match !== -1) {
          white += 1;
          secretUnused.splice(match, 1);
        }
      });

      return { black, white };
    }

    function renderBoard() {
      board.innerHTML = "";
      for (let row = 0; row < maxTurns; row += 1) {
        const played = guesses[row];
        const rowEl = document.createElement("div");
        rowEl.className = `grid grid-cols-[1fr_6rem] gap-3 rounded-md border p-2 ${row === guesses.length && !gameOver ? "border-cyan-400/70 bg-cyan-400/10" : "border-zinc-800 bg-zinc-950/40"}`;

        const pegs = document.createElement("div");
        pegs.className = "grid grid-cols-4 gap-2";
        const values = played ? played.guess : [];
        for (let i = 0; i < codeLength; i += 1) {
          pegs.appendChild(values[i] === undefined ? emptyPeg() : colorPeg(values[i]));
        }

        const feedback = document.createElement("div");
        feedback.className = "grid grid-cols-4 place-items-center gap-1";
        const marks = played ? [
          ...Array(played.score.black).fill("black"),
          ...Array(played.score.white).fill("white")
        ] : [];
        for (let i = 0; i < codeLength; i += 1) {
          const mark = document.createElement("span");
          mark.className = marks[i] === "black"
            ? "h-4 w-4 rounded-full bg-zinc-100"
            : marks[i] === "white"
              ? "h-4 w-4 rounded-full border border-zinc-100 bg-transparent"
              : "h-4 w-4 rounded-full bg-zinc-800";
          feedback.appendChild(mark);
        }

        rowEl.append(pegs, feedback);
        board.appendChild(rowEl);
      }
    }

    function renderGuess() {
      guessEl.innerHTML = "";
      for (let i = 0; i < codeLength; i += 1) {
        guessEl.appendChild(currentGuess[i] === undefined ? emptyPeg("h-12 w-12") : colorPeg(currentGuess[i], colors[currentGuess[i]].name, "h-12 w-12"));
      }
    }

    function renderPalette() {
      palette.innerHTML = "";
      colors.forEach((color, index) => {
        const button = document.createElement("button");
        button.className = `h-12 rounded-md ${color.className} shadow-lg shadow-black/30 ring-offset-2 ring-offset-zinc-900 transition hover:scale-105 focus:outline-none focus:ring-2 ${color.ring}`;
        button.title = color.name;
        button.setAttribute("aria-label", `Add ${color.name}`);
        button.addEventListener("click", () => {
          if (gameOver || currentGuess.length >= codeLength) return;
          currentGuess.push(index);
          renderGuess();
          updateStatus();
        });
        palette.appendChild(button);
      });
    }

    function revealSecret() {
      secretEl.innerHTML = "";
      secretCode.forEach((color) => secretEl.appendChild(colorPeg(color, colors[color].name, "h-9 w-9")));
      secretEl.classList.remove("hidden");
      secretEl.classList.add("grid");
    }

    function updateStatus(message) {
      if (message) {
        statusEl.textContent = message;
        return;
      }
      if (gameOver) return;
      const remaining = maxTurns - guesses.length;
      statusEl.textContent = currentGuess.length === codeLength
        ? `Ready to submit. ${remaining} turn${remaining === 1 ? "" : "s"} left.`
        : `Pick ${codeLength - currentGuess.length} more color${codeLength - currentGuess.length === 1 ? "" : "s"}. ${remaining} turn${remaining === 1 ? "" : "s"} left.`;
    }

    function submitCurrentGuess() {
      if (gameOver) return;
      if (currentGuess.length !== codeLength) {
        updateStatus("Fill all four slots before submitting.");
        return;
      }

      const score = scoreGuess(currentGuess);
      guesses.push({ guess: [...currentGuess], score });
      currentGuess = [];
      renderBoard();
      renderGuess();

      if (score.black === codeLength) {
        gameOver = true;
        revealSecret();
        updateStatus(`Solved in ${guesses.length} turn${guesses.length === 1 ? "" : "s"}.`);
      } else if (guesses.length === maxTurns) {
        gameOver = true;
        revealSecret();
        updateStatus("No turns left. The hidden code is revealed.");
      } else {
        updateStatus(`${score.black} black, ${score.white} white. Keep decoding.`);
      }
    }

    function clearCurrentGuess() {
      if (gameOver) return;
      currentGuess = [];
      renderGuess();
      updateStatus();
    }

    function startGame() {
      secretCode = makeSecret();
      currentGuess = [];
      guesses = [];
      gameOver = false;
      secretEl.classList.add("hidden");
      secretEl.classList.remove("grid");
      renderBoard();
      renderGuess();
      renderPalette();
      updateStatus();
    }

    submitGuess.addEventListener("click", submitCurrentGuess);
    clearGuess.addEventListener("click", clearCurrentGuess);
    newGame.addEventListener("click", startGame);

    startGame();
  </script>
</body>
</html>
