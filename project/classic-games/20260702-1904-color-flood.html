<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Color Flood</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-white">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center gap-5 px-4 py-8">
      <section class="rounded-lg border border-zinc-700 bg-zinc-900 p-5 shadow-2xl">
        <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-normal">Mini Color Flood</h1>
            <p id="message" class="mt-1 min-h-6 text-sm text-zinc-300">从左上角开始扩张，18 步内把棋盘染成同一种颜色。</p>
          </div>
          <div class="rounded bg-zinc-800 px-4 py-2 text-sm">
            步数 <strong id="moves" class="text-cyan-300">0</strong> / <strong id="limit" class="text-amber-300">18</strong>
          </div>
        </div>

        <div id="board" class="mx-auto grid aspect-square w-full max-w-md grid-cols-6 gap-1 rounded bg-zinc-800 p-2"></div>

        <div id="palette" class="mt-5 grid grid-cols-6 gap-2"></div>

        <button id="reset" class="mt-4 w-full rounded bg-cyan-400 py-3 font-bold text-zinc-950 hover:bg-cyan-300">新棋盘</button>
      </section>
    </main>

    <script>
      const size = 6;
      const moveLimit = 18;
      const colors = [
        { name: "red", className: "bg-rose-500" },
        { name: "yellow", className: "bg-amber-400" },
        { name: "green", className: "bg-emerald-500" },
        { name: "blue", className: "bg-sky-500" },
        { name: "purple", className: "bg-violet-500" },
        { name: "pink", className: "bg-pink-500" },
      ];

      const boardEl = document.getElementById("board");
      const paletteEl = document.getElementById("palette");
      const messageEl = document.getElementById("message");
      const movesEl = document.getElementById("moves");
      const limitEl = document.getElementById("limit");
      let board = [];
      let moves = 0;
      let locked = false;

      function newGame() {
        board = Array.from({ length: size }, () =>
          Array.from({ length: size }, () => Math.floor(Math.random() * colors.length)),
        );
        moves = 0;
        locked = false;
        messageEl.textContent = "从左上角开始扩张，18 步内把棋盘染成同一种颜色。";
        renderBoard();
        renderPalette();
        updateStats();
      }

      function renderBoard() {
        boardEl.innerHTML = "";
        board.flat().forEach((colorIndex) => {
          const cell = document.createElement("div");
          cell.className = `aspect-square rounded-sm ${colors[colorIndex].className}`;
          boardEl.appendChild(cell);
        });
      }

      function renderPalette() {
        paletteEl.innerHTML = "";
        colors.forEach((color, index) => {
          const button = document.createElement("button");
          button.className = `h-12 rounded border-2 border-white/20 ${color.className} hover:scale-105`;
          button.setAttribute("aria-label", color.name);
          button.addEventListener("click", () => flood(index));
          paletteEl.appendChild(button);
        });
      }

      function flood(newColor) {
        if (locked || newColor === board[0][0]) return;
        const oldColor = board[0][0];
        const queue = [[0, 0]];
        const seen = new Set(["0,0"]);
        while (queue.length) {
          const [r, c] = queue.shift();
          if (board[r][c] !== oldColor) continue;
          board[r][c] = newColor;
          [
            [r - 1, c],
            [r + 1, c],
            [r, c - 1],
            [r, c + 1],
          ].forEach(([nr, nc]) => {
            const key = `${nr},${nc}`;
            if (nr >= 0 && nr < size && nc >= 0 && nc < size && !seen.has(key)) {
              seen.add(key);
              queue.push([nr, nc]);
            }
          });
        }
        moves += 1;
        renderBoard();
        updateStats();
        checkGame();
      }

      function checkGame() {
        const target = board[0][0];
        const won = board.every((row) => row.every((cell) => cell === target));
        if (won) {
          locked = true;
          messageEl.textContent = `完成！你用了 ${moves} 步统一棋盘。`;
        } else if (moves >= moveLimit) {
          locked = true;
          messageEl.textContent = "步数用完，点击新棋盘再试一次。";
        } else {
          messageEl.textContent = "继续选择颜色扩张左上角区域。";
        }
      }

      function updateStats() {
        movesEl.textContent = moves;
        limitEl.textContent = moveLimit;
      }

      document.getElementById("reset").addEventListener("click", newGame);
      newGame();
    </script>
  </body>
</html>
