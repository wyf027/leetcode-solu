<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Hashiwokakero</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-slate-700 bg-slate-900 p-5 shadow-2xl">
      <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Hashiwokakero</h1>
          <p class="mt-1 text-sm text-slate-300">点击两个岛之间的虚线位置，循环放置 0、1、2 座桥。</p>
        </div>
        <button id="resetBtn" class="rounded-md bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-400">重开</button>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_14rem]">
        <div class="rounded-lg border border-slate-700 bg-slate-950 p-3">
          <div id="board" class="relative mx-auto grid aspect-square w-full max-w-[520px] select-none grid-cols-5 grid-rows-5"></div>
        </div>
        <aside class="rounded-lg border border-slate-700 bg-slate-800 p-4">
          <div class="text-sm font-semibold text-slate-200">状态</div>
          <div id="status" class="mt-3 rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-300">连接所有岛屿，让每个岛的桥数等于数字。</div>
          <div class="mt-4 text-sm font-semibold text-slate-200">规则</div>
          <ul class="mt-2 space-y-2 text-sm text-slate-300">
            <li>桥只能横向或纵向连接相邻岛屿。</li>
            <li>两座岛之间最多两座桥。</li>
            <li>所有岛必须最终连成一组。</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const size = 5;
    const islands = [
      { id: 0, r: 0, c: 0, need: 2 },
      { id: 1, r: 0, c: 2, need: 3 },
      { id: 2, r: 0, c: 4, need: 2 },
      { id: 3, r: 2, c: 0, need: 3 },
      { id: 4, r: 2, c: 2, need: 4 },
      { id: 5, r: 2, c: 4, need: 3 },
      { id: 6, r: 4, c: 0, need: 2 },
      { id: 7, r: 4, c: 2, need: 2 }
    ];
    const edges = [
      [0, 1], [1, 2], [3, 4], [4, 5], [6, 7],
      [0, 3], [1, 4], [2, 5], [3, 6], [4, 7]
    ];
    let bridges = {};

    const board = document.getElementById("board");
    const status = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    function edgeKey(a, b) {
      return [Math.min(a, b), Math.max(a, b)].join("-");
    }

    function usedCount(id) {
      return edges.reduce((sum, edge) => edge.includes(id) ? sum + (bridges[edgeKey(edge[0], edge[1])] || 0) : sum, 0);
    }

    function connected() {
      const seen = new Set([0]);
      const queue = [0];
      while (queue.length) {
        const current = queue.shift();
        for (const [a, b] of edges) {
          if ((bridges[edgeKey(a, b)] || 0) === 0) continue;
          const next = a === current ? b : b === current ? a : null;
          if (next !== null && !seen.has(next)) {
            seen.add(next);
            queue.push(next);
          }
        }
      }
      return seen.size === islands.length;
    }

    function solved() {
      return islands.every((island) => usedCount(island.id) === island.need) && connected();
    }

    function render() {
      board.innerHTML = "";
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const cell = document.createElement("div");
          cell.className = "relative flex items-center justify-center border border-slate-800";
          cell.dataset.r = r;
          cell.dataset.c = c;
          board.appendChild(cell);
        }
      }

      for (const [a, b] of edges) {
        const one = islands[a];
        const two = islands[b];
        const count = bridges[edgeKey(a, b)] || 0;
        const midR = (one.r + two.r) / 2;
        const midC = (one.c + two.c) / 2;
        const cell = board.children[midR * size + midC];
        cell.classList.add("cursor-pointer", "hover:bg-slate-800");
        cell.addEventListener("click", () => {
          bridges[edgeKey(a, b)] = (count + 1) % 3;
          render();
        });
        if (count > 0) {
          const vertical = one.c === two.c;
          const line = document.createElement("div");
          line.className = vertical
            ? "h-full w-5 rounded bg-cyan-300"
            : "h-5 w-full rounded bg-cyan-300";
          if (count === 2) line.classList.add("ring-4", "ring-slate-950");
          cell.appendChild(line);
        } else {
          const hint = document.createElement("div");
          hint.className = one.c === two.c
            ? "h-3/4 border-l border-dashed border-slate-600"
            : "w-3/4 border-t border-dashed border-slate-600";
          cell.appendChild(hint);
        }
      }

      for (const island of islands) {
        const cell = board.children[island.r * size + island.c];
        const used = usedCount(island.id);
        const ok = used === island.need;
        const node = document.createElement("div");
        node.className = [
          "z-10 flex h-12 w-12 items-center justify-center rounded-full border-2 text-lg font-bold shadow-lg",
          ok ? "border-emerald-300 bg-emerald-500 text-slate-950" : used > island.need ? "border-rose-300 bg-rose-500 text-white" : "border-white bg-slate-100 text-slate-950"
        ].join(" ");
        node.textContent = island.need;
        node.title = `已连接 ${used}/${island.need}`;
        cell.appendChild(node);
      }

      const over = islands.filter((island) => usedCount(island.id) > island.need).length;
      if (solved()) {
        status.textContent = "完成！所有岛屿数字正确，并且桥网已经连通。";
        status.className = "mt-3 rounded-md border border-emerald-500 bg-emerald-950 px-3 py-2 text-sm text-emerald-200";
      } else if (over) {
        status.textContent = "有岛屿桥数超出数字，点击相邻桥位减少或清除。";
        status.className = "mt-3 rounded-md border border-rose-500 bg-rose-950 px-3 py-2 text-sm text-rose-200";
      } else {
        status.textContent = connected() ? "桥网已连通，继续匹配每个岛的数字。" : "继续连接岛屿，目标是数字匹配且全图连通。";
        status.className = "mt-3 rounded-md border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-300";
      }
    }

    resetBtn.addEventListener("click", () => {
      bridges = {};
      render();
    });

    render();
  </script>
</body>
</html>
