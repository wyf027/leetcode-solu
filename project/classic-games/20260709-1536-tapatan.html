<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Tapatan</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-teal-950 text-teal-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Tapatan</h1><p class="text-sm text-teal-200">Place three pieces each, then slide along a line to make three in a row.</p></div><button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-teal-950 hover:bg-amber-200">New Game</button></header><section class="grid gap-3 rounded border border-teal-700 bg-teal-900 p-3 sm:grid-cols-3"><div>Turn: <b id="turnLabel">Blue</b></div><div>Phase: <b id="phaseLabel">Place</b></div><div id="message">Choose an empty point.</div></section><section class="mx-auto grid aspect-square w-full max-w-lg grid-cols-3 grid-rows-3 gap-3 rounded border border-teal-700 bg-teal-800 p-4" id="board"></section><footer class="grid gap-2 text-sm text-teal-200 sm:grid-cols-2"><div>Blue placed: <b id="bPlaced">0</b>/3</div><div>Gold placed: <b id="gPlaced">0</b>/3</div></footer></main><script>
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],adj=[[1,3,4],[0,2,4],[1,4,5],[0,4,6],[0,1,2,3,5,6,7,8],[2,4,8],[3,4,7],[4,6,8],[4,5,7]];let board,turn,placed,phase,selected,over;const el=id=>document.getElementById(id),boardEl=el('board'),turnLabel=el('turnLabel'),phaseLabel=el('phaseLabel'),message=el('message'),newGameBtn=el('newGameBtn');function name(p){return p==='B'?'Blue':'Gold'}function enemy(p){return p==='B'?'G':'B'}function hasLine(p){return wins.some(w=>w.every(i=>board[i]===p))}function next(){turn=enemy(turn);selected=null;message.textContent=phase==='place'?'Choose an empty point.':'Select one of your pieces.';render()}function handlePoint(i){if(over)return;if(phase==='place'){if(board[i])return;board[i]=turn;placed[turn]++;if(hasLine(turn)){message.textContent=`${name(turn)} wins.`;over=true}else{if(placed.B===3&&placed.G===3)phase='move';next()}render();return}if(selected===null){if(board[i]===turn){selected=i;message.textContent='Choose a connected empty point.';render()}return}if(i===selected){selected=null;message.textContent='Selection cleared.';render();return}if(!board[i]&&adj[selected].includes(i)){board[i]=turn;board[selected]='';if(hasLine(turn)){message.textContent=`${name(turn)} wins.`;over=true}else next();render()}}function render(){turnLabel.textContent=name(turn);phaseLabel.textContent=over?'Game Over':phase==='place'?'Place':'Move';el('bPlaced').textContent=placed.B;el('gPlaced').textContent=placed.G;boardEl.innerHTML='';board.forEach((p,i)=>{const b=document.createElement('button');b.className='flex items-center justify-center rounded border-2 text-3xl font-bold '+(selected===i?'border-amber-300 ':'border-teal-600 ')+(p==='B'?'bg-sky-300 text-teal-950':p==='G'?'bg-amber-300 text-teal-950':'bg-teal-700 hover:bg-teal-600');b.textContent=p==='B'?'B':p==='G'?'G':'';b.onclick=()=>handlePoint(i);boardEl.appendChild(b)})}function newGame(){board=Array(9).fill('');turn='B';placed={B:0,G:0};phase='place';selected=null;over=false;message.textContent='Choose an empty point.';render()}newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
