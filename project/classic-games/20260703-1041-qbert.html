<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Qbert</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-indigo-950 text-indigo-50">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col justify-center gap-4 px-4 py-6">
      <section class="grid gap-4 rounded-lg border border-indigo-800 bg-indigo-900 p-4 shadow-xl md:grid-cols-[1fr_220px]">
        <div>
          <div class="mb-3 flex flex-wrap items-end justify-between gap-3">
            <div>
              <h1 class="text-2xl font-bold text-white">Mini Qbert</h1>
              <p class="mt-1 text-sm text-indigo-200/80">在金字塔上跳格，把所有方块点亮。</p>
            </div>
            <div class="rounded-md border border-indigo-800 bg-indigo-950 px-4 py-2 text-right">
              <div class="text-xs uppercase text-indigo-300/70">Score</div>
              <div id="score" class="text-3xl font-bold text-orange-200">0</div>
            </div>
          </div>
          <canvas id="board" width="440" height="520" class="mx-auto block w-full max-w-[440px] rounded-md border border-indigo-700 bg-indigo-950"></canvas>
        </div>

        <aside class="flex flex-col gap-3">
          <div class="grid grid-cols-2 gap-2">
            <div class="rounded-md border border-indigo-800 bg-indigo-950 p-3">
              <div class="text-xs uppercase text-indigo-300/70">Tiles</div>
              <div id="tiles" class="text-2xl font-bold text-emerald-200">0 / 15</div>
            </div>
            <div class="rounded-md border border-indigo-800 bg-indigo-950 p-3">
              <div class="text-xs uppercase text-indigo-300/70">Moves</div>
              <div id="moves" class="text-2xl font-bold text-cyan-200">0</div>
            </div>
          </div>
          <div id="message" class="min-h-16 rounded-md border border-indigo-800 bg-indigo-950 p-3 text-sm text-indigo-100/90">
            使用 Q/E/A/D 沿斜向跳跃。
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" onclick="movePlayer('upLeft')" class="rounded-md bg-cyan-400 px-3 py-3 font-bold text-indigo-950 hover:bg-cyan-300">左上</button>
            <button type="button" onclick="movePlayer('upRight')" class="rounded-md bg-cyan-400 px-3 py-3 font-bold text-indigo-950 hover:bg-cyan-300">右上</button>
            <button type="button" onclick="movePlayer('downLeft')" class="rounded-md bg-orange-300 px-3 py-3 font-bold text-indigo-950 hover:bg-orange-200">左下</button>
            <button type="button" onclick="movePlayer('downRight')" class="rounded-md bg-orange-300 px-3 py-3 font-bold text-indigo-950 hover:bg-orange-200">右下</button>
          </div>
          <button
            type="button"
            onclick="resetGame()"
            class="rounded-md border border-indigo-700 px-3 py-2 font-semibold text-indigo-100 transition hover:border-indigo-500 hover:bg-indigo-800"
          >
            重新开始
          </button>
        </aside>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("board");
      const ctx = canvas.getContext("2d");
      const levels = 5;
      const tileW = 62;
      const tileH = 34;
      const tiles = [];
      let player = { row: 0, col: 0 };
      let score = 0;
      let moves = 0;
      let gameWon = false;

      function buildTiles() {
        tiles.length = 0;
        for (let row = 0; row < levels; row += 1) {
          for (let col = 0; col <= row; col += 1) {
            tiles.push({ row, col, lit: false, ...tileCenter(row, col) });
          }
        }
      }

      function tileCenter(row, col) {
        const startX = canvas.width / 2 - (row * tileW) / 2;
        return {
          x: startX + col * tileW,
          y: 76 + row * tileH * 1.35,
        };
      }

      function resetGame() {
        score = 0;
        moves = 0;
        gameWon = false;
        player = { row: 0, col: 0 };
        buildTiles();
        lightCurrentTile();
        setMessage("使用 Q/E/A/D 沿斜向跳跃。");
        updateHud();
        renderBoard();
      }

      function setMessage(text) {
        document.getElementById("message").textContent = text;
      }

      function updateHud() {
        const lit = tiles.filter((tile) => tile.lit).length;
        document.getElementById("score").textContent = score;
        document.getElementById("tiles").textContent = lit + " / " + tiles.length;
        document.getElementById("moves").textContent = moves;
      }

      function getTile(row, col) {
        return tiles.find((tile) => tile.row === row && tile.col === col);
      }

      function lightCurrentTile() {
        const tile = getTile(player.row, player.col);
        if (!tile || tile.lit) return;
        tile.lit = true;
        score += 10;
      }

      function movePlayer(direction) {
        if (gameWon) return;

        const next = { ...player };
        if (direction === "upLeft") {
          next.row -= 1;
          next.col -= 1;
        }
        if (direction === "upRight") {
          next.row -= 1;
        }
        if (direction === "downLeft") {
          next.row += 1;
        }
        if (direction === "downRight") {
          next.row += 1;
          next.col += 1;
        }

        if (!getTile(next.row, next.col)) {
          setMessage("不能跳出金字塔。");
          return;
        }

        player = next;
        moves += 1;
        lightCurrentTile();
        updateHud();
        renderBoard();
        checkWin();
      }

      function checkWin() {
        const lit = tiles.every((tile) => tile.lit);
        if (!lit) {
          setMessage("继续点亮剩余方块。");
          return;
        }
        setMessage("全部点亮，挑战完成。");
        gameWon = true;
        score += Math.max(0, 100 - moves * 2);
        updateHud();
      }

      function renderBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#1e1b4b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        tiles.forEach(drawTile);
        drawPlayer();
      }

      function drawTile(tile) {
        const top = tile.lit ? "#f97316" : "#6366f1";
        const left = tile.lit ? "#c2410c" : "#4338ca";
        const right = tile.lit ? "#fed7aa" : "#818cf8";

        ctx.fillStyle = top;
        ctx.beginPath();
        ctx.moveTo(tile.x, tile.y - tileH / 2);
        ctx.lineTo(tile.x + tileW / 2, tile.y);
        ctx.lineTo(tile.x, tile.y + tileH / 2);
        ctx.lineTo(tile.x - tileW / 2, tile.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = left;
        ctx.beginPath();
        ctx.moveTo(tile.x - tileW / 2, tile.y);
        ctx.lineTo(tile.x, tile.y + tileH / 2);
        ctx.lineTo(tile.x, tile.y + tileH);
        ctx.lineTo(tile.x - tileW / 2, tile.y + tileH / 2);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = right;
        ctx.beginPath();
        ctx.moveTo(tile.x + tileW / 2, tile.y);
        ctx.lineTo(tile.x, tile.y + tileH / 2);
        ctx.lineTo(tile.x, tile.y + tileH);
        ctx.lineTo(tile.x + tileW / 2, tile.y + tileH / 2);
        ctx.closePath();
        ctx.fill();
      }

      function drawPlayer() {
        const tile = getTile(player.row, player.col);
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(tile.x, tile.y - 26, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111827";
        ctx.fillRect(tile.x - 4, tile.y - 30, 3, 3);
        ctx.fillRect(tile.x + 4, tile.y - 30, 3, 3);
      }

      function bindKeys() {
        document.addEventListener("keydown", (event) => {
          const key = event.key.toLowerCase();
          if (key === "q" || event.key === "ArrowUp") movePlayer("upLeft");
          if (key === "e") movePlayer("upRight");
          if (key === "a" || event.key === "ArrowLeft") movePlayer("downLeft");
          if (key === "d" || event.key === "ArrowRight") movePlayer("downRight");
        });
      }

      bindKeys();
      resetGame();
    </script>
  </body>
</html>
