<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Pong</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col items-center justify-center gap-5 px-4 py-6">
      <section class="w-full rounded-lg border border-zinc-800 bg-zinc-900/80 p-4 shadow-2xl shadow-black/30">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold tracking-normal text-white">Mini Pong</h1>
            <p class="text-sm text-zinc-400">Move your paddle, return the ball, and race the CPU to seven.</p>
          </div>
          <button
            id="restart"
            class="rounded-md bg-emerald-500 px-4 py-2 text-sm font-semibold text-zinc-950 transition hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-300"
          >
            Restart
          </button>
        </div>

        <div class="grid gap-3 sm:grid-cols-3">
          <div class="rounded-md border border-zinc-800 bg-zinc-950 px-3 py-2 text-center">
            <p class="text-xs uppercase text-zinc-500">Player</p>
            <p id="playerScore" class="text-2xl font-bold text-emerald-300">0</p>
          </div>
          <div class="rounded-md border border-zinc-800 bg-zinc-950 px-3 py-2 text-center">
            <p class="text-xs uppercase text-zinc-500">Status</p>
            <p id="status" class="text-sm font-semibold text-zinc-200">Press Space to serve</p>
          </div>
          <div class="rounded-md border border-zinc-800 bg-zinc-950 px-3 py-2 text-center">
            <p class="text-xs uppercase text-zinc-500">CPU</p>
            <p id="cpuScore" class="text-2xl font-bold text-rose-300">0</p>
          </div>
        </div>

        <canvas
          id="game"
          width="760"
          height="430"
          class="mt-4 block w-full rounded-md border border-zinc-800 bg-zinc-950"
        ></canvas>

        <div class="mt-3 flex flex-wrap justify-between gap-2 text-sm text-zinc-400">
          <span>Controls: W/S, Arrow Up/Down, Space</span>
          <span>Touch or drag on the board to move</span>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const playerScoreEl = document.getElementById("playerScore");
      const cpuScoreEl = document.getElementById("cpuScore");
      const statusEl = document.getElementById("status");
      const restartBtn = document.getElementById("restart");

      const state = {
        player: { x: 28, y: 165, w: 14, h: 92, score: 0, vy: 0 },
        cpu: { x: 718, y: 165, w: 14, h: 92, score: 0 },
        ball: { x: 380, y: 215, r: 8, vx: 0, vy: 0 },
        running: false,
        winner: "",
      };

      function resetBall(direction = Math.random() > 0.5 ? 1 : -1) {
        state.ball.x = canvas.width / 2;
        state.ball.y = canvas.height / 2;
        state.ball.vx = direction * 5;
        state.ball.vy = (Math.random() * 4 - 2) || 2;
        state.running = false;
        statusEl.textContent = "Press Space to serve";
      }

      function restartGame() {
        state.player.score = 0;
        state.cpu.score = 0;
        state.player.y = 165;
        state.cpu.y = 165;
        state.winner = "";
        playerScoreEl.textContent = "0";
        cpuScoreEl.textContent = "0";
        resetBall();
      }

      function serve() {
        if (state.winner) {
          restartGame();
        }
        state.running = true;
        statusEl.textContent = "In play";
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function scorePoint(playerScored) {
        if (playerScored) {
          state.player.score += 1;
          playerScoreEl.textContent = state.player.score;
        } else {
          state.cpu.score += 1;
          cpuScoreEl.textContent = state.cpu.score;
        }

        if (state.player.score === 7 || state.cpu.score === 7) {
          state.winner = state.player.score === 7 ? "Player wins" : "CPU wins";
          state.running = false;
          statusEl.textContent = `${state.winner}. Space resets.`;
          return;
        }

        resetBall(playerScored ? -1 : 1);
      }

      function moveCpu() {
        const target = state.ball.y - state.cpu.h / 2;
        state.cpu.y += (target - state.cpu.y) * 0.075;
        state.cpu.y = clamp(state.cpu.y, 0, canvas.height - state.cpu.h);
      }

      function hitPaddle(paddle) {
        return (
          state.ball.x - state.ball.r < paddle.x + paddle.w &&
          state.ball.x + state.ball.r > paddle.x &&
          state.ball.y + state.ball.r > paddle.y &&
          state.ball.y - state.ball.r < paddle.y + paddle.h
        );
      }

      function update() {
        state.player.y = clamp(state.player.y + state.player.vy, 0, canvas.height - state.player.h);
        moveCpu();

        if (!state.running || state.winner) {
          return;
        }

        state.ball.x += state.ball.vx;
        state.ball.y += state.ball.vy;

        if (state.ball.y < state.ball.r || state.ball.y > canvas.height - state.ball.r) {
          state.ball.vy *= -1;
          state.ball.y = clamp(state.ball.y, state.ball.r, canvas.height - state.ball.r);
        }

        if (state.ball.vx < 0 && hitPaddle(state.player)) {
          const offset = (state.ball.y - (state.player.y + state.player.h / 2)) / (state.player.h / 2);
          state.ball.vx = Math.abs(state.ball.vx) + 0.25;
          state.ball.vy = offset * 5;
        }

        if (state.ball.vx > 0 && hitPaddle(state.cpu)) {
          const offset = (state.ball.y - (state.cpu.y + state.cpu.h / 2)) / (state.cpu.h / 2);
          state.ball.vx = -Math.abs(state.ball.vx) - 0.25;
          state.ball.vy = offset * 5;
        }

        if (state.ball.x < -20) {
          scorePoint(false);
        }

        if (state.ball.x > canvas.width + 20) {
          scorePoint(true);
        }
      }

      function drawNet() {
        ctx.strokeStyle = "#3f3f46";
        ctx.lineWidth = 4;
        ctx.setLineDash([12, 16]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 18);
        ctx.lineTo(canvas.width / 2, canvas.height - 18);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawPaddle(paddle, color) {
        ctx.fillStyle = color;
        ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#09090b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawNet();
        drawPaddle(state.player, "#6ee7b7");
        drawPaddle(state.cpu, "#fda4af");
        ctx.fillStyle = "#fafafa";
        ctx.beginPath();
        ctx.arc(state.ball.x, state.ball.y, state.ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      function setPointerPosition(clientY) {
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.height / rect.height;
        state.player.y = clamp((clientY - rect.top) * scale - state.player.h / 2, 0, canvas.height - state.player.h);
      }

      window.addEventListener("keydown", (event) => {
        if (event.key === " " || event.code === "Space") {
          event.preventDefault();
          serve();
        }
        if (event.key === "ArrowUp" || event.key.toLowerCase() === "w") {
          state.player.vy = -7;
        }
        if (event.key === "ArrowDown" || event.key.toLowerCase() === "s") {
          state.player.vy = 7;
        }
      });

      window.addEventListener("keyup", (event) => {
        if (["ArrowUp", "ArrowDown", "w", "W", "s", "S"].includes(event.key)) {
          state.player.vy = 0;
        }
      });

      canvas.addEventListener("pointerdown", (event) => {
        setPointerPosition(event.clientY);
        serve();
      });

      canvas.addEventListener("pointermove", (event) => {
        if (event.buttons > 0) {
          setPointerPosition(event.clientY);
        }
      });

      restartBtn.addEventListener("click", restartGame);
      restartGame();
      loop();
    </script>
  </body>
</html>
