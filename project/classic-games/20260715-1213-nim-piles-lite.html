<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Nim Piles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-6 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-slate-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-teal-300">Classic Games</p>
        <h1 class="mt-1 text-3xl font-bold text-white">Mini Nim Piles</h1>
      </div>
      <button id="resetBtn" class="rounded bg-teal-400 px-4 py-2 text-sm font-bold text-slate-950 hover:bg-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-200">重新开始</button>
    </header>

    <section class="grid gap-6 lg:grid-cols-[1fr_280px]">
      <div class="rounded-lg border border-slate-800 bg-slate-900 p-4 shadow-xl">
        <div id="piles" class="grid gap-4 sm:grid-cols-3"></div>
      </div>

      <aside class="rounded-lg border border-slate-800 bg-slate-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">当前回合</p>
            <p id="turnLabel" class="mt-1 text-2xl font-bold text-teal-200">青方</p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded border border-slate-700 bg-slate-950 p-3">
              <p class="text-slate-400">剩余石子</p>
              <p id="totalLabel" class="mt-1 text-xl font-bold">0</p>
            </div>
            <div class="rounded border border-slate-700 bg-slate-950 p-3">
              <p class="text-slate-400">Nim 和</p>
              <p id="xorLabel" class="mt-1 text-xl font-bold">0</p>
            </div>
          </div>
          <p id="message" class="rounded border border-slate-700 bg-slate-950 p-3 text-sm leading-6 text-slate-200">青方先手。选择一堆并取走至少一颗石子。</p>
          <div class="space-y-2 text-sm leading-6 text-slate-300">
            <p>每回合只能从同一堆取走任意数量的石子。</p>
            <p>取走最后一颗石子的玩家获胜。</p>
            <p>按钮上的数字表示本次从该堆取走的数量。</p>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const pilesEl = document.getElementById("piles");
    const turnLabel = document.getElementById("turnLabel");
    const totalLabel = document.getElementById("totalLabel");
    const xorLabel = document.getElementById("xorLabel");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    let state;

    function resetGame() {
      state = {
        piles: [3, 5, 7],
        turn: "teal",
        winner: null,
        lastMove: null
      };
      render();
    }

    function playerName(player) {
      return player === "teal" ? "青方" : "橙方";
    }

    function opponent(player) {
      return player === "teal" ? "orange" : "teal";
    }

    function nimSum() {
      return state.piles.reduce((sum, pile) => sum ^ pile, 0);
    }

    function totalStones() {
      return state.piles.reduce((sum, pile) => sum + pile, 0);
    }

    function takeStones(pileIndex, amount) {
      if (state.winner || amount <= 0 || amount > state.piles[pileIndex]) return;
      state.piles[pileIndex] -= amount;
      state.lastMove = `${playerName(state.turn)}从第 ${pileIndex + 1} 堆取走 ${amount} 颗。`;
      if (totalStones() === 0) {
        state.winner = state.turn;
        message.textContent = `${state.lastMove}${playerName(state.turn)}取走最后一颗，获得胜利。`;
      } else {
        state.turn = opponent(state.turn);
        message.textContent = `${state.lastMove}${playerName(state.turn)}回合。`;
      }
      render();
    }

    function renderPile(count, index) {
      const stones = Array.from({ length: count }, (_, stoneIndex) => {
        return `<span class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-teal-100 bg-teal-400 text-sm font-black text-slate-950 shadow">${stoneIndex + 1}</span>`;
      }).join("");
      const buttons = Array.from({ length: count }, (_, amountIndex) => {
        const amount = amountIndex + 1;
        return `<button type="button" class="rounded border border-slate-600 bg-slate-950 px-3 py-2 text-sm font-bold text-slate-100 hover:border-teal-300 hover:text-teal-200 focus:outline-none focus:ring-2 focus:ring-teal-200" data-pile="${index}" data-amount="${amount}">${amount}</button>`;
      }).join("");

      return `
        <div class="rounded-lg border border-slate-700 bg-slate-950 p-4">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-lg font-bold">第 ${index + 1} 堆</h2>
            <span class="rounded bg-slate-800 px-2 py-1 text-sm font-bold">${count}</span>
          </div>
          <div class="mb-4 flex min-h-28 flex-wrap content-end gap-2">${stones || '<span class="text-sm text-slate-500">空</span>'}</div>
          <div class="grid grid-cols-4 gap-2">${buttons}</div>
        </div>
      `;
    }

    function render() {
      const total = totalStones();
      turnLabel.textContent = state.winner ? `${playerName(state.winner)}获胜` : playerName(state.turn);
      totalLabel.textContent = String(total);
      xorLabel.textContent = String(nimSum());
      pilesEl.innerHTML = state.piles.map(renderPile).join("");
      pilesEl.querySelectorAll("button[data-pile]").forEach((button) => {
        button.addEventListener("click", () => takeStones(Number(button.dataset.pile), Number(button.dataset.amount)));
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
