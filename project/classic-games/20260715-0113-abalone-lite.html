<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Abalone</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-stone-800 pb-4 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-sky-200">Mini Abalone</h1>
        <p class="mt-1 text-sm text-stone-400">推动己方弹珠，合力把对手推出棋盘。</p>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <div class="text-stone-500">当前</div>
          <div id="turn" class="text-lg font-bold text-sky-200">White</div>
        </div>
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <div class="text-stone-500">White 推出</div>
          <div id="whiteScore" class="text-lg font-bold">0</div>
        </div>
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <div class="text-stone-500">Black 推出</div>
          <div id="blackScore" class="text-lg font-bold">0</div>
        </div>
      </div>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="flex justify-center">
        <div id="board" class="grid aspect-square w-full max-w-[640px] grid-cols-7 gap-2 rounded bg-stone-900 p-3 shadow-2xl shadow-black/40"></div>
      </div>
      <aside class="flex flex-col gap-4">
        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-stone-400">方向</h2>
          <div id="moves" class="mt-3 grid grid-cols-2 gap-2"></div>
        </div>
        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-stone-400">状态</h2>
          <p id="message" class="mt-3 min-h-24 text-sm leading-6 text-stone-300">选择己方弹珠，再选择推动方向。</p>
          <button id="reset" class="mt-4 w-full rounded bg-sky-300 px-4 py-2 font-semibold text-stone-950 hover:bg-sky-200">重新开局</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 7;
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const turnEl = document.getElementById('turn');
    const whiteScoreEl = document.getElementById('whiteScore');
    const blackScoreEl = document.getElementById('blackScore');
    const msgEl = document.getElementById('message');
    const resetBtn = document.getElementById('reset');

    const dirs = {
      up: [-1, 0],
      down: [1, 0],
      left: [0, -1],
      right: [0, 1],
      upLeft: [-1, -1],
      downRight: [1, 1]
    };
    const labels = { up: '上', down: '下', left: '左', right: '右', upLeft: '左上', downRight: '右下' };
    let board;
    let current;
    let selected;
    let score;
    let gameOver;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(''));
      for (let col = 1; col < 6; col += 1) board[0][col] = 'B';
      for (let col = 1; col < 6; col += 1) board[6][col] = 'W';
      board[1][2] = 'B'; board[1][3] = 'B'; board[1][4] = 'B';
      board[5][2] = 'W'; board[5][3] = 'W'; board[5][4] = 'W';
      current = 'W';
      selected = null;
      score = { W: 0, B: 0 };
      gameOver = false;
      msgEl.textContent = '选择己方弹珠，再选择推动方向。';
      render();
    }

    function playerName(mark) {
      return mark === 'W' ? 'White' : 'Black';
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const cell = board[row][col];
          const active = selected && selected.row === row && selected.col === col;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = cell ? '●' : '';
          btn.className = [
            'aspect-square rounded-full border text-3xl font-black transition',
            (row + col) % 2 === 0 ? 'bg-stone-800' : 'bg-stone-700',
            cell === 'W' ? 'border-stone-100 text-stone-100' : '',
            cell === 'B' ? 'border-stone-950 text-stone-950' : '',
            !cell ? 'border-stone-600 hover:border-sky-200' : '',
            active ? 'outline outline-4 outline-sky-200' : ''
          ].join(' ');
          btn.addEventListener('click', () => selectMarble(row, col));
          boardEl.appendChild(btn);
        }
      }
    }

    function renderMoves() {
      movesEl.innerHTML = '';
      Object.keys(dirs).forEach((key) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = labels[key];
        btn.disabled = !selected || gameOver;
        btn.className = 'rounded border border-stone-700 px-3 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-35 enabled:bg-stone-800 enabled:hover:border-sky-200';
        btn.addEventListener('click', () => push(key));
        movesEl.appendChild(btn);
      });
    }

    function render() {
      turnEl.textContent = playerName(current);
      whiteScoreEl.textContent = score.W;
      blackScoreEl.textContent = score.B;
      renderBoard();
      renderMoves();
    }

    function selectMarble(row, col) {
      if (gameOver) return;
      if (board[row][col] !== current) {
        msgEl.textContent = '请选择己方弹珠。';
        return;
      }
      selected = { row, col };
      msgEl.textContent = '已选择弹珠，选择推动方向。';
      render();
    }

    function collectLine(start, dir) {
      const [dr, dc] = dirs[dir];
      const line = [];
      let row = start.row;
      let col = start.col;
      while (inBounds(row, col) && board[row][col]) {
        line.push({ row, col, mark: board[row][col] });
        row += dr;
        col += dc;
      }
      return { line, after: { row, col } };
    }

    function push(dir) {
      if (!selected || gameOver) return;
      const { line, after } = collectLine(selected, dir);
      const own = line.filter((item) => item.mark === current).length;
      const enemy = line.filter((item) => item.mark && item.mark !== current).length;
      if (line[0]?.mark !== current || own <= enemy) {
        msgEl.textContent = '己方连续数量必须多于前方对手数量。';
        return;
      }
      if (inBounds(after.row, after.col) && board[after.row][after.col]) {
        msgEl.textContent = '前方没有推动空间。';
        return;
      }
      const [dr, dc] = dirs[dir];
      let pushedOut = '';
      for (let i = line.length - 1; i >= 0; i -= 1) {
        const item = line[i];
        const nr = item.row + dr;
        const nc = item.col + dc;
        if (inBounds(nr, nc)) board[nr][nc] = item.mark;
        else pushedOut = item.mark;
        board[item.row][item.col] = '';
      }
      if (pushedOut && pushedOut !== current) score[current] += 1;
      if (score[current] >= 3) {
        gameOver = true;
        msgEl.textContent = `${playerName(current)} 推出 3 枚对手弹珠，赢得本局。`;
      } else {
        msgEl.textContent = pushedOut ? `${playerName(current)} 推出一枚对手弹珠。` : `${playerName(current)} 推动成功。`;
        current = current === 'W' ? 'B' : 'W';
      }
      selected = null;
      render();
    }

    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
