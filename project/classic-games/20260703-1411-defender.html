<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Defender</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
      <section class="w-full max-w-2xl rounded-lg border border-slate-700 bg-slate-900 p-4 shadow-2xl">
        <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Defender</h1>
            <p class="mt-1 text-sm text-slate-400">驾驶飞船击落敌机，保护地面幸存者。</p>
          </div>
          <button
            id="resetButton"
            class="rounded bg-lime-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-lime-300"
            type="button"
          >
            重新开始
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-slate-700 bg-slate-800 p-2">
            <div class="text-slate-400">分数</div>
            <div id="scoreStatus" class="font-semibold">0</div>
          </div>
          <div class="rounded border border-slate-700 bg-slate-800 p-2">
            <div class="text-slate-400">幸存者</div>
            <div id="survivorStatus" class="font-semibold">0</div>
          </div>
          <div class="rounded border border-slate-700 bg-slate-800 p-2">
            <div class="text-slate-400">敌机</div>
            <div id="enemyStatus" class="font-semibold">0</div>
          </div>
        </div>

        <canvas
          id="gameCanvas"
          class="mt-4 block w-full rounded border border-slate-700 bg-slate-950"
          width="640"
          height="360"
        ></canvas>

        <div id="message" class="mt-3 min-h-6 text-center text-sm font-semibold text-lime-300"></div>

        <div class="mt-4 grid grid-cols-5 gap-2">
          <button class="controlButton rounded bg-slate-700 py-2 hover:bg-slate-600" data-action="left" type="button">左</button>
          <button class="controlButton rounded bg-slate-700 py-2 hover:bg-slate-600" data-action="up" type="button">上</button>
          <button class="controlButton rounded bg-slate-700 py-2 hover:bg-slate-600" data-action="fire" type="button">射击</button>
          <button class="controlButton rounded bg-slate-700 py-2 hover:bg-slate-600" data-action="down" type="button">下</button>
          <button class="controlButton rounded bg-slate-700 py-2 hover:bg-slate-600" data-action="right" type="button">右</button>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const scoreStatus = document.getElementById("scoreStatus");
      const survivorStatus = document.getElementById("survivorStatus");
      const enemyStatus = document.getElementById("enemyStatus");
      const message = document.getElementById("message");
      const resetButton = document.getElementById("resetButton");

      const keys = {};
      const groundY = canvas.height - 42;
      let ship;
      let bullets;
      let enemies;
      let survivors;
      let score;
      let gameOver;
      let frameId;
      let cooldown;

      function resetGame() {
        ship = { x: 90, y: 140, vx: 0, vy: 0, dir: 1, r: 14 };
        bullets = [];
        enemies = [
          { x: 520, y: 80, vx: -1.5, vy: 0.5, r: 13 },
          { x: 590, y: 150, vx: -1.1, vy: -0.4, r: 13 },
          { x: 460, y: 230, vx: -1.3, vy: 0.3, r: 13 },
          { x: 350, y: 105, vx: 1.1, vy: 0.45, r: 13 },
        ];
        survivors = [
          { x: 90, safe: true },
          { x: 230, safe: true },
          { x: 380, safe: true },
          { x: 535, safe: true },
        ];
        score = 0;
        cooldown = 0;
        gameOver = false;
        message.textContent = "WASD/方向键移动，空格射击。";
        cancelAnimationFrame(frameId);
        frameId = requestAnimationFrame(gameLoop);
      }

      function gameLoop() {
        updateShip();
        updateBullets();
        updateEnemies();
        checkCollisions();
        renderWorld();
        updateStatus();

        if (!gameOver) {
          frameId = requestAnimationFrame(gameLoop);
        }
      }

      function updateShip() {
        const thrust = 0.18;
        if (keys.ArrowLeft || keys.a) {
          ship.vx -= thrust;
          ship.dir = -1;
        }
        if (keys.ArrowRight || keys.d) {
          ship.vx += thrust;
          ship.dir = 1;
        }
        if (keys.ArrowUp || keys.w) ship.vy -= thrust;
        if (keys.ArrowDown || keys.s) ship.vy += thrust;
        if (keys[" "]) fireBullet();

        ship.vx *= 0.96;
        ship.vy *= 0.96;
        ship.x += ship.vx;
        ship.y += ship.vy;
        ship.x = wrapX(ship.x);
        ship.y = clamp(ship.y, 28, groundY - 28);
        cooldown = Math.max(0, cooldown - 1);
      }

      function fireBullet() {
        if (cooldown > 0 || gameOver) {
          return;
        }
        bullets.push({ x: ship.x + ship.dir * 18, y: ship.y, vx: ship.dir * 6.5, r: 4 });
        cooldown = 10;
      }

      function updateBullets() {
        bullets = bullets
          .map((bullet) => ({ ...bullet, x: bullet.x + bullet.vx }))
          .filter((bullet) => bullet.x > -20 && bullet.x < canvas.width + 20);
      }

      function updateEnemies() {
        enemies.forEach((enemy) => {
          enemy.x += enemy.vx;
          enemy.y += enemy.vy;
          enemy.x = wrapX(enemy.x);
          if (enemy.y < 34 || enemy.y > groundY - 38) {
            enemy.vy *= -1;
          }
          const target = survivors.find((survivor) => survivor.safe);
          if (target && Math.abs(enemy.x - target.x) < 14 && enemy.y > groundY - 82) {
            target.safe = false;
            score = Math.max(0, score - 100);
            message.textContent = "一名幸存者被掳走。";
          }
        });
      }

      function checkCollisions() {
        enemies = enemies.filter((enemy) => {
          const hit = bullets.some((bullet) => distance(enemy, bullet) < enemy.r + bullet.r);
          if (hit) {
            score += 150;
            message.textContent = "击落敌机。";
          }
          return !hit;
        });

        bullets = bullets.filter((bullet) => !enemies.some((enemy) => distance(enemy, bullet) < enemy.r + bullet.r));

        if (enemies.some((enemy) => distance(enemy, ship) < enemy.r + ship.r)) {
          gameOver = true;
          message.textContent = "飞船被撞毁。";
          return;
        }

        if (enemies.length === 0) {
          gameOver = true;
          score += survivors.filter((survivor) => survivor.safe).length * 100;
          message.textContent = "敌机清空，防线守住了！";
        }

        if (!survivors.some((survivor) => survivor.safe)) {
          gameOver = true;
          message.textContent = "所有幸存者都失守了。";
        }
      }

      function renderWorld() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawSky();
        survivors.forEach(drawSurvivor);
        bullets.forEach(drawBullet);
        enemies.forEach(drawEnemy);
        drawShip();
      }

      function drawSky() {
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#064e3b";
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
        ctx.fillStyle = "#1e293b";
        for (let x = 0; x < canvas.width; x += 36) {
          ctx.fillRect(x, groundY - 8, 18, 8);
        }
      }

      function drawShip() {
        ctx.fillStyle = "#84cc16";
        ctx.beginPath();
        ctx.moveTo(ship.x + ship.dir * 18, ship.y);
        ctx.lineTo(ship.x - ship.dir * 14, ship.y - 10);
        ctx.lineTo(ship.x - ship.dir * 10, ship.y + 10);
        ctx.closePath();
        ctx.fill();
      }

      function drawEnemy(enemy) {
        ctx.fillStyle = "#fb7185";
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111827";
        ctx.fillRect(enemy.x - 6, enemy.y - 3, 4, 4);
        ctx.fillRect(enemy.x + 2, enemy.y - 3, 4, 4);
      }

      function drawSurvivor(survivor) {
        if (!survivor.safe) {
          return;
        }
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.arc(survivor.x, groundY - 12, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(survivor.x - 3, groundY - 7, 6, 14);
      }

      function drawBullet(bullet) {
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(bullet.x - 6, bullet.y - 2, 12, 4);
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function wrapX(x) {
        if (x < -18) return canvas.width + 18;
        if (x > canvas.width + 18) return -18;
        return x;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function updateStatus() {
        scoreStatus.textContent = String(score);
        survivorStatus.textContent = String(survivors.filter((survivor) => survivor.safe).length);
        enemyStatus.textContent = String(enemies.length);
      }

      document.addEventListener("keydown", (event) => {
        keys[event.key] = true;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
          event.preventDefault();
        }
      });

      document.addEventListener("keyup", (event) => {
        keys[event.key] = false;
      });

      document.querySelectorAll(".controlButton").forEach((button) => {
        button.addEventListener("click", () => {
          const actions = {
            left: () => {
              ship.x -= 18;
              ship.dir = -1;
            },
            right: () => {
              ship.x += 18;
              ship.dir = 1;
            },
            up: () => {
              ship.y -= 18;
            },
            down: () => {
              ship.y += 18;
            },
            fire: fireBullet,
          };
          actions[button.dataset.action]();
        });
      });

      resetButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
