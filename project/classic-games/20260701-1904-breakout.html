<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Breakout</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
      <section class="w-full rounded-lg border border-slate-700 bg-slate-900 p-4 shadow-2xl shadow-cyan-950/30">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-normal text-cyan-200">Mini Breakout</h1>
            <p class="text-sm text-slate-400">移动挡板反弹小球，清除所有砖块。</p>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <span class="rounded bg-slate-800 px-3 py-2">得分 <strong id="score">0</strong></span>
            <span class="rounded bg-slate-800 px-3 py-2">生命 <strong id="lives">3</strong></span>
            <button
              id="restart"
              class="rounded bg-cyan-500 px-4 py-2 font-semibold text-slate-950 transition hover:bg-cyan-300"
              type="button"
            >
              重新开始
            </button>
          </div>
        </div>
        <canvas
          id="game"
          class="block w-full rounded border border-slate-700 bg-slate-950"
          width="720"
          height="460"
        ></canvas>
        <div class="mt-3 flex flex-wrap justify-between gap-2 text-xs text-slate-400">
          <span>键盘：← / → 或 A / D</span>
          <span>鼠标或触摸也可控制挡板</span>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const restartButton = document.getElementById("restart");

      const paddle = { width: 112, height: 14, x: 304, speed: 8 };
      const ball = { x: 360, y: 332, radius: 8, dx: 4, dy: -4 };
      const brick = {
        rows: 5,
        cols: 9,
        width: 64,
        height: 20,
        padding: 10,
        offsetTop: 58,
        offsetLeft: 40,
      };

      let score = 0;
      let lives = 3;
      let running = true;
      let leftPressed = false;
      let rightPressed = false;
      let bricks = [];
      let animationFrameId = null;

      function buildBricks() {
        bricks = Array.from({ length: brick.rows }, (_, row) =>
          Array.from({ length: brick.cols }, (_, col) => ({
            x: brick.offsetLeft + col * (brick.width + brick.padding),
            y: brick.offsetTop + row * (brick.height + brick.padding),
            active: true,
          })),
        );
      }

      function resetBall() {
        paddle.x = (canvas.width - paddle.width) / 2;
        ball.x = canvas.width / 2;
        ball.y = canvas.height - 128;
        ball.dx = Math.random() > 0.5 ? 4 : -4;
        ball.dy = -4;
      }

      function resetGame() {
        score = 0;
        lives = 3;
        running = true;
        buildBricks();
        resetBall();
        updateStats();
      }

      function updateStats() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
      }

      function drawBricks() {
        const colors = ["#67e8f9", "#22d3ee", "#06b6d4", "#0891b2", "#0e7490"];
        bricks.forEach((row, rowIndex) => {
          row.forEach((item) => {
            if (!item.active) return;
            ctx.fillStyle = colors[rowIndex];
            ctx.fillRect(item.x, item.y, brick.width, brick.height);
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.fillRect(item.x, item.y, brick.width, 4);
          });
        });
      }

      function drawPaddle() {
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(paddle.x, canvas.height - 34, paddle.width, paddle.height);
      }

      function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#f8fafc";
        ctx.fill();
        ctx.closePath();
      }

      function drawMessage(title, subtitle) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#cffafe";
        ctx.font = "700 34px Arial";
        ctx.textAlign = "center";
        ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 16);
        ctx.fillStyle = "#cbd5e1";
        ctx.font = "16px Arial";
        ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 + 20);
      }

      function hitBricks() {
        bricks.forEach((row) => {
          row.forEach((item) => {
            if (
              item.active &&
              ball.x > item.x &&
              ball.x < item.x + brick.width &&
              ball.y > item.y &&
              ball.y < item.y + brick.height
            ) {
              item.active = false;
              ball.dy *= -1;
              score += 10;
              updateStats();
            }
          });
        });
      }

      function movePaddle() {
        if (leftPressed) paddle.x -= paddle.speed;
        if (rightPressed) paddle.x += paddle.speed;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      }

      function moveBall() {
        if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
          ball.dx *= -1;
        }
        if (ball.y + ball.dy < ball.radius) {
          ball.dy *= -1;
        } else if (ball.y + ball.dy > canvas.height - ball.radius - 20) {
          const paddleTop = canvas.height - 34;
          const insidePaddle = ball.x > paddle.x && ball.x < paddle.x + paddle.width && ball.y < paddleTop + 14;
          if (insidePaddle) {
            const offset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
            ball.dx = offset * 5;
            ball.dy = -Math.abs(ball.dy);
          } else if (ball.y + ball.dy > canvas.height - ball.radius) {
            lives -= 1;
            updateStats();
            if (lives === 0) running = false;
            resetBall();
          }
        }
        ball.x += ball.dx;
        ball.y += ball.dy;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBricks();
        drawPaddle();
        drawBall();
        hitBricks();
        movePaddle();
        moveBall();

        const remaining = bricks.flat().some((item) => item.active);
        if (!remaining) {
          running = false;
          drawMessage("闯关成功", "点击重新开始再玩一局");
        } else if (!running) {
          drawMessage("游戏结束", "点击重新开始挑战更高分");
        } else {
          animationFrameId = requestAnimationFrame(draw);
        }
      }

      function setPaddleFromClientX(clientX) {
        const rect = canvas.getBoundingClientRect();
        const scale = canvas.width / rect.width;
        paddle.x = (clientX - rect.left) * scale - paddle.width / 2;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") leftPressed = true;
        if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") rightPressed = true;
      });

      document.addEventListener("keyup", (event) => {
        if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") leftPressed = false;
        if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") rightPressed = false;
      });

      canvas.addEventListener("mousemove", (event) => setPaddleFromClientX(event.clientX));
      canvas.addEventListener(
        "touchmove",
        (event) => {
          event.preventDefault();
          setPaddleFromClientX(event.touches[0].clientX);
        },
        { passive: false },
      );

      function startGame() {
        if (animationFrameId !== null) cancelAnimationFrame(animationFrameId);
        resetGame();
        animationFrameId = requestAnimationFrame(draw);
      }

      restartButton.addEventListener("click", () => {
        startGame();
      });

      startGame();
    </script>
  </body>
</html>
