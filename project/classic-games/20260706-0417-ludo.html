<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Ludo Sprint</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-neutral-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-red-300">Classic Games</p>
          <h1 class="mt-1 text-3xl font-bold">Mini Ludo Sprint</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-neutral-800 bg-neutral-900 px-4 py-2">
            <div id="dieValue" class="text-xl font-bold text-red-200">-</div>
            <div class="text-neutral-400">die</div>
          </div>
          <div class="rounded border border-neutral-800 bg-neutral-900 px-4 py-2">
            <div id="turnCount" class="text-xl font-bold text-sky-200">0</div>
            <div class="text-neutral-400">turns</div>
          </div>
          <div class="rounded border border-neutral-800 bg-neutral-900 px-4 py-2">
            <div id="homeCount" class="text-xl font-bold text-emerald-200">0/3</div>
            <div class="text-neutral-400">home</div>
          </div>
        </div>
      </header>

      <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
        <div class="rounded border border-neutral-800 bg-neutral-900 p-4">
          <div id="track" class="grid grid-cols-8 gap-2"></div>
          <p id="status" class="mt-4 min-h-6 text-sm font-medium text-neutral-300">Roll a six to launch a piece from start.</p>
        </div>

        <aside class="rounded border border-neutral-800 bg-neutral-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-neutral-400">Pieces</h2>
          <div id="pieces" class="mt-3 grid gap-2"></div>
          <div class="mt-5 grid gap-3">
            <button id="rollBtn" class="rounded bg-red-400 px-4 py-2 font-semibold text-neutral-950 hover:bg-red-300">Roll</button>
            <button id="newGameBtn" class="rounded border border-neutral-700 px-4 py-2 font-semibold hover:bg-neutral-800">New Game</button>
          </div>
          <p class="mt-5 text-sm leading-6 text-neutral-400">
            Roll, then choose a legal piece. A six launches from start. Home requires an exact roll.
          </p>
        </aside>
      </section>
    </main>

    <script>
      const finish = 15;
      const pieceColors = ["bg-red-400", "bg-sky-400", "bg-emerald-400"];
      const trackEl = document.getElementById("track");
      const piecesEl = document.getElementById("pieces");
      const dieValueEl = document.getElementById("dieValue");
      const turnCountEl = document.getElementById("turnCount");
      const homeCountEl = document.getElementById("homeCount");
      const statusEl = document.getElementById("status");
      const rollBtn = document.getElementById("rollBtn");
      const newGameBtn = document.getElementById("newGameBtn");

      let pieces = [];
      let die = null;
      let turns = 0;
      let mustMove = false;

      function newGame() {
        pieces = [
          { id: "A", pos: -1 },
          { id: "B", pos: -1 },
          { id: "C", pos: -1 },
        ];
        die = null;
        turns = 0;
        mustMove = false;
        statusEl.textContent = "Roll a six to launch a piece from start.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-neutral-300";
        render();
      }

      function homePieces() {
        return pieces.filter((piece) => piece.pos === finish).length;
      }

      function legalMove(piece) {
        if (die === null || piece.pos === finish) return false;
        if (piece.pos === -1) return die === 6 && !pieces.some((other) => other.pos === 0);
        const target = piece.pos + die;
        if (target > finish) return false;
        return !pieces.some((other) => other !== piece && other.pos === target && target !== finish);
      }

      function legalPieces() {
        return pieces.filter(legalMove);
      }

      function rollDie() {
        if (mustMove) return;
        die = Math.ceil(Math.random() * 6);
        turns += 1;
        mustMove = true;
        const legal = legalPieces();
        if (!legal.length) {
          statusEl.textContent = `Rolled ${die}. No legal move.`;
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-amber-300";
          mustMove = false;
        } else {
          statusEl.textContent = `Rolled ${die}. Choose a highlighted piece.`;
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-sky-300";
        }
        render();
      }

      function movePiece(id) {
        if (!mustMove) return;
        const piece = pieces.find((item) => item.id === id);
        if (!piece || !legalMove(piece)) return;
        piece.pos = piece.pos === -1 ? 0 : piece.pos + die;
        mustMove = false;
        if (homePieces() === pieces.length) {
          statusEl.textContent = "All pieces are home.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-emerald-300";
        } else if (die === 6) {
          statusEl.textContent = "Six grants another roll.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-red-300";
        } else {
          statusEl.textContent = "Roll again.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-neutral-300";
        }
        render();
      }

      function renderTrack() {
        trackEl.innerHTML = "";
        for (let cell = 0; cell <= finish; cell += 1) {
          const occupants = pieces.filter((piece) => piece.pos === cell);
          const square = document.createElement("div");
          square.className = [
            "flex aspect-square items-center justify-center rounded border text-xs font-bold",
            cell === 0 ? "border-red-400 bg-red-950" : "border-neutral-800 bg-neutral-950",
            cell === finish ? "border-emerald-400 bg-emerald-950" : "",
          ].join(" ");
          square.innerHTML = occupants.length
            ? occupants
                .map((piece) => `<span class="mx-0.5 flex h-6 w-6 items-center justify-center rounded-full text-neutral-950 ${pieceColors[piece.id.charCodeAt(0) - 65]}">${piece.id}</span>`)
                .join("")
            : `<span class="text-neutral-500">${cell}</span>`;
          trackEl.appendChild(square);
        }
      }

      function renderPieces() {
        piecesEl.innerHTML = "";
        pieces.forEach((piece, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = !legalMove(piece);
          button.className = [
            "flex items-center justify-between rounded border px-3 py-2 text-left",
            legalMove(piece) ? "border-red-300 bg-neutral-950 hover:bg-neutral-800" : "border-neutral-800 bg-neutral-950 text-neutral-500",
          ].join(" ");
          const label = piece.pos === -1 ? "start" : piece.pos === finish ? "home" : `space ${piece.pos}`;
          button.innerHTML = `<span class="flex items-center gap-2"><span class="flex h-6 w-6 items-center justify-center rounded-full text-sm font-black text-neutral-950 ${pieceColors[index]}">${piece.id}</span>${label}</span><span>${legalMove(piece) ? "move" : ""}</span>`;
          button.addEventListener("click", () => movePiece(piece.id));
          piecesEl.appendChild(button);
        });
      }

      function render() {
        renderTrack();
        renderPieces();
        dieValueEl.textContent = die === null ? "-" : die;
        turnCountEl.textContent = turns;
        homeCountEl.textContent = `${homePieces()}/${pieces.length}`;
        rollBtn.disabled = mustMove || homePieces() === pieces.length;
        rollBtn.className = rollBtn.disabled
          ? "rounded bg-neutral-700 px-4 py-2 font-semibold text-neutral-400"
          : "rounded bg-red-400 px-4 py-2 font-semibold text-neutral-950 hover:bg-red-300";
      }

      rollBtn.addEventListener("click", rollDie);
      newGameBtn.addEventListener("click", newGame);
      newGame();
    </script>
  </body>
</html>
