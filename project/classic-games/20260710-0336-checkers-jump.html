<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Checkers Jump</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Checkers Jump</h1>
        <p class="text-sm text-stone-300">Jump a piece over its neighbor into an empty square. Clear pieces until no jumps remain.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-white px-4 py-2 font-semibold text-stone-950 hover:bg-stone-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-stone-700 bg-stone-900 p-3 sm:grid-cols-3">
      <div>Pieces: <b id="pieceText">0</b></div>
      <div>Moves: <b id="moveText">0</b></div>
      <div id="message" class="text-stone-200">Select a piece to jump.</div>
    </section>

    <section id="board" class="grid aspect-square w-full max-w-xl max-h-[72vh] grid-cols-5 gap-2 self-center"></section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const pieceText = document.getElementById("pieceText");
    const moveText = document.getElementById("moveText");
    const message = document.getElementById("message");
    const newGameBtn = document.getElementById("newGameBtn");
    const size = 5;
    const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let board = [];
    let selected = null;
    let moves = 0;

    function index(row, col) {
      return row * size + col;
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function pieceCount() {
      return board.filter(Boolean).length;
    }

    function findLegalMoves(from) {
      const row = Math.floor(from / size);
      const col = from % size;
      if (!board[from]) return [];
      return directions.flatMap(([dr, dc]) => {
        const midRow = row + dr;
        const midCol = col + dc;
        const landRow = row + dr * 2;
        const landCol = col + dc * 2;
        if (!inBounds(landRow, landCol) || !inBounds(midRow, midCol)) return [];
        const mid = index(midRow, midCol);
        const land = index(landRow, landCol);
        return board[mid] && !board[land] ? [{ mid, land }] : [];
      });
    }

    function anyLegalMove() {
      return board.some((hasPiece, pos) => hasPiece && findLegalMoves(pos).length > 0);
    }

    function jumpPiece(to) {
      if (selected === null) return false;
      const move = findLegalMoves(selected).find((item) => item.land === to);
      if (!move) return false;
      board[to] = true;
      board[selected] = false;
      board[move.mid] = false;
      selected = null;
      moves += 1;
      if (pieceCount() === 1) {
        message.textContent = "Perfect clear. One piece remains.";
      } else if (!anyLegalMove()) {
        message.textContent = `No more jumps. Final pieces: ${pieceCount()}.`;
      } else {
        message.textContent = "Good jump. Keep going.";
      }
      render();
      return true;
    }

    function handleCellClick(pos) {
      if (board[pos]) {
        selected = selected === pos ? null : pos;
        message.textContent = selected === null ? "Selection cleared." : "Choose an empty landing square.";
        render();
        return;
      }
      if (!jumpPiece(pos)) {
        message.textContent = "That square is not a legal landing.";
      }
    }

    function render() {
      boardEl.innerHTML = "";
      const legalLands = selected === null ? [] : findLegalMoves(selected).map((move) => move.land);
      board.forEach((hasPiece, pos) => {
        const cell = document.createElement("button");
        const dark = (Math.floor(pos / size) + pos) % 2 === 0;
        const isSelected = selected === pos;
        const isLanding = legalLands.includes(pos);
        cell.className = [
          "flex aspect-square items-center justify-center rounded text-2xl font-bold transition",
          dark ? "bg-stone-800" : "bg-stone-700",
          isSelected ? "ring-4 ring-amber-300" : "",
          isLanding ? "ring-4 ring-lime-300" : "",
          hasPiece ? "text-white" : "text-transparent hover:bg-stone-600"
        ].join(" ");
        cell.textContent = hasPiece ? "●" : ".";
        cell.addEventListener("click", () => handleCellClick(pos));
        boardEl.appendChild(cell);
      });
      pieceText.textContent = String(pieceCount());
      moveText.textContent = String(moves);
    }

    function newGame() {
      board = Array(size * size).fill(true);
      [0, 4, 20, 24, 12].forEach((pos) => {
        board[pos] = false;
      });
      selected = null;
      moves = 0;
      message.textContent = "Select a piece to jump.";
      render();
    }

    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
