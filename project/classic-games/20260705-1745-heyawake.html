<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Heyawake</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-6 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-zinc-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-amber-300">Classic Logic Puzzle</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Heyawake</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="resetBtn" class="rounded-md bg-amber-300 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-amber-200">
            重新开始
          </button>
          <button id="hintBtn" class="rounded-md border border-zinc-600 px-4 py-2 text-sm font-semibold text-zinc-100 hover:bg-zinc-800">
            提示
          </button>
        </div>
      </header>

      <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div class="rounded-lg border border-zinc-800 bg-zinc-900/80 p-4 shadow-2xl shadow-black/30">
          <div id="board" class="mx-auto grid aspect-square w-full max-w-[32rem] grid-cols-6 overflow-hidden rounded-md border-4 border-zinc-100"></div>
        </div>

        <aside class="space-y-4">
          <div class="rounded-lg border border-zinc-800 bg-zinc-900 p-4">
            <h2 class="text-lg font-semibold text-white">目标</h2>
            <p class="mt-2 text-sm leading-6 text-zinc-300">
              按房间数字涂黑对应数量的格子。黑格不能相邻，所有白格必须连通，且一条连续白线不能穿过 3 个或更多房间。
            </p>
          </div>

          <div class="rounded-lg border border-zinc-800 bg-zinc-900 p-4">
            <h2 class="text-lg font-semibold text-white">检查</h2>
            <ul class="mt-3 space-y-2 text-sm">
              <li id="roomsStatus" class="rounded-md bg-zinc-800 px-3 py-2 text-zinc-300">房间：等待涂黑</li>
              <li id="adjacentStatus" class="rounded-md bg-zinc-800 px-3 py-2 text-zinc-300">黑格：无相邻</li>
              <li id="connectedStatus" class="rounded-md bg-zinc-800 px-3 py-2 text-zinc-300">白格：等待检查</li>
              <li id="lineStatus" class="rounded-md bg-zinc-800 px-3 py-2 text-zinc-300">白线：无违规</li>
            </ul>
          </div>

          <div id="message" class="rounded-lg border border-amber-300/30 bg-amber-300/10 p-4 text-sm leading-6 text-amber-100">
            点击格子切换黑白状态。
          </div>
        </aside>
      </section>
    </main>

    <script>
      const board = document.getElementById("board");
      const resetBtn = document.getElementById("resetBtn");
      const hintBtn = document.getElementById("hintBtn");
      const message = document.getElementById("message");
      const roomsStatus = document.getElementById("roomsStatus");
      const adjacentStatus = document.getElementById("adjacentStatus");
      const connectedStatus = document.getElementById("connectedStatus");
      const lineStatus = document.getElementById("lineStatus");

      const size = 6;
      const rooms = [
        [0, 0, 1, 1, 1, 2],
        [0, 3, 3, 1, 2, 2],
        [0, 3, 4, 4, 4, 2],
        [5, 3, 4, 6, 6, 6],
        [5, 5, 7, 7, 6, 8],
        [5, 7, 7, 8, 8, 8],
      ];
      const roomTargets = { 0: 1, 1: 1, 2: 1, 3: 1, 4: 1, 5: 1, 6: 1, 7: 1, 8: 1 };
      const roomColors = [
        "bg-sky-200",
        "bg-emerald-200",
        "bg-rose-200",
        "bg-violet-200",
        "bg-amber-200",
        "bg-teal-200",
        "bg-orange-200",
        "bg-lime-200",
        "bg-fuchsia-200",
      ];
      const solution = new Set(["0,0", "0,3", "1,5", "2,2", "3,1", "3,4", "5,0", "5,2", "5,5"]);
      const blackCells = new Set();
      const cells = [];

      function keyOf(row, col) {
        return `${row},${col}`;
      }

      function inBounds(row, col) {
        return row >= 0 && row < size && col >= 0 && col < size;
      }

      function roomReport() {
        const counts = Object.fromEntries(Object.keys(roomTargets).map((id) => [id, 0]));
        blackCells.forEach((key) => {
          const [row, col] = key.split(",").map(Number);
          counts[rooms[row][col]] += 1;
        });
        const complete = Object.entries(roomTargets).every(([id, target]) => counts[id] === target);
        const tooMany = Object.entries(roomTargets).some(([id, target]) => counts[id] > target);
        return { counts, complete, tooMany };
      }

      function adjacentReport() {
        const bad = new Set();
        blackCells.forEach((key) => {
          const [row, col] = key.split(",").map(Number);
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
            const nextKey = keyOf(row + dr, col + dc);
            if (blackCells.has(nextKey)) {
              bad.add(key);
              bad.add(nextKey);
            }
          });
        });
        return { bad, clear: bad.size === 0 };
      }

      function connectedReport() {
        const whites = [];
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            if (!blackCells.has(keyOf(row, col))) whites.push(keyOf(row, col));
          }
        }
        if (whites.length === 0) return { clear: false, reached: 0, total: 0 };
        const seen = new Set([whites[0]]);
        const queue = [whites[0]];
        while (queue.length) {
          const [row, col] = queue.shift().split(",").map(Number);
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
            const nextRow = row + dr;
            const nextCol = col + dc;
            const nextKey = keyOf(nextRow, nextCol);
            if (inBounds(nextRow, nextCol) && !blackCells.has(nextKey) && !seen.has(nextKey)) {
              seen.add(nextKey);
              queue.push(nextKey);
            }
          });
        }
        return { clear: seen.size === whites.length, reached: seen.size, total: whites.length };
      }

      function lineReport() {
        const violations = [];
        const scan = (line) => {
          let segment = [];
          line.concat([null]).forEach((cell) => {
            if (cell && !blackCells.has(keyOf(cell.row, cell.col))) {
              segment.push(cell);
            } else {
              const distinctRooms = new Set(segment.map((item) => rooms[item.row][item.col]));
              if (distinctRooms.size >= 3) violations.push(...segment.map((item) => keyOf(item.row, item.col)));
              segment = [];
            }
          });
        };
        for (let row = 0; row < size; row += 1) scan(Array.from({ length: size }, (_, col) => ({ row, col })));
        for (let col = 0; col < size; col += 1) scan(Array.from({ length: size }, (_, row) => ({ row, col })));
        return { violations: new Set(violations), clear: violations.length === 0 };
      }

      function setStatus(element, label, state) {
        element.className = "rounded-md px-3 py-2 text-sm";
        if (state === "ok") element.classList.add("bg-emerald-500/15", "text-emerald-200");
        if (state === "warn") element.classList.add("bg-amber-500/15", "text-amber-200");
        if (state === "bad") element.classList.add("bg-rose-500/15", "text-rose-200");
        element.textContent = label;
      }

      function render() {
        const roomsOk = roomReport();
        const adjacent = adjacentReport();
        const connected = connectedReport();
        const lines = lineReport();

        cells.forEach((cell) => {
          const key = cell.dataset.key;
          const isBlack = blackCells.has(key);
          cell.textContent = isBlack ? "" : cell.dataset.clue;
          cell.classList.toggle("bg-zinc-950", isBlack);
          cell.classList.toggle("text-zinc-950", !isBlack);
          cell.classList.toggle("ring-4", adjacent.bad.has(key) || lines.violations.has(key));
          cell.classList.toggle("ring-rose-400", adjacent.bad.has(key) || lines.violations.has(key));
        });

        setStatus(roomsStatus, roomsOk.complete ? "房间：数量正确" : roomsOk.tooMany ? "房间：黑格过多" : "房间：还未完成", roomsOk.complete ? "ok" : roomsOk.tooMany ? "bad" : "warn");
        setStatus(adjacentStatus, adjacent.clear ? "黑格：无相邻" : "黑格：存在相邻", adjacent.clear ? "ok" : "bad");
        setStatus(connectedStatus, connected.clear ? "白格：全部连通" : `白格：${connected.reached}/${connected.total} 连通`, connected.clear ? "ok" : "bad");
        setStatus(lineStatus, lines.clear ? "白线：无违规" : "白线：穿过过多房间", lines.clear ? "ok" : "bad");

        const solved = roomsOk.complete && adjacent.clear && connected.clear && lines.clear;
        message.textContent = solved ? "完成！所有 Heyawake 规则都满足。" : `已涂黑 ${blackCells.size} 格。`;
      }

      function buildBoard() {
        board.innerHTML = "";
        cells.length = 0;
        const firstCellByRoom = new Set();
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            const room = rooms[row][col];
            const cell = document.createElement("button");
            cell.type = "button";
            cell.dataset.key = keyOf(row, col);
            cell.dataset.clue = firstCellByRoom.has(room) ? "" : roomTargets[room];
            firstCellByRoom.add(room);
            cell.className = [
              "flex aspect-square items-center justify-center border border-zinc-800 text-xl font-bold transition hover:brightness-95 focus:outline-none focus:ring-4 focus:ring-amber-300",
              roomColors[room],
            ].join(" ");
            cell.addEventListener("click", () => {
              const key = cell.dataset.key;
              blackCells.has(key) ? blackCells.delete(key) : blackCells.add(key);
              render();
            });
            board.appendChild(cell);
            cells.push(cell);
          }
        }
      }

      resetBtn.addEventListener("click", () => {
        blackCells.clear();
        render();
      });

      hintBtn.addEventListener("click", () => {
        const next = [...solution].find((key) => !blackCells.has(key));
        if (next) blackCells.add(next);
        render();
      });

      buildBoard();
      render();
    </script>
  </body>
</html>
