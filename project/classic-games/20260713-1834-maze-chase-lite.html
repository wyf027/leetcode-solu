<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Maze Chase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Mini Maze Chase</h1>
        <p class="text-sm text-slate-400">Collect every star in the maze while the hunter closes in.</p>
      </div>
      <button id="resetBtn" class="rounded bg-yellow-300 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-yellow-200">New Game</button>
    </header>

    <section class="grid gap-4 md:grid-cols-[1fr_16rem]">
      <div class="rounded border border-slate-800 bg-slate-900 p-4">
        <div id="maze" class="mx-auto grid max-w-[30rem] grid-cols-11 overflow-hidden rounded border border-slate-700"></div>
      </div>

      <aside class="space-y-3 rounded border border-slate-800 bg-slate-900 p-4">
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="rounded bg-slate-800 p-3">
            <div class="text-slate-400">Stars</div>
            <div id="stars" class="text-2xl font-bold">0</div>
          </div>
          <div class="rounded bg-slate-800 p-3">
            <div class="text-slate-400">Moves</div>
            <div id="moves" class="text-2xl font-bold">0</div>
          </div>
        </div>
        <div id="message" class="min-h-20 rounded bg-slate-800 p-3 text-sm text-slate-300">Use arrow keys or swipe buttons to collect all stars.</div>
        <div class="grid grid-cols-3 gap-2">
          <span></span>
          <button data-dir="up" class="rounded bg-slate-700 p-3 font-bold hover:bg-slate-600">↑</button>
          <span></span>
          <button data-dir="left" class="rounded bg-slate-700 p-3 font-bold hover:bg-slate-600">←</button>
          <button data-dir="down" class="rounded bg-slate-700 p-3 font-bold hover:bg-slate-600">↓</button>
          <button data-dir="right" class="rounded bg-slate-700 p-3 font-bold hover:bg-slate-600">→</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const mazeEl = document.getElementById('maze');
    const starsEl = document.getElementById('stars');
    const movesEl = document.getElementById('moves');
    const messageEl = document.getElementById('message');
    const layout = [
      '###########',
      '#..#.....*#',
      '#.#.#.###.#',
      '#.#...#...#',
      '#.###.#.#.#',
      '#...#...#.#',
      '###.#.###.#',
      '#*..#...#.#',
      '#.#####.#.#',
      '#.....*...#',
      '###########'
    ];
    const dirs = {
      up: [-1, 0],
      down: [1, 0],
      left: [0, -1],
      right: [0, 1]
    };
    let grid;
    let player;
    let hunter;
    let moves;
    let totalStars;
    let gameOver;

    function resetGame() {
      grid = layout.map(row => [...row]);
      player = { row: 1, col: 1 };
      hunter = { row: 9, col: 9 };
      moves = 0;
      totalStars = grid.flat().filter(cell => cell === '*').length;
      gameOver = false;
      messageEl.textContent = 'Use arrow keys or swipe buttons to collect all stars.';
      render();
    }

    function isWall(row, col) {
      return grid[row]?.[col] === '#';
    }

    function remainingStars() {
      return grid.flat().filter(cell => cell === '*').length;
    }

    function movePlayer(direction) {
      if (gameOver) return;
      const [dr, dc] = dirs[direction];
      const row = player.row + dr;
      const col = player.col + dc;
      if (isWall(row, col)) {
        messageEl.textContent = 'Wall blocked.';
        return;
      }
      player = { row, col };
      moves += 1;
      if (grid[row][col] === '*') {
        grid[row][col] = '.';
        messageEl.textContent = 'Star collected.';
      }
      if (remainingStars() === 0) {
        gameOver = true;
        messageEl.textContent = `You escaped with all ${totalStars} stars in ${moves} moves.`;
        render();
        return;
      }
      moveHunter();
      if (hunter.row === player.row && hunter.col === player.col) {
        gameOver = true;
        messageEl.textContent = 'Caught by the hunter. Try a cleaner route.';
      }
      render();
    }

    function moveHunter() {
      const options = Object.values(dirs)
        .map(([dr, dc]) => ({ row: hunter.row + dr, col: hunter.col + dc }))
        .filter(pos => !isWall(pos.row, pos.col));
      options.sort((a, b) => distance(a, player) - distance(b, player));
      hunter = options[0] || hunter;
    }

    function distance(a, b) {
      return Math.abs(a.row - b.row) + Math.abs(a.col - b.col);
    }

    function render() {
      mazeEl.innerHTML = '';
      for (let row = 0; row < grid.length; row++) {
        for (let col = 0; col < grid[row].length; col++) {
          const cell = document.createElement('div');
          cell.className = 'flex aspect-square items-center justify-center text-lg font-black';
          if (grid[row][col] === '#') cell.className += ' bg-slate-700';
          else cell.className += ' bg-slate-950';
          if (player.row === row && player.col === col) {
            cell.innerHTML = '<span class="h-6 w-6 rounded-full bg-yellow-300"></span>';
          } else if (hunter.row === row && hunter.col === col) {
            cell.innerHTML = '<span class="h-6 w-6 rounded-full bg-rose-500"></span>';
          } else if (grid[row][col] === '*') {
            cell.textContent = '★';
            cell.className += ' text-yellow-300';
          }
          mazeEl.appendChild(cell);
        }
      }
      starsEl.textContent = `${totalStars - remainingStars()}/${totalStars}`;
      movesEl.textContent = moves;
    }

    document.addEventListener('keydown', event => {
      const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
      if (map[event.key]) {
        event.preventDefault();
        movePlayer(map[event.key]);
      }
    });
    document.querySelectorAll('[data-dir]').forEach(button => {
      button.addEventListener('click', () => movePlayer(button.dataset.dir));
    });
    document.getElementById('resetBtn').addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
