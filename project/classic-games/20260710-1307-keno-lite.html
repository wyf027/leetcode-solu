<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Keno</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-lime-950 text-lime-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-lime-700 bg-lime-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-orange-200">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Keno</h1>
        </div>
        <button id="resetBtn" class="rounded bg-orange-200 px-4 py-2 font-semibold text-lime-950 hover:bg-orange-100">
          Reset
        </button>
      </div>

      <div class="mb-5 grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-lime-700 bg-lime-800 p-4">
          <p class="text-sm text-lime-200">Selected</p>
          <p id="selectedCount" class="text-3xl font-bold">0 / 5</p>
        </div>
        <div class="rounded border border-lime-700 bg-lime-800 p-4">
          <p class="text-sm text-lime-200">Hits</p>
          <p id="hitCount" class="text-3xl font-bold">0</p>
        </div>
        <div class="rounded border border-lime-700 bg-lime-800 p-4">
          <p class="text-sm text-lime-200">Score</p>
          <p id="scoreText" class="text-3xl font-bold">0</p>
        </div>
      </div>

      <div id="numberGrid" class="grid grid-cols-5 gap-2 sm:grid-cols-8"></div>

      <button id="drawBtn" class="mt-5 w-full rounded bg-orange-200 px-4 py-3 font-semibold text-lime-950 hover:bg-orange-100">
        Draw 10 Numbers
      </button>

      <p id="statusText" class="mt-5 min-h-6 rounded border border-lime-700 bg-lime-950 p-3 font-semibold">
        Pick exactly 5 numbers, then draw.
      </p>
    </section>
  </main>

  <script>
    const maxNumber = 40;
    const pickLimit = 5;
    const drawCount = 10;
    const selected = new Set();
    const drawn = new Set();
    let locked = false;

    const numberGrid = document.getElementById("numberGrid");
    const selectedCount = document.getElementById("selectedCount");
    const hitCount = document.getElementById("hitCount");
    const scoreText = document.getElementById("scoreText");
    const statusText = document.getElementById("statusText");
    const drawBtn = document.getElementById("drawBtn");
    const resetBtn = document.getElementById("resetBtn");

    function scoreForHits(hits) {
      return [0, 0, 2, 6, 20, 60][hits] || 0;
    }

    function countHits() {
      return [...selected].filter((value) => drawn.has(value)).length;
    }

    function renderGrid() {
      numberGrid.innerHTML = "";
      for (let number = 1; number <= maxNumber; number += 1) {
        const button = document.createElement("button");
        const isSelected = selected.has(number);
        const isDrawn = drawn.has(number);
        const isHit = isSelected && isDrawn;
        button.dataset.number = String(number);
        button.className = "rounded border px-2 py-3 font-bold transition";
        if (isHit) {
          button.classList.add("border-orange-200", "bg-orange-200", "text-lime-950");
        } else if (isDrawn) {
          button.classList.add("border-lime-300", "bg-lime-300", "text-lime-950");
        } else if (isSelected) {
          button.classList.add("border-orange-200", "bg-lime-800", "text-orange-100");
        } else {
          button.classList.add("border-lime-700", "bg-lime-950", "hover:bg-lime-800");
        }
        button.textContent = number;
        numberGrid.appendChild(button);
      }
    }

    function render() {
      const hits = countHits();
      selectedCount.textContent = `${selected.size} / ${pickLimit}`;
      hitCount.textContent = hits;
      scoreText.textContent = scoreForHits(hits);
      drawBtn.disabled = locked || selected.size !== pickLimit;
      drawBtn.classList.toggle("opacity-40", drawBtn.disabled);
      drawBtn.classList.toggle("cursor-not-allowed", drawBtn.disabled);
      renderGrid();
    }

    function toggleNumber(number) {
      if (locked) return;
      if (selected.has(number)) {
        selected.delete(number);
      } else if (selected.size < pickLimit) {
        selected.add(number);
      } else {
        statusText.textContent = "You can only pick 5 numbers.";
      }
      render();
    }

    function drawNumbers() {
      if (selected.size !== pickLimit || locked) return;
      drawn.clear();
      const pool = Array.from({ length: maxNumber }, (_, index) => index + 1);
      while (drawn.size < drawCount) {
        const index = Math.floor(Math.random() * pool.length);
        drawn.add(pool.splice(index, 1)[0]);
      }
      locked = true;
      const hits = countHits();
      statusText.textContent = `Matched ${hits} number${hits === 1 ? "" : "s"} for ${scoreForHits(hits)} points.`;
      render();
    }

    function resetGame() {
      selected.clear();
      drawn.clear();
      locked = false;
      statusText.textContent = "Pick exactly 5 numbers, then draw.";
      render();
    }

    numberGrid.addEventListener("click", (event) => {
      const button = event.target.closest("[data-number]");
      if (!button) return;
      toggleNumber(Number(button.dataset.number));
    });

    drawBtn.addEventListener("click", drawNumbers);
    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
