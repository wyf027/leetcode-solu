<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Math Tiles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cyan-950 text-cyan-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Math Tiles</h1>
        <p class="text-sm text-cyan-200">Select neighboring tiles so their sum matches the target.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-white px-4 py-2 font-semibold text-cyan-950 hover:bg-cyan-100">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-cyan-700 bg-cyan-900 p-3 sm:grid-cols-4">
      <div>Target: <b id="targetText">0</b></div>
      <div>Sum: <b id="sumText">0</b></div>
      <div>Score: <b id="scoreText">0</b></div>
      <div id="message" class="text-cyan-100">Start a path.</div>
    </section>

    <section id="grid" class="grid grid-cols-4 gap-2"></section>

    <section class="flex flex-wrap gap-3 rounded border border-cyan-700 bg-cyan-900 p-4">
      <button id="submitBtn" class="rounded bg-lime-300 px-5 py-3 font-semibold text-cyan-950 hover:bg-lime-200">Submit</button>
      <button id="clearBtn" class="rounded bg-amber-300 px-5 py-3 font-semibold text-cyan-950 hover:bg-amber-200">Clear</button>
    </section>
  </main>

  <script>
    const grid = document.getElementById("grid");
    const targetText = document.getElementById("targetText");
    const sumText = document.getElementById("sumText");
    const scoreText = document.getElementById("scoreText");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");
    const clearBtn = document.getElementById("clearBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const size = 4;
    let tiles = [];
    let path = [];
    let target = 0;
    let score = 0;

    function neighbors(a, b) {
      const ar = Math.floor(a / size);
      const ac = a % size;
      const br = Math.floor(b / size);
      const bc = b % size;
      return Math.abs(ar - br) + Math.abs(ac - bc) === 1;
    }

    function pathSum() {
      return path.reduce((sum, index) => sum + tiles[index], 0);
    }

    function makeTarget() {
      const start = Math.floor(Math.random() * tiles.length);
      const secondOptions = tiles.map((_, index) => index).filter((index) => neighbors(start, index));
      const second = secondOptions[Math.floor(Math.random() * secondOptions.length)];
      const thirdOptions = tiles.map((_, index) => index).filter((index) => index !== start && neighbors(second, index));
      const third = thirdOptions[Math.floor(Math.random() * thirdOptions.length)];
      target = tiles[start] + tiles[second] + tiles[third];
      targetText.textContent = String(target);
    }

    function pickTile(index) {
      if (path.includes(index)) {
        path = path.slice(0, path.indexOf(index));
      } else if (path.length === 0 || neighbors(path[path.length - 1], index)) {
        path.push(index);
      } else {
        message.textContent = "Pick a neighboring tile.";
      }
      sumText.textContent = String(pathSum());
      renderGrid();
    }

    function submitPath() {
      const sum = pathSum();
      if (sum === target && path.length > 1) {
        score += path.length;
        message.textContent = `Matched ${target}. New target ready.`;
        scoreText.textContent = String(score);
        tiles = tiles.map((value, index) => path.includes(index) ? Math.floor(Math.random() * 9) + 1 : value);
        path = [];
        makeTarget();
      } else {
        score = Math.max(0, score - 1);
        scoreText.textContent = String(score);
        message.textContent = `Need ${target}, not ${sum}.`;
      }
      sumText.textContent = String(pathSum());
      renderGrid();
    }

    function renderGrid() {
      grid.innerHTML = "";
      tiles.forEach((value, index) => {
        const button = document.createElement("button");
        const selected = path.includes(index);
        button.className = [
          "flex aspect-square items-center justify-center rounded text-3xl font-bold shadow transition",
          selected ? "bg-lime-300 text-cyan-950 ring-4 ring-white" : "bg-cyan-800 text-cyan-50 hover:bg-cyan-700"
        ].join(" ");
        button.textContent = String(value);
        button.addEventListener("click", () => pickTile(index));
        grid.appendChild(button);
      });
      submitBtn.disabled = path.length === 0;
      clearBtn.disabled = path.length === 0;
      [submitBtn, clearBtn].forEach((button) => button.classList.toggle("opacity-50", button.disabled));
    }

    function newGame() {
      tiles = Array.from({ length: size * size }, () => Math.floor(Math.random() * 9) + 1);
      path = [];
      score = 0;
      scoreText.textContent = "0";
      sumText.textContent = "0";
      message.textContent = "Start a path.";
      makeTarget();
      renderGrid();
    }

    submitBtn.addEventListener("click", submitPath);
    clearBtn.addEventListener("click", () => {
      path = [];
      sumText.textContent = "0";
      message.textContent = "Path cleared.";
      renderGrid();
    });
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
