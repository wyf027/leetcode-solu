<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Kangaroo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-950 text-sky-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center gap-4 p-4">
    <section class="w-full rounded-lg border border-orange-300/40 bg-sky-900 p-4 shadow-2xl shadow-black/40">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal text-orange-200">Mini Kangaroo</h1>
          <p class="text-sm text-sky-100">Climb the platforms, collect fruit, and reach the top cage.</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-sky-700 px-3 py-2">
            <div class="text-sky-200">Score</div>
            <div id="score" class="text-lg font-bold text-lime-200">0</div>
          </div>
          <div class="rounded border border-sky-700 px-3 py-2">
            <div class="text-sky-200">Lives</div>
            <div id="lives" class="text-lg font-bold text-rose-200">3</div>
          </div>
          <div class="rounded border border-sky-700 px-3 py-2">
            <div class="text-sky-200">Fruit</div>
            <div id="fruit" class="text-lg font-bold text-orange-100">0/6</div>
          </div>
        </div>
      </div>

      <canvas id="game" width="900" height="520" class="h-auto w-full rounded border border-sky-700 bg-slate-950"></canvas>

      <div class="mt-3 flex flex-wrap items-center justify-between gap-3 text-sm text-sky-100">
        <div>Arrow keys or WASD move. Space jumps. Enter restarts.</div>
        <button id="restart" class="rounded bg-orange-300 px-4 py-2 font-semibold text-sky-950 hover:bg-orange-200">Restart</button>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const fruitEl = document.getElementById("fruit");
    const restartBtn = document.getElementById("restart");
    const keys = new Set();

    const platforms = [
      { x: 58, y: 430, w: 790 },
      { x: 122, y: 344, w: 270 },
      { x: 508, y: 344, w: 270 },
      { x: 74, y: 258, w: 306 },
      { x: 494, y: 258, w: 306 },
      { x: 156, y: 172, w: 588 },
      { x: 314, y: 94, w: 272 }
    ];
    const ladders = [
      { x: 205, y: 344, h: 86 },
      { x: 630, y: 344, h: 86 },
      { x: 318, y: 258, h: 86 },
      { x: 548, y: 258, h: 86 },
      { x: 448, y: 172, h: 86 },
      { x: 452, y: 94, h: 78 }
    ];

    const state = {
      score: 0,
      lives: 3,
      collected: 0,
      player: null,
      fruit: [],
      hazards: [],
      throwTimer: 0,
      message: "Reach the top cage",
      messageTimer: 1400,
      over: false,
      won: false,
      lastTime: 0
    };

    function setupGame() {
      state.score = 0;
      state.lives = 3;
      state.collected = 0;
      state.player = { x: 92, y: 398, vy: 0, onLadder: false, grounded: true };
      state.fruit = makeFruit();
      state.hazards = [];
      state.throwTimer = 850;
      state.message = "Reach the top cage";
      state.messageTimer = 1400;
      state.over = false;
      state.won = false;
      state.lastTime = performance.now();
      updateHud();
      requestAnimationFrame(tick);
    }

    function makeFruit() {
      return [
        { x: 265, y: 314, kind: "apple", taken: false },
        { x: 590, y: 314, kind: "pear", taken: false },
        { x: 168, y: 228, kind: "apple", taken: false },
        { x: 715, y: 228, kind: "pear", taken: false },
        { x: 238, y: 142, kind: "apple", taken: false },
        { x: 652, y: 142, kind: "pear", taken: false }
      ];
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
      fruitEl.textContent = `${state.collected}/6`;
    }

    function nearestPlatformY(x, y) {
      let best = null;
      for (const platform of platforms) {
        if (x >= platform.x - 14 && x <= platform.x + platform.w + 14 && y <= platform.y + 18) {
          if (!best || Math.abs(platform.y - y) < Math.abs(best - y)) best = platform.y;
        }
      }
      return best;
    }

    function nearLadder(x, y) {
      return ladders.find((ladder) => Math.abs(x - ladder.x) < 24 && y >= ladder.y - 12 && y <= ladder.y + ladder.h + 16);
    }

    function jump() {
      if (state.over) {
        setupGame();
        return;
      }
      if (state.player.grounded || state.player.onLadder) {
        state.player.vy = -405;
        state.player.grounded = false;
        state.player.onLadder = false;
      }
    }

    function updatePlayer(delta) {
      const seconds = delta / 1000;
      const p = state.player;
      const horizontal = (keys.has("ArrowRight") || keys.has("d") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("a") ? 1 : 0);
      const vertical = (keys.has("ArrowDown") || keys.has("s") ? 1 : 0) - (keys.has("ArrowUp") || keys.has("w") ? 1 : 0);
      const ladder = nearLadder(p.x, p.y);
      p.onLadder = Boolean(ladder && vertical !== 0);

      p.x += horizontal * 185 * seconds;
      if (p.onLadder) {
        p.y += vertical * 145 * seconds;
        p.vy = 0;
        p.grounded = false;
        p.x += (ladder.x - p.x) * 0.12;
      } else {
        p.vy += 760 * seconds;
        p.y += p.vy * seconds;
      }

      const floor = nearestPlatformY(p.x, p.y + 28);
      if (floor && p.y + 28 >= floor && p.vy >= 0 && !p.onLadder) {
        p.y = floor - 28;
        p.vy = 0;
        p.grounded = true;
      }

      p.x = clamp(p.x, 45, 855);
      p.y = clamp(p.y, 66, 440);
      if (p.x > 388 && p.x < 512 && p.y < 120) winGame();
    }

    function spawnHazard() {
      const fromLeft = Math.random() < 0.5;
      const lanes = [137, 222, 308, 394];
      state.hazards.push({
        x: fromLeft ? 20 : 880,
        y: lanes[Math.floor(Math.random() * lanes.length)],
        vx: fromLeft ? 165 : -165,
        spin: 0
      });
    }

    function updateHazards(delta) {
      const seconds = delta / 1000;
      state.throwTimer -= delta;
      if (state.throwTimer <= 0) {
        spawnHazard();
        state.throwTimer = Math.max(420, 1050 - state.score / 22) + Math.random() * 480;
      }
      for (const hazard of state.hazards) {
        hazard.x += hazard.vx * seconds;
        hazard.spin += seconds * 8;
      }
      state.hazards = state.hazards.filter((hazard) => hazard.x > -40 && hazard.x < 940);
    }

    function collectFruit() {
      for (const item of state.fruit) {
        if (!item.taken && Math.hypot(state.player.x - item.x, state.player.y - item.y) < 32) {
          item.taken = true;
          state.collected += 1;
          state.score += 120;
          state.message = "Fruit collected";
          state.messageTimer = 700;
          updateHud();
        }
      }
    }

    function checkHazardHits() {
      const playerBox = { x: state.player.x - 15, y: state.player.y - 30, w: 30, h: 54 };
      for (const hazard of state.hazards) {
        if (intersects(playerBox, { x: hazard.x - 13, y: hazard.y - 13, w: 26, h: 26 })) {
          loseLife();
          return;
        }
      }
    }

    function loseLife() {
      state.lives -= 1;
      state.message = "Hit by a thrown apple";
      state.messageTimer = 1000;
      state.player = { x: 92, y: 398, vy: 0, onLadder: false, grounded: true };
      state.hazards = [];
      if (state.lives <= 0) {
        state.over = true;
        state.won = false;
        state.message = "Try again - press Enter";
      }
      updateHud();
    }

    function winGame() {
      if (state.over) return;
      state.score += 500 + state.collected * 80;
      state.over = true;
      state.won = true;
      state.message = "Top cage reached";
      updateHud();
    }

    function drawStage() {
      ctx.fillStyle = "#082f49";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      for (let i = 0; i < 18; i += 1) {
        ctx.fillRect((i * 71) % 900, 78 + ((i * 53) % 300), 38, 14);
      }

      ctx.strokeStyle = "#fb923c";
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      for (const platform of platforms) {
        ctx.beginPath();
        ctx.moveTo(platform.x, platform.y);
        ctx.lineTo(platform.x + platform.w, platform.y);
        ctx.stroke();
      }

      ctx.strokeStyle = "#fde68a";
      ctx.lineWidth = 4;
      for (const ladder of ladders) {
        ctx.beginPath();
        ctx.moveTo(ladder.x - 15, ladder.y);
        ctx.lineTo(ladder.x - 15, ladder.y + ladder.h);
        ctx.moveTo(ladder.x + 15, ladder.y);
        ctx.lineTo(ladder.x + 15, ladder.y + ladder.h);
        ctx.stroke();
        for (let y = ladder.y + 12; y < ladder.y + ladder.h; y += 22) {
          ctx.beginPath();
          ctx.moveTo(ladder.x - 16, y);
          ctx.lineTo(ladder.x + 16, y);
          ctx.stroke();
        }
      }

      ctx.fillStyle = "#64748b";
      ctx.fillRect(392, 48, 116, 42);
      ctx.strokeStyle = "#cbd5e1";
      ctx.lineWidth = 3;
      for (let x = 404; x < 500; x += 18) {
        ctx.beginPath();
        ctx.moveTo(x, 48);
        ctx.lineTo(x, 90);
        ctx.stroke();
      }

      ctx.fillStyle = "#ffedd5";
      ctx.font = "bold 22px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(state.messageTimer > 0 || state.over ? state.message : "Climb to the cage", canvas.width / 2, 34);
    }

    function drawFruit() {
      for (const item of state.fruit) {
        if (item.taken) continue;
        ctx.fillStyle = item.kind === "apple" ? "#ef4444" : "#facc15";
        ctx.beginPath();
        ctx.arc(item.x, item.y, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#22c55e";
        ctx.fillRect(item.x + 2, item.y - 18, 8, 6);
      }
    }

    function drawHazards() {
      for (const hazard of state.hazards) {
        ctx.save();
        ctx.translate(hazard.x, hazard.y);
        ctx.rotate(hazard.spin);
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(0, 0, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#7c2d12";
        ctx.fillRect(-5, -2, 10, 4);
        ctx.restore();
      }
    }

    function drawPlayer() {
      const p = state.player;
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(p.x, p.y - 33, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fb923c";
      ctx.fillRect(p.x - 14, p.y - 22, 28, 34);
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.arc(p.x - 22, p.y + 7, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fed7aa";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.x - 10, p.y + 9);
      ctx.lineTo(p.x - 25, p.y + 28);
      ctx.moveTo(p.x + 10, p.y + 9);
      ctx.lineTo(p.x + 25, p.y + 28);
      ctx.stroke();
    }

    function drawOverlay() {
      if (!state.over) return;
      ctx.fillStyle = "rgba(7, 89, 133, 0.84)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffedd5";
      ctx.font = "bold 42px ui-sans-serif, system-ui";
      ctx.textAlign = "center";
      ctx.fillText(state.won ? "Cage Reached" : "Run Over", canvas.width / 2, 238);
      ctx.font = "22px ui-sans-serif, system-ui";
      ctx.fillText("Press Enter or Restart", canvas.width / 2, 278);
    }

    function draw() {
      drawStage();
      drawFruit();
      drawHazards();
      drawPlayer();
      drawOverlay();
    }

    function tick(now) {
      const delta = Math.min(60, now - state.lastTime);
      state.lastTime = now;
      if (!state.over) {
        updatePlayer(delta);
        updateHazards(delta);
        collectFruit();
        checkHazardHits();
        state.messageTimer = Math.max(0, state.messageTimer - delta);
      }
      draw();
      requestAnimationFrame(tick);
    }

    function intersects(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    document.addEventListener("keydown", (event) => {
      keys.add(event.key);
      keys.add(event.key.toLowerCase());
      if (event.key === " ") jump();
      if (event.key === "Enter") setupGame();
    });

    document.addEventListener("keyup", (event) => {
      keys.delete(event.key);
      keys.delete(event.key.toLowerCase());
    });

    canvas.addEventListener("click", jump);
    restartBtn.addEventListener("click", setupGame);
    setupGame();
  </script>
</body>
</html>
