<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Slant</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-950 text-gray-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-6 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-gray-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-orange-300">Classic Logic Puzzle</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Slant</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="resetBtn" class="rounded-md bg-orange-300 px-4 py-2 text-sm font-semibold text-gray-950 hover:bg-orange-200">
            重新开始
          </button>
          <button id="hintBtn" class="rounded-md border border-gray-600 px-4 py-2 text-sm font-semibold text-gray-100 hover:bg-gray-800">
            提示
          </button>
        </div>
      </header>

      <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div class="rounded-lg border border-gray-800 bg-gray-900/80 p-4 shadow-2xl shadow-black/30">
          <div id="board" class="relative mx-auto aspect-square w-full max-w-[32rem] rounded-md border-4 border-gray-100 bg-gray-100"></div>
        </div>

        <aside class="space-y-4">
          <div class="rounded-lg border border-gray-800 bg-gray-900 p-4">
            <h2 class="text-lg font-semibold text-white">目标</h2>
            <p class="mt-2 text-sm leading-6 text-gray-300">
              每个格子放置一条斜线。顶点数字表示接触该点的斜线数量，且斜线不能形成任何闭合回路。
            </p>
          </div>

          <div class="rounded-lg border border-gray-800 bg-gray-900 p-4">
            <h2 class="text-lg font-semibold text-white">检查</h2>
            <ul class="mt-3 space-y-2 text-sm">
              <li id="clueStatus" class="rounded-md bg-gray-800 px-3 py-2 text-gray-300">数字：等待检查</li>
              <li id="loopStatus" class="rounded-md bg-gray-800 px-3 py-2 text-gray-300">回路：等待检查</li>
            </ul>
          </div>

          <div id="message" class="rounded-lg border border-orange-300/30 bg-orange-300/10 p-4 text-sm leading-6 text-orange-100">
            点击格子循环空白、/、\。
          </div>
        </aside>
      </section>
    </main>

    <script>
      const board = document.getElementById("board");
      const resetBtn = document.getElementById("resetBtn");
      const hintBtn = document.getElementById("hintBtn");
      const message = document.getElementById("message");
      const clueStatus = document.getElementById("clueStatus");
      const loopStatus = document.getElementById("loopStatus");

      const size = 4;
      const clues = {
        "0,0": 1,
        "0,2": 2,
        "1,4": 1,
        "2,0": 2,
        "3,4": 2,
        "4,1": 1,
        "4,3": 2,
      };
      const solution = {
        "0,0": "/",
        "0,1": "\\",
        "0,2": "/",
        "0,3": "\\",
        "1,0": "\\",
        "1,1": "/",
        "1,2": "\\",
        "1,3": "/",
        "2,0": "/",
        "2,1": "\\",
        "2,2": "/",
        "2,3": "\\",
        "3,0": "\\",
        "3,1": "/",
        "3,2": "\\",
        "3,3": "/",
      };
      const slants = new Map();
      const buttons = [];
      const states = ["", "/", "\\"];

      function keyOf(row, col) {
        return `${row},${col}`;
      }

      function edgeFor(row, col, mark) {
        if (mark === "/") return [keyOf(row + 1, col), keyOf(row, col + 1)];
        if (mark === "\\") return [keyOf(row, col), keyOf(row + 1, col + 1)];
        return null;
      }

      function clueReport() {
        const counts = {};
        for (let row = 0; row <= size; row += 1) {
          for (let col = 0; col <= size; col += 1) counts[keyOf(row, col)] = 0;
        }
        slants.forEach((mark, key) => {
          const [row, col] = key.split(",").map(Number);
          const edge = edgeFor(row, col, mark);
          if (edge) edge.forEach((point) => (counts[point] += 1));
        });
        const bad = Object.entries(clues).filter(([key, target]) => counts[key] !== target).map(([key]) => key);
        return { bad, clear: bad.length === 0, counts };
      }

      function loopReport() {
        const parent = {};
        const badEdges = new Set();
        const find = (x) => {
          parent[x] = parent[x] || x;
          if (parent[x] !== x) parent[x] = find(parent[x]);
          return parent[x];
        };
        const union = (a, b, key) => {
          const rootA = find(a);
          const rootB = find(b);
          if (rootA === rootB) badEdges.add(key);
          else parent[rootA] = rootB;
        };
        slants.forEach((mark, key) => {
          const [row, col] = key.split(",").map(Number);
          const edge = edgeFor(row, col, mark);
          if (edge) union(edge[0], edge[1], key);
        });
        return { badEdges, clear: badEdges.size === 0 };
      }

      function setStatus(element, label, state) {
        element.className = "rounded-md px-3 py-2 text-sm";
        if (state === "ok") element.classList.add("bg-emerald-500/15", "text-emerald-200");
        if (state === "warn") element.classList.add("bg-amber-500/15", "text-amber-200");
        if (state === "bad") element.classList.add("bg-rose-500/15", "text-rose-200");
        element.textContent = label;
      }

      function render() {
        const clue = clueReport();
        const loop = loopReport();
        buttons.forEach((button) => {
          const key = button.dataset.key;
          const mark = slants.get(key) || "";
          button.textContent = mark;
          button.classList.toggle("text-rose-600", loop.badEdges.has(key));
          button.classList.toggle("ring-4", loop.badEdges.has(key));
          button.classList.toggle("ring-rose-400", loop.badEdges.has(key));
        });
        document.querySelectorAll("[data-dot]").forEach((dot) => {
          const key = dot.dataset.dot;
          dot.classList.toggle("bg-rose-500", clue.bad.includes(key));
          dot.classList.toggle("bg-gray-950", !clue.bad.includes(key));
        });
        setStatus(clueStatus, clue.clear ? "数字：全部匹配" : "数字：存在不匹配", clue.clear ? "ok" : "bad");
        setStatus(loopStatus, loop.clear ? "回路：无闭环" : "回路：存在闭合回路", loop.clear ? "ok" : "bad");
        const filled = slants.size;
        const solved = clue.clear && loop.clear && filled === size * size;
        message.textContent = solved ? "完成！数字约束满足且没有闭合回路。" : `已放置 ${filled}/${size * size} 条斜线。`;
      }

      function buildBoard() {
        board.innerHTML = "";
        buttons.length = 0;
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            const button = document.createElement("button");
            button.type = "button";
            button.dataset.key = keyOf(row, col);
            button.className = "absolute flex items-center justify-center border border-gray-500 bg-gray-100 text-5xl font-light leading-none text-gray-950 focus:outline-none focus:ring-4 focus:ring-orange-300";
            button.style.left = `${(col / size) * 100}%`;
            button.style.top = `${(row / size) * 100}%`;
            button.style.width = `${100 / size}%`;
            button.style.height = `${100 / size}%`;
            button.addEventListener("click", () => {
              const current = slants.get(button.dataset.key) || "";
              const next = states[(states.indexOf(current) + 1) % states.length];
              next ? slants.set(button.dataset.key, next) : slants.delete(button.dataset.key);
              render();
            });
            board.appendChild(button);
            buttons.push(button);
          }
        }
        for (let row = 0; row <= size; row += 1) {
          for (let col = 0; col <= size; col += 1) {
            const dot = document.createElement("div");
            const key = keyOf(row, col);
            dot.dataset.dot = key;
            dot.className = "absolute z-10 flex h-7 w-7 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-gray-950 text-xs font-bold text-white";
            dot.style.left = `${(col / size) * 100}%`;
            dot.style.top = `${(row / size) * 100}%`;
            dot.textContent = clues[key] ?? "";
            board.appendChild(dot);
          }
        }
      }

      resetBtn.addEventListener("click", () => {
        slants.clear();
        render();
      });

      hintBtn.addEventListener("click", () => {
        const next = Object.keys(solution).find((key) => !slants.has(key));
        if (next) slants.set(next, solution[next]);
        render();
      });

      buildBoard();
      render();
    </script>
  </body>
</html>
