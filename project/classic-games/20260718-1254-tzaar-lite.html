<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini TZAAR</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-zinc-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Mini TZAAR</h1>
        <p class="mt-1 text-sm text-zinc-400">先吃一枚相邻敌子，再可选择叠一枚己子；无子可吃的一方失败。</p>
      </div>
      <button id="resetBtn" class="rounded bg-amber-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-amber-300">重新开始</button>
    </header>

    <section class="grid gap-4 md:grid-cols-[1fr_260px]">
      <div class="rounded border border-zinc-800 bg-zinc-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-5 gap-2"></div>
      </div>

      <aside class="space-y-3 rounded border border-zinc-800 bg-zinc-900 p-4">
        <div>
          <p class="text-xs uppercase text-zinc-500">当前回合</p>
          <p id="turnText" class="text-xl font-bold"></p>
        </div>
        <div>
          <p class="text-xs uppercase text-zinc-500">阶段</p>
          <p id="phaseText" class="font-semibold text-amber-300"></p>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="rounded bg-zinc-800 p-3">
            <p class="text-zinc-400">白方棋数</p>
            <p id="whiteCount" class="text-2xl font-bold"></p>
          </div>
          <div class="rounded bg-zinc-800 p-3">
            <p class="text-zinc-400">黑方棋数</p>
            <p id="blackCount" class="text-2xl font-bold"></p>
          </div>
        </div>
        <button id="skipBtn" class="w-full rounded bg-zinc-700 px-3 py-2 text-sm font-semibold hover:bg-zinc-600">跳过叠子</button>
        <p id="message" class="min-h-12 rounded bg-zinc-950 p-3 text-sm text-zinc-300"></p>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const phaseText = document.getElementById("phaseText");
    const whiteCount = document.getElementById("whiteCount");
    const blackCount = document.getElementById("blackCount");
    const message = document.getElementById("message");
    const skipBtn = document.getElementById("skipBtn");
    const resetBtn = document.getElementById("resetBtn");
    const players = {
      W: { name: "白方", stone: "bg-zinc-100 text-zinc-950", ring: "ring-amber-300" },
      B: { name: "黑方", stone: "bg-zinc-800 text-zinc-100", ring: "ring-amber-300" }
    };
    let board;
    let turn;
    let phase;
    let selected;
    let gameOver;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(null));
      const layout = [
        "WBWBW",
        "BWBWB",
        "WB.BW",
        "BWBWB",
        "WBWBW"
      ];
      layout.forEach((row, r) => row.split("").forEach((cell, c) => {
        if (cell !== ".") board[r][c] = { owner: cell, height: 1 };
      }));
      turn = "W";
      phase = "capture";
      selected = null;
      gameOver = false;
      render();
    }

    function inBounds(r, c) {
      return r >= 0 && r < size && c >= 0 && c < size;
    }

    function neighbors(r, c) {
      return [[1, 0], [-1, 0], [0, 1], [0, -1], [1, 1], [-1, -1]]
        .map(([dr, dc]) => [r + dr, c + dc])
        .filter(([nr, nc]) => inBounds(nr, nc));
    }

    function pieceCounts() {
      return board.flat().reduce((acc, cell) => {
        if (cell) acc[cell.owner] += 1;
        return acc;
      }, { W: 0, B: 0 });
    }

    function captureMoves(player = turn) {
      const moves = [];
      board.forEach((row, r) => row.forEach((cell, c) => {
        if (!cell || cell.owner !== player) return;
        neighbors(r, c).forEach(([nr, nc]) => {
          const target = board[nr][nc];
          if (target && target.owner !== player) moves.push({ from: [r, c], to: [nr, nc] });
        });
      }));
      return moves;
    }

    function stackMoves(player = turn) {
      const moves = [];
      board.forEach((row, r) => row.forEach((cell, c) => {
        if (!cell || cell.owner !== player) return;
        neighbors(r, c).forEach(([nr, nc]) => {
          const target = board[nr][nc];
          if (target && target.owner === player) moves.push({ from: [r, c], to: [nr, nc] });
        });
      }));
      return moves;
    }

    function canMove(from, to) {
      const source = board[from[0]][from[1]];
      const target = board[to[0]][to[1]];
      if (!source || !target || source.owner !== turn) return false;
      const legal = phase === "capture"
        ? target.owner !== turn
        : target.owner === turn;
      return legal && neighbors(from[0], from[1]).some(([r, c]) => r === to[0] && c === to[1]);
    }

    function applyMove(from, to) {
      const source = board[from[0]][from[1]];
      const target = board[to[0]][to[1]];
      board[to[0]][to[1]] = {
        owner: source.owner,
        height: phase === "capture" ? source.height : source.height + target.height
      };
      board[from[0]][from[1]] = null;
      selected = null;
      if (phase === "capture") {
        phase = "stack";
        message.textContent = `${players[turn].name} 已吃子，可选择叠一枚己子，或跳过叠子。`;
      } else {
        endTurn();
      }
      checkGame();
      render();
    }

    function endTurn() {
      turn = turn === "W" ? "B" : "W";
      phase = "capture";
      selected = null;
      message.textContent = `${players[turn].name} 行动：请选择一枚己子吃掉相邻敌子。`;
    }

    function checkGame() {
      const counts = pieceCounts();
      if (counts.W === 0 || counts.B === 0) {
        gameOver = true;
        message.textContent = `${counts.W === 0 ? "黑方" : "白方"} 获胜。`;
        return;
      }
      if (phase === "capture" && captureMoves(turn).length === 0) {
        gameOver = true;
        message.textContent = `${players[turn].name} 无法吃子，${players[turn === "W" ? "B" : "W"].name} 获胜。`;
      }
    }

    function handleCell(r, c) {
      if (gameOver) return;
      const cell = board[r][c];
      if (!selected) {
        if (!cell || cell.owner !== turn) return;
        const moves = phase === "capture" ? captureMoves(turn) : stackMoves(turn);
        if (!moves.some(move => move.from[0] === r && move.from[1] === c)) {
          message.textContent = "这枚棋子当前没有合法目标。";
          return;
        }
        selected = [r, c];
        render();
        return;
      }
      if (selected[0] === r && selected[1] === c) {
        selected = null;
        render();
        return;
      }
      if (canMove(selected, [r, c])) {
        applyMove(selected, [r, c]);
      } else {
        message.textContent = phase === "capture" ? "吃子阶段只能移到相邻敌子上。" : "叠子阶段只能移到相邻己子上。";
      }
    }

    function render() {
      const counts = pieceCounts();
      boardEl.innerHTML = "";
      board.forEach((row, r) => row.forEach((cell, c) => {
        const button = document.createElement("button");
        const dark = (r + c) % 2 === 0;
        const isSelected = selected && selected[0] === r && selected[1] === c;
        button.className = `relative flex aspect-square items-center justify-center rounded border text-lg font-bold transition ${dark ? "border-zinc-700 bg-zinc-800" : "border-zinc-800 bg-zinc-700"} ${isSelected ? "ring-4 ring-amber-300" : "hover:border-amber-300"}`;
        button.setAttribute("aria-label", `row ${r + 1} column ${c + 1}`);
        if (cell) {
          const stone = document.createElement("span");
          stone.className = `flex h-12 w-12 items-center justify-center rounded-full shadow ${players[cell.owner].stone}`;
          stone.textContent = cell.height;
          button.appendChild(stone);
        }
        button.addEventListener("click", () => handleCell(r, c));
        boardEl.appendChild(button);
      }));
      turnText.textContent = players[turn].name;
      phaseText.textContent = phase === "capture" ? "吃子" : "叠子";
      whiteCount.textContent = counts.W;
      blackCount.textContent = counts.B;
      skipBtn.disabled = gameOver || phase !== "stack";
      skipBtn.classList.toggle("opacity-40", skipBtn.disabled);
      if (!message.textContent) message.textContent = "白方先手：选择一枚白子，吃掉相邻黑子。";
    }

    skipBtn.addEventListener("click", () => {
      if (phase === "stack" && !gameOver) {
        endTurn();
        checkGame();
        render();
      }
    });
    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
