<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini SOS Game</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-cyan-950 text-cyan-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini SOS Game</h1><p class="text-sm text-cyan-200">Place S or O. Every new SOS line scores a point.</p></div><button id="newGameBtn" class="rounded bg-yellow-300 px-4 py-2 font-semibold text-cyan-950 hover:bg-yellow-200">New Game</button></header><section class="grid gap-3 rounded border border-cyan-700 bg-cyan-900 p-3 sm:grid-cols-4"><div>Turn: <b id="turnLabel">Blue</b></div><div>Blue: <b id="blueScore">0</b></div><div>Gold: <b id="goldScore">0</b></div><div id="message">Choose a letter, then an empty square.</div></section><section class="flex flex-wrap items-center justify-center gap-3"><button id="sBtn" class="rounded bg-white px-5 py-2 font-bold text-cyan-950 ring-2 ring-yellow-300">S</button><button id="oBtn" class="rounded bg-cyan-700 px-5 py-2 font-bold text-white">O</button></section><section id="board" class="mx-auto grid aspect-square w-full max-w-lg grid-cols-5 grid-rows-5 gap-2 rounded border border-cyan-700 bg-cyan-800 p-3"></section></main><script>
const size=5,dirs=[[1,0],[0,1],[1,1],[1,-1]];let board,turn,letter,scores,over;const el=id=>document.getElementById(id),boardEl=el('board'),turnLabel=el('turnLabel'),blueScore=el('blueScore'),goldScore=el('goldScore'),message=el('message'),newGameBtn=el('newGameBtn'),sBtn=el('sBtn'),oBtn=el('oBtn');function idx(r,c){return r*size+c}function at(r,c){return r<0||c<0||r>=size||c>=size?'':board[idx(r,c)]}function name(p){return p==='B'?'Blue':'Gold'}function countNewSOS(r,c){let total=0;for(const[dR,dC]of dirs){for(const offset of[-2,-1,0]){let word='';for(let k=0;k<3;k++)word+=at(r+(offset+k)*dR,c+(offset+k)*dC);if(word==='SOS')total++}}return total}function setLetter(x){letter=x;sBtn.className='rounded px-5 py-2 font-bold '+(letter==='S'?'bg-white text-cyan-950 ring-2 ring-yellow-300':'bg-cyan-700 text-white');oBtn.className='rounded px-5 py-2 font-bold '+(letter==='O'?'bg-white text-cyan-950 ring-2 ring-yellow-300':'bg-cyan-700 text-white')}function handleCell(i){if(over||board[i])return;board[i]=letter;const r=Math.floor(i/size),c=i%size,score=countNewSOS(r,c);if(score){scores[turn]+=score;message.textContent=`${name(turn)} scored ${score}.`}else{turn=turn==='B'?'G':'B';message.textContent='No score. Next player.'}if(board.every(Boolean)){over=true;message.textContent=scores.B===scores.G?'Draw.':`${scores.B>scores.G?'Blue':'Gold'} wins.`}render()}function render(){turnLabel.textContent=name(turn);blueScore.textContent=scores.B;goldScore.textContent=scores.G;boardEl.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.className='rounded border border-cyan-600 bg-cyan-100 text-3xl font-bold text-cyan-950 hover:bg-white disabled:hover:bg-cyan-100';b.textContent=v;b.disabled=!!v||over;b.onclick=()=>handleCell(i);boardEl.appendChild(b)})}function newGame(){board=Array(size*size).fill('');turn='B';letter='S';scores={B:0,G:0};over=false;message.textContent='Choose a letter, then an empty square.';setLetter('S');render()}sBtn.addEventListener('click',()=>setLetter('S'));oBtn.addEventListener('click',()=>setLetter('O'));newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
