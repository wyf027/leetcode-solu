<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Hare and Hounds</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-emerald-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-wide text-amber-300">Classic Game</p>
        <h1 class="text-3xl font-bold">Mini Hare and Hounds</h1>
      </div>
      <button id="resetBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-semibold text-emerald-950 hover:bg-amber-200">
        重新开始
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
      <div class="rounded border border-emerald-800 bg-emerald-900 p-4">
        <div id="board" class="relative mx-auto aspect-[4/3] w-full max-w-2xl">
          <svg viewBox="0 0 100 75" class="absolute inset-0 h-full w-full" aria-hidden="true">
            <g stroke="rgb(16 185 129)" stroke-width="1.3" opacity="0.75">
              <line x1="6" y1="37" x2="25" y2="15" />
              <line x1="6" y1="37" x2="25" y2="37" />
              <line x1="6" y1="37" x2="25" y2="60" />
              <line x1="25" y1="15" x2="48" y2="15" />
              <line x1="25" y1="37" x2="48" y2="37" />
              <line x1="25" y1="60" x2="48" y2="60" />
              <line x1="25" y1="15" x2="48" y2="37" />
              <line x1="25" y1="60" x2="48" y2="37" />
              <line x1="48" y1="15" x2="71" y2="15" />
              <line x1="48" y1="37" x2="71" y2="37" />
              <line x1="48" y1="60" x2="71" y2="60" />
              <line x1="48" y1="15" x2="71" y2="37" />
              <line x1="48" y1="60" x2="71" y2="37" />
              <line x1="71" y1="15" x2="94" y2="37" />
              <line x1="71" y1="37" x2="94" y2="37" />
              <line x1="71" y1="60" x2="94" y2="37" />
            </g>
          </svg>
        </div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-emerald-800 bg-emerald-900 p-4">
          <div class="mb-3 flex items-center justify-between">
            <span class="text-sm text-emerald-300">当前阵营</span>
            <span id="turnBadge" class="rounded px-3 py-1 text-sm font-bold"></span>
          </div>
          <p id="statusText" class="min-h-20 text-sm leading-6 text-emerald-100"></p>
        </div>

        <div class="rounded border border-emerald-800 bg-emerald-900 p-4">
          <p class="text-xs text-emerald-300">兔子向左逃脱进度</p>
          <p id="progressText" class="mt-1 text-3xl font-bold text-amber-300">0</p>
        </div>

        <div class="rounded border border-emerald-800 bg-emerald-900 p-4 text-sm leading-6 text-emerald-100">
          <p>猎犬只能向右、竖向或斜向前进，不能后退。兔子可以沿线任意方向移动。</p>
          <p class="mt-2">兔子越过全部猎犬获胜；猎犬困住兔子获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const turnBadge = document.getElementById("turnBadge");
    const statusText = document.getElementById("statusText");
    const progressText = document.getElementById("progressText");
    const resetBtn = document.getElementById("resetBtn");

    const points = [
      { x: 6, y: 37 },
      { x: 25, y: 15 }, { x: 25, y: 37 }, { x: 25, y: 60 },
      { x: 48, y: 15 }, { x: 48, y: 37 }, { x: 48, y: 60 },
      { x: 71, y: 15 }, { x: 71, y: 37 }, { x: 71, y: 60 },
      { x: 94, y: 37 }
    ];
    const links = [
      [0, 1], [0, 2], [0, 3],
      [1, 4], [2, 5], [3, 6], [1, 5], [3, 5],
      [4, 7], [5, 8], [6, 9], [4, 8], [6, 8],
      [7, 10], [8, 10], [9, 10]
    ];
    const side = {
      H: { label: "猎犬", badge: "bg-emerald-200 text-emerald-950", piece: "bg-emerald-200" },
      R: { label: "兔子", badge: "bg-amber-300 text-emerald-950", piece: "bg-amber-300" }
    };

    let pieces;
    let turn;
    let selected;
    let winner;

    function resetGame() {
      pieces = { hounds: [0, 1, 3], hare: 10 };
      turn = "H";
      selected = null;
      winner = "";
      render();
    }

    function occupiedAt(index) {
      if (pieces.hare === index) return "R";
      return pieces.hounds.includes(index) ? "H" : "";
    }

    function neighbors(index) {
      return links
        .filter(([a, b]) => a === index || b === index)
        .map(([a, b]) => (a === index ? b : a));
    }

    function houndMoves(index) {
      return neighbors(index).filter((next) => !occupiedAt(next) && points[next].x >= points[index].x);
    }

    function hareMoves() {
      return neighbors(pieces.hare).filter((next) => !occupiedAt(next));
    }

    function legalMoves(index) {
      if (occupiedAt(index) === "R") return hareMoves();
      if (occupiedAt(index) === "H") return houndMoves(index);
      return [];
    }

    function checkWinner() {
      const leftMostHound = Math.min(...pieces.hounds.map((index) => points[index].x));
      if (points[pieces.hare].x < leftMostHound) {
        winner = "R";
      } else if (hareMoves().length === 0) {
        winner = "H";
      }
    }

    function movePiece(from, to) {
      const piece = occupiedAt(from);
      if (piece === "R") {
        pieces.hare = to;
      } else if (piece === "H") {
        pieces.hounds = pieces.hounds.map((index) => (index === from ? to : index));
      }
      selected = null;
      checkWinner();
      if (!winner) turn = turn === "H" ? "R" : "H";
      render();
    }

    function handlePoint(index) {
      if (winner) return;
      if (selected !== null) {
        if (selected === index) {
          selected = null;
          render();
          return;
        }
        if (legalMoves(selected).includes(index)) {
          movePiece(selected, index);
        }
        return;
      }
      if (occupiedAt(index) === turn && legalMoves(index).length > 0) {
        selected = index;
        render();
      }
    }

    function targetSet() {
      return selected === null ? [] : legalMoves(selected);
    }

    function statusMessage() {
      if (winner === "R") return "兔子越过猎犬防线，获得胜利。";
      if (winner === "H") return "猎犬困住兔子，获得胜利。";
      if (selected !== null) return `${side[turn].label}已选中，点击高亮交点移动。`;
      return `${side[turn].label}行动，选择一枚可移动棋子。`;
    }

    function render() {
      boardEl.querySelectorAll("button").forEach((button) => button.remove());
      const targets = targetSet();
      turnBadge.textContent = winner ? side[winner].label : side[turn].label;
      turnBadge.className = `rounded px-3 py-1 text-sm font-bold ${side[winner || turn].badge}`;
      statusText.textContent = statusMessage();
      progressText.textContent = Math.max(0, 4 - Math.round(points[pieces.hare].x / 25));

      points.forEach((point, index) => {
        const piece = occupiedAt(index);
        const active = selected === index;
        const target = targets.includes(index);
        const button = document.createElement("button");
        button.type = "button";
        button.setAttribute("aria-label", `point ${index + 1}`);
        button.className = [
          "absolute flex h-12 w-12 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border transition",
          "border-emerald-700 bg-emerald-950",
          active ? "border-amber-300 bg-amber-300/20" : "",
          target ? "border-cyan-200 bg-cyan-300/20" : "",
          !winner ? "hover:border-amber-200" : "opacity-80"
        ].join(" ");
        button.style.left = `${point.x}%`;
        button.style.top = `${point.y}%`;
        button.addEventListener("click", () => handlePoint(index));

        const marker = document.createElement("span");
        marker.className = piece
          ? `block h-7 w-7 rounded-full shadow ${side[piece].piece}`
          : "block h-2 w-2 rounded-full bg-emerald-700";
        button.appendChild(marker);
        boardEl.appendChild(button);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
