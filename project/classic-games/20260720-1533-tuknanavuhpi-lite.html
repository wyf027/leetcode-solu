<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Tuknanavuhpi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 md:px-8">
    <header class="flex flex-col justify-between gap-3 border-b border-zinc-800 pb-4 md:flex-row md:items-end">
      <div>
        <p class="text-sm uppercase tracking-[0.28em] text-fuchsia-300">Classic Capture Game</p>
        <h1 class="mt-2 text-3xl font-semibold">Mini Tuknanavuhpi</h1>
      </div>
      <button id="resetBtn" class="rounded border border-fuchsia-300 px-4 py-2 text-sm font-semibold text-fuchsia-100 hover:bg-fuchsia-300 hover:text-zinc-950">
        重新开始
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="relative aspect-square w-full max-w-[600px] justify-self-center rounded border border-zinc-800 bg-zinc-900 shadow-2xl shadow-black/30">
        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 100 100" aria-hidden="true">
          <g id="lines" stroke="#a1a1aa" stroke-width="1.2" stroke-linecap="round"></g>
        </svg>
        <div id="board" class="absolute inset-0"></div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-xs uppercase tracking-[0.2em] text-zinc-400">当前回合</p>
          <p id="turnText" class="mt-2 text-xl font-semibold text-fuchsia-200"></p>
          <p id="message" class="mt-3 min-h-12 text-sm leading-6 text-zinc-300"></p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="rounded border border-zinc-800 bg-zinc-900 p-4">
            <p class="text-xs text-zinc-400">红方捕获</p>
            <p id="redText" class="mt-1 text-2xl font-semibold text-rose-200"></p>
          </div>
          <div class="rounded border border-zinc-800 bg-zinc-900 p-4">
            <p class="text-xs text-zinc-400">白方捕获</p>
            <p id="whiteText" class="mt-1 text-2xl font-semibold text-stone-100"></p>
          </div>
        </div>

        <div class="rounded border border-zinc-800 bg-zinc-900 p-4 text-sm leading-6 text-zinc-300">
          <p class="font-semibold text-zinc-100">规则</p>
          <p class="mt-2">双方轮流选择自己的棋子，沿线移动到相邻空点。</p>
          <p class="mt-2">也可以跳过相邻敌子落到同一直线空点，并吃掉被跳过的棋子。</p>
          <p class="mt-2">先捕获 4 枚敌子，或让对方无合法走法即可获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 4;
    const points = Array.from({ length: 16 }, (_, index) => ({
      x: 14 + (index % size) * 24,
      y: 14 + Math.floor(index / size) * 24
    }));

    const edges = [];
    for (let row = 0; row < size; row += 1) {
      for (let col = 0; col < size - 1; col += 1) edges.push([row * size + col, row * size + col + 1]);
    }
    for (let col = 0; col < size; col += 1) {
      for (let row = 0; row < size - 1; row += 1) edges.push([row * size + col, (row + 1) * size + col]);
    }
    [
      [0, 5], [5, 10], [10, 15],
      [3, 6], [6, 9], [9, 12],
      [1, 4], [2, 7], [8, 13], [11, 14]
    ].forEach((edge) => edges.push(edge));

    const boardEl = document.getElementById("board");
    const linesEl = document.getElementById("lines");
    const turnText = document.getElementById("turnText");
    const messageEl = document.getElementById("message");
    const redText = document.getElementById("redText");
    const whiteText = document.getElementById("whiteText");
    const resetBtn = document.getElementById("resetBtn");

    let board;
    let turn;
    let selected;
    let captures;
    let winner;

    function resetGame() {
      board = Array(16).fill("");
      [0, 1, 2, 3, 4, 7].forEach((index) => { board[index] = "R"; });
      [8, 11, 12, 13, 14, 15].forEach((index) => { board[index] = "W"; });
      turn = "R";
      selected = null;
      captures = { R: 0, W: 0 };
      winner = "";
      setMessage("红方先手：选择一枚棋子移动或跳吃。");
      render();
    }

    function rowOf(index) {
      return Math.floor(index / size);
    }

    function colOf(index) {
      return index % size;
    }

    function indexAt(row, col) {
      if (row < 0 || row >= size || col < 0 || col >= size) return -1;
      return row * size + col;
    }

    function playerName(player) {
      return player === "R" ? "红方" : "白方";
    }

    function other(player) {
      return player === "R" ? "W" : "R";
    }

    function neighbors(index) {
      return edges
        .filter(([a, b]) => a === index || b === index)
        .map(([a, b]) => (a === index ? b : a));
    }

    function directionBetween(a, b) {
      return [Math.sign(rowOf(b) - rowOf(a)), Math.sign(colOf(b) - colOf(a))];
    }

    function legalMoves(from) {
      const own = board[from];
      if (!own) return [];
      const enemy = other(own);
      const moves = [];

      neighbors(from).forEach((near) => {
        if (!board[near]) {
          moves.push({ from, to: near, capture: null });
          return;
        }
        if (board[near] !== enemy) return;
        const [dr, dc] = directionBetween(from, near);
        const landing = indexAt(rowOf(from) + dr * 2, colOf(from) + dc * 2);
        if (landing >= 0 && !board[landing] && neighbors(near).includes(landing)) {
          moves.push({ from, to: landing, capture: near });
        }
      });

      return moves;
    }

    function allMoves(player) {
      return board.flatMap((piece, index) => piece === player ? legalMoves(index) : []);
    }

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function handlePoint(index) {
      if (winner) return;

      if (selected === null) {
        if (board[index] !== turn) {
          setMessage(`请选择一枚${playerName(turn)}棋子。`);
          return;
        }
        selected = index;
        setMessage("选择相邻空点移动，或跳过敌子完成捕获。");
        render();
        return;
      }

      if (board[index] === turn) {
        selected = index;
        setMessage("已切换棋子，选择目标点。");
        render();
        return;
      }

      const move = legalMoves(selected).find((item) => item.to === index);
      if (!move) {
        setMessage("目标点不合法：只能沿线移动，或跳吃到同一直线空点。");
        return;
      }

      board[move.to] = board[move.from];
      board[move.from] = "";
      if (move.capture !== null) {
        board[move.capture] = "";
        captures[turn] += 1;
      }
      finishTurn();
    }

    function finishTurn() {
      const opponent = other(turn);
      if (captures[turn] >= 4) {
        winner = turn;
        selected = null;
        setMessage(`${playerName(turn)}捕获 4 枚敌子，获胜。`);
        render();
        return;
      }
      if (allMoves(opponent).length === 0) {
        winner = turn;
        selected = null;
        setMessage(`${playerName(opponent)}没有合法走法，${playerName(turn)}获胜。`);
        render();
        return;
      }

      turn = opponent;
      selected = null;
      setMessage(`${playerName(turn)}回合。`);
      render();
    }

    function renderLines() {
      linesEl.innerHTML = "";
      edges.forEach(([a, b]) => {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", points[a].x);
        line.setAttribute("y1", points[a].y);
        line.setAttribute("x2", points[b].x);
        line.setAttribute("y2", points[b].y);
        linesEl.appendChild(line);
      });
    }

    function render() {
      renderLines();
      boardEl.innerHTML = "";
      points.forEach((point, index) => {
        const piece = board[index];
        const button = document.createElement("button");
        const active = selected === index;
        button.type = "button";
        button.className = [
          "absolute flex h-12 w-12 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border text-base font-bold shadow transition",
          piece === "R" ? "border-rose-100 bg-rose-500 text-white" : "",
          piece === "W" ? "border-stone-100 bg-stone-100 text-zinc-950" : "",
          !piece ? "border-zinc-600 bg-zinc-800 text-zinc-500 hover:border-fuchsia-300 hover:bg-zinc-700" : "",
          active ? "ring-4 ring-fuchsia-300" : ""
        ].join(" ");
        button.style.left = `${point.x}%`;
        button.style.top = `${point.y}%`;
        button.textContent = piece || index + 1;
        button.setAttribute("aria-label", `point ${index + 1}`);
        button.addEventListener("click", () => handlePoint(index));
        boardEl.appendChild(button);
      });

      turnText.textContent = winner ? `${playerName(winner)} 获胜` : playerName(turn);
      redText.textContent = `${captures.R}/4`;
      whiteText.textContent = `${captures.W}/4`;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
