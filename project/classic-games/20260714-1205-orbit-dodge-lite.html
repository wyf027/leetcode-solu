<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Orbit Dodge</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-indigo-700 bg-indigo-900 p-5 shadow-2xl">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-widest text-pink-300">Classic Mini Game</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Orbit Dodge</h1>
          <p class="mt-2 text-sm text-indigo-200">Switch orbit lanes, dodge comets, and survive around the core.</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded-md bg-indigo-800 px-3 py-2">
            <div class="text-indigo-200">Score</div>
            <div id="score" class="text-xl font-bold text-white">0</div>
          </div>
          <div class="rounded-md bg-indigo-800 px-3 py-2">
            <div class="text-indigo-200">Best</div>
            <div id="best" class="text-xl font-bold text-white">0</div>
          </div>
          <div class="rounded-md bg-indigo-800 px-3 py-2">
            <div class="text-indigo-200">Lane</div>
            <div id="lane" class="text-xl font-bold text-white">1</div>
          </div>
        </div>
      </div>

      <div class="mt-6 overflow-hidden rounded-lg border border-indigo-700 bg-slate-950">
        <canvas id="game" width="640" height="420" class="block h-auto w-full touch-none"></canvas>
      </div>

      <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
        <p id="status" class="min-h-6 text-sm font-medium text-indigo-100">Use left/right, A/D, or tap to change orbit lanes.</p>
        <div class="flex gap-2">
          <button id="laneBtn" class="rounded-md bg-pink-400 px-4 py-2 text-sm font-semibold text-indigo-950 hover:bg-pink-300">Switch Lane</button>
          <button id="resetBtn" class="rounded-md bg-indigo-700 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-600">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const laneEl = document.getElementById('lane');
    const statusEl = document.getElementById('status');
    const laneBtn = document.getElementById('laneBtn');
    const resetBtn = document.getElementById('resetBtn');

    const center = { x: canvas.width / 2, y: canvas.height / 2 };
    const lanes = [96, 138, 180];
    let laneIndex = 1;
    let playerAngle = 0;
    let comets = [];
    let score = 0;
    let best = Number(localStorage.getItem('miniOrbitDodgeBest') || 0);
    let running = false;
    let lastTime = 0;
    let spawnTimer = 0;

    function resetGame() {
      laneIndex = 1;
      playerAngle = -Math.PI / 2;
      comets = [];
      score = 0;
      spawnTimer = 50;
      running = true;
      statusEl.textContent = 'Switch lanes before a comet reaches you.';
      lastTime = performance.now();
      updateHud();
      requestAnimationFrame(gameLoop);
    }

    function switchLane(direction = 1) {
      if (!running) {
        resetGame();
        return;
      }
      laneIndex = (laneIndex + direction + lanes.length) % lanes.length;
      updateHud();
    }

    function spawnComet() {
      const lane = Math.floor(Math.random() * lanes.length);
      const angle = Math.random() * Math.PI * 2;
      const spin = Math.random() > 0.5 ? 1 : -1;
      comets.push({ lane, angle, spin, size: 12, speed: 0.012 + score * 0.00002 });
      spawnTimer = Math.max(18, 46 - Math.floor(score / 80));
    }

    function updateGame(delta) {
      if (!running) return;
      const frameScale = Math.min(2, delta / 16.67);
      playerAngle += 0.018 * frameScale;
      score += frameScale;
      spawnTimer -= frameScale;
      if (spawnTimer <= 0) spawnComet();

      comets.forEach((comet) => {
        comet.angle += comet.speed * comet.spin * frameScale;
        comet.size += 0.028 * frameScale;
      });
      comets = comets.filter((comet) => comet.size < 26);
      if (comets.some(hitPlayer)) endGame();
      updateHud();
    }

    function pointOnLane(lane, angle) {
      return {
        x: center.x + Math.cos(angle) * lanes[lane],
        y: center.y + Math.sin(angle) * lanes[lane]
      };
    }

    function angleDistance(a, b) {
      const diff = Math.abs(((a - b + Math.PI) % (Math.PI * 2)) - Math.PI);
      return diff;
    }

    function hitPlayer(comet) {
      return comet.lane === laneIndex && angleDistance(comet.angle, playerAngle) < 0.18 + comet.size / 170;
    }

    function endGame() {
      running = false;
      best = Math.max(best, Math.floor(score));
      localStorage.setItem('miniOrbitDodgeBest', String(best));
      statusEl.textContent = `Hit by a comet. Final score: ${Math.floor(score)}.`;
      drawGame();
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(score);
      bestEl.textContent = best;
      laneEl.textContent = laneIndex + 1;
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      lanes.forEach((radius, index) => {
        ctx.strokeStyle = index === laneIndex ? 'rgba(244,114,182,0.8)' : 'rgba(129,140,248,0.35)';
        ctx.lineWidth = index === laneIndex ? 4 : 2;
        ctx.beginPath();
        ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
        ctx.stroke();
      });

      ctx.fillStyle = '#818cf8';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e0e7ff';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 18, 0, Math.PI * 2);
      ctx.fill();

      const player = pointOnLane(laneIndex, playerAngle);
      ctx.fillStyle = '#f9a8d4';
      ctx.beginPath();
      ctx.arc(player.x, player.y, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff1f2';
      ctx.lineWidth = 3;
      ctx.stroke();

      comets.forEach((comet) => {
        const point = pointOnLane(comet.lane, comet.angle);
        ctx.fillStyle = '#fb923c';
        ctx.beginPath();
        ctx.arc(point.x, point.y, comet.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(251,146,60,0.25)';
        ctx.beginPath();
        ctx.arc(point.x, point.y, comet.size + 8, 0, Math.PI * 2);
        ctx.fill();
      });

      if (!running) {
        ctx.fillStyle = 'rgba(2,6,23,0.72)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 32px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Orbit Broken', center.x, center.y - 8);
        ctx.font = '18px sans-serif';
        ctx.fillText('Switch lane to restart', center.x, center.y + 28);
      }
    }

    function gameLoop(time) {
      const delta = time - lastTime;
      lastTime = time;
      updateGame(delta);
      drawGame();
      if (running) requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      if (event.code === 'ArrowRight' || event.code === 'KeyD') switchLane(1);
      if (event.code === 'ArrowLeft' || event.code === 'KeyA') switchLane(-1);
    });
    canvas.addEventListener('pointerdown', () => switchLane(1));
    laneBtn.addEventListener('click', () => switchLane(1));
    resetBtn.addEventListener('click', resetGame);
    bestEl.textContent = best;
    resetGame();
  </script>
</body>
</html>
