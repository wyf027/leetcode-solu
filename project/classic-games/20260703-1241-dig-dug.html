<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Dig Dug</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 px-4 py-8">
      <section class="w-full max-w-2xl rounded-lg border border-neutral-700 bg-neutral-900 p-4 shadow-2xl">
        <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Dig Dug</h1>
            <p class="mt-1 text-sm text-neutral-400">挖开泥土，收集全部宝石，避开地下怪物。</p>
          </div>
          <button
            id="resetButton"
            class="rounded bg-orange-400 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-orange-300"
            type="button"
          >
            重新开始
          </button>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-neutral-700 bg-neutral-800 p-2">
            <div class="text-neutral-400">宝石</div>
            <div id="gemStatus" class="font-semibold">0 / 0</div>
          </div>
          <div class="rounded border border-neutral-700 bg-neutral-800 p-2">
            <div class="text-neutral-400">步数</div>
            <div id="moveStatus" class="font-semibold">0</div>
          </div>
          <div class="rounded border border-neutral-700 bg-neutral-800 p-2">
            <div class="text-neutral-400">分数</div>
            <div id="scoreStatus" class="font-semibold">0</div>
          </div>
        </div>

        <canvas
          id="gameCanvas"
          class="mt-4 block w-full rounded border border-neutral-700 bg-neutral-950"
          width="480"
          height="480"
        ></canvas>

        <div id="message" class="mt-3 min-h-6 text-center text-sm font-semibold text-orange-300"></div>

        <div class="mt-4 grid grid-cols-3 gap-2">
          <span></span>
          <button class="moveButton rounded bg-neutral-700 py-2 hover:bg-neutral-600" data-dir="up" type="button">上</button>
          <span></span>
          <button class="moveButton rounded bg-neutral-700 py-2 hover:bg-neutral-600" data-dir="left" type="button">左</button>
          <button class="moveButton rounded bg-neutral-700 py-2 hover:bg-neutral-600" data-dir="down" type="button">下</button>
          <button class="moveButton rounded bg-neutral-700 py-2 hover:bg-neutral-600" data-dir="right" type="button">右</button>
        </div>
      </section>
    </main>

    <script>
      const levelMap = [
        "###############",
        "#P....###....G#",
        "#.###.....###.#",
        "#...#..G..#...#",
        "###.#.###.#.###",
        "#...#..M..#...#",
        "#.#####.#####.#",
        "#G....#.#....G#",
        "#####.#.#.#####",
        "#.....#M#.....#",
        "#.###.....###.#",
        "#...G..#..G...#",
        "###.#######.###",
        "#G..........G.#",
        "###############",
      ];

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const gemStatus = document.getElementById("gemStatus");
      const moveStatus = document.getElementById("moveStatus");
      const scoreStatus = document.getElementById("scoreStatus");
      const message = document.getElementById("message");
      const resetButton = document.getElementById("resetButton");
      const tileSize = 32;

      let grid;
      let player;
      let enemies;
      let totalGems;
      let collectedGems;
      let moves;
      let score;
      let gameOver;

      function resetGame() {
        grid = levelMap.map((row) => row.split(""));
        player = { x: 1, y: 1 };
        enemies = [];
        totalGems = 0;
        collectedGems = 0;
        moves = 0;
        score = 0;
        gameOver = false;
        message.textContent = "方向键或 WASD 移动，泥土会被挖成通道。";

        for (let y = 0; y < grid.length; y += 1) {
          for (let x = 0; x < grid[y].length; x += 1) {
            if (grid[y][x] === "P") {
              player = { x, y };
              grid[y][x] = " ";
            }
            if (grid[y][x] === "M") {
              enemies.push({ x, y, tick: 0 });
              grid[y][x] = " ";
            }
            if (grid[y][x] === "G") {
              totalGems += 1;
            }
          }
        }

        renderBoard();
        updateStatus();
      }

      function renderBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < grid.length; y += 1) {
          for (let x = 0; x < grid[y].length; x += 1) {
            drawTile(grid[y][x], x, y);
          }
        }
        enemies.forEach(drawEnemy);
        drawPlayer();
      }

      function drawTile(tile, x, y) {
        const left = x * tileSize;
        const top = y * tileSize;
        ctx.fillStyle = "#171717";
        ctx.fillRect(left, top, tileSize, tileSize);

        if (tile === "#") {
          ctx.fillStyle = "#78350f";
          ctx.fillRect(left + 1, top + 1, tileSize - 2, tileSize - 2);
          ctx.fillStyle = "#92400e";
          ctx.fillRect(left + 4, top + 7, tileSize - 8, 4);
          ctx.fillRect(left + 4, top + 20, tileSize - 8, 4);
        } else if (tile === ".") {
          ctx.fillStyle = "#451a03";
          ctx.fillRect(left, top, tileSize, tileSize);
          ctx.fillStyle = "#7c2d12";
          ctx.fillRect(left + 6, top + 6, 4, 4);
          ctx.fillRect(left + 20, top + 17, 5, 5);
        } else if (tile === "G") {
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.moveTo(left + tileSize / 2, top + 6);
          ctx.lineTo(left + tileSize - 7, top + tileSize / 2);
          ctx.lineTo(left + tileSize / 2, top + tileSize - 6);
          ctx.lineTo(left + 7, top + tileSize / 2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.strokeStyle = "#262626";
        ctx.strokeRect(left, top, tileSize, tileSize);
      }

      function drawPlayer() {
        const cx = player.x * tileSize + tileSize / 2;
        const cy = player.y * tileSize + tileSize / 2;
        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(cx, cy, 11, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(cx - 5, cy - 4, 3, 3);
        ctx.fillRect(cx + 3, cy - 4, 3, 3);
      }

      function drawEnemy(enemy) {
        const cx = enemy.x * tileSize + tileSize / 2;
        const cy = enemy.y * tileSize + tileSize / 2;
        ctx.fillStyle = "#fb7185";
        ctx.beginPath();
        ctx.arc(cx, cy, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111827";
        ctx.fillRect(cx - 6, cy - 3, 4, 4);
        ctx.fillRect(cx + 2, cy - 3, 4, 4);
      }

      function movePlayer(dx, dy) {
        if (gameOver) {
          return;
        }

        const nextX = player.x + dx;
        const nextY = player.y + dy;
        if (!canMoveTo(nextX, nextY)) {
          message.textContent = "坚硬岩壁不能挖开。";
          return;
        }

        player = { x: nextX, y: nextY };
        moves += 1;
        digTile(nextX, nextY);
        collectGem(nextX, nextY);
        moveEnemies();
        checkGameState();
        renderBoard();
        updateStatus();
      }

      function canMoveTo(x, y) {
        const tile = grid[y]?.[x];
        return Boolean(tile) && tile !== "#";
      }

      function digTile(x, y) {
        if (grid[y][x] === ".") {
          grid[y][x] = " ";
          score += 5;
        }
      }

      function collectGem(x, y) {
        if (grid[y][x] !== "G") {
          return;
        }
        grid[y][x] = " ";
        collectedGems += 1;
        score += 100;
        message.textContent = collectedGems === totalGems ? "全部宝石到手，安全撤离！" : "收集到宝石。";
      }

      function moveEnemies() {
        enemies = enemies.map((enemy) => {
          const options = [
            { x: enemy.x + 1, y: enemy.y },
            { x: enemy.x - 1, y: enemy.y },
            { x: enemy.x, y: enemy.y + 1 },
            { x: enemy.x, y: enemy.y - 1 },
          ].filter((point) => canEnemyMoveTo(point.x, point.y));

          if (options.length === 0) {
            return enemy;
          }

          options.sort((a, b) => distance(a, player) - distance(b, player));
          const chase = enemy.tick % 2 === 0 ? options[0] : options[Math.floor(Math.random() * options.length)];
          return { x: chase.x, y: chase.y, tick: enemy.tick + 1 };
        });
      }

      function canEnemyMoveTo(x, y) {
        const tile = grid[y]?.[x];
        return tile === " " || tile === "G";
      }

      function checkGameState() {
        const caught = enemies.some((enemy) => enemy.x === player.x && enemy.y === player.y);
        if (caught) {
          gameOver = true;
          message.textContent = "被地下怪物抓住了。";
          return;
        }

        if (collectedGems === totalGems) {
          gameOver = true;
          score += Math.max(0, 300 - moves * 4);
          message.textContent = "完成！";
        }
      }

      function distance(a, b) {
        return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
      }

      function updateStatus() {
        gemStatus.textContent = `${collectedGems} / ${totalGems}`;
        moveStatus.textContent = String(moves);
        scoreStatus.textContent = String(score);
      }

      const keyMap = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0],
      };

      document.addEventListener("keydown", (event) => {
        const direction = keyMap[event.key];
        if (!direction) {
          return;
        }
        event.preventDefault();
        movePlayer(direction[0], direction[1]);
      });

      document.querySelectorAll(".moveButton").forEach((button) => {
        button.addEventListener("click", () => {
          const map = {
            up: [0, -1],
            down: [0, 1],
            left: [-1, 0],
            right: [1, 0],
          };
          const direction = map[button.dataset.dir];
          movePlayer(direction[0], direction[1]);
        });
      });

      resetButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
