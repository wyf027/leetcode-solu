<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Boggle</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col justify-center gap-5 px-4 py-8">
      <section class="rounded-lg border border-slate-800 bg-slate-900 p-5 shadow-xl">
        <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-normal text-white">Mini Boggle</h1>
            <p class="mt-1 text-sm text-slate-400">点击相邻字母拼出目标词，单词内不能重复使用同一格。</p>
          </div>
          <div class="text-right">
            <div class="text-xs uppercase text-slate-500">Score</div>
            <div id="score" class="text-3xl font-bold text-emerald-300">0</div>
          </div>
        </div>

        <div class="grid gap-4 md:grid-cols-[1fr_220px]">
          <div>
            <div id="board" class="grid aspect-square max-h-[420px] grid-cols-4 gap-2"></div>
            <div class="mt-4 rounded-md border border-slate-800 bg-slate-950 p-3">
              <div class="text-xs uppercase text-slate-500">Current Word</div>
              <div id="currentWord" class="mt-1 min-h-8 text-2xl font-bold text-cyan-200"></div>
            </div>
          </div>

          <aside class="flex flex-col gap-3">
            <div class="rounded-md border border-slate-800 bg-slate-950 p-3">
              <div class="mb-2 flex items-center justify-between">
                <h2 class="font-semibold text-white">目标词</h2>
                <span id="progress" class="text-sm text-slate-400">0 / 7</span>
              </div>
              <div id="wordList" class="grid gap-2"></div>
            </div>
            <div id="message" class="min-h-10 rounded-md border border-slate-800 bg-slate-950 p-3 text-sm text-slate-300">
              从任意字母开始。
            </div>
            <div class="grid grid-cols-2 gap-2">
              <button
                type="button"
                onclick="submitWord()"
                class="rounded-md bg-emerald-500 px-3 py-2 font-semibold text-slate-950 transition hover:bg-emerald-400"
              >
                提交
              </button>
              <button
                type="button"
                onclick="clearPath()"
                class="rounded-md bg-slate-700 px-3 py-2 font-semibold text-white transition hover:bg-slate-600"
              >
                清除
              </button>
            </div>
            <button
              type="button"
              onclick="resetGame()"
              class="rounded-md border border-slate-700 px-3 py-2 font-semibold text-slate-200 transition hover:border-slate-500 hover:bg-slate-800"
            >
              重新开始
            </button>
          </aside>
        </div>
      </section>
    </main>

    <script>
      const grid = [
        ["C", "O", "D", "E"],
        ["G", "A", "M", "E"],
        ["T", "I", "L", "E"],
        ["P", "A", "T", "H"],
      ];
      const targets = ["CODE", "GAME", "TILE", "PATH", "CAT", "DOG", "MAP"];
      const found = new Set();
      let path = [];

      function renderBoard() {
        const board = document.getElementById("board");
        board.innerHTML = "";

        grid.flat().forEach((letter, index) => {
          const row = Math.floor(index / 4);
          const col = index % 4;
          const active = path.some((cell) => cell.row === row && cell.col === col);
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = letter;
          button.className = [
            "aspect-square rounded-md border text-3xl font-black transition",
            active
              ? "border-cyan-300 bg-cyan-400 text-slate-950 shadow-lg shadow-cyan-950/40"
              : "border-slate-700 bg-slate-800 text-white hover:border-cyan-400 hover:bg-slate-700",
          ].join(" ");
          button.onclick = () => selectCell(row, col);
          board.appendChild(button);
        });
      }

      function renderWords() {
        const list = document.getElementById("wordList");
        list.innerHTML = "";

        targets.forEach((word) => {
          const done = found.has(word);
          const item = document.createElement("div");
          item.className = [
            "rounded border px-3 py-2 text-sm font-semibold",
            done ? "border-emerald-500 bg-emerald-500/15 text-emerald-200" : "border-slate-800 bg-slate-900 text-slate-300",
          ].join(" ");
          item.textContent = done ? word + " ✓" : word;
          list.appendChild(item);
        });

        document.getElementById("score").textContent = found.size * 100;
        document.getElementById("progress").textContent = found.size + " / " + targets.length;
      }

      function updateCurrentWord() {
        document.getElementById("currentWord").textContent = path.map((cell) => grid[cell.row][cell.col]).join("");
      }

      function isAdjacent(a, b) {
        return Math.abs(a.row - b.row) <= 1 && Math.abs(a.col - b.col) <= 1 && !(a.row === b.row && a.col === b.col);
      }

      function selectCell(row, col) {
        const next = { row, col };
        const alreadyUsed = path.some((cell) => cell.row === row && cell.col === col);

        if (alreadyUsed) {
          setMessage("这个单词里已经用过该字母格。");
          return;
        }

        if (path.length && !isAdjacent(path[path.length - 1], next)) {
          setMessage("请选择相邻的字母格。");
          return;
        }

        path.push(next);
        setMessage("继续选择，或提交当前单词。");
        updateCurrentWord();
        renderBoard();
      }

      function submitWord() {
        const word = path.map((cell) => grid[cell.row][cell.col]).join("");

        if (!word) {
          setMessage("先选择字母。");
          return;
        }

        if (!targets.includes(word)) {
          setMessage(word + " 不在目标词中。");
          clearPath(false);
          return;
        }

        if (found.has(word)) {
          setMessage(word + " 已经找到了。");
          clearPath(false);
          return;
        }

        found.add(word);
        setMessage(found.size === targets.length ? "全部找到，挑战完成。" : "找到 " + word + "。");
        clearPath(false);
        renderWords();
      }

      function clearPath(showMessage = true) {
        path = [];
        updateCurrentWord();
        renderBoard();
        if (showMessage) setMessage("已清除当前选择。");
      }

      function resetGame() {
        found.clear();
        clearPath(false);
        renderWords();
        setMessage("从任意字母开始。");
      }

      function setMessage(text) {
        document.getElementById("message").textContent = text;
      }

      renderBoard();
      renderWords();
      updateCurrentWord();
    </script>
  </body>
</html>
