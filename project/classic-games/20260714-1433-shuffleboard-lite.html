<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shuffleboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-stone-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.18em] text-amber-300">Classic mini game</p>
        <h1 class="mt-1 text-3xl font-bold">Mini Shuffleboard</h1>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-bold text-stone-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_320px]">
      <div class="rounded border border-stone-800 bg-stone-900 p-4">
        <canvas id="lane" width="620" height="820" class="h-[72vh] min-h-[560px] w-full rounded bg-stone-950"></canvas>
      </div>

      <aside class="space-y-4">
        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <div class="grid grid-cols-3 gap-3 text-center">
            <div>
              <p class="text-xs text-stone-400">Total</p>
              <p id="score" class="text-3xl font-bold text-amber-300">0</p>
            </div>
            <div>
              <p class="text-xs text-stone-400">Disk</p>
              <p id="diskCount" class="text-3xl font-bold">1/3</p>
            </div>
            <div>
              <p class="text-xs text-stone-400">Best</p>
              <p id="best" class="text-3xl font-bold">0</p>
            </div>
          </div>
        </div>

        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <label for="power" class="block text-sm font-medium text-stone-300">Power</label>
          <input id="power" type="range" min="42" max="100" value="72" class="mt-2 w-full accent-amber-300">
          <div class="mt-1 flex justify-between text-xs text-stone-500">
            <span>Short</span>
            <span id="powerText">72</span>
            <span>Fast</span>
          </div>

          <label for="aim" class="mt-4 block text-sm font-medium text-stone-300">Aim drift</label>
          <input id="aim" type="range" min="-55" max="55" value="0" class="mt-2 w-full accent-amber-300">
          <div class="mt-1 flex justify-between text-xs text-stone-500">
            <span>Left</span>
            <span id="aimText">0</span>
            <span>Right</span>
          </div>

          <button id="shootBtn" class="mt-4 w-full rounded bg-amber-300 px-4 py-3 font-bold text-stone-950 hover:bg-amber-200">Slide Disk</button>
        </div>

        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <p id="message" class="min-h-12 text-sm leading-6 text-stone-300">Slide three disks. Stop inside the far scoring beds without falling off the end.</p>
          <ol id="history" class="mt-3 max-h-52 space-y-2 overflow-auto text-sm text-stone-400"></ol>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("lane");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const diskCountEl = document.getElementById("diskCount");
    const bestEl = document.getElementById("best");
    const powerEl = document.getElementById("power");
    const aimEl = document.getElementById("aim");
    const powerText = document.getElementById("powerText");
    const aimText = document.getElementById("aimText");
    const shootBtn = document.getElementById("shootBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    const messageEl = document.getElementById("message");
    const historyEl = document.getElementById("history");

    const lane = { x: 145, y: 48, w: 330, h: 720 };
    const zones = [
      { y: 76, h: 70, points: 10, color: "#78350f" },
      { y: 146, h: 82, points: 8, color: "#92400e" },
      { y: 228, h: 94, points: 7, color: "#a16207" },
      { y: 322, h: 118, points: 5, color: "#57534e" },
      { y: 440, h: 165, points: 3, color: "#44403c" }
    ];
    let disks = [];
    let score = 0;
    let shot = 1;
    let best = Number(localStorage.getItem("mini-shuffleboard-best") || 0);
    let animating = false;
    let animationFrameId = 0;
    let animationToken = 0;

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawLane();
      drawDisks();
      updatePanel();
    }

    function drawLane() {
      ctx.fillStyle = "#1c1917";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#3f2f1f";
      ctx.fillRect(lane.x - 18, lane.y - 18, lane.w + 36, lane.h + 36);
      ctx.fillStyle = "#92400e";
      ctx.fillRect(lane.x, lane.y, lane.w, lane.h);

      zones.forEach((zone) => {
        ctx.fillStyle = zone.color;
        ctx.fillRect(lane.x, zone.y, lane.w, zone.h);
        ctx.strokeStyle = "#f5f5f4";
        ctx.lineWidth = 2;
        ctx.strokeRect(lane.x, zone.y, lane.w, zone.h);
        ctx.fillStyle = "#fef3c7";
        ctx.font = "bold 28px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`${zone.points}`, lane.x + lane.w / 2, zone.y + zone.h / 2);
      });

      ctx.strokeStyle = "#fed7aa";
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 10]);
      ctx.beginPath();
      ctx.moveTo(lane.x, lane.y + lane.h - 120);
      ctx.lineTo(lane.x + lane.w, lane.y + lane.h - 120);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#fef3c7";
      ctx.font = "14px system-ui";
      ctx.fillText("Foul line", lane.x + lane.w / 2, lane.y + lane.h - 98);
    }

    function drawDisks() {
      disks.forEach((disk, index) => {
        ctx.beginPath();
        ctx.arc(disk.x, disk.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = disk.active ? "#facc15" : "#e7e5e4";
        ctx.fill();
        ctx.strokeStyle = "#111827";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = "#111827";
        ctx.font = "bold 13px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(index + 1, disk.x, disk.y + 1);
      });
    }

    function slideDisk() {
      if (animating || shot > 3) return;
      const power = Number(powerEl.value);
      const aim = Number(aimEl.value);
      const disk = {
        x: lane.x + lane.w / 2,
        y: lane.y + lane.h - 46,
        targetX: lane.x + lane.w / 2 + aim + random(-24, 24),
        targetY: lane.y + lane.h - power * 7.25 + random(-34, 34),
        active: true
      };
      disks.push(disk);
      animating = true;
      const token = animationToken;
      animateDisk(disk, token);
    }

    function animateDisk(disk, token) {
      if (token !== animationToken) return;
      const dx = (disk.targetX - disk.x) * 0.12;
      const dy = (disk.targetY - disk.y) * 0.12;
      disk.x += dx;
      disk.y += dy;
      draw();

      if (Math.abs(dx) > 0.6 || Math.abs(dy) > 0.6) {
        animationFrameId = requestAnimationFrame(() => animateDisk(disk, token));
        return;
      }

      animationFrameId = 0;
      disk.x = disk.targetX;
      disk.y = disk.targetY;
      disk.active = false;
      const points = scoreDisk(disk);
      score += points;
      log(`Disk ${shot}: ${points ? `${points} points` : "no score"}.`);
      shot += 1;
      animating = false;
      if (shot > 3) finishGame();
      else messageEl.textContent = `Disk ${shot} is ready. Adjust power and drift.`;
      draw();
    }

    function scoreDisk(disk) {
      if (disk.x < lane.x + 18 || disk.x > lane.x + lane.w - 18 || disk.y < lane.y || disk.y > lane.y + lane.h) {
        return 0;
      }
      const zone = zones.find((item) => disk.y >= item.y && disk.y < item.y + item.h);
      return zone ? zone.points : 0;
    }

    function finishGame() {
      if (score > best) {
        best = score;
        localStorage.setItem("mini-shuffleboard-best", String(best));
      }
      messageEl.textContent = `Frame complete: ${score} points. New Game starts another frame.`;
    }

    function log(text) {
      const item = document.createElement("li");
      item.textContent = text;
      historyEl.prepend(item);
    }

    function updatePanel() {
      scoreEl.textContent = score;
      diskCountEl.textContent = `${Math.min(shot, 3)}/3`;
      bestEl.textContent = best;
      powerText.textContent = powerEl.value;
      aimText.textContent = aimEl.value;
      shootBtn.disabled = animating || shot > 3;
      shootBtn.classList.toggle("opacity-50", shootBtn.disabled);
    }

    function resetGame() {
      animationToken += 1;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = 0;
      disks = [];
      score = 0;
      shot = 1;
      animating = false;
      historyEl.innerHTML = "";
      messageEl.textContent = "Slide three disks. Stop inside the far scoring beds without falling off the end.";
      draw();
    }

    function random(min, max) {
      return min + Math.random() * (max - min);
    }

    shootBtn.addEventListener("click", slideDisk);
    newGameBtn.addEventListener("click", resetGame);
    powerEl.addEventListener("input", draw);
    aimEl.addEventListener("input", draw);
    draw();
  </script>
</body>
</html>
