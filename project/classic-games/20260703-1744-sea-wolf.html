<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Sea Wolf</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-cyan-950 text-cyan-50">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-4 p-4">
      <section class="w-full rounded-lg border border-cyan-700 bg-cyan-900/90 p-4 shadow-xl">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Sea Wolf</h1>
            <p class="text-sm text-cyan-200">左右移动潜望镜，空格发射鱼雷，击沉 8 艘船。</p>
          </div>
          <div class="flex gap-3 text-sm">
            <span>得分 <strong id="score">0</strong></span>
            <span>鱼雷 <strong id="torpedoes">18</strong></span>
            <span>击沉 <strong id="sunk">0</strong>/8</span>
          </div>
        </div>

        <canvas id="game" width="520" height="420" class="w-full rounded-md border border-cyan-700 bg-slate-950"></canvas>

        <div class="mt-3 grid grid-cols-3 gap-2">
          <button id="leftBtn" class="rounded bg-cyan-700 px-3 py-2 font-semibold hover:bg-cyan-600">左移</button>
          <button id="fireBtn" class="rounded bg-amber-400 px-3 py-2 font-semibold text-slate-950 hover:bg-amber-300">发射</button>
          <button id="rightBtn" class="rounded bg-cyan-700 px-3 py-2 font-semibold hover:bg-cyan-600">右移</button>
        </div>
        <button id="restartBtn" class="mt-2 w-full rounded bg-cyan-100 px-3 py-2 font-semibold text-slate-950 hover:bg-white">
          重新开始
        </button>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const torpedoesEl = document.getElementById("torpedoes");
      const sunkEl = document.getElementById("sunk");
      const keys = new Set();
      let scope;
      let ships;
      let torpedoes;
      let score;
      let torpedoesLeft;
      let sunk;
      let frame;
      let running;
      let message;

      function resetGame() {
        scope = { x: canvas.width / 2, y: 354, w: 42 };
        ships = [
          makeShip(40, 74, 1.35, 30),
          makeShip(390, 122, -1.65, 40),
          makeShip(120, 172, 1.9, 50),
        ];
        torpedoes = [];
        score = 0;
        torpedoesLeft = 18;
        sunk = 0;
        frame = 0;
        running = true;
        message = "";
        updateHud();
      }

      function makeShip(x, y, vx, points) {
        return { x, y, vx, points, w: 56, h: 16, cooldown: 0 };
      }

      function updateHud() {
        scoreEl.textContent = score;
        torpedoesEl.textContent = torpedoesLeft;
        sunkEl.textContent = sunk;
      }

      function fireTorpedo() {
        if (!running || torpedoesLeft <= 0 || torpedoes.length > 2) return;
        torpedoes.push({ x: scope.x, y: scope.y - 12, vy: -4.9, r: 4 });
        torpedoesLeft -= 1;
        updateHud();
      }

      function updateScope() {
        if (keys.has("ArrowLeft") || keys.has("a")) scope.x -= 4;
        if (keys.has("ArrowRight") || keys.has("d")) scope.x += 4;
        scope.x = Math.max(28, Math.min(canvas.width - 28, scope.x));
      }

      function updateShips() {
        ships.forEach((ship) => {
          ship.x += ship.vx;
          if (ship.vx > 0 && ship.x > canvas.width + 70) ship.x = -80;
          if (ship.vx < 0 && ship.x < -90) ship.x = canvas.width + 70;
        });
        if (frame % 420 === 0 && ships.length < 5) {
          const lane = [84, 132, 180][Math.floor(Math.random() * 3)];
          const dir = Math.random() > 0.5 ? 1 : -1;
          ships.push(makeShip(dir > 0 ? -70 : canvas.width + 70, lane, dir * (1.4 + Math.random() * 0.7), 35 + lane / 4));
        }
      }

      function updateTorpedoes() {
        torpedoes.forEach((torpedo) => {
          torpedo.y += torpedo.vy;
          ships.forEach((ship) => {
            if (torpedo.hit) return;
            const rect = { x: ship.x - ship.w / 2, y: ship.y - ship.h / 2, w: ship.w, h: ship.h };
            if (circleHitsRect(torpedo, rect)) {
              torpedo.hit = true;
              ship.hit = true;
              score += ship.points;
              sunk += 1;
            }
          });
          if (torpedo.y < 36) torpedo.hit = true;
        });
        torpedoes = torpedoes.filter((torpedo) => !torpedo.hit);
        ships = ships.filter((ship) => !ship.hit);
      }

      function circleHitsRect(circle, rect) {
        const nearestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        return Math.hypot(circle.x - nearestX, circle.y - nearestY) <= circle.r;
      }

      function checkGameState() {
        if (sunk >= 8) {
          running = false;
          message = "任务完成";
          score += 100;
        }
        if (torpedoesLeft <= 0 && torpedoes.length === 0 && sunk < 8) {
          running = false;
          message = "鱼雷耗尽";
        }
        updateHud();
      }

      function renderShip(ship) {
        ctx.fillStyle = "#e2e8f0";
        ctx.fillRect(ship.x - ship.w / 2, ship.y - ship.h / 2, ship.w, ship.h);
        ctx.fillStyle = "#64748b";
        ctx.fillRect(ship.x - 8, ship.y - 22, 18, 14);
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(ship.x + 14, ship.y - 2, 10, 4);
      }

      function renderSea() {
        const water = ctx.createLinearGradient(0, 0, 0, canvas.height);
        water.addColorStop(0, "#0e7490");
        water.addColorStop(0.48, "#155e75");
        water.addColorStop(1, "#083344");
        ctx.fillStyle = water;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(207, 250, 254, 0.35)";
        ctx.lineWidth = 2;
        for (let y = 56; y < 220; y += 48) {
          ctx.beginPath();
          for (let x = 0; x <= canvas.width; x += 22) {
            const wave = y + Math.sin((x + frame * 2) / 28) * 3;
            if (x === 0) ctx.moveTo(x, wave);
            else ctx.lineTo(x, wave);
          }
          ctx.stroke();
        }

        ships.forEach(renderShip);

        torpedoes.forEach((torpedo) => {
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(torpedo.x, torpedo.y, torpedo.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#fef9c3";
          ctx.beginPath();
          ctx.moveTo(torpedo.x, torpedo.y + 5);
          ctx.lineTo(torpedo.x, torpedo.y + 20);
          ctx.stroke();
        });

        ctx.strokeStyle = "#f8fafc";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(scope.x, scope.y);
        ctx.lineTo(scope.x, scope.y - 72);
        ctx.moveTo(scope.x - scope.w / 2, scope.y - 72);
        ctx.lineTo(scope.x + scope.w / 2, scope.y - 72);
        ctx.stroke();
        ctx.fillStyle = "#082f49";
        ctx.fillRect(scope.x - 28, scope.y, 56, 22);

        ctx.strokeStyle = "rgba(248, 250, 252, 0.8)";
        ctx.beginPath();
        ctx.moveTo(scope.x, 42);
        ctx.lineTo(scope.x, 250);
        ctx.stroke();

        if (message) {
          ctx.fillStyle = "rgba(8, 47, 73, 0.84)";
          ctx.fillRect(92, 154, 336, 90);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 28px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(message, canvas.width / 2, 198);
          ctx.font = "14px system-ui";
          ctx.fillText("点击重新开始再次出航", canvas.width / 2, 222);
          ctx.textAlign = "start";
        }
      }

      function gameLoop() {
        frame += 1;
        if (running) {
          updateScope();
          updateShips();
          updateTorpedoes();
          checkGameState();
        }
        renderSea();
        requestAnimationFrame(gameLoop);
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["arrowleft", "arrowright", " ", "a", "d"].includes(key)) event.preventDefault();
        if (event.key === " ") fireTorpedo();
        keys.add(key.startsWith("arrow") ? event.key : key);
      });
      document.addEventListener("keyup", (event) => {
        keys.delete(event.key);
        keys.delete(event.key.toLowerCase());
      });
      document.getElementById("leftBtn").addEventListener("pointerdown", () => keys.add("ArrowLeft"));
      document.getElementById("leftBtn").addEventListener("pointerup", () => keys.delete("ArrowLeft"));
      document.getElementById("rightBtn").addEventListener("pointerdown", () => keys.add("ArrowRight"));
      document.getElementById("rightBtn").addEventListener("pointerup", () => keys.delete("ArrowRight"));
      document.getElementById("fireBtn").addEventListener("click", fireTorpedo);
      document.getElementById("restartBtn").addEventListener("click", resetGame);

      resetGame();
      gameLoop();
    </script>
  </body>
</html>
