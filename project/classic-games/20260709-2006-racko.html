<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Rack-O</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-950 text-blue-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Rack-O</h1>
        <p class="text-sm text-blue-200">Draw a card, replace one rack slot, and sort the rack from low to high.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-blue-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-blue-700 bg-blue-900 p-3 sm:grid-cols-4">
      <div>Moves: <b id="moveCount">0</b></div>
      <div>Stock: <b id="stockCount">0</b></div>
      <div>Discard: <b id="discardTop">-</b></div>
      <div id="message">Draw from stock or discard.</div>
    </section>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <div id="rack" class="grid grid-cols-2 gap-2 sm:grid-cols-5"></div>
      <aside class="rounded border border-blue-700 bg-blue-900 p-3">
        <button id="stockBtn" class="mb-2 w-full rounded bg-sky-300 px-4 py-3 font-semibold text-blue-950 hover:bg-sky-200">Draw Stock</button>
        <button id="discardBtn" class="mb-4 w-full rounded bg-lime-300 px-4 py-3 font-semibold text-blue-950 hover:bg-lime-200">Take Discard</button>
        <div class="rounded bg-blue-800 p-3 text-center">Held: <b id="heldCard">none</b></div>
      </aside>
    </section>
  </main>

  <script>
    let rack;
    let stock;
    let discard;
    let held;
    let moves;

    const el = (id) => document.getElementById(id);
    const rackEl = el("rack");
    const moveCount = el("moveCount");
    const stockCount = el("stockCount");
    const discardTop = el("discardTop");
    const message = el("message");
    const heldCard = el("heldCard");
    const stockBtn = el("stockBtn");
    const discardBtn = el("discardBtn");
    const newGameBtn = el("newGameBtn");

    function shuffle(cards) {
      for (let i = cards.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function isRackSorted() {
      return rack.every((value, index) => index === 0 || rack[index - 1] < value);
    }

    function drawStock() {
      if (held) return;
      if (!stock.length) {
        stock = shuffle(discard.splice(0, discard.length - 1));
        message.textContent = "Stock recycled from discard.";
      }
      held = stock.pop();
      message.textContent = "Choose a rack slot to replace.";
      render();
    }

    function takeDiscard() {
      if (held || !discard.length) return;
      held = discard.pop();
      message.textContent = "Choose a rack slot to replace.";
      render();
    }

    function chooseSlot(index) {
      if (!held) {
        message.textContent = "Draw a card first.";
        return;
      }
      const oldCard = rack[index];
      rack[index] = held;
      discard.push(oldCard);
      held = null;
      moves += 1;
      message.textContent = isRackSorted() ? "Rack-O! The rack is sorted." : "Draw another card.";
      render();
    }

    function render() {
      rackEl.innerHTML = rack.map((value, index) => `
        <button class="rounded border border-blue-700 bg-white p-4 text-2xl font-bold text-blue-950 hover:bg-amber-100" data-slot="${index}">
          <div class="text-xs text-blue-500">slot ${index + 1}</div>${value}
        </button>
      `).join("");
      document.querySelectorAll("[data-slot]").forEach((button) => {
        button.onclick = () => chooseSlot(Number(button.dataset.slot));
      });
      moveCount.textContent = moves;
      stockCount.textContent = stock.length;
      discardTop.textContent = discard.at(-1) || "-";
      heldCard.textContent = held || "none";
      stockBtn.disabled = Boolean(held);
      discardBtn.disabled = Boolean(held);
    }

    function newGame() {
      const deck = shuffle(Array.from({ length: 60 }, (_, index) => index + 1));
      rack = deck.splice(0, 10);
      stock = deck;
      discard = [stock.pop()];
      held = null;
      moves = 0;
      message.textContent = "Draw from stock or discard.";
      render();
    }

    stockBtn.addEventListener("click", drawStock);
    discardBtn.addEventListener("click", takeDiscard);
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
