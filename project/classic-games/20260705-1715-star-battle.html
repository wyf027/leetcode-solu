<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Star Battle</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-6 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-slate-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-cyan-300">Classic Logic Puzzle</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Star Battle</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="resetBtn" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-300">
            重新开始
          </button>
          <button id="hintBtn" class="rounded-md border border-slate-600 px-4 py-2 text-sm font-semibold text-slate-100 hover:bg-slate-800">
            提示
          </button>
        </div>
      </header>

      <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div class="rounded-lg border border-slate-800 bg-slate-900/80 p-4 shadow-2xl shadow-slate-950/40">
          <div id="board" class="mx-auto grid aspect-square w-full max-w-[32rem] grid-cols-5 overflow-hidden rounded-md border-4 border-slate-100"></div>
        </div>

        <aside class="space-y-4">
          <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
            <h2 class="text-lg font-semibold text-white">目标</h2>
            <p class="mt-2 text-sm leading-6 text-slate-300">
              每行、每列、每个彩色区域都只能放 1 颗星。星星不能在横向、纵向或斜向相邻。
            </p>
          </div>

          <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
            <h2 class="text-lg font-semibold text-white">检查</h2>
            <ul class="mt-3 space-y-2 text-sm">
              <li id="rowsStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">行：等待放星</li>
              <li id="colsStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">列：等待放星</li>
              <li id="regionsStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">区域：等待放星</li>
              <li id="touchStatus" class="rounded-md bg-slate-800 px-3 py-2 text-slate-300">相邻：无冲突</li>
            </ul>
          </div>

          <div id="message" class="rounded-lg border border-cyan-400/30 bg-cyan-400/10 p-4 text-sm leading-6 text-cyan-100">
            点击格子放置或移除星星。
          </div>
        </aside>
      </section>
    </main>

    <script>
      const board = document.getElementById("board");
      const resetBtn = document.getElementById("resetBtn");
      const hintBtn = document.getElementById("hintBtn");
      const message = document.getElementById("message");
      const rowsStatus = document.getElementById("rowsStatus");
      const colsStatus = document.getElementById("colsStatus");
      const regionsStatus = document.getElementById("regionsStatus");
      const touchStatus = document.getElementById("touchStatus");

      const size = 5;
      const regions = [
        [0, 0, 1, 1, 1],
        [0, 2, 2, 3, 1],
        [0, 2, 3, 3, 4],
        [5, 2, 5, 4, 4],
        [5, 5, 5, 4, 4],
      ];
      const regionColors = [
        "bg-rose-500/25",
        "bg-sky-500/25",
        "bg-emerald-500/25",
        "bg-amber-500/25",
        "bg-violet-500/25",
        "bg-teal-500/25",
      ];
      const solution = new Set(["0,1", "1,4", "2,2", "3,0", "4,3"]);
      const stars = new Set();
      const cells = [];

      function keyOf(row, col) {
        return `${row},${col}`;
      }

      function countInRow(row) {
        return [...stars].filter((key) => Number(key.split(",")[0]) === row).length;
      }

      function countInCol(col) {
        return [...stars].filter((key) => Number(key.split(",")[1]) === col).length;
      }

      function countInRegion(regionId) {
        let count = 0;
        stars.forEach((key) => {
          const [row, col] = key.split(",").map(Number);
          if (regions[row][col] === regionId) count += 1;
        });
        return count;
      }

      function lineReport(type) {
        const counts = Array.from({ length: size }, (_, index) => (type === "row" ? countInRow(index) : countInCol(index)));
        const tooMany = counts.some((count) => count > 1);
        const complete = counts.every((count) => count === 1);
        return { counts, tooMany, complete };
      }

      function regionReport() {
        const counts = Array.from({ length: 6 }, (_, index) => countInRegion(index));
        const tooMany = counts.some((count) => count > 1);
        const complete = counts.every((count) => count === 1);
        return { counts, tooMany, complete };
      }

      function touchReport() {
        const conflicts = new Set();
        stars.forEach((key) => {
          const [row, col] = key.split(",").map(Number);
          for (let dr = -1; dr <= 1; dr += 1) {
            for (let dc = -1; dc <= 1; dc += 1) {
              if (dr === 0 && dc === 0) continue;
              const nextKey = keyOf(row + dr, col + dc);
              if (stars.has(nextKey)) {
                conflicts.add(key);
                conflicts.add(nextKey);
              }
            }
          }
        });
        return { conflicts, clear: conflicts.size === 0 };
      }

      function setStatus(element, label, state) {
        element.className = "rounded-md px-3 py-2 text-sm";
        if (state === "ok") element.classList.add("bg-emerald-500/15", "text-emerald-200");
        if (state === "warn") element.classList.add("bg-amber-500/15", "text-amber-200");
        if (state === "bad") element.classList.add("bg-rose-500/15", "text-rose-200");
        element.textContent = label;
      }

      function render() {
        const touch = touchReport();
        cells.forEach((cell) => {
          const key = cell.dataset.key;
          cell.textContent = stars.has(key) ? "★" : "";
          cell.classList.toggle("text-rose-200", touch.conflicts.has(key));
          cell.classList.toggle("ring-4", touch.conflicts.has(key));
          cell.classList.toggle("ring-rose-300", touch.conflicts.has(key));
        });

        const rows = lineReport("row");
        const cols = lineReport("col");
        const areas = regionReport();
        setStatus(rowsStatus, rows.complete ? "行：全部正确" : rows.tooMany ? "行：有重复星星" : "行：还未完成", rows.complete ? "ok" : rows.tooMany ? "bad" : "warn");
        setStatus(colsStatus, cols.complete ? "列：全部正确" : cols.tooMany ? "列：有重复星星" : "列：还未完成", cols.complete ? "ok" : cols.tooMany ? "bad" : "warn");
        setStatus(regionsStatus, areas.complete ? "区域：全部正确" : areas.tooMany ? "区域：有重复星星" : "区域：还未完成", areas.complete ? "ok" : areas.tooMany ? "bad" : "warn");
        setStatus(touchStatus, touch.clear ? "相邻：无冲突" : "相邻：星星碰在一起", touch.clear ? "ok" : "bad");

        const solved = rows.complete && cols.complete && areas.complete && touch.clear;
        message.textContent = solved ? "完成！所有行、列、区域和相邻规则都满足。" : `已放置 ${stars.size} / 5 颗星。`;
      }

      function buildBoard() {
        board.innerHTML = "";
        cells.length = 0;
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            const cell = document.createElement("button");
            const region = regions[row][col];
            cell.type = "button";
            cell.dataset.key = keyOf(row, col);
            cell.className = [
              "flex aspect-square items-center justify-center border border-slate-100/80 text-4xl font-black transition hover:brightness-125 focus:outline-none focus:ring-4 focus:ring-cyan-300",
              regionColors[region],
            ].join(" ");
            cell.addEventListener("click", () => {
              const key = cell.dataset.key;
              stars.has(key) ? stars.delete(key) : stars.add(key);
              render();
            });
            board.appendChild(cell);
            cells.push(cell);
          }
        }
      }

      resetBtn.addEventListener("click", () => {
        stars.clear();
        render();
      });

      hintBtn.addEventListener("click", () => {
        const missing = [...solution].find((key) => !stars.has(key));
        if (missing) stars.add(missing);
        render();
      });

      buildBoard();
      render();
    </script>
  </body>
</html>
