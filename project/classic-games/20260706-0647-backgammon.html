<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Backgammon Race</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-emerald-950 text-emerald-50">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-emerald-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-yellow-200">Classic Games</p>
          <h1 class="mt-1 text-3xl font-bold">Mini Backgammon Race</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-emerald-800 bg-emerald-900 px-4 py-2">
            <div id="dice" class="text-xl font-bold text-yellow-100">-</div>
            <div class="text-emerald-300">dice</div>
          </div>
          <div class="rounded border border-emerald-800 bg-emerald-900 px-4 py-2">
            <div id="turns" class="text-xl font-bold text-sky-100">0</div>
            <div class="text-emerald-300">turns</div>
          </div>
          <div class="rounded border border-emerald-800 bg-emerald-900 px-4 py-2">
            <div id="borneOff" class="text-xl font-bold text-rose-100">0/2</div>
            <div class="text-emerald-300">off</div>
          </div>
        </div>
      </header>

      <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
        <div class="rounded border border-emerald-800 bg-emerald-900 p-4">
          <div id="track" class="grid grid-cols-8 gap-2"></div>
          <p id="status" class="mt-4 min-h-6 text-sm font-medium text-emerald-100">Roll the dice, then spend each die to move a checker toward home.</p>
        </div>

        <aside class="rounded border border-emerald-800 bg-emerald-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-emerald-300">Moves</h2>
          <div id="moveButtons" class="mt-3 grid gap-2"></div>
          <div class="mt-5 grid gap-3">
            <button id="rollBtn" class="rounded bg-yellow-200 px-4 py-2 font-semibold text-emerald-950 hover:bg-yellow-100">Roll</button>
            <button id="newGameBtn" class="rounded border border-emerald-700 px-4 py-2 font-semibold hover:bg-emerald-800">New Game</button>
          </div>
          <p class="mt-5 text-sm leading-6 text-emerald-300">
            Move two checkers from point 1 to point 12. Exact moves bear checkers off the board.
          </p>
        </aside>
      </section>
    </main>

    <script>
      const finish = 12;
      const track = document.getElementById("track");
      const moveButtons = document.getElementById("moveButtons");
      const diceEl = document.getElementById("dice");
      const turnsEl = document.getElementById("turns");
      const borneOffEl = document.getElementById("borneOff");
      const statusEl = document.getElementById("status");
      const rollBtn = document.getElementById("rollBtn");
      const newGameBtn = document.getElementById("newGameBtn");

      let checkers = [];
      let dice = [];
      let turns = 0;

      function newGame() {
        checkers = [
          { id: "A", point: 1, off: false },
          { id: "B", point: 1, off: false },
        ];
        dice = [];
        turns = 0;
        statusEl.textContent = "Roll the dice, then spend each die to move a checker toward home.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-emerald-100";
        render();
      }

      function rollDice() {
        if (dice.length || gameWon()) return;
        const first = Math.ceil(Math.random() * 6);
        const second = Math.ceil(Math.random() * 6);
        dice = first === second ? [first, first, first, first] : [first, second];
        turns += 1;
        statusEl.textContent = "Choose a legal checker and die.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-yellow-100";
        render();
      }

      function legalMove(checker, die) {
        if (checker.off) return false;
        return checker.point + die <= finish + 1;
      }

      function moveChecker(checkerId, dieIndex) {
        const checker = checkers.find((item) => item.id === checkerId);
        const die = dice[dieIndex];
        if (!checker || die === undefined || !legalMove(checker, die)) return;
        const target = checker.point + die;
        if (target === finish + 1) {
          checker.off = true;
        } else {
          checker.point = target;
        }
        dice.splice(dieIndex, 1);
        if (gameWon()) {
          statusEl.textContent = "Both checkers are borne off.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-yellow-100";
        } else if (!dice.length) {
          statusEl.textContent = "Roll again.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-emerald-100";
        } else if (!hasLegalMove()) {
          dice = [];
          statusEl.textContent = "No legal moves remain. Roll again.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-amber-200";
        }
        render();
      }

      function hasLegalMove() {
        return checkers.some((checker) => dice.some((die) => legalMove(checker, die)));
      }

      function gameWon() {
        return checkers.every((checker) => checker.off);
      }

      function renderTrack() {
        track.innerHTML = "";
        for (let point = 1; point <= finish; point += 1) {
          const occupants = checkers.filter((checker) => checker.point === point && !checker.off);
          const cell = document.createElement("div");
          cell.className = "flex aspect-square flex-col items-center justify-center rounded border border-emerald-800 bg-emerald-950 p-1";
          cell.innerHTML = `<div class="text-xs text-emerald-400">${point}</div><div class="mt-1 flex gap-1">${occupants
            .map((checker) => `<span class="flex h-6 w-6 items-center justify-center rounded-full bg-yellow-200 text-xs font-black text-emerald-950">${checker.id}</span>`)
            .join("")}</div>`;
          track.appendChild(cell);
        }
      }

      function renderMoves() {
        moveButtons.innerHTML = "";
        if (!dice.length) {
          moveButtons.innerHTML = '<div class="rounded bg-emerald-950 p-3 text-sm text-emerald-400">No dice to spend.</div>';
          return;
        }
        checkers.forEach((checker) => {
          dice.forEach((die, index) => {
            const button = document.createElement("button");
            button.type = "button";
            button.disabled = !legalMove(checker, die);
            button.className = [
              "rounded border px-3 py-2 text-left font-semibold",
              legalMove(checker, die) ? "border-yellow-200 bg-emerald-950 hover:bg-emerald-800" : "border-emerald-800 bg-emerald-950 text-emerald-500",
            ].join(" ");
            const target = checker.point + die;
            button.textContent = `${checker.id} +${die} ${target === finish + 1 ? "bear off" : `to ${target}`}`;
            button.addEventListener("click", () => moveChecker(checker.id, index));
            moveButtons.appendChild(button);
          });
        });
      }

      function render() {
        renderTrack();
        renderMoves();
        diceEl.textContent = dice.length ? dice.join(", ") : "-";
        turnsEl.textContent = turns;
        borneOffEl.textContent = `${checkers.filter((checker) => checker.off).length}/${checkers.length}`;
        rollBtn.disabled = Boolean(dice.length) || gameWon();
        rollBtn.className = rollBtn.disabled
          ? "rounded bg-emerald-700 px-4 py-2 font-semibold text-emerald-400"
          : "rounded bg-yellow-200 px-4 py-2 font-semibold text-emerald-950 hover:bg-yellow-100";
      }

      rollBtn.addEventListener("click", rollDice);
      newGameBtn.addEventListener("click", newGame);
      newGame();
    </script>
  </body>
</html>
