<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Dice Race</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-stone-700 bg-stone-900 p-5 shadow-2xl">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Dice Race</h1>
          <p class="mt-1 text-sm text-stone-300">Roll higher than the table to advance. First racer to 30 wins.</p>
        </div>
        <div class="flex gap-2">
          <button id="rollBtn" class="rounded bg-emerald-400 px-4 py-2 text-sm font-bold text-stone-950 hover:bg-emerald-300">Roll</button>
          <button id="resetBtn" class="rounded border border-stone-600 px-4 py-2 text-sm font-bold text-stone-100 hover:bg-stone-800">Reset</button>
        </div>
      </div>

      <div class="mb-5 grid gap-3 sm:grid-cols-3">
        <div class="rounded-lg border border-stone-700 bg-stone-950 p-4 text-center">
          <div class="text-xs uppercase text-stone-400">Your die</div>
          <div id="playerDie" class="mt-2 text-6xl font-black">1</div>
        </div>
        <div class="rounded-lg border border-stone-700 bg-stone-950 p-4 text-center">
          <div class="text-xs uppercase text-stone-400">Table die</div>
          <div id="tableDie" class="mt-2 text-6xl font-black">1</div>
        </div>
        <div class="rounded-lg border border-stone-700 bg-stone-950 p-4">
          <div class="text-xs uppercase text-stone-400">Round</div>
          <div id="round" class="mt-2 text-4xl font-black">1</div>
          <p id="message" class="mt-3 min-h-12 text-sm text-stone-300">Roll to start the race.</p>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <div class="mb-1 flex justify-between text-sm">
            <span>You</span>
            <strong id="playerScore">0</strong>
          </div>
          <div class="h-5 rounded bg-stone-800">
            <div id="playerTrack" class="h-5 rounded bg-emerald-400 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
        <div>
          <div class="mb-1 flex justify-between text-sm">
            <span>Table</span>
            <strong id="tableScore">0</strong>
          </div>
          <div class="h-5 rounded bg-stone-800">
            <div id="tableTrack" class="h-5 rounded bg-rose-400 transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const finish = 30;
    const playerDie = document.getElementById('playerDie');
    const tableDie = document.getElementById('tableDie');
    const roundEl = document.getElementById('round');
    const message = document.getElementById('message');
    const playerScoreEl = document.getElementById('playerScore');
    const tableScoreEl = document.getElementById('tableScore');
    const playerTrack = document.getElementById('playerTrack');
    const tableTrack = document.getElementById('tableTrack');
    const rollBtn = document.getElementById('rollBtn');
    const resetBtn = document.getElementById('resetBtn');
    let player = 0;
    let table = 0;
    let round = 1;
    let finished = false;

    function rollDie() {
      return Math.floor(Math.random() * 6) + 1;
    }

    function resetGame() {
      player = 0;
      table = 0;
      round = 1;
      finished = false;
      rollBtn.disabled = false;
      rollBtn.classList.remove('opacity-50');
      playerDie.textContent = '1';
      tableDie.textContent = '1';
      message.textContent = 'Roll to start the race.';
      render();
    }

    function rollRound() {
      if (finished) return;
      const playerRoll = rollDie();
      const tableRoll = rollDie();
      playerDie.textContent = playerRoll;
      tableDie.textContent = tableRoll;
      if (playerRoll > tableRoll) {
        player += playerRoll;
        message.textContent = `You won the round and moved ${playerRoll} spaces.`;
      } else if (tableRoll > playerRoll) {
        table += tableRoll;
        message.textContent = `The table moved ${tableRoll} spaces.`;
      } else {
        player += 1;
        table += 1;
        message.textContent = 'Tie roll. Both racers move one space.';
      }
      round += 1;
      checkWinner();
      render();
    }

    function checkWinner() {
      if (player >= finish && table >= finish) {
        finished = true;
        message.textContent = player >= table ? 'Photo finish. You win by a nose.' : 'Photo finish. The table wins.';
      } else if (player >= finish) {
        finished = true;
        message.textContent = 'You reached 30 first.';
      } else if (table >= finish) {
        finished = true;
        message.textContent = 'The table reached 30 first.';
      }
      if (finished) {
        rollBtn.disabled = true;
        rollBtn.classList.add('opacity-50');
      }
    }

    function render() {
      roundEl.textContent = round;
      playerScoreEl.textContent = Math.min(player, finish);
      tableScoreEl.textContent = Math.min(table, finish);
      playerTrack.style.width = `${Math.min(100, (player / finish) * 100)}%`;
      tableTrack.style.width = `${Math.min(100, (table / finish) * 100)}%`;
    }

    rollBtn.addEventListener('click', rollRound);
    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
