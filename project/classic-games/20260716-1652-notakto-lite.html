<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Notakto</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col items-center justify-center gap-6 px-4 py-8">
    <section class="w-full rounded-lg border border-slate-800 bg-slate-900 p-5 shadow-2xl shadow-black/30">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-cyan-300">Classic Mini Game</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Notakto</h1>
          <p class="mt-2 max-w-xl text-sm leading-6 text-slate-300">
            两位玩家轮流在空格放置 X。谁造成任意横、竖、斜三连，谁立刻输掉本局。
          </p>
        </div>
        <button id="resetBtn" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-bold text-slate-950 transition hover:bg-cyan-300">
          重新开始
        </button>
      </div>
    </section>

    <section class="grid w-full gap-4 md:grid-cols-[1fr_16rem]">
      <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
        <div id="board" class="grid aspect-square w-full grid-cols-3 gap-3"></div>
      </div>

      <aside class="rounded-lg border border-slate-800 bg-slate-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">当前回合</p>
            <p id="turnLabel" class="mt-1 text-2xl font-bold text-white">玩家 A</p>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">已落子</p>
            <p id="moveLabel" class="mt-1 text-2xl font-bold text-white">0 / 9</p>
          </div>
          <div class="rounded-md bg-slate-800 p-3">
            <p id="status" class="text-sm leading-6 text-slate-200">选择任意空格开始。双方都只能放 X。</p>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const turnLabel = document.getElementById('turnLabel');
    const moveLabel = document.getElementById('moveLabel');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    const lines = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6]
    ];

    let board = Array(9).fill('');
    let player = 0;
    let ended = false;
    let losingLine = [];

    function startGame() {
      board = Array(9).fill('');
      player = 0;
      ended = false;
      losingLine = [];
      statusEl.textContent = '选择任意空格开始。双方都只能放 X。';
      render();
    }

    function render() {
      boardEl.innerHTML = '';
      board.forEach((cell, index) => {
        const button = document.createElement('button');
        const isLosingCell = losingLine.includes(index);
        button.className = [
          'flex aspect-square items-center justify-center rounded-md border text-5xl font-black transition',
          isLosingCell ? 'border-rose-400 bg-rose-500/20 text-rose-200' : 'border-slate-700 bg-slate-800 text-cyan-200',
          !cell && !ended ? 'hover:border-cyan-300 hover:bg-slate-700' : 'cursor-default'
        ].join(' ');
        button.textContent = cell;
        button.setAttribute('aria-label', cell ? `已放置 ${cell}` : `空格 ${index + 1}`);
        button.disabled = ended || Boolean(cell);
        button.addEventListener('click', () => handleMove(index));
        boardEl.appendChild(button);
      });

      turnLabel.textContent = ended ? '本局结束' : `玩家 ${player === 0 ? 'A' : 'B'}`;
      moveLabel.textContent = `${board.filter(Boolean).length} / 9`;
    }

    function handleMove(index) {
      if (ended || board[index]) {
        return;
      }

      board[index] = 'X';
      const result = findLosingLine();

      if (result) {
        ended = true;
        losingLine = result;
        const loser = player === 0 ? 'A' : 'B';
        const winner = player === 0 ? 'B' : 'A';
        statusEl.textContent = `玩家 ${loser} 形成三连，玩家 ${winner} 获胜。`;
      } else if (board.every(Boolean)) {
        ended = true;
        statusEl.textContent = '棋盘已满且没有三连，本局平局。';
      } else {
        player = 1 - player;
        statusEl.textContent = `轮到玩家 ${player === 0 ? 'A' : 'B'}。记住：三连会输。`;
      }

      render();
    }

    function findLosingLine() {
      return lines.find(line => line.every(index => board[index] === 'X')) || null;
    }

    resetBtn.addEventListener('click', startGame);
    startGame();
  </script>
</body>
</html>
