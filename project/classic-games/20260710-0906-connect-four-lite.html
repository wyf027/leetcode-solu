<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Connect Four</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col justify-center px-4 py-8">
    <section class="rounded-lg border border-neutral-700 bg-neutral-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-amber-300">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Connect Four</h1>
        </div>
        <button id="resetBtn" class="rounded bg-amber-400 px-4 py-2 font-semibold text-neutral-950 hover:bg-amber-300">
          Restart
        </button>
      </div>

      <div class="mb-4 grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-neutral-700 bg-neutral-800 p-4">
          <p class="text-sm text-neutral-400">You</p>
          <p class="text-2xl font-bold text-amber-300">Yellow</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-800 p-4">
          <p class="text-sm text-neutral-400">Turn</p>
          <p id="turnText" class="text-2xl font-bold">Your move</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-800 p-4">
          <p class="text-sm text-neutral-400">Computer</p>
          <p class="text-2xl font-bold text-rose-300">Red</p>
        </div>
      </div>

      <div id="columnButtons" class="mb-2 grid grid-cols-7 gap-2"></div>
      <div id="board" class="grid grid-cols-7 gap-2 rounded-lg bg-blue-800 p-3"></div>

      <p id="statusText" class="mt-4 min-h-6 rounded border border-neutral-700 bg-neutral-950 p-3 font-semibold">
        Drop a disc into any open column.
      </p>
    </section>
  </main>

  <script>
    const rows = 6;
    const cols = 7;
    const empty = 0;
    const player = 1;
    const computer = 2;
    const board = Array.from({ length: rows }, () => Array(cols).fill(empty));
    let gameOver = false;

    const boardEl = document.getElementById("board");
    const columnButtons = document.getElementById("columnButtons");
    const statusText = document.getElementById("statusText");
    const turnText = document.getElementById("turnText");
    const resetBtn = document.getElementById("resetBtn");

    function cellClass(value) {
      if (value === player) return "bg-amber-300";
      if (value === computer) return "bg-rose-400";
      return "bg-neutral-900";
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const cell = document.createElement("div");
          cell.className = `aspect-square rounded-full border border-blue-950 ${cellClass(board[row][col])}`;
          boardEl.appendChild(cell);
        }
      }
    }

    function renderColumnButtons() {
      columnButtons.innerHTML = "";
      for (let col = 0; col < cols; col += 1) {
        const button = document.createElement("button");
        button.className = "rounded bg-neutral-800 py-2 font-bold hover:bg-neutral-700 disabled:cursor-not-allowed disabled:opacity-40";
        button.textContent = String(col + 1);
        button.dataset.col = String(col);
        button.disabled = board[0][col] !== empty || gameOver;
        columnButtons.appendChild(button);
      }
    }

    function dropDisc(col, piece) {
      for (let row = rows - 1; row >= 0; row -= 1) {
        if (board[row][col] === empty) {
          board[row][col] = piece;
          return row;
        }
      }
      return -1;
    }

    function hasFour(row, col, piece) {
      const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
      return directions.some(([dr, dc]) => {
        let count = 1;
        for (const sign of [-1, 1]) {
          let r = row + dr * sign;
          let c = col + dc * sign;
          while (r >= 0 && r < rows && c >= 0 && c < cols && board[r][c] === piece) {
            count += 1;
            r += dr * sign;
            c += dc * sign;
          }
        }
        return count >= 4;
      });
    }

    function availableColumns() {
      return Array.from({ length: cols }, (_, index) => index).filter((col) => board[0][col] === empty);
    }

    function finishTurn(row, col, piece) {
      renderBoard();
      if (hasFour(row, col, piece)) {
        gameOver = true;
        statusText.textContent = piece === player ? "You connected four. Match won." : "Computer connected four. Match lost.";
        turnText.textContent = "Game over";
      } else if (availableColumns().length === 0) {
        gameOver = true;
        statusText.textContent = "Board full. Draw game.";
        turnText.textContent = "Draw";
      }
      renderColumnButtons();
    }

    function computerMove() {
      if (gameOver) return;
      const open = availableColumns();
      const col = open[Math.floor(Math.random() * open.length)];
      const row = dropDisc(col, computer);
      statusText.textContent = `Computer dropped in column ${col + 1}.`;
      finishTurn(row, col, computer);
      if (!gameOver) turnText.textContent = "Your move";
    }

    function playerMove(col) {
      if (gameOver || board[0][col] !== empty) return;
      const row = dropDisc(col, player);
      statusText.textContent = `You dropped in column ${col + 1}.`;
      finishTurn(row, col, player);
      if (!gameOver) {
        turnText.textContent = "Computer thinking";
        window.setTimeout(computerMove, 350);
      }
    }

    function resetGame() {
      for (let row = 0; row < rows; row += 1) {
        board[row].fill(empty);
      }
      gameOver = false;
      turnText.textContent = "Your move";
      statusText.textContent = "Drop a disc into any open column.";
      renderBoard();
      renderColumnButtons();
    }

    columnButtons.addEventListener("click", (event) => {
      const button = event.target.closest("[data-col]");
      if (!button) return;
      playerMove(Number(button.dataset.col));
    });

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
