<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Coin Flip Race</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Coin Flip Race</h1>
        <p class="text-sm text-stone-300">Pick heads or tails, flip the coin, and race the house to ten steps.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-stone-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-stone-700 bg-stone-900 p-3 sm:grid-cols-3">
      <div>Round: <b id="roundText">1</b></div>
      <div>Last Flip: <b id="flipText">-</b></div>
      <div id="message">Choose your side, then flip.</div>
    </section>

    <section class="grid gap-4 rounded border border-stone-700 bg-stone-900 p-4">
      <div>
        <div class="mb-1 flex items-center justify-between text-sm">
          <span>You</span><span id="playerScore">0 / 10</span>
        </div>
        <div id="playerTrack" class="grid grid-cols-10 gap-1"></div>
      </div>
      <div>
        <div class="mb-1 flex items-center justify-between text-sm">
          <span>House</span><span id="houseScore">0 / 10</span>
        </div>
        <div id="houseTrack" class="grid grid-cols-10 gap-1"></div>
      </div>
    </section>

    <section class="grid gap-3 sm:grid-cols-[1fr_1fr_auto]">
      <button id="headsBtn" class="rounded bg-sky-300 px-4 py-3 font-semibold text-stone-950 hover:bg-sky-200">Pick Heads</button>
      <button id="tailsBtn" class="rounded bg-rose-300 px-4 py-3 font-semibold text-stone-950 hover:bg-rose-200">Pick Tails</button>
      <button id="flipBtn" class="rounded bg-lime-300 px-5 py-3 font-semibold text-stone-950 hover:bg-lime-200">Flip</button>
    </section>
  </main>

  <script>
    const goal = 10;
    const sides = ["heads", "tails"];
    const sideLabel = { heads: "Heads", tails: "Tails" };
    const el = (id) => document.getElementById(id);
    const roundText = el("roundText");
    const flipText = el("flipText");
    const message = el("message");
    const playerScore = el("playerScore");
    const houseScore = el("houseScore");
    const playerTrack = el("playerTrack");
    const houseTrack = el("houseTrack");
    const headsBtn = el("headsBtn");
    const tailsBtn = el("tailsBtn");
    const flipBtn = el("flipBtn");
    const newGameBtn = el("newGameBtn");

    let playerPick;
    let playerStep;
    let houseStep;
    let round;
    let finished;

    function coinFlip() {
      return sides[Math.floor(Math.random() * sides.length)];
    }

    function setPick(side) {
      if (finished) return;
      playerPick = side;
      message.textContent = `You picked ${sideLabel[side]}. Flip the coin.`;
      render();
    }

    function flipCoin() {
      if (finished) return;
      if (!playerPick) {
        message.textContent = "Pick heads or tails first.";
        return;
      }
      const result = coinFlip();
      const housePick = playerPick === "heads" ? "tails" : "heads";
      flipText.textContent = sideLabel[result];
      if (result === playerPick) {
        playerStep += 1;
        message.textContent = "Your call hit. You move ahead.";
      } else if (result === housePick) {
        houseStep += 1;
        message.textContent = "House hit the opposite side.";
      }
      if (playerStep >= goal || houseStep >= goal) {
        finished = true;
        message.textContent = playerStep >= goal ? "You win the race." : "House wins the race.";
      } else {
        round += 1;
      }
      render();
    }

    function renderTrack(track, score, activeClass) {
      track.innerHTML = Array.from({ length: goal }, (_, index) => {
        const filled = index < score;
        return `<div class="h-6 rounded ${filled ? activeClass : "bg-stone-800"}"></div>`;
      }).join("");
    }

    function render() {
      roundText.textContent = round;
      playerScore.textContent = `${playerStep} / ${goal}`;
      houseScore.textContent = `${houseStep} / ${goal}`;
      headsBtn.className = `rounded px-4 py-3 font-semibold text-stone-950 hover:bg-sky-200 ${playerPick === "heads" ? "bg-sky-100 ring-2 ring-white" : "bg-sky-300"}`;
      tailsBtn.className = `rounded px-4 py-3 font-semibold text-stone-950 hover:bg-rose-200 ${playerPick === "tails" ? "bg-rose-100 ring-2 ring-white" : "bg-rose-300"}`;
      flipBtn.disabled = finished;
      renderTrack(playerTrack, playerStep, "bg-sky-300");
      renderTrack(houseTrack, houseStep, "bg-rose-300");
    }

    function newGame() {
      playerPick = null;
      playerStep = 0;
      houseStep = 0;
      round = 1;
      finished = false;
      flipText.textContent = "-";
      message.textContent = "Choose your side, then flip.";
      render();
    }

    headsBtn.addEventListener("click", () => setPick("heads"));
    tailsBtn.addEventListener("click", () => setPick("tails"));
    flipBtn.addEventListener("click", flipCoin);
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
