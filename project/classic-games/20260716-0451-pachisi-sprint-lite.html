<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Pachisi Sprint</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.18em] text-orange-200">Classic Mini Game</p>
        <h1 class="text-3xl font-bold">Mini Pachisi Sprint</h1>
      </div>
      <button id="resetBtn" class="rounded-md bg-orange-300 px-4 py-2 font-semibold text-indigo-950 hover:bg-orange-200">重新开始</button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_300px]">
      <div class="rounded-lg border border-indigo-700 bg-indigo-900 p-3">
        <div id="track" class="grid grid-cols-5 gap-2"></div>
      </div>

      <aside class="rounded-lg border border-indigo-700 bg-indigo-900 p-4">
        <div class="rounded-md bg-indigo-800 p-3 text-center">
          <p class="text-xs text-indigo-200">骰子</p>
          <p id="dieText" class="mt-1 text-5xl font-black text-orange-200">—</p>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-3 text-center">
          <div class="rounded-md bg-indigo-800 p-3">
            <p class="text-xs text-indigo-200">红方</p>
            <p id="redPos" class="text-2xl font-bold text-rose-200">0</p>
          </div>
          <div class="rounded-md bg-indigo-800 p-3">
            <p class="text-xs text-indigo-200">蓝方</p>
            <p id="bluePos" class="text-2xl font-bold text-sky-200">0</p>
          </div>
        </div>
        <button id="rollBtn" class="mt-4 w-full rounded-md bg-sky-300 px-4 py-3 font-semibold text-indigo-950 hover:bg-sky-200">掷骰前进</button>
        <div class="mt-4 rounded-md bg-indigo-800 p-3">
          <p id="statusText" class="text-sm leading-6 text-indigo-50">掷 1-6 点沿 20 格跑道前进。落到对手格会把对手送回起点，必须精确到达终点。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const trackEl = document.getElementById("track");
    const resetBtn = document.getElementById("resetBtn");
    const rollBtn = document.getElementById("rollBtn");
    const dieTextEl = document.getElementById("dieText");
    const redPosEl = document.getElementById("redPos");
    const bluePosEl = document.getElementById("bluePos");
    const statusTextEl = document.getElementById("statusText");
    const finish = 20;
    const safeSquares = new Set([0, 5, 10, 15, 20]);
    let positions;
    let turn;
    let die;
    let gameOver;

    function playerName(player) {
      return player === "red" ? "红方" : "蓝方";
    }

    function opponent(player) {
      return player === "red" ? "blue" : "red";
    }

    function resetGame() {
      positions = { red: 0, blue: 0 };
      turn = "red";
      die = null;
      gameOver = false;
      render("红方先手：掷骰开始冲刺。");
    }

    function rollDie() {
      if (gameOver) return;
      die = Math.floor(Math.random() * 6) + 1;
      moveCurrent(die);
    }

    function moveCurrent(steps) {
      const start = positions[turn];
      const target = start + steps;
      if (target > finish) {
        const message = playerName(turn) + "掷出 " + steps + "，超过终点，停留原地。";
        turn = opponent(turn);
        render(message);
        return;
      }
      positions[turn] = target;
      let message = playerName(turn) + "前进 " + steps + " 格。";
      const rival = opponent(turn);
      if (!safeSquares.has(target) && target === positions[rival]) {
        positions[rival] = 0;
        message += " 踩中对手，对手回到起点。";
      }
      if (target === finish) {
        gameOver = true;
        render(playerName(turn) + "精确抵达终点，赢得 Pachisi Sprint。");
        return;
      }
      turn = rival;
      render(message);
    }

    function render(message) {
      dieTextEl.textContent = die || "—";
      redPosEl.textContent = positions.red;
      bluePosEl.textContent = positions.blue;
      statusTextEl.textContent = (gameOver ? "" : playerName(turn) + "回合。") + message;
      rollBtn.disabled = gameOver;
      rollBtn.classList.toggle("opacity-50", gameOver);
      trackEl.innerHTML = "";
      for (let i = 0; i <= finish; i++) {
        const cell = document.createElement("div");
        const pieces = [];
        if (positions.red === i) pieces.push("<span class=\"text-rose-200\">红</span>");
        if (positions.blue === i) pieces.push("<span class=\"text-sky-200\">蓝</span>");
        cell.className = [
          "flex aspect-square flex-col items-center justify-center rounded-md border text-sm font-bold",
          safeSquares.has(i) ? "border-orange-200 bg-orange-300/20" : "border-indigo-700 bg-indigo-800"
        ].join(" ");
        cell.innerHTML = "<span class=\"text-xs text-indigo-200\">" + (i === 0 ? "起点" : i === finish ? "终点" : i) + "</span><span class=\"mt-1 min-h-6 text-lg\">" + (pieces.join("") || "·") + "</span>";
        trackEl.appendChild(cell);
      }
    }

    rollBtn.addEventListener("click", rollDie);
    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
