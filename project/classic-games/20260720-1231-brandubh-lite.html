<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Brandubh</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-wider text-emerald-300">Tafl Escape Game</p>
        <h1 class="text-3xl font-bold">Mini Brandubh</h1>
      </div>
      <button id="resetBtn" class="rounded bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400">
        重新开始
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
      <div class="rounded-lg border border-slate-800 bg-slate-900 p-4">
        <div id="board" class="mx-auto grid max-w-[560px] grid-cols-7 gap-1"></div>
      </div>

      <aside class="rounded-lg border border-slate-800 bg-slate-900 p-4">
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="rounded border border-slate-700 p-3">
            <div class="text-xs text-slate-400">守方</div>
            <div id="defenderCount" class="text-2xl font-bold">0</div>
          </div>
          <div class="rounded border border-slate-700 p-3">
            <div class="text-xs text-slate-400">攻方</div>
            <div id="attackerCount" class="text-2xl font-bold">0</div>
          </div>
        </div>

        <div class="mt-4 rounded border border-slate-700 p-3">
          <div class="text-xs text-slate-400">当前回合</div>
          <div id="turnLabel" class="mt-1 text-lg font-semibold">守方</div>
        </div>

        <p id="message" class="mt-4 min-h-16 rounded bg-slate-800 p-3 text-sm leading-6 text-slate-200"></p>

        <div class="mt-4 space-y-2 text-sm text-slate-300">
          <p>棋子像车一样横竖直线移动，不能越过其他棋子。</p>
          <p>守方要让国王到任意角落；攻方用两侧夹击吃子，并围住国王获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const SIZE = 7;
    const EMPTY = "";
    const ATTACKER = "A";
    const DEFENDER = "D";
    const KING = "K";
    const CORNERS = new Set(["0,0", "0,6", "6,0", "6,6"]);
    const THRONE = "3,3";

    const boardEl = document.getElementById("board");
    const turnLabel = document.getElementById("turnLabel");
    const messageEl = document.getElementById("message");
    const defenderCount = document.getElementById("defenderCount");
    const attackerCount = document.getElementById("attackerCount");
    const resetBtn = document.getElementById("resetBtn");

    let board = [];
    let turn = DEFENDER;
    let selected = null;
    let gameOver = false;

    function resetGame() {
      board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
      [[0, 3], [1, 3], [3, 0], [3, 1], [3, 5], [3, 6], [5, 3], [6, 3]].forEach(([r, c]) => board[r][c] = ATTACKER);
      [[2, 3], [3, 2], [3, 4], [4, 3]].forEach(([r, c]) => board[r][c] = DEFENDER);
      board[3][3] = KING;
      turn = DEFENDER;
      selected = null;
      gameOver = false;
      render("守方先手。选择国王或守方棋子。");
    }

    function key(row, col) {
      return `${row},${col}`;
    }

    function isInside(row, col) {
      return row >= 0 && row < SIZE && col >= 0 && col < SIZE;
    }

    function sideOf(piece) {
      if (piece === ATTACKER) return ATTACKER;
      if (piece === DEFENDER || piece === KING) return DEFENDER;
      return EMPTY;
    }

    function isHostileSquare(row, col, againstSide) {
      const square = key(row, col);
      const piece = isInside(row, col) ? board[row][col] : EMPTY;
      if (!isInside(row, col)) return false;
      if (piece && sideOf(piece) !== againstSide) return true;
      return square === THRONE || CORNERS.has(square);
    }

    function canLand(row, col, piece) {
      if (board[row][col]) return false;
      const square = key(row, col);
      if (CORNERS.has(square)) return piece === KING;
      if (square === THRONE) return piece === KING;
      return true;
    }

    function legalTargets(row, col) {
      const piece = board[row][col];
      if (!piece || sideOf(piece) !== turn) return [];
      const targets = [];
      [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
        let nr = row + dr;
        let nc = col + dc;
        while (isInside(nr, nc) && !board[nr][nc]) {
          if (canLand(nr, nc, piece)) targets.push([nr, nc]);
          nr += dr;
          nc += dc;
        }
      });
      return targets;
    }

    function hasMove(side) {
      const oldTurn = turn;
      turn = side;
      const movable = board.some((line, row) => line.some((piece, col) => piece && sideOf(piece) === side && legalTargets(row, col).length));
      turn = oldTurn;
      return movable;
    }

    function captureAround(row, col) {
      const moverSide = sideOf(board[row][col]);
      const captures = [];
      [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
        const er = row + dr;
        const ec = col + dc;
        const br = row + dr * 2;
        const bc = col + dc * 2;
        if (!isInside(er, ec)) return;
        const enemy = board[er][ec];
        if (!enemy || sideOf(enemy) === moverSide) return;
        if (enemy === KING) {
          if (isKingCaptured(er, ec)) captures.push([er, ec]);
          return;
        }
        if (isHostileSquare(br, bc, sideOf(enemy))) captures.push([er, ec]);
      });
      captures.forEach(([r, c]) => board[r][c] = EMPTY);
      return captures.length;
    }

    function isKingCaptured(row, col) {
      return [[-1, 0], [1, 0], [0, -1], [0, 1]].every(([dr, dc]) => {
        const nr = row + dr;
        const nc = col + dc;
        return isHostileSquare(nr, nc, DEFENDER);
      });
    }

    function moveTo(row, col) {
      const targets = legalTargets(selected.row, selected.col).map(([r, c]) => key(r, c));
      if (!targets.includes(key(row, col))) {
        render("该落点不合法：只能横竖直线移动，且不能越子。");
        return;
      }

      const piece = board[selected.row][selected.col];
      board[selected.row][selected.col] = EMPTY;
      board[row][col] = piece;
      selected = null;

      if (piece === KING && CORNERS.has(key(row, col))) {
        gameOver = true;
        render("国王抵达角落，守方获胜。");
        return;
      }

      const captured = captureAround(row, col);
      if (!findKing()) {
        gameOver = true;
        render("国王被围捕，攻方获胜。");
        return;
      }

      turn = turn === DEFENDER ? ATTACKER : DEFENDER;
      if (!hasMove(turn)) {
        gameOver = true;
        render(`${turnName(turn)}无合法移动，${turn === DEFENDER ? "攻方" : "守方"}获胜。`);
        return;
      }
      render(captured ? `吃掉 ${captured} 枚棋子。` : "移动完成。");
    }

    function findKing() {
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          if (board[row][col] === KING) return [row, col];
        }
      }
      return null;
    }

    function handleCell(row, col) {
      if (gameOver) return;
      const piece = board[row][col];
      if (selected && !(selected.row === row && selected.col === col)) {
        moveTo(row, col);
        return;
      }
      if (selected && selected.row === row && selected.col === col) {
        selected = null;
        render("已取消选择。");
        return;
      }
      if (piece && sideOf(piece) === turn && legalTargets(row, col).length) {
        selected = { row, col };
        render("已选择棋子。绿色边框为可走位置。");
      } else {
        render("请选择当前回合且有可走位置的棋子。");
      }
    }

    function turnName(side) {
      return side === DEFENDER ? "守方" : "攻方";
    }

    function pieceLabel(piece) {
      if (piece === KING) return "王";
      return piece === DEFENDER ? "守" : "攻";
    }

    function pieceClass(piece) {
      if (piece === KING) return "bg-amber-300 text-slate-950";
      if (piece === DEFENDER) return "bg-emerald-400 text-slate-950";
      return "bg-slate-200 text-slate-950";
    }

    function render(message) {
      const targets = selected ? new Set(legalTargets(selected.row, selected.col).map(([r, c]) => key(r, c))) : new Set();
      boardEl.innerHTML = "";
      for (let row = 0; row < SIZE; row += 1) {
        for (let col = 0; col < SIZE; col += 1) {
          const square = key(row, col);
          const piece = board[row][col];
          const cell = document.createElement("button");
          cell.type = "button";
          const special = CORNERS.has(square) ? "bg-emerald-950" : square === THRONE ? "bg-amber-950" : "bg-slate-800";
          cell.className = `aspect-square rounded border p-1 transition ${special} ${targets.has(square) ? "border-emerald-300 ring-2 ring-emerald-400" : "border-slate-700"} ${selected && selected.row === row && selected.col === col ? "ring-2 ring-amber-300" : ""}`;
          cell.addEventListener("click", () => handleCell(row, col));
          if (piece) {
            const chip = document.createElement("div");
            chip.className = `flex h-full w-full items-center justify-center rounded text-lg font-bold ${pieceClass(piece)}`;
            chip.textContent = pieceLabel(piece);
            cell.appendChild(chip);
          }
          boardEl.appendChild(cell);
        }
      }

      const flat = board.flat();
      defenderCount.textContent = flat.filter((piece) => piece === DEFENDER || piece === KING).length;
      attackerCount.textContent = flat.filter((piece) => piece === ATTACKER).length;
      turnLabel.textContent = gameOver ? "结束" : turnName(turn);
      messageEl.textContent = message;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
