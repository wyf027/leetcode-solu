<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Numberlink</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-950 text-gray-100">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl items-center justify-center px-4 py-8">
      <section class="w-full rounded border border-gray-700 bg-gray-900 p-5 shadow-2xl shadow-blue-950/40">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-blue-300">Path puzzle</p>
            <h1 class="mt-1 text-3xl font-bold text-white">Mini Numberlink</h1>
          </div>
          <button id="resetBtn" class="rounded bg-blue-400 px-4 py-2 text-sm font-bold text-gray-950 hover:bg-blue-300">
            重开
          </button>
        </div>

        <div id="board" class="mx-auto mt-6 grid w-full max-w-[390px] grid-cols-5 gap-1"></div>

        <div class="mt-5 grid gap-3 sm:grid-cols-3">
          <div class="rounded border border-gray-700 bg-gray-950/70 px-3 py-2 text-center">
            <p class="text-xs text-gray-400">已填写</p>
            <p id="filledCount" class="text-xl font-bold text-blue-200">0</p>
          </div>
          <div class="rounded border border-gray-700 bg-gray-950/70 px-3 py-2 text-center">
            <p class="text-xs text-gray-400">路径错误</p>
            <p id="pathErrors" class="text-xl font-bold text-rose-300">0</p>
          </div>
          <div class="rounded border border-gray-700 bg-gray-950/70 px-3 py-2 text-center">
            <p class="text-xs text-gray-400">完成</p>
            <p id="doneStatus" class="text-xl font-bold text-emerald-200">否</p>
          </div>
        </div>

        <p id="message" class="mt-5 min-h-7 text-center text-sm font-semibold text-gray-300">
          点击空格循环选择 1-3 的颜色。每对相同数字必须由一条不分叉路径连接。
        </p>
      </section>
    </main>

    <script>
      const size = 5;
      const terminals = new Map([
        ["0,0", 1],
        ["4,4", 1],
        ["4,0", 2],
        ["3,2", 2],
        ["2,2", 3],
        ["4,3", 3],
      ]);
      const solution = [
        [1, 1, 1, 1, 1],
        [2, 2, 2, 2, 1],
        [2, 3, 3, 2, 1],
        [2, 3, 2, 2, 1],
        [2, 3, 3, 3, 1],
      ];
      const values = new Map(terminals);
      const board = document.getElementById("board");
      const filledCount = document.getElementById("filledCount");
      const pathErrors = document.getElementById("pathErrors");
      const doneStatus = document.getElementById("doneStatus");
      const message = document.getElementById("message");
      const resetBtn = document.getElementById("resetBtn");

      function key(row, col) {
        return `${row},${col}`;
      }

      function neighbors(row, col) {
        return [
          [row - 1, col],
          [row + 1, col],
          [row, col - 1],
          [row, col + 1],
        ].filter(([r, c]) => r >= 0 && r < size && c >= 0 && c < size);
      }

      function sameNeighbors(cell, value) {
        const [row, col] = cell.split(",").map(Number);
        return neighbors(row, col)
          .map(([r, c]) => key(r, c))
          .filter((next) => values.get(next) === value);
      }

      function connectedCells(start, value) {
        const seen = new Set([start]);
        const queue = [start];
        while (queue.length) {
          const cell = queue.shift();
          sameNeighbors(cell, value).forEach((next) => {
            if (!seen.has(next)) {
              seen.add(next);
              queue.push(next);
            }
          });
        }
        return seen;
      }

      function pathReport() {
        const bad = new Set();
        for (let value = 1; value <= 3; value += 1) {
          const cells = [...values.entries()].filter(([, item]) => item === value).map(([cell]) => cell);
          const ends = [...terminals.entries()].filter(([, item]) => item === value).map(([cell]) => cell);
          if (!cells.length) continue;
          const connected = connectedCells(cells[0], value);
          if (connected.size !== cells.length || !ends.every((cell) => connected.has(cell))) {
            cells.forEach((cell) => bad.add(cell));
          }
          cells.forEach((cell) => {
            const degree = sameNeighbors(cell, value).length;
            const expected = terminals.has(cell) ? 1 : 2;
            if (degree !== expected) bad.add(cell);
          });
        }
        return bad;
      }

      function solved(bad) {
        if (bad.size || values.size !== size * size) return false;
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            if (values.get(key(row, col)) !== solution[row][col]) return false;
          }
        }
        return true;
      }

      function colorClass(value, bad, terminal) {
        if (bad) return "border-rose-300 bg-rose-500 text-white";
        if (!value) return "border-gray-700 bg-gray-800 text-gray-400 hover:bg-gray-700";
        const palette = {
          1: "border-blue-300 bg-blue-200 text-blue-950",
          2: "border-amber-300 bg-amber-200 text-amber-950",
          3: "border-emerald-300 bg-emerald-200 text-emerald-950",
        };
        return `${palette[value]} ${terminal ? "ring-2 ring-white/80" : ""}`;
      }

      function render() {
        const bad = pathReport();
        const complete = solved(bad);
        board.innerHTML = "";
        for (let row = 0; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            const cell = key(row, col);
            const fixed = terminals.has(cell);
            const value = values.get(cell) || "";
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = fixed ? value : value || "";
            button.ariaLabel = fixed ? `端点 ${value}` : value ? `当前颜色 ${value}` : "空格";
            button.className =
              `aspect-square rounded border text-2xl font-black transition focus:outline-none focus:ring-2 focus:ring-blue-300 ${colorClass(value, bad.has(cell), fixed)}`;
            if (fixed) {
              button.disabled = true;
            } else {
              button.addEventListener("click", () => {
                const next = value === "" ? 1 : value === 3 ? "" : value + 1;
                next ? values.set(cell, next) : values.delete(cell);
                render();
              });
            }
            board.appendChild(button);
          }
        }
        filledCount.textContent = values.size;
        pathErrors.textContent = bad.size;
        doneStatus.textContent = complete ? "是" : "否";
        if (complete) {
          message.textContent = "完成！三组数字都由不分叉路径连接，且棋盘已填满。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-emerald-300";
        } else if (bad.size) {
          message.textContent = "红色格子的路径断开、分叉或端点度数不正确。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-rose-300";
        } else {
          message.textContent = "继续填满棋盘，连接每一对相同数字。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-gray-300";
        }
      }

      resetBtn.addEventListener("click", () => {
        values.clear();
        terminals.forEach((value, cell) => values.set(cell, value));
        render();
      });

      render();
    </script>
  </body>
</html>
