<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini ABC Path</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-6 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-lime-300">Classic Games</p>
        <h1 class="text-3xl font-bold">Mini ABC Path</h1>
        <p class="mt-2 max-w-2xl text-sm text-zinc-300">从 A 开始，按上下左右或斜向相邻格依次放到 Y。给定字母不可移动，路径必须连续不跳格。</p>
      </div>
      <div class="flex gap-2">
        <button id="hintBtn" class="rounded-md bg-lime-300 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-lime-200">提示</button>
        <button id="resetBtn" class="rounded-md border border-zinc-600 px-4 py-2 text-sm font-semibold hover:bg-zinc-800">重开</button>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_280px]">
      <div class="rounded-lg border border-zinc-700 bg-zinc-900 p-4">
        <div id="board" class="mx-auto grid aspect-square max-w-[520px] grid-cols-5 gap-2 rounded-md bg-zinc-800 p-2"></div>
      </div>

      <aside class="rounded-lg border border-zinc-700 bg-zinc-900 p-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-md bg-zinc-800 p-3">
            <p class="text-xs text-zinc-400">下一步</p>
            <p id="nextLetter" class="text-2xl font-bold text-lime-300">B</p>
          </div>
          <div class="rounded-md bg-zinc-800 p-3">
            <p class="text-xs text-zinc-400">状态</p>
            <p id="stateBadge" class="text-2xl font-bold text-amber-300">进行中</p>
          </div>
        </div>
        <div class="mt-4">
          <h2 class="text-sm font-semibold">规则检查</h2>
          <ul id="checks" class="mt-3 space-y-2 text-sm text-zinc-300"></ul>
        </div>
        <div class="mt-5 rounded-md border border-zinc-700 p-3 text-xs leading-5 text-zinc-400">
          点击与最后一个字母相邻的空格放入下一字母；点击最后一个非给定字母可撤回一步。
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXY".split("");
    const solutionPath = [
      [0, 0], [0, 1], [1, 0], [2, 0], [1, 1],
      [0, 2], [0, 3], [1, 2], [2, 1], [3, 0],
      [4, 0], [3, 1], [4, 1], [4, 2], [3, 2],
      [2, 2], [1, 3], [0, 4], [1, 4], [2, 3],
      [3, 3], [4, 3], [3, 4], [2, 4], [4, 4],
    ];
    const fixedIndexes = new Set([0, 5, 10, 15, 20, 24]);
    const fixedCells = new Map([...fixedIndexes].map((index) => [key(...solutionPath[index]), letters[index]]));
    let placed = [];
    let hinted = false;

    function key(row, col) {
      return `${row},${col}`;
    }

    function resetGame() {
      placed = [0];
      hinted = false;
      render();
    }

    function letterAt(row, col) {
      const cellKey = key(row, col);
      for (const index of placed) {
        if (key(...solutionPath[index]) === cellKey) return letters[index];
      }
      return fixedCells.get(cellKey) || "";
    }

    function indexAt(row, col) {
      const cellKey = key(row, col);
      return placed.find((index) => key(...solutionPath[index]) === cellKey) ?? -1;
    }

    function isAdjacent(a, b) {
      return Math.abs(a[0] - b[0]) <= 1 && Math.abs(a[1] - b[1]) <= 1 && key(...a) !== key(...b);
    }

    function nextIndex() {
      return placed.length;
    }

    function canPlace(row, col) {
      const index = nextIndex();
      if (index >= letters.length) return false;
      const cellKey = key(row, col);
      const fixedLetter = fixedCells.get(cellKey);
      if (letterAt(row, col) && fixedLetter !== letters[index]) return false;
      if (key(...solutionPath[index]) !== cellKey) return false;
      return isAdjacent(solutionPath[index - 1], [row, col]);
    }

    function clickCell(row, col) {
      const currentIndex = indexAt(row, col);
      const lastIndex = placed[placed.length - 1];
      if (currentIndex === lastIndex && currentIndex > 0 && !fixedIndexes.has(currentIndex)) {
        placed.pop();
        render();
        return;
      }
      if (canPlace(row, col)) {
        placed.push(nextIndex());
        render();
      }
    }

    function useHint() {
      const index = nextIndex();
      if (index < letters.length) {
        placed.push(index);
        hinted = true;
        render();
      }
    }

    function pathReport() {
      let sequential = placed.every((value, index) => value === index);
      let adjacent = true;
      for (let index = 1; index < placed.length; index += 1) {
        adjacent = adjacent && isAdjacent(solutionPath[index - 1], solutionPath[index]);
      }
      return { sequential, adjacent };
    }

    function fixedReport() {
      return [...fixedIndexes].every((index) => {
        const [row, col] = solutionPath[index];
        return fixedCells.get(key(row, col)) === letters[index];
      });
    }

    function puzzleStats() {
      const report = pathReport();
      return {
        complete: placed.length === letters.length,
        sequential: report.sequential,
        adjacent: report.adjacent,
        fixedOk: fixedReport(),
        solved: placed.length === letters.length && report.sequential && report.adjacent && fixedReport(),
      };
    }

    function renderBoard(stats) {
      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";
      const next = nextIndex();
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const value = letterAt(row, col);
          const cellIndex = indexAt(row, col);
          const isFixed = fixedCells.has(key(row, col));
          const isNext = next < letters.length && key(...solutionPath[next]) === key(row, col);
          const button = document.createElement("button");
          button.type = "button";
          button.className = [
            "flex aspect-square items-center justify-center rounded-md border text-2xl font-black transition",
            value ? "border-zinc-700 bg-lime-200 text-zinc-950" : "border-zinc-700 bg-zinc-950 text-zinc-500 hover:bg-zinc-800",
            isFixed ? "ring-2 ring-lime-400" : "",
            isNext ? "outline outline-2 outline-offset-2 outline-amber-300" : "",
            cellIndex === placed[placed.length - 1] ? "shadow-lg shadow-lime-400/30" : "",
            stats.solved ? "brightness-110" : "",
          ].join(" ");
          button.textContent = value;
          button.addEventListener("click", () => clickCell(row, col));
          boardEl.appendChild(button);
        }
      }
    }

    function renderChecks(stats) {
      const checks = [
        ["字母顺序从 A 到 Y 连续", stats.sequential],
        ["每一步都落在相邻格", stats.adjacent],
        ["给定字母位置固定", stats.fixedOk],
        ["全部 25 个字母已放置", stats.complete],
      ];
      document.getElementById("checks").innerHTML = checks
        .map(([label, ok]) => `<li class="${ok ? "text-lime-300" : "text-orange-300"}">${ok ? "OK" : "!"} ${label}</li>`)
        .join("");
    }

    function render() {
      const stats = puzzleStats();
      renderBoard(stats);
      renderChecks(stats);
      const next = nextIndex();
      document.getElementById("nextLetter").textContent = next < letters.length ? letters[next] : "完成";
      const badge = document.getElementById("stateBadge");
      badge.textContent = stats.solved ? (hinted ? "完成" : "完美") : "进行中";
      badge.className = `text-2xl font-bold ${stats.solved ? "text-lime-300" : "text-amber-300"}`;
    }

    document.getElementById("resetBtn").addEventListener("click", resetGame);
    document.getElementById("hintBtn").addEventListener("click", useHint);
    resetGame();
  </script>
</body>
</html>
