<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Front Line Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col justify-center gap-4 px-4 py-6">
    <section class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p class="text-sm uppercase tracking-[0.24em] text-lime-300">Classic infantry advance</p>
        <h1 class="text-2xl font-bold text-white">Mini Front Line</h1>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <p class="text-stone-400">Score</p>
          <p id="score" class="text-lg font-bold text-lime-300">0</p>
        </div>
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <p class="text-stone-400">Lives</p>
          <p id="lives" class="text-lg font-bold text-red-300">3</p>
        </div>
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <p class="text-stone-400">Grenades</p>
          <p id="grenades" class="text-lg font-bold text-amber-300">4</p>
        </div>
        <div class="rounded border border-stone-700 bg-stone-900 px-3 py-2">
          <p class="text-stone-400">Sector</p>
          <p id="sector" class="text-lg font-bold text-cyan-300">1</p>
        </div>
      </div>
    </section>

    <div class="rounded border border-stone-700 bg-stone-900 p-3 shadow-2xl shadow-lime-950/30">
      <canvas id="game" width="900" height="560" class="block w-full rounded bg-stone-950"></canvas>
    </div>

    <section class="flex flex-wrap items-center justify-between gap-3 text-sm text-stone-300">
      <p>Arrow keys/WASD move. Space fires forward. Shift throws a grenade toward the nearest bunker.</p>
      <button id="restart" class="rounded bg-lime-400 px-4 py-2 font-semibold text-stone-950 hover:bg-lime-300">Restart</button>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const grenadesEl = document.getElementById("grenades");
    const sectorEl = document.getElementById("sector");
    const restartBtn = document.getElementById("restart");
    const keys = new Set();

    const player = { x: 450, y: 500, r: 12, vx: 0, vy: 0, cool: 0, inv: 0 };
    let bullets = [];
    let enemyBullets = [];
    let grenades = [];
    let explosions = [];
    let enemies = [];
    let bunkers = [];
    let smoke = [];
    let scroll = 0;
    let score = 0;
    let lives = 3;
    let grenadeCount = 4;
    let sector = 1;
    let message = "Advance to the north line.";
    let gameOver = false;
    let lastTime = 0;

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      grenadesEl.textContent = grenadeCount;
      sectorEl.textContent = sector;
    }

    function resetSector() {
      enemies = Array.from({ length: 7 + sector * 2 }, (_, i) => ({
        x: 80 + (i * 119) % 740,
        y: -60 - i * 78,
        r: 11,
        vx: i % 2 ? 42 : -42,
        cool: 0.5 + (i % 3) * 0.35,
        hp: 1
      }));
      bunkers = Array.from({ length: 3 + Math.min(sector, 4) }, (_, i) => ({
        x: 120 + (i * 205) % 650,
        y: -180 - i * 220,
        w: 50,
        h: 32,
        hp: 2,
        cool: 1.1 + i * 0.3
      }));
      bullets = [];
      enemyBullets = [];
      grenades = [];
      explosions = [];
      smoke = [];
    }

    function reset() {
      player.x = 450;
      player.y = 500;
      player.vx = 0;
      player.vy = 0;
      player.cool = 0;
      player.inv = 0;
      scroll = 0;
      score = 0;
      lives = 3;
      grenadeCount = 4;
      sector = 1;
      message = "Advance to the north line.";
      gameOver = false;
      resetSector();
      updateHud();
    }

    function fireBullet() {
      if (player.cool > 0 || gameOver) return;
      bullets.push({ x: player.x, y: player.y - 15, vx: 0, vy: -460, r: 4, life: 1.1 });
      player.cool = 0.16;
    }

    function throwGrenade() {
      if (grenadeCount <= 0 || gameOver) return;
      grenadeCount -= 1;
      let target = null;
      for (const b of bunkers) {
        if (b.hp > 0 && (!target || b.y > target.y)) target = b;
      }
      const tx = target ? target.x + target.w / 2 : player.x;
      const ty = target ? target.y + target.h / 2 : player.y - 145;
      grenades.push({ x: player.x, y: player.y - 12, tx, ty, t: 0, fuse: 0.62 });
      message = "Grenade out.";
      updateHud();
    }

    function damagePlayer() {
      if (player.inv > 0 || gameOver) return;
      lives -= 1;
      player.inv = 1.4;
      enemyBullets = [];
      player.x = 450;
      player.y = 500;
      message = lives > 0 ? "Hit. Back to the tree line." : "Line broken. Press restart.";
      updateHud();
      if (lives <= 0) gameOver = true;
    }

    function explode(x, y, radius) {
      explosions.push({ x, y, radius: 18, max: radius, life: 0.48 });
      for (const e of enemies) {
        if (e.hp > 0 && Math.hypot(e.x - x, e.y - y) < radius) {
          e.hp = 0;
          score += 90;
        }
      }
      for (const b of bunkers) {
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        if (b.hp > 0 && Math.hypot(cx - x, cy - y) < radius + 20) {
          b.hp = 0;
          score += 180;
        }
      }
      enemyBullets = enemyBullets.filter((shot) => Math.hypot(shot.x - x, shot.y - y) > radius);
      updateHud();
    }

    function spawnEnemyShot(x, y, speed) {
      const angle = Math.atan2(player.y - y, player.x - x);
      enemyBullets.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: 4, life: 3 });
    }

    function updatePlayer(dt) {
      const left = keys.has("ArrowLeft") || keys.has("a");
      const right = keys.has("ArrowRight") || keys.has("d");
      const up = keys.has("ArrowUp") || keys.has("w");
      const down = keys.has("ArrowDown") || keys.has("s");
      const mx = (right ? 1 : 0) - (left ? 1 : 0);
      const my = (down ? 1 : 0) - (up ? 1 : 0);
      const len = Math.hypot(mx, my) || 1;
      player.x += (mx / len) * 210 * dt;
      player.y += (my / len) * 210 * dt;
      player.x = Math.max(38, Math.min(canvas.width - 38, player.x));
      player.y = Math.max(62, Math.min(canvas.height - 42, player.y));
      if (player.y < 82) {
        sector += 1;
        grenadeCount = Math.min(6, grenadeCount + 2);
        player.y = 500;
        scroll = 0;
        message = "Sector cleared. New line ahead.";
        resetSector();
        updateHud();
      }
      player.cool = Math.max(0, player.cool - dt);
      player.inv = Math.max(0, player.inv - dt);
    }

    function updateScroll(dt) {
      scroll += (30 + sector * 8) * dt;
      for (const e of enemies) e.y += (30 + sector * 8) * dt;
      for (const b of bunkers) b.y += (30 + sector * 8) * dt;
      for (const p of smoke) p.y += 18 * dt;
      if (enemies.filter((e) => e.hp > 0 && e.y < canvas.height).length < 5) {
        enemies.push({
          x: 80 + Math.random() * 740,
          y: -70,
          r: 11,
          vx: Math.random() > 0.5 ? 48 : -48,
          cool: 0.6,
          hp: 1
        });
      }
    }

    function updateEnemies(dt) {
      for (const e of enemies) {
        if (e.hp <= 0) continue;
        e.x += e.vx * dt;
        if (e.x < 55 || e.x > canvas.width - 55) e.vx *= -1;
        e.cool -= dt;
        if (e.cool <= 0 && e.y > 35 && e.y < canvas.height - 30) {
          spawnEnemyShot(e.x, e.y, 120 + sector * 15);
          e.cool = Math.max(0.48, 1.5 - sector * 0.07 + Math.random() * 0.45);
        }
        if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r) damagePlayer();
      }
      for (const b of bunkers) {
        if (b.hp <= 0) continue;
        b.cool -= dt;
        if (b.cool <= 0 && b.y > 25 && b.y < canvas.height - 30) {
          spawnEnemyShot(b.x + b.w / 2, b.y + b.h, 100 + sector * 14);
          b.cool = Math.max(0.7, 1.75 - sector * 0.07);
        }
        const cx = b.x + b.w / 2;
        const cy = b.y + b.h / 2;
        if (Math.abs(player.x - cx) < b.w / 2 + player.r && Math.abs(player.y - cy) < b.h / 2 + player.r) damagePlayer();
      }
    }

    function updateProjectiles(dt) {
      for (const bullet of bullets) {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;
        for (const e of enemies) {
          if (e.hp > 0 && Math.hypot(e.x - bullet.x, e.y - bullet.y) < e.r + bullet.r) {
            e.hp = 0;
            bullet.life = 0;
            score += 80;
          }
        }
        for (const b of bunkers) {
          if (b.hp > 0 && bullet.x > b.x && bullet.x < b.x + b.w && bullet.y > b.y && bullet.y < b.y + b.h) {
            b.hp -= 1;
            bullet.life = 0;
            if (b.hp <= 0) score += 150;
          }
        }
      }
      for (const shot of enemyBullets) {
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
        shot.life -= dt;
        if (Math.hypot(shot.x - player.x, shot.y - player.y) < shot.r + player.r) {
          shot.life = 0;
          damagePlayer();
        }
      }
      for (const grenade of grenades) {
        grenade.t += dt / grenade.fuse;
        grenade.x += (grenade.tx - grenade.x) * 4.2 * dt;
        grenade.y += (grenade.ty - grenade.y) * 4.2 * dt - Math.sin(grenade.t * Math.PI) * 1.8;
        if (grenade.t >= 1) {
          grenade.done = true;
          explode(grenade.x, grenade.y, 110);
        }
      }
      for (const blast of explosions) {
        blast.life -= dt;
        blast.radius += (blast.max - blast.radius) * 7 * dt;
      }
      bullets = bullets.filter((b) => b.life > 0 && b.y > -20);
      enemyBullets = enemyBullets.filter((s) => s.life > 0 && s.x > -20 && s.x < canvas.width + 20 && s.y > -20 && s.y < canvas.height + 20);
      grenades = grenades.filter((g) => !g.done);
      explosions = explosions.filter((e) => e.life > 0);
      enemies = enemies.filter((e) => e.y < canvas.height + 80 && e.hp > 0);
      bunkers = bunkers.filter((b) => b.y < canvas.height + 80 && b.hp > 0);
      updateHud();
    }

    function update(dt) {
      if (gameOver) return;
      if (keys.has(" ")) fireBullet();
      updatePlayer(dt);
      updateScroll(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      smoke.push({ x: 65 + Math.random() * 770, y: -20, r: 8 + Math.random() * 18, life: 2.2 });
      for (const p of smoke) p.life -= dt;
      smoke = smoke.filter((p) => p.life > 0);
    }

    function drawTerrain() {
      ctx.fillStyle = "#1c1917";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#4d3b25";
      ctx.fillRect(166, 0, 568, canvas.height);
      ctx.fillStyle = "#31502d";
      for (let y = -70 + (scroll % 70); y < canvas.height; y += 70) {
        ctx.fillRect(112, y, 42, 19);
        ctx.fillRect(746, y + 31, 50, 18);
        ctx.fillRect(212, y + 44, 22, 10);
        ctx.fillRect(666, y + 8, 24, 11);
      }
      ctx.fillStyle = "rgba(132, 204, 22, 0.17)";
      ctx.fillRect(236, 20, 428, 36);
      ctx.fillStyle = "#d9f99d";
      ctx.font = "bold 14px system-ui";
      ctx.fillText("NORTH LINE", 408, 43);
      for (const p of smoke) {
        ctx.fillStyle = `rgba(120, 113, 108, ${p.life / 5})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      if (player.inv > 0 && Math.floor(player.inv * 12) % 2) ctx.globalAlpha = 0.45;
      ctx.fillStyle = "#84cc16";
      ctx.fillRect(-8, -10, 16, 22);
      ctx.fillStyle = "#ecfccb";
      ctx.beginPath();
      ctx.arc(0, -15, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#fefce8";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(0, -27);
      ctx.stroke();
      ctx.restore();
    }

    function drawEnemies() {
      ctx.fillStyle = "#ef4444";
      for (const e of enemies) {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#7f1d1d";
        ctx.fillRect(e.x - 5, e.y - 3, 10, 12);
        ctx.fillStyle = "#ef4444";
      }
      for (const b of bunkers) {
        ctx.fillStyle = "#78716c";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = "#a8a29e";
        ctx.fillRect(b.x + 16, b.y - 8, 18, 8);
      }
    }

    function drawProjectiles() {
      ctx.fillStyle = "#fef9c3";
      for (const bullet of bullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, bullet.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#fb7185";
      for (const shot of enemyBullets) {
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#facc15";
      for (const grenade of grenades) {
        ctx.beginPath();
        ctx.arc(grenade.x, grenade.y, 6, 0, Math.PI * 2);
        ctx.fill();
      }
      for (const blast of explosions) {
        ctx.strokeStyle = `rgba(250, 204, 21, ${blast.life * 2})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(blast.x, blast.y, blast.radius, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function draw() {
      drawTerrain();
      drawEnemies();
      drawProjectiles();
      drawPlayer();
      ctx.fillStyle = "rgba(28, 25, 23, 0.76)";
      ctx.fillRect(16, 16, 430, 34);
      ctx.fillStyle = "#fafaf9";
      ctx.font = "16px system-ui";
      ctx.fillText(message, 28, 39);
      if (gameOver) {
        ctx.fillStyle = "rgba(28, 25, 23, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fafaf9";
        ctx.font = "bold 44px system-ui";
        ctx.fillText("Advance Halted", 302, 262);
        ctx.font = "20px system-ui";
        ctx.fillText("Press Restart to push the line again.", 302, 300);
      }
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "Shift"].includes(event.key)) event.preventDefault();
      keys.add(event.key);
      if (event.key === "Shift") throwGrenade();
    });
    addEventListener("keyup", (event) => keys.delete(event.key));
    restartBtn.addEventListener("click", reset);
    canvas.addEventListener("pointermove", (event) => {
      if (!event.buttons) return;
      const rect = canvas.getBoundingClientRect();
      player.x = (event.clientX - rect.left) / rect.width * canvas.width;
      player.y = (event.clientY - rect.top) / rect.height * canvas.height;
    });
    canvas.addEventListener("pointerdown", fireBullet);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
