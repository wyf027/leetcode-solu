<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Cannon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Mini Cannon</h1>
        <p class="mt-1 text-sm text-slate-400">士兵前进、横移或斜吃；三枚连成炮后可越过空格远程射击。</p>
      </div>
      <button id="resetBtn" class="rounded bg-rose-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-rose-300">重新开始</button>
    </header>

    <section class="grid gap-4 md:grid-cols-[1fr_280px]">
      <div class="rounded border border-slate-800 bg-slate-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-6 gap-2"></div>
      </div>

      <aside class="space-y-3 rounded border border-slate-800 bg-slate-900 p-4">
        <div>
          <p class="text-xs uppercase text-slate-500">当前回合</p>
          <p id="turnText" class="text-xl font-bold"></p>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="rounded bg-slate-800 p-3">
            <p class="text-slate-400">蓝方</p>
            <p id="blueCount" class="text-2xl font-bold text-sky-300"></p>
          </div>
          <div class="rounded bg-slate-800 p-3">
            <p class="text-slate-400">红方</p>
            <p id="redCount" class="text-2xl font-bold text-rose-300"></p>
          </div>
        </div>
        <div class="rounded bg-slate-950 p-3 text-sm text-slate-300">
          <p class="font-semibold text-slate-100">目标</p>
          <p class="mt-1">抵达对方底线，或消灭对手全部士兵。</p>
        </div>
        <p id="message" class="min-h-16 rounded bg-slate-950 p-3 text-sm text-slate-300"></p>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const blueCount = document.getElementById("blueCount");
    const redCount = document.getElementById("redCount");
    const message = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");
    const players = {
      B: { name: "蓝方", goal: 0, forward: -1, color: "bg-sky-400 text-slate-950" },
      R: { name: "红方", goal: size - 1, forward: 1, color: "bg-rose-400 text-slate-950" }
    };
    const axes = [[1, 0], [0, 1], [1, 1], [1, -1]];
    let board;
    let turn;
    let selected;
    let legalTargets;
    let gameOver;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(""));
      for (let c = 0; c < size; c += 1) {
        board[0][c] = "R";
        board[1][c] = "R";
        board[4][c] = "B";
        board[5][c] = "B";
      }
      turn = "B";
      selected = null;
      legalTargets = [];
      gameOver = false;
      message.textContent = "蓝方先手：选择一枚士兵移动、吃子或用三子成炮射击。";
      render();
    }

    function inBounds(r, c) {
      return r >= 0 && r < size && c >= 0 && c < size;
    }

    function counts() {
      return board.flat().reduce((acc, cell) => {
        if (cell) acc[cell] += 1;
        return acc;
      }, { B: 0, R: 0 });
    }

    function isEnemy(cell, player = turn) {
      return cell && cell !== player;
    }

    function addTarget(targets, r, c, type) {
      if (!inBounds(r, c)) return;
      if (!targets.some(t => t.r === r && t.c === c)) targets.push({ r, c, type });
    }

    function isCannonMember(r, c, dr, dc, player = turn) {
      for (let offset = -2; offset <= 0; offset += 1) {
        const cells = [0, 1, 2].map(step => [r + (offset + step) * dr, c + (offset + step) * dc]);
        if (cells.every(([cr, cc]) => inBounds(cr, cc) && board[cr][cc] === player)) return true;
      }
      return false;
    }

    function cannonShots(r, c, player = turn) {
      const shots = [];
      axes.forEach(([dr, dc]) => {
        if (!isCannonMember(r, c, dr, dc, player)) return;
        [[dr, dc], [-dr, -dc]].forEach(([sr, sc]) => {
          let nr = r + sr;
          let nc = c + sc;
          while (inBounds(nr, nc) && board[nr][nc] === player) {
            nr += sr;
            nc += sc;
          }
          let gap = 0;
          while (inBounds(nr, nc) && board[nr][nc] === "") {
            gap += 1;
            nr += sr;
            nc += sc;
          }
          if (gap > 0 && inBounds(nr, nc) && isEnemy(board[nr][nc], player)) addTarget(shots, nr, nc, "shoot");
        });
      });
      return shots;
    }

    function legalMoves(r, c, player = turn) {
      if (board[r][c] !== player) return [];
      const targets = [];
      const forward = players[player].forward;
      [[forward, 0], [0, -1], [0, 1]].forEach(([dr, dc]) => {
        const nr = r + dr;
        const nc = c + dc;
        if (inBounds(nr, nc) && board[nr][nc] === "") addTarget(targets, nr, nc, "move");
      });
      [[forward, -1], [forward, 1]].forEach(([dr, dc]) => {
        const nr = r + dr;
        const nc = c + dc;
        if (inBounds(nr, nc) && isEnemy(board[nr][nc], player)) addTarget(targets, nr, nc, "capture");
      });
      cannonShots(r, c, player).forEach(t => addTarget(targets, t.r, t.c, t.type));
      return targets;
    }

    function allMoves(player = turn) {
      const moves = [];
      board.forEach((row, r) => row.forEach((cell, c) => {
        if (cell === player) legalMoves(r, c, player).forEach(target => moves.push({ from: [r, c], target }));
      }));
      return moves;
    }

    function applyMove(from, target) {
      const piece = board[from[0]][from[1]];
      if (target.type === "shoot") {
        board[target.r][target.c] = "";
      } else {
        board[target.r][target.c] = piece;
        board[from[0]][from[1]] = "";
      }
      selected = null;
      legalTargets = [];
      checkGame(piece);
      if (!gameOver) {
        turn = turn === "B" ? "R" : "B";
        if (allMoves(turn).length === 0) {
          gameOver = true;
          message.textContent = `${players[turn].name} 无合法行动，${players[turn === "B" ? "R" : "B"].name} 获胜。`;
        } else {
          message.textContent = `${players[turn].name} 行动。`;
        }
      }
      render();
    }

    function checkGame(lastPlayer) {
      const tally = counts();
      if (tally.B === 0 || tally.R === 0) {
        gameOver = true;
        message.textContent = `${tally.B === 0 ? "红方" : "蓝方"} 获胜。`;
        return;
      }
      if (board[players[lastPlayer].goal].includes(lastPlayer)) {
        gameOver = true;
        message.textContent = `${players[lastPlayer].name} 抵达底线并获胜。`;
      }
    }

    function handleCell(r, c) {
      if (gameOver) return;
      const target = legalTargets.find(t => t.r === r && t.c === c);
      if (selected && target) {
        applyMove(selected, target);
        return;
      }
      if (board[r][c] !== turn) {
        message.textContent = "请选择当前回合自己的士兵。";
        return;
      }
      selected = [r, c];
      legalTargets = legalMoves(r, c);
      message.textContent = legalTargets.length
        ? `已选中士兵：绿色为普通移动，黄色为吃子，紫色为炮击。`
        : "这枚士兵没有合法行动。";
      render();
    }

    function render() {
      const tally = counts();
      boardEl.innerHTML = "";
      board.forEach((row, r) => row.forEach((cell, c) => {
        const button = document.createElement("button");
        const dark = (r + c) % 2 === 0;
        const isSelected = selected && selected[0] === r && selected[1] === c;
        const target = legalTargets.find(t => t.r === r && t.c === c);
        const targetClass = target?.type === "shoot"
          ? "ring-4 ring-fuchsia-300"
          : target?.type === "capture"
            ? "ring-4 ring-amber-300"
            : target
              ? "ring-4 ring-emerald-300"
              : "";
        button.className = `relative flex aspect-square items-center justify-center rounded border text-lg font-bold transition ${dark ? "border-slate-700 bg-slate-800" : "border-slate-800 bg-slate-700"} ${isSelected ? "ring-4 ring-white" : targetClass || "hover:border-rose-300"}`;
        button.setAttribute("aria-label", `row ${r + 1} column ${c + 1}`);
        if (cell) {
          const stone = document.createElement("span");
          stone.className = `flex h-10 w-10 items-center justify-center rounded-full shadow ${players[cell].color}`;
          stone.textContent = cell;
          button.appendChild(stone);
        }
        button.addEventListener("click", () => handleCell(r, c));
        boardEl.appendChild(button);
      }));
      turnText.textContent = players[turn].name;
      blueCount.textContent = tally.B;
      redCount.textContent = tally.R;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
