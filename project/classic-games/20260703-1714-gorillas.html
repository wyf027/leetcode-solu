<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Gorillas</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-indigo-950 text-indigo-50">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-4 p-4">
      <section class="w-full rounded-lg border border-indigo-700 bg-indigo-900/90 p-4 shadow-xl">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Gorillas</h1>
            <p class="text-sm text-indigo-200">调角度和力度，抛出香蕉击中右侧对手。</p>
          </div>
          <div class="flex gap-3 text-sm">
            <span>命中 <strong id="score">0</strong>/3</span>
            <span>回合 <strong id="turns">0</strong></span>
            <span id="status">瞄准中</span>
          </div>
        </div>

        <canvas id="game" width="520" height="420" class="w-full rounded-md border border-indigo-700 bg-slate-950"></canvas>

        <div class="mt-3 grid gap-3 sm:grid-cols-2">
          <label class="text-sm">
            角度 <span id="angleValue">45</span>
            <input id="angle" type="range" min="20" max="80" value="45" class="w-full accent-amber-400" />
          </label>
          <label class="text-sm">
            力度 <span id="powerValue">68</span>
            <input id="power" type="range" min="40" max="90" value="68" class="w-full accent-amber-400" />
          </label>
        </div>
        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="throwBtn" class="rounded bg-amber-400 px-3 py-2 font-semibold text-slate-950 hover:bg-amber-300">投掷</button>
          <button id="restartBtn" class="rounded bg-indigo-100 px-3 py-2 font-semibold text-slate-950 hover:bg-white">重新开始</button>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const turnsEl = document.getElementById("turns");
      const statusEl = document.getElementById("status");
      const angleInput = document.getElementById("angle");
      const powerInput = document.getElementById("power");
      const angleValue = document.getElementById("angleValue");
      const powerValue = document.getElementById("powerValue");
      let buildings;
      let player;
      let target;
      let banana;
      let score;
      let turns;
      let wind;
      let running;
      let message;

      function resetGame() {
        buildings = buildSkyline();
        player = makeGorilla(1);
        target = makeGorilla(buildings.length - 2);
        banana = null;
        score = 0;
        turns = 0;
        wind = Math.random() * 0.08 - 0.04;
        running = true;
        message = "";
        updateHud();
      }

      function buildSkyline() {
        const widths = [48, 54, 42, 58, 48, 52, 46, 56, 44, 50];
        let x = 14;
        return widths.map((w, index) => {
          const h = 120 + ((index * 37) % 120);
          const block = { x, y: canvas.height - h, w, h };
          x += w + 2;
          return block;
        });
      }

      function makeGorilla(index) {
        const building = buildings[index];
        return { x: building.x + building.w / 2, y: building.y - 18, r: 15 };
      }

      function updateHud() {
        scoreEl.textContent = score;
        turnsEl.textContent = turns;
        angleValue.textContent = angleInput.value;
        powerValue.textContent = powerInput.value;
        statusEl.textContent = message || (banana ? "飞行中" : "瞄准中");
      }

      function throwBanana() {
        if (!running || banana) return;
        const angle = (Number(angleInput.value) * Math.PI) / 180;
        const power = Number(powerInput.value) / 7;
        banana = {
          x: player.x,
          y: player.y - 4,
          vx: Math.cos(angle) * power,
          vy: -Math.sin(angle) * power,
          r: 5,
        };
        turns += 1;
        updateHud();
      }

      function updateBanana() {
        if (!banana) return;
        banana.x += banana.vx;
        banana.y += banana.vy;
        banana.vy += 0.18;
        banana.vx += wind;

        if (Math.hypot(banana.x - target.x, banana.y - target.y) < target.r + banana.r) {
          score += 1;
          message = score >= 3 ? "三连命中" : "命中";
          banana = null;
          if (score >= 3) running = false;
          updateHud();
          return;
        }

        const hitBuilding = buildings.find((building) =>
          circleHitsRect(banana, { x: building.x, y: building.y, w: building.w, h: building.h }),
        );
        if (hitBuilding || banana.x < -20 || banana.x > canvas.width + 20 || banana.y > canvas.height + 20) {
          banana = null;
          message = turns >= 8 && score < 3 ? "机会用尽" : "";
          if (turns >= 8 && score < 3) running = false;
          updateHud();
        }
      }

      function circleHitsRect(circle, rect) {
        const nearestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        return Math.hypot(circle.x - nearestX, circle.y - nearestY) <= circle.r;
      }

      function drawGorilla(gorilla, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(gorilla.x, gorilla.y, gorilla.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#111827";
        ctx.fillRect(gorilla.x - 7, gorilla.y - 4, 4, 4);
        ctx.fillRect(gorilla.x + 3, gorilla.y - 4, 4, 4);
      }

      function renderCity() {
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, "#312e81");
        sky.addColorStop(0.55, "#6366f1");
        sky.addColorStop(1, "#0f172a");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fef3c7";
        ctx.font = "12px system-ui";
        ctx.fillText(`Wind ${wind >= 0 ? "+" : ""}${wind.toFixed(2)}`, 18, 28);

        buildings.forEach((building, index) => {
          ctx.fillStyle = index % 2 ? "#1e293b" : "#334155";
          ctx.fillRect(building.x, building.y, building.w, building.h);
          ctx.fillStyle = "#fde68a";
          for (let x = building.x + 8; x < building.x + building.w - 6; x += 16) {
            for (let y = building.y + 16; y < canvas.height - 10; y += 22) {
              if ((x + y + index) % 3 !== 0) ctx.fillRect(x, y, 6, 8);
            }
          }
        });

        drawGorilla(player, "#f97316");
        drawGorilla(target, "#22c55e");

        if (banana) {
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(banana.x, banana.y, banana.r, 0, Math.PI * 2);
          ctx.fill();
        }

        if (message) {
          ctx.fillStyle = "rgba(15, 23, 42, 0.82)";
          ctx.fillRect(95, 154, 330, 86);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 26px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(message, canvas.width / 2, 198);
          ctx.font = "14px system-ui";
          ctx.fillText(running ? "继续调整角度" : "点击重新开始", canvas.width / 2, 222);
          ctx.textAlign = "start";
        }
      }

      function gameLoop() {
        if (running) updateBanana();
        renderCity();
        requestAnimationFrame(gameLoop);
      }

      angleInput.addEventListener("input", updateHud);
      powerInput.addEventListener("input", updateHud);
      document.getElementById("throwBtn").addEventListener("click", throwBanana);
      document.getElementById("restartBtn").addEventListener("click", resetGame);
      document.addEventListener("keydown", (event) => {
        if (event.key === " ") {
          event.preventDefault();
          throwBanana();
        }
      });

      resetGame();
      gameLoop();
    </script>
  </body>
</html>
