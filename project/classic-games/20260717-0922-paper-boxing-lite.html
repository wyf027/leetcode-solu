<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Paper Boxing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-stone-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-red-300">Classic pencil duel</p>
        <h1 class="text-3xl font-bold">Mini Paper Boxing</h1>
      </div>
      <button id="resetBtn" class="rounded bg-red-300 px-4 py-2 text-sm font-bold text-stone-950 hover:bg-red-200">
        New bout
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="rounded border border-stone-800 bg-stone-900 p-4 shadow-lg">
        <div class="grid gap-4 sm:grid-cols-2">
          <div class="rounded border border-red-400 bg-stone-950 p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-red-300">You</p>
            <div class="mt-3 h-4 rounded bg-stone-800">
              <div id="playerBar" class="h-4 rounded bg-red-400" style="width:100%"></div>
            </div>
            <p id="playerHealth" class="mt-2 text-2xl font-bold">20</p>
          </div>
          <div class="rounded border border-sky-400 bg-stone-950 p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-300">Rival</p>
            <div class="mt-3 h-4 rounded bg-stone-800">
              <div id="rivalBar" class="h-4 rounded bg-sky-400" style="width:100%"></div>
            </div>
            <p id="rivalHealth" class="mt-2 text-2xl font-bold">20</p>
          </div>
        </div>

        <div class="mt-5 rounded border border-stone-800 bg-stone-950 p-4">
          <p class="text-xs font-semibold uppercase tracking-wide text-stone-500">Choose your round</p>
          <div id="actions" class="mt-3 grid gap-3 sm:grid-cols-3"></div>
        </div>

        <div class="mt-5 rounded border border-stone-800 bg-stone-950 p-4">
          <p class="text-xs font-semibold uppercase tracking-wide text-stone-500">Bout log</p>
          <ol id="log" class="mt-3 max-h-64 space-y-2 overflow-auto text-sm leading-6 text-stone-300"></ol>
        </div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-stone-800 bg-stone-900 p-4 shadow-lg">
          <p class="text-xs font-semibold uppercase tracking-wide text-stone-500">Round</p>
          <p id="roundText" class="mt-1 text-2xl font-bold">1</p>
          <p id="statusText" class="mt-3 min-h-16 text-sm leading-6 text-stone-300"></p>
        </div>
        <div class="rounded border border-stone-800 bg-stone-900 p-4 text-sm leading-6 text-stone-300 shadow-lg">
          Jab beats guard with chip damage. Hook punishes dodge. Guard softens hook. Dodge avoids jab and tires the rival. First boxer at 0 health loses.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const actionsEl = document.getElementById("actions");
    const logEl = document.getElementById("log");
    const resetBtn = document.getElementById("resetBtn");
    const playerBar = document.getElementById("playerBar");
    const rivalBar = document.getElementById("rivalBar");
    const playerHealth = document.getElementById("playerHealth");
    const rivalHealth = document.getElementById("rivalHealth");
    const roundText = document.getElementById("roundText");
    const statusText = document.getElementById("statusText");

    const moves = [
      { key: "jab", label: "Jab", hint: "Fast punch" },
      { key: "hook", label: "Hook", hint: "Heavy swing" },
      { key: "guard", label: "Guard", hint: "Reduce damage" },
      { key: "dodge", label: "Dodge", hint: "Slip a jab" }
    ];

    let player = 20;
    let rival = 20;
    let round = 1;
    let gameOver = false;
    let history = [];

    function startGame() {
      player = 20;
      rival = 20;
      round = 1;
      gameOver = false;
      history = ["The paper bell rings. Pick your first move."];
      statusText.textContent = "Choose a boxing move.";
      render();
    }

    function rivalMove() {
      const pool = rival <= 6 ? ["guard", "dodge", "hook", "jab"] : ["jab", "jab", "hook", "guard", "dodge"];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function moveName(key) {
      return moves.find((move) => move.key === key).label;
    }

    function resolveRound(choice) {
      if (gameOver) return;
      const enemy = rivalMove();
      let playerDamage = 0;
      let rivalDamage = 0;
      let note = "";

      if (choice === "jab" && enemy === "dodge") {
        note = "Your jab misses as the rival slips aside.";
      } else if (choice === "jab" && enemy === "guard") {
        rivalDamage = 1;
        note = "Your jab taps through the guard.";
      } else if (choice === "jab") {
        rivalDamage = 3;
        note = "Your jab lands clean.";
      }

      if (choice === "hook" && enemy === "guard") {
        rivalDamage = 2;
        note = "Your hook is partly blocked.";
      } else if (choice === "hook" && enemy === "dodge") {
        rivalDamage = 5;
        note = "Your hook catches the dodge.";
      } else if (choice === "hook") {
        rivalDamage = 4;
        note = "Your hook thumps home.";
      }

      if (choice === "guard" && enemy === "hook") {
        playerDamage = 1;
        note = "You guard the heavy hook.";
      } else if (choice === "guard" && enemy === "jab") {
        playerDamage = 1;
        rivalDamage = 1;
        note = "You absorb a jab and counter short.";
      } else if (choice === "guard") {
        note = "Both boxers reset behind their hands.";
      }

      if (choice === "dodge" && enemy === "jab") {
        rivalDamage = 1;
        note = "You dodge the jab and tire the rival.";
      } else if (choice === "dodge" && enemy === "hook") {
        playerDamage = 3;
        note = "The hook follows your dodge.";
      } else if (choice === "dodge") {
        note = "You circle away.";
      }

      if (enemy === "jab" && choice !== "guard" && choice !== "dodge") playerDamage += 2;
      if (enemy === "hook" && choice !== "guard" && choice !== "dodge") playerDamage += 3;
      if (enemy === "guard" && choice === "dodge") playerDamage += 1;

      player = Math.max(0, player - playerDamage);
      rival = Math.max(0, rival - rivalDamage);
      history.unshift(`R${round}: You ${moveName(choice)}, rival ${moveName(enemy)}. ${note} (${rivalDamage}-${playerDamage})`);

      if (player === 0 || rival === 0) {
        gameOver = true;
        if (player === rival) {
          statusText.textContent = "Double knockdown. The bout is a draw.";
        } else {
          statusText.textContent = player > rival ? "You win the paper bout." : "Rival wins the paper bout.";
        }
      } else {
        round += 1;
        statusText.textContent = "Choose the next move.";
      }
      render();
    }

    function renderActions() {
      actionsEl.innerHTML = "";
      moves.forEach((move) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "rounded border border-stone-700 bg-stone-900 px-3 py-4 text-left hover:border-red-300 hover:bg-stone-800 disabled:cursor-default disabled:opacity-50";
        button.disabled = gameOver;
        button.innerHTML = `<span class="block text-lg font-bold">${move.label}</span><span class="text-xs text-stone-400">${move.hint}</span>`;
        button.addEventListener("click", () => resolveRound(move.key));
        actionsEl.appendChild(button);
      });
    }

    function renderLog() {
      logEl.innerHTML = "";
      history.slice(0, 10).forEach((entry) => {
        const item = document.createElement("li");
        item.className = "rounded bg-stone-900 px-3 py-2";
        item.textContent = entry;
        logEl.appendChild(item);
      });
    }

    function render() {
      playerHealth.textContent = player;
      rivalHealth.textContent = rival;
      playerBar.style.width = `${(player / 20) * 100}%`;
      rivalBar.style.width = `${(rival / 20) * 100}%`;
      roundText.textContent = gameOver ? "Over" : round;
      renderActions();
      renderLog();
    }

    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
