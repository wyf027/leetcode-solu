<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Fifteen Puzzle</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-zinc-800 bg-zinc-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal text-white">Mini Fifteen Puzzle</h1>
          <p class="mt-1 text-sm text-zinc-400">点击空格旁边的数字滑动，把 1 到 15 排回顺序。</p>
        </div>
        <button id="reset" class="rounded-md bg-teal-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-teal-300">
          打乱
        </button>
      </div>

      <div class="mb-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="rounded-md bg-zinc-800 px-3 py-2">
          <div class="text-zinc-400">步数</div>
          <div id="moves" class="text-xl font-semibold text-white">0</div>
        </div>
        <div class="rounded-md bg-zinc-800 px-3 py-2">
          <div class="text-zinc-400">目标</div>
          <div class="text-xl font-semibold text-white">1-15</div>
        </div>
        <div class="rounded-md bg-zinc-800 px-3 py-2">
          <div class="text-zinc-400">状态</div>
          <div id="status" class="text-xl font-semibold text-white">移动</div>
        </div>
      </div>

      <div id="board" class="mx-auto grid w-full max-w-md grid-cols-4 gap-2 rounded-lg bg-zinc-950 p-3"></div>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    const size = 4;
    let tiles = [];
    let moves = 0;

    function resetGame() {
      tiles = Array.from({ length: 15 }, (_, index) => index + 1).concat(0);
      moves = 0;
      for (let i = 0; i < 160; i++) {
        const choices = movableIndexes();
        slide(choices[Math.floor(Math.random() * choices.length)], false);
      }
      moves = 0;
      render();
    }

    function movableIndexes() {
      const empty = tiles.indexOf(0);
      const row = Math.floor(empty / size);
      const col = empty % size;
      return tiles
        .map((_, index) => index)
        .filter(index => {
          const r = Math.floor(index / size);
          const c = index % size;
          return Math.abs(r - row) + Math.abs(c - col) === 1;
        });
    }

    function slide(index, countMove = true) {
      const empty = tiles.indexOf(0);
      if (!movableIndexes().includes(index)) return;
      [tiles[index], tiles[empty]] = [tiles[empty], tiles[index]];
      if (countMove) moves++;
      render();
    }

    function isSolved() {
      return tiles.every((value, index) => value === (index === 15 ? 0 : index + 1));
    }

    function render() {
      boardEl.innerHTML = "";
      tiles.forEach((value, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "aspect-square rounded-md text-2xl font-bold transition focus:outline-none focus:ring-2 focus:ring-teal-200",
          value === 0
            ? "bg-zinc-900 text-zinc-900"
            : "bg-teal-400 text-zinc-950 hover:bg-teal-300"
        ].join(" ");
        button.textContent = value || "";
        button.disabled = value === 0 || isSolved();
        button.setAttribute("aria-label", value === 0 ? "空格" : `数字 ${value}`);
        button.addEventListener("click", () => slide(index));
        boardEl.appendChild(button);
      });
      movesEl.textContent = moves;
      statusEl.textContent = isSolved() ? "完成" : "移动";
    }

    resetEl.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
