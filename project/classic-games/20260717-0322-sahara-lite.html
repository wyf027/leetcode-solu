<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Sahara</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-neutral-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-yellow-300">classic abstract variant</p>
        <h1 class="text-3xl font-bold text-white">Mini Sahara</h1>
      </div>
      <button id="resetBtn" class="rounded bg-yellow-300 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-yellow-200">Reset</button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
      <div class="rounded border border-neutral-800 bg-neutral-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-5 gap-1"></div>
      </div>

      <aside class="space-y-4">
        <div class="rounded border border-neutral-800 bg-neutral-900 p-4">
          <p class="text-sm text-neutral-400">Turn</p>
          <p id="turnLabel" class="mt-1 text-xl font-bold text-white"></p>
          <p id="status" class="mt-3 min-h-14 text-sm leading-6 text-neutral-300"></p>
        </div>
        <div class="rounded border border-neutral-800 bg-neutral-900 p-4">
          <p class="font-semibold text-white">Score</p>
          <div class="mt-3 grid grid-cols-2 gap-2 text-sm">
            <div class="rounded bg-neutral-800 p-3">
              <p class="text-neutral-400">Sun</p>
              <p id="sunScore" class="text-2xl font-bold text-yellow-300"></p>
            </div>
            <div class="rounded bg-neutral-800 p-3">
              <p class="text-neutral-400">Moon</p>
              <p id="moonScore" class="text-2xl font-bold text-cyan-300"></p>
            </div>
          </div>
        </div>
        <div class="rounded border border-neutral-800 bg-neutral-900 p-4">
          <p class="font-semibold text-white">Rules</p>
          <ul class="mt-3 space-y-2 text-sm leading-6 text-neutral-300">
            <li>Move one of your stones to an adjacent empty dune.</li>
            <li>You may jump over any occupied dune into an empty landing.</li>
            <li>Claim center dunes for points after every move.</li>
            <li>First to 7 points, or the last side with a move, wins.</li>
          </ul>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const boardEl = document.getElementById("board");
    const turnLabel = document.getElementById("turnLabel");
    const statusEl = document.getElementById("status");
    const sunScoreEl = document.getElementById("sunScore");
    const moonScoreEl = document.getElementById("moonScore");
    const resetBtn = document.getElementById("resetBtn");
    const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const scoreDunes = new Set(["1,1", "1,3", "2,2", "3,1", "3,3"]);

    let board = [];
    let turn = "S";
    let selected = null;
    let score = { S: 0, M: 0 };
    let gameOver = false;

    function startGame() {
      board = Array.from({ length: size }, () => Array(size).fill(""));
      board[0] = ["M", "M", "M", "M", "M"];
      board[4] = ["S", "S", "S", "S", "S"];
      board[1][2] = "M";
      board[3][2] = "S";
      turn = "S";
      selected = null;
      score = { S: 0, M: 0 };
      gameOver = false;
      render("Sun starts. Select a stone and move to an empty dune.");
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function legalMoves(row, col) {
      if (gameOver || board[row][col] !== turn) return [];
      const moves = [];
      directions.forEach(([dr, dc]) => {
        const stepRow = row + dr;
        const stepCol = col + dc;
        if (inBounds(stepRow, stepCol) && board[stepRow][stepCol] === "") {
          moves.push([stepRow, stepCol]);
        }
        const jumpRow = row + dr * 2;
        const jumpCol = col + dc * 2;
        if (
          inBounds(jumpRow, jumpCol) &&
          inBounds(stepRow, stepCol) &&
          board[stepRow][stepCol] !== "" &&
          board[jumpRow][jumpCol] === ""
        ) {
          moves.push([jumpRow, jumpCol]);
        }
      });
      return moves;
    }

    function allMoves(side) {
      const previousTurn = turn;
      turn = side;
      const moves = [];
      board.forEach((row, rowIndex) => {
        row.forEach((piece, colIndex) => {
          if (piece === side) legalMoves(rowIndex, colIndex).forEach((move) => moves.push(move));
        });
      });
      turn = previousTurn;
      return moves;
    }

    function updateScore() {
      scoreDunes.forEach((key) => {
        const [row, col] = key.split(",").map(Number);
        if (board[row][col]) score[board[row][col]] += 1;
      });
    }

    function winnerName(side) {
      return side === "S" ? "Sun" : "Moon";
    }

    function finishTurn(message) {
      updateScore();
      if (score.S >= 7 || score.M >= 7) {
        gameOver = true;
        selected = null;
        const winner = score.S >= 7 ? "S" : "M";
        render(`${winnerName(winner)} wins by controlling the scoring dunes.`);
        return;
      }
      const next = turn === "S" ? "M" : "S";
      if (allMoves(next).length === 0) {
        gameOver = true;
        selected = null;
        render(`${winnerName(turn)} wins because ${winnerName(next)} has no legal move.`);
        return;
      }
      turn = next;
      selected = null;
      render(message || `${winnerName(turn)} to move.`);
    }

    function handleCell(row, col) {
      if (gameOver) return;
      if (board[row][col] === turn) {
        selected = [row, col];
        render(`Choose a highlighted dune for ${winnerName(turn)}.`);
        return;
      }
      if (!selected) return;
      const moves = legalMoves(selected[0], selected[1]);
      const isLegal = moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col);
      if (!isLegal) return;
      board[row][col] = board[selected[0]][selected[1]];
      board[selected[0]][selected[1]] = "";
      finishTurn(`${winnerName(turn)} crosses the sand.`);
    }

    function cellClasses(row, col) {
      const piece = board[row][col];
      const key = `${row},${col}`;
      const moves = selected ? legalMoves(selected[0], selected[1]) : [];
      const isMove = moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col);
      const isSelected = selected && selected[0] === row && selected[1] === col;
      const isScore = scoreDunes.has(key);
      const base = "flex aspect-square items-center justify-center rounded border text-3xl font-black transition";
      const color = piece === "S"
        ? "border-yellow-400 bg-yellow-950 text-yellow-200"
        : piece === "M"
          ? "border-cyan-400 bg-cyan-950 text-cyan-200"
          : isScore
            ? "border-amber-600 bg-amber-950/70 text-amber-300"
            : "border-neutral-700 bg-neutral-800 text-neutral-500";
      const state = isSelected ? " ring-4 ring-white" : isMove ? " ring-4 ring-lime-300" : " hover:border-yellow-300";
      return `${base} ${color}${state}`;
    }

    function render(message) {
      boardEl.innerHTML = "";
      board.forEach((row, rowIndex) => {
        row.forEach((piece, colIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = cellClasses(rowIndex, colIndex);
          button.textContent = piece || (scoreDunes.has(`${rowIndex},${colIndex}`) ? "*" : "");
          button.setAttribute("aria-label", `row ${rowIndex + 1} column ${colIndex + 1}`);
          button.addEventListener("click", () => handleCell(rowIndex, colIndex));
          boardEl.appendChild(button);
        });
      });
      turnLabel.textContent = gameOver ? "Game over" : winnerName(turn);
      statusEl.textContent = message;
      sunScoreEl.textContent = score.S;
      moonScoreEl.textContent = score.M;
    }

    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
