<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Breakout</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
      <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-amber-300">Classic Games</p>
          <h1 class="text-3xl font-bold tracking-tight text-white">Mini Breakout</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded bg-zinc-900 px-4 py-2 ring-1 ring-zinc-800">
            <div class="text-zinc-400">Score</div>
            <div id="score" class="text-xl font-bold text-white">0</div>
          </div>
          <div class="rounded bg-zinc-900 px-4 py-2 ring-1 ring-zinc-800">
            <div class="text-zinc-400">Lives</div>
            <div id="lives" class="text-xl font-bold text-white">3</div>
          </div>
          <div class="rounded bg-zinc-900 px-4 py-2 ring-1 ring-zinc-800">
            <div class="text-zinc-400">Level</div>
            <div id="level" class="text-xl font-bold text-white">1</div>
          </div>
        </div>
      </header>

      <section class="grid gap-4 lg:grid-cols-[1fr_16rem]">
        <div class="rounded bg-zinc-900 p-3 ring-1 ring-zinc-800">
          <canvas id="game" width="760" height="520" class="block w-full rounded bg-zinc-950"></canvas>
        </div>
        <aside class="flex flex-col gap-3 rounded bg-zinc-900 p-4 ring-1 ring-zinc-800">
          <button id="start" class="rounded bg-amber-300 px-4 py-3 font-bold text-zinc-950 hover:bg-amber-200">
            Start
          </button>
          <button id="restart" class="rounded bg-zinc-800 px-4 py-3 font-bold text-white hover:bg-zinc-700">
            Restart
          </button>
          <div class="rounded bg-zinc-950 p-3 text-sm leading-6 text-zinc-300 ring-1 ring-zinc-800">
            <p>Move: Arrow keys, A/D, mouse, or drag.</p>
            <p>Launch: Space or Start.</p>
            <p>Clear all bricks to advance.</p>
          </div>
          <p id="message" class="rounded bg-zinc-950 p-3 text-sm font-semibold text-amber-200 ring-1 ring-zinc-800">
            Press Start to launch the ball.
          </p>
        </aside>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const levelEl = document.getElementById("level");
      const messageEl = document.getElementById("message");
      const startBtn = document.getElementById("start");
      const restartBtn = document.getElementById("restart");

      const state = {
        score: 0,
        lives: 3,
        level: 1,
        running: false,
        pausedLaunch: true,
        keys: new Set(),
        bricks: [],
      };

      const paddle = { width: 118, height: 14, x: 321, y: 485, speed: 8 };
      const ball = { x: 380, y: 462, radius: 8, dx: 4, dy: -5 };
      const brick = { rows: 5, cols: 10, width: 64, height: 20, gap: 8, top: 54, left: 22 };
      const colors = ["#fbbf24", "#38bdf8", "#a78bfa", "#34d399", "#fb7185"];

      function buildBricks() {
        state.bricks = [];
        const rows = brick.rows + Math.min(state.level - 1, 3);
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < brick.cols; col += 1) {
            state.bricks.push({
              x: brick.left + col * (brick.width + brick.gap),
              y: brick.top + row * (brick.height + brick.gap),
              color: colors[row % colors.length],
              alive: true,
            });
          }
        }
      }

      function resetBall() {
        paddle.x = canvas.width / 2 - paddle.width / 2;
        ball.x = canvas.width / 2;
        ball.y = paddle.y - 24;
        const speed = 4 + state.level * 0.45;
        ball.dx = speed * (Math.random() > 0.5 ? 1 : -1);
        ball.dy = -speed - 1;
        state.pausedLaunch = true;
      }

      function updateHud() {
        scoreEl.textContent = state.score;
        livesEl.textContent = state.lives;
        levelEl.textContent = state.level;
      }

      function startGame() {
        if (state.lives <= 0 || state.bricks.every((item) => !item.alive)) {
          restartGame();
        }
        state.running = true;
        state.pausedLaunch = false;
        messageEl.textContent = "Break every brick.";
        requestAnimationFrame(loop);
      }

      function restartGame() {
        state.score = 0;
        state.lives = 3;
        state.level = 1;
        state.running = false;
        buildBricks();
        resetBall();
        updateHud();
        messageEl.textContent = "Press Start to launch the ball.";
        draw();
      }

      function movePaddle() {
        if (state.keys.has("ArrowLeft") || state.keys.has("a")) {
          paddle.x -= paddle.speed;
        }
        if (state.keys.has("ArrowRight") || state.keys.has("d")) {
          paddle.x += paddle.speed;
        }
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      }

      function collideBricks() {
        for (const item of state.bricks) {
          if (!item.alive) continue;
          const hitX = ball.x + ball.radius > item.x && ball.x - ball.radius < item.x + brick.width;
          const hitY = ball.y + ball.radius > item.y && ball.y - ball.radius < item.y + brick.height;
          if (hitX && hitY) {
            item.alive = false;
            ball.dy *= -1;
            state.score += 10 * state.level;
            updateHud();
            break;
          }
        }
      }

      function update() {
        movePaddle();
        if (state.pausedLaunch) {
          ball.x = paddle.x + paddle.width / 2;
          return;
        }

        ball.x += ball.dx;
        ball.y += ball.dy;

        if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) ball.dx *= -1;
        if (ball.y - ball.radius < 0) ball.dy *= -1;

        const onPaddle =
          ball.y + ball.radius >= paddle.y &&
          ball.y + ball.radius <= paddle.y + paddle.height &&
          ball.x >= paddle.x &&
          ball.x <= paddle.x + paddle.width;

        if (onPaddle && ball.dy > 0) {
          const offset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          ball.dx = offset * (5 + state.level * 0.5);
          ball.dy *= -1;
        }

        collideBricks();

        if (ball.y - ball.radius > canvas.height) {
          state.lives -= 1;
          updateHud();
          if (state.lives <= 0) {
            state.running = false;
            messageEl.textContent = "Game over. Restart to try again.";
          } else {
            resetBall();
            messageEl.textContent = "Ball lost. Press Start to launch.";
          }
        }

        if (state.bricks.every((item) => !item.alive)) {
          state.level += 1;
          buildBricks();
          resetBall();
          updateHud();
          messageEl.textContent = "Level cleared. Press Start for the next wave.";
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#09090b";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (const item of state.bricks) {
          if (!item.alive) continue;
          ctx.fillStyle = item.color;
          ctx.fillRect(item.x, item.y, brick.width, brick.height);
        }

        ctx.fillStyle = "#f4f4f5";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#fbbf24";
        ctx.fill();
      }

      function loop() {
        if (!state.running) {
          draw();
          return;
        }
        update();
        draw();
        requestAnimationFrame(loop);
      }

      function pointerToPaddle(event) {
        const rect = canvas.getBoundingClientRect();
        const clientX = event.touches ? event.touches[0].clientX : event.clientX;
        const scaleX = canvas.width / rect.width;
        paddle.x = (clientX - rect.left) * scaleX - paddle.width / 2;
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      }

      window.addEventListener("keydown", (event) => {
        state.keys.add(event.key);
        if (event.key === " ") {
          event.preventDefault();
          startGame();
        }
      });
      window.addEventListener("keyup", (event) => state.keys.delete(event.key));
      canvas.addEventListener("mousemove", pointerToPaddle);
      canvas.addEventListener("touchmove", (event) => {
        event.preventDefault();
        pointerToPaddle(event);
      });
      startBtn.addEventListener("click", startGame);
      restartBtn.addEventListener("click", restartGame);

      restartGame();
    </script>
  </body>
</html>
