<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Fox Goose Corn</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-950 text-sky-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-sky-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-yellow-300">Classic river puzzle</p>
        <h1 class="text-3xl font-bold">Mini Fox Goose Corn</h1>
      </div>
      <button id="resetBtn" class="rounded bg-yellow-300 px-4 py-2 text-sm font-bold text-sky-950 hover:bg-yellow-200">
        Reset crossing
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="rounded border border-sky-800 bg-sky-900 p-4 shadow-lg">
        <div class="grid gap-4 md:grid-cols-[1fr_160px_1fr]">
          <div class="rounded border border-emerald-500 bg-emerald-950 p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-emerald-300">Left bank</p>
            <div id="leftBank" class="mt-4 grid gap-3"></div>
          </div>
          <div class="flex flex-col items-center justify-center rounded border border-sky-700 bg-sky-950 p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-300">River</p>
            <button id="boatBtn" class="mt-4 rounded border-2 border-yellow-300 bg-sky-800 px-4 py-3 text-sm font-bold text-yellow-100 hover:bg-sky-700"></button>
            <p id="cargoText" class="mt-3 min-h-6 text-center text-sm text-sky-200"></p>
          </div>
          <div class="rounded border border-emerald-500 bg-emerald-950 p-4">
            <p class="text-xs font-semibold uppercase tracking-wide text-emerald-300">Right bank</p>
            <div id="rightBank" class="mt-4 grid gap-3"></div>
          </div>
        </div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded border border-sky-800 bg-sky-900 p-4 shadow-lg">
          <p class="text-xs font-semibold uppercase tracking-wide text-sky-400">Moves</p>
          <p id="moveText" class="mt-1 text-2xl font-bold">0</p>
          <p id="statusText" class="mt-3 min-h-20 text-sm leading-6 text-sky-100"></p>
        </div>
        <div class="rounded border border-sky-800 bg-sky-900 p-4 text-sm leading-6 text-sky-100 shadow-lg">
          Carry yourself and at most one item across. Never leave fox with goose, or goose with corn, unless you are on that bank.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const leftBank = document.getElementById("leftBank");
    const rightBank = document.getElementById("rightBank");
    const boatBtn = document.getElementById("boatBtn");
    const cargoText = document.getElementById("cargoText");
    const moveText = document.getElementById("moveText");
    const statusText = document.getElementById("statusText");
    const resetBtn = document.getElementById("resetBtn");

    const items = [
      { key: "fox", label: "Fox", mark: "F" },
      { key: "goose", label: "Goose", mark: "G" },
      { key: "corn", label: "Corn", mark: "C" }
    ];

    let side = {};
    let farmer = "left";
    let cargo = "";
    let moves = 0;
    let gameOver = false;

    function startGame() {
      side = { fox: "left", goose: "left", corn: "left" };
      farmer = "left";
      cargo = "";
      moves = 0;
      gameOver = false;
      statusText.textContent = "Load one item or cross alone.";
      render();
    }

    function otherBank(bank) {
      return bank === "left" ? "right" : "left";
    }

    function itemLabel(key) {
      const item = items.find((entry) => entry.key === key);
      return item ? item.label : "alone";
    }

    function bankHas(bank, key) {
      return side[key] === bank;
    }

    function isDanger(bank) {
      if (farmer === bank) return "";
      const hasFox = bankHas(bank, "fox");
      const hasGoose = bankHas(bank, "goose");
      const hasCorn = bankHas(bank, "corn");
      if (hasFox && hasGoose) return "The fox catches the goose.";
      if (hasGoose && hasCorn) return "The goose eats the corn.";
      return "";
    }

    function checkState() {
      const danger = isDanger("left") || isDanger("right");
      if (danger) {
        gameOver = true;
        statusText.textContent = `${danger} The crossing fails.`;
        render();
        return;
      }
      if (farmer === "right" && items.every((item) => side[item.key] === "right")) {
        gameOver = true;
        statusText.textContent = `Solved in ${moves} moves. Everyone reached the right bank.`;
        render();
        return;
      }
      statusText.textContent = farmer === "left" ? "Choose cargo or cross to the right." : "Choose cargo or return to the left.";
      render();
    }

    function toggleCargo(key) {
      if (gameOver) return;
      if (side[key] !== farmer) return;
      cargo = cargo === key ? "" : key;
      statusText.textContent = cargo ? `${itemLabel(cargo)} is in the boat.` : "Boat is empty.";
      render();
    }

    function crossRiver() {
      if (gameOver) return;
      const destination = otherBank(farmer);
      if (cargo) side[cargo] = destination;
      farmer = destination;
      moves += 1;
      const carried = cargo ? itemLabel(cargo) : "alone";
      cargo = "";
      statusText.textContent = `Crossed ${carried}.`;
      checkState();
    }

    function renderItem(item) {
      const currentBank = side[item.key];
      const button = document.createElement("button");
      button.type = "button";
      button.disabled = gameOver || currentBank !== farmer;
      button.className = [
        "flex items-center justify-between rounded border px-3 py-3 text-left transition",
        cargo === item.key ? "border-yellow-300 bg-yellow-300 text-sky-950" : "border-emerald-700 bg-emerald-900 text-emerald-50",
        currentBank === farmer && !gameOver ? "hover:border-yellow-300" : "opacity-70"
      ].join(" ");
      button.innerHTML = `<span class="font-bold">${item.label}</span><span class="rounded bg-sky-950 px-2 py-1 text-xs text-yellow-200">${item.mark}</span>`;
      button.addEventListener("click", () => toggleCargo(item.key));
      return button;
    }

    function renderFarmer(bank) {
      const tag = document.createElement("div");
      tag.className = "rounded border border-yellow-300 bg-yellow-300 px-3 py-3 font-bold text-sky-950";
      tag.textContent = "Farmer";
      if (farmer === bank) return tag;
      const empty = document.createElement("div");
      empty.className = "rounded border border-emerald-800 px-3 py-3 text-emerald-500";
      empty.textContent = "No farmer";
      return empty;
    }

    function renderBank(bank, container) {
      container.innerHTML = "";
      container.appendChild(renderFarmer(bank));
      items.filter((item) => side[item.key] === bank).forEach((item) => {
        container.appendChild(renderItem(item));
      });
    }

    function render() {
      renderBank("left", leftBank);
      renderBank("right", rightBank);
      boatBtn.textContent = farmer === "left" ? "Cross right" : "Cross left";
      boatBtn.disabled = gameOver;
      cargoText.textContent = cargo ? `Cargo: ${itemLabel(cargo)}` : "Cargo: none";
      moveText.textContent = moves;
    }

    boatBtn.addEventListener("click", crossRiver);
    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
