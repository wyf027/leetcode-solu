<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Word Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col justify-center gap-5 px-4 py-8">
    <section class="grid gap-4 md:grid-cols-[1fr_280px] md:items-start">
      <div class="rounded-lg border border-indigo-700 bg-indigo-900 p-4 shadow-2xl">
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold tracking-normal">Mini Word Search</h1>
            <p class="text-sm text-indigo-200/80">点击相邻字母组成目标单词，找到全部单词即可完成。</p>
          </div>
          <button id="resetBtn" class="rounded-md bg-teal-300 px-3 py-2 text-sm font-semibold text-teal-950 hover:bg-teal-200">重开</button>
        </div>
        <div id="board" class="mx-auto grid w-full max-w-[420px] grid-cols-8 gap-1 rounded-lg bg-indigo-950 p-2"></div>
      </div>
      <aside class="rounded-lg border border-indigo-700 bg-indigo-900 p-4">
        <h2 class="mb-3 text-lg font-semibold">词表</h2>
        <div id="wordList" class="grid grid-cols-2 gap-2 text-sm"></div>
        <div class="mt-4 space-y-3 text-sm">
          <p id="selectionStatus" class="rounded-md bg-indigo-950 p-3 text-indigo-100"></p>
          <div class="grid grid-cols-2 gap-2">
            <button id="submitBtn" class="rounded-md bg-teal-300 px-3 py-2 font-semibold text-teal-950 hover:bg-teal-200">提交</button>
            <button id="clearBtn" class="rounded-md bg-indigo-700 px-3 py-2 font-semibold hover:bg-indigo-600">清除</button>
          </div>
          <p id="winStatus" class="rounded-md bg-indigo-950 p-3 font-semibold text-indigo-100"></p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const grid = [
      ["C", "O", "D", "E", "L", "A", "B", "S"],
      ["P", "L", "A", "Y", "R", "U", "N", "Q"],
      ["G", "A", "M", "E", "T", "I", "L", "E"],
      ["W", "O", "R", "D", "S", "E", "A", "R"],
      ["L", "O", "G", "I", "C", "P", "A", "T"],
      ["P", "A", "T", "H", "F", "I", "N", "D"],
      ["P", "U", "Z", "Z", "L", "E", "S", "X"],
      ["S", "C", "O", "R", "E", "H", "I", "T"]
    ];
    const words = ["CODE", "PLAY", "GAME", "WORD", "LOGIC", "PATH", "PUZZLE", "SCORE"];
    const found = new Set();
    let selection = [];
    const board = document.getElementById("board");
    const wordList = document.getElementById("wordList");
    const selectionStatus = document.getElementById("selectionStatus");
    const submitBtn = document.getElementById("submitBtn");
    const clearBtn = document.getElementById("clearBtn");
    const resetBtn = document.getElementById("resetBtn");
    const winStatus = document.getElementById("winStatus");
    const cells = new Map();

    function key(row, col) {
      return `${row},${col}`;
    }

    function currentWord() {
      return selection.map(([row, col]) => grid[row][col]).join("");
    }

    function isAdjacent(a, b) {
      return Math.max(Math.abs(a[0] - b[0]), Math.abs(a[1] - b[1])) === 1;
    }

    function selectCell(row, col) {
      const id = key(row, col);
      if (selection.some(([r, c]) => r === row && c === col)) {
        selection = selection.filter(([r, c]) => key(r, c) !== id);
      } else if (!selection.length || isAdjacent(selection[selection.length - 1], [row, col])) {
        selection.push([row, col]);
      }
      renderBoard();
      updateStatus();
    }

    function submitSelection() {
      const word = currentWord();
      const reversed = word.split("").reverse().join("");
      const match = words.find((item) => item === word || item === reversed);
      if (match) found.add(match);
      selection = [];
      renderAll();
    }

    function renderBoard() {
      board.innerHTML = "";
      cells.clear();
      for (let row = 0; row < grid.length; row++) {
        for (let col = 0; col < grid[row].length; col++) {
          const selected = selection.some(([r, c]) => r === row && c === col);
          const button = document.createElement("button");
          button.className = selected
            ? "aspect-square rounded-md bg-teal-300 text-lg font-black text-teal-950"
            : "aspect-square rounded-md bg-indigo-700 text-lg font-black text-indigo-50 hover:bg-indigo-600";
          button.textContent = grid[row][col];
          button.setAttribute("aria-label", `row ${row + 1} column ${col + 1}`);
          button.addEventListener("click", () => selectCell(row, col));
          board.appendChild(button);
          cells.set(key(row, col), button);
        }
      }
    }

    function renderWords() {
      wordList.innerHTML = "";
      words.forEach((word) => {
        const item = document.createElement("div");
        item.className = found.has(word)
          ? "rounded-md bg-teal-300 px-2 py-2 font-semibold text-teal-950 line-through"
          : "rounded-md bg-indigo-950 px-2 py-2 font-semibold text-indigo-100";
        item.textContent = word;
        wordList.appendChild(item);
      });
    }

    function updateStatus() {
      selectionStatus.textContent = `当前：${currentWord() || "未选择"}`;
      winStatus.textContent = found.size === words.length ? "完成：全部单词已找到" : `已找到：${found.size}/${words.length}`;
      winStatus.className = found.size === words.length
        ? "rounded-md bg-teal-300 p-3 font-semibold text-teal-950"
        : "rounded-md bg-indigo-950 p-3 font-semibold text-indigo-100";
    }

    function renderAll() {
      renderBoard();
      renderWords();
      updateStatus();
    }

    clearBtn.addEventListener("click", () => {
      selection = [];
      renderBoard();
      updateStatus();
    });
    submitBtn.addEventListener("click", submitSelection);
    resetBtn.addEventListener("click", () => {
      found.clear();
      selection = [];
      renderAll();
    });

    renderAll();
  </script>
</body>
</html>
