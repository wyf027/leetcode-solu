<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Chomp</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-amber-950 text-amber-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Chomp</h1><p class="text-sm text-amber-200">Choose a square; it and everything down-right is eaten. Avoid the poisoned corner.</p></div><button id="newGameBtn" class="rounded bg-emerald-300 px-4 py-2 font-semibold text-amber-950 hover:bg-emerald-200">New Game</button></header><section class="grid gap-3 rounded border border-amber-700 bg-amber-900 p-3 sm:grid-cols-3"><div>Turn: <b id="turnLabel">Blue</b></div><div>Pieces left: <b id="leftCount">0</b></div><div id="message">Pick any chocolate square except the poison if you can.</div></section><section id="board" class="mx-auto grid w-full max-w-2xl grid-cols-7 gap-2 rounded border border-amber-700 bg-amber-900 p-3"></section></main><script>
const rows=5,cols=7;let alive,turn,over;const el=id=>document.getElementById(id),boardEl=el('board'),turnLabel=el('turnLabel'),leftCount=el('leftCount'),message=el('message'),newGameBtn=el('newGameBtn');function name(p){return p==='B'?'Blue':'Gold'}function index(r,c){return r*cols+c}function eatFrom(r,c){if(over||!alive[index(r,c)])return;if(r===0&&c===0){message.textContent=`${name(turn)} ate poison and loses.`;over=true;render();return}for(let rr=r;rr<rows;rr++)for(let cc=c;cc<cols;cc++)alive[index(rr,cc)]=false;turn=turn==='B'?'G':'B';message.textContent='Chocolate chomped.';render()}function render(){turnLabel.textContent=over?'Game Over':name(turn);leftCount.textContent=alive.filter(Boolean).length;boardEl.innerHTML='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const poison=r===0&&c===0,b=document.createElement('button');b.className='aspect-square rounded border text-sm font-bold '+(alive[index(r,c)]?(poison?'border-red-300 bg-red-500 text-white hover:bg-red-400':'border-amber-500 bg-amber-300 text-amber-950 hover:bg-amber-200'):'border-amber-900 bg-amber-950 text-amber-900');b.textContent=alive[index(r,c)]?(poison?'POISON':''):'';b.disabled=!alive[index(r,c)]||over;b.onclick=()=>eatFrom(r,c);boardEl.appendChild(b)}}function newGame(){alive=Array(rows*cols).fill(true);turn='B';over=false;message.textContent='Pick any chocolate square except the poison if you can.';render()}newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
