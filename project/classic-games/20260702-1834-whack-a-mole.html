<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Whack-a-Mole</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-950 text-white">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center gap-5 px-4 py-8">
      <section class="rounded-lg border border-stone-700 bg-stone-900 p-5 shadow-2xl">
        <div class="mb-5 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-normal">Mini Whack-a-Mole</h1>
            <p id="message" class="mt-1 min-h-6 text-sm text-stone-300">30 秒内尽量击中出现的目标。</p>
          </div>
          <div class="grid grid-cols-2 gap-2 text-center text-sm">
            <div class="rounded bg-stone-800 px-4 py-2">分数 <strong id="score" class="text-amber-300">0</strong></div>
            <div class="rounded bg-stone-800 px-4 py-2">时间 <strong id="time" class="text-cyan-300">30</strong></div>
          </div>
        </div>

        <div id="board" class="grid aspect-square grid-cols-3 gap-3 rounded bg-stone-800 p-3"></div>

        <div class="mt-5 grid grid-cols-2 gap-3">
          <button id="start" class="rounded bg-amber-400 py-3 font-bold text-stone-950 hover:bg-amber-300">开始</button>
          <button id="reset" class="rounded border border-stone-600 py-3 font-semibold text-stone-100 hover:bg-stone-800">重置</button>
        </div>
      </section>
    </main>

    <script>
      const boardEl = document.getElementById("board");
      const scoreEl = document.getElementById("score");
      const timeEl = document.getElementById("time");
      const messageEl = document.getElementById("message");
      const startButton = document.getElementById("start");
      const resetButton = document.getElementById("reset");

      let activeHole = -1;
      let score = 0;
      let timeLeft = 30;
      let gameTimer = null;
      let moleTimer = null;
      let playing = false;

      function renderBoard() {
        boardEl.innerHTML = "";
        for (let i = 0; i < 9; i += 1) {
          const hole = document.createElement("button");
          const active = i === activeHole;
          hole.className = [
            "relative overflow-hidden rounded-full border-4 border-stone-700 bg-stone-950 shadow-inner transition",
            "focus:outline-none focus:ring-4 focus:ring-amber-300",
            active ? "scale-100 border-amber-400" : "scale-95",
          ].join(" ");
          hole.innerHTML = `<span class="absolute inset-x-4 bottom-0 mx-auto block rounded-t-full transition-all ${
            active ? "h-3/4 bg-amber-400" : "h-2 bg-stone-700"
          }"></span>`;
          hole.addEventListener("click", () => whack(i));
          boardEl.appendChild(hole);
        }
      }

      function updateStats() {
        scoreEl.textContent = score;
        timeEl.textContent = timeLeft;
      }

      function showMole() {
        let next = Math.floor(Math.random() * 9);
        if (next === activeHole) next = (next + 1) % 9;
        activeHole = next;
        renderBoard();
      }

      function whack(index) {
        if (!playing) return;
        if (index === activeHole) {
          score += 1;
          messageEl.textContent = "命中！继续找下一个目标。";
          showMole();
        } else {
          messageEl.textContent = "没打中，等目标冒出来再点。";
        }
        updateStats();
      }

      function startGame() {
        clearTimers();
        score = 0;
        timeLeft = 30;
        playing = true;
        startButton.disabled = true;
        startButton.classList.add("cursor-not-allowed", "bg-stone-600", "text-stone-300");
        messageEl.textContent = "目标出现时点击它。";
        showMole();
        updateStats();
        moleTimer = setInterval(showMole, 800);
        gameTimer = setInterval(() => {
          timeLeft -= 1;
          updateStats();
          if (timeLeft <= 0) endGame();
        }, 1000);
      }

      function endGame() {
        clearTimers();
        playing = false;
        activeHole = -1;
        startButton.disabled = false;
        startButton.classList.remove("cursor-not-allowed", "bg-stone-600", "text-stone-300");
        messageEl.textContent = `时间到！最终分数 ${score}。`;
        renderBoard();
      }

      function resetGame() {
        clearTimers();
        activeHole = -1;
        score = 0;
        timeLeft = 30;
        playing = false;
        startButton.disabled = false;
        startButton.classList.remove("cursor-not-allowed", "bg-stone-600", "text-stone-300");
        messageEl.textContent = "30 秒内尽量击中出现的目标。";
        updateStats();
        renderBoard();
      }

      function clearTimers() {
        clearInterval(gameTimer);
        clearInterval(moleTimer);
      }

      startButton.addEventListener("click", startGame);
      resetButton.addEventListener("click", resetGame);
      resetGame();
    </script>
  </body>
</html>
