<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Light Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col items-center justify-center gap-6 px-4 py-8">
      <section class="w-full rounded border border-slate-700 bg-slate-900 p-5 shadow-2xl shadow-cyan-950/40">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="text-sm font-semibold uppercase tracking-wide text-cyan-300">Akari</p>
            <h1 class="mt-1 text-3xl font-bold text-white">Mini Light Up</h1>
          </div>
          <div class="flex items-center gap-3">
            <div class="rounded border border-slate-700 px-3 py-2 text-sm">
              <span class="text-slate-400">灯泡</span>
              <span id="bulbCount" class="ml-2 font-semibold text-amber-300">0</span>
            </div>
            <button
              id="resetBtn"
              class="rounded bg-cyan-400 px-4 py-2 text-sm font-bold text-slate-950 transition hover:bg-cyan-300"
            >
              重开
            </button>
          </div>
        </div>

        <div id="board" class="mx-auto mt-6 grid w-full max-w-[380px] grid-cols-5 gap-1"></div>

        <div class="mt-5 grid gap-3 sm:grid-cols-3">
          <div class="rounded border border-slate-700 bg-slate-950/70 px-3 py-2 text-center">
            <p class="text-xs text-slate-400">未照亮</p>
            <p id="darkCount" class="text-xl font-bold text-cyan-200">0</p>
          </div>
          <div class="rounded border border-slate-700 bg-slate-950/70 px-3 py-2 text-center">
            <p class="text-xs text-slate-400">冲突</p>
            <p id="conflictCount" class="text-xl font-bold text-rose-300">0</p>
          </div>
          <div class="rounded border border-slate-700 bg-slate-950/70 px-3 py-2 text-center">
            <p class="text-xs text-slate-400">线索错误</p>
            <p id="clueCount" class="text-xl font-bold text-amber-300">0</p>
          </div>
        </div>

        <p id="message" class="mt-5 min-h-7 text-center text-sm font-semibold text-slate-300">
          点击空格放置灯泡。灯光沿横竖方向传播，遇到黑墙停止。
        </p>
      </section>
    </main>

    <script>
      const puzzle = [
        ["", "", "1", "", ""],
        ["", "x", "", "", "2"],
        ["0", "", "", "x", ""],
        ["", "", "2", "", ""],
        ["", "1", "", "", "x"],
      ];

      const solution = new Set(["0,1", "1,2", "2,4", "3,0", "4,2"]);
      const board = document.getElementById("board");
      const bulbCount = document.getElementById("bulbCount");
      const darkCount = document.getElementById("darkCount");
      const conflictCount = document.getElementById("conflictCount");
      const clueCount = document.getElementById("clueCount");
      const message = document.getElementById("message");
      const resetBtn = document.getElementById("resetBtn");
      const bulbs = new Set();

      function key(row, col) {
        return `${row},${col}`;
      }

      function isWall(row, col) {
        return puzzle[row][col] !== "";
      }

      function neighbors(row, col) {
        return [
          [row - 1, col],
          [row + 1, col],
          [row, col - 1],
          [row, col + 1],
        ].filter(([r, c]) => r >= 0 && r < 5 && c >= 0 && c < 5);
      }

      function litCells() {
        const lit = new Set();
        const conflicts = new Set();
        const directions = [
          [1, 0],
          [-1, 0],
          [0, 1],
          [0, -1],
        ];

        bulbs.forEach((spot) => {
          const [row, col] = spot.split(",").map(Number);
          lit.add(spot);
          directions.forEach(([dr, dc]) => {
            let r = row + dr;
            let c = col + dc;
            while (r >= 0 && r < 5 && c >= 0 && c < 5 && !isWall(r, c)) {
              const next = key(r, c);
              lit.add(next);
              if (bulbs.has(next)) {
                conflicts.add(spot);
                conflicts.add(next);
              }
              r += dr;
              c += dc;
            }
          });
        });

        return { lit, conflicts };
      }

      function clueErrors() {
        const errors = new Set();
        puzzle.forEach((row, r) => {
          row.forEach((cell, c) => {
            if (!/^\d$/.test(cell)) return;
            const count = neighbors(r, c).filter(([nr, nc]) => bulbs.has(key(nr, nc))).length;
            if (count !== Number(cell)) errors.add(key(r, c));
          });
        });
        return errors;
      }

      function solved(lit, conflicts, errors) {
        if (conflicts.size || errors.size) return false;
        for (let row = 0; row < 5; row += 1) {
          for (let col = 0; col < 5; col += 1) {
            if (!isWall(row, col) && !lit.has(key(row, col))) return false;
          }
        }
        return true;
      }

      function render() {
        const { lit, conflicts } = litCells();
        const errors = clueErrors();
        board.innerHTML = "";
        let dark = 0;

        puzzle.forEach((row, r) => {
          row.forEach((cell, c) => {
            const spot = key(r, c);
            const button = document.createElement("button");
            button.type = "button";
            button.className =
              "aspect-square rounded border text-xl font-black transition focus:outline-none focus:ring-2 focus:ring-cyan-300";

            if (isWall(r, c)) {
              const bad = errors.has(spot);
              button.disabled = true;
              button.textContent = cell === "x" ? "" : cell;
              button.className += bad
                ? " border-rose-400 bg-rose-950 text-rose-200"
                : " border-slate-800 bg-slate-950 text-slate-100";
            } else {
              const hasBulb = bulbs.has(spot);
              const isLit = lit.has(spot);
              if (!isLit) dark += 1;
              button.textContent = hasBulb ? "•" : "";
              button.ariaLabel = hasBulb ? "移除灯泡" : "放置灯泡";
              button.className += conflicts.has(spot)
                ? " border-rose-400 bg-rose-500 text-white"
                : hasBulb
                  ? " border-amber-300 bg-amber-300 text-slate-950"
                  : isLit
                    ? " border-cyan-200 bg-cyan-100 text-slate-950"
                    : " border-slate-700 bg-slate-800 text-slate-100 hover:bg-slate-700";
              button.addEventListener("click", () => {
                bulbs.has(spot) ? bulbs.delete(spot) : bulbs.add(spot);
                render();
              });
            }

            board.appendChild(button);
          });
        });

        bulbCount.textContent = bulbs.size;
        darkCount.textContent = dark;
        conflictCount.textContent = conflicts.size;
        clueCount.textContent = errors.size;

        if (solved(lit, conflicts, errors)) {
          message.textContent = "完成！所有白格被照亮，且没有灯泡互照或数字墙错误。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-emerald-300";
        } else if (conflicts.size) {
          message.textContent = "有灯泡互相照到，移开红色灯泡。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-rose-300";
        } else if (errors.size) {
          message.textContent = "数字墙旁边的灯泡数量还不匹配。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-amber-300";
        } else {
          message.textContent = "继续照亮所有空格。";
          message.className = "mt-5 min-h-7 text-center text-sm font-semibold text-slate-300";
        }
      }

      resetBtn.addEventListener("click", () => {
        bulbs.clear();
        render();
      });

      render();
    </script>
  </body>
</html>
