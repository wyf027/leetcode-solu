<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shell Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-emerald-800 bg-emerald-900 p-5 shadow-2xl">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Shell Game</h1>
          <p class="mt-1 text-sm text-emerald-300">Watch the hidden ball, shuffle the shells, then choose the right cup.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-emerald-700 px-3 py-2 text-sm">Score: <strong id="score">0</strong></span>
          <span class="rounded border border-emerald-700 px-3 py-2 text-sm">Round: <strong id="round">1</strong></span>
          <button id="startBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-bold text-emerald-950 hover:bg-amber-200">Shuffle</button>
        </div>
      </div>

      <div id="table" class="grid gap-3 sm:grid-cols-3">
        <button class="shell rounded-lg border border-emerald-700 bg-emerald-950 p-6 text-center hover:bg-emerald-800" data-index="0">
          <div class="text-7xl">⌂</div>
          <div class="mt-2 text-sm font-bold">Cup 1</div>
        </button>
        <button class="shell rounded-lg border border-emerald-700 bg-emerald-950 p-6 text-center hover:bg-emerald-800" data-index="1">
          <div class="text-7xl">⌂</div>
          <div class="mt-2 text-sm font-bold">Cup 2</div>
        </button>
        <button class="shell rounded-lg border border-emerald-700 bg-emerald-950 p-6 text-center hover:bg-emerald-800" data-index="2">
          <div class="text-7xl">⌂</div>
          <div class="mt-2 text-sm font-bold">Cup 3</div>
        </button>
      </div>

      <div class="mt-4 grid gap-3 md:grid-cols-[1fr_180px]">
        <p id="message" class="rounded border border-emerald-700 bg-emerald-950 p-3 text-sm text-emerald-200">Press Shuffle to begin. The ball will flash under one cup.</p>
        <button id="resetBtn" class="rounded border border-emerald-700 px-4 py-2 text-sm font-bold hover:bg-emerald-800">Reset</button>
      </div>
    </section>
  </main>

  <script>
    const shells = [...document.querySelectorAll('.shell')];
    const scoreEl = document.getElementById('score');
    const roundEl = document.getElementById('round');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    let ball = 0;
    let score = 0;
    let round = 1;
    let guessing = false;
    let shuffling = false;

    function resetGame() {
      ball = 0;
      score = 0;
      round = 1;
      guessing = false;
      shuffling = false;
      message.textContent = 'Press Shuffle to begin. The ball will flash under one cup.';
      render();
    }

    function chooseBall() {
      ball = Math.floor(Math.random() * shells.length);
    }

    function swapCups(a, b) {
      if (ball === a) ball = b;
      else if (ball === b) ball = a;
      shells[a].classList.add('translate-y-2');
      shells[b].classList.add('-translate-y-2');
      setTimeout(() => {
        shells[a].classList.remove('translate-y-2');
        shells[b].classList.remove('-translate-y-2');
      }, 140);
    }

    function startShuffle() {
      if (shuffling) return;
      chooseBall();
      guessing = false;
      shuffling = true;
      message.textContent = `The ball is under cup ${ball + 1}. Watch closely.`;
      render(true);
      let steps = 0;
      const totalSteps = 7 + Math.min(round, 5);
      setTimeout(() => {
        const timer = setInterval(() => {
          let a = Math.floor(Math.random() * 3);
          let b = Math.floor(Math.random() * 3);
          while (b === a) b = Math.floor(Math.random() * 3);
          swapCups(a, b);
          steps += 1;
          if (steps >= totalSteps) {
            clearInterval(timer);
            shuffling = false;
            guessing = true;
            message.textContent = 'Pick the cup hiding the ball.';
            render();
          }
        }, 220);
      }, 900);
    }

    function pickCup(index) {
      if (!guessing) return;
      guessing = false;
      if (index === ball) {
        score += 1;
        message.textContent = 'Correct. The ball was there.';
      } else {
        message.textContent = `Missed. The ball was under cup ${ball + 1}.`;
      }
      round += 1;
      render(true);
    }

    function render(reveal = false) {
      scoreEl.textContent = score;
      roundEl.textContent = round;
      shells.forEach((shell, index) => {
        shell.disabled = shuffling;
        shell.classList.toggle('ring-4', reveal && index === ball);
        shell.classList.toggle('ring-amber-200', reveal && index === ball);
        shell.querySelector('.text-7xl').textContent = reveal && index === ball ? '●' : '⌂';
      });
    }

    startBtn.addEventListener('click', startShuffle);
    resetBtn.addEventListener('click', resetGame);
    shells.forEach(shell => shell.addEventListener('click', () => pickCup(Number(shell.dataset.index))));
    resetGame();
  </script>
</body>
</html>
