<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Concentration Grid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-violet-950 text-violet-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Concentration Grid</h1>
        <p class="text-sm text-violet-200">Flip two cards at a time and clear all matching pairs.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-white px-4 py-2 font-semibold text-violet-950 hover:bg-violet-100">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-violet-700 bg-violet-900 p-3 sm:grid-cols-4">
      <div>Moves: <b id="moveText">0</b></div>
      <div>Pairs: <b id="pairText">0</b>/8</div>
      <div>Best: <b id="bestText">-</b></div>
      <div id="message" class="text-violet-100">Find the first pair.</div>
    </section>

    <section id="grid" class="grid grid-cols-4 gap-2"></section>
  </main>

  <script>
    const icons = ["★", "◆", "●", "▲", "☀", "☂", "☕", "♫"];
    const grid = document.getElementById("grid");
    const moveText = document.getElementById("moveText");
    const pairText = document.getElementById("pairText");
    const bestText = document.getElementById("bestText");
    const message = document.getElementById("message");
    const newGameBtn = document.getElementById("newGameBtn");
    let cards = [];
    let open = [];
    let matched = new Set();
    let moves = 0;
    let best = null;
    let locked = false;

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function flipCard(index) {
      if (locked || matched.has(index) || open.includes(index) || open.length === 2) return;
      open.push(index);
      if (open.length === 2) {
        moves += 1;
        moveText.textContent = String(moves);
        checkMatch();
      }
      renderGrid();
    }

    function checkMatch() {
      const [first, second] = open;
      if (cards[first] === cards[second]) {
        matched.add(first);
        matched.add(second);
        open = [];
        const pairs = matched.size / 2;
        pairText.textContent = `${pairs}/8`;
        if (pairs === icons.length) {
          best = best === null ? moves : Math.min(best, moves);
          bestText.textContent = String(best);
          message.textContent = `Cleared in ${moves} moves.`;
        } else {
          message.textContent = "Pair found. Keep going.";
        }
      } else {
        locked = true;
        message.textContent = "No match.";
        window.setTimeout(() => {
          open = [];
          locked = false;
          renderGrid();
        }, 700);
      }
    }

    function renderGrid() {
      grid.innerHTML = "";
      cards.forEach((symbol, index) => {
        const visible = open.includes(index) || matched.has(index);
        const button = document.createElement("button");
        button.className = [
          "flex aspect-square items-center justify-center rounded text-4xl font-bold shadow transition",
          visible ? "bg-fuchsia-300 text-violet-950" : "bg-violet-800 text-transparent hover:bg-violet-700",
          matched.has(index) ? "opacity-70" : ""
        ].join(" ");
        button.textContent = visible ? symbol : "?";
        button.addEventListener("click", () => flipCard(index));
        grid.appendChild(button);
      });
    }

    function newGame() {
      cards = shuffle([...icons, ...icons]);
      open = [];
      matched = new Set();
      moves = 0;
      locked = false;
      moveText.textContent = "0";
      pairText.textContent = "0/8";
      message.textContent = "Find the first pair.";
      renderGrid();
    }

    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
