<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Match Stick</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-5 shadow-2xl">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-widest text-orange-300">Classic Mini Game</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Match Stick</h1>
          <p class="mt-2 text-sm text-zinc-300">Take 1-3 matches each turn. Whoever takes the final match loses.</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded-md bg-zinc-800 px-3 py-2">
            <div class="text-zinc-400">Matches</div>
            <div id="matchCount" class="text-xl font-bold text-white">21</div>
          </div>
          <div class="rounded-md bg-zinc-800 px-3 py-2">
            <div class="text-zinc-400">You</div>
            <div id="playerWins" class="text-xl font-bold text-white">0</div>
          </div>
          <div class="rounded-md bg-zinc-800 px-3 py-2">
            <div class="text-zinc-400">CPU</div>
            <div id="cpuWins" class="text-xl font-bold text-white">0</div>
          </div>
        </div>
      </div>

      <div id="pile" class="mt-6 grid min-h-52 grid-cols-7 gap-3 rounded-lg bg-zinc-950 p-5"></div>

      <div class="mt-5 rounded-lg bg-zinc-950 p-4">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <p id="status" class="min-h-6 text-sm font-medium text-zinc-300">Your turn. Choose how many matches to take.</p>
          <div class="flex flex-wrap gap-2">
            <button data-take="1" class="takeBtn rounded-md bg-orange-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-orange-300">Take 1</button>
            <button data-take="2" class="takeBtn rounded-md bg-orange-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-orange-300">Take 2</button>
            <button data-take="3" class="takeBtn rounded-md bg-orange-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-orange-300">Take 3</button>
            <button id="resetBtn" class="rounded-md bg-zinc-700 px-4 py-2 text-sm font-semibold text-white hover:bg-zinc-600">Reset</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const pileEl = document.getElementById('pile');
    const matchCountEl = document.getElementById('matchCount');
    const playerWinsEl = document.getElementById('playerWins');
    const cpuWinsEl = document.getElementById('cpuWins');
    const statusEl = document.getElementById('status');
    const takeButtons = [...document.querySelectorAll('.takeBtn')];
    const resetBtn = document.getElementById('resetBtn');

    let matches = 21;
    let playerWins = Number(localStorage.getItem('miniMatchStickPlayerWins') || 0);
    let cpuWins = Number(localStorage.getItem('miniMatchStickCpuWins') || 0);
    let locked = false;
    let gameOver = false;

    function resetGame() {
      matches = 21;
      locked = false;
      gameOver = false;
      statusEl.textContent = 'Your turn. Choose how many matches to take.';
      render();
    }

    function takeMatches(amount, actor) {
      const actual = Math.min(amount, matches);
      matches -= actual;
      if (matches === 0) {
        finishGame(actor);
        return actual;
      }
      render();
      return actual;
    }

    function playerTake(amount) {
      if (locked || gameOver || amount > matches) return;
      locked = true;
      const taken = takeMatches(amount, 'player');
      if (gameOver) return;
      statusEl.textContent = `You took ${taken}. CPU is thinking.`;
      setTimeout(cpuTurn, 450);
    }

    function cpuTurn() {
      if (gameOver) return;
      const amount = chooseCpuMove();
      const taken = takeMatches(amount, 'cpu');
      if (gameOver) return;
      locked = false;
      statusEl.textContent = `CPU took ${taken}. Your turn.`;
      render();
    }

    function chooseCpuMove() {
      if (matches <= 4) return Math.max(1, matches - 1);
      const target = (matches - 1) % 4;
      return target === 0 ? 1 + Math.floor(Math.random() * 3) : target;
    }

    function finishGame(loser) {
      gameOver = true;
      locked = true;
      if (loser === 'player') {
        cpuWins += 1;
        localStorage.setItem('miniMatchStickCpuWins', String(cpuWins));
        statusEl.textContent = 'You took the last match. CPU wins.';
      } else {
        playerWins += 1;
        localStorage.setItem('miniMatchStickPlayerWins', String(playerWins));
        statusEl.textContent = 'CPU took the last match. You win.';
      }
      render();
    }

    function render() {
      pileEl.innerHTML = '';
      for (let i = 0; i < matches; i++) {
        const match = document.createElement('div');
        match.className = 'mx-auto flex h-16 w-5 flex-col items-center';
        match.innerHTML = '<div class="h-4 w-4 rounded-full bg-red-500"></div><div class="h-12 w-2 rounded-b bg-amber-300"></div>';
        pileEl.appendChild(match);
      }
      matchCountEl.textContent = matches;
      playerWinsEl.textContent = playerWins;
      cpuWinsEl.textContent = cpuWins;
      takeButtons.forEach((button) => {
        const amount = Number(button.dataset.take);
        button.disabled = locked || gameOver || amount > matches;
        button.classList.toggle('opacity-45', button.disabled);
      });
    }

    takeButtons.forEach((button) => {
      button.addEventListener('click', () => playerTake(Number(button.dataset.take)));
    });
    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
