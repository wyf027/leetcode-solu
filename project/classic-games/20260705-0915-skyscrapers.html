<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Skyscrapers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-5 shadow-2xl">
      <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Skyscrapers</h1>
          <p class="mt-1 text-sm text-zinc-300">在每行每列填入 1-4，高度不能重复，边缘数字表示从该方向能看到的楼数。</p>
        </div>
        <button id="resetBtn" class="rounded-md bg-amber-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-amber-300">重开</button>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_14rem]">
        <div class="rounded-lg border border-zinc-700 bg-zinc-950 p-3">
          <div id="board" class="mx-auto grid aspect-square w-full max-w-[520px] grid-cols-6 grid-rows-6 gap-1"></div>
        </div>
        <aside class="rounded-lg border border-zinc-700 bg-zinc-800 p-4">
          <div class="text-sm font-semibold text-zinc-200">状态</div>
          <div id="status" class="mt-3 rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-300">点击格子循环 1-4，完成所有行列线索。</div>
          <div class="mt-4 text-sm font-semibold text-zinc-200">提示</div>
          <ul class="mt-2 space-y-2 text-sm text-zinc-300">
            <li>每行必须正好包含 1、2、3、4。</li>
            <li>每列也必须正好包含 1、2、3、4。</li>
            <li>高楼会挡住后面的矮楼。</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const solution = [
      [2, 1, 4, 3],
      [3, 4, 1, 2],
      [4, 2, 3, 1],
      [1, 3, 2, 4]
    ];
    const puzzle = [
      [0, 0, 4, 0],
      [0, 4, 0, 0],
      [4, 0, 0, 1],
      [0, 0, 0, 0]
    ];
    const grid = puzzle.map((row) => row.slice());
    const board = document.getElementById("board");
    const status = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    function visibleCount(line) {
      let highest = 0;
      let visible = 0;
      for (const value of line) {
        if (value > highest) {
          highest = value;
          visible++;
        }
      }
      return visible;
    }

    const topClues = [3, 2, 1, 2];
    const bottomClues = [2, 2, 3, 1];
    const leftClues = solution.map((row) => visibleCount(row));
    const rightClues = solution.map((row) => visibleCount([...row].reverse()));

    function getColumn(c) {
      return grid.map((row) => row[c]);
    }

    function allFilled() {
      return grid.every((row) => row.every(Boolean));
    }

    function uniqueSet(line) {
      return new Set(line).size === 4 && line.every((value) => value >= 1 && value <= 4);
    }

    function lineComplete(line, startClue, endClue) {
      return uniqueSet(line) && visibleCount(line) === startClue && visibleCount([...line].reverse()) === endClue;
    }

    function cellState(r, c) {
      if (!grid[r][c]) return "empty";
      const rowHasDup = grid[r].filter((value) => value === grid[r][c]).length > 1;
      const col = getColumn(c);
      const colHasDup = col.filter((value) => value === grid[r][c]).length > 1;
      return rowHasDup || colHasDup ? "bad" : "ok";
    }

    function solved() {
      if (!allFilled()) return false;
      for (let r = 0; r < 4; r++) {
        if (!lineComplete(grid[r], leftClues[r], rightClues[r])) return false;
      }
      for (let c = 0; c < 4; c++) {
        if (!lineComplete(getColumn(c), topClues[c], bottomClues[c])) return false;
      }
      return true;
    }

    function makeCell(text, className) {
      const cell = document.createElement("div");
      cell.className = className;
      cell.textContent = text;
      return cell;
    }

    function render() {
      board.innerHTML = "";
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          if ((r === 0 || r === 5) && (c === 0 || c === 5)) {
            board.appendChild(makeCell("", "flex items-center justify-center"));
            continue;
          }
          if (r === 0) {
            board.appendChild(makeCell(topClues[c - 1], "flex items-center justify-center rounded bg-zinc-800 text-sm font-bold text-amber-200"));
            continue;
          }
          if (r === 5) {
            board.appendChild(makeCell(bottomClues[c - 1], "flex items-center justify-center rounded bg-zinc-800 text-sm font-bold text-amber-200"));
            continue;
          }
          if (c === 0) {
            board.appendChild(makeCell(leftClues[r - 1], "flex items-center justify-center rounded bg-zinc-800 text-sm font-bold text-amber-200"));
            continue;
          }
          if (c === 5) {
            board.appendChild(makeCell(rightClues[r - 1], "flex items-center justify-center rounded bg-zinc-800 text-sm font-bold text-amber-200"));
            continue;
          }

          const rr = r - 1;
          const cc = c - 1;
          const fixed = puzzle[rr][cc] !== 0;
          const state = cellState(rr, cc);
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = [
            "flex items-center justify-center rounded border text-xl font-bold transition",
            fixed ? "border-amber-300 bg-amber-300 text-zinc-950" : "border-zinc-700 bg-zinc-900 hover:bg-zinc-800",
            state === "bad" ? "ring-2 ring-rose-500" : "",
            state === "ok" && !fixed ? "text-cyan-200" : "text-zinc-100"
          ].join(" ");
          cell.textContent = grid[rr][cc] || "";
          cell.disabled = fixed;
          cell.addEventListener("click", () => {
            grid[rr][cc] = (grid[rr][cc] % 4) + 1;
            render();
          });
          board.appendChild(cell);
        }
      }

      if (solved()) {
        status.textContent = "完成！所有楼高、行列唯一性和边缘可见线索都匹配。";
        status.className = "mt-3 rounded-md border border-emerald-500 bg-emerald-950 px-3 py-2 text-sm text-emerald-200";
      } else if (allFilled()) {
        status.textContent = "棋盘已填满，但仍有重复数字或边缘线索不匹配。";
        status.className = "mt-3 rounded-md border border-rose-500 bg-rose-950 px-3 py-2 text-sm text-rose-200";
      } else {
        status.textContent = "点击空格循环高度，先满足每行每列不重复。";
        status.className = "mt-3 rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-300";
      }
    }

    resetBtn.addEventListener("click", () => {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) grid[r][c] = puzzle[r][c];
      }
      render();
    });

    render();
  </script>
</body>
</html>
