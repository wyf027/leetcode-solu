<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Hangman</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-5 px-4 py-6 sm:py-8">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-neutral-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-normal text-white">Mini Hangman</h1>
        <p class="mt-1 text-sm text-neutral-400">Guess the hidden word before six misses.</p>
      </div>
      <button id="reset" class="rounded-md bg-orange-300 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-orange-200 focus:outline-none focus:ring-2 focus:ring-orange-100">
        New Word
      </button>
    </header>

    <section class="grid gap-5 md:grid-cols-[1fr_14rem]">
      <div class="rounded-md border border-neutral-800 bg-neutral-900 p-4 shadow-2xl shadow-orange-950/30">
        <div class="grid gap-4 md:grid-cols-[12rem_1fr]">
          <div class="rounded-md bg-neutral-950 p-4">
            <svg viewBox="0 0 120 150" class="h-64 w-full" aria-label="Hangman drawing">
              <line x1="20" y1="140" x2="100" y2="140" stroke="currentColor" stroke-width="5"></line>
              <line x1="35" y1="140" x2="35" y2="15" stroke="currentColor" stroke-width="5"></line>
              <line x1="35" y1="15" x2="82" y2="15" stroke="currentColor" stroke-width="5"></line>
              <line x1="82" y1="15" x2="82" y2="33" stroke="currentColor" stroke-width="4"></line>
              <circle id="part0" cx="82" cy="45" r="12" fill="none" stroke="currentColor" stroke-width="4"></circle>
              <line id="part1" x1="82" y1="57" x2="82" y2="92" stroke="currentColor" stroke-width="4"></line>
              <line id="part2" x1="82" y1="65" x2="62" y2="80" stroke="currentColor" stroke-width="4"></line>
              <line id="part3" x1="82" y1="65" x2="102" y2="80" stroke="currentColor" stroke-width="4"></line>
              <line id="part4" x1="82" y1="92" x2="64" y2="118" stroke="currentColor" stroke-width="4"></line>
              <line id="part5" x1="82" y1="92" x2="100" y2="118" stroke="currentColor" stroke-width="4"></line>
            </svg>
          </div>
          <div class="flex flex-col justify-between gap-5">
            <div id="word" class="flex min-h-20 flex-wrap items-center gap-3 text-4xl font-black tracking-widest text-white"></div>
            <div id="keyboard" class="grid grid-cols-7 gap-2"></div>
          </div>
        </div>
      </div>

      <aside class="grid content-start gap-3">
        <div class="rounded-md border border-neutral-800 bg-neutral-900 p-4">
          <div class="text-xs uppercase tracking-wider text-neutral-500">Misses</div>
          <div id="misses" class="mt-1 text-3xl font-bold text-orange-300">0/6</div>
        </div>
        <div class="rounded-md border border-neutral-800 bg-neutral-900 p-4">
          <div class="text-xs uppercase tracking-wider text-neutral-500">Tried</div>
          <div id="tried" class="mt-2 min-h-6 text-sm leading-6 text-neutral-300"></div>
        </div>
        <div id="status" class="rounded-md border border-neutral-800 bg-neutral-900 p-4 text-sm leading-6 text-neutral-300">
          Pick a letter.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const words = ["ARCADE", "PUZZLE", "JOYSTICK", "PIXEL", "BUTTON", "TOKEN", "LEVEL", "PLAYER"];
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const maxMisses = 6;
    const wordEl = document.querySelector("#word");
    const keyboardEl = document.querySelector("#keyboard");
    const missesEl = document.querySelector("#misses");
    const triedEl = document.querySelector("#tried");
    const statusEl = document.querySelector("#status");
    const resetBtn = document.querySelector("#reset");
    let secret = "";
    let guesses = new Set();
    let misses = 0;
    let locked = false;

    function resetGame() {
      secret = words[Math.floor(Math.random() * words.length)];
      guesses = new Set();
      misses = 0;
      locked = false;
      statusEl.textContent = "Pick a letter.";
      render();
    }

    function visibleWord() {
      return secret.split("").map((letter) => guesses.has(letter) ? letter : "_");
    }

    function hasWon() {
      return secret.split("").every((letter) => guesses.has(letter));
    }

    function guess(letter) {
      if (locked || guesses.has(letter)) return;
      guesses.add(letter);
      if (!secret.includes(letter)) misses += 1;
      if (hasWon()) {
        locked = true;
        statusEl.textContent = "Solved. Start a new word.";
      } else if (misses >= maxMisses) {
        locked = true;
        statusEl.textContent = `Missed it. The word was ${secret}.`;
      } else {
        statusEl.textContent = secret.includes(letter) ? "Good guess." : "No match.";
      }
      render();
    }

    function render() {
      wordEl.innerHTML = "";
      visibleWord().forEach((letter) => {
        const tile = document.createElement("span");
        tile.className = "flex h-14 w-10 items-center justify-center border-b-4 border-orange-300";
        tile.textContent = letter;
        wordEl.appendChild(tile);
      });

      keyboardEl.innerHTML = "";
      alphabet.forEach((letter) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "rounded-md border px-2 py-2 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-orange-100",
          guesses.has(letter) ? "border-neutral-800 bg-neutral-950 text-neutral-600" : "border-neutral-700 bg-neutral-800 text-neutral-100 hover:bg-neutral-700"
        ].join(" ");
        button.textContent = letter;
        button.disabled = locked || guesses.has(letter);
        button.addEventListener("click", () => guess(letter));
        keyboardEl.appendChild(button);
      });

      missesEl.textContent = `${misses}/${maxMisses}`;
      triedEl.textContent = Array.from(guesses).join(" ");
      for (let index = 0; index < maxMisses; index += 1) {
        document.querySelector(`#part${index}`).style.opacity = index < misses ? "1" : "0.15";
      }
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
