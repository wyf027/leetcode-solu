<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Connect Four</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-cyan-300">Classic Games</p>
        <h1 class="mt-1 text-3xl font-bold text-white sm:text-4xl">Mini Connect Four</h1>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2">
          <div class="text-zinc-400">Turn</div>
          <div id="turnLabel" class="font-bold text-red-300">Red</div>
        </div>
        <div class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2">
          <div class="text-zinc-400">Red</div>
          <div id="redScore" class="font-bold">0</div>
        </div>
        <div class="rounded-lg border border-zinc-700 bg-zinc-900 px-3 py-2">
          <div class="text-zinc-400">Yellow</div>
          <div id="yellowScore" class="font-bold">0</div>
        </div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_16rem]">
      <div class="rounded-lg border border-blue-900 bg-blue-950 p-3 shadow-2xl shadow-blue-950/40">
        <div id="dropRow" class="mb-3 grid grid-cols-7 gap-2"></div>
        <div id="board" class="grid grid-cols-7 gap-2 rounded-lg bg-blue-800 p-2"></div>
      </div>

      <aside class="flex flex-col gap-3 rounded-lg border border-zinc-800 bg-zinc-900 p-4">
        <div>
          <h2 class="text-lg font-semibold text-white">Status</h2>
          <p id="message" class="mt-2 min-h-12 text-sm leading-6 text-zinc-300">Drop a red disc into any open column. Yellow replies automatically.</p>
        </div>
        <button id="newGame" class="rounded-lg bg-cyan-400 px-4 py-3 font-bold text-zinc-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-200">
          New Game
        </button>
        <div class="rounded-lg bg-zinc-950 p-3 text-sm leading-6 text-zinc-300">
          Connect four discs horizontally, vertically, or diagonally before the computer does.
        </div>
      </aside>
    </section>
  </main>

  <script>
    const rows = 6;
    const cols = 7;
    const human = 1;
    const computer = 2;
    const boardEl = document.getElementById("board");
    const dropRow = document.getElementById("dropRow");
    const messageEl = document.getElementById("message");
    const turnLabel = document.getElementById("turnLabel");
    const redScoreEl = document.getElementById("redScore");
    const yellowScoreEl = document.getElementById("yellowScore");
    const newGameBtn = document.getElementById("newGame");

    let grid = [];
    let gameOver = false;
    let busy = false;
    let redScore = 0;
    let yellowScore = 0;

    function resetBoard() {
      grid = Array.from({ length: rows }, () => Array(cols).fill(0));
      gameOver = false;
      busy = false;
      setTurn("Red", "text-red-300");
      messageEl.textContent = "Drop a red disc into any open column. Yellow replies automatically.";
      render();
    }

    function setTurn(label, colorClass) {
      turnLabel.textContent = label;
      turnLabel.className = "font-bold " + colorClass;
    }

    function render() {
      dropRow.innerHTML = "";
      for (let c = 0; c < cols; c++) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Drop";
        button.disabled = gameOver || busy || grid[0][c] !== 0;
        button.className = "h-10 rounded-md bg-cyan-400 text-xs font-bold text-zinc-950 transition hover:bg-cyan-300 disabled:cursor-not-allowed disabled:bg-zinc-700 disabled:text-zinc-400";
        button.addEventListener("click", () => humanMove(c));
        dropRow.appendChild(button);
      }

      boardEl.innerHTML = "";
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const slot = document.createElement("div");
          const disc = document.createElement("div");
          slot.className = "aspect-square rounded-full bg-blue-950 p-1 shadow-inner";
          disc.className = "h-full w-full rounded-full border border-white/10 transition";
          if (grid[r][c] === human) {
            disc.classList.add("bg-red-500", "shadow-lg", "shadow-red-950");
          } else if (grid[r][c] === computer) {
            disc.classList.add("bg-yellow-300", "shadow-lg", "shadow-yellow-950");
          } else {
            disc.classList.add("bg-zinc-900");
          }
          slot.appendChild(disc);
          boardEl.appendChild(slot);
        }
      }
    }

    function humanMove(col) {
      if (gameOver || busy || !dropDisc(col, human)) return;
      render();
      if (finishIfNeeded(human)) return;
      busy = true;
      setTurn("Yellow", "text-yellow-200");
      messageEl.textContent = "Yellow is choosing a column...";
      setTimeout(computerMove, 300);
    }

    function computerMove() {
      const col = chooseComputerColumn();
      dropDisc(col, computer);
      busy = false;
      render();
      if (finishIfNeeded(computer)) return;
      setTurn("Red", "text-red-300");
      messageEl.textContent = "Your turn. Pick a column and try to connect four.";
      render();
    }

    function dropDisc(col, player) {
      for (let r = rows - 1; r >= 0; r--) {
        if (grid[r][col] === 0) {
          grid[r][col] = player;
          return true;
        }
      }
      return false;
    }

    function chooseComputerColumn() {
      const open = availableColumns();
      for (const col of open) {
        if (wouldWin(col, computer)) return col;
      }
      for (const col of open) {
        if (wouldWin(col, human)) return col;
      }
      const centerOrder = [3, 2, 4, 1, 5, 0, 6];
      const weighted = centerOrder.filter((col) => open.includes(col));
      return weighted[Math.floor(Math.random() * Math.min(weighted.length, 3))];
    }

    function availableColumns() {
      return Array.from({ length: cols }, (_, col) => col).filter((col) => grid[0][col] === 0);
    }

    function wouldWin(col, player) {
      const copy = grid.map((row) => row.slice());
      for (let r = rows - 1; r >= 0; r--) {
        if (copy[r][col] === 0) {
          copy[r][col] = player;
          return hasConnect(copy, player);
        }
      }
      return false;
    }

    function finishIfNeeded(player) {
      if (hasConnect(grid, player)) {
        gameOver = true;
        if (player === human) {
          redScore += 1;
          redScoreEl.textContent = redScore;
          setTurn("Red wins", "text-red-300");
          messageEl.textContent = "Red connects four. Start a new game to play again.";
        } else {
          yellowScore += 1;
          yellowScoreEl.textContent = yellowScore;
          setTurn("Yellow wins", "text-yellow-200");
          messageEl.textContent = "Yellow connects four. Try blocking earlier next round.";
        }
        render();
        return true;
      }

      if (availableColumns().length === 0) {
        gameOver = true;
        setTurn("Draw", "text-zinc-200");
        messageEl.textContent = "The board is full. No four-in-a-row this time.";
        render();
        return true;
      }

      return false;
    }

    function hasConnect(source, player) {
      const directions = [
        [0, 1],
        [1, 0],
        [1, 1],
        [1, -1],
      ];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (source[r][c] !== player) continue;
          for (const [dr, dc] of directions) {
            let total = 1;
            for (let step = 1; step < 4; step++) {
              const nr = r + dr * step;
              const nc = c + dc * step;
              if (nr < 0 || nr >= rows || nc < 0 || nc >= cols || source[nr][nc] !== player) break;
              total += 1;
            }
            if (total >= 4) return true;
          }
        }
      }
      return false;
    }

    newGameBtn.addEventListener("click", resetBoard);
    resetBoard();
  </script>
</body>
</html>
