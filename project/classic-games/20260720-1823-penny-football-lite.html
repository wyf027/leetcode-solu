<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Penny Football</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-6 px-4 py-6 md:flex-row md:items-center md:justify-center">
    <section class="w-full md:w-[23rem]">
      <p class="text-sm uppercase tracking-[0.28em] text-lime-300">Classic table game</p>
      <h1 class="mt-2 text-3xl font-semibold">Mini Penny Football</h1>
      <p class="mt-3 text-sm leading-6 text-slate-300">
        经典硬币足球的迷你版。轮流点击球附近的相邻格推动硬币，越过对方球门线得一分，先得 3 分获胜。
      </p>
      <div class="mt-5 grid grid-cols-3 gap-3">
        <div class="rounded border border-slate-700 bg-slate-900 p-3">
          <div class="text-sm text-slate-400">蓝队</div>
          <div id="blueScore" class="mt-1 text-xl font-semibold text-sky-200">0</div>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 p-3">
          <div class="text-sm text-slate-400">回合</div>
          <div id="turnLabel" class="mt-1 text-xl font-semibold text-lime-200">蓝队</div>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 p-3">
          <div class="text-sm text-slate-400">红队</div>
          <div id="redScore" class="mt-1 text-xl font-semibold text-rose-200">0</div>
        </div>
      </div>
      <div id="message" class="mt-4 min-h-14 rounded border border-lime-400/30 bg-lime-400/10 p-3 text-sm leading-6 text-lime-100">
        蓝队先手，点击硬币周围一格推进。
      </div>
      <button id="resetBtn" class="mt-4 w-full rounded bg-lime-300 px-4 py-3 font-semibold text-slate-950 transition hover:bg-lime-200">
        重新开始
      </button>
    </section>

    <section class="w-full">
      <div class="mx-auto max-w-[34rem] rounded border border-slate-700 bg-emerald-950 p-4 shadow-2xl">
        <div class="mb-2 flex justify-center text-xs uppercase tracking-[0.22em] text-rose-200">红队球门</div>
        <div id="field" class="grid grid-cols-7 gap-1"></div>
        <div class="mt-2 flex justify-center text-xs uppercase tracking-[0.22em] text-sky-200">蓝队球门</div>
      </div>
    </section>
  </main>

  <script>
    const rows = 9;
    const cols = 7;
    const goalCols = [2, 3, 4];
    const fieldEl = document.getElementById("field");
    const turnLabel = document.getElementById("turnLabel");
    const blueScore = document.getElementById("blueScore");
    const redScore = document.getElementById("redScore");
    const messageEl = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    let ball;
    let turn;
    let scores;
    let winner;

    function resetGame() {
      ball = { row: 4, col: 3 };
      turn = "blue";
      scores = { blue: 0, red: 0 };
      winner = null;
      messageEl.textContent = "蓝队先手，点击硬币周围一格推进。";
      render();
    }

    function playerName(player) {
      return player === "blue" ? "蓝队" : "红队";
    }

    function other(player) {
      return player === "blue" ? "red" : "blue";
    }

    function resetKickoff(nextTurn) {
      ball = { row: 4, col: 3 };
      turn = nextTurn;
      messageEl.textContent = playerName(turn) + "中圈开球。";
    }

    function isAdjacent(row, col) {
      const dr = Math.abs(row - ball.row);
      const dc = Math.abs(col - ball.col);
      return dr <= 1 && dc <= 1 && dr + dc > 0;
    }

    function moveBall(row, col) {
      if (winner) return;
      if (!isAdjacent(row, col)) {
        messageEl.textContent = "只能点击硬币周围相邻的一格。";
        return;
      }

      ball = { row, col };
      if (ball.row === 0 && goalCols.includes(ball.col)) {
        scores.blue += 1;
        if (scores.blue >= 3) {
          winner = "blue";
          messageEl.textContent = "蓝队打进第三球，赢得比赛。";
        } else {
          resetKickoff("red");
        }
      } else if (ball.row === rows - 1 && goalCols.includes(ball.col)) {
        scores.red += 1;
        if (scores.red >= 3) {
          winner = "red";
          messageEl.textContent = "红队打进第三球，赢得比赛。";
        } else {
          resetKickoff("blue");
        }
      } else {
        turn = other(turn);
        messageEl.textContent = playerName(turn) + "行动，继续推动硬币。";
      }
      render();
    }

    function render() {
      fieldEl.innerHTML = "";
      turnLabel.textContent = winner ? playerName(winner) + "胜" : playerName(turn);
      blueScore.textContent = scores.blue;
      redScore.textContent = scores.red;

      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const cell = document.createElement("button");
          const isGoal = (row === 0 || row === rows - 1) && goalCols.includes(col);
          const isBall = ball.row === row && ball.col === col;
          const playable = !winner && isAdjacent(row, col);
          cell.type = "button";
          cell.className = [
            "aspect-square rounded border text-sm font-semibold transition",
            isGoal ? "border-amber-200 bg-amber-200/20" : "border-emerald-800 bg-emerald-900",
            playable ? "hover:border-lime-200 hover:bg-lime-300/20" : "",
            winner ? "cursor-default" : ""
          ].join(" ");
          cell.addEventListener("click", () => moveBall(row, col));

          if (isBall) {
            const coin = document.createElement("span");
            coin.className = "mx-auto block h-8 w-8 rounded-full bg-zinc-200 shadow-inner shadow-zinc-500 ring-2 ring-zinc-700";
            cell.appendChild(coin);
          } else {
            cell.textContent = isGoal ? "门" : "";
          }
          fieldEl.appendChild(cell);
        }
      }
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
