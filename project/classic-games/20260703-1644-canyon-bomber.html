<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Canyon Bomber</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-sky-950 text-sky-50">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-4 p-4">
      <section class="w-full rounded-lg border border-sky-700 bg-sky-900/90 p-4 shadow-xl">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Canyon Bomber</h1>
            <p class="text-sm text-sky-200">空格投弹，炸开峡谷方块。清掉 25 块即可完成任务。</p>
          </div>
          <div class="flex gap-3 text-sm">
            <span>得分 <strong id="score">0</strong></span>
            <span>炸弹 <strong id="bombs">24</strong></span>
            <span>命中 <strong id="hits">0</strong>/25</span>
          </div>
        </div>

        <canvas id="game" width="520" height="420" class="w-full rounded-md border border-sky-700 bg-slate-950"></canvas>

        <div class="mt-3 grid grid-cols-2 gap-2">
          <button id="dropBtn" class="rounded bg-amber-400 px-3 py-2 font-semibold text-slate-950 hover:bg-amber-300">投弹</button>
          <button id="restartBtn" class="rounded bg-sky-100 px-3 py-2 font-semibold text-slate-950 hover:bg-white">重新开始</button>
        </div>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const bombsEl = document.getElementById("bombs");
      const hitsEl = document.getElementById("hits");
      const cols = 20;
      const rows = 9;
      const blockW = 24;
      const blockH = 18;
      const terrainTop = 238;
      let plane;
      let bombs;
      let blocks;
      let score;
      let bombsLeft;
      let hits;
      let frame;
      let running;
      let message;

      function resetGame() {
        plane = { x: 34, y: 58, vx: 2.25, dir: 1, cooldown: 0 };
        bombs = [];
        blocks = [];
        score = 0;
        bombsLeft = 24;
        hits = 0;
        frame = 0;
        running = true;
        message = "";
        buildCanyon();
        updateHud();
      }

      function buildCanyon() {
        for (let row = 0; row < rows; row += 1) {
          for (let col = 0; col < cols; col += 1) {
            const edge = col < 3 || col > cols - 4;
            const density = edge ? 0.95 : 0.64 + row * 0.03;
            if (Math.random() < density) {
              blocks.push({ x: 20 + col * blockW, y: terrainTop + row * blockH, w: blockW - 2, h: blockH - 2, row, col });
            }
          }
        }
      }

      function updateHud() {
        scoreEl.textContent = score;
        bombsEl.textContent = bombsLeft;
        hitsEl.textContent = hits;
      }

      function dropBomb() {
        if (!running || bombsLeft <= 0 || plane.cooldown > 0) return;
        bombs.push({ x: plane.x + plane.dir * 20, y: plane.y + 8, vy: 2.5, r: 4 });
        bombsLeft -= 1;
        plane.cooldown = 18;
        updateHud();
      }

      function updatePlane() {
        plane.x += plane.vx * plane.dir;
        if (plane.x > canvas.width - 38) {
          plane.dir = -1;
          plane.y += 18;
        }
        if (plane.x < 38) {
          plane.dir = 1;
          plane.y += 18;
        }
        if (plane.cooldown > 0) plane.cooldown -= 1;
        if (plane.y > terrainTop - 38) {
          running = false;
          message = "飞行高度耗尽";
        }
      }

      function updateBombs() {
        bombs.forEach((bomb) => {
          bomb.y += bomb.vy;
          bomb.vy += 0.08;
          const hit = blocks.find((block) => circleHitsRect(bomb, block));
          if (hit) {
            bomb.dead = true;
            removeBlock(hit);
            hits += 1;
            score += 10 + Math.max(0, rows - hit.row);
          }
          if (bomb.y > canvas.height) bomb.dead = true;
        });
        bombs = bombs.filter((bomb) => !bomb.dead);
      }

      function removeBlock(target) {
        blocks = blocks.filter((block) => block !== target);
      }

      function circleHitsRect(circle, rect) {
        const nearestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const nearestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        return Math.hypot(circle.x - nearestX, circle.y - nearestY) <= circle.r;
      }

      function checkGameState() {
        if (hits >= 25) {
          running = false;
          message = "峡谷已清理";
          score += 75;
        }
        if (bombsLeft <= 0 && bombs.length === 0 && hits < 25) {
          running = false;
          message = "炸弹用尽";
        }
        updateHud();
      }

      function renderPlane() {
        ctx.save();
        ctx.translate(plane.x, plane.y);
        ctx.scale(plane.dir, 1);
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(-20, -6, 40, 12);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(-4, -18, 18, 12);
        ctx.fillStyle = "#facc15";
        ctx.fillRect(10, -3, 16, 6);
        ctx.restore();
      }

      function renderScene() {
        const sky = ctx.createLinearGradient(0, 0, 0, terrainTop);
        sky.addColorStop(0, "#0c4a6e");
        sky.addColorStop(1, "#38bdf8");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, terrainTop);

        ctx.fillStyle = "#172554";
        ctx.fillRect(0, terrainTop, canvas.width, canvas.height - terrainTop);

        ctx.fillStyle = "#bae6fd";
        ctx.font = "12px system-ui";
        ctx.fillText("SPACE / 按钮投弹", 18, 28);

        blocks.forEach((block) => {
          ctx.fillStyle = block.row % 2 ? "#a16207" : "#854d0e";
          ctx.fillRect(block.x, block.y, block.w, block.h);
          ctx.fillStyle = "#facc15";
          ctx.fillRect(block.x + 3, block.y + 3, block.w - 6, 3);
        });

        bombs.forEach((bomb) => {
          ctx.fillStyle = "#111827";
          ctx.beginPath();
          ctx.arc(bomb.x, bomb.y, bomb.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#f97316";
          ctx.fillRect(bomb.x - 1, bomb.y - 8, 2, 5);
        });

        renderPlane();

        if (message) {
          ctx.fillStyle = "rgba(15, 23, 42, 0.84)";
          ctx.fillRect(88, 158, 344, 92);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 28px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(message, canvas.width / 2, 202);
          ctx.font = "14px system-ui";
          ctx.fillText("点击重新开始再飞一轮", canvas.width / 2, 226);
          ctx.textAlign = "start";
        }
      }

      function gameLoop() {
        frame += 1;
        if (running) {
          updatePlane();
          updateBombs();
          checkGameState();
        }
        renderScene();
        requestAnimationFrame(gameLoop);
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === " ") {
          event.preventDefault();
          dropBomb();
        }
      });
      document.getElementById("dropBtn").addEventListener("click", dropBomb);
      document.getElementById("restartBtn").addEventListener("click", resetGame);

      resetGame();
      gameLoop();
    </script>
  </body>
</html>
