<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Sum Pairs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-purple-950 text-purple-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-purple-800 bg-purple-900 p-5 shadow-2xl">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Sum Pairs</h1>
          <p class="mt-1 text-sm text-purple-200">Reveal two tiles. Keep pairs that add up to the target number.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-purple-700 px-3 py-2 text-sm">Target: <strong id="target">10</strong></span>
          <span class="rounded border border-purple-700 px-3 py-2 text-sm">Moves: <strong id="moves">0</strong></span>
          <button id="resetBtn" class="rounded bg-lime-300 px-4 py-2 text-sm font-bold text-purple-950 hover:bg-lime-200">Reset</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_220px]">
        <div id="board" class="grid grid-cols-4 gap-3 rounded-lg bg-purple-950 p-3"></div>
        <aside class="flex flex-col gap-3 rounded-lg border border-purple-700 bg-purple-950 p-3">
          <div class="rounded border border-purple-700 bg-purple-900 p-3">
            <div class="text-xs uppercase text-purple-200">Pairs found</div>
            <div id="pairs" class="mt-1 text-4xl font-black">0</div>
          </div>
          <p id="message" class="min-h-28 rounded border border-purple-700 bg-purple-900 p-3 text-sm text-purple-100">Pick two hidden numbers. Matching sums stay open.</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const targetValue = 10;
    const values = [1, 9, 2, 8, 3, 7, 4, 6, 1, 9, 2, 8, 3, 7, 4, 6];
    const boardEl = document.getElementById('board');
    const targetEl = document.getElementById('target');
    const movesEl = document.getElementById('moves');
    const pairsEl = document.getElementById('pairs');
    const message = document.getElementById('message');
    const resetBtn = document.getElementById('resetBtn');
    let tiles = [];
    let selected = [];
    let moves = 0;
    let locked = false;

    function shuffle(list) {
      const copy = [...list];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const pick = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[pick]] = [copy[pick], copy[index]];
      }
      return copy;
    }

    function resetGame() {
      tiles = shuffle(values).map((value, index) => ({ id: index, value, open: false, matched: false }));
      selected = [];
      moves = 0;
      locked = false;
      targetEl.textContent = targetValue;
      message.textContent = 'Pick two hidden numbers. Matching sums stay open.';
      render();
    }

    function selectTile(index) {
      if (locked) return;
      const tile = tiles[index];
      if (tile.open || tile.matched) return;
      tile.open = true;
      selected.push(index);
      if (selected.length === 2) checkPair();
      render();
    }

    function checkPair() {
      moves += 1;
      const [firstIndex, secondIndex] = selected;
      const first = tiles[firstIndex];
      const second = tiles[secondIndex];
      if (first.value + second.value === targetValue) {
        first.matched = true;
        second.matched = true;
        selected = [];
        message.textContent = `${first.value} + ${second.value} matched.`;
        if (tiles.every(tile => tile.matched)) message.textContent = `All pairs found in ${moves} moves.`;
        return;
      }
      locked = true;
      message.textContent = `${first.value} + ${second.value} is not ${targetValue}.`;
      setTimeout(() => {
        first.open = false;
        second.open = false;
        selected = [];
        locked = false;
        render();
      }, 650);
    }

    function render() {
      boardEl.innerHTML = '';
      movesEl.textContent = moves;
      pairsEl.textContent = tiles.filter(tile => tile.matched).length / 2;
      tiles.forEach((tile, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        const visible = tile.open || tile.matched;
        button.className = `aspect-square rounded-lg border text-3xl font-black ${tile.matched ? 'border-lime-300 bg-lime-300 text-purple-950' : visible ? 'border-purple-200 bg-purple-200 text-purple-950' : 'border-purple-700 bg-purple-800 hover:bg-purple-700'}`;
        button.textContent = visible ? tile.value : '?';
        button.addEventListener('click', () => selectTile(index));
        boardEl.appendChild(button);
      });
    }

    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
