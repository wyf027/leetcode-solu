<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Reflex Catcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-orange-950 text-orange-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-orange-800 bg-orange-900 p-5 shadow-2xl">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Reflex Catcher</h1>
          <p class="mt-1 text-sm text-orange-200">Catch ten flashes as quickly as you can. Misses cost time.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-orange-700 px-3 py-2 text-sm">Hits: <strong id="hits">0</strong>/10</span>
          <span class="rounded border border-orange-700 px-3 py-2 text-sm">Time: <strong id="time">0.0</strong>s</span>
          <button id="startBtn" class="rounded bg-cyan-300 px-4 py-2 text-sm font-bold text-orange-950 hover:bg-cyan-200">Start</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_220px]">
        <div id="arena" class="relative h-[420px] overflow-hidden rounded-lg border border-orange-700 bg-orange-950">
          <button id="target" class="absolute hidden h-16 w-16 rounded-full bg-cyan-300 font-black text-orange-950 shadow-2xl shadow-cyan-400/30">Hit</button>
        </div>
        <aside class="flex flex-col gap-3 rounded-lg border border-orange-700 bg-orange-950 p-3">
          <div class="rounded border border-orange-700 bg-orange-900 p-3">
            <div class="text-xs uppercase text-orange-200">Best time</div>
            <div id="bestTime" class="mt-1 text-4xl font-black">--</div>
          </div>
          <button id="resetBtn" class="rounded border border-orange-700 px-4 py-2 text-sm font-bold hover:bg-orange-800">Reset</button>
          <p id="message" class="min-h-28 rounded border border-orange-700 bg-orange-900 p-3 text-sm text-orange-100">Press Start, then click the flash before it jumps away.</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const arena = document.getElementById('arena');
    const target = document.getElementById('target');
    const hitsEl = document.getElementById('hits');
    const timeEl = document.getElementById('time');
    const bestTimeEl = document.getElementById('bestTime');
    const message = document.getElementById('message');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    let hits = 0;
    let misses = 0;
    let startTime = 0;
    let timer = null;
    let jumpTimer = null;
    let running = false;
    let bestTime = null;

    function resetGame() {
      stopTimers();
      hits = 0;
      misses = 0;
      running = false;
      target.classList.add('hidden');
      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50');
      message.textContent = 'Press Start, then click the flash before it jumps away.';
      render();
    }

    function startGame() {
      resetGame();
      running = true;
      startTime = performance.now();
      startBtn.disabled = true;
      startBtn.classList.add('opacity-50');
      message.textContent = 'Catch the flashes.';
      moveTarget();
      timer = setInterval(render, 100);
      jumpTimer = setInterval(() => {
        misses += 1;
        moveTarget();
      }, 1200);
    }

    function stopTimers() {
      clearInterval(timer);
      clearInterval(jumpTimer);
      timer = null;
      jumpTimer = null;
    }

    function moveTarget() {
      const maxX = arena.clientWidth - target.offsetWidth - 12;
      const maxY = arena.clientHeight - target.offsetHeight - 12;
      target.style.left = `${6 + Math.random() * Math.max(1, maxX)}px`;
      target.style.top = `${6 + Math.random() * Math.max(1, maxY)}px`;
      target.classList.remove('hidden');
    }

    function catchTarget() {
      if (!running) return;
      hits += 1;
      if (hits >= 10) {
        finishGame();
        return;
      }
      moveTarget();
      render();
    }

    function elapsedSeconds() {
      if (!running && !startTime) return 0;
      return (performance.now() - startTime) / 1000 + misses * 0.5;
    }

    function finishGame() {
      running = false;
      stopTimers();
      target.classList.add('hidden');
      const finalTime = elapsedSeconds();
      bestTime = bestTime === null ? finalTime : Math.min(bestTime, finalTime);
      message.textContent = `Finished in ${finalTime.toFixed(1)} seconds with ${misses} misses.`;
      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50');
      render();
    }

    function render() {
      hitsEl.textContent = hits;
      timeEl.textContent = running ? elapsedSeconds().toFixed(1) : '0.0';
      bestTimeEl.textContent = bestTime === null ? '--' : `${bestTime.toFixed(1)}s`;
    }

    target.addEventListener('click', catchTarget);
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
