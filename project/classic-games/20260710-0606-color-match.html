<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Color Match</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-fuchsia-950 text-fuchsia-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Color Match</h1>
        <p class="text-sm text-fuchsia-200">Match the prompt color before the timer runs out. Wrong picks cost a point.</p>
      </div>
      <button id="startBtn" class="rounded bg-white px-4 py-2 font-semibold text-fuchsia-950 hover:bg-fuchsia-100">Start</button>
    </header>

    <section class="grid gap-3 rounded border border-fuchsia-700 bg-fuchsia-900 p-3 sm:grid-cols-4">
      <div>Score: <b id="scoreText">0</b></div>
      <div>Best: <b id="bestText">0</b></div>
      <div>Time: <b id="timeText">30</b></div>
      <div id="message" class="text-fuchsia-100">Press Start.</div>
    </section>

    <section class="rounded border border-fuchsia-700 bg-fuchsia-900 p-5 text-center">
      <div class="text-sm uppercase tracking-wide text-fuchsia-200">Find this color</div>
      <div id="targetText" class="mt-2 text-4xl font-bold">Ready</div>
    </section>

    <section id="grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3"></section>
  </main>

  <script>
    const colors = [
      { name: "Red", className: "bg-red-500", text: "text-red-200" },
      { name: "Blue", className: "bg-blue-500", text: "text-blue-200" },
      { name: "Yellow", className: "bg-yellow-400", text: "text-yellow-100" },
      { name: "Green", className: "bg-green-500", text: "text-green-200" },
      { name: "Purple", className: "bg-purple-500", text: "text-purple-200" },
      { name: "Orange", className: "bg-orange-500", text: "text-orange-200" }
    ];
    const grid = document.getElementById("grid");
    const scoreText = document.getElementById("scoreText");
    const bestText = document.getElementById("bestText");
    const timeText = document.getElementById("timeText");
    const message = document.getElementById("message");
    const targetText = document.getElementById("targetText");
    const startBtn = document.getElementById("startBtn");
    let target = null;
    let score = 0;
    let best = 0;
    let timeLeft = 30;
    let timer = null;
    let active = false;

    function shuffle(items) {
      return [...items].sort(() => Math.random() - 0.5);
    }

    function nextPrompt() {
      target = colors[Math.floor(Math.random() * colors.length)];
      targetText.textContent = target.name;
      targetText.className = `mt-2 text-4xl font-bold ${target.text}`;
      renderGrid();
    }

    function chooseColor(name) {
      if (!active) return;
      if (name === target.name) {
        score += 1;
        message.textContent = "Match. Keep going.";
      } else {
        score = Math.max(0, score - 1);
        message.textContent = `Miss. That was ${target.name}.`;
      }
      scoreText.textContent = String(score);
      best = Math.max(best, score);
      bestText.textContent = String(best);
      nextPrompt();
    }

    function renderGrid() {
      grid.innerHTML = "";
      shuffle(colors).forEach((color) => {
        const button = document.createElement("button");
        button.className = `${color.className} min-h-28 rounded text-lg font-bold text-white shadow transition hover:scale-[1.02] disabled:cursor-not-allowed disabled:opacity-60`;
        button.textContent = color.name;
        button.disabled = !active;
        button.addEventListener("click", () => chooseColor(color.name));
        grid.appendChild(button);
      });
    }

    function endGame() {
      active = false;
      window.clearInterval(timer);
      timer = null;
      message.textContent = `Time. Final score: ${score}.`;
      targetText.textContent = "Done";
      targetText.className = "mt-2 text-4xl font-bold text-fuchsia-100";
      renderGrid();
    }

    function tickTimer() {
      timeLeft -= 1;
      timeText.textContent = String(timeLeft);
      if (timeLeft <= 0) endGame();
    }

    function startGame() {
      window.clearInterval(timer);
      score = 0;
      timeLeft = 30;
      active = true;
      scoreText.textContent = "0";
      timeText.textContent = "30";
      message.textContent = "Pick the matching color.";
      nextPrompt();
      timer = window.setInterval(tickTimer, 1000);
    }

    startBtn.addEventListener("click", startGame);
    renderGrid();
  </script>
</body>
</html>
