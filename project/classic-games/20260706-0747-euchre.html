<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Euchre</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-emerald-700 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Mini Euchre</h1>
        <p class="mt-1 text-sm text-emerald-200">Win three of five tricks. Follow suit when you can; trump beats the lead suit.</p>
      </div>
      <button id="newHandBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-bold text-emerald-950 hover:bg-amber-200">New Hand</button>
    </header>

    <section class="grid gap-4 md:grid-cols-4">
      <div class="rounded border border-emerald-700 bg-emerald-900 p-4">
        <p class="text-xs uppercase text-emerald-300">Trump</p>
        <p id="trumpLabel" class="mt-2 text-3xl font-black"></p>
      </div>
      <div class="rounded border border-emerald-700 bg-emerald-900 p-4">
        <p class="text-xs uppercase text-emerald-300">Tricks</p>
        <p class="mt-2 text-2xl font-bold"><span id="playerScore">0</span> - <span id="rivalScore">0</span></p>
      </div>
      <div class="rounded border border-emerald-700 bg-emerald-900 p-4">
        <p class="text-xs uppercase text-emerald-300">Round</p>
        <p id="roundLabel" class="mt-2 text-2xl font-bold">1 / 5</p>
      </div>
      <div class="rounded border border-emerald-700 bg-emerald-900 p-4">
        <p class="text-xs uppercase text-emerald-300">Lead Suit</p>
        <p id="leadLabel" class="mt-2 text-2xl font-bold">-</p>
      </div>
    </section>

    <section class="grid flex-1 gap-5 lg:grid-cols-[1fr_280px]">
      <div class="flex flex-col justify-between rounded border border-emerald-700 bg-emerald-900/70 p-4">
        <div>
          <p class="mb-3 text-sm font-semibold uppercase text-emerald-300">Table</p>
          <div class="grid min-h-44 place-items-center rounded bg-emerald-800/70 p-4">
            <div class="flex flex-wrap justify-center gap-4">
              <div class="text-center">
                <p class="mb-2 text-xs text-emerald-300">Rival</p>
                <div id="rivalCard" class="grid h-28 w-20 place-items-center rounded border border-emerald-400 bg-emerald-50 text-2xl font-black text-emerald-950">?</div>
              </div>
              <div class="text-center">
                <p class="mb-2 text-xs text-emerald-300">You</p>
                <div id="playerCard" class="grid h-28 w-20 place-items-center rounded border border-emerald-700 bg-emerald-950 text-2xl font-black text-emerald-100">-</div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-5">
          <div class="mb-3 flex items-center justify-between gap-3">
            <p class="text-sm font-semibold uppercase text-emerald-300">Your Hand</p>
            <button id="clearBtn" class="rounded border border-emerald-500 px-3 py-1 text-xs font-bold text-emerald-100 hover:bg-emerald-800">Clear Pick</button>
          </div>
          <div id="hand" class="grid grid-cols-2 gap-3 sm:grid-cols-5"></div>
        </div>
      </div>

      <aside class="rounded border border-emerald-700 bg-emerald-900 p-4">
        <p class="text-sm font-semibold uppercase text-emerald-300">Hand Log</p>
        <div id="message" class="mt-3 rounded bg-emerald-950 p-3 text-sm text-emerald-100">Choose a card to play the first trick.</div>
        <ol id="log" class="mt-4 space-y-2 text-sm text-emerald-200"></ol>
      </aside>
    </section>
  </main>

  <script>
    const suits = ["clubs", "diamonds", "hearts", "spades"];
    const icons = { clubs: "♣", diamonds: "♦", hearts: "♥", spades: "♠" };
    const sameColor = { clubs: "spades", spades: "clubs", diamonds: "hearts", hearts: "diamonds" };
    const ranks = ["9", "10", "J", "Q", "K", "A"];
    let deck = [];
    let hand = [];
    let rival = [];
    let trump = "clubs";
    let leadCard = null;
    let round = 1;
    let playerScore = 0;
    let rivalScore = 0;
    let locked = false;

    const handEl = document.getElementById("hand");
    const logEl = document.getElementById("log");
    const msgEl = document.getElementById("message");
    const trumpLabel = document.getElementById("trumpLabel");
    const leadLabel = document.getElementById("leadLabel");
    const rivalCardEl = document.getElementById("rivalCard");
    const playerCardEl = document.getElementById("playerCard");

    function buildDeck() {
      return suits.flatMap((suit) => ranks.map((rank) => ({ suit, rank, id: `${rank}-${suit}-${Math.random()}` })));
    }

    function shuffle(cards) {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function effectiveSuit(card) {
      if (card.rank === "J" && card.suit === sameColor[trump]) return trump;
      return card.suit;
    }

    function cardPower(card, leadSuit) {
      const suit = effectiveSuit(card);
      if (card.rank === "J" && card.suit === trump) return 200;
      if (card.rank === "J" && card.suit === sameColor[trump]) return 190;
      const base = { "9": 1, "10": 2, J: 3, Q: 4, K: 5, A: 6 }[card.rank];
      if (suit === trump) return 100 + base;
      if (suit === leadSuit) return 50 + base;
      return base;
    }

    function label(card) {
      return `${card.rank}${icons[card.suit]}`;
    }

    function colorClass(card) {
      return card.suit === "diamonds" || card.suit === "hearts" ? "text-red-700" : "text-emerald-950";
    }

    function legalCards() {
      const leadSuit = effectiveSuit(leadCard);
      const followers = hand.filter((card) => effectiveSuit(card) === leadSuit);
      return followers.length ? followers : hand;
    }

    function setMessage(text) {
      msgEl.textContent = text;
    }

    function render() {
      trumpLabel.textContent = icons[trump];
      document.getElementById("playerScore").textContent = playerScore;
      document.getElementById("rivalScore").textContent = rivalScore;
      document.getElementById("roundLabel").textContent = `${Math.min(round, 5)} / 5`;
      leadLabel.textContent = leadCard ? icons[effectiveSuit(leadCard)] : "-";
      rivalCardEl.textContent = leadCard ? label(leadCard) : "?";
      rivalCardEl.className = `grid h-28 w-20 place-items-center rounded border border-emerald-400 bg-emerald-50 text-2xl font-black ${leadCard ? colorClass(leadCard) : "text-emerald-950"}`;
      handEl.innerHTML = "";
      const legal = leadCard ? legalCards().map((card) => card.id) : [];
      hand.forEach((card) => {
        const canPlay = !locked && legal.includes(card.id);
        const btn = document.createElement("button");
        btn.className = `h-24 rounded border bg-emerald-50 text-2xl font-black shadow ${colorClass(card)} ${canPlay ? "border-amber-300 hover:-translate-y-1 hover:bg-amber-100" : "cursor-not-allowed border-emerald-700 opacity-45"}`;
        btn.textContent = label(card);
        btn.disabled = !canPlay;
        btn.addEventListener("click", () => playCard(card.id));
        handEl.appendChild(btn);
      });
    }

    function startTrick() {
      leadCard = rival.shift();
      playerCardEl.textContent = "-";
      setMessage(`Rival leads ${label(leadCard)}. Follow ${icons[effectiveSuit(leadCard)]} if you can.`);
      render();
    }

    function playCard(cardId) {
      if (locked) return;
      const index = hand.findIndex((card) => card.id === cardId);
      const played = hand.splice(index, 1)[0];
      const leadSuit = effectiveSuit(leadCard);
      const playerWins = cardPower(played, leadSuit) > cardPower(leadCard, leadSuit);
      playerCardEl.textContent = label(played);
      playerCardEl.className = `grid h-28 w-20 place-items-center rounded border border-amber-300 bg-emerald-50 text-2xl font-black ${colorClass(played)}`;
      if (playerWins) playerScore += 1;
      else rivalScore += 1;
      const item = document.createElement("li");
      item.textContent = `Trick ${round}: ${label(leadCard)} vs ${label(played)} - ${playerWins ? "you win" : "rival wins"}`;
      logEl.prepend(item);
      round += 1;
      locked = true;
      setTimeout(nextStep, 650);
    }

    function nextStep() {
      locked = false;
      if (playerScore === 3 || rivalScore === 3 || round > 5) {
        const won = playerScore > rivalScore;
        setMessage(won ? "You took the hand. New deal?" : "Rival took the hand. Try another deal.");
        leadCard = null;
        render();
        return;
      }
      startTrick();
    }

    function newHand() {
      deck = shuffle(buildDeck());
      trump = suits[Math.floor(Math.random() * suits.length)];
      hand = deck.splice(0, 5);
      rival = deck.splice(0, 5);
      round = 1;
      playerScore = 0;
      rivalScore = 0;
      locked = false;
      logEl.innerHTML = "";
      startTrick();
    }

    document.getElementById("newHandBtn").addEventListener("click", newHand);
    document.getElementById("clearBtn").addEventListener("click", render);
    newHand();
  </script>
</body>
</html>
