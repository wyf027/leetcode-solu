<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Night Driver</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-black text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-wrap items-center justify-between gap-3 border-b border-sky-300/20 pb-4">
      <div>
        <h1 class="text-2xl font-bold tracking-wide text-sky-200">Mini Night Driver</h1>
        <p class="text-sm text-slate-400">在黑夜公路上保持车道，避开反光路桩并尽量跑得更远。</p>
      </div>
      <button id="restartBtn" class="rounded border border-sky-300/50 px-4 py-2 text-sm font-semibold text-sky-100 transition hover:bg-sky-300/10">重新开始</button>
    </header>

    <section class="grid gap-4 md:grid-cols-[1fr_220px]">
      <div class="rounded-lg border border-slate-800 bg-slate-950 p-3 shadow-2xl shadow-sky-950/25">
        <canvas id="gameCanvas" width="720" height="480" class="h-auto w-full rounded bg-black"></canvas>
      </div>

      <aside class="grid content-start gap-3 rounded-lg border border-slate-800 bg-slate-950 p-4 text-sm">
        <div class="grid grid-cols-2 gap-2">
          <div class="rounded border border-slate-700 p-3">
            <div class="text-slate-400">分数</div>
            <div id="score" class="text-xl font-bold text-sky-200">0</div>
          </div>
          <div class="rounded border border-slate-700 p-3">
            <div class="text-slate-400">速度</div>
            <div id="speed" class="text-xl font-bold text-lime-200">0</div>
          </div>
          <div class="rounded border border-slate-700 p-3">
            <div class="text-slate-400">损伤</div>
            <div id="damage" class="text-xl font-bold text-rose-200">0</div>
          </div>
          <div class="rounded border border-slate-700 p-3">
            <div class="text-slate-400">里程</div>
            <div id="miles" class="text-xl font-bold text-amber-200">0</div>
          </div>
        </div>
        <div class="rounded border border-sky-300/20 bg-sky-300/5 p-3 text-slate-300">
          <p>A/D 或方向键转向。</p>
          <p>W/S 或上下键加减速。</p>
          <p>R 重新开始。</p>
        </div>
        <div id="status" class="rounded border border-slate-700 p-3 text-slate-300">保持在反光路桩之间，速度越高分数越快。</div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const speedEl = document.getElementById("speed");
    const damageEl = document.getElementById("damage");
    const milesEl = document.getElementById("miles");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restartBtn");

    const input = new Set();
    let playerX = 0;
    let velocity = 0.44;
    let roadOffset = 0;
    let curve = 0;
    let curveTarget = 0;
    let damage = 0;
    let score = 0;
    let miles = 0;
    let frame = 0;
    let gameOver = false;
    let posts = [];
    let flashes = [];

    function reset() {
      playerX = 0;
      velocity = 0.44;
      roadOffset = 0;
      curve = 0;
      curveTarget = 0;
      damage = 0;
      score = 0;
      miles = 0;
      frame = 0;
      gameOver = false;
      posts = [];
      flashes = [];
      for (let i = 0; i < 26; i += 1) {
        posts.push(makePost(i * 0.065 + 0.08, i));
      }
      updateHud("保持在反光路桩之间，速度越高分数越快。");
    }

    function makePost(z, seed) {
      const side = seed % 2 === 0 ? -1 : 1;
      return {
        z,
        side,
        lean: Math.sin(seed * 1.7) * 0.1,
        hit: false
      };
    }

    function updateHud(message) {
      scoreEl.textContent = Math.floor(score);
      speedEl.textContent = Math.round(velocity * 140);
      damageEl.textContent = damage;
      milesEl.textContent = Math.floor(miles);
      if (message) statusEl.textContent = message;
    }

    function updateRoad() {
      if (frame % 130 === 0) curveTarget = -0.62 + Math.random() * 1.24;
      curve += (curveTarget - curve) * 0.012;
      roadOffset += curve * velocity * 0.018;

      if (input.has("ArrowLeft") || input.has("a")) playerX -= 0.035 + velocity * 0.01;
      if (input.has("ArrowRight") || input.has("d")) playerX += 0.035 + velocity * 0.01;
      if (input.has("ArrowUp") || input.has("w")) velocity += 0.006;
      if (input.has("ArrowDown") || input.has("s")) velocity -= 0.01;
      velocity = Math.max(0.25, Math.min(1.08, velocity));

      playerX += curve * velocity * 0.012;
      playerX *= 0.992;
      miles += velocity * 0.18;
      score += velocity * 1.4;

      for (const post of posts) {
        post.z -= velocity * 0.0048;
        if (post.z <= 0.02) {
          const sideX = post.side * (0.74 + post.z * 0.15) + roadOffset * (1 - post.z);
          if (!post.hit && Math.abs(playerX - sideX) < 0.12) {
            damage += 1;
            velocity *= 0.64;
            post.hit = true;
            flashes.push({ life: 18 });
            updateHud("擦到路桩，车速下降。");
            if (damage >= 5) {
              gameOver = true;
              updateHud("车辆损伤过高，按 R 重新开始。");
            }
          }
          Object.assign(post, makePost(1.02, frame + post.side + Math.random() * 20));
        }
      }

      if (Math.abs(playerX) > 0.92) {
        damage += frame % 18 === 0 ? 1 : 0;
        velocity *= 0.985;
        if (frame % 18 === 0) updateHud("偏离车道，尽快回正。");
        if (damage >= 5) {
          gameOver = true;
          updateHud("车辆冲出道路，按 R 重新开始。");
        }
      }

      flashes.forEach((flash) => flash.life -= 1);
      flashes = flashes.filter((flash) => flash.life > 0);
    }

    function projectX(x, z) {
      const perspective = 1 / Math.max(0.08, z);
      return canvas.width / 2 + x * 155 * perspective;
    }

    function projectY(z) {
      return 244 + (1 - z) * 230;
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#020617");
      gradient.addColorStop(0.5, "#000000");
      gradient.addColorStop(1, "#020617");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 244, canvas.width, canvas.height - 244);
      ctx.strokeStyle = "rgba(125, 211, 252, 0.28)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 244);
      ctx.lineTo(canvas.width, 244);
      ctx.stroke();
      ctx.fillStyle = "#e0f2fe";
      for (let i = 0; i < 42; i += 1) {
        const x = (i * 97 + frame * 0.15) % canvas.width;
        const y = 20 + ((i * 47) % 160);
        ctx.globalAlpha = 0.25 + (i % 4) * 0.14;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.globalAlpha = 1;
    }

    function drawRoad() {
      ctx.lineWidth = 2;
      for (let i = 0; i < 22; i += 1) {
        const z = i / 22;
        const y = projectY(z);
        const width = 65 + (1 - z) * 290;
        const center = projectX(roadOffset * (1 - z), z + 0.16);
        ctx.strokeStyle = i % 2 === 0 ? "rgba(56, 189, 248, 0.16)" : "rgba(148, 163, 184, 0.08)";
        ctx.beginPath();
        ctx.moveTo(center - width, y);
        ctx.lineTo(center + width, y);
        ctx.stroke();
      }

      ctx.strokeStyle = "#bae6fd";
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i <= 18; i += 1) {
        const z = i / 18;
        const y = projectY(z);
        const center = projectX(roadOffset * (1 - z), z + 0.16);
        const width = 58 + (1 - z) * 280;
        if (i === 0) ctx.moveTo(center - width, y); else ctx.lineTo(center - width, y);
      }
      ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 18; i += 1) {
        const z = i / 18;
        const y = projectY(z);
        const center = projectX(roadOffset * (1 - z), z + 0.16);
        const width = 58 + (1 - z) * 280;
        if (i === 0) ctx.moveTo(center + width, y); else ctx.lineTo(center + width, y);
      }
      ctx.stroke();
    }

    function drawPosts() {
      const sorted = [...posts].sort((a, b) => b.z - a.z);
      for (const post of sorted) {
        const sideX = post.side * (0.74 + post.z * 0.15) + roadOffset * (1 - post.z) + post.lean * (1 - post.z);
        const x = projectX(sideX, post.z);
        const y = projectY(post.z);
        const size = Math.max(4, 18 / Math.max(0.1, post.z));
        ctx.fillStyle = post.hit ? "#f87171" : "#f8fafc";
        ctx.fillRect(x - size * 0.18, y - size, size * 0.36, size);
        ctx.fillStyle = post.side < 0 ? "#facc15" : "#38bdf8";
        ctx.fillRect(x - size * 0.34, y - size * 0.72, size * 0.68, size * 0.18);
      }
    }

    function drawCar() {
      const carX = canvas.width / 2 + playerX * 190;
      const carY = 416;
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(carX - 42, carY - 12, 84, 34);
      ctx.strokeStyle = "#e0f2fe";
      ctx.lineWidth = 3;
      ctx.strokeRect(carX - 42, carY - 12, 84, 34);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(carX - 33, carY - 26, 18, 14);
      ctx.fillRect(carX + 15, carY - 26, 18, 14);
      ctx.fillStyle = "#facc15";
      ctx.fillRect(carX - 47, carY + 4, 12, 8);
      ctx.fillRect(carX + 35, carY + 4, 12, 8);
    }

    function drawOverlay() {
      for (const flash of flashes) {
        ctx.fillStyle = "rgba(248, 113, 113, " + flash.life / 36 + ")";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.78)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#fecaca";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("夜路终止", 360, 218);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "18px sans-serif";
        ctx.fillText("按 R 或点击重新开始", 360, 258);
      }
    }

    function loop() {
      frame += 1;
      if (!gameOver) {
        updateRoad();
        updateHud();
      }
      drawBackground();
      drawRoad();
      drawPosts();
      drawCar();
      drawOverlay();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "a", "d", "w", "s", "r"].includes(key)) {
        event.preventDefault();
      }
      if (key === "r") {
        reset();
        return;
      }
      input.add(key);
    });

    window.addEventListener("keyup", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      input.delete(key);
    });

    restartBtn.addEventListener("click", reset);

    reset();
    loop();
  </script>
</body>
</html>
