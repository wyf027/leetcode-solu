<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Tile Drop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-950 text-blue-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-blue-800 bg-blue-900 p-4 shadow-2xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Tile Drop</h1>
          <p class="mt-1 text-sm text-blue-200">Drop yellow tiles and connect four before the red side does.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-blue-700 px-3 py-2 text-sm">Turn: <strong id="turnLabel">You</strong></span>
          <button id="resetBtn" class="rounded bg-yellow-300 px-4 py-2 text-sm font-bold text-blue-950 hover:bg-yellow-200">Reset</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_220px]">
        <div id="board" class="mx-auto grid w-full max-w-[560px] grid-cols-7 gap-2 rounded-lg bg-blue-950 p-3"></div>
        <aside class="flex flex-col gap-3 rounded-lg border border-blue-700 bg-blue-950 p-3">
          <div class="rounded border border-blue-700 bg-blue-900 p-3">
            <div class="text-xs uppercase text-blue-200">Last column</div>
            <div id="lastColumn" class="mt-1 text-4xl font-black">-</div>
          </div>
          <p id="message" class="min-h-28 rounded border border-blue-700 bg-blue-900 p-3 text-sm text-blue-100">Click a column to drop your yellow tile.</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const rows = 6;
    const cols = 7;
    const boardEl = document.getElementById('board');
    const turnLabel = document.getElementById('turnLabel');
    const lastColumn = document.getElementById('lastColumn');
    const message = document.getElementById('message');
    const resetBtn = document.getElementById('resetBtn');
    let board = [];
    let turn = 'player';
    let finished = false;

    function resetGame() {
      board = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ''));
      turn = 'player';
      finished = false;
      lastColumn.textContent = '-';
      message.textContent = 'Click a column to drop your yellow tile.';
      render();
    }

    function firstOpenRow(col) {
      for (let row = rows - 1; row >= 0; row -= 1) {
        if (!board[row][col]) return row;
      }
      return -1;
    }

    function dropTile(col, owner = turn) {
      if (finished) return false;
      const row = firstOpenRow(col);
      if (row < 0) {
        message.textContent = 'That column is full.';
        return false;
      }
      board[row][col] = owner;
      lastColumn.textContent = col + 1;
      if (hasWinner(row, col, owner)) {
        finished = true;
        message.textContent = owner === 'player' ? 'You connected four.' : 'Red connected four.';
      } else if (board.every(line => line.every(Boolean))) {
        finished = true;
        message.textContent = 'Board full. Draw.';
      } else {
        turn = owner === 'player' ? 'cpu' : 'player';
        message.textContent = turn === 'player' ? 'Your turn.' : 'Red is thinking.';
      }
      render();
      if (!finished && turn === 'cpu') setTimeout(cpuMove, 350);
      return true;
    }

    function countDirection(row, col, owner, dr, dc) {
      let count = 0;
      let r = row + dr;
      let c = col + dc;
      while (r >= 0 && r < rows && c >= 0 && c < cols && board[r][c] === owner) {
        count += 1;
        r += dr;
        c += dc;
      }
      return count;
    }

    function hasWinner(row, col, owner) {
      return [[1, 0], [0, 1], [1, 1], [1, -1]].some(([dr, dc]) => {
        return 1 + countDirection(row, col, owner, dr, dc) + countDirection(row, col, owner, -dr, -dc) >= 4;
      });
    }

    function wouldWin(col, owner) {
      const row = firstOpenRow(col);
      if (row < 0) return false;
      board[row][col] = owner;
      const win = hasWinner(row, col, owner);
      board[row][col] = '';
      return win;
    }

    function cpuMove() {
      const options = Array.from({ length: cols }, (_, col) => col).filter(col => firstOpenRow(col) >= 0);
      const winning = options.find(col => wouldWin(col, 'cpu'));
      const blocking = options.find(col => wouldWin(col, 'player'));
      const pick = winning ?? blocking ?? options[Math.floor(Math.random() * options.length)];
      dropTile(pick, 'cpu');
    }

    function cellClass(value) {
      if (value === 'player') return 'bg-yellow-300';
      if (value === 'cpu') return 'bg-red-400';
      return 'bg-blue-800 hover:bg-blue-700';
    }

    function render() {
      boardEl.innerHTML = '';
      turnLabel.textContent = finished ? 'Done' : turn === 'player' ? 'You' : 'Red';
      for (let row = 0; row < rows; row += 1) {
        for (let col = 0; col < cols; col += 1) {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `aspect-square rounded-full border-4 border-blue-900 ${cellClass(board[row][col])}`;
          button.addEventListener('click', () => turn === 'player' && dropTile(col, 'player'));
          boardEl.appendChild(button);
        }
      }
    }

    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
