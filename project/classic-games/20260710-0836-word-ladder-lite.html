<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Word Ladder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-zinc-700 bg-zinc-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-emerald-300">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Word Ladder</h1>
        </div>
        <button id="newPuzzleBtn" class="rounded bg-emerald-400 px-4 py-2 font-semibold text-zinc-950 hover:bg-emerald-300">
          New Puzzle
        </button>
      </div>

      <div class="grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-zinc-700 bg-zinc-800 p-4">
          <p class="text-sm text-zinc-400">Start</p>
          <p id="startWord" class="text-3xl font-bold tracking-widest">COLD</p>
        </div>
        <div class="rounded border border-zinc-700 bg-zinc-800 p-4">
          <p class="text-sm text-zinc-400">Current</p>
          <p id="currentWord" class="text-3xl font-bold tracking-widest text-emerald-300">COLD</p>
        </div>
        <div class="rounded border border-zinc-700 bg-zinc-800 p-4">
          <p class="text-sm text-zinc-400">Target</p>
          <p id="targetWord" class="text-3xl font-bold tracking-widest">WARM</p>
        </div>
      </div>

      <form id="guessForm" class="mt-5 flex flex-col gap-3 sm:flex-row">
        <input
          id="guessInput"
          class="min-w-0 flex-1 rounded border border-zinc-700 bg-zinc-950 px-4 py-3 text-lg uppercase tracking-widest outline-none focus:border-emerald-300"
          maxlength="4"
          autocomplete="off"
          placeholder="Enter next word"
        />
        <button class="rounded bg-emerald-400 px-5 py-3 font-semibold text-zinc-950 hover:bg-emerald-300">
          Step
        </button>
      </form>

      <div class="mt-5 rounded border border-zinc-700 bg-zinc-950 p-4">
        <p id="statusText" class="min-h-6 font-semibold">Change one letter at a time to reach the target.</p>
        <p class="mt-2 text-sm text-zinc-400">Moves: <span id="moveCount">0</span></p>
      </div>

      <div class="mt-5">
        <p class="mb-2 text-sm text-zinc-400">Path</p>
        <div id="pathList" class="flex flex-wrap gap-2"></div>
      </div>
    </section>
  </main>

  <script>
    const puzzles = [
      { start: "COLD", target: "WARM", words: ["COLD", "CORD", "CARD", "WARD", "WARM", "WOLD", "WALD"] },
      { start: "HEAD", target: "TAIL", words: ["HEAD", "HEAL", "TEAL", "TELL", "TALL", "TAIL", "HEIL"] },
      { start: "FISH", target: "BIRD", words: ["FISH", "FIST", "FIRT", "BIRT", "BIRD", "BISH"] }
    ];

    const startWord = document.getElementById("startWord");
    const currentWord = document.getElementById("currentWord");
    const targetWord = document.getElementById("targetWord");
    const guessForm = document.getElementById("guessForm");
    const guessInput = document.getElementById("guessInput");
    const statusText = document.getElementById("statusText");
    const moveCount = document.getElementById("moveCount");
    const pathList = document.getElementById("pathList");
    const newPuzzleBtn = document.getElementById("newPuzzleBtn");

    const state = {
      puzzleIndex: 0,
      current: "",
      target: "",
      dictionary: new Set(),
      path: [],
      won: false
    };

    function oneLetterApart(a, b) {
      let changes = 0;
      for (let i = 0; i < a.length; i += 1) {
        if (a[i] !== b[i]) changes += 1;
      }
      return changes === 1;
    }

    function renderPath() {
      pathList.innerHTML = "";
      state.path.forEach((word) => {
        const chip = document.createElement("span");
        chip.className = "rounded bg-zinc-800 px-3 py-2 font-mono text-sm tracking-widest text-emerald-200";
        chip.textContent = word;
        pathList.appendChild(chip);
      });
    }

    function render() {
      currentWord.textContent = state.current;
      targetWord.textContent = state.target;
      moveCount.textContent = Math.max(0, state.path.length - 1);
      renderPath();
    }

    function loadPuzzle(index) {
      const puzzle = puzzles[index % puzzles.length];
      state.puzzleIndex = index % puzzles.length;
      state.current = puzzle.start;
      state.target = puzzle.target;
      state.dictionary = new Set(puzzle.words);
      state.path = [puzzle.start];
      state.won = false;
      startWord.textContent = puzzle.start;
      targetWord.textContent = puzzle.target;
      statusText.textContent = "Change one letter at a time to reach the target.";
      guessInput.value = "";
      render();
    }

    function submitGuess(rawWord) {
      if (state.won) return;

      const nextWord = rawWord.trim().toUpperCase();
      if (nextWord.length !== state.current.length) {
        statusText.textContent = "Use a four-letter word.";
        return;
      }
      if (!state.dictionary.has(nextWord)) {
        statusText.textContent = "That word is not in this tiny ladder dictionary.";
        return;
      }
      if (!oneLetterApart(state.current, nextWord)) {
        statusText.textContent = "Change exactly one letter from the current word.";
        return;
      }

      state.current = nextWord;
      state.path.push(nextWord);
      statusText.textContent = `Accepted: ${nextWord}`;

      if (nextWord === state.target) {
        state.won = true;
        statusText.textContent = `Solved in ${state.path.length - 1} moves.`;
      }

      guessInput.value = "";
      render();
    }

    guessForm.addEventListener("submit", (event) => {
      event.preventDefault();
      submitGuess(guessInput.value);
    });

    newPuzzleBtn.addEventListener("click", () => {
      loadPuzzle(state.puzzleIndex + 1);
      guessInput.focus();
    });

    loadPuzzle(0);
  </script>
</body>
</html>
