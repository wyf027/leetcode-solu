<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Murus Gallicus</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5 md:flex-row md:items-center">
    <section class="flex-1">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal">Mini Murus Gallicus</h1>
          <p id="status" class="mt-1 text-sm text-neutral-300">Gold moves first. Break through the opposite wall line.</p>
        </div>
        <button id="reset" class="rounded-md bg-yellow-300 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-yellow-200">Reset</button>
      </div>

      <div class="rounded-lg border border-neutral-700 bg-neutral-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-5 gap-1"></div>
      </div>
    </section>

    <aside class="w-full rounded-lg border border-neutral-700 bg-neutral-900 p-4 md:w-72">
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="rounded-md bg-neutral-800 p-3">
          <div class="text-neutral-400">Gold walls</div>
          <div id="goldCount" class="mt-1 text-2xl font-semibold">8</div>
        </div>
        <div class="rounded-md bg-neutral-800 p-3">
          <div class="text-neutral-400">Iron walls</div>
          <div id="ironCount" class="mt-1 text-2xl font-semibold">8</div>
        </div>
      </div>
      <div class="mt-4 space-y-2 text-sm text-neutral-300">
        <p>Select one of your wall pieces, then choose a legal target.</p>
        <p>Move one step forward or sideways into an empty square.</p>
        <p>Attack an adjacent enemy by moving onto its square.</p>
      </div>
    </aside>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const resetBtn = document.getElementById("reset");
    const goldCountEl = document.getElementById("goldCount");
    const ironCountEl = document.getElementById("ironCount");

    let board;
    let turn;
    let selected;
    let gameOver;

    function startGame() {
      board = Array.from({ length: 5 }, () => Array(5).fill(null));
      for (let col = 0; col < 5; col++) {
        board[0][col] = "iron";
        board[4][col] = "gold";
      }
      board[1][1] = "iron";
      board[1][3] = "iron";
      board[3][1] = "gold";
      board[3][3] = "gold";
      turn = "gold";
      selected = null;
      gameOver = false;
      setStatus("Gold turn: select a wall.");
      render();
    }

    function render() {
      boardEl.innerHTML = "";
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const tile = document.createElement("button");
          const isSelected = selected && selected.row === row && selected.col === col;
          tile.className = "relative rounded-md border border-neutral-700 bg-neutral-800 text-sm transition hover:bg-neutral-700";
          tile.style.aspectRatio = "1";
          if (row === 0) tile.classList.add("ring-1", "ring-sky-400");
          if (row === 4) tile.classList.add("ring-1", "ring-yellow-300");
          if (isSelected) tile.classList.add("outline", "outline-4", "outline-yellow-300");
          tile.addEventListener("click", () => handleCell(row, col));
          if (board[row][col]) tile.appendChild(pieceNode(board[row][col]));
          boardEl.appendChild(tile);
        }
      }
      goldCountEl.textContent = countPieces("gold");
      ironCountEl.textContent = countPieces("iron");
    }

    function pieceNode(side) {
      const piece = document.createElement("div");
      piece.className = `absolute inset-2 flex items-center justify-center rounded-md text-lg font-bold shadow ${side === "gold" ? "bg-yellow-300 text-neutral-950" : "bg-sky-300 text-neutral-950"}`;
      piece.textContent = side === "gold" ? "G" : "I";
      return piece;
    }

    function handleCell(row, col) {
      if (gameOver) return;
      if (!selected) {
        if (board[row][col] === turn) {
          selected = { row, col };
          setStatus(`${label(turn)}: choose an empty move or adjacent enemy.`);
          render();
        }
        return;
      }
      if (board[row][col] === turn) {
        selected = { row, col };
        render();
        return;
      }
      if (!isLegalTarget(selected, row, col)) return;
      board[row][col] = turn;
      board[selected.row][selected.col] = null;
      selected = null;
      if (checkWinner()) {
        render();
        return;
      }
      turn = turn === "gold" ? "iron" : "gold";
      setStatus(`${label(turn)} turn: select a wall.`);
      render();
    }

    function isLegalTarget(from, row, col) {
      const target = board[row][col];
      const rowDiff = row - from.row;
      const colDiff = Math.abs(col - from.col);
      const forward = turn === "gold" ? -1 : 1;
      const isForward = rowDiff === forward && colDiff === 0;
      const isSide = rowDiff === 0 && colDiff === 1;
      const isAttack = Math.abs(rowDiff) + colDiff === 1 && target && target !== turn;
      return (isForward || isSide || isAttack) && target !== turn;
    }

    function checkWinner() {
      if (board[0].includes("gold")) {
        gameOver = true;
        setStatus("Gold wins by reaching the iron wall line.");
        return true;
      }
      if (board[4].includes("iron")) {
        gameOver = true;
        setStatus("Iron wins by reaching the gold wall line.");
        return true;
      }
      if (countPieces("gold") === 0 || countPieces("iron") === 0) {
        gameOver = true;
        setStatus(`${countPieces("gold") ? "Gold" : "Iron"} wins by clearing the field.`);
        return true;
      }
      if (!hasMove(turn === "gold" ? "iron" : "gold")) {
        gameOver = true;
        setStatus(`${label(turn)} wins by blocking every enemy wall.`);
        return true;
      }
      return false;
    }

    function hasMove(side) {
      const oldTurn = turn;
      turn = side;
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          if (board[row][col] !== side) continue;
          for (let r = 0; r < 5; r++) {
            for (let c = 0; c < 5; c++) {
              if (isLegalTarget({ row, col }, r, c)) {
                turn = oldTurn;
                return true;
              }
            }
          }
        }
      }
      turn = oldTurn;
      return false;
    }

    function countPieces(side) {
      return board.flat().filter((piece) => piece === side).length;
    }

    function label(side) {
      return side === "gold" ? "Gold" : "Iron";
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
