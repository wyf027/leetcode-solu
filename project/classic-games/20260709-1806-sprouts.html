<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Sprouts</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-rose-950 text-rose-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Sprouts</h1><p class="text-sm text-rose-200">Connect two live dots. A new dot appears on the line; no dot may exceed three links.</p></div><button id="newGameBtn" class="rounded bg-lime-300 px-4 py-2 font-semibold text-rose-950 hover:bg-lime-200">New Game</button></header><section class="grid gap-3 rounded border border-rose-700 bg-rose-900 p-3 sm:grid-cols-3"><div>Turn: <b id="turnLabel">Blue</b></div><div>Moves: <b id="moveCount">0</b></div><div id="message">Pick a live dot.</div></section><section class="relative mx-auto aspect-square w-full max-w-xl rounded border border-rose-700 bg-rose-900" id="board"><svg id="lines" class="absolute inset-0 h-full w-full"></svg><div id="dots" class="absolute inset-0"></div></section></main><script>
let dots,edges,turn,selected,over,moves;const el=id=>document.getElementById(id),lines=el('lines'),dotsEl=el('dots'),turnLabel=el('turnLabel'),moveCount=el('moveCount'),message=el('message'),newGameBtn=el('newGameBtn');function name(p){return p==='B'?'Blue':'Gold'}function degree(i){return edges.reduce((n,e)=>n+(e.a===i||e.b===i?1:0),0)}function live(i){return degree(i)<3}function hasMove(){for(let i=0;i<dots.length;i++)for(let j=i;j<dots.length;j++)if(live(i)&&live(j)&&!(i===j&&degree(i)>1))return true;return false}function choose(i){if(over||!live(i))return;if(selected===null){selected=i;message.textContent='Pick a second live dot.';render();return}if(i===selected&&degree(i)>1){message.textContent='A loop needs two free lives.';return}const a=selected,b=i,da=dots[a],db=dots[b],mid={x:(da.x+db.x)/2+(Math.random()-.5)*7,y:(da.y+db.y)/2+(Math.random()-.5)*7};const m=dots.push(mid)-1;edges.push({a,b:m},{a:m,b});moves++;selected=null;if(!hasMove()){over=true;message.textContent=`${name(turn)} made the last move and wins.`}else{turn=turn==='B'?'G':'B';message.textContent='Pick a live dot.'}render()}function render(){turnLabel.textContent=over?'Game Over':name(turn);moveCount.textContent=moves;lines.innerHTML=edges.map(e=>`<line x1="${dots[e.a].x}%" y1="${dots[e.a].y}%" x2="${dots[e.b].x}%" y2="${dots[e.b].y}%" stroke="${e.a===e.b?'#fbbf24':'#fecdd3'}" stroke-width="2" />`).join('');dotsEl.innerHTML='';dots.forEach((d,i)=>{const btn=document.createElement('button');btn.className='absolute flex h-9 w-9 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-2 text-xs font-bold '+(selected===i?'border-lime-300 ':'border-rose-200 ')+(live(i)?'bg-white text-rose-950':'bg-rose-700 text-rose-200');btn.style.left=d.x+'%';btn.style.top=d.y+'%';btn.textContent=3-degree(i);btn.onclick=()=>choose(i);dotsEl.appendChild(btn)})}function newGame(){dots=[{x:28,y:35},{x:72,y:35},{x:50,y:70}];edges=[];turn='B';selected=null;over=false;moves=0;message.textContent='Pick a live dot.';render()}newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
