<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Tabula</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-6 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-stone-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-sky-300">Classic Games</p>
        <h1 class="mt-1 text-3xl font-bold text-white">Mini Tabula</h1>
      </div>
      <button id="resetBtn" class="rounded bg-sky-400 px-4 py-2 text-sm font-bold text-stone-950 hover:bg-sky-300 focus:outline-none focus:ring-2 focus:ring-sky-200">重新开始</button>
    </header>

    <section class="grid gap-6 lg:grid-cols-[1fr_280px]">
      <div class="rounded-lg border border-stone-800 bg-stone-900 p-4 shadow-xl">
        <div id="track" class="grid grid-cols-6 gap-2"></div>
        <div class="mt-4 grid grid-cols-2 gap-3">
          <div class="rounded border border-stone-700 bg-stone-950 p-3">
            <p class="text-sm font-semibold text-sky-200">蓝方出盘</p>
            <div id="blueHome" class="mt-2 flex min-h-10 flex-wrap gap-2"></div>
          </div>
          <div class="rounded border border-stone-700 bg-stone-950 p-3">
            <p class="text-sm font-semibold text-amber-200">金方出盘</p>
            <div id="goldHome" class="mt-2 flex min-h-10 flex-wrap gap-2"></div>
          </div>
        </div>
      </div>

      <aside class="rounded-lg border border-stone-800 bg-stone-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-stone-400">当前回合</p>
            <p id="turnLabel" class="mt-1 text-2xl font-bold text-sky-200">蓝方</p>
          </div>
          <button id="rollBtn" class="w-full rounded bg-stone-100 px-4 py-3 text-lg font-black text-stone-950 hover:bg-white focus:outline-none focus:ring-2 focus:ring-sky-200">掷骰</button>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded border border-stone-700 bg-stone-950 p-3">
              <p class="text-stone-400">骰子</p>
              <p id="dieLabel" class="mt-1 text-3xl font-black">-</p>
            </div>
            <div class="rounded border border-stone-700 bg-stone-950 p-3">
              <p class="text-stone-400">目标</p>
              <p class="mt-1 text-xl font-bold">3 枚出盘</p>
            </div>
          </div>
          <p id="message" class="rounded border border-stone-700 bg-stone-950 p-3 text-sm leading-6 text-stone-200">蓝方先掷骰。掷出点数后选择一枚可移动棋子。</p>
          <div class="space-y-2 text-sm leading-6 text-stone-300">
            <p>棋子从 0 出发，沿 1 到 12 的赛道前进。</p>
            <p>走到 13 代表精确出盘；超过 13 不可移动。</p>
            <p>如果当前骰子没有合法棋可走，回合自动交给对手。</p>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const trackEl = document.getElementById("track");
    const blueHome = document.getElementById("blueHome");
    const goldHome = document.getElementById("goldHome");
    const turnLabel = document.getElementById("turnLabel");
    const dieLabel = document.getElementById("dieLabel");
    const message = document.getElementById("message");
    const rollBtn = document.getElementById("rollBtn");
    const resetBtn = document.getElementById("resetBtn");

    let state;

    function resetGame() {
      state = {
        blue: [0, 0, 0],
        gold: [0, 0, 0],
        turn: "blue",
        die: null,
        winner: null
      };
      render();
    }

    function playerName(player) {
      return player === "blue" ? "蓝方" : "金方";
    }

    function opponent(player) {
      return player === "blue" ? "gold" : "blue";
    }

    function rollDie() {
      if (state.winner || state.die !== null) return;
      state.die = Math.floor(Math.random() * 6) + 1;
      const moves = legalPieces(state.turn);
      if (moves.length === 0) {
        message.textContent = `${playerName(state.turn)}掷出 ${state.die}，没有合法移动，轮到${playerName(opponent(state.turn))}。`;
        state.turn = opponent(state.turn);
        state.die = null;
      } else {
        message.textContent = `${playerName(state.turn)}掷出 ${state.die}，请选择一枚亮起的棋子。`;
      }
      render();
    }

    function legalPieces(player) {
      if (state.die === null) return [];
      return state[player]
        .map((position, index) => ({ position, index, target: position + state.die }))
        .filter((move) => move.position < 13 && move.target <= 13);
    }

    function movePiece(player, pieceIndex) {
      if (state.winner || player !== state.turn || state.die === null) return;
      const move = legalPieces(player).find((item) => item.index === pieceIndex);
      if (!move) return;
      state[player][pieceIndex] = move.target;
      if (state[player].every((position) => position === 13)) {
        state.winner = player;
        message.textContent = `${playerName(player)}三枚棋子全部出盘，获得胜利。`;
      } else {
        state.turn = opponent(state.turn);
        message.textContent = `${playerName(state.turn)}回合，请掷骰。`;
      }
      state.die = null;
      render();
    }

    function pieceButton(player, index, position) {
      const legal = legalPieces(player).some((move) => move.index === index) && player === state.turn;
      const color = player === "blue" ? "bg-sky-500 border-sky-100 text-white" : "bg-amber-400 border-amber-100 text-stone-950";
      const ring = legal ? "ring-4 ring-emerald-300" : "";
      return `<button type="button" class="inline-flex h-9 w-9 items-center justify-center rounded-full border text-sm font-black shadow ${color} ${ring}" data-player="${player}" data-index="${index}" aria-label="${player} piece ${index + 1}">${index + 1}</button>`;
    }

    function render() {
      turnLabel.textContent = state.winner ? `${playerName(state.winner)}获胜` : playerName(state.turn);
      dieLabel.textContent = state.die === null ? "-" : String(state.die);
      rollBtn.disabled = state.winner || state.die !== null;
      rollBtn.className = rollBtn.disabled
        ? "w-full rounded bg-stone-700 px-4 py-3 text-lg font-black text-stone-400"
        : "w-full rounded bg-stone-100 px-4 py-3 text-lg font-black text-stone-950 hover:bg-white focus:outline-none focus:ring-2 focus:ring-sky-200";

      trackEl.innerHTML = Array.from({ length: 12 }, (_, index) => {
        const cell = index + 1;
        const bluePieces = state.blue.map((position, pieceIndex) => position === cell ? pieceButton("blue", pieceIndex, position) : "").join("");
        const goldPieces = state.gold.map((position, pieceIndex) => position === cell ? pieceButton("gold", pieceIndex, position) : "").join("");
        return `<div class="min-h-24 rounded border border-stone-700 bg-stone-950 p-2">
          <div class="mb-2 text-xs font-bold text-stone-400">格 ${cell}</div>
          <div class="flex flex-wrap gap-2">${bluePieces}${goldPieces}</div>
        </div>`;
      }).join("");

      blueHome.innerHTML = state.blue.map((position, index) => position === 13 ? pieceButton("blue", index, position) : "").join("");
      goldHome.innerHTML = state.gold.map((position, index) => position === 13 ? pieceButton("gold", index, position) : "").join("");
      trackEl.querySelectorAll("button[data-player]").forEach((button) => {
        button.addEventListener("click", () => movePiece(button.dataset.player, Number(button.dataset.index)));
      });
    }

    rollBtn.addEventListener("click", rollDie);
    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
