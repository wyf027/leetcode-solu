<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini GIPF</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cyan-950 text-cyan-50">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-cyan-800 pb-4 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-orange-200">Mini GIPF</h1>
        <p class="mt-1 text-sm text-cyan-300">从边缘推入棋子，挤动整行；形成四连即可得分。</p>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded border border-cyan-700 bg-cyan-900 px-3 py-2">
          <div class="text-cyan-400">当前</div>
          <div id="turn" class="text-lg font-bold text-orange-200">White</div>
        </div>
        <div class="rounded border border-cyan-700 bg-cyan-900 px-3 py-2">
          <div class="text-cyan-400">White</div>
          <div id="whiteScore" class="text-lg font-bold">0</div>
        </div>
        <div class="rounded border border-cyan-700 bg-cyan-900 px-3 py-2">
          <div class="text-cyan-400">Black</div>
          <div id="blackScore" class="text-lg font-bold">0</div>
        </div>
      </div>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="flex justify-center">
        <div id="board" class="grid aspect-square w-full max-w-[640px] grid-cols-6 gap-2 rounded bg-cyan-900 p-3 shadow-2xl shadow-black/40"></div>
      </div>
      <aside class="flex flex-col gap-4">
        <div class="rounded border border-cyan-800 bg-cyan-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-cyan-300">推入方向</h2>
          <div id="moves" class="mt-3 grid grid-cols-2 gap-2"></div>
        </div>
        <div class="rounded border border-cyan-800 bg-cyan-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-cyan-300">状态</h2>
          <p id="message" class="mt-3 min-h-24 text-sm leading-6 text-cyan-100">选择一个边缘入口，再选择推入方向。</p>
          <button id="reset" class="mt-4 w-full rounded bg-orange-300 px-4 py-2 font-semibold text-cyan-950 hover:bg-orange-200">重新开局</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const turnEl = document.getElementById('turn');
    const whiteScoreEl = document.getElementById('whiteScore');
    const blackScoreEl = document.getElementById('blackScore');
    const msgEl = document.getElementById('message');
    const resetBtn = document.getElementById('reset');

    let board;
    let current;
    let selected;
    let score;
    let gameOver;

    const labels = { left: '从左推', right: '从右推', top: '从上推', bottom: '从下推' };

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(''));
      current = 'W';
      selected = null;
      score = { W: 0, B: 0 };
      gameOver = false;
      msgEl.textContent = '选择一个边缘入口，再选择推入方向。';
      render();
    }

    function playerName(mark) {
      return mark === 'W' ? 'White' : 'Black';
    }

    function isEdge(row, col) {
      return row === 0 || row === size - 1 || col === 0 || col === size - 1;
    }

    function legalMoves(row, col) {
      const moves = [];
      if (col === 0) moves.push('left');
      if (col === size - 1) moves.push('right');
      if (row === 0) moves.push('top');
      if (row === size - 1) moves.push('bottom');
      return moves;
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const cell = board[row][col];
          const active = selected && selected.row === row && selected.col === col;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = cell ? '●' : '';
          btn.className = [
            'aspect-square rounded-full border text-3xl font-black transition',
            (row + col) % 2 === 0 ? 'bg-cyan-800' : 'bg-cyan-700',
            cell === 'W' ? 'border-stone-100 text-stone-100' : '',
            cell === 'B' ? 'border-slate-950 text-slate-950' : '',
            !cell ? 'border-cyan-600 hover:border-orange-200' : '',
            isEdge(row, col) ? 'ring-1 ring-white/10' : '',
            active ? 'outline outline-4 outline-orange-200' : ''
          ].join(' ');
          btn.addEventListener('click', () => selectEntry(row, col));
          boardEl.appendChild(btn);
        }
      }
    }

    function renderMoves() {
      movesEl.innerHTML = '';
      ['left', 'right', 'top', 'bottom'].forEach((move) => {
        const enabled = selected && legalMoves(selected.row, selected.col).includes(move) && !gameOver;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = labels[move];
        btn.disabled = !enabled;
        btn.className = 'rounded border border-cyan-700 px-3 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-35 enabled:bg-cyan-800 enabled:hover:border-orange-200';
        btn.addEventListener('click', () => pushLine(move));
        movesEl.appendChild(btn);
      });
    }

    function render() {
      turnEl.textContent = playerName(current);
      whiteScoreEl.textContent = score.W;
      blackScoreEl.textContent = score.B;
      renderBoard();
      renderMoves();
    }

    function selectEntry(row, col) {
      if (gameOver) return;
      if (!isEdge(row, col)) {
        msgEl.textContent = '只能选择棋盘边缘作为入口。';
        return;
      }
      selected = { row, col };
      msgEl.textContent = `已选择第 ${row + 1} 行第 ${col + 1} 列入口。`;
      render();
    }

    function pushLine(move) {
      if (!selected || gameOver) return;
      const { row, col } = selected;
      if (!legalMoves(row, col).includes(move)) return;

      if (move === 'left') {
        for (let c = size - 1; c > 0; c -= 1) board[row][c] = board[row][c - 1];
        board[row][0] = current;
      }
      if (move === 'right') {
        for (let c = 0; c < size - 1; c += 1) board[row][c] = board[row][c + 1];
        board[row][size - 1] = current;
      }
      if (move === 'top') {
        for (let r = size - 1; r > 0; r -= 1) board[r][col] = board[r - 1][col];
        board[0][col] = current;
      }
      if (move === 'bottom') {
        for (let r = 0; r < size - 1; r += 1) board[r][col] = board[r + 1][col];
        board[size - 1][col] = current;
      }

      const cleared = clearFour(current);
      if (cleared) {
        score[current] += cleared;
        msgEl.textContent = `${playerName(current)} 清除 ${cleared} 组四连。`;
      } else {
        msgEl.textContent = `${playerName(current)} 推入一枚棋子。`;
      }
      selected = null;
      if (score[current] >= 3) {
        gameOver = true;
        msgEl.textContent = `${playerName(current)} 达到 3 分，赢得本局。`;
      } else {
        current = current === 'W' ? 'B' : 'W';
      }
      render();
    }

    function clearFour(mark) {
      const remove = new Set();
      const lines = [];
      for (let r = 0; r < size; r += 1) lines.push([...Array(size)].map((_, c) => [r, c]));
      for (let c = 0; c < size; c += 1) lines.push([...Array(size)].map((_, r) => [r, c]));
      for (let start = 0; start < size; start += 1) {
        lines.push(diagonal(start, 0, 1, 1));
        lines.push(diagonal(0, start, 1, 1));
        lines.push(diagonal(start, size - 1, 1, -1));
        lines.push(diagonal(0, start, 1, -1));
      }
      lines.forEach((line) => {
        for (let i = 0; i <= line.length - 4; i += 1) {
          const group = line.slice(i, i + 4);
          if (group.every(([r, c]) => board[r][c] === mark)) {
            group.forEach(([r, c]) => remove.add(`${r},${c}`));
          }
        }
      });
      remove.forEach((key) => {
        const [r, c] = key.split(',').map(Number);
        board[r][c] = '';
      });
      return Math.floor(remove.size / 4);
    }

    function diagonal(row, col, dr, dc) {
      const cells = [];
      while (row >= 0 && row < size && col >= 0 && col < size) {
        cells.push([row, col]);
        row += dr;
        col += dc;
      }
      return cells;
    }

    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
