<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Euclid's Game</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:py-8">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm font-semibold uppercase tracking-wide text-fuchsia-300">Classic Number Game</p>
        <h1 class="text-3xl font-bold text-white sm:text-4xl">Mini Euclid's Game</h1>
      </div>
      <button id="resetBtn" class="rounded-md bg-fuchsia-300 px-4 py-2 text-sm font-bold text-indigo-950 transition hover:bg-fuchsia-200">
        New Game
      </button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_18rem]">
      <div class="rounded-lg border border-indigo-800 bg-indigo-900 p-4 shadow-2xl shadow-indigo-950/40">
        <div class="grid gap-4 sm:grid-cols-2">
          <article class="rounded-lg border border-indigo-800 bg-indigo-950 p-5 text-center">
            <p class="text-sm uppercase tracking-wide text-indigo-300">Pile A</p>
            <p id="pileA" class="mt-3 text-6xl font-black text-fuchsia-300">21</p>
          </article>
          <article class="rounded-lg border border-indigo-800 bg-indigo-950 p-5 text-center">
            <p class="text-sm uppercase tracking-wide text-indigo-300">Pile B</p>
            <p id="pileB" class="mt-3 text-6xl font-black text-cyan-300">34</p>
          </article>
        </div>

        <div class="mt-4 rounded-lg border border-indigo-800 bg-indigo-950 p-4">
          <p id="choiceLabel" class="text-sm font-semibold text-indigo-200">Choose how many multiples to subtract.</p>
          <div id="choices" class="mt-3 grid gap-2 sm:grid-cols-4"></div>
        </div>
      </div>

      <aside class="flex flex-col gap-4">
        <div class="rounded-lg border border-indigo-800 bg-indigo-900 p-4">
          <h2 class="text-lg font-semibold text-white">Status</h2>
          <p id="message" class="mt-2 min-h-16 text-sm leading-6 text-indigo-100"></p>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center lg:grid-cols-1">
          <div class="rounded-lg border border-indigo-800 bg-indigo-900 p-3">
            <p class="text-xs uppercase tracking-wide text-indigo-300">You</p>
            <p id="humanMoves" class="mt-1 text-2xl font-bold text-fuchsia-300">0</p>
          </div>
          <div class="rounded-lg border border-indigo-800 bg-indigo-900 p-3">
            <p class="text-xs uppercase tracking-wide text-indigo-300">AI</p>
            <p id="aiMoves" class="mt-1 text-2xl font-bold text-cyan-300">0</p>
          </div>
          <div class="rounded-lg border border-indigo-800 bg-indigo-900 p-3">
            <p class="text-xs uppercase tracking-wide text-indigo-300">Turn</p>
            <p id="turnCount" class="mt-1 text-2xl font-bold text-amber-300">0</p>
          </div>
        </div>

        <div class="rounded-lg border border-indigo-800 bg-indigo-900 p-4 text-sm leading-6 text-indigo-100">
          <p>On each turn subtract a positive multiple of the smaller pile from the larger pile. If you reduce a pile exactly to zero, you win.</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const pileA = document.getElementById("pileA");
    const pileB = document.getElementById("pileB");
    const choices = document.getElementById("choices");
    const choiceLabel = document.getElementById("choiceLabel");
    const message = document.getElementById("message");
    const humanMoves = document.getElementById("humanMoves");
    const aiMoves = document.getElementById("aiMoves");
    const turnCount = document.getElementById("turnCount");
    const resetBtn = document.getElementById("resetBtn");

    let piles = [21, 34];
    let locked = false;
    let done = false;
    let moves = { H: 0, A: 0 };

    function startGame() {
      piles = [21, 34];
      locked = false;
      done = false;
      moves = { H: 0, A: 0 };
      setMessage("Your move. Subtract a multiple of the smaller number from the larger number.");
      render();
    }

    function legalMovesFor(values = piles) {
      const [a, b] = values;
      const highIndex = a >= b ? 0 : 1;
      const low = Math.min(a, b);
      const high = Math.max(a, b);
      const maxMultiple = Math.floor(high / low);
      return Array.from({ length: maxMultiple }, (_, index) => ({
        highIndex,
        multiple: index + 1,
        amount: (index + 1) * low,
      }));
    }

    function applyMove(move, player) {
      piles[move.highIndex] -= move.amount;
      moves[player] += 1;
    }

    function chooseMove(move) {
      if (locked || done) return;
      applyMove(move, "H");
      if (finishIfWon("You win. You reduced a pile to zero.")) return;
      locked = true;
      setMessage("AI is calculating a reply...");
      render();
      window.setTimeout(runAiTurn, 300);
    }

    function runAiTurn() {
      const move = chooseAiMove();
      if (move) applyMove(move, "A");
      locked = false;
      if (!finishIfWon("AI wins. It reduced a pile to zero.")) {
        setMessage("Your move. Watch for exact multiples.");
      }
      render();
    }

    function chooseAiMove() {
      const moves = legalMovesFor();
      const winning = moves.find((move) => {
        const copy = piles.slice();
        copy[move.highIndex] -= move.amount;
        return copy.includes(0);
      });
      if (winning) return winning;
      return moves
        .map((move) => ({ move, score: scoreMove(move) }))
        .sort((a, b) => b.score - a.score)[0]?.move;
    }

    function scoreMove(move) {
      const copy = piles.slice();
      copy[move.highIndex] -= move.amount;
      if (copy.includes(0)) return 100;
      const high = Math.max(...copy);
      const low = Math.min(...copy);
      const quotient = Math.floor(high / low);
      return quotient === 1 ? 8 - Math.abs(high - low) : 20 - quotient;
    }

    function finishIfWon(text) {
      if (!piles.includes(0)) {
        render();
        return false;
      }
      done = true;
      locked = true;
      setMessage(text);
      render();
      return true;
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function render() {
      pileA.textContent = piles[0];
      pileB.textContent = piles[1];
      humanMoves.textContent = moves.H;
      aiMoves.textContent = moves.A;
      turnCount.textContent = moves.H + moves.A;
      choices.innerHTML = "";

      const legalMoves = legalMovesFor();
      const smaller = Math.min(...piles);
      const larger = Math.max(...piles);
      choiceLabel.textContent = `Subtract from ${larger} using multiples of ${smaller}.`;

      legalMoves.forEach((move) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "rounded-md border border-indigo-700 bg-indigo-800 px-3 py-2 text-sm font-semibold text-indigo-50 transition hover:border-fuchsia-300 hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-40";
        button.textContent = `-${move.amount}`;
        button.disabled = locked || done;
        button.addEventListener("click", () => chooseMove(move));
        choices.appendChild(button);
      });
    }

    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
