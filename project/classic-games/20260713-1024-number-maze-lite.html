<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Number Maze</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
      <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-fuchsia-300">classic path puzzle</p>
          <h1 class="text-3xl font-bold">Mini Number Maze</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
            <div class="text-fuchsia-200">Target</div>
            <div id="targetEl" class="text-xl font-bold">0</div>
          </div>
          <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
            <div class="text-fuchsia-200">Sum</div>
            <div id="sumEl" class="text-xl font-bold">0</div>
          </div>
          <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
            <div class="text-fuchsia-200">Moves</div>
            <div id="moveEl" class="text-xl font-bold">0</div>
          </div>
        </div>
      </header>

      <section class="rounded border border-zinc-700 bg-zinc-900/80 p-4">
        <div id="gridEl" class="mx-auto grid max-w-md grid-cols-5 gap-2"></div>
        <p id="messageEl" class="mt-4 min-h-6 text-sm text-zinc-300"></p>
      </section>

      <section class="grid gap-3 sm:grid-cols-3">
        <button id="undoBtn" class="rounded border border-fuchsia-300 px-4 py-3 font-semibold text-fuchsia-100 hover:bg-zinc-800">
          Undo Step
        </button>
        <button id="resetBtn" class="rounded bg-zinc-100 px-4 py-3 font-semibold text-zinc-950 hover:bg-white">
          Reset Path
        </button>
        <button id="newBtn" class="rounded bg-fuchsia-300 px-4 py-3 font-semibold text-zinc-950 hover:bg-fuchsia-200">
          New Maze
        </button>
      </section>

      <section class="rounded border border-zinc-800 p-4 text-sm text-zinc-300">
        <h2 class="mb-2 font-semibold text-fuchsia-200">Goal</h2>
        <p>Start on any tile, then move one square at a time without revisiting tiles. Hit the target sum exactly.</p>
      </section>
    </main>

    <script>
      const size = 5;
      const gridEl = document.getElementById("gridEl");
      const targetEl = document.getElementById("targetEl");
      const sumEl = document.getElementById("sumEl");
      const moveEl = document.getElementById("moveEl");
      const messageEl = document.getElementById("messageEl");
      const undoBtn = document.getElementById("undoBtn");
      const resetBtn = document.getElementById("resetBtn");
      const newBtn = document.getElementById("newBtn");

      let grid = [];
      let target = 0;
      let path = [];
      let solved = false;

      function keyFor(row, col) {
        return `${row},${col}`;
      }

      function randomValue() {
        return Math.floor(Math.random() * 9) + 1;
      }

      function buildMaze() {
        grid = Array.from({ length: size }, () => Array.from({ length: size }, randomValue));
        const startRow = Math.floor(Math.random() * size);
        const startCol = Math.floor(Math.random() * size);
        let row = startRow;
        let col = startCol;
        let targetSum = grid[row][col];
        const visited = new Set([keyFor(row, col)]);
        const steps = 5 + Math.floor(Math.random() * 4);

        for (let step = 1; step < steps; step++) {
          const options = [
            [row - 1, col],
            [row + 1, col],
            [row, col - 1],
            [row, col + 1],
          ].filter(([nextRow, nextCol]) => {
            return nextRow >= 0 && nextRow < size && nextCol >= 0 && nextCol < size && !visited.has(keyFor(nextRow, nextCol));
          });
          if (options.length === 0) break;
          [row, col] = options[Math.floor(Math.random() * options.length)];
          visited.add(keyFor(row, col));
          targetSum += grid[row][col];
        }

        target = targetSum;
        path = [];
        solved = false;
        messageEl.textContent = "Choose a starting tile.";
        render();
      }

      function currentSum() {
        return path.reduce((sum, cell) => sum + grid[cell.row][cell.col], 0);
      }

      function isAdjacent(a, b) {
        return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
      }

      function hasVisited(row, col) {
        return path.some((cell) => cell.row === row && cell.col === col);
      }

      function renderGrid() {
        gridEl.innerHTML = "";
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const index = path.findIndex((cell) => cell.row === row && cell.col === col);
            const isLast = index === path.length - 1;
            const button = document.createElement("button");
            button.type = "button";
            button.className = [
              "aspect-square rounded border text-2xl font-bold transition",
              index >= 0
                ? isLast
                  ? "border-fuchsia-100 bg-fuchsia-300 text-zinc-950"
                  : "border-fuchsia-500 bg-fuchsia-900 text-fuchsia-100"
                : "border-zinc-700 bg-zinc-950 text-zinc-100 hover:bg-zinc-800",
            ].join(" ");
            button.textContent = grid[row][col];
            button.addEventListener("click", () => chooseCell(row, col));
            gridEl.appendChild(button);
          }
        }
      }

      function render() {
        const sum = currentSum();
        targetEl.textContent = target;
        sumEl.textContent = sum;
        moveEl.textContent = path.length;
        undoBtn.disabled = path.length === 0 || solved;
        resetBtn.disabled = path.length === 0;
        renderGrid();
      }

      function chooseCell(row, col) {
        if (solved || hasVisited(row, col)) return;
        const next = { row, col };
        if (path.length > 0 && !isAdjacent(path[path.length - 1], next)) {
          messageEl.textContent = "Move to an adjacent tile.";
          return;
        }
        path.push(next);
        const sum = currentSum();
        if (sum === target) {
          solved = true;
          messageEl.textContent = `Solved in ${path.length} moves.`;
        } else if (sum > target) {
          messageEl.textContent = `Too high by ${sum - target}. Undo or reset.`;
        } else {
          messageEl.textContent = `${target - sum} left to target.`;
        }
        render();
      }

      function undoStep() {
        if (path.length === 0 || solved) return;
        path.pop();
        messageEl.textContent = path.length ? "Step undone." : "Choose a starting tile.";
        render();
      }

      function resetPath() {
        path = [];
        solved = false;
        messageEl.textContent = "Choose a starting tile.";
        render();
      }

      undoBtn.addEventListener("click", undoStep);
      resetBtn.addEventListener("click", resetPath);
      newBtn.addEventListener("click", buildMaze);

      buildMaze();
    </script>
  </body>
</html>
