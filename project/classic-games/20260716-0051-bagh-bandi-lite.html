<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Bagh Bandi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.18em] text-amber-300">Classic Mini Game</p>
        <h1 class="text-3xl font-bold">Mini Bagh Bandi</h1>
      </div>
      <button id="resetBtn" class="rounded-md bg-amber-400 px-4 py-2 font-semibold text-stone-950 shadow-sm hover:bg-amber-300">重新开始</button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_300px]">
      <div class="rounded-lg border border-stone-700 bg-stone-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-5 gap-2"></div>
      </div>

      <aside class="rounded-lg border border-stone-700 bg-stone-900 p-4">
        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="rounded-md bg-stone-800 p-3">
            <p class="text-xs text-stone-400">山羊待放</p>
            <p id="goatsLeft" class="text-2xl font-bold text-sky-300">12</p>
          </div>
          <div class="rounded-md bg-stone-800 p-3">
            <p class="text-xs text-stone-400">已捕获</p>
            <p id="captured" class="text-2xl font-bold text-rose-300">0</p>
          </div>
        </div>
        <div class="mt-4 rounded-md bg-stone-800 p-3">
          <p class="text-xs text-stone-400">当前回合</p>
          <p id="turnText" class="mt-1 text-lg font-semibold">山羊落子</p>
        </div>
        <div class="mt-4 rounded-md bg-stone-800 p-3">
          <p id="statusText" class="text-sm leading-6 text-stone-200">山羊先放满 12 枚，老虎每回合可移动或跳吃。山羊围住老虎获胜，老虎捕获 5 枚获胜。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const goatsLeftEl = document.getElementById("goatsLeft");
    const capturedEl = document.getElementById("captured");
    const turnTextEl = document.getElementById("turnText");
    const statusTextEl = document.getElementById("statusText");
    const resetBtn = document.getElementById("resetBtn");
    const size = 5;
    const totalGoats = 12;
    const tigerWin = 5;
    let cells;
    let turn;
    let goatsLeft;
    let captured;
    let selected;
    let gameOver;

    function key(row, col) {
      return row + "," + col;
    }

    function inside(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function isDiagonalAllowed(row, col, nextRow, nextCol) {
      if (Math.abs(row - nextRow) !== Math.abs(col - nextCol)) return true;
      return (row + col) % 2 === 0 && (nextRow + nextCol) % 2 === 0;
    }

    function adjacentMoves(row, col) {
      const moves = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          const nr = row + dr;
          const nc = col + dc;
          if (inside(nr, nc) && isDiagonalAllowed(row, col, nr, nc)) moves.push([nr, nc]);
        }
      }
      return moves;
    }

    function tigerMoves() {
      const moves = [];
      const tiger = cells.findIndex((cell) => cell === "T");
      const row = Math.floor(tiger / size);
      const col = tiger % size;
      for (const [nr, nc] of adjacentMoves(row, col)) {
        const target = nr * size + nc;
        if (!cells[target]) moves.push({ to: target });
        if (cells[target] === "G") {
          const jumpRow = nr + (nr - row);
          const jumpCol = nc + (nc - col);
          if (inside(jumpRow, jumpCol) && isDiagonalAllowed(nr, nc, jumpRow, jumpCol)) {
            const landing = jumpRow * size + jumpCol;
            if (!cells[landing]) moves.push({ to: landing, capture: target });
          }
        }
      }
      return moves;
    }

    function goatMoves(index) {
      const row = Math.floor(index / size);
      const col = index % size;
      return adjacentMoves(row, col).map(([nr, nc]) => nr * size + nc).filter((target) => !cells[target]);
    }

    function resetGame() {
      cells = Array(size * size).fill("");
      cells[12] = "T";
      turn = "G";
      goatsLeft = totalGoats;
      captured = 0;
      selected = null;
      gameOver = false;
      render("山羊落子：点击空位放入山羊。");
    }

    function endGame(message) {
      gameOver = true;
      selected = null;
      render(message);
    }

    function checkWin() {
      if (captured >= tigerWin) {
        endGame("老虎捕获 5 枚山羊，老虎获胜。");
        return true;
      }
      if (goatsLeft === 0 && tigerMoves().length === 0) {
        endGame("老虎没有可走路线，山羊获胜。");
        return true;
      }
      return false;
    }

    function switchTurn() {
      turn = turn === "G" ? "T" : "G";
      selected = null;
      if (!checkWin()) render(turn === "G" ? "山羊行动：放置或移动山羊。" : "老虎行动：移动或跳过山羊完成捕获。");
    }

    function handleGoat(index) {
      if (goatsLeft > 0) {
        if (cells[index]) return render("请选择空位放置山羊。");
        cells[index] = "G";
        goatsLeft--;
        switchTurn();
        return;
      }
      if (selected === null) {
        if (cells[index] === "G") {
          selected = index;
          render("选择一个空邻点移动山羊。");
        }
        return;
      }
      if (selected === index) {
        selected = null;
        render("已取消选择。");
        return;
      }
      if (goatMoves(selected).includes(index)) {
        cells[index] = "G";
        cells[selected] = "";
        switchTurn();
      } else if (cells[index] === "G") {
        selected = index;
        render("已切换山羊。");
      } else {
        render("山羊只能移动到相邻空点。");
      }
    }

    function handleTiger(index) {
      const tiger = cells.findIndex((cell) => cell === "T");
      if (selected === null) {
        if (index === tiger) {
          selected = index;
          render("选择老虎的目标点。");
        }
        return;
      }
      if (index === tiger) {
        selected = null;
        render("已取消选择。");
        return;
      }
      const move = tigerMoves().find((item) => item.to === index);
      if (!move) return render("老虎只能走到空邻点，或跳过相邻山羊。");
      cells[tiger] = "";
      if (move.capture !== undefined) {
        cells[move.capture] = "";
        captured++;
      }
      cells[index] = "T";
      switchTurn();
    }

    function handleCell(index) {
      if (gameOver) return;
      if (turn === "G") handleGoat(index);
      else handleTiger(index);
    }

    function render(message) {
      goatsLeftEl.textContent = goatsLeft;
      capturedEl.textContent = captured;
      turnTextEl.textContent = gameOver ? "游戏结束" : turn === "G" ? "山羊回合" : "老虎回合";
      statusTextEl.textContent = message;
      boardEl.innerHTML = "";
      cells.forEach((piece, index) => {
        const row = Math.floor(index / size);
        const col = index % size;
        const button = document.createElement("button");
        const isSelected = selected === index;
        button.className = [
          "relative flex aspect-square items-center justify-center rounded-md border text-2xl font-black transition",
          isSelected ? "border-amber-300 bg-amber-500/25" : "border-stone-700 bg-stone-800 hover:bg-stone-700",
          piece === "T" ? "text-rose-300" : piece === "G" ? "text-sky-300" : "text-stone-600"
        ].join(" ");
        button.setAttribute("aria-label", "row " + (row + 1) + " column " + (col + 1));
        button.textContent = piece === "T" ? "虎" : piece === "G" ? "羊" : "·";
        button.addEventListener("click", () => handleCell(index));
        boardEl.appendChild(button);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
