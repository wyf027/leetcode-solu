<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Cowrie Shells</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-teal-950 text-teal-50">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.18em] text-yellow-200">Classic Mini Game</p>
        <h1 class="text-3xl font-bold">Mini Cowrie Shells</h1>
      </div>
      <button id="resetBtn" class="rounded-md bg-yellow-300 px-4 py-2 font-semibold text-teal-950 hover:bg-yellow-200">重新开始</button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_300px]">
      <div class="rounded-lg border border-teal-700 bg-teal-900 p-3">
        <div id="track" class="grid grid-cols-6 gap-2"></div>
      </div>

      <aside class="rounded-lg border border-teal-700 bg-teal-900 p-4">
        <div class="rounded-md bg-teal-800 p-3 text-center">
          <p class="text-xs text-teal-200">贝壳结果</p>
          <p id="shellText" class="mt-1 text-3xl font-black text-yellow-200">—</p>
        </div>
        <div class="mt-4 grid grid-cols-2 gap-3 text-center">
          <div class="rounded-md bg-teal-800 p-3">
            <p class="text-xs text-teal-200">南方位置</p>
            <p id="southPos" class="text-2xl font-bold text-sky-200">0</p>
          </div>
          <div class="rounded-md bg-teal-800 p-3">
            <p class="text-xs text-teal-200">北方位置</p>
            <p id="northPos" class="text-2xl font-bold text-rose-200">0</p>
          </div>
        </div>
        <button id="throwBtn" class="mt-4 w-full rounded-md bg-sky-300 px-4 py-3 font-semibold text-teal-950 hover:bg-sky-200">投掷贝壳</button>
        <div class="mt-4 rounded-md bg-teal-800 p-3">
          <p id="statusText" class="text-sm leading-6 text-teal-50">投 4 枚贝壳，开口数为步数；全反面走 8 步。精确到达第 18 格获胜，落到对手格会把对手送回起点。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const trackEl = document.getElementById("track");
    const resetBtn = document.getElementById("resetBtn");
    const throwBtn = document.getElementById("throwBtn");
    const shellTextEl = document.getElementById("shellText");
    const southPosEl = document.getElementById("southPos");
    const northPosEl = document.getElementById("northPos");
    const statusTextEl = document.getElementById("statusText");
    const finish = 18;
    let positions;
    let turn;
    let gameOver;
    let lastShells;

    function playerName(player) {
      return player === "south" ? "南方" : "北方";
    }

    function opponent(player) {
      return player === "south" ? "north" : "south";
    }

    function resetGame() {
      positions = { south: 0, north: 0 };
      turn = "south";
      gameOver = false;
      lastShells = [];
      render("南方先手：投掷贝壳决定步数。");
    }

    function throwShells() {
      if (gameOver) return;
      lastShells = Array.from({ length: 4 }, () => Math.random() < 0.5 ? 1 : 0);
      const open = lastShells.reduce((sum, value) => sum + value, 0);
      const steps = open === 0 ? 8 : open;
      movePiece(steps);
    }

    function movePiece(steps) {
      const start = positions[turn];
      const target = start + steps;
      if (target > finish) {
        const skipped = playerName(turn) + "需要精确到达终点，" + steps + " 步过头。";
        turn = opponent(turn);
        render(skipped);
        return;
      }
      positions[turn] = target;
      let message = playerName(turn) + "前进 " + steps + " 步。";
      const rival = opponent(turn);
      if (target > 0 && target < finish && target === positions[rival]) {
        positions[rival] = 0;
        message += " 踩到对手，对手回到起点。";
      }
      if (target === finish) {
        gameOver = true;
        render(playerName(turn) + "精确抵达终点，获胜。");
        return;
      }
      turn = rival;
      render(message);
    }

    function shellLabel() {
      if (!lastShells.length) return "—";
      return lastShells.map((value) => value ? "开" : "背").join(" ");
    }

    function render(message) {
      shellTextEl.textContent = shellLabel();
      southPosEl.textContent = positions.south;
      northPosEl.textContent = positions.north;
      statusTextEl.textContent = (gameOver ? "" : playerName(turn) + "回合。") + message;
      throwBtn.disabled = gameOver;
      throwBtn.classList.toggle("opacity-50", gameOver);
      trackEl.innerHTML = "";
      for (let i = 0; i <= finish; i++) {
        const cell = document.createElement("div");
        const pieces = [];
        if (positions.south === i) pieces.push("<span class=\"text-sky-200\">南</span>");
        if (positions.north === i) pieces.push("<span class=\"text-rose-200\">北</span>");
        cell.className = [
          "flex aspect-square flex-col items-center justify-center rounded-md border text-sm font-bold",
          i === 0 ? "border-yellow-200 bg-yellow-300/20" : i === finish ? "border-lime-200 bg-lime-300/20" : "border-teal-700 bg-teal-800"
        ].join(" ");
        cell.innerHTML = "<span class=\"text-xs text-teal-200\">" + (i === 0 ? "起点" : i === finish ? "终点" : i) + "</span><span class=\"mt-1 min-h-6 text-lg\">" + (pieces.join("") || "·") + "</span>";
        trackEl.appendChild(cell);
      }
    }

    throwBtn.addEventListener("click", throwShells);
    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
