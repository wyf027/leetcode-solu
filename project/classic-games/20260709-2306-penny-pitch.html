<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Penny Pitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Penny Pitch</h1>
        <p class="text-sm text-slate-300">Click the board to pitch ten pennies. Center hits score highest.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-slate-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-slate-700 bg-slate-900 p-3 sm:grid-cols-4">
      <div>Pennies: <b id="coinText">10</b></div>
      <div>Score: <b id="scoreText">0</b></div>
      <div>Last: <b id="lastText">-</b></div>
      <div id="message">Aim and click the board.</div>
    </section>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <div class="rounded border border-slate-700 bg-slate-900 p-3">
        <svg id="board" class="mx-auto block aspect-square w-full max-w-lg rounded bg-slate-800" viewBox="0 0 400 400" role="img" aria-label="Penny pitch target"></svg>
      </div>
      <aside class="rounded border border-slate-700 bg-slate-900 p-3 text-sm text-slate-200">
        <h2 class="mb-2 font-semibold text-slate-50">Scoring</h2>
        <p>Gold center: 10</p>
        <p>Blue ring: 6</p>
        <p>Green ring: 3</p>
        <p>Outer board: 1</p>
        <p class="mt-3">Click closer to center for better odds. Each pitch has a small random drift.</p>
      </aside>
    </section>
  </main>

  <script>
    const center = { x: 200, y: 200 };
    const totalCoins = 10;
    const el = (id) => document.getElementById(id);
    const board = el("board");
    const coinText = el("coinText");
    const scoreText = el("scoreText");
    const lastText = el("lastText");
    const message = el("message");
    const newGameBtn = el("newGameBtn");

    let coinsLeft;
    let score;
    let pennies;
    let finished;

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function ringScore(point) {
      const d = distance(point, center);
      if (d <= 35) return 10;
      if (d <= 75) return 6;
      if (d <= 125) return 3;
      if (d <= 180) return 1;
      return 0;
    }

    function svgPoint(event) {
      const rect = board.getBoundingClientRect();
      const scaleX = 400 / rect.width;
      const scaleY = 400 / rect.height;
      return {
        x: (event.clientX - rect.left) * scaleX,
        y: (event.clientY - rect.top) * scaleY
      };
    }

    function pitchPenny(event) {
      if (finished) return;
      const aim = svgPoint(event);
      const drift = {
        x: (Math.random() - 0.5) * 34,
        y: (Math.random() - 0.5) * 34
      };
      const landed = {
        x: Math.max(12, Math.min(388, aim.x + drift.x)),
        y: Math.max(12, Math.min(388, aim.y + drift.y))
      };
      const points = ringScore(landed);
      pennies.push({ ...landed, points });
      coinsLeft -= 1;
      score += points;
      lastText.textContent = points;
      if (coinsLeft === 0) {
        finished = true;
        message.textContent = `Game over. Final score: ${score}.`;
      } else {
        message.textContent = points >= 6 ? "Good pitch." : "Try closer to the center.";
      }
      render();
    }

    function renderRings() {
      return `
        <circle cx="200" cy="200" r="180" fill="#e2e8f0" />
        <circle cx="200" cy="200" r="125" fill="#86efac" />
        <circle cx="200" cy="200" r="75" fill="#93c5fd" />
        <circle cx="200" cy="200" r="35" fill="#facc15" />
        <circle cx="200" cy="200" r="182" fill="none" stroke="#020617" stroke-width="4" />
      `;
    }

    function renderPennies() {
      return pennies.map((coin) => `
        <circle cx="${coin.x}" cy="${coin.y}" r="9" fill="#b45309" stroke="#fef3c7" stroke-width="2" />
        <text x="${coin.x}" y="${coin.y + 4}" text-anchor="middle" font-size="10" fill="#fff7ed">${coin.points}</text>
      `).join("");
    }

    function render() {
      board.innerHTML = `${renderRings()}${renderPennies()}`;
      coinText.textContent = coinsLeft;
      scoreText.textContent = score;
    }

    function newGame() {
      coinsLeft = totalCoins;
      score = 0;
      pennies = [];
      finished = false;
      lastText.textContent = "-";
      message.textContent = "Aim and click the board.";
      render();
    }

    board.addEventListener("click", pitchPenny);
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
