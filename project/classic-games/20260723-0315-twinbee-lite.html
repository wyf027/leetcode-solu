<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini TwinBee 兵蜂</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-950 text-sky-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-yellow-300/40 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-widest text-yellow-200">Classic Games</p>
        <h1 class="text-3xl font-bold text-white">Mini TwinBee 兵蜂</h1>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        <div class="border border-yellow-300/40 bg-sky-900/70 px-3 py-2">
          <div class="text-yellow-100">分数</div>
          <div id="score" class="text-xl font-bold">0</div>
        </div>
        <div class="border border-yellow-300/40 bg-sky-900/70 px-3 py-2">
          <div class="text-yellow-100">护盾</div>
          <div id="shield" class="text-xl font-bold">3</div>
        </div>
        <div class="border border-yellow-300/40 bg-sky-900/70 px-3 py-2">
          <div class="text-yellow-100">铃铛</div>
          <div id="bells" class="text-xl font-bold">0</div>
        </div>
        <div class="border border-yellow-300/40 bg-sky-900/70 px-3 py-2">
          <div class="text-yellow-100">火力</div>
          <div id="power" class="text-xl font-bold">1</div>
        </div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <canvas id="game" width="640" height="560" class="mx-auto h-auto w-full max-w-[640px] border border-yellow-300/40 bg-sky-700"></canvas>
      <aside class="space-y-3 text-sm text-sky-100">
        <div class="border border-sky-500 bg-sky-900/80 p-3">
          <h2 class="mb-2 font-semibold text-yellow-100">操作</h2>
          <p>方向键 / WASD：移动</p>
          <p>空格：射击</p>
          <p>R：重新开始</p>
        </div>
        <div class="border border-sky-500 bg-sky-900/80 p-3">
          <h2 class="mb-2 font-semibold text-yellow-100">目标</h2>
          <p>击落飞行敌人，收集铃铛升级火力，击破 18 架敌机后挑战 Boss。</p>
        </div>
        <button id="restart" class="w-full border border-yellow-200 bg-yellow-300 px-4 py-2 font-bold text-sky-950 hover:bg-yellow-100">
          重新开始
        </button>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const shieldEl = document.getElementById("shield");
    const bellsEl = document.getElementById("bells");
    const powerEl = document.getElementById("power");
    const restartBtn = document.getElementById("restart");

    const keys = new Set();
    const player = { x: 300, y: 470, w: 34, h: 34, shield: 3, power: 1, bells: 0, fire: 0, invuln: 0 };
    let bullets = [];
    let enemies = [];
    let enemyShots = [];
    let bells = [];
    let clouds = [];
    let boss = null;
    let score = 0;
    let kills = 0;
    let spawnTimer = 0;
    let frame = 0;
    let state = "playing";
    let lastTime = 0;

    function resetGame() {
      player.x = 300;
      player.y = 470;
      player.shield = 3;
      player.power = 1;
      player.bells = 0;
      player.fire = 0;
      player.invuln = 0;
      bullets = [];
      enemies = [];
      enemyShots = [];
      bells = [];
      boss = null;
      score = 0;
      kills = 0;
      spawnTimer = 25;
      frame = 0;
      state = "playing";
      clouds = Array.from({ length: 10 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        w: 46 + Math.random() * 36,
        h: 20 + Math.random() * 18,
        s: 0.8 + Math.random() * 1.5,
      }));
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      shieldEl.textContent = player.shield;
      bellsEl.textContent = player.bells;
      powerEl.textContent = player.power;
    }

    function rectsHit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function shoot() {
      if (player.fire > 0) return;
      const lanes = player.power >= 3 ? [-12, 0, 12] : player.power >= 2 ? [-8, 8] : [0];
      lanes.forEach((offset) => bullets.push({ x: player.x + player.w / 2 - 3 + offset, y: player.y - 12, w: 6, h: 16, vy: -8.5 }));
      player.fire = Math.max(5, 13 - player.power * 2);
    }

    function spawnEnemy() {
      enemies.push({
        x: 42 + Math.random() * (canvas.width - 84),
        y: -40,
        w: 30,
        h: 26,
        hp: kills > 9 ? 2 : 1,
        vy: 1.8 + Math.random() * 1.4,
        phase: Math.random() * Math.PI * 2,
        fire: 45 + Math.random() * 75,
      });
    }

    function spawnBoss() {
      boss = { x: 240, y: -90, w: 150, h: 74, hp: 26, phase: 0, fire: 36 };
    }

    function hurtPlayer() {
      if (player.invuln > 0 || state !== "playing") return;
      player.shield -= 1;
      player.power = Math.max(1, player.power - 1);
      player.invuln = 80;
      if (player.shield <= 0) state = "lost";
      updateHud();
    }

    function update() {
      if (state !== "playing") return;
      frame += 1;
      const speed = 4.2;
      if (keys.has("ArrowUp") || keys.has("w")) player.y -= speed;
      if (keys.has("ArrowDown") || keys.has("s")) player.y += speed;
      if (keys.has("ArrowLeft") || keys.has("a")) player.x -= speed;
      if (keys.has("ArrowRight") || keys.has("d")) player.x += speed;
      if (keys.has(" ")) shoot();
      player.x = Math.max(12, Math.min(canvas.width - player.w - 12, player.x));
      player.y = Math.max(38, Math.min(canvas.height - player.h - 14, player.y));
      player.fire = Math.max(0, player.fire - 1);
      player.invuln = Math.max(0, player.invuln - 1);

      clouds.forEach((cloud) => {
        cloud.y += cloud.s;
        if (cloud.y > canvas.height + 40) {
          cloud.y = -40;
          cloud.x = Math.random() * canvas.width;
        }
      });

      if (!boss) {
        spawnTimer -= 1;
        if (spawnTimer <= 0 && kills < 18) {
          spawnEnemy();
          spawnTimer = Math.max(24, 62 - kills);
        }
        if (kills >= 18) spawnBoss();
      }

      bullets.forEach((bullet) => (bullet.y += bullet.vy));
      bullets = bullets.filter((bullet) => bullet.y > -40);
      enemies.forEach((enemy) => {
        enemy.y += enemy.vy;
        enemy.phase += 0.06;
        enemy.x += Math.sin(enemy.phase) * 2.1;
        enemy.fire -= 1;
        if (enemy.fire <= 0) {
          enemyShots.push({ x: enemy.x + 12, y: enemy.y + enemy.h, w: 7, h: 12, vx: Math.sin(enemy.phase) * 1.3, vy: 4.2 });
          enemy.fire = 65 + Math.random() * 60;
        }
      });
      enemies = enemies.filter((enemy) => enemy.y < canvas.height + 60 && enemy.hp > 0);
      enemyShots.forEach((shot) => {
        shot.x += shot.vx;
        shot.y += shot.vy;
      });
      enemyShots = enemyShots.filter((shot) => shot.y < canvas.height + 30 && shot.x > -30 && shot.x < canvas.width + 30);
      bells.forEach((bell) => {
        bell.y += 2.1;
        bell.x += Math.sin((frame + bell.phase) / 12) * 1.3;
      });
      bells = bells.filter((bell) => bell.y < canvas.height + 30);

      if (boss) {
        boss.y = Math.min(46, boss.y + 1.1);
        boss.phase += 0.045;
        boss.x = 245 + Math.sin(boss.phase) * 105;
        boss.fire -= 1;
        if (boss.fire <= 0) {
          enemyShots.push({ x: boss.x + 32, y: boss.y + 64, w: 8, h: 13, vx: -1.6, vy: 4.8 });
          enemyShots.push({ x: boss.x + 74, y: boss.y + 70, w: 8, h: 13, vx: 0, vy: 5.1 });
          enemyShots.push({ x: boss.x + 116, y: boss.y + 64, w: 8, h: 13, vx: 1.6, vy: 4.8 });
          boss.fire = 42;
        }
      }

      bullets.forEach((bullet) => {
        enemies.forEach((enemy) => {
          if (rectsHit(bullet, enemy)) {
            bullet.y = -100;
            enemy.hp -= 1;
            if (enemy.hp <= 0) {
              score += 100;
              kills += 1;
              if (Math.random() < 0.55) bells.push({ x: enemy.x + 8, y: enemy.y + 10, w: 18, h: 18, phase: Math.random() * 30 });
            }
          }
        });
        if (boss && rectsHit(bullet, { x: boss.x + 14, y: boss.y + 12, w: boss.w - 28, h: boss.h - 18 })) {
          bullet.y = -100;
          boss.hp -= 1;
          score += 30;
          if (boss.hp <= 0) {
            score += 1400;
            state = "won";
          }
        }
      });

      const ship = { x: player.x + 5, y: player.y + 4, w: player.w - 10, h: player.h - 8 };
      enemies.forEach((enemy) => rectsHit(ship, enemy) && hurtPlayer());
      if (boss && rectsHit(ship, { x: boss.x + 14, y: boss.y + 12, w: boss.w - 28, h: boss.h - 18 })) hurtPlayer();
      enemyShots.forEach((shot) => {
        if (rectsHit(ship, shot)) {
          shot.y = canvas.height + 100;
          hurtPlayer();
        }
      });
      bells.forEach((bell) => {
        if (rectsHit(ship, bell)) {
          bell.y = canvas.height + 100;
          player.bells += 1;
          score += 80;
          if (player.bells % 3 === 0) player.power = Math.min(3, player.power + 1);
        }
      });
      updateHud();
    }

    function drawCloud(cloud) {
      ctx.fillStyle = "rgba(255,255,255,0.72)";
      ctx.beginPath();
      ctx.ellipse(cloud.x, cloud.y, cloud.w / 2, cloud.h / 2, 0, 0, Math.PI * 2);
      ctx.ellipse(cloud.x + cloud.w * 0.25, cloud.y + 2, cloud.w / 3, cloud.h / 2.3, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPlayer() {
      ctx.save();
      ctx.globalAlpha = player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0 ? 0.35 : 1;
      ctx.fillStyle = "#facc15";
      ctx.beginPath();
      ctx.ellipse(player.x + 17, player.y + 17, 17, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(player.x + 7, player.y + 5, 20, 10);
      ctx.fillStyle = "#f97316";
      ctx.fillRect(player.x - 5, player.y + 15, 10, 8);
      ctx.fillRect(player.x + 29, player.y + 15, 10, 8);
      ctx.restore();
    }

    function drawEnemy(enemy) {
      ctx.fillStyle = enemy.hp > 1 ? "#ef4444" : "#22c55e";
      ctx.beginPath();
      ctx.ellipse(enemy.x + 15, enemy.y + 13, 15, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fef3c7";
      ctx.fillRect(enemy.x + 9, enemy.y + 6, 12, 5);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(enemy.x + 6, enemy.y + 14, 5, 4);
      ctx.fillRect(enemy.x + 19, enemy.y + 14, 5, 4);
    }

    function drawBoss() {
      if (!boss) return;
      ctx.fillStyle = "#a855f7";
      ctx.beginPath();
      ctx.ellipse(boss.x + 75, boss.y + 37, 72, 34, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f0abfc";
      ctx.beginPath();
      ctx.arc(boss.x + 48, boss.y + 28, 10, 0, Math.PI * 2);
      ctx.arc(boss.x + 102, boss.y + 28, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#581c87";
      ctx.fillRect(boss.x + 18, boss.y + 56, 114, 10);
      ctx.fillStyle = "#fde047";
      ctx.fillRect(boss.x + 18, boss.y - 10, Math.max(0, boss.hp) * 4, 6);
    }

    function drawOverlay() {
      if (state === "playing") return;
      ctx.fillStyle = "rgba(8, 47, 73, 0.82)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.fillStyle = state === "won" ? "#fde047" : "#fecaca";
      ctx.font = "bold 34px sans-serif";
      ctx.fillText(state === "won" ? "Boss 击破" : "护盾耗尽", canvas.width / 2, 250);
      ctx.fillStyle = "#e0f2fe";
      ctx.font = "18px sans-serif";
      ctx.fillText("按 R 或点击重新开始", canvas.width / 2, 286);
      ctx.textAlign = "left";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#38bdf8");
      sky.addColorStop(0.62, "#0ea5e9");
      sky.addColorStop(1, "#0369a1");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      clouds.forEach(drawCloud);
      bullets.forEach((bullet) => {
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(bullet.x, bullet.y, bullet.w, bullet.h);
      });
      enemies.forEach(drawEnemy);
      drawBoss();
      bells.forEach((bell) => {
        ctx.fillStyle = "#fde047";
        ctx.beginPath();
        ctx.arc(bell.x + 9, bell.y + 9, 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#92400e";
        ctx.fillRect(bell.x + 5, bell.y + 10, 8, 3);
      });
      enemyShots.forEach((shot) => {
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(shot.x, shot.y, shot.w, shot.h);
      });
      drawPlayer();
      ctx.fillStyle = "#fef9c3";
      ctx.font = "14px sans-serif";
      ctx.fillText(boss ? `Boss HP ${Math.max(0, boss.hp)}` : `敌机 ${kills}/18`, 16, 24);
      drawOverlay();
    }

    function loop(time) {
      if (time - lastTime > 16) {
        update();
        draw();
        lastTime = time;
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "w", "a", "s", "d"].includes(event.key) || ["w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
      }
      keys.add(event.key);
      keys.add(key);
      if (key === "r") resetGame();
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
      keys.delete(event.key.toLowerCase());
    });

    restartBtn.addEventListener("click", resetGame);
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
