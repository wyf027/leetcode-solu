<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Futoshiki</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-zinc-700 bg-zinc-900 p-5 shadow-2xl">
      <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Futoshiki</h1>
          <p class="mt-1 text-sm text-zinc-300">在 4x4 棋盘填入 1-4，每行每列不重复，并满足不等式。</p>
        </div>
        <button id="resetBtn" class="rounded-md bg-violet-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-violet-300">重开</button>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_14rem]">
        <div class="rounded-lg border border-zinc-700 bg-zinc-950 p-3">
          <div id="board" class="mx-auto grid aspect-square w-full max-w-[520px] grid-cols-[repeat(7,minmax(0,1fr))] grid-rows-[repeat(7,minmax(0,1fr))] gap-1"></div>
        </div>
        <aside class="rounded-lg border border-zinc-700 bg-zinc-800 p-4">
          <div class="text-sm font-semibold text-zinc-200">状态</div>
          <div id="status" class="mt-3 rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-300">点击空格循环 1-4。</div>
          <div class="mt-4 text-sm font-semibold text-zinc-200">规则</div>
          <ul class="mt-2 space-y-2 text-sm text-zinc-300">
            <li>每行必须包含 1、2、3、4。</li>
            <li>每列也必须包含 1、2、3、4。</li>
            <li>相邻格之间的不等号必须成立。</li>
          </ul>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const size = 4;
    const solution = [
      [1, 3, 4, 2],
      [4, 2, 1, 3],
      [3, 4, 2, 1],
      [2, 1, 3, 4]
    ];
    const givens = [
      [1, 0, 0, 2],
      [0, 2, 0, 0],
      [0, 4, 0, 0],
      [2, 0, 0, 4]
    ];
    const grid = givens.map((row) => row.slice());
    const inequalities = [
      { a: [0, 1], b: [0, 2], sign: "<" },
      { a: [1, 0], b: [1, 1], sign: ">" },
      { a: [2, 1], b: [2, 2], sign: ">" },
      { a: [3, 2], b: [3, 3], sign: "<" },
      { a: [0, 2], b: [1, 2], sign: ">" },
      { a: [1, 3], b: [2, 3], sign: ">" },
      { a: [2, 0], b: [3, 0], sign: ">" }
    ];
    const board = document.getElementById("board");
    const status = document.getElementById("status");
    const resetBtn = document.getElementById("resetBtn");

    function relationAt(r, c, horizontal) {
      const a = horizontal ? [r, c] : [r, c];
      const b = horizontal ? [r, c + 1] : [r + 1, c];
      return inequalities.find((item) =>
        item.a[0] === a[0] && item.a[1] === a[1] && item.b[0] === b[0] && item.b[1] === b[1]
      );
    }

    function duplicateCount() {
      let count = 0;
      for (let i = 0; i < size; i++) {
        const row = grid[i].filter(Boolean);
        const col = grid.map((r) => r[i]).filter(Boolean);
        count += row.length - new Set(row).size;
        count += col.length - new Set(col).size;
      }
      return count;
    }

    function inequalityErrors() {
      let count = 0;
      for (const item of inequalities) {
        const left = grid[item.a[0]][item.a[1]];
        const right = grid[item.b[0]][item.b[1]];
        if (!left || !right) continue;
        if (item.sign === "<" && !(left < right)) count++;
        if (item.sign === ">" && !(left > right)) count++;
      }
      return count;
    }

    function allFilled() {
      return grid.every((row) => row.every(Boolean));
    }

    function solved() {
      return allFilled() && duplicateCount() === 0 && inequalityErrors() === 0;
    }

    function valueHasDuplicate(r, c) {
      const value = grid[r][c];
      if (!value) return false;
      return grid[r].filter((n) => n === value).length > 1 || grid.map((row) => row[c]).filter((n) => n === value).length > 1;
    }

    function makeInequality(text) {
      const node = document.createElement("div");
      node.className = "flex items-center justify-center text-xl font-bold text-violet-200";
      node.textContent = text || "";
      return node;
    }

    function render() {
      board.innerHTML = "";
      for (let r = 0; r < 7; r++) {
        for (let c = 0; c < 7; c++) {
          if (r % 2 === 0 && c % 2 === 0) {
            const rr = r / 2;
            const cc = c / 2;
            const fixed = givens[rr][cc] !== 0;
            const button = document.createElement("button");
            button.type = "button";
            button.disabled = fixed;
            button.textContent = grid[rr][cc] || "";
            button.className = [
              "flex items-center justify-center rounded-md border text-2xl font-bold transition",
              fixed ? "border-violet-300 bg-violet-300 text-zinc-950" : "border-zinc-700 bg-zinc-900 hover:bg-zinc-800",
              valueHasDuplicate(rr, cc) ? "ring-2 ring-rose-500" : "",
              grid[rr][cc] && !fixed ? "text-violet-100" : "text-zinc-100"
            ].join(" ");
            button.addEventListener("click", () => {
              grid[rr][cc] = (grid[rr][cc] % 4) + 1;
              render();
            });
            board.appendChild(button);
          } else if (r % 2 === 0 && c % 2 === 1) {
            const relation = relationAt(r / 2, (c - 1) / 2, true);
            board.appendChild(makeInequality(relation ? relation.sign : ""));
          } else if (r % 2 === 1 && c % 2 === 0) {
            const relation = relationAt((r - 1) / 2, c / 2, false);
            board.appendChild(makeInequality(relation ? (relation.sign === ">" ? "∨" : "∧") : ""));
          } else {
            board.appendChild(makeInequality(""));
          }
        }
      }

      const dupes = duplicateCount();
      const badSigns = inequalityErrors();
      if (solved()) {
        status.textContent = "完成！行列唯一且所有不等式都成立。";
        status.className = "mt-3 rounded-md border border-emerald-500 bg-emerald-950 px-3 py-2 text-sm text-emerald-200";
      } else if (dupes) {
        status.textContent = `还有 ${dupes} 处行列重复。`;
        status.className = "mt-3 rounded-md border border-rose-500 bg-rose-950 px-3 py-2 text-sm text-rose-200";
      } else if (badSigns) {
        status.textContent = `还有 ${badSigns} 条不等式不成立。`;
        status.className = "mt-3 rounded-md border border-amber-500 bg-amber-950 px-3 py-2 text-sm text-amber-200";
      } else {
        status.textContent = allFilled() ? "数字已填满，检查全部约束。" : "继续填入缺失数字。";
        status.className = "mt-3 rounded-md border border-zinc-700 bg-zinc-950 px-3 py-2 text-sm text-zinc-300";
      }
    }

    resetBtn.addEventListener("click", () => {
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) grid[r][c] = givens[r][c];
      }
      render();
    });

    render();
  </script>
</body>
</html>
