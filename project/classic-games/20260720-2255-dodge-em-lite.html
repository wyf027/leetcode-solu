<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Dodge Em</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-zinc-800 pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-rose-300">Classic Game</p>
          <h1 class="mt-1 text-3xl font-bold sm:text-4xl">Mini Dodge Em</h1>
        </div>
        <button
          id="reset"
          class="rounded-md bg-rose-400 px-4 py-2 text-sm font-bold text-zinc-950 transition hover:bg-rose-300"
          type="button"
        >
          重新开始
        </button>
      </header>

      <section class="grid gap-3 sm:grid-cols-4">
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">得分</p>
          <p id="score" class="mt-2 text-2xl font-bold text-rose-200">0</p>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">剩余路点</p>
          <p id="dots" class="mt-2 text-2xl font-bold">96</p>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">当前车道</p>
          <p id="lane" class="mt-2 text-2xl font-bold">1</p>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">状态</p>
          <p id="status" class="mt-2 text-lg font-semibold text-emerald-200">行驶中</p>
        </div>
      </section>

      <section class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <div
            id="track"
            class="relative mx-auto aspect-square max-h-[72vh] w-full max-w-[42rem] overflow-hidden rounded-md bg-zinc-950"
          >
            <div class="absolute inset-[7%] rounded-full border-[18px] border-zinc-800"></div>
            <div class="absolute inset-[20%] rounded-full border-[16px] border-zinc-800"></div>
            <div class="absolute inset-[33%] rounded-full border-[14px] border-zinc-800"></div>
            <div class="absolute inset-[46%] rounded-full border-[12px] border-zinc-800"></div>
          </div>
        </div>

        <aside class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <h2 class="text-xl font-bold">驾驶</h2>
          <p id="message" class="mt-3 min-h-24 text-sm leading-6 text-zinc-300">
            用方向键上下换车道，收集路点并避开蓝色追车。
          </p>
          <div class="mt-4 grid grid-cols-3 gap-2">
            <span></span>
            <button id="laneUp" class="rounded-md bg-zinc-800 px-3 py-2 font-bold hover:bg-zinc-700" type="button">↑</button>
            <span></span>
            <button id="pause" class="col-span-3 rounded-md bg-zinc-800 px-3 py-2 text-sm font-bold hover:bg-zinc-700" type="button">
              暂停 / 继续
            </button>
            <span></span>
            <button id="laneDown" class="rounded-md bg-zinc-800 px-3 py-2 font-bold hover:bg-zinc-700" type="button">↓</button>
            <span></span>
          </div>
          <div class="mt-4 border-t border-zinc-800 pt-4 text-sm leading-6 text-zinc-400">
            <p>规则：红车顺时针自动行驶，蓝车逆时针追逐。红车经过路点得分；与蓝车同车道同位置时失败。吃完全部路点获胜。</p>
          </div>
        </aside>
      </section>
    </main>

    <script>
      const lanes = 4;
      const steps = 24;
      const totalDots = lanes * steps;
      const radii = [43, 31, 19, 8];
      let player;
      let chaser;
      let dots;
      let score;
      let tick;
      let timer;
      let paused;
      let ended;

      const elements = {
        track: document.getElementById("track"),
        score: document.getElementById("score"),
        dots: document.getElementById("dots"),
        lane: document.getElementById("lane"),
        status: document.getElementById("status"),
        message: document.getElementById("message"),
        reset: document.getElementById("reset"),
        laneUp: document.getElementById("laneUp"),
        laneDown: document.getElementById("laneDown"),
        pause: document.getElementById("pause"),
      };

      function dotKey(lane, step) {
        return `${lane}:${step}`;
      }

      function point(lane, step) {
        const angle = (step / steps) * Math.PI * 2 - Math.PI / 2;
        const radius = radii[lane];
        return {
          left: 50 + Math.cos(angle) * radius,
          top: 50 + Math.sin(angle) * radius,
        };
      }

      function setupGame() {
        player = { lane: 0, step: 0 };
        chaser = { lane: 0, step: 12 };
        dots = new Set();
        for (let lane = 0; lane < lanes; lane += 1) {
          for (let step = 0; step < steps; step += 1) {
            dots.add(dotKey(lane, step));
          }
        }
        score = 0;
        tick = 0;
        paused = false;
        ended = false;
        elements.message.textContent = "用方向键上下换车道，收集路点并避开蓝色追车。";
        clearInterval(timer);
        timer = setInterval(gameStep, 170);
        collectDot();
        render();
      }

      function collectDot() {
        const key = dotKey(player.lane, player.step);
        if (dots.delete(key)) {
          score += 10;
        }
      }

      function changeLane(delta) {
        if (ended || paused) return;
        player.lane = Math.max(0, Math.min(lanes - 1, player.lane + delta));
        elements.message.textContent = `切换到第 ${player.lane + 1} 车道。`;
        checkCrash();
        render();
      }

      function moveChaser() {
        chaser.step = (chaser.step - 1 + steps) % steps;
        if (tick % 5 === 0) {
          if (chaser.lane < player.lane) chaser.lane += 1;
          if (chaser.lane > player.lane) chaser.lane -= 1;
        }
      }

      function gameStep() {
        if (paused || ended) return;
        tick += 1;
        player.step = (player.step + 1) % steps;
        moveChaser();
        collectDot();
        checkCrash();
        if (!ended && dots.size === 0) {
          ended = true;
          clearInterval(timer);
          elements.message.textContent = "全部路点已收集，红车获胜。";
        }
        render();
      }

      function checkCrash() {
        if (player.lane === chaser.lane && player.step === chaser.step) {
          ended = true;
          clearInterval(timer);
          elements.message.textContent = "蓝色追车追上了你，游戏结束。";
        }
      }

      function togglePause() {
        if (ended) return;
        paused = !paused;
        elements.message.textContent = paused ? "已暂停。" : "继续行驶。";
        render();
      }

      function drawDot(lane, step) {
        const mark = document.createElement("span");
        const position = point(lane, step);
        mark.className = "absolute h-2 w-2 rounded-full bg-amber-200 shadow";
        mark.style.left = `${position.left}%`;
        mark.style.top = `${position.top}%`;
        mark.style.transform = "translate(-50%, -50%)";
        return mark;
      }

      function drawCar(car, className, label) {
        const node = document.createElement("div");
        const position = point(car.lane, car.step);
        node.className = `absolute flex h-7 w-7 items-center justify-center rounded-md ${className} text-xs font-black shadow-lg`;
        node.style.left = `${position.left}%`;
        node.style.top = `${position.top}%`;
        node.style.transform = "translate(-50%, -50%)";
        node.textContent = label;
        return node;
      }

      function render() {
        elements.track.querySelectorAll("[data-piece]").forEach((node) => node.remove());
        dots.forEach((key) => {
          const [lane, step] = key.split(":").map(Number);
          const dot = drawDot(lane, step);
          dot.dataset.piece = "dot";
          elements.track.appendChild(dot);
        });
        const chaserNode = drawCar(chaser, "bg-sky-400 text-zinc-950", "B");
        chaserNode.dataset.piece = "chaser";
        elements.track.appendChild(chaserNode);
        const playerNode = drawCar(player, "bg-rose-400 text-zinc-950", "R");
        playerNode.dataset.piece = "player";
        elements.track.appendChild(playerNode);

        elements.score.textContent = String(score);
        elements.dots.textContent = String(dots.size);
        elements.lane.textContent = String(player.lane + 1);
        elements.status.textContent = ended ? (dots.size === 0 ? "胜利" : "失败") : paused ? "暂停" : "行驶中";
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "ArrowUp") changeLane(-1);
        if (event.key === "ArrowDown") changeLane(1);
        if (event.key === " ") togglePause();
      });
      elements.laneUp.addEventListener("click", () => changeLane(-1));
      elements.laneDown.addEventListener("click", () => changeLane(1));
      elements.pause.addEventListener("click", togglePause);
      elements.reset.addEventListener("click", setupGame);
      setupGame();
    </script>
  </body>
</html>
