<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini OCTI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-end justify-between gap-3 border-b border-stone-800 pb-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Mini OCTI</h1>
        <p class="mt-1 text-sm text-stone-400">给棋子安装方向尖刺，沿尖刺移动或跳吃；先到对方底线或吃光对手获胜。</p>
      </div>
      <button id="resetBtn" class="rounded bg-lime-400 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-lime-300">重新开始</button>
    </header>

    <section class="grid gap-4 md:grid-cols-[1fr_280px]">
      <div class="rounded border border-stone-800 bg-stone-900 p-3">
        <div id="board" class="grid aspect-square w-full grid-cols-5 gap-2"></div>
      </div>

      <aside class="space-y-3 rounded border border-stone-800 bg-stone-900 p-4">
        <div>
          <p class="text-xs uppercase text-stone-500">当前回合</p>
          <p id="turnText" class="text-xl font-bold"></p>
        </div>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <div class="rounded bg-stone-800 p-3">
            <p class="text-stone-400">蓝方尖刺</p>
            <p id="bluePins" class="text-2xl font-bold text-sky-300"></p>
          </div>
          <div class="rounded bg-stone-800 p-3">
            <p class="text-stone-400">红方尖刺</p>
            <p id="redPins" class="text-2xl font-bold text-rose-300"></p>
          </div>
        </div>
        <div id="pinPanel" class="rounded bg-stone-950 p-3">
          <p class="mb-2 text-sm font-semibold">给选中棋子安装尖刺</p>
          <div id="pinButtons" class="grid grid-cols-3 gap-2"></div>
        </div>
        <p id="message" class="min-h-16 rounded bg-stone-950 p-3 text-sm text-stone-300"></p>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const bluePins = document.getElementById("bluePins");
    const redPins = document.getElementById("redPins");
    const message = document.getElementById("message");
    const pinButtons = document.getElementById("pinButtons");
    const resetBtn = document.getElementById("resetBtn");
    const dirs = [
      { key: "N", label: "↑", dr: -1, dc: 0 },
      { key: "NE", label: "↗", dr: -1, dc: 1 },
      { key: "E", label: "→", dr: 0, dc: 1 },
      { key: "SE", label: "↘", dr: 1, dc: 1 },
      { key: "S", label: "↓", dr: 1, dc: 0 },
      { key: "SW", label: "↙", dr: 1, dc: -1 },
      { key: "W", label: "←", dr: 0, dc: -1 },
      { key: "NW", label: "↖", dr: -1, dc: -1 }
    ];
    const players = {
      B: { name: "蓝方", goal: 0, color: "bg-sky-400 text-stone-950" },
      R: { name: "红方", goal: size - 1, color: "bg-rose-400 text-stone-950" }
    };
    let board;
    let turn;
    let selected;
    let legalTargets;
    let reservePins;
    let gameOver;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(null));
      for (let c = 1; c < 4; c += 1) {
        board[0][c] = piece("R", ["S"]);
        board[4][c] = piece("B", ["N"]);
      }
      turn = "B";
      selected = null;
      legalTargets = [];
      reservePins = { B: 6, R: 6 };
      gameOver = false;
      message.textContent = "蓝方先手：选择棋子移动、跳吃，或给它安装一个新方向尖刺。";
      render();
    }

    function piece(owner, pins = []) {
      return { owner, pins: new Set(pins) };
    }

    function inBounds(r, c) {
      return r >= 0 && r < size && c >= 0 && c < size;
    }

    function counts() {
      return board.flat().reduce((acc, cell) => {
        if (cell) acc[cell.owner] += 1;
        return acc;
      }, { B: 0, R: 0 });
    }

    function targetAt(r, c) {
      return legalTargets.find(t => t.r === r && t.c === c);
    }

    function legalMoves(r, c) {
      const unit = board[r][c];
      if (!unit || unit.owner !== turn) return [];
      const moves = [];
      dirs.forEach(dir => {
        if (!unit.pins.has(dir.key)) return;
        const nr = r + dir.dr;
        const nc = c + dir.dc;
        if (inBounds(nr, nc) && !board[nr][nc]) {
          moves.push({ r: nr, c: nc, type: "move" });
        }
        const jr = r + dir.dr * 2;
        const jc = c + dir.dc * 2;
        if (inBounds(jr, jc) && !board[jr][jc]) {
          const middle = board[nr]?.[nc];
          if (middle && middle.owner !== turn) moves.push({ r: jr, c: jc, type: "jump", capture: [nr, nc] });
        }
      });
      return moves;
    }

    function allMoves(player = turn) {
      const current = turn;
      turn = player;
      const moves = [];
      board.forEach((row, r) => row.forEach((cell, c) => {
        if (cell?.owner === player) legalMoves(r, c).forEach(target => moves.push({ from: [r, c], target }));
      }));
      turn = current;
      return moves;
    }

    function installPin(key) {
      if (gameOver || !selected || reservePins[turn] <= 0) return;
      const unit = board[selected[0]][selected[1]];
      if (!unit || unit.owner !== turn || unit.pins.has(key)) return;
      unit.pins.add(key);
      reservePins[turn] -= 1;
      endTurn(`${players[turn].name} 安装了 ${key} 尖刺。`);
    }

    function applyMove(from, target) {
      const unit = board[from[0]][from[1]];
      board[target.r][target.c] = unit;
      board[from[0]][from[1]] = null;
      if (target.type === "jump") board[target.capture[0]][target.capture[1]] = null;
      checkGame(unit.owner, target.r);
      if (!gameOver) endTurn(target.type === "jump" ? "跳吃成功。" : "移动完成。");
      render();
    }

    function endTurn(text) {
      selected = null;
      legalTargets = [];
      turn = turn === "B" ? "R" : "B";
      if (allMoves(turn).length === 0 && reservePins[turn] === 0) {
        gameOver = true;
        message.textContent = `${players[turn].name} 无法行动，${players[turn === "B" ? "R" : "B"].name} 获胜。`;
      } else {
        message.textContent = `${text} ${players[turn].name} 行动。`;
      }
    }

    function checkGame(player, row) {
      const tally = counts();
      if (tally.B === 0 || tally.R === 0) {
        gameOver = true;
        message.textContent = `${tally.B === 0 ? "红方" : "蓝方"} 吃光对手并获胜。`;
        return;
      }
      if (row === players[player].goal) {
        gameOver = true;
        message.textContent = `${players[player].name} 抵达对方底线并获胜。`;
      }
    }

    function handleCell(r, c) {
      if (gameOver) return;
      const target = targetAt(r, c);
      if (selected && target) {
        applyMove(selected, target);
        return;
      }
      const unit = board[r][c];
      if (!unit || unit.owner !== turn) {
        message.textContent = "请选择当前回合自己的棋子。";
        return;
      }
      selected = [r, c];
      legalTargets = legalMoves(r, c);
      message.textContent = legalTargets.length
        ? "已选中棋子：绿色为移动，黄色为跳吃；也可以在右侧安装新尖刺。"
        : "这枚棋子暂时不能移动，可尝试安装新尖刺。";
      render();
    }

    function renderPins(unit) {
      return dirs.filter(dir => unit.pins.has(dir.key)).map(dir => dir.label).join("");
    }

    function renderPinButtons() {
      pinButtons.innerHTML = "";
      dirs.forEach(dir => {
        const button = document.createElement("button");
        const unit = selected ? board[selected[0]][selected[1]] : null;
        const disabled = gameOver || !unit || unit.owner !== turn || unit.pins.has(dir.key) || reservePins[turn] <= 0;
        button.className = `rounded px-2 py-2 text-lg font-bold ${disabled ? "bg-stone-800 text-stone-600" : "bg-lime-400 text-stone-950 hover:bg-lime-300"}`;
        button.textContent = dir.label;
        button.disabled = disabled;
        button.addEventListener("click", () => installPin(dir.key));
        pinButtons.appendChild(button);
      });
    }

    function render() {
      boardEl.innerHTML = "";
      board.forEach((row, r) => row.forEach((cell, c) => {
        const button = document.createElement("button");
        const dark = (r + c) % 2 === 0;
        const chosen = selected && selected[0] === r && selected[1] === c;
        const target = targetAt(r, c);
        const targetClass = target?.type === "jump" ? "ring-4 ring-amber-300" : target ? "ring-4 ring-emerald-300" : "";
        button.className = `relative flex aspect-square items-center justify-center rounded border transition ${dark ? "border-stone-700 bg-stone-800" : "border-stone-800 bg-stone-700"} ${chosen ? "ring-4 ring-white" : targetClass || "hover:border-lime-300"}`;
        button.setAttribute("aria-label", `row ${r + 1} column ${c + 1}`);
        if (cell) {
          const stone = document.createElement("span");
          stone.className = `flex h-14 w-14 flex-col items-center justify-center rounded-full text-sm font-black shadow ${players[cell.owner].color}`;
          stone.innerHTML = `<span>${cell.owner}</span><span class="text-xs">${renderPins(cell)}</span>`;
          button.appendChild(stone);
        }
        button.addEventListener("click", () => handleCell(r, c));
        boardEl.appendChild(button);
      }));
      turnText.textContent = players[turn].name;
      bluePins.textContent = reservePins.B;
      redPins.textContent = reservePins.R;
      renderPinButtons();
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
