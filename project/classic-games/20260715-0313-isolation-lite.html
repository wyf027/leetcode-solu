<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Isolation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-white">Mini Isolation</h1>
        <p class="mt-1 text-sm text-zinc-300">移动到相邻空格，离开的格子会封锁；困住对手即可获胜。</p>
      </div>
      <button id="resetBtn" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-cyan-300">
        重新开始
      </button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <div class="rounded-lg border border-zinc-700 bg-zinc-900 p-3 shadow-xl">
        <div id="board" class="grid aspect-square w-full grid-cols-6 overflow-hidden rounded-md border border-zinc-700"></div>
      </div>

      <aside class="rounded-lg border border-zinc-700 bg-zinc-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs uppercase text-zinc-400">当前回合</p>
            <p id="turnText" class="mt-1 text-2xl font-bold text-white">蓝方</p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded-md bg-zinc-800 p-3">
              <p class="text-zinc-400">封锁</p>
              <p id="blockedCount" class="text-xl font-semibold text-white">0</p>
            </div>
            <div class="rounded-md bg-zinc-800 p-3">
              <p class="text-zinc-400">可走</p>
              <p id="moveCount" class="text-xl font-semibold text-white">0</p>
            </div>
          </div>
          <p id="statusText" class="rounded-md bg-zinc-800 p-3 text-sm leading-6 text-zinc-200">
            蓝方先手。点击高亮格移动，原位置会变成封锁格。
          </p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const statusText = document.getElementById("statusText");
    const blockedCount = document.getElementById("blockedCount");
    const moveCount = document.getElementById("moveCount");
    const resetBtn = document.getElementById("resetBtn");
    const directions = [-1, 0, 1].flatMap((row) => [-1, 0, 1].map((col) => [row, col])).filter(([row, col]) => row || col);

    let blocked = [];
    let players = {};
    let turn = "blue";
    let winner = null;

    function resetGame() {
      blocked = Array.from({ length: size }, () => Array(size).fill(false));
      players = {
        blue: { row: size - 1, col: 0 },
        rose: { row: 0, col: size - 1 }
      };
      turn = "blue";
      winner = null;
      render();
    }

    function playerName(player) {
      return player === "blue" ? "蓝方" : "玫方";
    }

    function otherPlayer(player) {
      return player === "blue" ? "rose" : "blue";
    }

    function isOccupied(row, col) {
      return Object.values(players).some((piece) => piece.row === row && piece.col === col);
    }

    function legalMoves(player) {
      const piece = players[player];
      return directions
        .map(([rowStep, colStep]) => [piece.row + rowStep, piece.col + colStep])
        .filter(([row, col]) => row >= 0 && row < size && col >= 0 && col < size)
        .filter(([row, col]) => !blocked[row][col] && !isOccupied(row, col));
    }

    function movePlayer(row, col) {
      if (winner) return;
      const moves = legalMoves(turn);
      if (!moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col)) return;
      const current = players[turn];
      blocked[current.row][current.col] = true;
      players[turn] = { row, col };
      const next = otherPlayer(turn);
      if (legalMoves(next).length === 0) {
        winner = turn;
      } else {
        turn = next;
      }
      render();
    }

    function render() {
      const moves = winner ? [] : legalMoves(turn);
      boardEl.innerHTML = "";
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const button = document.createElement("button");
          const isMove = moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col);
          const player = Object.entries(players).find(([, piece]) => piece.row === row && piece.col === col)?.[0];
          button.className = [
            "flex aspect-square items-center justify-center border border-zinc-800 text-lg font-black transition",
            (row + col) % 2 ? "bg-zinc-700" : "bg-zinc-600",
            blocked[row][col] ? "bg-zinc-950 opacity-70" : "",
            isMove ? "bg-cyan-500 hover:bg-cyan-400" : "hover:brightness-110"
          ].join(" ");
          button.setAttribute("aria-label", `${row + 1}-${col + 1}`);
          button.addEventListener("click", () => movePlayer(row, col));

          if (player) {
            const disk = document.createElement("span");
            disk.className = [
              "flex h-3/5 w-3/5 items-center justify-center rounded-full border-2 shadow-lg",
              player === "blue" ? "border-cyan-100 bg-cyan-400 text-zinc-950" : "border-rose-100 bg-rose-400 text-zinc-950"
            ].join(" ");
            disk.textContent = player === "blue" ? "B" : "R";
            button.appendChild(disk);
          } else if (blocked[row][col]) {
            button.textContent = "×";
            button.classList.add("text-zinc-500");
          }

          boardEl.appendChild(button);
        }
      }

      blockedCount.textContent = blocked.flat().filter(Boolean).length;
      moveCount.textContent = moves.length;
      turnText.textContent = winner ? `${playerName(winner)}获胜` : playerName(turn);
      statusText.textContent = winner
        ? `${playerName(winner)}完成封锁。点击重新开始再来一局。`
        : `${playerName(turn)}行动，可移动到 ${moves.length} 个相邻空格。`;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
