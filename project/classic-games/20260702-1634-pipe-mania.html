<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Pipe Mania</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-slate-800 bg-slate-900 p-5 shadow-xl">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal text-white">Mini Pipe Mania</h1>
          <p class="mt-1 text-sm text-slate-400">点击管道旋转，把左上入口连接到右下出口。</p>
        </div>
        <button id="reset" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-300">
          重新打乱
        </button>
      </div>

      <div class="mb-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="rounded-md bg-slate-800 px-3 py-2">
          <div class="text-slate-400">旋转</div>
          <div id="moves" class="text-xl font-semibold text-white">0</div>
        </div>
        <div class="rounded-md bg-slate-800 px-3 py-2">
          <div class="text-slate-400">目标</div>
          <div class="text-xl font-semibold text-white">连通</div>
        </div>
        <div class="rounded-md bg-slate-800 px-3 py-2">
          <div class="text-slate-400">状态</div>
          <div id="status" class="text-xl font-semibold text-white">调整</div>
        </div>
      </div>

      <div id="board" class="mx-auto grid w-full max-w-md grid-cols-5 gap-2 rounded-lg bg-slate-950 p-3"></div>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const movesEl = document.getElementById("moves");
    const statusEl = document.getElementById("status");
    const resetEl = document.getElementById("reset");
    const size = 5;
    const symbols = {
      "0,1": "╵",
      "1,2": "╶",
      "2,3": "╷",
      "0,3": "╴",
      "0,2": "│",
      "1,3": "─",
      "0,1,2,3": "┼",
      "0,1": "└",
      "1,2": "┌",
      "2,3": "┐",
      "0,3": "┘"
    };
    const solution = [
      [[1, 2], [1, 3], [1, 3], [2, 3], [2]],
      [[0, 2], [1, 2], [2, 3], [0, 2], [0, 2]],
      [[0, 1], [0, 3], [0, 1], [0, 3], [0, 2]],
      [[1], [1, 3], [1, 2], [2, 3], [0, 2]],
      [[1], [3], [0, 1], [0, 3], [0, 3]]
    ];
    let grid = [];
    let moves = 0;

    function resetGame() {
      moves = 0;
      grid = solution.map(row => row.map(pipe => {
        const turns = Math.floor(Math.random() * 4);
        return rotate(pipe, turns);
      }));
      if (isSolved()) grid[0][0] = rotate(grid[0][0], 1);
      render();
    }

    function rotate(pipe, turns = 1) {
      return pipe.map(side => (side + turns) % 4).sort((a, b) => a - b);
    }

    function rotateCell(row, col) {
      if (isSolved()) return;
      grid[row][col] = rotate(grid[row][col]);
      moves++;
      render();
    }

    function isSolved() {
      const visited = new Set(["0,0"]);
      const stack = [[0, 0]];
      while (stack.length) {
        const [row, col] = stack.pop();
        if (row === size - 1 && col === size - 1) return true;
        for (const side of grid[row][col]) {
          const [nr, nc] = neighbor(row, col, side);
          if (nr < 0 || nc < 0 || nr >= size || nc >= size) continue;
          if (!grid[nr][nc].includes((side + 2) % 4)) continue;
          const key = `${nr},${nc}`;
          if (!visited.has(key)) {
            visited.add(key);
            stack.push([nr, nc]);
          }
        }
      }
      return false;
    }

    function neighbor(row, col, side) {
      if (side === 0) return [row - 1, col];
      if (side === 1) return [row, col + 1];
      if (side === 2) return [row + 1, col];
      return [row, col - 1];
    }

    function symbol(pipe) {
      const key = pipe.join(",");
      if (key === "0,1") return "└";
      if (key === "1,2") return "┌";
      if (key === "2,3") return "┐";
      if (key === "0,3") return "┘";
      return symbols[key] || "┼";
    }

    function render() {
      boardEl.innerHTML = "";
      const solved = isSolved();
      grid.forEach((row, rowIndex) => {
        row.forEach((pipe, colIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = [
            "aspect-square rounded-md border text-4xl font-bold transition focus:outline-none focus:ring-2 focus:ring-cyan-200",
            solved ? "border-emerald-300 bg-emerald-400 text-slate-950" : "border-slate-700 bg-slate-800 text-cyan-200 hover:bg-slate-700"
          ].join(" ");
          button.textContent = symbol(pipe);
          button.disabled = solved;
          button.setAttribute("aria-label", `第 ${rowIndex + 1} 行第 ${colIndex + 1} 列管道`);
          button.addEventListener("click", () => rotateCell(rowIndex, colIndex));
          boardEl.appendChild(button);
        });
      });
      movesEl.textContent = moves;
      statusEl.textContent = solved ? "完成" : "调整";
    }

    resetEl.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
