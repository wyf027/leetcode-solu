<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Ducks and Dragons</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-950 text-sky-50">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col justify-center gap-5 px-4 py-8">
    <section class="rounded-lg border border-sky-800 bg-sky-900 p-5 shadow-2xl shadow-black/30">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-amber-300">Classic Mini Game</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Ducks and Dragons</h1>
          <p class="mt-2 max-w-2xl text-sm leading-6 text-sky-100">
            控制小鸭收集 3 枚宝石并抵达出口。每次移动后龙会巡逻一步，撞上龙就失败。
          </p>
        </div>
        <button id="resetBtn" class="rounded-md bg-amber-300 px-4 py-2 text-sm font-bold text-sky-950 transition hover:bg-amber-200">
          重新开始
        </button>
      </div>
    </section>

    <section class="grid gap-4 lg:grid-cols-[1fr_17rem]">
      <div class="rounded-lg border border-sky-800 bg-sky-900 p-4">
        <div id="board" class="grid aspect-square w-full grid-cols-5 gap-2"></div>
      </div>

      <aside class="rounded-lg border border-sky-800 bg-sky-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-200">宝石</p>
            <p id="gemLabel" class="mt-1 text-2xl font-bold text-white">0 / 3</p>
          </div>
          <div>
            <p class="text-xs font-semibold uppercase tracking-wide text-sky-200">步数</p>
            <p id="stepLabel" class="mt-1 text-2xl font-bold text-white">0</p>
          </div>
          <div class="rounded-md bg-sky-800 p-3">
            <p id="status" class="text-sm leading-6 text-sky-50">使用方向键或点击相邻格移动。</p>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById('board');
    const gemLabel = document.getElementById('gemLabel');
    const stepLabel = document.getElementById('stepLabel');
    const statusEl = document.getElementById('status');
    const resetBtn = document.getElementById('resetBtn');

    const size = 5;
    const walls = new Set([idx(1, 1), idx(1, 3), idx(3, 1), idx(3, 3)]);
    const startGems = [idx(0, 4), idx(2, 2), idx(4, 0)];
    const exit = idx(4, 4);
    const dragonPath = [idx(0, 2), idx(1, 2), idx(2, 2), idx(3, 2), idx(4, 2), idx(3, 2), idx(2, 2), idx(1, 2)];

    let duck = idx(0, 0);
    let gems = new Set(startGems);
    let dragonStep = 0;
    let steps = 0;
    let ended = false;

    function startGame() {
      duck = idx(0, 0);
      gems = new Set(startGems);
      dragonStep = 0;
      steps = 0;
      ended = false;
      statusEl.textContent = '使用方向键或点击相邻格移动。';
      render();
    }

    function render() {
      boardEl.innerHTML = '';
      const dragon = dragonPath[dragonStep];
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const index = idx(row, col);
          const button = document.createElement('button');
          const isWall = walls.has(index);
          const isExit = index === exit;
          button.className = [
            'flex aspect-square items-center justify-center rounded-md border text-3xl font-black transition sm:text-5xl',
            isWall ? 'border-sky-950 bg-sky-950 text-sky-700' : isExit ? 'border-amber-300 bg-amber-400/20 text-amber-100' : 'border-sky-700 bg-sky-800 text-sky-100',
            !ended && !isWall ? 'hover:border-amber-200' : 'cursor-default'
          ].join(' ');
          button.textContent = symbolFor(index, dragon);
          button.disabled = ended || isWall;
          button.setAttribute('aria-label', `格子 ${row + 1}-${col + 1}`);
          button.addEventListener('click', () => moveDuck(index));
          boardEl.appendChild(button);
        }
      }
      gemLabel.textContent = `${startGems.length - gems.size} / ${startGems.length}`;
      stepLabel.textContent = steps;
    }

    function symbolFor(index, dragon) {
      if (index === duck) return 'D';
      if (index === dragon) return 'R';
      if (gems.has(index)) return '*';
      if (index === exit) return 'E';
      if (walls.has(index)) return '#';
      return '';
    }

    function moveDuck(target) {
      if (ended || !isAdjacent(duck, target) || walls.has(target)) {
        return;
      }
      duck = target;
      steps += 1;
      if (gems.has(duck)) {
        gems.delete(duck);
        statusEl.textContent = '收集到一枚宝石。';
      }
      advanceDragon();
      checkEnd();
      render();
    }

    function advanceDragon() {
      dragonStep = (dragonStep + 1) % dragonPath.length;
    }

    function checkEnd() {
      const dragon = dragonPath[dragonStep];
      if (duck === dragon) {
        ended = true;
        statusEl.textContent = '小鸭撞上巡逻龙，本局失败。';
      } else if (duck === exit && gems.size === 0) {
        ended = true;
        statusEl.textContent = '宝石收齐并抵达出口，挑战成功。';
      } else if (duck === exit) {
        statusEl.textContent = '出口已到达，但还需要收齐宝石。';
      }
    }

    function isAdjacent(a, b) {
      const dr = Math.abs(rowOf(a) - rowOf(b));
      const dc = Math.abs(colOf(a) - colOf(b));
      return dr + dc === 1;
    }

    function handleKey(event) {
      const keyMap = {
        ArrowUp: [-1, 0],
        ArrowDown: [1, 0],
        ArrowLeft: [0, -1],
        ArrowRight: [0, 1]
      };
      if (!keyMap[event.key]) {
        return;
      }
      event.preventDefault();
      const [dr, dc] = keyMap[event.key];
      const nextRow = rowOf(duck) + dr;
      const nextCol = colOf(duck) + dc;
      if (inBounds(nextRow, nextCol)) {
        moveDuck(idx(nextRow, nextCol));
      }
    }

    function rowOf(index) {
      return Math.floor(index / size);
    }

    function colOf(index) {
      return index % size;
    }

    function idx(row, col) {
      return row * size + col;
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    document.addEventListener('keydown', handleKey);
    resetBtn.addEventListener('click', startGame);
    startGame();
  </script>
</body>
</html>
