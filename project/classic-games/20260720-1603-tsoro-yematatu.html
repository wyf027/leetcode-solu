<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Tsoro Yematatu</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-5 md:flex-row md:items-center md:justify-center">
    <section class="w-full md:w-[23rem]">
      <p class="text-sm uppercase tracking-[0.28em] text-amber-300">Classic board game</p>
      <h1 class="mt-2 text-3xl font-semibold text-white">Mini Tsoro Yematatu</h1>
      <p class="mt-3 text-sm leading-6 text-stone-300">
        每方三枚棋。先轮流放子，放满后沿线移动一格，率先在三角棋盘任意直线上连成三枚获胜。
      </p>
      <div class="mt-5 grid grid-cols-2 gap-3 text-sm">
        <div class="rounded border border-stone-700 bg-stone-900 p-3">
          <div class="text-stone-400">当前回合</div>
          <div id="turnLabel" class="mt-1 text-xl font-semibold text-amber-200">黑棋</div>
        </div>
        <div class="rounded border border-stone-700 bg-stone-900 p-3">
          <div class="text-stone-400">阶段</div>
          <div id="phaseLabel" class="mt-1 text-xl font-semibold text-emerald-200">放子</div>
        </div>
      </div>
      <div id="message" class="mt-4 min-h-12 rounded border border-amber-400/30 bg-amber-400/10 p-3 text-sm text-amber-100">
        黑棋先手，点击空点放下第一枚棋。
      </div>
      <button id="resetBtn" class="mt-4 w-full rounded bg-amber-300 px-4 py-3 font-semibold text-stone-950 transition hover:bg-amber-200">
        重新开始
      </button>
    </section>

    <section class="flex w-full justify-center">
      <div class="relative aspect-square w-full max-w-[34rem] rounded border border-stone-700 bg-stone-900 shadow-2xl">
        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 10 L12 84 L88 84 Z" fill="none" stroke="#d6d3d1" stroke-width="1.3" />
          <path d="M50 10 L50 84 M12 84 L88 84 M31 47 L69 47 M31 47 L50 84 M69 47 L50 84" fill="none" stroke="#78716c" stroke-width="1" />
        </svg>
        <div id="board" class="absolute inset-0"></div>
      </div>
    </section>
  </main>

  <script>
    const points = [
      { x: 50, y: 10, links: [1, 2, 3] },
      { x: 31, y: 47, links: [0, 2, 4, 5] },
      { x: 69, y: 47, links: [0, 1, 5, 6] },
      { x: 12, y: 84, links: [0, 4] },
      { x: 50, y: 84, links: [1, 3, 5, 6] },
      { x: 88, y: 84, links: [1, 2, 4] },
      { x: 50, y: 47, links: [0, 1, 2, 4] }
    ];

    const lines = [
      [0, 1, 3],
      [0, 2, 5],
      [3, 4, 5],
      [1, 6, 2],
      [0, 6, 4],
      [1, 4, 5],
      [2, 4, 6]
    ];

    const boardEl = document.getElementById("board");
    const turnLabel = document.getElementById("turnLabel");
    const phaseLabel = document.getElementById("phaseLabel");
    const messageEl = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    let board;
    let turn;
    let placed;
    let selected;
    let winner;

    function resetGame() {
      board = Array(points.length).fill(null);
      turn = "black";
      placed = { black: 0, white: 0 };
      selected = null;
      winner = null;
      messageEl.textContent = "黑棋先手，点击空点放下第一枚棋。";
      render();
    }

    function phase() {
      return placed.black + placed.white < 6 ? "place" : "move";
    }

    function playerName(player) {
      return player === "black" ? "黑棋" : "白棋";
    }

    function other(player) {
      return player === "black" ? "white" : "black";
    }

    function hasLine(player) {
      return lines.some((line) => line.every((index) => board[index] === player));
    }

    function hasLegalMove(player) {
      return board.some((cell, index) => cell === player && points[index].links.some((next) => !board[next]));
    }

    function finishTurn() {
      if (hasLine(turn)) {
        winner = turn;
        messageEl.textContent = playerName(turn) + "连成三枚，赢得本局。";
        render();
        return;
      }

      turn = other(turn);
      selected = null;
      if (phase() === "move" && !hasLegalMove(turn)) {
        winner = other(turn);
        messageEl.textContent = playerName(turn) + "没有可走位置，" + playerName(winner) + "获胜。";
      } else {
        messageEl.textContent = phase() === "place"
          ? playerName(turn) + "放子。"
          : playerName(turn) + "选择一枚棋并沿线移动一格。";
      }
      render();
    }

    function handlePointClick(index) {
      if (winner) return;

      if (phase() === "place") {
        if (board[index]) {
          messageEl.textContent = "这里已经有棋子，请选择空点。";
          return;
        }
        board[index] = turn;
        placed[turn] += 1;
        finishTurn();
        return;
      }

      if (selected === null) {
        if (board[index] !== turn) {
          messageEl.textContent = "请选择自己的棋子。";
          return;
        }
        selected = index;
        messageEl.textContent = "已选择棋子，现在点击相邻空点移动。";
        render();
        return;
      }

      if (index === selected) {
        selected = null;
        messageEl.textContent = playerName(turn) + "重新选择一枚棋。";
        render();
        return;
      }

      if (board[index] === turn) {
        selected = index;
        messageEl.textContent = "已切换选择。";
        render();
        return;
      }

      if (board[index] || !points[selected].links.includes(index)) {
        messageEl.textContent = "只能移动到相邻的空点。";
        return;
      }

      board[index] = turn;
      board[selected] = null;
      finishTurn();
    }

    function render() {
      boardEl.innerHTML = "";
      turnLabel.textContent = winner ? playerName(winner) + "胜" : playerName(turn);
      phaseLabel.textContent = phase() === "place" ? "放子" : "走子";

      points.forEach((point, index) => {
        const cell = document.createElement("button");
        const piece = board[index];
        const isSelected = selected === index;
        cell.type = "button";
        cell.setAttribute("aria-label", "棋点 " + (index + 1));
        cell.className = [
          "absolute flex h-14 w-14 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-2 transition",
          isSelected ? "border-amber-300 bg-amber-300/20" : "border-stone-400 bg-stone-950",
          !winner ? "hover:border-amber-200" : "cursor-default"
        ].join(" ");
        cell.style.left = point.x + "%";
        cell.style.top = point.y + "%";
        cell.addEventListener("click", () => handlePointClick(index));

        if (piece) {
          const disk = document.createElement("span");
          disk.className = piece === "black"
            ? "block h-9 w-9 rounded-full bg-stone-950 ring-4 ring-stone-200"
            : "block h-9 w-9 rounded-full bg-stone-100 ring-4 ring-stone-950";
          cell.appendChild(disk);
        } else {
          const dot = document.createElement("span");
          dot.className = "block h-3 w-3 rounded-full bg-stone-500";
          cell.appendChild(dot);
        }

        boardEl.appendChild(cell);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
