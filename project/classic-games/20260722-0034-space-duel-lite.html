<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Space Duel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-col gap-3 md:flex-row md:items-end md:justify-between">
      <div>
        <p class="text-xs uppercase tracking-[0.25em] text-rose-300">Classic Games</p>
        <h1 class="text-3xl font-bold text-white">Mini Space Duel</h1>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        <div class="rounded border border-slate-700 bg-slate-900 px-3 py-2">
          <p class="text-xs text-slate-400">得分</p>
          <p id="score" class="font-semibold text-rose-200">0</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 px-3 py-2">
          <p class="text-xs text-slate-400">生命</p>
          <p id="lives" class="font-semibold text-emerald-200">3</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 px-3 py-2">
          <p class="text-xs text-slate-400">目标</p>
          <p id="rocks" class="font-semibold text-amber-200">0</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 px-3 py-2">
          <p class="text-xs text-slate-400">波次</p>
          <p id="wave" class="font-semibold text-sky-200">1</p>
        </div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[minmax(0,1fr)_270px]">
      <div class="rounded border border-slate-800 bg-slate-900 p-3 shadow-2xl shadow-black/30">
        <canvas id="game" width="720" height="520" class="h-auto w-full rounded bg-black"></canvas>
      </div>
      <aside class="rounded border border-slate-800 bg-slate-900 p-4">
        <h2 class="text-lg font-semibold text-white">任务</h2>
        <p class="mt-2 text-sm leading-6 text-slate-300">操控双机编队在惯性空间中旋转、推进和射击。击碎漂浮目标，避开碎片和敌方炮火。</p>
        <dl class="mt-4 space-y-3 text-sm">
          <div>
            <dt class="font-semibold text-rose-200">转向</dt>
            <dd class="text-slate-300">方向键 / A D</dd>
          </div>
          <div>
            <dt class="font-semibold text-rose-200">推进</dt>
            <dd class="text-slate-300">W / 上方向键</dd>
          </div>
          <div>
            <dt class="font-semibold text-rose-200">射击</dt>
            <dd class="text-slate-300">空格键</dd>
          </div>
          <div>
            <dt class="font-semibold text-rose-200">重新开始</dt>
            <dd class="text-slate-300">R</dd>
          </div>
        </dl>
        <button id="restart" class="mt-5 w-full rounded bg-rose-300 px-4 py-2 font-semibold text-slate-950 hover:bg-rose-200">重新开始</button>
        <p id="status" class="mt-4 min-h-14 rounded border border-slate-700 bg-slate-950 p-3 text-sm text-slate-300">推进会积累惯性，短点空格清理前方目标。</p>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const rocksEl = document.getElementById("rocks");
    const waveEl = document.getElementById("wave");
    const statusEl = document.getElementById("status");
    const restartBtn = document.getElementById("restart");

    const W = canvas.width;
    const H = canvas.height;
    const keys = new Set();
    let ship;
    let shots;
    let rocks;
    let enemyShots;
    let sparks;
    let score;
    let lives;
    let wave;
    let cooldown;
    let enemyTimer;
    let running;
    let message;
    let lastTime = 0;

    function wrap(entity) {
      if (entity.x < -20) entity.x = W + 20;
      if (entity.x > W + 20) entity.x = -20;
      if (entity.y < -20) entity.y = H + 20;
      if (entity.y > H + 20) entity.y = -20;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function resetGame() {
      ship = { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, invulnerable: 0 };
      shots = [];
      enemyShots = [];
      sparks = [];
      score = 0;
      lives = 3;
      wave = 1;
      cooldown = 0;
      enemyTimer = 1.1;
      running = true;
      message = "推进会积累惯性，短点空格清理前方目标。";
      buildWave();
      updateHud();
    }

    function buildWave() {
      rocks = [];
      const count = 5 + wave * 2;
      for (let i = 0; i < count; i += 1) {
        const angle = (Math.PI * 2 * i) / count;
        rocks.push({
          x: W / 2 + Math.cos(angle) * (150 + Math.random() * 85),
          y: H / 2 + Math.sin(angle) * (100 + Math.random() * 75),
          vx: (Math.random() - 0.5) * (38 + wave * 5),
          vy: (Math.random() - 0.5) * (38 + wave * 5),
          r: 18 + Math.random() * 12,
          sides: 6 + Math.floor(Math.random() * 3),
          spin: (Math.random() - 0.5) * 1.4,
          angle: Math.random() * Math.PI * 2,
          hp: 2,
        });
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      rocksEl.textContent = rocks.length;
      waveEl.textContent = wave;
      statusEl.textContent = message;
    }

    function burst(x, y, color, amount) {
      for (let i = 0; i < amount; i += 1) {
        sparks.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 230,
          vy: (Math.random() - 0.5) * 230,
          life: 0.35 + Math.random() * 0.45,
          color,
        });
      }
    }

    function shoot() {
      if (!running || cooldown > 0) return;
      const lanes = [-9, 9];
      for (const side of lanes) {
        const sx = ship.x + Math.cos(ship.angle + Math.PI / 2) * side;
        const sy = ship.y + Math.sin(ship.angle + Math.PI / 2) * side;
        shots.push({
          x: sx + Math.cos(ship.angle) * 18,
          y: sy + Math.sin(ship.angle) * 18,
          vx: ship.vx + Math.cos(ship.angle) * 440,
          vy: ship.vy + Math.sin(ship.angle) * 440,
          life: 0.95,
        });
      }
      cooldown = 0.18;
    }

    function loseLife() {
      if (ship.invulnerable > 0) return;
      burst(ship.x, ship.y, "#fda4af", 26);
      lives -= 1;
      if (lives <= 0) {
        running = false;
        message = "编队被击毁。按 R 重新开始。";
      } else {
        ship.x = W / 2;
        ship.y = H / 2;
        ship.vx = 0;
        ship.vy = 0;
        ship.angle = -Math.PI / 2;
        ship.invulnerable = 1.8;
        enemyShots = [];
        message = "损失一组飞船，短暂无敌。";
      }
      updateHud();
    }

    function splitRock(rock) {
      score += rock.r > 20 ? 45 : 80;
      burst(rock.x, rock.y, "#fbbf24", 16);
      if (rock.r > 20) {
        for (let i = 0; i < 2; i += 1) {
          rocks.push({
            x: rock.x,
            y: rock.y,
            vx: rock.vx * 0.7 + (Math.random() - 0.5) * 80,
            vy: rock.vy * 0.7 + (Math.random() - 0.5) * 80,
            r: rock.r * 0.58,
            sides: rock.sides,
            spin: (Math.random() - 0.5) * 1.8,
            angle: Math.random() * Math.PI * 2,
            hp: 1,
          });
        }
      }
      message = "目标碎裂，保持距离。";
      updateHud();
    }

    function enemyFire(dt) {
      enemyTimer -= dt;
      if (enemyTimer > 0 || rocks.length === 0) return;
      const source = rocks[Math.floor(Math.random() * rocks.length)];
      const angle = Math.atan2(ship.y - source.y, ship.x - source.x);
      enemyShots.push({
        x: source.x,
        y: source.y,
        vx: Math.cos(angle) * (135 + wave * 12),
        vy: Math.sin(angle) * (135 + wave * 12),
        life: 3,
      });
      enemyTimer = Math.max(0.55, 1.35 - wave * 0.08);
    }

    function updateShip(dt) {
      if (keys.has("arrowleft") || keys.has("a")) ship.angle -= 3.2 * dt;
      if (keys.has("arrowright") || keys.has("d")) ship.angle += 3.2 * dt;
      if (keys.has("arrowup") || keys.has("w")) {
        ship.vx += Math.cos(ship.angle) * 190 * dt;
        ship.vy += Math.sin(ship.angle) * 190 * dt;
      }
      ship.vx *= 0.995;
      ship.vy *= 0.995;
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;
      ship.invulnerable = Math.max(0, ship.invulnerable - dt);
      cooldown = Math.max(0, cooldown - dt);
      wrap(ship);
    }

    function updateShots(dt) {
      for (const shot of shots) {
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
        shot.life -= dt;
        wrap(shot);
        for (const rock of rocks) {
          if (distance(shot, rock) < rock.r) {
            shot.dead = true;
            rock.hp -= 1;
            if (rock.hp <= 0) rock.dead = true;
            break;
          }
        }
      }
      const destroyed = rocks.filter((rock) => rock.dead);
      rocks = rocks.filter((rock) => !rock.dead);
      for (const rock of destroyed) splitRock(rock);
      shots = shots.filter((shot) => shot.life > 0 && !shot.dead);
    }

    function updateRocks(dt) {
      for (const rock of rocks) {
        rock.x += rock.vx * dt;
        rock.y += rock.vy * dt;
        rock.angle += rock.spin * dt;
        wrap(rock);
        if (distance(ship, rock) < rock.r + 15) loseLife();
      }
      if (rocks.length === 0) {
        wave += 1;
        buildWave();
        enemyShots = [];
        ship.invulnerable = 1.1;
        message = `第 ${wave} 波目标进入区域。`;
        updateHud();
      }
    }

    function updateEnemyShots(dt) {
      for (const shot of enemyShots) {
        shot.x += shot.vx * dt;
        shot.y += shot.vy * dt;
        shot.life -= dt;
        wrap(shot);
        if (distance(ship, shot) < 15) {
          shot.dead = true;
          loseLife();
        }
      }
      enemyShots = enemyShots.filter((shot) => shot.life > 0 && !shot.dead);
    }

    function updateSparks(dt) {
      sparks = sparks.filter((spark) => spark.life > 0);
      for (const spark of sparks) {
        spark.life -= dt;
        spark.x += spark.vx * dt;
        spark.y += spark.vy * dt;
      }
    }

    function update(dt) {
      if (!running) return;
      updateShip(dt);
      updateShots(dt);
      updateRocks(dt);
      updateEnemyShots(dt);
      updateSparks(dt);
      enemyFire(dt);
    }

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);
      ctx.fillStyle = ship.invulnerable > 0 ? "#fce7f3" : "#fb7185";
      for (const side of [-9, 9]) {
        ctx.beginPath();
        ctx.moveTo(17, side);
        ctx.lineTo(-10, side - 7);
        ctx.lineTo(-5, side);
        ctx.lineTo(-10, side + 7);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = "#e2e8f0";
      ctx.beginPath();
      ctx.moveTo(-7, -9);
      ctx.lineTo(-7, 9);
      ctx.stroke();
      ctx.restore();
    }

    function drawRock(rock) {
      ctx.save();
      ctx.translate(rock.x, rock.y);
      ctx.rotate(rock.angle);
      ctx.strokeStyle = rock.hp > 1 ? "#fbbf24" : "#fde68a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= rock.sides; i += 1) {
        const angle = (Math.PI * 2 * i) / rock.sides;
        const radius = rock.r * (0.8 + (i % 2) * 0.2);
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = "#334155";
      for (let i = 0; i < 90; i += 1) {
        ctx.fillRect((i * 79 + wave * 13) % W, (i * 43) % H, 1.4, 1.4);
      }

      for (const rock of rocks) drawRock(rock);

      ctx.fillStyle = "#e2e8f0";
      for (const shot of shots) {
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#38bdf8";
      for (const shot of enemyShots) {
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      drawShip();

      for (const spark of sparks) {
        ctx.globalAlpha = Math.max(0, spark.life);
        ctx.fillStyle = spark.color;
        ctx.fillRect(spark.x, spark.y, 3, 3);
      }
      ctx.globalAlpha = 1;

      if (!running) {
        ctx.fillStyle = "rgba(2, 6, 23, 0.78)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 32px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("Duel Lost", W / 2, H / 2 - 12);
        ctx.font = "18px system-ui";
        ctx.fillText("按 R 或点击重新开始", W / 2, H / 2 + 24);
        ctx.textAlign = "left";
      }
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      keys.add(key);
      if (event.code === "Space") {
        event.preventDefault();
        shoot();
      }
      if (key === "r") resetGame();
    });

    document.addEventListener("keyup", (event) => {
      keys.delete(event.key.toLowerCase());
    });

    restartBtn.addEventListener("click", resetGame);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
