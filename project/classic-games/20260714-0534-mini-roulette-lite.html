<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Roulette</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-red-950 text-red-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 p-4">
    <section class="w-full rounded-lg border border-red-800 bg-red-900 p-5 shadow-2xl">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-normal">Mini Roulette</h1>
          <p class="mt-1 text-sm text-red-200">Pick red, black, or green before the wheel stops.</p>
        </div>
        <div class="flex items-center gap-2">
          <span class="rounded border border-red-700 px-3 py-2 text-sm">Chips: <strong id="chips">20</strong></span>
          <button id="resetBtn" class="rounded border border-red-600 px-4 py-2 text-sm font-bold hover:bg-red-800">Reset</button>
        </div>
      </div>

      <div class="grid gap-4 md:grid-cols-[1fr_220px]">
        <div class="flex flex-col items-center gap-4 rounded-lg bg-red-950 p-4">
          <div id="wheel" class="flex aspect-square w-56 items-center justify-center rounded-full border-8 border-yellow-200 bg-black text-6xl font-black shadow-2xl transition-transform duration-700">0</div>
          <div class="grid w-full grid-cols-3 gap-2">
            <button class="bet rounded bg-red-500 px-4 py-3 font-bold hover:bg-red-400" data-bet="red">Red</button>
            <button class="bet rounded bg-neutral-950 px-4 py-3 font-bold hover:bg-neutral-800" data-bet="black">Black</button>
            <button class="bet rounded bg-emerald-500 px-4 py-3 font-bold text-emerald-950 hover:bg-emerald-400" data-bet="green">Green</button>
          </div>
        </div>
        <aside class="flex flex-col gap-3 rounded-lg border border-red-700 bg-red-950 p-3">
          <div class="rounded border border-red-700 bg-red-900 p-3">
            <div class="text-xs uppercase text-red-200">Current bet</div>
            <div id="betLabel" class="mt-1 text-3xl font-black">Red</div>
          </div>
          <button id="spinBtn" class="rounded bg-yellow-200 px-4 py-3 text-sm font-black text-red-950 hover:bg-yellow-100">Spin</button>
          <p id="message" class="min-h-28 rounded border border-red-700 bg-red-900 p-3 text-sm text-red-100">Choose a color, then spin. Red and black pay 2x, green pays 6x.</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const wheel = document.getElementById('wheel');
    const chipsEl = document.getElementById('chips');
    const betLabel = document.getElementById('betLabel');
    const message = document.getElementById('message');
    const spinBtn = document.getElementById('spinBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pockets = [
      { number: 0, color: 'green' },
      { number: 1, color: 'red' },
      { number: 2, color: 'black' },
      { number: 3, color: 'red' },
      { number: 4, color: 'black' },
      { number: 5, color: 'red' },
      { number: 6, color: 'black' },
      { number: 7, color: 'red' },
      { number: 8, color: 'black' },
      { number: 9, color: 'green' }
    ];
    let chips = 20;
    let bet = 'red';
    let spinning = false;
    let rotation = 0;

    function resetGame() {
      chips = 20;
      bet = 'red';
      spinning = false;
      rotation = 0;
      message.textContent = 'Choose a color, then spin. Red and black pay 2x, green pays 6x.';
      renderPocket({ number: 0, color: 'green' });
      render();
    }

    function setBet(value) {
      if (spinning) return;
      bet = value;
      message.textContent = `Bet set to ${value}.`;
      render();
    }

    function spinWheel() {
      if (spinning || chips <= 0) return;
      spinning = true;
      chips -= 1;
      const result = pockets[Math.floor(Math.random() * pockets.length)];
      rotation += 720 + result.number * 36;
      wheel.style.transform = `rotate(${rotation}deg)`;
      message.textContent = 'Wheel is spinning...';
      render();
      setTimeout(() => finishSpin(result), 720);
    }

    function finishSpin(result) {
      renderPocket(result);
      if (result.color === bet) {
        chips += bet === 'green' ? 6 : 2;
        message.textContent = `${result.number} ${result.color}. You win.`;
      } else {
        message.textContent = `${result.number} ${result.color}. Try again.`;
      }
      spinning = false;
      if (chips <= 0) message.textContent = 'No chips left. Reset to play again.';
      render();
    }

    function renderPocket(pocket) {
      wheel.textContent = pocket.number;
      wheel.className = `flex aspect-square w-56 items-center justify-center rounded-full border-8 border-yellow-200 text-6xl font-black shadow-2xl transition-transform duration-700 ${pocket.color === 'red' ? 'bg-red-500 text-white' : pocket.color === 'black' ? 'bg-neutral-950 text-white' : 'bg-emerald-400 text-emerald-950'}`;
    }

    function render() {
      chipsEl.textContent = chips;
      betLabel.textContent = bet[0].toUpperCase() + bet.slice(1);
      spinBtn.disabled = spinning || chips <= 0;
      spinBtn.classList.toggle('opacity-50', spinning || chips <= 0);
    }

    document.querySelectorAll('.bet').forEach(button => {
      button.addEventListener('click', () => setBet(button.dataset.bet));
    });
    spinBtn.addEventListener('click', spinWheel);
    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
