<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Pentago</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-purple-950 text-purple-50">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-purple-800 pb-4 md:flex-row md:items-end md:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-emerald-200">Mini Pentago</h1>
        <p class="mt-1 text-sm text-purple-300">落子后旋转一个 3x3 象限；先连成五子者获胜。</p>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded border border-purple-700 bg-purple-900 px-3 py-2">
          <div class="text-purple-400">当前</div>
          <div id="turn" class="text-lg font-bold text-emerald-200">White</div>
        </div>
        <div class="rounded border border-purple-700 bg-purple-900 px-3 py-2">
          <div class="text-purple-400">阶段</div>
          <div id="phase" class="text-lg font-bold">落子</div>
        </div>
        <div class="rounded border border-purple-700 bg-purple-900 px-3 py-2">
          <div class="text-purple-400">回合</div>
          <div id="round" class="text-lg font-bold">1</div>
        </div>
      </div>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_280px]">
      <div class="flex justify-center">
        <div id="board" class="grid aspect-square w-full max-w-[640px] grid-cols-6 gap-2 rounded bg-purple-900 p-3 shadow-2xl shadow-black/40"></div>
      </div>
      <aside class="flex flex-col gap-4">
        <div class="rounded border border-purple-800 bg-purple-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-purple-300">旋转</h2>
          <div id="rotations" class="mt-3 grid grid-cols-2 gap-2"></div>
        </div>
        <div class="rounded border border-purple-800 bg-purple-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-purple-300">状态</h2>
          <p id="message" class="mt-3 min-h-24 text-sm leading-6 text-purple-100">点击空格落子。</p>
          <button id="reset" class="mt-4 w-full rounded bg-emerald-300 px-4 py-2 font-semibold text-purple-950 hover:bg-emerald-200">重新开局</button>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById('board');
    const rotationsEl = document.getElementById('rotations');
    const turnEl = document.getElementById('turn');
    const phaseEl = document.getElementById('phase');
    const roundEl = document.getElementById('round');
    const msgEl = document.getElementById('message');
    const resetBtn = document.getElementById('reset');

    let board;
    let current;
    let phase;
    let round;
    let gameOver;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(''));
      current = 'W';
      phase = 'place';
      round = 1;
      gameOver = false;
      msgEl.textContent = '点击空格落子。';
      render();
    }

    function playerName(mark) {
      return mark === 'W' ? 'White' : 'Black';
    }

    function quadrantOrigin(index) {
      return { row: index < 2 ? 0 : 3, col: index % 2 === 0 ? 0 : 3 };
    }

    function renderBoard() {
      boardEl.innerHTML = '';
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const cell = board[row][col];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = cell ? '●' : '';
          btn.className = [
            'aspect-square rounded-full border text-3xl font-black transition',
            row < 3 && col < 3 ? 'bg-purple-800' : '',
            row < 3 && col >= 3 ? 'bg-fuchsia-800' : '',
            row >= 3 && col < 3 ? 'bg-indigo-800' : '',
            row >= 3 && col >= 3 ? 'bg-violet-800' : '',
            cell === 'W' ? 'border-white text-white' : '',
            cell === 'B' ? 'border-slate-950 text-slate-950' : '',
            !cell ? 'border-purple-600 hover:border-emerald-200' : ''
          ].join(' ');
          btn.addEventListener('click', () => placeStone(row, col));
          boardEl.appendChild(btn);
        }
      }
    }

    function renderRotations() {
      rotationsEl.innerHTML = '';
      for (let q = 0; q < 4; q += 1) {
        ['cw', 'ccw'].forEach((direction) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = `Q${q + 1} ${direction === 'cw' ? '顺' : '逆'}`;
          btn.disabled = phase !== 'rotate' || gameOver;
          btn.className = 'rounded border border-purple-700 px-3 py-2 text-sm font-semibold disabled:cursor-not-allowed disabled:opacity-35 enabled:bg-purple-800 enabled:hover:border-emerald-200';
          btn.addEventListener('click', () => rotateQuadrant(q, direction));
          rotationsEl.appendChild(btn);
        });
      }
    }

    function render() {
      turnEl.textContent = playerName(current);
      phaseEl.textContent = phase === 'place' ? '落子' : '旋转';
      roundEl.textContent = round;
      renderBoard();
      renderRotations();
    }

    function placeStone(row, col) {
      if (gameOver || phase !== 'place') return;
      if (board[row][col]) {
        msgEl.textContent = '只能在空格落子。';
        return;
      }
      board[row][col] = current;
      const winner = findWinner();
      if (winner) {
        finish(winner);
        return;
      }
      phase = 'rotate';
      msgEl.textContent = '请选择一个象限旋转。';
      render();
    }

    function rotateQuadrant(index, direction) {
      if (gameOver || phase !== 'rotate') return;
      const origin = quadrantOrigin(index);
      const copy = [];
      for (let r = 0; r < 3; r += 1) {
        copy[r] = [];
        for (let c = 0; c < 3; c += 1) copy[r][c] = board[origin.row + r][origin.col + c];
      }
      for (let r = 0; r < 3; r += 1) {
        for (let c = 0; c < 3; c += 1) {
          const value = direction === 'cw' ? copy[2 - c][r] : copy[c][2 - r];
          board[origin.row + r][origin.col + c] = value;
        }
      }
      const winner = findWinner();
      if (winner) {
        finish(winner);
        return;
      }
      current = current === 'W' ? 'B' : 'W';
      if (current === 'W') round += 1;
      phase = 'place';
      msgEl.textContent = `轮到 ${playerName(current)} 落子。`;
      render();
    }

    function findWinner() {
      const lines = [];
      for (let i = 0; i < size; i += 1) {
        lines.push(board[i]);
        lines.push(board.map((row) => row[i]));
      }
      for (let start = 0; start < size; start += 1) {
        lines.push(diagonal(start, 0, 1, 1));
        lines.push(diagonal(0, start, 1, 1));
        lines.push(diagonal(start, size - 1, 1, -1));
        lines.push(diagonal(0, start, 1, -1));
      }
      for (const line of lines) {
        for (let i = 0; i <= line.length - 5; i += 1) {
          const group = line.slice(i, i + 5);
          if (group[0] && group.every((cell) => cell === group[0])) return group[0];
        }
      }
      if (board.flat().every(Boolean)) return 'draw';
      return '';
    }

    function diagonal(row, col, dr, dc) {
      const cells = [];
      while (row >= 0 && row < size && col >= 0 && col < size) {
        cells.push(board[row][col]);
        row += dr;
        col += dc;
      }
      return cells;
    }

    function finish(winner) {
      gameOver = true;
      msgEl.textContent = winner === 'draw' ? '棋盘已满，平局。' : `${playerName(winner)} 连成五子，赢得本局。`;
      render();
    }

    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
