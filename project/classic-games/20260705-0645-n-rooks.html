<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini N-Rooks</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-semibold tracking-normal">Mini N-Rooks</h1>
        <p class="text-sm text-zinc-400">在 4x4 棋盘放下 4 个车，任意两个车不能同行或同列。</p>
      </div>
      <button id="resetBtn" class="rounded bg-teal-400 px-4 py-2 text-sm font-semibold text-zinc-950 hover:bg-teal-300">重开</button>
    </header>

    <section class="grid grid-cols-3 gap-3">
      <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
        <div class="text-xs uppercase text-zinc-500">已放</div>
        <div id="rookCount" class="text-2xl font-semibold">0</div>
      </div>
      <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
        <div class="text-xs uppercase text-zinc-500">冲突</div>
        <div id="conflictCount" class="text-2xl font-semibold">0</div>
      </div>
      <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
        <div class="text-xs uppercase text-zinc-500">状态</div>
        <div id="stateLabel" class="text-2xl font-semibold">进行</div>
      </div>
    </section>

    <section class="rounded border border-zinc-700 bg-zinc-900 p-4">
      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 class="text-lg font-semibold">棋盘</h2>
        <span id="message" class="text-sm text-teal-300">点击格子放置或撤回。</span>
      </div>
      <div id="board" class="mx-auto grid max-w-md grid-cols-4 gap-2"></div>
    </section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const rookCountEl = document.getElementById("rookCount");
    const conflictCountEl = document.getElementById("conflictCount");
    const stateLabelEl = document.getElementById("stateLabel");
    const messageEl = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    const size = 4;
    let board = [];
    let solved = false;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(false));
      solved = false;
      setMessage("点击格子放置或撤回。");
      render();
    }

    function setMessage(text) {
      messageEl.textContent = text;
    }

    function toggleRook(row, col) {
      if (solved && !board[row][col]) return;
      board[row][col] = !board[row][col];
      const conflicts = getConflicts();
      const count = countRooks();
      if (count === size && conflicts.length === 0) {
        solved = true;
        setMessage("完成：4 个车互不攻击。");
      } else if (conflicts.length > 0) {
        solved = false;
        setMessage("有车同行或同列，调整一下。");
      } else {
        solved = false;
        setMessage(`还需要 ${size - count} 个车。`);
      }
      render();
    }

    function countRooks() {
      return board.flat().filter(Boolean).length;
    }

    function getRooks() {
      const rooks = [];
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          if (board[row][col]) rooks.push({ row, col });
        }
      }
      return rooks;
    }

    function getConflicts() {
      const rooks = getRooks();
      const conflicts = [];
      rooks.forEach((rook, index) => {
        rooks.slice(index + 1).forEach((other) => {
          if (rook.row === other.row || rook.col === other.col) {
            conflicts.push(rook, other);
          }
        });
      });
      return conflicts;
    }

    function isConflict(row, col) {
      return getConflicts().some((cell) => cell.row === row && cell.col === col);
    }

    function renderCell(row, col) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "aspect-square rounded border border-zinc-700 bg-zinc-800 text-4xl font-semibold hover:border-teal-300";
      if ((row + col) % 2 === 0) button.classList.add("bg-zinc-700");
      if (board[row][col]) button.classList.add("text-teal-300");
      if (isConflict(row, col)) button.classList.add("ring-4", "ring-red-400");
      if (solved && board[row][col]) button.classList.add("ring-4", "ring-emerald-300");
      button.textContent = board[row][col] ? "♜" : "";
      button.addEventListener("click", () => toggleRook(row, col));
      return button;
    }

    function render() {
      boardEl.innerHTML = "";
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          boardEl.appendChild(renderCell(row, col));
        }
      }
      rookCountEl.textContent = countRooks();
      conflictCountEl.textContent = getConflicts().length / 2;
      stateLabelEl.textContent = solved ? "完成" : "进行";
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
