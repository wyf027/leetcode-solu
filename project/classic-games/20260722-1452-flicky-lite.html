<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Flicky</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-sky-950 text-sky-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-normal text-yellow-200">Mini Flicky</h1>
        <p class="text-sm text-sky-300">Gather the chicks, keep the line together, and escort them to the exit door.</p>
      </div>
      <div class="flex gap-2 text-sm">
        <div class="rounded border border-sky-700 px-3 py-2">Score <span id="score" class="font-mono text-yellow-200">0</span></div>
        <div class="rounded border border-sky-700 px-3 py-2">Lives <span id="lives" class="font-mono text-rose-200">3</span></div>
        <div class="rounded border border-sky-700 px-3 py-2">Chicks <span id="left" class="font-mono text-lime-200">0</span></div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_15rem]">
      <canvas id="game" width="720" height="520" class="aspect-[18/13] w-full rounded border border-sky-800 bg-black"></canvas>
      <aside class="space-y-3 text-sm text-sky-100">
        <div class="rounded border border-sky-800 bg-sky-900/70 p-3">
          <div class="mb-2 font-semibold text-white">Controls</div>
          <p>Arrow keys or A/D run. Space, W, or Up jumps. Collect chicks, then touch the green door. Tap left or right side to run on touch screens.</p>
        </div>
        <button id="start" class="w-full rounded bg-yellow-300 px-4 py-2 font-semibold text-sky-950 hover:bg-yellow-200">Start</button>
        <div id="message" class="rounded border border-sky-800 bg-sky-900/70 p-3 text-sky-50">Press Start to rescue the chicks.</div>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const leftEl = document.getElementById("left");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("start");
    const keys = new Set();

    const platforms = [
      { x: 20, y: 462, w: 680, h: 18 },
      { x: 70, y: 366, w: 225, h: 16 },
      { x: 398, y: 366, w: 245, h: 16 },
      { x: 155, y: 268, w: 250, h: 16 },
      { x: 465, y: 178, w: 185, h: 16 },
      { x: 40, y: 174, w: 175, h: 16 }
    ];

    const startState = { x: 72, y: 424 };
    const player = { x: startState.x, y: startState.y, vx: 0, vy: 0, w: 26, h: 32, facing: 1, grounded: false };
    let chicks = [];
    let enemies = [];
    let score = 0;
    let lives = 3;
    let running = false;
    let lastTime = 0;
    let invulnerable = 0;

    function resetActors() {
      player.x = startState.x;
      player.y = startState.y;
      player.vx = 0;
      player.vy = 0;
      player.facing = 1;
      player.grounded = false;
      chicks = [
        { x: 118, y: 330, rescued: false, trailing: false },
        { x: 226, y: 232, rescued: false, trailing: false },
        { x: 526, y: 140, rescued: false, trailing: false },
        { x: 576, y: 330, rescued: false, trailing: false },
        { x: 88, y: 138, rescued: false, trailing: false }
      ];
      enemies = [
        { x: 620, y: 430, vx: -95, w: 30, h: 24, min: 445, max: 670 },
        { x: 110, y: 334, vx: 75, w: 30, h: 24, min: 75, max: 290 },
        { x: 425, y: 334, vx: 88, w: 30, h: 24, min: 405, max: 640 }
      ];
    }

    function reset() {
      resetActors();
      score = 0;
      lives = 3;
      running = true;
      invulnerable = 0;
      messageEl.textContent = "Collect chicks, then lead them into the door.";
      syncHud();
    }

    function syncHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      leftEl.textContent = chicks.filter((chick) => !chick.rescued).length;
    }

    function overlap(a, b) {
      return Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
    }

    function platformAt(entity) {
      return platforms.find((p) =>
        entity.x + entity.w / 2 > p.x &&
        entity.x - entity.w / 2 < p.x + p.w &&
        entity.y + entity.h / 2 <= p.y + 16 &&
        entity.y + entity.h / 2 >= p.y - 12 &&
        entity.vy >= 0
      );
    }

    function rescueLine() {
      const trailing = chicks.filter((chick) => chick.trailing && !chick.rescued);
      if (trailing.length === 0) return;
      for (const chick of trailing) {
        chick.rescued = true;
        chick.trailing = false;
      }
      score += trailing.length * 200 + (trailing.length > 1 ? 150 : 0);
      if (chicks.every((chick) => chick.rescued)) {
        running = false;
        messageEl.textContent = `All chicks home. Final score: ${score}.`;
      } else {
        messageEl.textContent = `${trailing.length} chick${trailing.length > 1 ? "s" : ""} rescued. Keep going.`;
      }
      syncHud();
    }

    function loseLife() {
      if (invulnerable > 0) return;
      lives -= 1;
      invulnerable = 1.2;
      for (const chick of chicks) chick.trailing = false;
      player.x = startState.x;
      player.y = startState.y;
      player.vx = 0;
      player.vy = 0;
      if (lives <= 0) {
        running = false;
        messageEl.textContent = `Caught by the cats. Final score: ${score}.`;
      } else {
        messageEl.textContent = "Caught. The chicks scattered.";
      }
      syncHud();
    }

    function updatePlayer(dt) {
      const left = keys.has("ArrowLeft") || keys.has("a");
      const right = keys.has("ArrowRight") || keys.has("d");
      if (left) {
        player.vx = -180;
        player.facing = -1;
      } else if (right) {
        player.vx = 180;
        player.facing = 1;
      } else {
        player.vx *= 0.82;
      }
      if ((keys.has(" ") || keys.has("ArrowUp") || keys.has("w")) && player.grounded) {
        player.vy = -360;
        player.grounded = false;
      }
      player.vy += 720 * dt;
      player.x = Math.max(18, Math.min(canvas.width - 18, player.x + player.vx * dt));
      player.y += player.vy * dt;
      player.grounded = false;
      const floor = platformAt(player);
      if (floor) {
        player.y = floor.y - player.h / 2;
        player.vy = 0;
        player.grounded = true;
      }
      if (player.y > canvas.height + 30) loseLife();
    }

    function updateChicks(dt) {
      const line = chicks.filter((chick) => chick.trailing && !chick.rescued);
      for (const chick of chicks) {
        if (chick.rescued) continue;
        if (!chick.trailing && Math.hypot(player.x - chick.x, player.y - chick.y) < 34) {
          chick.trailing = true;
          score += 75;
          syncHud();
        }
      }
      line.forEach((chick, index) => {
        const target = index === 0 ? player : line[index - 1];
        const gap = 28;
        const dx = target.x - chick.x;
        const dy = target.y - chick.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        if (distance > gap) {
          chick.x += (dx / distance) * 145 * dt;
          chick.y += (dy / distance) * 145 * dt;
        }
      });
    }

    function updateEnemies(dt) {
      for (const enemy of enemies) {
        enemy.x += enemy.vx * dt;
        if (enemy.x < enemy.min || enemy.x > enemy.max) {
          enemy.vx *= -1;
          enemy.x = Math.max(enemy.min, Math.min(enemy.max, enemy.x));
        }
        if (overlap(player, enemy)) loseLife();
      }
    }

    function update(dt) {
      if (!running) return;
      invulnerable = Math.max(0, invulnerable - dt);
      updatePlayer(dt);
      updateChicks(dt);
      updateEnemies(dt);
      if (player.x > 666 && player.y > 390) rescueLine();
    }

    function drawStage() {
      ctx.fillStyle = "#082f49";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(186, 230, 253, 0.2)";
      for (let i = 0; i < 24; i++) {
        const x = (i * 83) % canvas.width;
        const y = (i * 47) % 150;
        ctx.fillRect(x, y, 20, 3);
      }
      for (const p of platforms) {
        ctx.fillStyle = "#0f766e";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#5eead4";
        ctx.fillRect(p.x, p.y, p.w, 4);
      }
      ctx.fillStyle = "#16a34a";
      ctx.fillRect(668, 392, 34, 70);
      ctx.fillStyle = "#bbf7d0";
      ctx.fillRect(680, 410, 6, 20);
    }

    function drawPlayer() {
      if (invulnerable > 0 && Math.floor(invulnerable * 12) % 2 === 0) return;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(player.facing, 1);
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.arc(0, -8, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f97316";
      ctx.fillRect(-10, 4, 20, 18);
      ctx.fillStyle = "#0f172a";
      ctx.fillRect(4, -12, 4, 4);
      ctx.restore();
    }

    function drawChicks() {
      for (const chick of chicks) {
        if (chick.rescued) continue;
        ctx.fillStyle = chick.trailing ? "#fde047" : "#fef3c7";
        ctx.beginPath();
        ctx.arc(chick.x, chick.y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fb923c";
        ctx.beginPath();
        ctx.moveTo(chick.x + 8, chick.y - 2);
        ctx.lineTo(chick.x + 17, chick.y + 2);
        ctx.lineTo(chick.x + 8, chick.y + 5);
        ctx.fill();
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.fillStyle = "#f43f5e";
        ctx.beginPath();
        ctx.roundRect(enemy.x - enemy.w / 2, enemy.y - enemy.h / 2, enemy.w, enemy.h, 8);
        ctx.fill();
        ctx.fillStyle = "#fecdd3";
        ctx.fillRect(enemy.x - 9, enemy.y - 15, 6, 9);
        ctx.fillRect(enemy.x + 3, enemy.y - 15, 6, 9);
      }
    }

    function drawOverlay() {
      if (running) return;
      ctx.fillStyle = "rgba(8, 47, 73, 0.74)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#fef9c3";
      ctx.font = "bold 34px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Mini Flicky", canvas.width / 2, canvas.height / 2 - 16);
      ctx.font = "18px system-ui, sans-serif";
      ctx.fillText("Press Start", canvas.width / 2, canvas.height / 2 + 22);
    }

    function draw() {
      drawStage();
      drawChicks();
      drawEnemies();
      drawPlayer();
      drawOverlay();
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    startBtn.addEventListener("click", reset);
    window.addEventListener("keydown", (event) => {
      if (["ArrowLeft", "ArrowRight", "ArrowUp", " ", "a", "d", "w"].includes(event.key)) event.preventDefault();
      keys.add(event.key);
    });
    window.addEventListener("keyup", (event) => keys.delete(event.key));
    canvas.addEventListener("pointerdown", (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      if (x < rect.width * 0.42) {
        keys.add("ArrowLeft");
        setTimeout(() => keys.delete("ArrowLeft"), 180);
      } else if (x > rect.width * 0.58) {
        keys.add("ArrowRight");
        setTimeout(() => keys.delete("ArrowRight"), 180);
      } else {
        keys.add(" ");
        setTimeout(() => keys.delete(" "), 120);
      }
    });

    resetActors();
    syncHud();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
