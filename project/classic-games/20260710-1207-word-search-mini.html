<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Word Search</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-violet-950 text-violet-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-violet-700 bg-violet-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-amber-200">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Word Search</h1>
        </div>
        <button id="resetBtn" class="rounded bg-amber-200 px-4 py-2 font-semibold text-violet-950 hover:bg-amber-100">
          Reset
        </button>
      </div>

      <div class="mb-5 grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-violet-700 bg-violet-800 p-4">
          <p class="text-sm text-violet-200">Found</p>
          <p id="foundCount" class="text-3xl font-bold">0 / 5</p>
        </div>
        <div class="rounded border border-violet-700 bg-violet-800 p-4">
          <p class="text-sm text-violet-200">Current</p>
          <p id="currentWord" class="text-3xl font-bold tracking-widest">-</p>
        </div>
        <div class="rounded border border-violet-700 bg-violet-800 p-4">
          <p class="text-sm text-violet-200">Grid</p>
          <p class="text-3xl font-bold">5 x 5</p>
        </div>
      </div>

      <div id="board" class="mx-auto grid max-w-md grid-cols-5 gap-2 rounded-lg bg-violet-950 p-3"></div>

      <div class="mt-5">
        <p class="mb-2 text-sm text-violet-200">Targets</p>
        <div id="targetList" class="flex flex-wrap gap-2"></div>
      </div>

      <p id="statusText" class="mt-5 min-h-6 rounded border border-violet-700 bg-violet-950 p-3 font-semibold">
        Click adjacent letters to build a target word.
      </p>
    </section>
  </main>

  <script>
    const letters = [
      ["C", "O", "D", "E", "R"],
      ["A", "R", "C", "A", "D"],
      ["G", "A", "M", "E", "S"],
      ["L", "O", "G", "I", "C"],
      ["P", "L", "A", "Y", "S"]
    ];
    const targets = ["CODE", "GAME", "LOGIC", "PLAY", "ARC"];
    const found = new Set();
    let path = [];

    const board = document.getElementById("board");
    const targetList = document.getElementById("targetList");
    const foundCount = document.getElementById("foundCount");
    const currentWord = document.getElementById("currentWord");
    const statusText = document.getElementById("statusText");
    const resetBtn = document.getElementById("resetBtn");

    function wordFromPath() {
      return path.map(({ row, col }) => letters[row][col]).join("");
    }

    function isAdjacent(a, b) {
      return Math.max(Math.abs(a.row - b.row), Math.abs(a.col - b.col)) <= 1;
    }

    function pathContains(row, col) {
      return path.some((cell) => cell.row === row && cell.col === col);
    }

    function renderTargets() {
      targetList.innerHTML = "";
      targets.forEach((word) => {
        const tag = document.createElement("span");
        tag.className = `rounded px-3 py-2 font-mono text-sm tracking-widest ${found.has(word) ? "bg-emerald-300 text-violet-950" : "bg-violet-800 text-violet-100"}`;
        tag.textContent = word;
        targetList.appendChild(tag);
      });
    }

    function renderBoard() {
      board.innerHTML = "";
      letters.forEach((rowLetters, row) => {
        rowLetters.forEach((letter, col) => {
          const button = document.createElement("button");
          const selected = pathContains(row, col);
          button.className = `aspect-square rounded text-2xl font-bold transition ${selected ? "bg-amber-200 text-violet-950" : "bg-violet-800 hover:bg-violet-700"}`;
          button.dataset.row = String(row);
          button.dataset.col = String(col);
          button.textContent = letter;
          board.appendChild(button);
        });
      });
      currentWord.textContent = wordFromPath() || "-";
      foundCount.textContent = `${found.size} / ${targets.length}`;
      renderTargets();
    }

    function clearPath(message) {
      path = [];
      statusText.textContent = message;
      renderBoard();
    }

    function selectCell(row, col) {
      const next = { row, col };
      if (pathContains(row, col)) {
        clearPath("Selection cleared. Start a new word.");
        return;
      }
      if (path.length && !isAdjacent(path[path.length - 1], next)) {
        clearPath("Letters must be adjacent. Start again.");
        return;
      }

      path.push(next);
      const word = wordFromPath();
      if (targets.includes(word) && !found.has(word)) {
        found.add(word);
        clearPath(`Found ${word}.`);
        if (found.size === targets.length) {
          statusText.textContent = "All words found.";
        }
        return;
      }
      if (!targets.some((target) => target.startsWith(word))) {
        clearPath(`${word} is not on the target list.`);
        return;
      }
      statusText.textContent = "Keep building the word.";
      renderBoard();
    }

    function resetGame() {
      found.clear();
      path = [];
      statusText.textContent = "Click adjacent letters to build a target word.";
      renderBoard();
    }

    board.addEventListener("click", (event) => {
      const button = event.target.closest("[data-row]");
      if (!button) return;
      selectCell(Number(button.dataset.row), Number(button.dataset.col));
    });

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
