<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Pig Dice</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-violet-950 text-violet-50"><main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Pig Dice</h1><p class="text-sm text-violet-200">Roll to build a turn score. Roll 1 and lose the turn; hold to bank points.</p></div><button id="newGameBtn" class="rounded bg-lime-300 px-4 py-2 font-semibold text-violet-950 hover:bg-lime-200">New Game</button></header><section class="grid gap-3 rounded border border-violet-700 bg-violet-900 p-3 sm:grid-cols-3"><div>Turn: <b id="turnLabel">Player 1</b></div><div>Turn score: <b id="turnScore">0</b></div><div id="message">Roll or hold. First to 50 wins.</div></section><section class="grid gap-3 sm:grid-cols-2"><div class="rounded border border-violet-700 bg-violet-900 p-4 text-center"><div class="text-sm text-violet-200">Player 1</div><div id="p0Score" class="text-5xl font-bold">0</div></div><div class="rounded border border-violet-700 bg-violet-900 p-4 text-center"><div class="text-sm text-violet-200">Player 2</div><div id="p1Score" class="text-5xl font-bold">0</div></div></section><section class="flex flex-col items-center gap-4 rounded border border-violet-700 bg-violet-900 p-6"><div id="die" class="flex h-24 w-24 items-center justify-center rounded-2xl bg-white text-5xl font-bold text-violet-950">-</div><div class="flex gap-3"><button id="rollBtn" class="rounded bg-sky-300 px-5 py-2 font-semibold text-violet-950 hover:bg-sky-200">Roll</button><button id="holdBtn" class="rounded bg-amber-300 px-5 py-2 font-semibold text-violet-950 hover:bg-amber-200">Hold</button></div></section></main><script>
let scores,turn,total,over;const target=50,el=id=>document.getElementById(id),turnLabel=el('turnLabel'),turnScore=el('turnScore'),message=el('message'),die=el('die'),rollBtn=el('rollBtn'),holdBtn=el('holdBtn'),newGameBtn=el('newGameBtn');function render(){turnLabel.textContent=over?'Game Over':`Player ${turn+1}`;turnScore.textContent=total;el('p0Score').textContent=scores[0];el('p1Score').textContent=scores[1];rollBtn.disabled=holdBtn.disabled=over;rollBtn.classList.toggle('opacity-50',over);holdBtn.classList.toggle('opacity-50',over)}function nextTurn(){turn=1-turn;total=0;message.textContent=`Player ${turn+1}, roll or hold.`;render()}function rollDie(){if(over)return;const n=1+Math.floor(Math.random()*6);die.textContent=n;if(n===1){total=0;message.textContent='Rolled 1. Turn lost.';nextTurn()}else{total+=n;message.textContent=`Rolled ${n}. Keep rolling or hold.`;render()}}function holdTurn(){if(over)return;scores[turn]+=total;if(scores[turn]>=target){message.textContent=`Player ${turn+1} wins with ${scores[turn]} points.`;over=true;render();return}nextTurn()}function newGame(){scores=[0,0];turn=0;total=0;over=false;die.textContent='-';message.textContent='Roll or hold. First to 50 wins.';render()}rollBtn.addEventListener('click',rollDie);holdBtn.addEventListener('click',holdTurn);newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
