<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Paperboy</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-emerald-950 text-emerald-50">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-4 p-4">
      <section class="w-full rounded-lg border border-emerald-700 bg-emerald-900/80 p-4 shadow-xl">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold">Mini Paperboy</h1>
            <p class="text-sm text-emerald-200">方向键或 W/S 移动，空格投递报纸。</p>
          </div>
          <div class="flex gap-3 text-sm">
            <span>得分 <strong id="score">0</strong></span>
            <span>生命 <strong id="lives">3</strong></span>
            <span>投递 <strong id="delivered">0</strong>/5</span>
          </div>
        </div>

        <canvas
          id="game"
          width="480"
          height="420"
          class="w-full rounded-md border border-emerald-600 bg-slate-900"
        ></canvas>

        <div class="mt-3 grid grid-cols-3 gap-2">
          <button id="upBtn" class="rounded bg-emerald-600 px-3 py-2 font-semibold hover:bg-emerald-500">上移</button>
          <button id="throwBtn" class="rounded bg-amber-500 px-3 py-2 font-semibold text-slate-950 hover:bg-amber-400">
            投递
          </button>
          <button id="downBtn" class="rounded bg-emerald-600 px-3 py-2 font-semibold hover:bg-emerald-500">下移</button>
        </div>
        <button id="restartBtn" class="mt-2 w-full rounded bg-slate-100 px-3 py-2 font-semibold text-slate-950 hover:bg-white">
          重新开始
        </button>
      </section>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const deliveredEl = document.getElementById("delivered");
      const lanes = [76, 136, 196, 256, 316];
      const keys = new Set();
      let player;
      let papers;
      let obstacles;
      let mailboxes;
      let score;
      let lives;
      let delivered;
      let frame;
      let running;
      let message;

      function resetGame() {
        player = { x: 56, y: lanes[2], w: 34, h: 24, cooldown: 0 };
        papers = [];
        obstacles = [];
        mailboxes = lanes.map((y, index) => ({ x: 405, y, hit: false, index }));
        score = 0;
        lives = 3;
        delivered = 0;
        frame = 0;
        running = true;
        message = "";
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        deliveredEl.textContent = delivered;
      }

      function throwPaper() {
        if (!running || player.cooldown > 0) return;
        papers.push({ x: player.x + player.w, y: player.y + 4, r: 5, vx: 5.4 });
        player.cooldown = 18;
      }

      function updatePlayer() {
        if (keys.has("ArrowUp") || keys.has("w")) player.y -= 4;
        if (keys.has("ArrowDown") || keys.has("s")) player.y += 4;
        player.y = Math.max(46, Math.min(canvas.height - 60, player.y));
        if (player.cooldown > 0) player.cooldown -= 1;
      }

      function spawnObstacle() {
        if (frame % 78 !== 0) return;
        const y = lanes[Math.floor(Math.random() * lanes.length)] + 2;
        obstacles.push({ x: canvas.width + 20, y, w: 24, h: 22, vx: 2.8 + Math.random() * 1.3 });
      }

      function updatePapers() {
        papers.forEach((paper) => {
          paper.x += paper.vx;
        });
        papers = papers.filter((paper) => paper.x < canvas.width + 20);
      }

      function updateObstacles() {
        spawnObstacle();
        obstacles.forEach((obstacle) => {
          obstacle.x -= obstacle.vx;
        });
        obstacles = obstacles.filter((obstacle) => obstacle.x > -40);
      }

      function rectanglesOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function checkCollisions() {
        obstacles.forEach((obstacle) => {
          if (obstacle.hit) return;
          if (rectanglesOverlap(player, obstacle)) {
            obstacle.hit = true;
            lives -= 1;
            score = Math.max(0, score - 10);
            if (lives <= 0) {
              running = false;
              message = "路线结束";
            }
          }
        });

        papers.forEach((paper) => {
          mailboxes.forEach((box) => {
            if (box.hit) return;
            const dx = paper.x - (box.x + 8);
            const dy = paper.y - box.y;
            if (Math.hypot(dx, dy) < 18) {
              box.hit = true;
              paper.hit = true;
              delivered += 1;
              score += 25;
            }
          });
        });
        papers = papers.filter((paper) => !paper.hit);

        if (delivered === mailboxes.length) {
          running = false;
          message = "完美投递";
          score += 50;
        }
        updateHud();
      }

      function renderRoute() {
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#064e3b";
        ctx.fillRect(0, 0, canvas.width, 38);
        ctx.fillRect(0, canvas.height - 42, canvas.width, 42);

        ctx.strokeStyle = "#475569";
        ctx.lineWidth = 2;
        lanes.forEach((y) => {
          ctx.setLineDash([12, 14]);
          ctx.beginPath();
          ctx.moveTo(16, y + 18);
          ctx.lineTo(canvas.width - 20, y + 18);
          ctx.stroke();
        });
        ctx.setLineDash([]);

        mailboxes.forEach((box) => {
          ctx.fillStyle = box.hit ? "#22c55e" : "#fbbf24";
          ctx.fillRect(box.x, box.y - 16, 28, 20);
          ctx.fillStyle = "#94a3b8";
          ctx.fillRect(box.x + 12, box.y + 4, 4, 22);
          ctx.fillStyle = "#0f172a";
          ctx.fillRect(box.x + 20, box.y - 10, 4, 6);
        });

        obstacles.forEach((obstacle) => {
          ctx.fillStyle = obstacle.hit ? "#64748b" : "#fb7185";
          ctx.fillRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
          ctx.fillStyle = "#fecdd3";
          ctx.fillRect(obstacle.x + 7, obstacle.y + 5, 10, 5);
        });

        papers.forEach((paper) => {
          ctx.fillStyle = "#f8fafc";
          ctx.beginPath();
          ctx.arc(paper.x, paper.y, paper.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(player.x, player.y, player.w, player.h);
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(player.x + 21, player.y + 5, 7, 5);
        ctx.strokeStyle = "#f8fafc";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(player.x + 8, player.y + 25, 7, 0, Math.PI * 2);
        ctx.arc(player.x + 28, player.y + 25, 7, 0, Math.PI * 2);
        ctx.stroke();

        if (message) {
          ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
          ctx.fillRect(70, 155, 340, 90);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "700 28px system-ui";
          ctx.textAlign = "center";
          ctx.fillText(message, canvas.width / 2, 202);
          ctx.font = "14px system-ui";
          ctx.fillText("点击重新开始再跑一趟", canvas.width / 2, 226);
          ctx.textAlign = "start";
        }
      }

      function gameLoop() {
        frame += 1;
        if (running) {
          updatePlayer();
          updatePapers();
          updateObstacles();
          checkCollisions();
        }
        renderRoute();
        requestAnimationFrame(gameLoop);
      }

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["arrowup", "arrowdown", " ", "w", "s"].includes(key)) event.preventDefault();
        if (event.key === " ") throwPaper();
        keys.add(key === "arrowup" || key === "arrowdown" ? event.key : key);
      });

      document.addEventListener("keyup", (event) => {
        keys.delete(event.key);
        keys.delete(event.key.toLowerCase());
      });

      document.getElementById("upBtn").addEventListener("pointerdown", () => keys.add("ArrowUp"));
      document.getElementById("upBtn").addEventListener("pointerup", () => keys.delete("ArrowUp"));
      document.getElementById("downBtn").addEventListener("pointerdown", () => keys.add("ArrowDown"));
      document.getElementById("downBtn").addEventListener("pointerup", () => keys.delete("ArrowDown"));
      document.getElementById("throwBtn").addEventListener("click", throwPaper);
      document.getElementById("restartBtn").addEventListener("click", resetGame);

      resetGame();
      gameLoop();
    </script>
  </body>
</html>
