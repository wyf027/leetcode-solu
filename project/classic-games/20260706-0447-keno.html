<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Keno</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-slate-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-fuchsia-300">Classic Games</p>
          <h1 class="mt-1 text-3xl font-bold">Mini Keno</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-slate-800 bg-slate-900 px-4 py-2">
            <div id="bank" class="text-xl font-bold text-emerald-200">0</div>
            <div class="text-slate-400">bank</div>
          </div>
          <div class="rounded border border-slate-800 bg-slate-900 px-4 py-2">
            <div id="pickedCount" class="text-xl font-bold text-fuchsia-200">0/6</div>
            <div class="text-slate-400">picked</div>
          </div>
          <div class="rounded border border-slate-800 bg-slate-900 px-4 py-2">
            <div id="hitCount" class="text-xl font-bold text-amber-200">0</div>
            <div class="text-slate-400">hits</div>
          </div>
        </div>
      </header>

      <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
        <div class="rounded border border-slate-800 bg-slate-900 p-4">
          <div id="numberGrid" class="grid grid-cols-5 gap-2 sm:grid-cols-10"></div>
          <p id="status" class="mt-4 min-h-6 text-sm font-medium text-slate-300">Pick up to six numbers, then draw.</p>
        </div>

        <aside class="rounded border border-slate-800 bg-slate-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-slate-400">Drawn Numbers</h2>
          <div id="drawnList" class="mt-3 flex min-h-24 flex-wrap gap-2"></div>
          <div class="mt-5 grid gap-3">
            <button id="drawBtn" class="rounded bg-fuchsia-400 px-4 py-2 font-semibold text-slate-950 hover:bg-fuchsia-300">Draw</button>
            <button id="quickPickBtn" class="rounded border border-slate-700 px-4 py-2 font-semibold hover:bg-slate-800">Quick Pick</button>
            <button id="clearBtn" class="rounded border border-slate-700 px-4 py-2 font-semibold hover:bg-slate-800">Clear</button>
          </div>
          <p class="mt-5 text-sm leading-6 text-slate-400">
            Pick six numbers from 1 to 20. Eight numbers are drawn. More hits pay a larger score.
          </p>
        </aside>
      </section>
    </main>

    <script>
      const maxPick = 6;
      const drawSize = 8;
      const payout = [0, 0, 2, 6, 18, 60, 180];

      const numberGrid = document.getElementById("numberGrid");
      const drawnList = document.getElementById("drawnList");
      const bankEl = document.getElementById("bank");
      const pickedCountEl = document.getElementById("pickedCount");
      const hitCountEl = document.getElementById("hitCount");
      const statusEl = document.getElementById("status");
      const drawBtn = document.getElementById("drawBtn");
      const quickPickBtn = document.getElementById("quickPickBtn");
      const clearBtn = document.getElementById("clearBtn");

      let picked = new Set();
      let drawn = new Set();
      let bank = 0;

      function randomNumbers(count, max) {
        const numbers = [];
        while (numbers.length < count) {
          const value = Math.ceil(Math.random() * max);
          if (!numbers.includes(value)) numbers.push(value);
        }
        return numbers.sort((a, b) => a - b);
      }

      function countHits() {
        return [...picked].filter((value) => drawn.has(value)).length;
      }

      function togglePick(value) {
        if (drawn.size) {
          drawn.clear();
        }
        if (picked.has(value)) {
          picked.delete(value);
        } else if (picked.size < maxPick) {
          picked.add(value);
        } else {
          statusEl.textContent = "Six picks maximum.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-amber-300";
        }
        render();
      }

      function drawGame() {
        if (!picked.size) {
          statusEl.textContent = "Pick at least one number.";
          statusEl.className = "mt-4 min-h-6 text-sm font-medium text-amber-300";
          return;
        }
        drawn = new Set(randomNumbers(drawSize, 20));
        const hits = countHits();
        bank += payout[hits] || 0;
        statusEl.textContent = `${hits} hit${hits === 1 ? "" : "s"} paid ${payout[hits] || 0}.`;
        statusEl.className = hits >= 3
          ? "mt-4 min-h-6 text-sm font-medium text-emerald-300"
          : "mt-4 min-h-6 text-sm font-medium text-slate-300";
        render();
      }

      function quickPick() {
        picked = new Set(randomNumbers(maxPick, 20));
        drawn.clear();
        statusEl.textContent = "Quick pick ready.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-fuchsia-300";
        render();
      }

      function clearGame() {
        picked.clear();
        drawn.clear();
        statusEl.textContent = "Pick up to six numbers, then draw.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-slate-300";
        render();
      }

      function renderGrid() {
        numberGrid.innerHTML = "";
        for (let value = 1; value <= 20; value += 1) {
          const isPicked = picked.has(value);
          const isDrawn = drawn.has(value);
          const isHit = isPicked && isDrawn;
          const button = document.createElement("button");
          button.type = "button";
          button.className = [
            "aspect-square rounded border text-lg font-bold transition",
            isHit ? "border-emerald-200 bg-emerald-400 text-slate-950" : "",
            !isHit && isPicked ? "border-fuchsia-200 bg-fuchsia-400 text-slate-950" : "",
            !isHit && !isPicked && isDrawn ? "border-amber-200 bg-amber-300 text-slate-950" : "",
            !isHit && !isPicked && !isDrawn ? "border-slate-700 bg-slate-950 hover:bg-slate-800" : "",
          ].join(" ");
          button.textContent = value;
          button.addEventListener("click", () => togglePick(value));
          numberGrid.appendChild(button);
        }
      }

      function renderDrawn() {
        drawnList.innerHTML = drawn.size
          ? [...drawn].map((value) => `<span class="flex h-9 w-9 items-center justify-center rounded-full bg-amber-300 font-bold text-slate-950">${value}</span>`).join("")
          : '<span class="text-sm text-slate-500">No draw yet.</span>';
      }

      function render() {
        renderGrid();
        renderDrawn();
        bankEl.textContent = bank;
        pickedCountEl.textContent = `${picked.size}/${maxPick}`;
        hitCountEl.textContent = countHits();
      }

      drawBtn.addEventListener("click", drawGame);
      quickPickBtn.addEventListener("click", quickPick);
      clearBtn.addEventListener("click", clearGame);
      render();
    </script>
  </body>
</html>
