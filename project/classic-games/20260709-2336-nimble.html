<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Nimble</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Nimble</h1>
        <p class="text-sm text-indigo-200">Move one coin left to an empty square. The player with no legal move loses.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-indigo-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-indigo-700 bg-indigo-900 p-3 sm:grid-cols-3">
      <div>Turn: <b id="turnText">You</b></div>
      <div>Moves: <b id="moveCount">0</b></div>
      <div id="message">Choose a coin.</div>
    </section>

    <section id="board" class="grid grid-cols-12 gap-1 rounded border border-indigo-700 bg-indigo-900 p-3"></section>

    <section class="rounded border border-indigo-700 bg-indigo-900 p-3 text-sm text-indigo-100">
      Pick a coin, then pick an empty square to its left. A coin cannot move past another coin.
    </section>
  </main>

  <script>
    const size = 12;
    const el = (id) => document.getElementById(id);
    const boardEl = el("board");
    const turnText = el("turnText");
    const moveCount = el("moveCount");
    const message = el("message");
    const newGameBtn = el("newGameBtn");

    let board;
    let selected;
    let playerTurn;
    let moves;
    let finished;

    function legalTargets(index) {
      const targets = [];
      for (let i = index - 1; i >= 0; i -= 1) {
        if (board[i]) break;
        targets.push(i);
      }
      return targets;
    }

    function hasLegalMove() {
      return board.some((coin, index) => coin && legalTargets(index).length > 0);
    }

    function chooseSquare(index) {
      if (finished) return;
      if (board[index]) {
        selected = index;
        message.textContent = "Choose an empty square to the left.";
        render();
        return;
      }
      if (selected === null) {
        message.textContent = "Choose a coin first.";
        return;
      }
      if (!legalTargets(selected).includes(index)) {
        message.textContent = "That coin cannot move there.";
        return;
      }
      moveCoin(selected, index);
      if (!finished) setTimeout(computerMove, 400);
    }

    function moveCoin(from, to) {
      board[to] = true;
      board[from] = false;
      selected = null;
      moves += 1;
      playerTurn = !playerTurn;
      if (!hasLegalMove()) {
        finished = true;
        message.textContent = playerTurn ? "You have no move. Computer wins." : "Computer has no move. You win.";
      } else {
        message.textContent = playerTurn ? "Choose a coin." : "Computer is thinking.";
      }
      render();
    }

    function computerMove() {
      if (finished || playerTurn) return;
      const options = [];
      board.forEach((coin, index) => {
        if (!coin) return;
        legalTargets(index).forEach((target) => options.push({ from: index, to: target }));
      });
      if (!options.length) {
        finished = true;
        message.textContent = "Computer has no move. You win.";
        render();
        return;
      }
      options.sort((a, b) => a.to - b.to);
      moveCoin(options[0].from, options[0].to);
    }

    function render() {
      const targets = selected === null ? [] : legalTargets(selected);
      boardEl.innerHTML = board.map((coin, index) => {
        const isSelected = selected === index;
        const isTarget = targets.includes(index);
        const label = coin ? "●" : index;
        const classes = coin
          ? isSelected ? "bg-amber-200 text-indigo-950" : "bg-white text-indigo-950"
          : isTarget ? "bg-lime-300 text-indigo-950" : "bg-indigo-800 text-indigo-100";
        return `<button data-index="${index}" class="aspect-square rounded border border-indigo-700 text-lg font-bold ${classes}" ${(!playerTurn || finished) ? "disabled" : ""}>${label}</button>`;
      }).join("");
      boardEl.querySelectorAll("[data-index]").forEach((button) => {
        button.addEventListener("click", () => chooseSquare(Number(button.dataset.index)));
      });
      turnText.textContent = finished ? "Done" : playerTurn ? "You" : "Computer";
      moveCount.textContent = moves;
    }

    function newGame() {
      board = Array(size).fill(false);
      [3, 5, 8, 11].forEach((index) => {
        board[index] = true;
      });
      selected = null;
      playerTurn = true;
      moves = 0;
      finished = false;
      message.textContent = "Choose a coin.";
      render();
    }

    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
