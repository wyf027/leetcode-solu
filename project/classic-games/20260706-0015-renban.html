<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Renban</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-4xl flex-col justify-center gap-5 px-4 py-8">
    <section class="grid gap-4 md:grid-cols-[1fr_280px] md:items-start">
      <div class="rounded-lg border border-stone-700 bg-stone-900 p-4 shadow-2xl">
        <div class="mb-4 flex items-center justify-between gap-3">
          <div>
            <h1 class="text-2xl font-semibold tracking-normal">Mini Renban</h1>
            <p class="text-sm text-stone-400">填入 1-4，让行列不重复，彩色线数字连续。</p>
          </div>
          <button id="resetBtn" class="rounded-md bg-fuchsia-400 px-3 py-2 text-sm font-semibold text-fuchsia-950 hover:bg-fuchsia-300">重开</button>
        </div>
        <div id="board" class="mx-auto grid w-full max-w-[420px] grid-cols-4 gap-2 rounded-lg bg-stone-800 p-2"></div>
      </div>
      <aside class="rounded-lg border border-stone-700 bg-stone-900 p-4">
        <h2 class="mb-3 text-lg font-semibold">状态</h2>
        <div class="space-y-3 text-sm">
          <p id="latinStatus" class="rounded-md bg-stone-800 p-3 text-stone-200"></p>
          <p id="lineStatus" class="rounded-md bg-stone-800 p-3 text-stone-200"></p>
          <p id="winStatus" class="rounded-md bg-stone-800 p-3 font-semibold text-stone-200"></p>
        </div>
        <div class="mt-4 space-y-2 text-xs leading-5 text-stone-400">
          <p>点击空格循环 1-4。</p>
          <p>同色线上的已填数字不能重复；填满后必须刚好是连续数字。</p>
          <p>每行每列都要包含 1、2、3、4。</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 4;
    const solution = [
      [1, 2, 3, 4],
      [3, 4, 1, 2],
      [2, 1, 4, 3],
      [4, 3, 2, 1]
    ];
    const givens = {
      "0,0": 1,
      "0,3": 4,
      "1,2": 1,
      "2,1": 1,
      "3,0": 4
    };
    const renbanLines = [
      { name: "粉线", color: "ring-fuchsia-400", cells: [[0, 0], [0, 1], [0, 2]] },
      { name: "青线", color: "ring-cyan-400", cells: [[1, 2], [1, 3], [2, 3]] },
      { name: "橙线", color: "ring-orange-400", cells: [[1, 0], [1, 1], [2, 0]] },
      { name: "绿线", color: "ring-lime-400", cells: [[3, 1], [3, 2], [3, 3]] }
    ];
    const values = Array.from({ length: size }, (_, row) =>
      Array.from({ length: size }, (_, col) => givens[`${row},${col}`] || 0)
    );
    const board = document.getElementById("board");
    const latinStatus = document.getElementById("latinStatus");
    const lineStatus = document.getElementById("lineStatus");
    const winStatus = document.getElementById("winStatus");
    const resetBtn = document.getElementById("resetBtn");
    const cells = new Map();

    function key(row, col) {
      return `${row},${col}`;
    }

    function cellLineClasses(row, col) {
      return renbanLines
        .filter((line) => line.cells.some(([r, c]) => r === row && c === col))
        .map((line) => line.color)
        .join(" ");
    }

    function renderBoard() {
      board.innerHTML = "";
      cells.clear();
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const fixed = Boolean(givens[key(row, col)]);
          const button = document.createElement("button");
          button.setAttribute("aria-label", `row ${row + 1} column ${col + 1}`);
          button.className = baseClass(row, col, fixed);
          button.textContent = values[row][col] || "";
          if (!fixed) {
            button.addEventListener("click", () => {
              values[row][col] = (values[row][col] % size) + 1;
              update();
            });
          }
          board.appendChild(button);
          cells.set(key(row, col), button);
        }
      }
    }

    function baseClass(row, col, fixed) {
      const lineClass = cellLineClasses(row, col);
      return fixed
        ? `aspect-square rounded-md bg-stone-200 text-2xl font-bold text-stone-950 ring-4 ${lineClass}`
        : `aspect-square rounded-md bg-stone-700 text-2xl font-bold text-stone-100 ring-4 hover:bg-stone-600 ${lineClass}`;
    }

    function latinReport() {
      const issues = [];
      for (let index = 0; index < size; index++) {
        const rowValues = values[index].filter(Boolean);
        const colValues = values.map((row) => row[index]).filter(Boolean);
        if (new Set(rowValues).size !== rowValues.length) issues.push(`第 ${index + 1} 行重复`);
        if (new Set(colValues).size !== colValues.length) issues.push(`第 ${index + 1} 列重复`);
      }
      return issues;
    }

    function isConsecutive(numbers) {
      const ordered = [...numbers].sort((a, b) => a - b);
      return ordered.every((value, index) => index === 0 || value === ordered[index - 1] + 1);
    }

    function lineReport() {
      return renbanLines.filter((line) => {
        const numbers = line.cells.map(([row, col]) => values[row][col]).filter(Boolean);
        if (new Set(numbers).size !== numbers.length) return true;
        if (numbers.length < line.cells.length) return false;
        return !isConsecutive(numbers);
      });
    }

    function isSolved() {
      return values.every((row, rowIndex) =>
        row.every((value, colIndex) => value === solution[rowIndex][colIndex])
      );
    }

    function update() {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          cells.get(key(row, col)).textContent = values[row][col] || "";
        }
      }
      const latinIssues = latinReport();
      const lineIssues = lineReport();
      latinStatus.textContent = latinIssues.length ? latinIssues.join("；") : "行列检查通过";
      lineStatus.textContent = lineIssues.length ? `线索未满足：${lineIssues.map((line) => line.name).join("、")}` : "Renban 线检查通过";
      winStatus.textContent = isSolved() ? "完成：Renban 解开了" : "继续填数";
      winStatus.className = isSolved()
        ? "rounded-md bg-fuchsia-400 p-3 font-semibold text-fuchsia-950"
        : "rounded-md bg-stone-800 p-3 font-semibold text-stone-200";
    }

    resetBtn.addEventListener("click", () => {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) values[row][col] = givens[key(row, col)] || 0;
      }
      update();
    });

    renderBoard();
    update();
  </script>
</body>
</html>
