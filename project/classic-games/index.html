      const slugFromFile = (file) => {
        return file.replace(/^\d{8}-\d{4}-/, "").replace(/\.html$/, "");
      };

      const titleFromFile = (file) => {
        const slug = slugFromFile(file);
        return slug
          .split("-")
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(" ");
      };

      const chineseTitleFromFile = (file) => {
        const slug = slugFromFile(file);
        const baseSlug = slug.replace(/-lite$/, "");
        if (exactChineseTitles[baseSlug]) {
          return exactChineseTitles[baseSlug] + (slug.endsWith("-lite") ? "（轻量版）" : "");
        }

        return slug
          .split("-")
          .map((part) => {
            if (/^\d+$/.test(part)) return part;
            return chineseWords[part] || part.charAt(0).toUpperCase() + part.slice(1);
          })
          .join("");
      };

      const metaFromFile = (file) => {
        const [, date, time] = file.match(/^(\d{8})-(\d{4})-/) || [];
        if (!date || !time) return "";
        return date.slice(0, 4) + "-" + date.slice(4, 6) + "-" + date.slice(6, 8) + " " + time.slice(0, 2) + ":" + time.slice(2, 4);
      };

      const grid = document.querySelector("#game-grid");
      const searchInput = document.querySelector("#search-input");
      const resultCount = document.querySelector("#result-count");
      const gameBasePath = "/project/classic-games/";

      const createIcon = (name) => {
        const icon = document.createElement("i");
        icon.dataset.lucene = name;
        icon.setAttribute("data-lucide", name);
        icon.className = "h-5 w-5";
        return icon;
      };

      const renderGames = (files) => {
        resultCount.textContent = files.length + " / " + gameFiles.length + " 个入口";
        grid.replaceChildren();
        files.forEach((file, index) => {
          const title = titleFromFile(file);
          const chineseTitle = chineseTitleFromFile(file);
          const meta = metaFromFile(file);
          const badge = file === gameFiles[0] ? "Latest" : "#" + (index + 1);

          const article = document.createElement("article");
          article.className = "rounded-lg border border-zinc-800 bg-zinc-900 p-4 shadow-lg shadow-black/20";

          const top = document.createElement("div");
          top.className = "flex items-start justify-between gap-3";
          const iconWrap = document.createElement("div");
          iconWrap.className = "grid h-10 w-10 place-items-center rounded-md bg-emerald-400 text-zinc-950";
          iconWrap.append(createIcon("gamepad-2"));
          const badgeEl = document.createElement("span");
          badgeEl.className = "rounded border border-zinc-700 bg-zinc-950 px-2 py-1 text-xs text-zinc-400";
          badgeEl.textContent = badge;
          top.append(iconWrap, badgeEl);

          const titleEl = document.createElement("h3");
          titleEl.className = "mt-4 text-base font-semibold";
          titleEl.textContent = title;
          const chineseTitleEl = document.createElement("p");
          chineseTitleEl.className = "mt-1 text-sm font-medium text-emerald-200";
          chineseTitleEl.textContent = chineseTitle;
          const metaEl = document.createElement("p");
          metaEl.className = "mt-2 text-sm text-zinc-400";
          metaEl.textContent = meta;
          const fileEl = document.createElement("p");
          fileEl.className = "mt-1 break-all text-xs text-zinc-500";
          fileEl.textContent = file;
          const link = document.createElement("a");
          link.href = gameBasePath + file;
          link.className = "mt-4 inline-flex h-9 items-center justify-center gap-2 rounded-md bg-emerald-400 px-3 text-sm font-medium text-zinc-950 hover:bg-emerald-300";
          const linkIcon = createIcon("external-link");
          linkIcon.className = "h-4 w-4";
          link.append(linkIcon, document.createTextNode("打开"));

          article.append(top, titleEl, chineseTitleEl, metaEl, fileEl, link);
          grid.append(article);
        });
        lucide.createIcons();
      };

      searchInput.addEventListener("input", () => {
        const query = searchInput.value.trim().toLowerCase();
        const files = query
          ? gameFiles.filter((file) => {
              return (
                file.toLowerCase().includes(query) ||
                titleFromFile(file).toLowerCase().includes(query) ||
                chineseTitleFromFile(file).toLowerCase().includes(query)
              );
            })
          : gameFiles;
        renderGames(files);
      });

      renderGames(gameFiles);
