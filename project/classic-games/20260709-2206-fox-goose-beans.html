<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Fox Goose Beans</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cyan-950 text-cyan-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Fox Goose Beans</h1>
        <p class="text-sm text-cyan-200">Move everyone across the river. Never leave fox with goose, or goose with beans.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-cyan-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-cyan-700 bg-cyan-900 p-3 sm:grid-cols-3">
      <div>Moves: <b id="moveCount">0</b></div>
      <div>Boat: <b id="boatSide">Left</b></div>
      <div id="message">Choose cargo, then cross.</div>
    </section>

    <section class="grid gap-3 md:grid-cols-[1fr_120px_1fr]">
      <div class="rounded border border-cyan-700 bg-cyan-900 p-3">
        <h2 class="mb-2 font-semibold">Left Bank</h2>
        <div id="leftBank" class="grid gap-2"></div>
      </div>
      <div class="flex items-center justify-center rounded border border-cyan-700 bg-sky-800 p-3 text-center">
        <div>
          <div class="text-4xl">⛵</div>
          <div id="cargoText" class="mt-2 text-sm">Cargo: none</div>
        </div>
      </div>
      <div class="rounded border border-cyan-700 bg-cyan-900 p-3">
        <h2 class="mb-2 font-semibold">Right Bank</h2>
        <div id="rightBank" class="grid gap-2"></div>
      </div>
    </section>

    <section class="flex flex-wrap gap-3">
      <button id="emptyBtn" class="rounded bg-sky-300 px-4 py-3 font-semibold text-cyan-950 hover:bg-sky-200">No Cargo</button>
      <button id="crossBtn" class="rounded bg-lime-300 px-5 py-3 font-semibold text-cyan-950 hover:bg-lime-200">Cross River</button>
    </section>
  </main>

  <script>
    const names = { farmer: "Farmer", fox: "Fox", goose: "Goose", beans: "Beans" };
    const icons = { farmer: "🧑", fox: "🦊", goose: "🪿", beans: "🫘" };
    const el = (id) => document.getElementById(id);
    const leftBank = el("leftBank");
    const rightBank = el("rightBank");
    const moveCount = el("moveCount");
    const boatSide = el("boatSide");
    const cargoText = el("cargoText");
    const message = el("message");
    const emptyBtn = el("emptyBtn");
    const crossBtn = el("crossBtn");
    const newGameBtn = el("newGameBtn");

    let side;
    let selectedCargo;
    let moves;
    let gameOver;

    function sameBank(a, b, bankSide) {
      return side[a] === bankSide && side[b] === bankSide;
    }

    function isBankUnsafe(bankSide) {
      const farmerAway = side.farmer !== bankSide;
      return farmerAway && (sameBank("fox", "goose", bankSide) || sameBank("goose", "beans", bankSide));
    }

    function safetyMessage() {
      if (isBankUnsafe("left")) return "Unsafe left bank.";
      if (isBankUnsafe("right")) return "Unsafe right bank.";
      return "";
    }

    function chooseCargo(item) {
      if (gameOver) return;
      if (item && side[item] !== side.farmer) {
        message.textContent = `${names[item]} is not with the farmer.`;
        return;
      }
      selectedCargo = item;
      message.textContent = item ? `${names[item]} will ride with the farmer.` : "The farmer will cross alone.";
      render();
    }

    function crossRiver() {
      if (gameOver) return;
      const from = side.farmer;
      const to = from === "left" ? "right" : "left";
      side.farmer = to;
      if (selectedCargo) side[selectedCargo] = to;
      moves += 1;
      const warning = safetyMessage();
      if (warning) {
        gameOver = true;
        message.textContent = `${warning} Start over.`;
      } else if (Object.values(side).every((value) => value === "right")) {
        gameOver = true;
        message.textContent = `Solved in ${moves} moves.`;
      } else {
        message.textContent = "Choose the next cargo.";
      }
      selectedCargo = null;
      render();
    }

    function renderBank(bankEl, bankSide) {
      bankEl.innerHTML = Object.keys(names).map((item) => {
        if (side[item] !== bankSide) return "";
        const selected = selectedCargo === item;
        const disabled = item === "farmer" || side[item] !== side.farmer || gameOver;
        return `<button data-item="${item}" class="rounded border px-3 py-2 text-left ${selected ? "border-amber-300 bg-amber-100 text-cyan-950" : "border-cyan-700 bg-white text-cyan-950"} ${disabled ? "opacity-60" : "hover:bg-cyan-100"}" ${disabled ? "disabled" : ""}>${icons[item]} ${names[item]}</button>`;
      }).join("");
      bankEl.querySelectorAll("[data-item]").forEach((button) => {
        button.addEventListener("click", () => chooseCargo(button.dataset.item));
      });
    }

    function render() {
      renderBank(leftBank, "left");
      renderBank(rightBank, "right");
      moveCount.textContent = moves;
      boatSide.textContent = side.farmer === "left" ? "Left" : "Right";
      cargoText.textContent = `Cargo: ${selectedCargo ? names[selectedCargo] : "none"}`;
      crossBtn.disabled = gameOver;
      emptyBtn.disabled = gameOver;
    }

    function newGame() {
      side = { farmer: "left", fox: "left", goose: "left", beans: "left" };
      selectedCargo = null;
      moves = 0;
      gameOver = false;
      message.textContent = "Choose cargo, then cross.";
      render();
    }

    emptyBtn.addEventListener("click", () => chooseCargo(null));
    crossBtn.addEventListener("click", crossRiver);
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
