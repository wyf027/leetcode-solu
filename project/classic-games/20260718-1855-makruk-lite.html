<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Makruk Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.28em] text-amber-300">Classic Games</p>
        <h1 class="text-3xl font-bold">Mini Makruk</h1>
        <p class="mt-2 max-w-2xl text-sm text-stone-300">
          A compact Thai chess duel. Move one piece, capture the rival king, and keep your own monarch covered.
        </p>
      </div>
      <button id="resetBtn" class="rounded bg-amber-300 px-4 py-2 text-sm font-semibold text-stone-950 hover:bg-amber-200">
        New Game
      </button>
    </header>

    <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
      <div class="rounded border border-stone-700 bg-stone-900 p-3 shadow-2xl">
        <div id="board" class="grid aspect-square w-full grid-cols-5 overflow-hidden rounded border border-stone-700"></div>
      </div>

      <aside class="space-y-4">
        <div class="rounded border border-stone-700 bg-stone-900 p-4">
          <div class="text-xs uppercase tracking-[0.22em] text-stone-400">Turn</div>
          <div id="turnText" class="mt-1 text-2xl font-bold text-amber-200"></div>
          <div id="statusText" class="mt-3 min-h-12 text-sm leading-6 text-stone-300"></div>
        </div>

        <div class="rounded border border-stone-700 bg-stone-900 p-4">
          <div class="text-xs uppercase tracking-[0.22em] text-stone-400">Captured</div>
          <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
            <div class="rounded bg-stone-800 p-3">
              <div class="font-semibold text-rose-200">Rose</div>
              <div id="roseCaptures" class="mt-1 text-2xl font-bold">0</div>
            </div>
            <div class="rounded bg-stone-800 p-3">
              <div class="font-semibold text-sky-200">Blue</div>
              <div id="blueCaptures" class="mt-1 text-2xl font-bold">0</div>
            </div>
          </div>
        </div>

        <div class="rounded border border-stone-700 bg-stone-900 p-4 text-sm leading-6 text-stone-300">
          <div class="mb-2 font-semibold text-stone-100">Pieces</div>
          <p><span class="font-semibold text-amber-200">K</span> king: one square any direction.</p>
          <p><span class="font-semibold text-amber-200">R</span> rook: straight lines.</p>
          <p><span class="font-semibold text-amber-200">N</span> knight: L jump.</p>
          <p><span class="font-semibold text-amber-200">P</span> pawn: forward one, diagonal capture.</p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 5;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const statusText = document.getElementById("statusText");
    const roseCaptures = document.getElementById("roseCaptures");
    const blueCaptures = document.getElementById("blueCaptures");
    const resetBtn = document.getElementById("resetBtn");

    const names = { r: "Rose", b: "Blue" };
    const pieceNames = { K: "King", R: "Rook", N: "Knight", P: "Pawn" };
    let board;
    let turn;
    let selected;
    let moves;
    let captures;
    let winner;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(null));
      const setup = [
        ["bR", "bN", "bK", "bN", "bR"],
        [null, "bP", "bP", "bP", null],
        [null, null, null, null, null],
        [null, "rP", "rP", "rP", null],
        ["rR", "rN", "rK", "rN", "rR"]
      ];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          board[row][col] = setup[row][col] ? makePiece(setup[row][col]) : null;
        }
      }
      turn = "r";
      selected = null;
      moves = [];
      captures = { r: 0, b: 0 };
      winner = null;
      render();
    }

    function makePiece(code) {
      return { side: code[0], type: code[1] };
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function opponent(side) {
      return side === "r" ? "b" : "r";
    }

    function key(row, col) {
      return `${row},${col}`;
    }

    function addStep(list, piece, row, col, dr, dc) {
      const nr = row + dr;
      const nc = col + dc;
      if (!inBounds(nr, nc)) return;
      const target = board[nr][nc];
      if (!target || target.side !== piece.side) {
        list.push({ row: nr, col: nc, capture: Boolean(target) });
      }
    }

    function addRay(list, piece, row, col, dr, dc) {
      let nr = row + dr;
      let nc = col + dc;
      while (inBounds(nr, nc)) {
        const target = board[nr][nc];
        if (!target) {
          list.push({ row: nr, col: nc, capture: false });
        } else {
          if (target.side !== piece.side) list.push({ row: nr, col: nc, capture: true });
          break;
        }
        nr += dr;
        nc += dc;
      }
    }

    function legalMoves(row, col) {
      const piece = board[row][col];
      if (!piece || winner) return [];
      const list = [];
      if (piece.type === "K") {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr || dc) addStep(list, piece, row, col, dr, dc);
          }
        }
      }
      if (piece.type === "R") {
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => addRay(list, piece, row, col, dr, dc));
      }
      if (piece.type === "N") {
        [[2, 1], [2, -1], [-2, 1], [-2, -1], [1, 2], [1, -2], [-1, 2], [-1, -2]]
          .forEach(([dr, dc]) => addStep(list, piece, row, col, dr, dc));
      }
      if (piece.type === "P") {
        const dir = piece.side === "r" ? -1 : 1;
        const forward = row + dir;
        if (inBounds(forward, col) && !board[forward][col]) list.push({ row: forward, col, capture: false });
        for (const dc of [-1, 1]) {
          const targetCol = col + dc;
          if (inBounds(forward, targetCol) && board[forward][targetCol]?.side === opponent(piece.side)) {
            list.push({ row: forward, col: targetCol, capture: true });
          }
        }
      }
      return list;
    }

    function allMoves(side) {
      const list = [];
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (board[row][col]?.side === side) list.push(...legalMoves(row, col));
        }
      }
      return list;
    }

    function hasKing(side) {
      return board.some((row) => row.some((piece) => piece?.side === side && piece.type === "K"));
    }

    function applyMove(toRow, toCol) {
      if (!selected || winner) return;
      const allowed = moves.find((move) => move.row === toRow && move.col === toCol);
      if (!allowed) return;
      const piece = board[selected.row][selected.col];
      const target = board[toRow][toCol];
      if (target) captures[piece.side] += target.type === "K" ? 3 : 1;
      board[toRow][toCol] = piece;
      board[selected.row][selected.col] = null;
      selected = null;
      moves = [];
      checkGame(target);
      if (!winner) turn = opponent(turn);
      render();
    }

    function checkGame(capturedPiece) {
      if (capturedPiece?.type === "K") {
        winner = turn;
        return;
      }
      if (!hasKing(opponent(turn))) {
        winner = turn;
        return;
      }
      if (allMoves(opponent(turn)).length === 0) winner = turn;
    }

    function handleCell(row, col) {
      if (winner) return;
      const piece = board[row][col];
      if (selected && moves.some((move) => move.row === row && move.col === col)) {
        applyMove(row, col);
        return;
      }
      if (piece?.side === turn) {
        selected = { row, col };
        moves = legalMoves(row, col);
      } else {
        selected = null;
        moves = [];
      }
      render();
    }

    function squareClasses(row, col) {
      const light = (row + col) % 2 === 0;
      const isSelected = selected?.row === row && selected?.col === col;
      const move = moves.find((item) => item.row === row && item.col === col);
      const base = light ? "bg-stone-700" : "bg-stone-800";
      if (isSelected) return "bg-amber-300 text-stone-950 ring-4 ring-amber-100";
      if (move?.capture) return "bg-rose-500 text-white ring-4 ring-rose-200";
      if (move) return "bg-emerald-500 text-white ring-4 ring-emerald-200";
      return base;
    }

    function renderBoard() {
      boardEl.innerHTML = "";
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const piece = board[row][col];
          const cell = document.createElement("button");
          cell.className = `relative flex aspect-square items-center justify-center border border-stone-900 text-2xl font-black transition hover:brightness-110 ${squareClasses(row, col)}`;
          cell.setAttribute("aria-label", `${row + 1},${col + 1}`);
          cell.addEventListener("click", () => handleCell(row, col));
          if (piece) {
            const chip = document.createElement("span");
            chip.className = `flex h-14 w-14 items-center justify-center rounded-full border-2 text-xl shadow ${piece.side === "r" ? "border-rose-100 bg-rose-300 text-rose-950" : "border-sky-100 bg-sky-300 text-sky-950"}`;
            chip.textContent = piece.type;
            chip.title = `${names[piece.side]} ${pieceNames[piece.type]}`;
            cell.appendChild(chip);
          } else if (moves.some((move) => move.row === row && move.col === col)) {
            const dot = document.createElement("span");
            dot.className = "h-3 w-3 rounded-full bg-white/80";
            cell.appendChild(dot);
          }
          boardEl.appendChild(cell);
        }
      }
    }

    function renderStatus() {
      turnText.textContent = winner ? `${names[winner]} wins` : `${names[turn]} to move`;
      roseCaptures.textContent = captures.r;
      blueCaptures.textContent = captures.b;
      if (winner) {
        statusText.textContent = `${names[winner]} captured the rival king or left ${names[opponent(winner)]} without a legal reply.`;
      } else if (selected) {
        const piece = board[selected.row][selected.col];
        statusText.textContent = `${names[turn]} selected ${pieceNames[piece.type]}. Legal destinations are highlighted.`;
      } else {
        statusText.textContent = "Select one of your pieces, then choose a highlighted destination.";
      }
    }

    function render() {
      renderBoard();
      renderStatus();
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
