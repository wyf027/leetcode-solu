<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Sudoku</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
      <section class="w-full rounded-lg border border-slate-700 bg-slate-900 p-5 shadow-2xl">
        <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold tracking-normal">Mini Sudoku</h1>
            <p id="message" class="mt-1 min-h-6 text-sm text-slate-300">填满 4x4 数独，每行、每列、每宫都包含 1-4。</p>
          </div>
          <div class="text-right text-sm text-slate-300">
            <div>错误 <span id="mistakes" class="font-semibold text-rose-300">0</span></div>
            <div>剩余 <span id="remaining" class="font-semibold text-cyan-300">10</span></div>
          </div>
        </div>

        <div id="board" class="mx-auto grid aspect-square w-full max-w-md grid-cols-4 gap-1 rounded-md bg-slate-500 p-1"></div>

        <div class="mt-5 grid grid-cols-4 gap-2">
          <button class="num rounded bg-cyan-500 py-3 text-lg font-bold text-slate-950 hover:bg-cyan-300" data-number="1">1</button>
          <button class="num rounded bg-cyan-500 py-3 text-lg font-bold text-slate-950 hover:bg-cyan-300" data-number="2">2</button>
          <button class="num rounded bg-cyan-500 py-3 text-lg font-bold text-slate-950 hover:bg-cyan-300" data-number="3">3</button>
          <button class="num rounded bg-cyan-500 py-3 text-lg font-bold text-slate-950 hover:bg-cyan-300" data-number="4">4</button>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-3">
          <button id="erase" class="rounded border border-slate-600 py-2 font-semibold text-slate-100 hover:bg-slate-800">清除</button>
          <button id="reset" class="rounded bg-emerald-500 py-2 font-semibold text-slate-950 hover:bg-emerald-300">重开</button>
        </div>
      </section>
    </main>

    <script>
      const puzzle = [
        [1, 0, 0, 4],
        [0, 4, 1, 0],
        [0, 1, 4, 0],
        [4, 0, 0, 1],
      ];
      const solution = [
        [1, 2, 3, 4],
        [3, 4, 1, 2],
        [2, 1, 4, 3],
        [4, 3, 2, 1],
      ];

      const boardEl = document.getElementById("board");
      const messageEl = document.getElementById("message");
      const mistakesEl = document.getElementById("mistakes");
      const remainingEl = document.getElementById("remaining");
      let board = [];
      let selected = null;
      let mistakes = 0;

      function resetGame() {
        board = puzzle.map((row) => row.slice());
        selected = null;
        mistakes = 0;
        messageEl.textContent = "填满 4x4 数独，每行、每列、每宫都包含 1-4。";
        renderBoard();
        updateStats();
      }

      function renderBoard() {
        boardEl.innerHTML = "";
        board.forEach((row, r) => {
          row.forEach((value, c) => {
            const cell = document.createElement("button");
            const isFixed = puzzle[r][c] !== 0;
            const isSelected = selected && selected.r === r && selected.c === c;
            cell.textContent = value || "";
            cell.className = [
              "aspect-square rounded text-2xl font-bold transition",
              isFixed ? "bg-slate-700 text-slate-100" : "bg-slate-100 text-slate-950 hover:bg-cyan-100",
              isSelected ? "ring-4 ring-cyan-300" : "",
              c === 1 ? "mr-1" : "",
              r === 1 ? "mb-1" : "",
            ].join(" ");
            cell.addEventListener("click", () => chooseCell(r, c));
            boardEl.appendChild(cell);
          });
        });
      }

      function chooseCell(r, c) {
        if (puzzle[r][c] !== 0) {
          messageEl.textContent = "深色格是题目数字，不能修改。";
          return;
        }
        selected = { r, c };
        messageEl.textContent = "选择数字 1-4 填入当前格。";
        renderBoard();
      }

      function setNumber(number) {
        if (!selected) {
          messageEl.textContent = "先选择一个空格。";
          return;
        }
        const { r, c } = selected;
        board[r][c] = number;
        if (number && number !== solution[r][c]) {
          mistakes += 1;
          messageEl.textContent = "这个数字不符合答案，再试一次。";
        } else {
          messageEl.textContent = number ? "填得不错，继续完成棋盘。" : "已清除当前格。";
        }
        renderBoard();
        updateStats();
        checkBoard();
      }

      function updateStats() {
        const remaining = board.flat().filter((value) => value === 0).length;
        mistakesEl.textContent = mistakes;
        remainingEl.textContent = remaining;
      }

      function checkBoard() {
        const complete = board.every((row, r) => row.every((value, c) => value === solution[r][c]));
        if (complete) {
          selected = null;
          messageEl.textContent = "完成！你解开了这盘 Mini Sudoku。";
          renderBoard();
        }
      }

      document.querySelectorAll(".num").forEach((button) => {
        button.addEventListener("click", () => setNumber(Number(button.dataset.number)));
      });
      document.getElementById("erase").addEventListener("click", () => setNumber(0));
      document.getElementById("reset").addEventListener("click", resetGame);

      resetGame();
    </script>
  </body>
</html>
