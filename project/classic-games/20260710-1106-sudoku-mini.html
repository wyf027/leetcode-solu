<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Sudoku</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-indigo-700 bg-indigo-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-cyan-300">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Sudoku</h1>
        </div>
        <button id="resetBtn" class="rounded bg-cyan-300 px-4 py-2 font-semibold text-indigo-950 hover:bg-cyan-200">
          Reset
        </button>
      </div>

      <div class="mb-5 grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-indigo-700 bg-indigo-800 p-4">
          <p class="text-sm text-indigo-200">Size</p>
          <p class="text-3xl font-bold">4 x 4</p>
        </div>
        <div class="rounded border border-indigo-700 bg-indigo-800 p-4">
          <p class="text-sm text-indigo-200">Filled</p>
          <p id="filledCount" class="text-3xl font-bold">0 / 16</p>
        </div>
        <div class="rounded border border-indigo-700 bg-indigo-800 p-4">
          <p class="text-sm text-indigo-200">Errors</p>
          <p id="errorCount" class="text-3xl font-bold">0</p>
        </div>
      </div>

      <div id="board" class="mx-auto grid max-w-md grid-cols-4 gap-1 rounded-lg bg-indigo-950 p-2"></div>

      <div class="mt-5 grid grid-cols-4 gap-3">
        <button data-number="1" class="rounded bg-indigo-800 py-3 text-xl font-bold hover:bg-indigo-700">1</button>
        <button data-number="2" class="rounded bg-indigo-800 py-3 text-xl font-bold hover:bg-indigo-700">2</button>
        <button data-number="3" class="rounded bg-indigo-800 py-3 text-xl font-bold hover:bg-indigo-700">3</button>
        <button data-number="4" class="rounded bg-indigo-800 py-3 text-xl font-bold hover:bg-indigo-700">4</button>
      </div>

      <p id="statusText" class="mt-5 min-h-6 rounded border border-indigo-700 bg-indigo-950 p-3 font-semibold">
        Select an empty cell, then choose a number from 1 to 4.
      </p>
    </section>
  </main>

  <script>
    const puzzle = [
      [1, 0, 0, 4],
      [0, 4, 1, 0],
      [0, 1, 4, 0],
      [4, 0, 0, 1]
    ];
    const solution = [
      [1, 2, 3, 4],
      [3, 4, 1, 2],
      [2, 1, 4, 3],
      [4, 3, 2, 1]
    ];
    const size = 4;
    const boxSize = 2;
    let selected = null;
    let grid = puzzle.map((row) => [...row]);

    const board = document.getElementById("board");
    const filledCount = document.getElementById("filledCount");
    const errorCount = document.getElementById("errorCount");
    const statusText = document.getElementById("statusText");
    const resetBtn = document.getElementById("resetBtn");

    function isGiven(row, col) {
      return puzzle[row][col] !== 0;
    }

    function hasConflict(row, col, value) {
      if (!value) return false;
      for (let index = 0; index < size; index += 1) {
        if (index !== col && grid[row][index] === value) return true;
        if (index !== row && grid[index][col] === value) return true;
      }
      const boxRow = Math.floor(row / boxSize) * boxSize;
      const boxCol = Math.floor(col / boxSize) * boxSize;
      for (let r = boxRow; r < boxRow + boxSize; r += 1) {
        for (let c = boxCol; c < boxCol + boxSize; c += 1) {
          if ((r !== row || c !== col) && grid[r][c] === value) return true;
        }
      }
      return false;
    }

    function countErrors() {
      let errors = 0;
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          if (hasConflict(row, col, grid[row][col])) errors += 1;
        }
      }
      return errors;
    }

    function isSolved() {
      return grid.every((row, r) => row.every((value, c) => value === solution[r][c]));
    }

    function render() {
      board.innerHTML = "";
      let filled = 0;
      const errors = countErrors();

      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const value = grid[row][col];
          if (value) filled += 1;
          const cell = document.createElement("button");
          const selectedCell = selected && selected.row === row && selected.col === col;
          const conflict = hasConflict(row, col, value);
          cell.className = "aspect-square rounded text-3xl font-bold transition";
          cell.classList.add(isGiven(row, col) ? "bg-indigo-700" : "bg-indigo-800", "hover:bg-indigo-600");
          if (selectedCell) cell.classList.add("ring-2", "ring-cyan-300");
          if (conflict) cell.classList.add("text-rose-300");
          cell.dataset.row = String(row);
          cell.dataset.col = String(col);
          cell.textContent = value ? String(value) : "";
          board.appendChild(cell);
        }
      }

      filledCount.textContent = `${filled} / 16`;
      errorCount.textContent = errors;
      if (isSolved()) {
        statusText.textContent = "Puzzle solved.";
      } else if (errors > 0) {
        statusText.textContent = "A row, column, or 2x2 box has a duplicate.";
      }
    }

    function placeNumber(value) {
      if (!selected) {
        statusText.textContent = "Select an empty cell first.";
        return;
      }
      if (isGiven(selected.row, selected.col)) {
        statusText.textContent = "Given cells cannot be changed.";
        return;
      }
      grid[selected.row][selected.col] = value;
      statusText.textContent = "Number placed.";
      render();
    }

    function resetGame() {
      grid = puzzle.map((row) => [...row]);
      selected = null;
      statusText.textContent = "Select an empty cell, then choose a number from 1 to 4.";
      render();
    }

    board.addEventListener("click", (event) => {
      const cell = event.target.closest("[data-row]");
      if (!cell) return;
      selected = { row: Number(cell.dataset.row), col: Number(cell.dataset.col) };
      statusText.textContent = isGiven(selected.row, selected.col) ? "That is a given cell." : "Choose a number.";
      render();
    });

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-number]");
      if (!button) return;
      placeNumber(Number(button.dataset.number));
    });

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
