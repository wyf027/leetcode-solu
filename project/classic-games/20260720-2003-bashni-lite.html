<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Bashni Lite</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-zinc-800 pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-wide text-rose-300">Classic Game</p>
          <h1 class="mt-1 text-3xl font-bold sm:text-4xl">Mini Bashni Lite</h1>
        </div>
        <button
          id="reset"
          class="rounded-md bg-rose-300 px-4 py-2 text-sm font-bold text-zinc-950 transition hover:bg-rose-200"
          type="button"
        >
          重新开始
        </button>
      </header>

      <section class="grid gap-3 sm:grid-cols-4">
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">当前回合</p>
          <p id="turn" class="mt-2 text-2xl font-bold text-rose-200">Red</p>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">Red 列数</p>
          <p id="red-count" class="mt-2 text-2xl font-bold">6</p>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">Blue 列数</p>
          <p id="blue-count" class="mt-2 text-2xl font-bold">6</p>
        </div>
        <div class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <p class="text-sm text-zinc-400">状态</p>
          <p id="status" class="mt-2 text-lg font-semibold text-emerald-200">选择己方顶子</p>
        </div>
      </section>

      <section class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_18rem]">
        <div id="board" class="grid aspect-square grid-cols-6 gap-1 rounded-md border border-zinc-800 bg-zinc-900 p-2"></div>

        <aside class="rounded-md border border-zinc-800 bg-zinc-900 p-4">
          <h2 class="text-xl font-bold">走法记录</h2>
          <p id="message" class="mt-3 min-h-16 text-sm leading-6 text-zinc-300">
            Red 先手。点选一个己方顶子的棋列，再点选高亮格移动。
          </p>
          <div class="mt-4 border-t border-zinc-800 pt-4 text-sm leading-6 text-zinc-400">
            <p>规则：斜向前走一格，或跳过相邻敌方棋列吃子。被吃棋列会叠到移动棋列底部，棋列最上方颜色决定归属。</p>
          </div>
        </aside>
      </section>
    </main>

    <script>
      const size = 6;
      const initialBoard = Array.from({ length: size * size }, () => []);
      let board = [];
      let turn = "R";
      let selected = null;
      let moves = [];
      let winner = null;

      const cells = {
        board: document.getElementById("board"),
        turn: document.getElementById("turn"),
        redCount: document.getElementById("red-count"),
        blueCount: document.getElementById("blue-count"),
        status: document.getElementById("status"),
        message: document.getElementById("message"),
        reset: document.getElementById("reset"),
      };

      function index(row, col) {
        return row * size + col;
      }

      function inBoard(row, col) {
        return row >= 0 && row < size && col >= 0 && col < size;
      }

      function topOwner(stack) {
        return stack.length ? stack[stack.length - 1] : null;
      }

      function setupBoard() {
        board = initialBoard.map((stack) => [...stack]);
        for (let row = 0; row < 2; row += 1) {
          for (let col = 0; col < size; col += 1) {
            if ((row + col) % 2 === 1) board[index(row, col)] = ["B"];
          }
        }
        for (let row = size - 2; row < size; row += 1) {
          for (let col = 0; col < size; col += 1) {
            if ((row + col) % 2 === 1) board[index(row, col)] = ["R"];
          }
        }
        turn = "R";
        selected = null;
        moves = [];
        winner = null;
        cells.message.textContent = "Red 先手。点选一个己方顶子的棋列，再点选高亮格移动。";
        render();
      }

      function getMoves(from) {
        const row = Math.floor(from / size);
        const col = from % size;
        const direction = turn === "R" ? -1 : 1;
        const options = [];
        [-1, 1].forEach((side) => {
          const walkRow = row + direction;
          const walkCol = col + side;
          if (inBoard(walkRow, walkCol) && board[index(walkRow, walkCol)].length === 0) {
            options.push({ to: index(walkRow, walkCol), capture: null });
          }

          const midRow = row + direction;
          const midCol = col + side;
          const landRow = row + direction * 2;
          const landCol = col + side * 2;
          if (!inBoard(midRow, midCol) || !inBoard(landRow, landCol)) return;
          const middle = index(midRow, midCol);
          const landing = index(landRow, landCol);
          const enemy = topOwner(board[middle]) && topOwner(board[middle]) !== turn;
          if (enemy && board[landing].length === 0) {
            options.push({ to: landing, capture: middle });
          }
        });
        return options;
      }

      function availablePieces(player) {
        return board
          .map((stack, cell) => ({ stack, cell }))
          .filter(({ stack, cell }) => topOwner(stack) === player && getMoves(cell).length > 0);
      }

      function countOwned(player) {
        return board.filter((stack) => topOwner(stack) === player).length;
      }

      function selectCell(cell) {
        if (winner) return;
        const stack = board[cell];
        const move = moves.find((option) => option.to === cell);
        if (selected !== null && move) {
          playMove(selected, move);
          return;
        }

        if (topOwner(stack) !== turn) {
          selected = null;
          moves = [];
          cells.message.textContent = "请选择当前玩家顶色的棋列。";
          render();
          return;
        }

        selected = cell;
        moves = getMoves(cell);
        cells.message.textContent = moves.length
          ? `已选择第 ${Math.floor(cell / size) + 1} 行第 ${(cell % size) + 1} 列。`
          : "这个棋列暂时没有合法移动。";
        render();
      }

      function playMove(from, move) {
        const moving = board[from];
        const captured = move.capture === null ? [] : board[move.capture];
        board[move.to] = [...captured, ...moving];
        board[from] = [];
        if (move.capture !== null) board[move.capture] = [];

        const playerName = turn === "R" ? "Red" : "Blue";
        cells.message.textContent =
          move.capture === null ? `${playerName} 斜走一格。` : `${playerName} 跳吃并收编一个棋列。`;

        turn = turn === "R" ? "B" : "R";
        selected = null;
        moves = [];
        checkWinner();
        render();
      }

      function checkWinner() {
        const red = countOwned("R");
        const blue = countOwned("B");
        if (red === 0 || availablePieces("R").length === 0) winner = "B";
        if (blue === 0 || availablePieces("B").length === 0) winner = "R";
      }

      function renderStack(stack) {
        if (!stack.length) return "";
        return stack
          .map((piece, depth) => {
            const color = piece === "R" ? "bg-rose-400" : "bg-sky-400";
            const offset = Math.min(depth, 3) * 3;
            return `<span class="${color} absolute h-7 w-7 rounded-full border-2 border-zinc-950" style="left:${offset}px;top:${offset}px"></span>`;
          })
          .join("");
      }

      function render() {
        const red = countOwned("R");
        const blue = countOwned("B");
        cells.turn.textContent = winner ? (winner === "R" ? "Red" : "Blue") : turn === "R" ? "Red" : "Blue";
        cells.redCount.textContent = String(red);
        cells.blueCount.textContent = String(blue);
        cells.status.textContent = winner ? "胜利" : "选择己方顶子";

        cells.board.innerHTML = "";
        board.forEach((stack, cell) => {
          const row = Math.floor(cell / size);
          const col = cell % size;
          const dark = (row + col) % 2 === 1;
          const isSelected = selected === cell;
          const isMove = moves.some((option) => option.to === cell);
          const button = document.createElement("button");
          button.type = "button";
          button.className = [
            "relative flex items-center justify-center rounded-md border transition",
            dark ? "bg-zinc-800 border-zinc-700" : "bg-zinc-700/40 border-zinc-700/50",
            isSelected ? "ring-2 ring-rose-300" : "",
            isMove ? "ring-2 ring-emerald-300" : "",
          ].join(" ");
          button.innerHTML = `<span class="relative h-10 w-10">${renderStack(stack)}</span>`;
          button.addEventListener("click", () => selectCell(cell));
          cells.board.appendChild(button);
        });
      }

      cells.reset.addEventListener("click", setupBoard);
      setupBoard();
    </script>
  </body>
</html>
