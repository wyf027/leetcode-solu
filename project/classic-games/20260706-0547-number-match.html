<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Number Match</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-stone-950 text-stone-100">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-5 px-4 py-6 sm:px-6">
      <header class="flex flex-col gap-3 border-b border-stone-800 pb-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-teal-300">Classic Games</p>
          <h1 class="mt-1 text-3xl font-bold">Mini Number Match</h1>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-stone-800 bg-stone-900 px-4 py-2">
            <div id="score" class="text-xl font-bold text-teal-200">0</div>
            <div class="text-stone-400">score</div>
          </div>
          <div class="rounded border border-stone-800 bg-stone-900 px-4 py-2">
            <div id="moves" class="text-xl font-bold text-amber-200">0</div>
            <div class="text-stone-400">moves</div>
          </div>
          <div class="rounded border border-stone-800 bg-stone-900 px-4 py-2">
            <div id="pairsLeft" class="text-xl font-bold text-emerald-200">8</div>
            <div class="text-stone-400">pairs</div>
          </div>
        </div>
      </header>

      <section class="grid gap-5 lg:grid-cols-[1fr_18rem]">
        <div class="rounded border border-stone-800 bg-stone-900 p-4">
          <div id="grid" class="grid grid-cols-4 gap-2 sm:grid-cols-8"></div>
          <p id="status" class="mt-4 min-h-6 text-sm font-medium text-stone-300">Reveal two tiles. A pair scores when the numbers add to 10.</p>
        </div>

        <aside class="rounded border border-stone-800 bg-stone-900 p-4">
          <h2 class="text-sm font-semibold uppercase tracking-[0.18em] text-stone-400">Target</h2>
          <div class="mt-3 rounded bg-stone-950 p-4 text-center">
            <div class="text-4xl font-black text-teal-200">10</div>
            <div class="mt-1 text-sm text-stone-500">sum to clear</div>
          </div>
          <button id="newGameBtn" class="mt-5 w-full rounded bg-teal-400 px-4 py-2 font-semibold text-stone-950 hover:bg-teal-300">New Game</button>
          <p class="mt-5 text-sm leading-6 text-stone-400">
            Match all eight hidden pairs. Wrong guesses flip back after a short pause.
          </p>
        </aside>
      </section>
    </main>

    <script>
      const pairValues = [1, 9, 2, 8, 3, 7, 4, 6, 5, 5, 1, 9, 2, 8, 3, 7];
      const grid = document.getElementById("grid");
      const scoreEl = document.getElementById("score");
      const movesEl = document.getElementById("moves");
      const pairsLeftEl = document.getElementById("pairsLeft");
      const statusEl = document.getElementById("status");
      const newGameBtn = document.getElementById("newGameBtn");

      let tiles = [];
      let revealed = [];
      let score = 0;
      let moves = 0;
      let locked = false;

      function shuffle(values) {
        const copy = [...values];
        for (let index = copy.length - 1; index > 0; index -= 1) {
          const swap = Math.floor(Math.random() * (index + 1));
          [copy[index], copy[swap]] = [copy[swap], copy[index]];
        }
        return copy;
      }

      function newGame() {
        tiles = shuffle(pairValues).map((value, index) => ({
          id: index,
          value,
          matched: false,
          open: false,
        }));
        revealed = [];
        score = 0;
        moves = 0;
        locked = false;
        statusEl.textContent = "Reveal two tiles. A pair scores when the numbers add to 10.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-stone-300";
        render();
      }

      function pairsLeft() {
        return tiles.filter((tile) => !tile.matched).length / 2;
      }

      function revealTile(id) {
        if (locked) return;
        const tile = tiles.find((item) => item.id === id);
        if (!tile || tile.open || tile.matched) return;
        tile.open = true;
        revealed.push(tile);
        if (revealed.length === 2) {
          moves += 1;
          checkPair();
        }
        render();
      }

      function checkPair() {
        const [first, second] = revealed;
        if (first.value + second.value === 10) {
          first.matched = true;
          second.matched = true;
          revealed = [];
          score += 10;
          statusEl.textContent = pairsLeft() ? "Pair cleared." : "All pairs cleared.";
          statusEl.className = pairsLeft()
            ? "mt-4 min-h-6 text-sm font-medium text-emerald-300"
            : "mt-4 min-h-6 text-sm font-medium text-teal-300";
          return;
        }
        locked = true;
        statusEl.textContent = "Not a match.";
        statusEl.className = "mt-4 min-h-6 text-sm font-medium text-amber-300";
        setTimeout(() => {
          first.open = false;
          second.open = false;
          revealed = [];
          locked = false;
          render();
        }, 650);
      }

      function render() {
        grid.innerHTML = "";
        tiles.forEach((tile) => {
          const button = document.createElement("button");
          button.type = "button";
          button.disabled = locked || tile.matched;
          button.className = [
            "flex aspect-square items-center justify-center rounded border text-2xl font-black transition",
            tile.matched ? "border-emerald-300 bg-emerald-400 text-stone-950" : "",
            !tile.matched && tile.open ? "border-teal-200 bg-teal-300 text-stone-950" : "",
            !tile.matched && !tile.open ? "border-stone-700 bg-stone-950 text-stone-500 hover:bg-stone-800" : "",
          ].join(" ");
          button.textContent = tile.open || tile.matched ? tile.value : "?";
          button.addEventListener("click", () => revealTile(tile.id));
          grid.appendChild(button);
        });
        scoreEl.textContent = score;
        movesEl.textContent = moves;
        pairsLeftEl.textContent = pairsLeft();
      }

      newGameBtn.addEventListener("click", newGame);
      newGame();
    </script>
  </body>
</html>
