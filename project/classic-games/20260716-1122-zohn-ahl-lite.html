<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Zohn Ahl</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-amber-950 text-amber-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col justify-center gap-5 px-4 py-8">
    <section class="rounded-lg border border-amber-800 bg-amber-900 p-5 shadow-2xl">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-[0.18em] text-teal-200">Classic Mini Game</p>
          <h1 class="mt-1 text-3xl font-bold">Zohn Ahl</h1>
        </div>
        <button id="resetBtn" class="rounded-md bg-teal-200 px-4 py-2 font-semibold text-amber-950 transition hover:bg-teal-100">重新开始</button>
      </div>

      <div class="mt-5 grid gap-4 lg:grid-cols-[1fr_280px]">
        <div class="relative aspect-square rounded-lg border border-amber-700 bg-amber-950">
          <div id="board" class="absolute inset-0"></div>
        </div>

        <aside class="rounded-lg border border-amber-800 bg-amber-950 p-4">
          <button id="throwBtn" class="w-full rounded-md bg-teal-200 px-4 py-3 font-semibold text-amber-950 transition hover:bg-teal-100">投计数棒</button>
          <p id="turnText" class="mt-4 rounded-md bg-amber-900 p-3 text-sm leading-6 text-amber-100"></p>
          <div class="mt-4 grid grid-cols-4 gap-2" id="sticks"></div>
          <div class="mt-4 grid grid-cols-2 gap-3">
            <div class="rounded-md bg-amber-900 p-3">
              <p class="text-xs text-amber-300">鹰方位置</p>
              <p id="eaglePos" class="text-2xl font-bold text-teal-200">0</p>
            </div>
            <div class="rounded-md bg-amber-900 p-3">
              <p class="text-xs text-amber-300">熊方位置</p>
              <p id="bearPos" class="text-2xl font-bold text-orange-200">0</p>
            </div>
          </div>
          <p class="mt-4 text-sm leading-6 text-amber-200/80">投四根计数棒，亮面数即步数，四根全暗算 5 步。沿环形赛道前进，先正好走满一圈回营者获胜。</p>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const track = Array.from({ length: 20 }, (_, index) => {
      const angle = (Math.PI * 2 * index) / 20 - Math.PI / 2;
      return { x: 50 + Math.cos(angle) * 40, y: 50 + Math.sin(angle) * 40 };
    });
    const labels = { eagle: "鹰方", bear: "熊方" };
    let pieces;
    let turn;
    let throwValue;
    let sticks;
    let winner;

    const boardEl = document.getElementById("board");
    const throwBtn = document.getElementById("throwBtn");
    const resetBtn = document.getElementById("resetBtn");
    const turnText = document.getElementById("turnText");
    const sticksEl = document.getElementById("sticks");
    const eaglePos = document.getElementById("eaglePos");
    const bearPos = document.getElementById("bearPos");

    function startGame() {
      pieces = { eagle: 0, bear: 10 };
      turn = "eagle";
      throwValue = null;
      sticks = [false, false, false, false];
      winner = null;
      render();
    }

    function render() {
      boardEl.innerHTML = "";
      track.forEach((point, index) => {
        const cell = document.createElement("div");
        cell.className = [
          "absolute flex h-12 w-12 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border text-xs font-bold",
          index === 0 ? "border-teal-200 bg-teal-900/70" : index === 10 ? "border-orange-200 bg-orange-900/70" : "border-amber-700 bg-amber-900"
        ].join(" ");
        cell.style.left = `${point.x}%`;
        cell.style.top = `${point.y}%`;
        cell.textContent = index + 1;
        addPiece(cell, index);
        boardEl.appendChild(cell);
      });
      sticksEl.innerHTML = "";
      sticks.forEach((lit, index) => {
        const stick = document.createElement("div");
        stick.className = [
          "h-16 rounded-md border text-center text-xs font-bold leading-[4rem]",
          lit ? "border-teal-100 bg-teal-300 text-amber-950" : "border-amber-600 bg-amber-900 text-amber-300"
        ].join(" ");
        stick.textContent = index + 1;
        sticksEl.appendChild(stick);
      });
      throwBtn.disabled = Boolean(winner) || throwValue !== null;
      throwBtn.classList.toggle("opacity-60", throwBtn.disabled);
      eaglePos.textContent = pieces.eagle + 1;
      bearPos.textContent = pieces.bear + 1;
      turnText.textContent = winner
        ? `${labels[winner]}获胜。`
        : throwValue === null
          ? `${labels[turn]}行动：先投计数棒。`
          : `${labels[turn]}投出 ${throwValue} 步，点击己方棋子前进。`;
    }

    function addPiece(cell, index) {
      ["eagle", "bear"].forEach((side) => {
        if (pieces[side] !== index) return;
        const button = document.createElement("button");
        button.type = "button";
        button.className = [
          "absolute h-7 w-7 rounded-full border text-[11px] font-bold shadow",
          side === "eagle" ? "left-1 top-1 border-teal-50 bg-teal-400 text-amber-950" : "bottom-1 right-1 border-orange-50 bg-orange-400 text-amber-950",
          side === turn && throwValue !== null ? "ring-2 ring-white" : ""
        ].join(" ");
        button.textContent = side === "eagle" ? "鹰" : "熊";
        button.addEventListener("click", () => movePiece(side));
        cell.appendChild(button);
      });
    }

    function throwSticks() {
      if (winner || throwValue !== null) return;
      sticks = sticks.map(() => Math.random() >= 0.5);
      const lit = sticks.filter(Boolean).length;
      throwValue = lit === 0 ? 5 : lit;
      render();
    }

    function movePiece(side) {
      if (side !== turn || throwValue === null || winner) return;
      const start = side === "eagle" ? 0 : 10;
      const next = (pieces[side] + throwValue) % track.length;
      pieces[side] = next;
      if (next === start) {
        winner = side;
      } else {
        turn = side === "eagle" ? "bear" : "eagle";
        throwValue = null;
      }
      render();
    }

    throwBtn.addEventListener("click", throwSticks);
    resetBtn.addEventListener("click", startGame);
    startGame();
  </script>
</body>
</html>
