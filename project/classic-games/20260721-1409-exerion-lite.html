<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Exerion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col items-center justify-center gap-4 p-4">
    <section class="w-full rounded-lg border border-cyan-400/30 bg-slate-900/80 p-4 shadow-2xl shadow-cyan-950/30">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-bold tracking-wide text-cyan-200">Mini Exerion</h1>
          <p class="text-sm text-slate-400">Drift, dodge, and manage twin shots against swooping alien patrols.</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded border border-slate-700 px-3 py-2">
            <div class="text-slate-500">Score</div>
            <div id="score" class="font-mono text-cyan-200">0</div>
          </div>
          <div class="rounded border border-slate-700 px-3 py-2">
            <div class="text-slate-500">Lives</div>
            <div id="lives" class="font-mono text-rose-200">3</div>
          </div>
          <div class="rounded border border-slate-700 px-3 py-2">
            <div class="text-slate-500">Shots</div>
            <div id="ammo" class="font-mono text-amber-200">8</div>
          </div>
        </div>
      </div>
      <canvas id="game" width="800" height="520" class="aspect-[20/13] w-full rounded border border-slate-700 bg-black"></canvas>
      <div class="mt-3 flex flex-wrap items-center justify-between gap-2 text-sm text-slate-400">
        <p>Move: Arrow keys / WASD. Fire: Space / J. Restart: Enter.</p>
        <p id="status" class="font-medium text-cyan-200">Press Space to launch.</p>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const ammoEl = document.getElementById('ammo');
    const statusEl = document.getElementById('status');

    const keys = new Set();
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      speed: 0.4 + Math.random() * 1.5,
      size: Math.random() > 0.8 ? 2 : 1
    }));

    let player;
    let shots;
    let aliens;
    let alienShots;
    let score;
    let lives;
    let ammo;
    let wave;
    let frame;
    let lastFire;
    let running;
    let gameOver;

    function setupGame() {
      player = {
        x: canvas.width / 2,
        y: canvas.height - 68,
        vx: 0,
        vy: 0,
        radius: 16,
        invulnerable: 90
      };
      shots = [];
      aliens = [];
      alienShots = [];
      score = 0;
      lives = 3;
      ammo = 8;
      wave = 1;
      frame = 0;
      lastFire = -30;
      running = false;
      gameOver = false;
      spawnWave();
      updateHud();
      statusEl.textContent = 'Press Space to launch.';
      draw();
    }

    function spawnWave() {
      const rows = Math.min(3, 1 + Math.floor(wave / 2));
      const cols = 5 + Math.min(4, wave);
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          spawnAlien(80 + col * 70, -40 - row * 54, row);
        }
      }
    }

    function spawnAlien(x, y, row) {
      aliens.push({
        x,
        y,
        baseX: x,
        row,
        radius: 15,
        phase: Math.random() * Math.PI * 2,
        speed: 0.9 + row * 0.35 + wave * 0.04,
        hp: row === 0 ? 1 : 2,
        diving: false,
        diveTimer: 90 + Math.random() * 160
      });
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      ammoEl.textContent = ammo;
    }

    function fireShot() {
      if (frame - lastFire < 9 || ammo <= 0 || gameOver) {
        return;
      }
      running = true;
      lastFire = frame;
      ammo -= 1;
      shots.push({ x: player.x - 7, y: player.y - 16, vy: -8, radius: 3 });
      shots.push({ x: player.x + 7, y: player.y - 16, vy: -8, radius: 3 });
      statusEl.textContent = 'Hold position through inertia and pick clean shots.';
      updateHud();
    }

    function updatePlayer() {
      const thrust = 0.34;
      if (keys.has('ArrowLeft') || keys.has('a')) player.vx -= thrust;
      if (keys.has('ArrowRight') || keys.has('d')) player.vx += thrust;
      if (keys.has('ArrowUp') || keys.has('w')) player.vy -= thrust;
      if (keys.has('ArrowDown') || keys.has('s')) player.vy += thrust;

      player.vx *= 0.93;
      player.vy *= 0.93;
      player.vx = Math.max(-5.2, Math.min(5.2, player.vx));
      player.vy = Math.max(-4.3, Math.min(4.3, player.vy));
      player.x += player.vx;
      player.y += player.vy;
      player.x = Math.max(28, Math.min(canvas.width - 28, player.x));
      player.y = Math.max(canvas.height * 0.52, Math.min(canvas.height - 30, player.y));
      if (player.invulnerable > 0) player.invulnerable -= 1;
    }

    function updateAliens() {
      if (aliens.length === 0) {
        wave += 1;
        ammo = Math.min(12, ammo + 5);
        statusEl.textContent = `Wave ${wave}`;
        spawnWave();
      }

      for (const alien of aliens) {
        alien.phase += 0.035;
        alien.diveTimer -= 1;
        if (!alien.diving && alien.diveTimer <= 0 && Math.random() < 0.018) {
          alien.diving = true;
          alien.diveTimer = 220 + Math.random() * 120;
        }

        if (alien.diving) {
          const dx = player.x - alien.x;
          alien.x += Math.sign(dx) * Math.min(Math.abs(dx) * 0.015, 1.9 + wave * 0.04);
          alien.y += alien.speed + 1.3;
          if (alien.y > canvas.height + 28) {
            alien.y = -30;
            alien.baseX = 70 + Math.random() * (canvas.width - 140);
            alien.diving = false;
          }
        } else {
          alien.x = alien.baseX + Math.sin(alien.phase + frame * 0.012) * (28 + alien.row * 8);
          alien.y += alien.speed;
          if (alien.y > 170 + alien.row * 34) alien.y = 170 + alien.row * 34;
        }

        if (frame % 75 === 0 && Math.random() < 0.24 + wave * 0.015) {
          const angle = Math.atan2(player.y - alien.y, player.x - alien.x);
          alienShots.push({
            x: alien.x,
            y: alien.y + 12,
            vx: Math.cos(angle) * 2.2,
            vy: Math.sin(angle) * 2.2,
            radius: 4
          });
        }
      }
    }

    function updateProjectiles() {
      for (const shot of shots) shot.y += shot.vy;
      shots = shots.filter((shot) => shot.y > -12);

      for (const bolt of alienShots) {
        bolt.x += bolt.vx;
        bolt.y += bolt.vy;
      }
      alienShots = alienShots.filter((bolt) => bolt.y < canvas.height + 20 && bolt.x > -20 && bolt.x < canvas.width + 20);

      if (frame % 48 === 0 && ammo < 12) {
        ammo += 1;
        updateHud();
      }
    }

    function checkCollisions() {
      for (let i = aliens.length - 1; i >= 0; i--) {
        const alien = aliens[i];
        for (let j = shots.length - 1; j >= 0; j--) {
          const shot = shots[j];
          if (distance(alien, shot) < alien.radius + shot.radius) {
            shots.splice(j, 1);
            alien.hp -= 1;
            if (alien.hp <= 0) {
              aliens.splice(i, 1);
              score += alien.diving ? 180 : 90;
              updateHud();
            }
            break;
          }
        }
      }

      if (player.invulnerable > 0) return;
      const hitByAlien = aliens.some((alien) => distance(player, alien) < player.radius + alien.radius - 2);
      const hitByBolt = alienShots.some((bolt) => distance(player, bolt) < player.radius + bolt.radius);
      if (hitByAlien || hitByBolt) {
        lives -= 1;
        player.x = canvas.width / 2;
        player.y = canvas.height - 68;
        player.vx = 0;
        player.vy = 0;
        player.invulnerable = 105;
        alienShots = [];
        statusEl.textContent = lives > 0 ? 'Shield rebooting.' : 'Game over. Press Enter to restart.';
        if (lives <= 0) gameOver = true;
        updateHud();
      }
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function drawStars() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (const star of stars) {
        if (running && !gameOver) {
          star.y += star.speed;
          if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
          }
        }
        ctx.fillStyle = star.size === 2 ? '#67e8f9' : '#cbd5e1';
        ctx.globalAlpha = star.size === 2 ? 0.75 : 0.45;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1;
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      if (player.invulnerable > 0 && Math.floor(frame / 6) % 2 === 0) ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(17, 18);
      ctx.lineTo(0, 10);
      ctx.lineTo(-17, 18);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.fillRect(-4, 12, 8, 10);
      ctx.restore();
    }

    function drawAliens() {
      for (const alien of aliens) {
        ctx.save();
        ctx.translate(alien.x, alien.y);
        ctx.fillStyle = alien.hp > 1 ? '#fb7185' : '#a78bfa';
        ctx.beginPath();
        ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(-9, -3, 5, 4);
        ctx.fillRect(5, -3, 5, 4);
        ctx.strokeStyle = '#67e8f9';
        ctx.beginPath();
        ctx.moveTo(-16, 7);
        ctx.lineTo(-24, 14);
        ctx.moveTo(16, 7);
        ctx.lineTo(24, 14);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawProjectiles() {
      ctx.fillStyle = '#fde68a';
      for (const shot of shots) {
        ctx.beginPath();
        ctx.arc(shot.x, shot.y, shot.radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#fb7185';
      for (const bolt of alienShots) {
        ctx.beginPath();
        ctx.arc(bolt.x, bolt.y, bolt.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawOverlay() {
      if (running && !gameOver) return;
      ctx.fillStyle = 'rgba(2, 6, 23, 0.68)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#cffafe';
      ctx.font = '700 34px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(gameOver ? 'Mission Failed' : 'Mini Exerion', canvas.width / 2, canvas.height / 2 - 20);
      ctx.font = '16px system-ui, sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(gameOver ? 'Press Enter for another run' : 'Space fires twin shots. Ammo recharges slowly.', canvas.width / 2, canvas.height / 2 + 18);
    }

    function draw() {
      drawStars();
      drawProjectiles();
      drawAliens();
      drawPlayer();
      drawOverlay();
    }

    function tick() {
      frame += 1;
      if (running && !gameOver) {
        updatePlayer();
        updateAliens();
        updateProjectiles();
        checkCollisions();
      }
      draw();
      requestAnimationFrame(tick);
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' ', 'Spacebar'].includes(event.key)) {
        event.preventDefault();
      }
      if (key === 'Enter' && gameOver) {
        setupGame();
        return;
      }
      keys.add(key);
      if (event.key === ' ' || key === 'j') fireShot();
    });

    window.addEventListener('keyup', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    setupGame();
    tick();
  </script>
</body>
</html>
