<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Ming Mang</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-5 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold text-white">Mini Ming Mang</h1>
        <p class="mt-1 text-sm text-slate-300">横纵滑行，用两端包夹把连续敌子翻成己方。</p>
      </div>
      <button id="resetBtn" class="rounded-md bg-cyan-400 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-cyan-300">
        重新开始
      </button>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_230px]">
      <div class="rounded-lg border border-slate-700 bg-slate-900 p-3 shadow-xl">
        <div id="board" class="grid aspect-square w-full grid-cols-6 overflow-hidden rounded-md border border-slate-700"></div>
      </div>

      <aside class="rounded-lg border border-slate-700 bg-slate-900 p-4">
        <div class="space-y-4">
          <div>
            <p class="text-xs uppercase text-slate-400">当前回合</p>
            <p id="turnText" class="mt-1 text-2xl font-bold text-white">白方</p>
          </div>
          <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded-md bg-slate-800 p-3">
              <p class="text-slate-400">白方</p>
              <p id="whiteCount" class="text-xl font-semibold text-white">12</p>
            </div>
            <div class="rounded-md bg-slate-800 p-3">
              <p class="text-slate-400">黑方</p>
              <p id="blackCount" class="text-xl font-semibold text-white">12</p>
            </div>
          </div>
          <p id="statusText" class="rounded-md bg-slate-800 p-3 text-sm leading-6 text-slate-200">
            白方先手。选择棋子，横向或纵向滑到空格。
          </p>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 6;
    const boardEl = document.getElementById("board");
    const turnText = document.getElementById("turnText");
    const statusText = document.getElementById("statusText");
    const whiteCount = document.getElementById("whiteCount");
    const blackCount = document.getElementById("blackCount");
    const resetBtn = document.getElementById("resetBtn");
    const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    let board = [];
    let turn = "W";
    let selected = null;
    let winner = null;

    function resetGame() {
      board = Array.from({ length: size }, () => Array(size).fill(""));
      for (let col = 0; col < size; col++) {
        board[0][col] = "B";
        board[1][col] = "B";
        board[size - 2][col] = "W";
        board[size - 1][col] = "W";
      }
      turn = "W";
      selected = null;
      winner = null;
      render();
    }

    function sideName(side) {
      return side === "W" ? "白方" : "黑方";
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function legalMoves(row, col) {
      const piece = board[row][col];
      if (!piece || winner) return [];
      const moves = [];
      for (const [rowStep, colStep] of directions) {
        let nextRow = row + rowStep;
        let nextCol = col + colStep;
        while (inBounds(nextRow, nextCol) && !board[nextRow][nextCol]) {
          moves.push([nextRow, nextCol]);
          nextRow += rowStep;
          nextCol += colStep;
        }
      }
      return moves;
    }

    function countPieces(side) {
      return board.flat().filter((cell) => cell === side).length;
    }

    function hasMove(side) {
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          if (board[row][col] === side && legalMoves(row, col).length > 0) return true;
        }
      }
      return false;
    }

    function flipCaptured(row, col) {
      const side = board[row][col];
      const enemy = side === "W" ? "B" : "W";
      let flipped = 0;
      for (const [rowStep, colStep] of directions) {
        const line = [];
        let nextRow = row + rowStep;
        let nextCol = col + colStep;
        while (inBounds(nextRow, nextCol) && board[nextRow][nextCol] === enemy) {
          line.push([nextRow, nextCol]);
          nextRow += rowStep;
          nextCol += colStep;
        }
        if (line.length && inBounds(nextRow, nextCol) && board[nextRow][nextCol] === side) {
          for (const [flipRow, flipCol] of line) {
            board[flipRow][flipCol] = side;
            flipped++;
          }
        }
      }
      return flipped;
    }

    function checkWinner(nextTurn) {
      const white = countPieces("W");
      const black = countPieces("B");
      if (white === 0) return "B";
      if (black === 0) return "W";
      if (!hasMove(nextTurn)) return white === black ? "draw" : white > black ? "W" : "B";
      return null;
    }

    function movePiece(row, col) {
      if (!selected) return;
      const moves = legalMoves(selected.row, selected.col);
      if (!moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col)) return;
      const piece = board[selected.row][selected.col];
      board[selected.row][selected.col] = "";
      board[row][col] = piece;
      const flipped = flipCaptured(row, col);
      const nextTurn = turn === "W" ? "B" : "W";
      winner = checkWinner(nextTurn);
      selected = null;
      turn = nextTurn;
      render(flipped);
    }

    function handleCell(row, col) {
      if (winner) return;
      if (selected && !board[row][col]) {
        movePiece(row, col);
        return;
      }
      selected = board[row][col] === turn ? { row, col } : null;
      render();
    }

    function render(flipped = 0) {
      const moves = selected ? legalMoves(selected.row, selected.col) : [];
      boardEl.innerHTML = "";
      for (let row = 0; row < size; row++) {
        for (let col = 0; col < size; col++) {
          const isMove = moves.some(([moveRow, moveCol]) => moveRow === row && moveCol === col);
          const isSelected = selected && selected.row === row && selected.col === col;
          const button = document.createElement("button");
          button.className = [
            "flex aspect-square items-center justify-center border border-slate-800 text-xl font-black transition",
            (row + col) % 2 ? "bg-slate-700" : "bg-slate-600",
            isMove ? "bg-cyan-500 hover:bg-cyan-400" : "hover:brightness-110",
            isSelected ? "ring-4 ring-white ring-inset" : ""
          ].join(" ");
          button.setAttribute("aria-label", `${row + 1}-${col + 1}`);
          button.addEventListener("click", () => handleCell(row, col));
          if (board[row][col]) {
            const disk = document.createElement("span");
            disk.className = [
              "flex h-3/5 w-3/5 items-center justify-center rounded-full border-2 shadow-lg",
              board[row][col] === "W" ? "border-white bg-slate-100 text-slate-950" : "border-slate-300 bg-slate-950 text-white"
            ].join(" ");
            disk.textContent = board[row][col];
            button.appendChild(disk);
          }
          boardEl.appendChild(button);
        }
      }

      const white = countPieces("W");
      const black = countPieces("B");
      whiteCount.textContent = white;
      blackCount.textContent = black;
      turnText.textContent = winner ? (winner === "draw" ? "平局" : `${sideName(winner)}获胜`) : sideName(turn);
      statusText.textContent = winner
        ? `终局计分：白方 ${white}，黑方 ${black}。点击重新开始再来一局。`
        : selected
          ? `${sideName(turn)}已选中棋子，可滑行到 ${moves.length} 个空格。`
          : flipped > 0
            ? `刚刚翻转 ${flipped} 枚棋子。${sideName(turn)}行动。`
            : `${sideName(turn)}行动。滑行后把两端包夹的连续敌子翻成己方。`;
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
