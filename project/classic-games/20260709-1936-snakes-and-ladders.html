<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Snakes and Ladders</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-green-950 text-green-50"><main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-5"><header class="flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-2xl font-bold">Mini Snakes and Ladders</h1><p class="text-sm text-green-200">Roll the die, climb ladders, slide down snakes. First to square 36 wins.</p></div><button id="newGameBtn" class="rounded bg-yellow-300 px-4 py-2 font-semibold text-green-950 hover:bg-yellow-200">New Game</button></header><section class="grid gap-3 rounded border border-green-700 bg-green-900 p-3 sm:grid-cols-4"><div>Turn: <b id="turnLabel">Blue</b></div><div>Die: <b id="dieLabel">-</b></div><div>Blue: <b id="bluePos">1</b></div><div>Gold: <b id="goldPos">1</b></div><div class="sm:col-span-4" id="message">Roll to start.</div></section><section class="grid gap-4 lg:grid-cols-[1fr_220px]"><div id="board" class="grid aspect-square w-full max-w-xl grid-cols-6 grid-rows-6 gap-1 rounded border border-green-700 bg-green-900 p-2"></div><aside class="rounded border border-green-700 bg-green-900 p-3 text-sm"><button id="rollBtn" class="mb-3 w-full rounded bg-sky-300 px-4 py-3 font-semibold text-green-950 hover:bg-sky-200">Roll</button><div>Ladders: 3→14, 8→20, 15→26</div><div>Snakes: 34→22, 29→11, 24→6</div></aside></section></main><script>
const ladders={3:14,8:20,15:26},snakes={34:22,29:11,24:6},goal=36;let pos,turn,over;const el=id=>document.getElementById(id),boardEl=el('board'),turnLabel=el('turnLabel'),dieLabel=el('dieLabel'),bluePos=el('bluePos'),goldPos=el('goldPos'),message=el('message'),rollBtn=el('rollBtn'),newGameBtn=el('newGameBtn');function name(p){return p===0?'Blue':'Gold'}function squareNumber(row,col){const base=(5-row)*6;return row%2===1?base+col+1:base+(6-col)}function movePlayer(){if(over)return;const roll=1+Math.floor(Math.random()*6);dieLabel.textContent=roll;let next=pos[turn]+roll;if(next>goal){message.textContent=`${name(turn)} rolled ${roll} and needs an exact finish.`;turn=1-turn;render();return}let note=`${name(turn)} rolled ${roll}.`;if(ladders[next]){note+=` Ladder ${next} to ${ladders[next]}.`;next=ladders[next]}else if(snakes[next]){note+=` Snake ${next} to ${snakes[next]}.`;next=snakes[next]}pos[turn]=next;if(next===goal){over=true;message.textContent=`${note} ${name(turn)} wins.`}else{message.textContent=note;turn=1-turn}render()}function render(){turnLabel.textContent=over?'Game Over':name(turn);bluePos.textContent=pos[0];goldPos.textContent=pos[1];rollBtn.disabled=over;rollBtn.classList.toggle('opacity-50',over);boardEl.innerHTML='';for(let r=0;r<6;r++)for(let c=0;c<6;c++){const n=squareNumber(r,c),cell=document.createElement('div');cell.className='relative rounded border border-green-700 bg-green-800 p-1 text-xs';cell.innerHTML=`<span class="text-green-200">${n}</span>`;if(ladders[n])cell.innerHTML+=`<div class="text-lime-300">↑${ladders[n]}</div>`;if(snakes[n])cell.innerHTML+=`<div class="text-red-300">↓${snakes[n]}</div>`;if(pos[0]===n)cell.innerHTML+='<b class="absolute bottom-1 left-1 rounded bg-sky-300 px-1 text-green-950">B</b>';if(pos[1]===n)cell.innerHTML+='<b class="absolute bottom-1 right-1 rounded bg-yellow-300 px-1 text-green-950">G</b>';boardEl.appendChild(cell)}}function newGame(){pos=[1,1];turn=0;over=false;dieLabel.textContent='-';message.textContent='Roll to start.';render()}rollBtn.addEventListener('click',movePlayer);newGameBtn.addEventListener('click',newGame);newGame();
</script></body></html>
