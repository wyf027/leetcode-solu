<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Craps</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col items-center justify-center gap-5 px-4 py-8">
    <section class="w-full rounded-lg border border-emerald-700 bg-emerald-900 p-5 shadow-2xl">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-widest text-yellow-300">Classic Mini Game</p>
          <h1 class="mt-1 text-3xl font-bold text-white">Mini Craps</h1>
          <p class="mt-2 text-sm text-emerald-100">Roll 7 or 11 to win, avoid craps, then chase your point.</p>
        </div>
        <div class="grid grid-cols-3 gap-2 text-center text-sm">
          <div class="rounded-md bg-emerald-800 px-3 py-2">
            <div class="text-emerald-200">Chips</div>
            <div id="chips" class="text-xl font-bold text-white">100</div>
          </div>
          <div class="rounded-md bg-emerald-800 px-3 py-2">
            <div class="text-emerald-200">Point</div>
            <div id="point" class="text-xl font-bold text-white">--</div>
          </div>
          <div class="rounded-md bg-emerald-800 px-3 py-2">
            <div class="text-emerald-200">Round</div>
            <div id="round" class="text-xl font-bold text-white">1</div>
          </div>
        </div>
      </div>

      <div class="mt-6 rounded-lg border border-emerald-700 bg-emerald-950 p-5">
        <div class="flex justify-center gap-5">
          <div id="dieA" class="flex h-24 w-24 items-center justify-center rounded-lg bg-white text-5xl font-bold text-emerald-950 shadow-lg">1</div>
          <div id="dieB" class="flex h-24 w-24 items-center justify-center rounded-lg bg-white text-5xl font-bold text-emerald-950 shadow-lg">1</div>
        </div>
        <div class="mt-5 text-center">
          <div class="text-sm uppercase tracking-widest text-emerald-300">Last Roll</div>
          <div id="total" class="text-4xl font-bold text-yellow-200">2</div>
        </div>
      </div>

      <div class="mt-5 flex flex-wrap items-center justify-between gap-3">
        <p id="status" class="min-h-6 text-sm font-medium text-emerald-100">Place a pass-line roll. Come out with 7 or 11.</p>
        <div class="flex gap-2">
          <button id="rollBtn" class="rounded-md bg-yellow-300 px-4 py-2 text-sm font-semibold text-emerald-950 hover:bg-yellow-200">Roll Dice</button>
          <button id="resetBtn" class="rounded-md bg-emerald-700 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-600">Reset</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const chipsEl = document.getElementById('chips');
    const pointEl = document.getElementById('point');
    const roundEl = document.getElementById('round');
    const dieAEl = document.getElementById('dieA');
    const dieBEl = document.getElementById('dieB');
    const totalEl = document.getElementById('total');
    const statusEl = document.getElementById('status');
    const rollBtn = document.getElementById('rollBtn');
    const resetBtn = document.getElementById('resetBtn');

    let chips = 100;
    let point = null;
    let round = 1;
    let rolling = false;

    function resetGame() {
      chips = 100;
      point = null;
      round = 1;
      rolling = false;
      dieAEl.textContent = '1';
      dieBEl.textContent = '1';
      totalEl.textContent = '2';
      statusEl.textContent = 'Place a pass-line roll. Come out with 7 or 11.';
      updateHud();
    }

    function rollDie() {
      return 1 + Math.floor(Math.random() * 6);
    }

    function rollDice() {
      if (rolling) return;
      rolling = true;
      rollBtn.disabled = true;
      rollBtn.classList.add('opacity-60');
      let spins = 0;
      const timer = setInterval(() => {
        const a = rollDie();
        const b = rollDie();
        showDice(a, b);
        spins += 1;
        if (spins >= 10) {
          clearInterval(timer);
          resolveRoll(a, b);
        }
      }, 70);
    }

    function showDice(a, b) {
      dieAEl.textContent = a;
      dieBEl.textContent = b;
      totalEl.textContent = a + b;
    }

    function resolveRoll(a, b) {
      const sum = a + b;
      if (point === null) {
        handleComeOut(sum);
      } else {
        handlePointRoll(sum);
      }
      rolling = false;
      rollBtn.disabled = false;
      rollBtn.classList.remove('opacity-60');
      updateHud();
    }

    function handleComeOut(sum) {
      if (sum === 7 || sum === 11) {
        chips += 10;
        round += 1;
        statusEl.textContent = `${sum} wins on the come-out. +10 chips.`;
      } else if ([2, 3, 12].includes(sum)) {
        chips = Math.max(0, chips - 10);
        round += 1;
        statusEl.textContent = `${sum} craps out. -10 chips.`;
      } else {
        point = sum;
        statusEl.textContent = `Point is ${point}. Roll it again before 7.`;
      }
    }

    function handlePointRoll(sum) {
      if (sum === point) {
        chips += 15;
        round += 1;
        statusEl.textContent = `Made the point ${point}. +15 chips.`;
        point = null;
      } else if (sum === 7) {
        chips = Math.max(0, chips - 15);
        round += 1;
        statusEl.textContent = `Seven out before ${point}. -15 chips.`;
        point = null;
      } else {
        statusEl.textContent = `${sum} rolls on. Point remains ${point}.`;
      }
    }

    function updateHud() {
      chipsEl.textContent = chips;
      pointEl.textContent = point || '--';
      roundEl.textContent = round;
      if (chips === 0) {
        statusEl.textContent = 'Out of chips. Reset to buy back in.';
        rollBtn.disabled = true;
        rollBtn.classList.add('opacity-60');
      }
    }

    rollBtn.addEventListener('click', rollDice);
    resetBtn.addEventListener('click', resetGame);
    resetGame();
  </script>
</body>
</html>
