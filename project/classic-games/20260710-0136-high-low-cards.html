<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini High-Low Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-rose-950 text-rose-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini High-Low Cards</h1>
        <p class="text-sm text-rose-200">Guess whether the next card will be higher or lower. Ties break your streak.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-rose-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-rose-700 bg-rose-900 p-3 sm:grid-cols-4">
      <div>Score: <b id="scoreText">0</b></div>
      <div>Streak: <b id="streakText">0</b></div>
      <div>Cards Left: <b id="cardsLeftText">0</b></div>
      <div id="message">Guess the next card.</div>
    </section>

    <section class="grid gap-4 rounded border border-rose-700 bg-rose-900 p-4 sm:grid-cols-2">
      <div class="text-center">
        <div class="mb-2 text-sm uppercase tracking-wide text-rose-200">Current card</div>
        <div id="currentCard" class="mx-auto flex aspect-[2/3] max-w-40 items-center justify-center rounded border-4 border-white bg-white text-5xl font-black text-rose-950 shadow"></div>
      </div>
      <div class="text-center">
        <div class="mb-2 text-sm uppercase tracking-wide text-rose-200">Last reveal</div>
        <div id="lastCard" class="mx-auto flex aspect-[2/3] max-w-40 items-center justify-center rounded border-4 border-rose-300 bg-rose-100 text-5xl font-black text-rose-950 shadow">?</div>
      </div>
    </section>

    <section class="grid gap-3 sm:grid-cols-2">
      <button id="higherBtn" class="rounded bg-lime-300 px-5 py-3 font-semibold text-rose-950 hover:bg-lime-200">Higher</button>
      <button id="lowerBtn" class="rounded bg-sky-300 px-5 py-3 font-semibold text-rose-950 hover:bg-sky-200">Lower</button>
    </section>
  </main>

  <script>
    const ranks = [
      { label: "A", value: 1 },
      { label: "2", value: 2 },
      { label: "3", value: 3 },
      { label: "4", value: 4 },
      { label: "5", value: 5 },
      { label: "6", value: 6 },
      { label: "7", value: 7 },
      { label: "8", value: 8 },
      { label: "9", value: 9 },
      { label: "10", value: 10 },
      { label: "J", value: 11 },
      { label: "Q", value: 12 },
      { label: "K", value: 13 }
    ];
    const suits = ["♠", "♥", "♦", "♣"];
    const el = (id) => document.getElementById(id);
    const scoreText = el("scoreText");
    const streakText = el("streakText");
    const cardsLeftText = el("cardsLeftText");
    const message = el("message");
    const currentCard = el("currentCard");
    const lastCard = el("lastCard");
    const higherBtn = el("higherBtn");
    const lowerBtn = el("lowerBtn");
    const newGameBtn = el("newGameBtn");

    let deck;
    let current;
    let score;
    let streak;
    let finished;

    function buildDeck() {
      return suits.flatMap((suit) => ranks.map((rank) => ({ ...rank, suit })));
    }

    function shuffle(cards) {
      for (let i = cards.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function cardLabel(card) {
      return `${card.label}${card.suit}`;
    }

    function makeGuess(direction) {
      if (finished) return;
      const next = deck.pop();
      lastCard.textContent = cardLabel(next);
      const isHigher = next.value > current.value;
      const isLower = next.value < current.value;
      const correct = direction === "higher" ? isHigher : isLower;
      if (correct) {
        streak += 1;
        score += 10 + streak;
        message.textContent = `Correct. ${cardLabel(next)} was ${direction}.`;
      } else {
        streak = 0;
        message.textContent = next.value === current.value ? "Tie. Streak reset." : `Wrong. ${cardLabel(next)} went the other way.`;
      }
      current = next;
      if (!deck.length) {
        finished = true;
        message.textContent = `Deck finished. Final score: ${score}.`;
      }
      render();
    }

    function render() {
      currentCard.textContent = cardLabel(current);
      scoreText.textContent = score;
      streakText.textContent = streak;
      cardsLeftText.textContent = deck.length;
      higherBtn.disabled = finished;
      lowerBtn.disabled = finished;
    }

    function newGame() {
      deck = shuffle(buildDeck());
      current = deck.pop();
      score = 0;
      streak = 0;
      finished = false;
      lastCard.textContent = "?";
      message.textContent = "Guess the next card.";
      render();
    }

    higherBtn.addEventListener("click", () => makeGuess("higher"));
    lowerBtn.addEventListener("click", () => makeGuess("lower"));
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
