<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Shisima</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-indigo-950 text-indigo-50">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-6 px-4 py-6 lg:flex-row lg:items-center">
    <section class="flex-1">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-3xl font-bold tracking-normal text-fuchsia-200">Mini Shisima</h1>
          <p class="mt-1 max-w-2xl text-sm leading-6 text-indigo-100">肯尼亚三子棋。双方各三枚棋子，沿八角外圈或中心连线移动到相邻空点，率先让三枚棋子成一直线获胜。</p>
        </div>
        <button id="resetBtn" class="rounded bg-fuchsia-300 px-4 py-2 text-sm font-bold text-indigo-950 hover:bg-fuchsia-200">重开</button>
      </div>

      <div class="relative mx-auto aspect-square w-full max-w-[560px] rounded border border-indigo-700 bg-indigo-900 shadow-2xl">
        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="50,12 77,23 88,50 77,77 50,88 23,77 12,50 23,23" fill="none" stroke="#818cf8" stroke-width="1.3" />
          <g stroke="#818cf8" stroke-width="1.1">
            <line x1="50" y1="12" x2="50" y2="50" />
            <line x1="77" y1="23" x2="50" y2="50" />
            <line x1="88" y1="50" x2="50" y2="50" />
            <line x1="77" y1="77" x2="50" y2="50" />
            <line x1="50" y1="88" x2="50" y2="50" />
            <line x1="23" y1="77" x2="50" y2="50" />
            <line x1="12" y1="50" x2="50" y2="50" />
            <line x1="23" y1="23" x2="50" y2="50" />
          </g>
        </svg>
        <div id="board" class="absolute inset-0"></div>
      </div>
    </section>

    <aside class="w-full rounded border border-indigo-700 bg-indigo-900 p-4 lg:w-80">
      <div class="grid grid-cols-2 gap-3 text-sm">
        <div class="rounded bg-indigo-800 p-3">
          <div class="text-indigo-200">当前回合</div>
          <div id="turnText" class="mt-1 text-xl font-bold text-fuchsia-200">紫方</div>
        </div>
        <div class="rounded bg-indigo-800 p-3">
          <div class="text-indigo-200">步数</div>
          <div id="moveText" class="mt-1 text-xl font-bold text-fuchsia-200">0</div>
        </div>
      </div>
      <p id="statusText" class="mt-4 min-h-20 rounded bg-indigo-800 p-3 text-sm leading-6 text-indigo-50">请选择紫方棋子。</p>
    </aside>
  </main>

  <script>
    const points = [
      { x: 50, y: 12 },
      { x: 77, y: 23 },
      { x: 88, y: 50 },
      { x: 77, y: 77 },
      { x: 50, y: 88 },
      { x: 23, y: 77 },
      { x: 12, y: 50 },
      { x: 23, y: 23 },
      { x: 50, y: 50 }
    ];
    const center = 8;
    const lines = [
      [0, 8, 4], [1, 8, 5], [2, 8, 6], [3, 8, 7],
      [0, 1, 2], [2, 3, 4], [4, 5, 6], [6, 7, 0]
    ];
    const boardEl = document.getElementById("board");
    const turnEl = document.getElementById("turnText");
    const moveEl = document.getElementById("moveText");
    const statusEl = document.getElementById("statusText");
    let cells = [];
    let current = "P";
    let selected = null;
    let moves = 0;
    let winner = null;

    function resetGame() {
      cells = ["P", "P", "P", "", "", "G", "G", "G", ""];
      current = "P";
      selected = null;
      moves = 0;
      winner = null;
      render("请选择紫方棋子。");
    }

    function neighbors(index) {
      if (index === center) return [0, 1, 2, 3, 4, 5, 6, 7];
      return [(index + 7) % 8, (index + 1) % 8, center];
    }

    function legalMovesFrom(index) {
      if (winner || cells[index] !== current) return [];
      return neighbors(index).filter((target) => !cells[target]);
    }

    function hasAnyMove(side) {
      const saved = current;
      current = side;
      const result = cells.some((piece, index) => piece === side && legalMovesFrom(index).length > 0);
      current = saved;
      return result;
    }

    function selectPoint(index) {
      if (winner) return;
      if (selected !== null && legalMovesFrom(selected).includes(index)) {
        movePiece(selected, index);
        return;
      }
      if (cells[index] === current && legalMovesFrom(index).length) {
        selected = index;
        render(`${sideName(current)}已选中棋子。`);
      } else {
        selected = null;
        render(`${sideName(current)}请选择可移动棋子。`);
      }
    }

    function movePiece(from, to) {
      cells[to] = cells[from];
      cells[from] = "";
      selected = null;
      moves += 1;
      if (checkWinner(current)) {
        winner = current;
        render(`${sideName(current)}三子成线并获胜。`);
        return;
      }
      current = current === "P" ? "G" : "P";
      if (!hasAnyMove(current)) {
        winner = current === "P" ? "G" : "P";
        render(`${sideName(winner)}获胜，对手无合法移动。`);
        return;
      }
      render(`${sideName(current)}行动。`);
    }

    function checkWinner(side) {
      return lines.some((line) => line.every((index) => cells[index] === side));
    }

    function sideName(side) {
      return side === "P" ? "紫方" : "绿方";
    }

    function pieceClasses(piece) {
      if (piece === "P") return "bg-fuchsia-300 text-indigo-950 ring-2 ring-fuchsia-100";
      if (piece === "G") return "bg-emerald-300 text-indigo-950 ring-2 ring-emerald-100";
      return "bg-indigo-800 text-transparent ring-2 ring-indigo-500";
    }

    function render(message) {
      const legal = selected === null ? [] : legalMovesFrom(selected);
      boardEl.innerHTML = points.map((point, index) => {
        const piece = cells[index];
        const size = index === center ? 18 : 15;
        const isSelected = selected === index;
        const isLegal = legal.includes(index);
        return `<button type="button" onclick="selectPoint(${index})" aria-label="point ${index + 1}"
          class="absolute flex items-center justify-center rounded-full text-lg font-black transition ${pieceClasses(piece)}
          ${isSelected ? "scale-110 outline outline-4 outline-white" : ""}
          ${isLegal ? "outline outline-4 outline-amber-200" : "hover:scale-105"}"
          style="left:${point.x}%; top:${point.y}%; width:${size}%; height:${size}%; transform:translate(-50%, -50%);">${piece || (isLegal ? "·" : "")}</button>`;
      }).join("");
      turnEl.textContent = winner ? sideName(winner) : sideName(current);
      turnEl.className = `mt-1 text-xl font-bold ${current === "P" ? "text-fuchsia-200" : "text-emerald-200"}`;
      moveEl.textContent = String(moves);
      statusEl.textContent = winner ? `${sideName(winner)}获胜。` : message;
    }

    document.getElementById("resetBtn").addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
