<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Peg Solitaire Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Peg Solitaire Lite</h1>
        <p class="text-sm text-slate-300">Jump one peg over another into an empty hole. Remove the jumped peg and leave as few as possible.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-cyan-300 px-4 py-2 font-semibold text-slate-950 hover:bg-cyan-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-slate-700 bg-slate-900 p-3 sm:grid-cols-3">
      <div>Pegs: <b id="pegText">0</b></div>
      <div>Moves: <b id="moveText">0</b></div>
      <div id="message" class="text-slate-200">Pick a peg with a legal jump.</div>
    </section>

    <section id="board" class="grid aspect-square max-h-[72vh] grid-cols-5 gap-2 self-center"></section>
  </main>

  <script>
    const boardEl = document.getElementById("board");
    const pegText = document.getElementById("pegText");
    const moveText = document.getElementById("moveText");
    const message = document.getElementById("message");
    const newGameBtn = document.getElementById("newGameBtn");
    const size = 5;
    const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    let board = [];
    let selected = null;
    let moves = 0;

    function index(row, col) {
      return row * size + col;
    }

    function position(cell) {
      return [Math.floor(cell / size), cell % size];
    }

    function inBounds(row, col) {
      return row >= 0 && row < size && col >= 0 && col < size;
    }

    function countPegs() {
      return board.filter(Boolean).length;
    }

    function legalMoves(from) {
      if (!board[from]) return [];
      const [row, col] = position(from);
      return directions.flatMap(([dr, dc]) => {
        const middleRow = row + dr;
        const middleCol = col + dc;
        const targetRow = row + dr * 2;
        const targetCol = col + dc * 2;
        if (!inBounds(targetRow, targetCol)) return [];
        const middle = index(middleRow, middleCol);
        const target = index(targetRow, targetCol);
        return board[middle] && !board[target] ? [{ middle, target }] : [];
      });
    }

    function hasAnyMove() {
      return board.some((peg, cell) => peg && legalMoves(cell).length > 0);
    }

    function jumpTo(target) {
      if (selected === null) return false;
      const move = legalMoves(selected).find((item) => item.target === target);
      if (!move) return false;
      board[selected] = false;
      board[move.middle] = false;
      board[target] = true;
      selected = null;
      moves += 1;
      const pegs = countPegs();
      if (pegs === 1) {
        message.textContent = "Perfect finish. One peg remains.";
      } else if (!hasAnyMove()) {
        message.textContent = `No legal jumps remain. Final pegs: ${pegs}.`;
      } else {
        message.textContent = "Jump made. Keep clearing pegs.";
      }
      render();
      return true;
    }

    function handleCellClick(cell) {
      if (board[cell]) {
        selected = selected === cell ? null : cell;
        message.textContent = selected === null ? "Selection cleared." : "Choose a highlighted empty hole.";
        render();
        return;
      }
      if (!jumpTo(cell)) {
        message.textContent = "That hole is not a legal landing.";
      }
    }

    function render() {
      boardEl.innerHTML = "";
      const legalTargets = selected === null ? [] : legalMoves(selected).map((move) => move.target);
      board.forEach((hasPeg, cell) => {
        const hole = document.createElement("button");
        const target = legalTargets.includes(cell);
        hole.className = [
          "flex aspect-square items-center justify-center rounded-full border text-3xl font-bold transition",
          hasPeg ? "border-cyan-200 bg-cyan-300 text-slate-950 shadow" : "border-slate-600 bg-slate-900 text-transparent",
          selected === cell ? "ring-4 ring-amber-300" : "",
          target ? "ring-4 ring-lime-300 hover:bg-slate-700" : ""
        ].join(" ");
        hole.textContent = hasPeg ? "●" : ".";
        hole.addEventListener("click", () => handleCellClick(cell));
        boardEl.appendChild(hole);
      });
      pegText.textContent = String(countPegs());
      moveText.textContent = String(moves);
    }

    function newGame() {
      board = Array(size * size).fill(true);
      [0, 4, 20, 24, 12].forEach((cell) => {
        board[cell] = false;
      });
      selected = null;
      moves = 0;
      message.textContent = "Pick a peg with a legal jump.";
      render();
    }

    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
