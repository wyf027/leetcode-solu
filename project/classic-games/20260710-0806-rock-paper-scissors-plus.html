<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Rock Paper Scissors</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-slate-700 bg-slate-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-cyan-300">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Rock Paper Scissors</h1>
        </div>
        <button id="resetBtn" class="rounded bg-cyan-400 px-4 py-2 font-semibold text-slate-950 hover:bg-cyan-300">
          Restart
        </button>
      </div>

      <div class="grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-slate-700 bg-slate-800 p-4">
          <p class="text-sm text-slate-400">You</p>
          <p id="playerScore" class="text-4xl font-bold">0</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-800 p-4">
          <p class="text-sm text-slate-400">Streak</p>
          <p id="streakScore" class="text-4xl font-bold">0</p>
        </div>
        <div class="rounded border border-slate-700 bg-slate-800 p-4">
          <p class="text-sm text-slate-400">Computer</p>
          <p id="computerScore" class="text-4xl font-bold">0</p>
        </div>
      </div>

      <div class="my-6 rounded border border-slate-700 bg-slate-950 p-4 text-center">
        <p id="roundText" class="text-lg font-semibold">Pick a move to start the round.</p>
        <p id="detailText" class="mt-2 min-h-6 text-sm text-slate-400"></p>
      </div>

      <div id="choices" class="grid grid-cols-3 gap-3">
        <button data-choice="rock" class="rounded bg-slate-800 px-3 py-4 text-lg font-bold hover:bg-slate-700">Rock</button>
        <button data-choice="paper" class="rounded bg-slate-800 px-3 py-4 text-lg font-bold hover:bg-slate-700">Paper</button>
        <button data-choice="scissors" class="rounded bg-slate-800 px-3 py-4 text-lg font-bold hover:bg-slate-700">Scissors</button>
      </div>

      <p class="mt-5 text-sm text-slate-400">
        First to 5 wins the match. Winning rounds add to your streak; losses reset it.
      </p>
    </section>
  </main>

  <script>
    const moves = ["rock", "paper", "scissors"];
    const labels = { rock: "Rock", paper: "Paper", scissors: "Scissors" };
    const beats = { rock: "scissors", paper: "rock", scissors: "paper" };
    const state = { player: 0, computer: 0, streak: 0, matchOver: false };

    const playerScore = document.getElementById("playerScore");
    const computerScore = document.getElementById("computerScore");
    const streakScore = document.getElementById("streakScore");
    const roundText = document.getElementById("roundText");
    const detailText = document.getElementById("detailText");
    const choices = document.getElementById("choices");
    const resetBtn = document.getElementById("resetBtn");

    function render() {
      playerScore.textContent = state.player;
      computerScore.textContent = state.computer;
      streakScore.textContent = state.streak;
    }

    function decideWinner(playerMove, computerMove) {
      if (playerMove === computerMove) return "draw";
      return beats[playerMove] === computerMove ? "player" : "computer";
    }

    function playRound(playerMove) {
      if (state.matchOver) return;

      const computerMove = moves[Math.floor(Math.random() * moves.length)];
      const winner = decideWinner(playerMove, computerMove);

      detailText.textContent = `You picked ${labels[playerMove]}; computer picked ${labels[computerMove]}.`;

      if (winner === "draw") {
        roundText.textContent = "Draw round.";
      } else if (winner === "player") {
        state.player += 1;
        state.streak += 1;
        roundText.textContent = `${labels[playerMove]} beats ${labels[computerMove]}. You score.`;
      } else {
        state.computer += 1;
        state.streak = 0;
        roundText.textContent = `${labels[computerMove]} beats ${labels[playerMove]}. Computer scores.`;
      }

      if (state.player >= 5 || state.computer >= 5) {
        state.matchOver = true;
        roundText.textContent = state.player > state.computer ? "Match won. Restart for another run." : "Match lost. Restart for another run.";
      }

      render();
    }

    function resetGame() {
      state.player = 0;
      state.computer = 0;
      state.streak = 0;
      state.matchOver = false;
      roundText.textContent = "Pick a move to start the round.";
      detailText.textContent = "";
      render();
    }

    choices.addEventListener("click", (event) => {
      const button = event.target.closest("[data-choice]");
      if (!button) return;
      playRound(button.dataset.choice);
    });

    resetBtn.addEventListener("click", resetGame);
    render();
  </script>
</body>
</html>
