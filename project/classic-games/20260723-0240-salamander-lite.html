<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Salamander 沙罗曼蛇</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-col gap-3 border-b border-rose-400/30 pb-4 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-widest text-rose-300">Classic Games</p>
        <h1 class="text-3xl font-bold text-white">Mini Salamander 沙罗曼蛇</h1>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        <div class="border border-rose-400/30 bg-rose-950/40 px-3 py-2">
          <div class="text-rose-200">分数</div>
          <div id="score" class="text-xl font-bold">0</div>
        </div>
        <div class="border border-rose-400/30 bg-rose-950/40 px-3 py-2">
          <div class="text-rose-200">护盾</div>
          <div id="shield" class="text-xl font-bold">3</div>
        </div>
        <div class="border border-rose-400/30 bg-rose-950/40 px-3 py-2">
          <div class="text-rose-200">火力</div>
          <div id="power" class="text-xl font-bold">1</div>
        </div>
        <div class="border border-rose-400/30 bg-rose-950/40 px-3 py-2">
          <div class="text-rose-200">进度</div>
          <div id="progress" class="text-xl font-bold">0</div>
        </div>
      </div>
    </header>

    <section class="grid gap-4 lg:grid-cols-[1fr_220px]">
      <canvas id="game" width="760" height="480" class="h-auto w-full border border-rose-400/40 bg-black"></canvas>
      <aside class="space-y-3 text-sm text-stone-300">
        <div class="border border-stone-700 bg-stone-900/80 p-3">
          <h2 class="mb-2 font-semibold text-rose-200">操作</h2>
          <p>方向键 / WASD：移动</p>
          <p>空格：射击</p>
          <p>R：重新开始</p>
        </div>
        <div class="border border-stone-700 bg-stone-900/80 p-3">
          <h2 class="mb-2 font-semibold text-rose-200">目标</h2>
          <p>穿过生体通道，拾取能量球升级火力，击破 18 个飞虫后摧毁蛇形核心。</p>
        </div>
        <button id="restart" class="w-full border border-rose-300 bg-rose-400 px-4 py-2 font-bold text-stone-950 hover:bg-rose-200">
          重新开始
        </button>
      </aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const shieldEl = document.getElementById("shield");
    const powerEl = document.getElementById("power");
    const progressEl = document.getElementById("progress");
    const restartBtn = document.getElementById("restart");

    const keys = new Set();
    const player = { x: 76, y: 230, w: 42, h: 22, shield: 3, power: 1, fire: 0, invuln: 0 };
    let bullets = [];
    let enemies = [];
    let enemyShots = [];
    let powerups = [];
    let tendrils = [];
    let boss = null;
    let score = 0;
    let kills = 0;
    let frame = 0;
    let spawnTimer = 0;
    let state = "playing";
    let lastTime = 0;

    function resetGame() {
      player.x = 76;
      player.y = 230;
      player.shield = 3;
      player.power = 1;
      player.fire = 0;
      player.invuln = 0;
      bullets = [];
      enemies = [];
      enemyShots = [];
      powerups = [];
      boss = null;
      score = 0;
      kills = 0;
      frame = 0;
      spawnTimer = 28;
      state = "playing";
      tendrils = Array.from({ length: 9 }, (_, i) => ({
        x: 210 + i * 82,
        top: 38 + Math.random() * 70,
        gap: 190 + Math.random() * 60,
        phase: Math.random() * Math.PI * 2,
      }));
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      shieldEl.textContent = player.shield;
      powerEl.textContent = player.power;
      progressEl.textContent = boss ? "Boss" : `${kills}/18`;
    }

    function rectsHit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function shoot() {
      if (player.fire > 0) return;
      const lanes = player.power >= 3 ? [-9, 0, 9] : player.power >= 2 ? [-6, 6] : [0];
      lanes.forEach((offset) => bullets.push({ x: player.x + player.w, y: player.y + 9 + offset, w: 18, h: 5, vx: 9 }));
      player.fire = Math.max(5, 13 - player.power * 2);
    }

    function spawnEnemy() {
      enemies.push({
        x: canvas.width + 30,
        y: 55 + Math.random() * (canvas.height - 110),
        w: 34,
        h: 24,
        hp: kills > 9 ? 2 : 1,
        vx: -2.7 - Math.random() * 1.6,
        phase: Math.random() * Math.PI * 2,
        fire: 50 + Math.random() * 80,
      });
    }

    function spawnBoss() {
      boss = {
        x: canvas.width + 100,
        y: 178,
        w: 128,
        h: 92,
        hp: 28,
        phase: 0,
        fire: 35,
      };
    }

    function hurtPlayer() {
      if (player.invuln > 0 || state !== "playing") return;
      player.shield -= 1;
      player.power = Math.max(1, player.power - 1);
      player.invuln = 80;
      if (player.shield <= 0) state = "lost";
      updateHud();
    }

    function update() {
      if (state !== "playing") return;
      frame += 1;
      const speed = 4.1;
      if (keys.has("ArrowUp") || keys.has("w")) player.y -= speed;
      if (keys.has("ArrowDown") || keys.has("s")) player.y += speed;
      if (keys.has("ArrowLeft") || keys.has("a")) player.x -= speed;
      if (keys.has("ArrowRight") || keys.has("d")) player.x += speed;
      if (keys.has(" ")) shoot();
      player.x = Math.max(12, Math.min(canvas.width - player.w - 16, player.x));
      player.y = Math.max(18, Math.min(canvas.height - player.h - 18, player.y));
      player.fire = Math.max(0, player.fire - 1);
      player.invuln = Math.max(0, player.invuln - 1);

      tendrils.forEach((t) => {
        t.x -= 1.15;
        t.phase += 0.025;
        if (t.x < -70) {
          t.x = canvas.width + 60;
          t.top = 36 + Math.random() * 82;
          t.gap = 185 + Math.random() * 64;
        }
      });

      if (!boss) {
        spawnTimer -= 1;
        if (spawnTimer <= 0 && kills < 18) {
          spawnEnemy();
          spawnTimer = Math.max(28, 68 - kills);
        }
        if (kills >= 18) spawnBoss();
      }

      bullets.forEach((b) => (b.x += b.vx));
      bullets = bullets.filter((b) => b.x < canvas.width + 40);
      enemies.forEach((enemy) => {
        enemy.x += enemy.vx;
        enemy.phase += 0.06;
        enemy.y += Math.sin(enemy.phase) * 1.8;
        enemy.fire -= 1;
        if (enemy.fire <= 0) {
          enemyShots.push({ x: enemy.x + 4, y: enemy.y + 12, w: 11, h: 5, vx: -4.8, vy: Math.sin(enemy.phase) * 1.4 });
          enemy.fire = 65 + Math.random() * 70;
        }
      });
      enemies = enemies.filter((enemy) => enemy.x > -80 && enemy.hp > 0);
      enemyShots.forEach((shot) => {
        shot.x += shot.vx;
        shot.y += shot.vy;
      });
      enemyShots = enemyShots.filter((shot) => shot.x > -40 && shot.y > -30 && shot.y < canvas.height + 30);
      powerups.forEach((p) => {
        p.x -= 2.2;
        p.y += Math.sin((frame + p.phase) / 10) * 0.7;
      });
      powerups = powerups.filter((p) => p.x > -30);

      if (boss) {
        boss.x = Math.max(592, boss.x - 1.2);
        boss.phase += 0.045;
        boss.y = 178 + Math.sin(boss.phase) * 48;
        boss.fire -= 1;
        if (boss.fire <= 0) {
          enemyShots.push({ x: boss.x + 18, y: boss.y + 30, w: 13, h: 5, vx: -5.3, vy: -1.5 });
          enemyShots.push({ x: boss.x + 12, y: boss.y + 54, w: 13, h: 5, vx: -5.5, vy: 0 });
          enemyShots.push({ x: boss.x + 18, y: boss.y + 78, w: 13, h: 5, vx: -5.3, vy: 1.5 });
          boss.fire = 42;
        }
      }

      bullets.forEach((bullet) => {
        enemies.forEach((enemy) => {
          if (rectsHit(bullet, enemy)) {
            bullet.x = canvas.width + 100;
            enemy.hp -= 1;
            if (enemy.hp <= 0) {
              score += 100;
              kills += 1;
              if (Math.random() < 0.5) powerups.push({ x: enemy.x + 10, y: enemy.y + 7, w: 16, h: 16, phase: Math.random() * 30 });
            }
          }
        });
        if (boss && rectsHit(bullet, { x: boss.x + 20, y: boss.y + 20, w: boss.w - 42, h: boss.h - 40 })) {
          bullet.x = canvas.width + 100;
          boss.hp -= 1;
          score += 30;
          if (boss.hp <= 0) {
            score += 1500;
            state = "won";
          }
        }
      });

      const ship = { x: player.x + 4, y: player.y + 3, w: player.w - 8, h: player.h - 6 };
      tendrils.forEach((t) => {
        const wave = Math.sin(t.phase) * 16;
        const top = { x: t.x, y: 0, w: 34, h: t.top + wave };
        const bottom = { x: t.x, y: t.top + t.gap + wave, w: 34, h: canvas.height };
        if (rectsHit(ship, top) || rectsHit(ship, bottom)) hurtPlayer();
      });
      enemies.forEach((enemy) => rectsHit(ship, enemy) && hurtPlayer());
      if (boss && rectsHit(ship, { x: boss.x + 16, y: boss.y + 16, w: boss.w - 28, h: boss.h - 28 })) hurtPlayer();
      enemyShots.forEach((shot) => {
        if (rectsHit(ship, shot)) {
          shot.x = -100;
          hurtPlayer();
        }
      });
      powerups.forEach((p) => {
        if (rectsHit(ship, p)) {
          p.x = -100;
          player.power = Math.min(3, player.power + 1);
          score += 60;
        }
      });
      updateHud();
    }

    function drawPlayer() {
      ctx.save();
      ctx.globalAlpha = player.invuln > 0 && Math.floor(player.invuln / 5) % 2 === 0 ? 0.35 : 1;
      ctx.fillStyle = "#fb7185";
      ctx.beginPath();
      ctx.moveTo(player.x, player.y + player.h / 2);
      ctx.lineTo(player.x + 18, player.y);
      ctx.lineTo(player.x + player.w, player.y + 8);
      ctx.lineTo(player.x + player.w, player.y + player.h - 8);
      ctx.lineTo(player.x + 18, player.y + player.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#ffe4e6";
      ctx.fillRect(player.x + 18, player.y + 8, 12, 7);
      ctx.restore();
    }

    function drawEnemy(enemy) {
      ctx.fillStyle = enemy.hp > 1 ? "#f97316" : "#f43f5e";
      ctx.beginPath();
      ctx.ellipse(enemy.x + 17, enemy.y + 12, 17, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fecdd3";
      ctx.beginPath();
      ctx.moveTo(enemy.x + 30, enemy.y + 12);
      ctx.lineTo(enemy.x + 42, enemy.y + 3);
      ctx.lineTo(enemy.x + 42, enemy.y + 21);
      ctx.closePath();
      ctx.fill();
    }

    function drawBoss() {
      if (!boss) return;
      ctx.fillStyle = "#be123c";
      ctx.beginPath();
      ctx.ellipse(boss.x + 58, boss.y + 46, 62, 40, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#881337";
      for (let i = 0; i < 5; i += 1) {
        ctx.beginPath();
        ctx.arc(boss.x + 92 + i * 14, boss.y + 42 + Math.sin(boss.phase + i) * 18, 15, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#fecdd3";
      ctx.beginPath();
      ctx.arc(boss.x + 24, boss.y + 36, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fda4af";
      ctx.fillRect(boss.x + 16, boss.y - 12, Math.max(0, boss.hp) * 3, 6);
    }

    function drawTendrils() {
      tendrils.forEach((t) => {
        const wave = Math.sin(t.phase) * 16;
        ctx.fillStyle = "#7f1d1d";
        ctx.fillRect(t.x, 0, 34, t.top + wave);
        ctx.fillRect(t.x, t.top + t.gap + wave, 34, canvas.height);
        ctx.fillStyle = "#fb7185";
        for (let y = 8; y < t.top + wave; y += 26) ctx.fillRect(t.x + 5, y, 24, 8);
        for (let y = t.top + t.gap + wave + 8; y < canvas.height; y += 26) ctx.fillRect(t.x + 5, y, 24, 8);
      });
    }

    function drawOverlay() {
      if (state === "playing") return;
      ctx.fillStyle = "rgba(28, 25, 23, 0.82)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.textAlign = "center";
      ctx.fillStyle = state === "won" ? "#fda4af" : "#fb7185";
      ctx.font = "bold 34px sans-serif";
      ctx.fillText(state === "won" ? "核心击破" : "护盾耗尽", canvas.width / 2, 220);
      ctx.fillStyle = "#e7e5e4";
      ctx.font = "18px sans-serif";
      ctx.fillText("按 R 或点击重新开始", canvas.width / 2, 256);
      ctx.textAlign = "left";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      bg.addColorStop(0, "#1c1917");
      bg.addColorStop(0.55, "#450a0a");
      bg.addColorStop(1, "#020617");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(254, 205, 211, 0.16)";
      for (let x = (frame * -1.2) % 54; x < canvas.width; x += 54) {
        ctx.beginPath();
        ctx.arc(x, 70 + Math.sin((x + frame) / 36) * 22, 5, 0, Math.PI * 2);
        ctx.arc(x + 25, 355 + Math.cos((x + frame) / 46) * 28, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      drawTendrils();
      bullets.forEach((bullet) => {
        ctx.fillStyle = "#fef08a";
        ctx.fillRect(bullet.x, bullet.y, bullet.w, bullet.h);
      });
      enemies.forEach(drawEnemy);
      drawBoss();
      powerups.forEach((p) => {
        ctx.fillStyle = "#fef3c7";
        ctx.beginPath();
        ctx.arc(p.x + 8, p.y + 8, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e11d48";
        ctx.fillRect(p.x + 4, p.y + 7, 8, 2);
      });
      enemyShots.forEach((shot) => {
        ctx.fillStyle = "#fb923c";
        ctx.fillRect(shot.x, shot.y, shot.w, shot.h);
      });
      drawPlayer();
      ctx.fillStyle = "#fecdd3";
      ctx.font = "14px sans-serif";
      ctx.fillText(boss ? `Boss HP ${Math.max(0, boss.hp)}` : `飞虫 ${kills}/18`, 16, 24);
      drawOverlay();
    }

    function loop(time) {
      if (time - lastTime > 16) {
        update();
        draw();
        lastTime = time;
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " ", "w", "a", "s", "d"].includes(event.key) || ["w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
      }
      keys.add(event.key);
      keys.add(key);
      if (key === "r") resetGame();
    });

    window.addEventListener("keyup", (event) => {
      keys.delete(event.key);
      keys.delete(event.key.toLowerCase());
    });

    restartBtn.addEventListener("click", resetGame);
    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
