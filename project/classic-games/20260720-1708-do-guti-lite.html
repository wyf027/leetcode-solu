<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Do Guti</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col gap-6 px-4 py-6 md:flex-row md:items-center md:justify-center">
    <section class="w-full md:w-[23rem]">
      <p class="text-sm uppercase tracking-[0.26em] text-sky-300">Classic board game</p>
      <h1 class="mt-2 text-3xl font-semibold">Mini Do Guti</h1>
      <p class="mt-3 text-sm leading-6 text-zinc-300">
        双方各两枚棋，从五点棋盘的四角开始。轮流沿线移动到相邻空点，移动后若对手没有合法步可走，即获胜。
      </p>
      <div class="mt-5 grid grid-cols-2 gap-3">
        <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
          <div class="text-sm text-zinc-400">当前回合</div>
          <div id="turnLabel" class="mt-1 text-xl font-semibold text-sky-200">蓝棋</div>
        </div>
        <div class="rounded border border-zinc-700 bg-zinc-900 p-3">
          <div class="text-sm text-zinc-400">步数</div>
          <div id="moveLabel" class="mt-1 text-xl font-semibold text-lime-200">0</div>
        </div>
      </div>
      <div id="message" class="mt-4 min-h-14 rounded border border-sky-400/30 bg-sky-400/10 p-3 text-sm leading-6 text-sky-100">
        蓝棋先手，选择一枚棋子开始。
      </div>
      <button id="resetBtn" class="mt-4 w-full rounded bg-sky-300 px-4 py-3 font-semibold text-zinc-950 transition hover:bg-sky-200">
        重新开始
      </button>
    </section>

    <section class="flex w-full justify-center">
      <div class="relative aspect-square w-full max-w-[34rem] rounded border border-zinc-700 bg-zinc-900 shadow-2xl">
        <svg class="absolute inset-0 h-full w-full" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 12 L16 50 L50 88 L84 50 Z" fill="none" stroke="#e4e4e7" stroke-width="1.4" />
          <path d="M50 12 L50 88 M16 50 L84 50 M16 50 L50 12 M84 50 L50 12 M16 50 L50 88 M84 50 L50 88" fill="none" stroke="#71717a" stroke-width="1" />
        </svg>
        <div id="board" class="absolute inset-0"></div>
      </div>
    </section>
  </main>

  <script>
    const points = [
      { x: 50, y: 12, links: [1, 2, 3] },
      { x: 16, y: 50, links: [0, 2, 4] },
      { x: 50, y: 50, links: [0, 1, 3, 4] },
      { x: 84, y: 50, links: [0, 2, 4] },
      { x: 50, y: 88, links: [1, 2, 3] }
    ];

    const boardEl = document.getElementById("board");
    const turnLabel = document.getElementById("turnLabel");
    const moveLabel = document.getElementById("moveLabel");
    const messageEl = document.getElementById("message");
    const resetBtn = document.getElementById("resetBtn");

    let board;
    let turn;
    let selected;
    let winner;
    let moves;

    function resetGame() {
      board = ["blue", "blue", null, "red", "red"];
      turn = "blue";
      selected = null;
      winner = null;
      moves = 0;
      messageEl.textContent = "蓝棋先手，选择一枚棋子开始。";
      render();
    }

    function other(player) {
      return player === "blue" ? "red" : "blue";
    }

    function playerName(player) {
      return player === "blue" ? "蓝棋" : "红棋";
    }

    function legalTargets(index) {
      return points[index].links.filter((next) => board[next] === null);
    }

    function hasLegalMove(player) {
      return board.some((piece, index) => piece === player && legalTargets(index).length > 0);
    }

    function finishTurn() {
      moves += 1;
      const nextPlayer = other(turn);
      selected = null;

      if (!hasLegalMove(nextPlayer)) {
        winner = turn;
        messageEl.textContent = playerName(turn) + "封锁了对手，赢得本局。";
      } else if (moves >= 40) {
        winner = "draw";
        messageEl.textContent = "40 步未分胜负，本局和棋。";
      } else {
        turn = nextPlayer;
        messageEl.textContent = playerName(turn) + "选择棋子并移动到相邻空点。";
      }
      render();
    }

    function handlePointClick(index) {
      if (winner) return;

      if (selected === null) {
        if (board[index] !== turn) {
          messageEl.textContent = "请选择自己的棋子。";
          return;
        }
        selected = index;
        messageEl.textContent = "已选择棋子，点击相邻空点移动。";
        render();
        return;
      }

      if (index === selected) {
        selected = null;
        messageEl.textContent = playerName(turn) + "重新选择一枚棋。";
        render();
        return;
      }

      if (board[index] === turn) {
        selected = index;
        messageEl.textContent = "已切换选择。";
        render();
        return;
      }

      if (board[index] !== null || !points[selected].links.includes(index)) {
        messageEl.textContent = "只能移动到沿线相邻的空点。";
        return;
      }

      board[index] = turn;
      board[selected] = null;
      finishTurn();
    }

    function render() {
      boardEl.innerHTML = "";
      turnLabel.textContent = winner === "draw" ? "和棋" : winner ? playerName(winner) + "胜" : playerName(turn);
      moveLabel.textContent = moves;

      points.forEach((point, index) => {
        const cell = document.createElement("button");
        const piece = board[index];
        const isSelected = selected === index;
        cell.type = "button";
        cell.setAttribute("aria-label", "棋点 " + (index + 1));
        cell.className = [
          "absolute flex h-16 w-16 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border-2 transition",
          isSelected ? "border-lime-300 bg-lime-300/20" : "border-zinc-400 bg-zinc-950",
          winner ? "cursor-default" : "hover:border-sky-200"
        ].join(" ");
        cell.style.left = point.x + "%";
        cell.style.top = point.y + "%";
        cell.addEventListener("click", () => handlePointClick(index));

        const mark = document.createElement("span");
        if (piece === "blue") {
          mark.className = "block h-10 w-10 rounded-full bg-sky-300 shadow-lg shadow-sky-950/60";
        } else if (piece === "red") {
          mark.className = "block h-10 w-10 rounded-full bg-rose-300 shadow-lg shadow-rose-950/60";
        } else {
          mark.className = "block h-3 w-3 rounded-full bg-zinc-500";
        }
        cell.appendChild(mark);
        boardEl.appendChild(cell);
      });
    }

    resetBtn.addEventListener("click", resetGame);
    resetGame();
  </script>
</body>
</html>
