<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Breakout</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto flex min-h-screen w-full max-w-5xl flex-col items-center justify-center gap-4 px-4 py-6">
    <section class="w-full">
      <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal">Mini Breakout</h1>
          <p class="text-sm text-zinc-400">Move the paddle, clear the wall, and keep the ball alive.</p>
        </div>
        <div class="flex items-center gap-2 text-sm">
          <span class="rounded bg-zinc-800 px-3 py-1">Score: <strong id="score">0</strong></span>
          <span class="rounded bg-zinc-800 px-3 py-1">Lives: <strong id="lives">3</strong></span>
          <button id="restart" class="rounded bg-cyan-500 px-3 py-1 font-medium text-zinc-950 hover:bg-cyan-400">
            Restart
          </button>
        </div>
      </div>
      <div class="overflow-hidden rounded border border-zinc-800 bg-zinc-900 shadow-2xl shadow-cyan-950/20">
        <canvas id="game" width="900" height="560" class="block h-auto w-full"></canvas>
      </div>
      <div class="mt-3 flex flex-wrap justify-between gap-2 text-xs text-zinc-500">
        <span>Controls: Arrow keys, A/D, mouse, or touch.</span>
        <span id="message" class="text-cyan-300">Press Space or tap the board to launch.</span>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const messageEl = document.getElementById("message");
    const restartBtn = document.getElementById("restart");

    const state = {
      score: 0,
      lives: 3,
      running: false,
      left: false,
      right: false,
      gameOver: false,
      win: false
    };

    const paddle = {
      width: 130,
      height: 16,
      x: canvas.width / 2 - 65,
      y: canvas.height - 46,
      speed: 9
    };

    const ball = {
      x: canvas.width / 2,
      y: paddle.y - 12,
      radius: 9,
      dx: 4,
      dy: -5
    };

    const brick = {
      rows: 5,
      cols: 10,
      width: 72,
      height: 24,
      gap: 10,
      top: 70,
      left: 44
    };

    let bricks = [];

    function buildBricks() {
      bricks = [];
      for (let row = 0; row < brick.rows; row += 1) {
        for (let col = 0; col < brick.cols; col += 1) {
          bricks.push({
            x: brick.left + col * (brick.width + brick.gap),
            y: brick.top + row * (brick.height + brick.gap),
            color: ["#22d3ee", "#a3e635", "#facc15", "#fb923c", "#f472b6"][row],
            alive: true
          });
        }
      }
    }

    function resetBall() {
      state.running = false;
      ball.x = paddle.x + paddle.width / 2;
      ball.y = paddle.y - ball.radius - 2;
      ball.dx = Math.random() > 0.5 ? 4 : -4;
      ball.dy = -5;
      messageEl.textContent = "Press Space or tap the board to launch.";
    }

    function restart() {
      state.score = 0;
      state.lives = 3;
      state.gameOver = false;
      state.win = false;
      paddle.x = canvas.width / 2 - paddle.width / 2;
      buildBricks();
      resetBall();
      syncHud();
    }

    function syncHud() {
      scoreEl.textContent = state.score;
      livesEl.textContent = state.lives;
    }

    function launch() {
      if (state.gameOver || state.win) {
        restart();
      }
      state.running = true;
      messageEl.textContent = "Clear every brick.";
    }

    function movePaddle() {
      if (state.left) {
        paddle.x -= paddle.speed;
      }
      if (state.right) {
        paddle.x += paddle.speed;
      }
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      if (!state.running) {
        ball.x = paddle.x + paddle.width / 2;
      }
    }

    function updateBall() {
      if (!state.running) {
        return;
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x < ball.radius || ball.x > canvas.width - ball.radius) {
        ball.dx *= -1;
      }
      if (ball.y < ball.radius) {
        ball.dy *= -1;
      }

      const hitsPaddle =
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.height &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.width &&
        ball.dy > 0;

      if (hitsPaddle) {
        const impact = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
        ball.dx = impact * 6;
        ball.dy = -Math.abs(ball.dy) - 0.05;
      }

      for (const item of bricks) {
        if (!item.alive) {
          continue;
        }
        const hit =
          ball.x + ball.radius > item.x &&
          ball.x - ball.radius < item.x + brick.width &&
          ball.y + ball.radius > item.y &&
          ball.y - ball.radius < item.y + brick.height;

        if (hit) {
          item.alive = false;
          ball.dy *= -1;
          state.score += 10;
          syncHud();
          break;
        }
      }

      if (!bricks.some((item) => item.alive)) {
        state.win = true;
        state.running = false;
        messageEl.textContent = "You cleared the wall. Press Space to play again.";
      }

      if (ball.y > canvas.height + ball.radius) {
        state.lives -= 1;
        syncHud();
        if (state.lives <= 0) {
          state.gameOver = true;
          state.running = false;
          messageEl.textContent = "Game over. Press Space to restart.";
        } else {
          resetBall();
        }
      }
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, "#18181b");
      gradient.addColorStop(1, "#09090b");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
      for (let x = 0; x < canvas.width; x += 45) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
    }

    function drawBricks() {
      for (const item of bricks) {
        if (!item.alive) {
          continue;
        }
        ctx.fillStyle = item.color;
        ctx.fillRect(item.x, item.y, brick.width, brick.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.22)";
        ctx.fillRect(item.x, item.y, brick.width, 5);
      }
    }

    function drawPaddle() {
      ctx.fillStyle = "#67e8f9";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.fillStyle = "#ecfeff";
      ctx.fillRect(paddle.x + 10, paddle.y + 3, paddle.width - 20, 4);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#fafafa";
      ctx.fill();
    }

    function drawOverlay() {
      if (!state.gameOver && !state.win) {
        return;
      }
      ctx.fillStyle = "rgba(9, 9, 11, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 42px system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(state.win ? "You Win" : "Game Over", canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = "18px system-ui, sans-serif";
      ctx.fillStyle = "#a1a1aa";
      ctx.fillText("Press Space or tap to restart", canvas.width / 2, canvas.height / 2 + 28);
    }

    function loop() {
      movePaddle();
      updateBall();
      drawBackground();
      drawBricks();
      drawPaddle();
      drawBall();
      drawOverlay();
      requestAnimationFrame(loop);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        state.left = true;
      }
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        state.right = true;
      }
      if (event.code === "Space") {
        event.preventDefault();
        launch();
      }
    });

    document.addEventListener("keyup", (event) => {
      if (event.key === "ArrowLeft" || event.key.toLowerCase() === "a") {
        state.left = false;
      }
      if (event.key === "ArrowRight" || event.key.toLowerCase() === "d") {
        state.right = false;
      }
    });

    function pointerMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const ratio = canvas.width / rect.width;
      paddle.x = (clientX - rect.left) * ratio - paddle.width / 2;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));
      if (!state.running) {
        ball.x = paddle.x + paddle.width / 2;
      }
    }

    canvas.addEventListener("mousemove", (event) => pointerMove(event.clientX));
    canvas.addEventListener("touchmove", (event) => {
      event.preventDefault();
      pointerMove(event.touches[0].clientX);
    }, { passive: false });
    canvas.addEventListener("click", launch);
    canvas.addEventListener("touchstart", launch);
    restartBtn.addEventListener("click", restart);

    restart();
    loop();
  </script>
</body>
</html>
