<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Number Guess</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-violet-950 text-violet-50">
  <main class="mx-auto flex min-h-screen max-w-2xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Number Guess</h1>
        <p class="text-sm text-violet-200">Guess the secret number from 1 to 100 in seven tries.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-violet-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-violet-700 bg-violet-900 p-3 sm:grid-cols-3">
      <div>Tries Left: <b id="triesText">7</b></div>
      <div>Best Range: <b id="rangeText">1-100</b></div>
      <div id="message">Enter a guess.</div>
    </section>

    <section class="rounded border border-violet-700 bg-violet-900 p-5">
      <label class="mb-2 block text-sm text-violet-200" for="guessInput">Your guess</label>
      <div class="flex gap-2">
        <input id="guessInput" class="min-w-0 flex-1 rounded border border-violet-700 bg-white px-4 py-3 text-xl font-semibold text-violet-950 outline-none focus:ring-2 focus:ring-amber-300" type="number" min="1" max="100" placeholder="1-100">
        <button id="guessBtn" class="rounded bg-lime-300 px-5 py-3 font-semibold text-violet-950 hover:bg-lime-200">Guess</button>
      </div>
    </section>

    <section class="rounded border border-violet-700 bg-violet-900 p-4">
      <h2 class="mb-2 font-semibold">Guess History</h2>
      <div id="historyList" class="grid gap-2 text-sm text-violet-100"></div>
    </section>
  </main>

  <script>
    const maxTries = 7;
    const el = (id) => document.getElementById(id);
    const triesText = el("triesText");
    const rangeText = el("rangeText");
    const message = el("message");
    const guessInput = el("guessInput");
    const guessBtn = el("guessBtn");
    const newGameBtn = el("newGameBtn");
    const historyList = el("historyList");

    let secret;
    let triesLeft;
    let low;
    let high;
    let history;
    let finished;

    function randomSecret() {
      return Math.floor(Math.random() * 100) + 1;
    }

    function clueFor(guess) {
      const distance = Math.abs(secret - guess);
      if (distance === 0) return "Correct";
      if (distance <= 5) return "Very hot";
      if (distance <= 12) return "Warm";
      return "Cold";
    }

    function makeGuess() {
      if (finished) return;
      const guess = Number(guessInput.value);
      if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
        message.textContent = "Use a whole number from 1 to 100.";
        return;
      }
      triesLeft -= 1;
      const clue = clueFor(guess);
      if (guess < secret) low = Math.max(low, guess + 1);
      if (guess > secret) high = Math.min(high, guess - 1);
      history.unshift({ guess, clue, direction: guess < secret ? "higher" : guess > secret ? "lower" : "hit" });
      if (guess === secret) {
        finished = true;
        message.textContent = `You found ${secret}.`;
      } else if (triesLeft === 0) {
        finished = true;
        message.textContent = `Out of tries. The number was ${secret}.`;
      } else {
        message.textContent = `${clue}. Try ${guess < secret ? "higher" : "lower"}.`;
      }
      guessInput.value = "";
      render();
    }

    function render() {
      triesText.textContent = triesLeft;
      rangeText.textContent = `${low}-${high}`;
      guessBtn.disabled = finished;
      historyList.innerHTML = history.length ? history.map((item) => `
        <div class="rounded bg-violet-800 px-3 py-2">
          ${item.guess}: ${item.clue}${item.direction === "hit" ? "" : `, go ${item.direction}`}
        </div>
      `).join("") : "<div>No guesses yet.</div>";
    }

    function newGame() {
      secret = randomSecret();
      triesLeft = maxTries;
      low = 1;
      high = 100;
      history = [];
      finished = false;
      guessInput.value = "";
      message.textContent = "Enter a guess.";
      render();
      guessInput.focus();
    }

    guessBtn.addEventListener("click", makeGuess);
    newGameBtn.addEventListener("click", newGame);
    guessInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") makeGuess();
    });
    newGame();
  </script>
</body>
</html>
