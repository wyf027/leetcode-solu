<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Shut the Box</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-950 text-emerald-50">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Shut the Box</h1>
        <p class="text-sm text-emerald-200">Roll two dice, select open tiles that add to the roll, then shut as many tiles as possible.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-lime-300 px-4 py-2 font-semibold text-emerald-950 hover:bg-lime-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-emerald-700 bg-emerald-900 p-3 sm:grid-cols-4">
      <div>Roll: <b id="rollText">-</b></div>
      <div>Selected: <b id="selectedText">0</b></div>
      <div>Open Sum: <b id="scoreText">45</b></div>
      <div id="message" class="text-emerald-100">Roll to begin.</div>
    </section>

    <section id="tiles" class="grid grid-cols-3 gap-3 sm:grid-cols-9"></section>

    <section class="flex flex-wrap gap-3 rounded border border-emerald-700 bg-emerald-900 p-4">
      <button id="rollBtn" class="rounded bg-amber-300 px-5 py-3 font-semibold text-emerald-950 hover:bg-amber-200">Roll Dice</button>
      <button id="shutBtn" class="rounded bg-sky-300 px-5 py-3 font-semibold text-emerald-950 hover:bg-sky-200">Shut Tiles</button>
      <button id="clearBtn" class="rounded bg-white px-5 py-3 font-semibold text-emerald-950 hover:bg-emerald-100">Clear Pick</button>
    </section>

    <section class="rounded border border-emerald-700 bg-emerald-900 p-4">
      <h2 class="mb-2 font-semibold">Dice</h2>
      <div id="dice" class="flex gap-3 text-5xl"></div>
    </section>
  </main>

  <script>
    const faces = ["", "⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
    const tilesEl = document.getElementById("tiles");
    const diceEl = document.getElementById("dice");
    const rollText = document.getElementById("rollText");
    const selectedText = document.getElementById("selectedText");
    const scoreText = document.getElementById("scoreText");
    const message = document.getElementById("message");
    const rollBtn = document.getElementById("rollBtn");
    const shutBtn = document.getElementById("shutBtn");
    const clearBtn = document.getElementById("clearBtn");
    const newGameBtn = document.getElementById("newGameBtn");
    let openTiles = [];
    let selected = [];
    let roll = 0;
    let dice = [1, 1];
    let gameOver = false;

    function rollDice() {
      dice = [Math.floor(Math.random() * 6) + 1, Math.floor(Math.random() * 6) + 1];
      roll = dice[0] + dice[1];
      selected = [];
      if (!hasMove(roll)) {
        gameOver = true;
        message.textContent = `No tiles can make ${roll}. Final score: ${sumOpenTiles()}.`;
      } else {
        message.textContent = `Rolled ${roll}. Pick open tiles that add to it.`;
      }
      render();
    }

    function sumOpenTiles() {
      return openTiles.reduce((total, value) => total + value, 0);
    }

    function selectedSum() {
      return selected.reduce((total, value) => total + value, 0);
    }

    function hasMove(target) {
      const possible = new Set([0]);
      for (const tile of openTiles) {
        for (const value of [...possible]) {
          if (value + tile <= target) possible.add(value + tile);
        }
      }
      return possible.has(target);
    }

    function toggleTile(value) {
      if (gameOver || !roll || !openTiles.includes(value)) return;
      if (selected.includes(value)) {
        selected = selected.filter((tile) => tile !== value);
      } else if (selectedSum() + value <= roll) {
        selected.push(value);
      }
      render();
    }

    function shutTiles() {
      if (gameOver || !roll) {
        message.textContent = "Roll before shutting tiles.";
        return;
      }
      if (selectedSum() !== roll) {
        message.textContent = `Your selection must add exactly to ${roll}.`;
        return;
      }
      openTiles = openTiles.filter((tile) => !selected.includes(tile));
      selected = [];
      roll = 0;
      if (openTiles.length === 0) {
        gameOver = true;
        message.textContent = "Box shut. Perfect score!";
      } else {
        message.textContent = "Tiles shut. Roll again.";
      }
      render();
    }

    function renderTiles() {
      tilesEl.innerHTML = "";
      for (let value = 1; value <= 9; value += 1) {
        const tile = document.createElement("button");
        const isOpen = openTiles.includes(value);
        const isPicked = selected.includes(value);
        tile.textContent = value;
        tile.disabled = !isOpen || gameOver;
        tile.className = [
          "aspect-square rounded text-2xl font-bold transition",
          isOpen ? "bg-emerald-100 text-emerald-950 hover:bg-lime-200" : "bg-emerald-950 text-emerald-700 line-through",
          isPicked ? "ring-4 ring-amber-300" : ""
        ].join(" ");
        tile.addEventListener("click", () => toggleTile(value));
        tilesEl.appendChild(tile);
      }
    }

    function render() {
      renderTiles();
      diceEl.textContent = roll ? `${faces[dice[0]]} ${faces[dice[1]]}` : "⚂ ⚂";
      rollText.textContent = roll ? String(roll) : "-";
      selectedText.textContent = String(selectedSum());
      scoreText.textContent = String(sumOpenTiles());
      rollBtn.disabled = gameOver || Boolean(roll);
      shutBtn.disabled = gameOver || !roll;
      clearBtn.disabled = gameOver || selected.length === 0;
      [rollBtn, shutBtn, clearBtn].forEach((button) => button.classList.toggle("opacity-50", button.disabled));
    }

    function newGame() {
      openTiles = [1, 2, 3, 4, 5, 6, 7, 8, 9];
      selected = [];
      roll = 0;
      dice = [3, 3];
      gameOver = false;
      message.textContent = "Roll to begin.";
      render();
    }

    rollBtn.addEventListener("click", rollDice);
    shutBtn.addEventListener("click", shutTiles);
    clearBtn.addEventListener("click", () => {
      selected = [];
      render();
    });
    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
