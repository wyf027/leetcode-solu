<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Fortune Teller</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-teal-950 text-teal-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col gap-4 px-4 py-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold">Mini Fortune Teller</h1>
        <p class="text-sm text-teal-200">Pick a color, pick a number, then open the final flap.</p>
      </div>
      <button id="newGameBtn" class="rounded bg-amber-300 px-4 py-2 font-semibold text-teal-950 hover:bg-amber-200">New Game</button>
    </header>

    <section class="grid gap-3 rounded border border-teal-700 bg-teal-900 p-3 sm:grid-cols-3">
      <div>Step: <b id="stepText">1</b></div>
      <div>Moves: <b id="moveText">0</b></div>
      <div id="message">Choose a color.</div>
    </section>

    <section id="paper" class="grid aspect-square max-w-lg grid-cols-2 gap-2 self-center rounded border border-teal-700 bg-teal-900 p-3"></section>

    <section class="rounded border border-teal-700 bg-teal-900 p-3 text-sm text-teal-100">
      A browser-sized version of the paper fortune teller: choices open and close the folded paper until one hidden fortune is revealed.
    </section>
  </main>

  <script>
    const colors = ["Red", "Blue", "Green", "Gold"];
    const numbers = [2, 5, 7, 8];
    const flaps = [
      { label: "11", fortune: "Take the shortcut only after checking the map." },
      { label: "14", fortune: "A small risk pays off before sunset." },
      { label: "17", fortune: "Save one move for the final turn." },
      { label: "20", fortune: "The quiet choice is the strongest one." }
    ];
    const el = (id) => document.getElementById(id);
    const paper = el("paper");
    const stepText = el("stepText");
    const moveText = el("moveText");
    const message = el("message");
    const newGameBtn = el("newGameBtn");

    let step;
    let moves;
    let options;
    let result;

    function countLetters(text) {
      return text.replace(/[^a-z]/gi, "").length;
    }

    function shuffleOptions(items, count) {
      const copy = [...items].sort(() => Math.random() - 0.5);
      return copy.slice(0, count);
    }

    function makeChoice(value) {
      if (result) return;
      moves += 1;
      if (step === 1) {
        const count = countLetters(value);
        options = shuffleOptions(numbers, 4).map((number) => number + count);
        step = 2;
        message.textContent = `Opened ${count} times. Pick a number.`;
      } else if (step === 2) {
        options = shuffleOptions(flaps, 4);
        step = 3;
        message.textContent = `Opened ${value} times. Pick a final flap.`;
      } else {
        result = value.fortune;
        message.textContent = result;
      }
      render();
    }

    function tileMarkup(item, index) {
      const label = typeof item === "object" ? item.label : item;
      const colorClasses = ["bg-rose-300", "bg-sky-300", "bg-lime-300", "bg-amber-300"];
      return `<button data-index="${index}" class="flex items-center justify-center rounded ${colorClasses[index % colorClasses.length]} p-4 text-2xl font-black text-teal-950 hover:brightness-110">${label}</button>`;
    }

    function render() {
      const current = result ? [{ label: "✓", fortune: result }] : options;
      paper.innerHTML = current.map(tileMarkup).join("");
      paper.querySelectorAll("[data-index]").forEach((button) => {
        button.addEventListener("click", () => makeChoice(current[Number(button.dataset.index)]));
      });
      stepText.textContent = result ? "Done" : step;
      moveText.textContent = moves;
    }

    function newGame() {
      step = 1;
      moves = 0;
      options = shuffleOptions(colors, 4);
      result = "";
      message.textContent = "Choose a color.";
      render();
    }

    newGameBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
