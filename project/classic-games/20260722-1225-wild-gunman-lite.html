<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Wild Gunman Lite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col justify-center gap-4 px-4 py-6">
    <section class="flex flex-wrap items-end justify-between gap-3">
      <div>
        <p class="text-sm uppercase tracking-[0.24em] text-yellow-300">Classic quick-draw duel</p>
        <h1 class="text-2xl font-bold text-white">Mini Wild Gunman</h1>
      </div>
      <div class="grid grid-cols-4 gap-2 text-center text-sm">
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-neutral-400">Score</p>
          <p id="score" class="text-lg font-bold text-yellow-300">0</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-neutral-400">Round</p>
          <p id="round" class="text-lg font-bold text-cyan-300">1</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-neutral-400">Wins</p>
          <p id="wins" class="text-lg font-bold text-lime-300">0</p>
        </div>
        <div class="rounded border border-neutral-700 bg-neutral-900 px-3 py-2">
          <p class="text-neutral-400">Best</p>
          <p id="best" class="text-lg font-bold text-orange-300">--</p>
        </div>
      </div>
    </section>

    <div class="rounded border border-neutral-700 bg-neutral-900 p-3 shadow-2xl shadow-yellow-950/30">
      <canvas id="game" width="900" height="540" class="block w-full rounded bg-neutral-950"></canvas>
    </div>

    <section class="flex flex-wrap items-center justify-between gap-3 text-sm text-neutral-300">
      <p>Wait for DRAW, then press Space or click/tap. Shooting early loses the duel.</p>
      <button id="restart" class="rounded bg-yellow-400 px-4 py-2 font-semibold text-neutral-950 hover:bg-yellow-300">Restart</button>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const roundEl = document.getElementById("round");
    const winsEl = document.getElementById("wins");
    const bestEl = document.getElementById("best");
    const restartBtn = document.getElementById("restart");

    let state = "ready";
    let score = 0;
    let round = 1;
    let wins = 0;
    let best = Infinity;
    let timer = 0;
    let drawAt = 0;
    let drawTime = 0;
    let foeShotAt = 0;
    let resultText = "Press Space when the duel begins.";
    let flash = 0;
    let smoke = [];
    let lastTime = 0;

    function updateHud() {
      scoreEl.textContent = score;
      roundEl.textContent = round;
      winsEl.textContent = wins;
      bestEl.textContent = best === Infinity ? "--" : `${Math.round(best)}ms`;
    }

    function reset() {
      state = "ready";
      score = 0;
      round = 1;
      wins = 0;
      best = Infinity;
      timer = 0;
      drawAt = 0;
      drawTime = 0;
      foeShotAt = 0;
      resultText = "Press Space when the duel begins.";
      flash = 0;
      smoke = [];
      updateHud();
    }

    function beginRound() {
      state = "wait";
      timer = 0;
      drawAt = 1.15 + Math.random() * Math.max(0.65, 2.15 - round * 0.08);
      drawTime = 0;
      foeShotAt = 0.45 + Math.random() * Math.max(0.25, 0.85 - round * 0.035);
      resultText = "Hold steady...";
      flash = 0;
      smoke = [];
    }

    function finishRound(won, text, reaction) {
      state = "result";
      timer = 0;
      flash = won ? 0.22 : 0.42;
      if (won) {
        wins += 1;
        best = Math.min(best, reaction);
        score += Math.max(100, 800 - Math.round(reaction * 1.3)) + round * 25;
        resultText = text;
        smoke.push({ x: 352, y: 318, r: 10, life: 0.8 });
      } else {
        resultText = text;
        smoke.push({ x: 552, y: 304, r: 10, life: 0.8 });
      }
      updateHud();
    }

    function shoot() {
      if (state === "ready" || state === "result") {
        beginRound();
        return;
      }
      if (state === "wait") {
        finishRound(false, "Too soon. The marshal calls foul.", Infinity);
        return;
      }
      if (state === "draw") {
        const reaction = performance.now() - drawTime;
        finishRound(true, `Hit in ${Math.round(reaction)}ms.`, reaction);
      }
    }

    function nextRound() {
      round += 1;
      beginRound();
      updateHud();
    }

    function update(dt) {
      timer += dt;
      flash = Math.max(0, flash - dt);
      for (const puff of smoke) {
        puff.life -= dt;
        puff.r += 32 * dt;
        puff.y -= 18 * dt;
      }
      smoke = smoke.filter((puff) => puff.life > 0);
      if (state === "wait" && timer >= drawAt) {
        state = "draw";
        drawTime = performance.now();
        timer = 0;
        resultText = "DRAW!";
      } else if (state === "draw" && timer >= foeShotAt) {
        finishRound(false, "Too slow. The outlaw fired first.", Infinity);
      } else if (state === "result" && timer >= 1.45) {
        nextRound();
      }
    }

    function drawBackdrop() {
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, "#312e81");
      sky.addColorStop(0.48, "#f59e0b");
      sky.addColorStop(1, "#7c2d12");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#78350f";
      ctx.fillRect(0, 360, canvas.width, 180);
      ctx.fillStyle = "#451a03";
      for (let x = 0; x < canvas.width; x += 70) {
        ctx.fillRect(x, 382 + (x % 140 ? 18 : 0), 42, 8);
      }
      ctx.fillStyle = "#1c1917";
      ctx.fillRect(95, 226, 180, 110);
      ctx.fillRect(618, 218, 190, 118);
      ctx.fillStyle = "#fef3c7";
      ctx.font = "bold 16px system-ui";
      ctx.fillText("SALOON", 153, 258);
      ctx.fillText("BANK", 688, 252);
      ctx.fillStyle = "rgba(254, 243, 199, 0.22)";
      ctx.fillRect(274, 78, 352, 64);
    }

    function drawGunman(x, y, color, facing, firing) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(facing, 1);
      ctx.fillStyle = color;
      ctx.fillRect(-25, -72, 50, 70);
      ctx.fillStyle = "#fed7aa";
      ctx.beginPath();
      ctx.arc(0, -92, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#422006";
      ctx.fillRect(-29, -117, 58, 15);
      ctx.fillRect(-18, -130, 36, 18);
      ctx.strokeStyle = "#111827";
      ctx.lineWidth = 7;
      ctx.beginPath();
      if (firing) {
        ctx.moveTo(18, -52);
        ctx.lineTo(72, -64);
        ctx.stroke();
        ctx.strokeStyle = "#fef08a";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(74, -64);
        ctx.lineTo(104, -78);
        ctx.moveTo(76, -64);
        ctx.lineTo(104, -50);
        ctx.stroke();
      } else {
        ctx.moveTo(18, -48);
        ctx.lineTo(48, -24);
        ctx.stroke();
      }
      ctx.strokeStyle = "#292524";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(-12, -4);
      ctx.lineTo(-26, 42);
      ctx.moveTo(12, -4);
      ctx.lineTo(27, 42);
      ctx.stroke();
      ctx.restore();
    }

    function drawSmoke() {
      for (const puff of smoke) {
        ctx.fillStyle = `rgba(245, 245, 244, ${puff.life})`;
        ctx.beginPath();
        ctx.arc(puff.x, puff.y, puff.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawStatus() {
      ctx.fillStyle = "rgba(23, 23, 23, 0.78)";
      ctx.fillRect(246, 84, 408, 52);
      ctx.fillStyle = state === "draw" ? "#fef08a" : "#f5f5f4";
      ctx.font = state === "draw" ? "bold 40px system-ui" : "bold 22px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(resultText, 450, state === "draw" ? 123 : 117);
      ctx.font = "15px system-ui";
      ctx.fillStyle = "#d6d3d1";
      if (state === "ready") {
        ctx.fillText("Space or click starts the first standoff.", 450, 154);
      } else if (state === "result") {
        ctx.fillText("Next outlaw steps up automatically.", 450, 154);
      } else {
        ctx.fillText("Do not shoot before the signal.", 450, 154);
      }
      ctx.textAlign = "left";
    }

    function draw() {
      drawBackdrop();
      const playerFiring = state === "result" && resultText.startsWith("Hit");
      const foeFiring = state === "result" && resultText.includes("outlaw");
      drawGunman(330, 386, "#2563eb", 1, playerFiring);
      drawGunman(570, 386, "#991b1b", -1, foeFiring);
      drawSmoke();
      drawStatus();
      if (flash > 0) {
        ctx.fillStyle = `rgba(254, 240, 138, ${flash})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function loop(time) {
      const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
      lastTime = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    addEventListener("keydown", (event) => {
      if (event.key === " ") {
        event.preventDefault();
        shoot();
      }
    });
    canvas.addEventListener("pointerdown", shoot);
    restartBtn.addEventListener("click", reset);

    reset();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
