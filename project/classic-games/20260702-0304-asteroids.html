<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Asteroids</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-white">
    <main class="mx-auto flex min-h-screen max-w-5xl flex-col gap-4 px-4 py-5">
      <header class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-normal">Mini Asteroids</h1>
          <p class="text-sm text-slate-300">方向键/WASD 推进转向，空格射击，清空陨石进入下一波。</p>
        </div>
        <button
          id="restartBtn"
          class="rounded bg-emerald-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-emerald-400"
          type="button"
        >
          重新开始
        </button>
      </header>

      <section class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="rounded border border-slate-700 bg-slate-900 p-3">
          <div class="text-slate-400">分数</div>
          <div id="score" class="text-xl font-semibold">0</div>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 p-3">
          <div class="text-slate-400">生命</div>
          <div id="lives" class="text-xl font-semibold">3</div>
        </div>
        <div class="rounded border border-slate-700 bg-slate-900 p-3">
          <div class="text-slate-400">波次</div>
          <div id="wave" class="text-xl font-semibold">1</div>
        </div>
      </section>

      <div class="relative overflow-hidden rounded border border-slate-700 bg-black">
        <canvas id="game" class="block h-[68vh] min-h-[420px] w-full"></canvas>
        <div id="overlay" class="pointer-events-none absolute inset-0 hidden items-center justify-center bg-black/70 text-center">
          <div>
            <div id="overlayTitle" class="text-3xl font-semibold">Game Over</div>
            <div id="overlayText" class="mt-2 text-sm text-slate-300">按 Enter 或点击重新开始</div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const livesEl = document.getElementById("lives");
      const waveEl = document.getElementById("wave");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const restartBtn = document.getElementById("restartBtn");

      const keys = new Set();
      const bullets = [];
      const rocks = [];
      let stars = [];
      let score = 0;
      let lives = 3;
      let wave = 1;
      let lastTime = 0;
      let running = true;
      let invincible = 0;

      const ship = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        angle: -Math.PI / 2,
        radius: 14,
        cooldown: 0,
      };

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const scale = window.devicePixelRatio || 1;
        canvas.width = Math.floor(rect.width * scale);
        canvas.height = Math.floor(rect.height * scale);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        stars = Array.from({ length: 80 }, () => ({
          x: Math.random() * rect.width,
          y: Math.random() * rect.height,
          r: Math.random() * 1.4 + 0.4,
        }));
      }

      function width() {
        return canvas.getBoundingClientRect().width;
      }

      function height() {
        return canvas.getBoundingClientRect().height;
      }

      function wrap(obj) {
        const w = width();
        const h = height();
        if (obj.x < -30) obj.x = w + 30;
        if (obj.x > w + 30) obj.x = -30;
        if (obj.y < -30) obj.y = h + 30;
        if (obj.y > h + 30) obj.y = -30;
      }

      function resetShip() {
        ship.x = width() / 2;
        ship.y = height() / 2;
        ship.vx = 0;
        ship.vy = 0;
        ship.angle = -Math.PI / 2;
        ship.cooldown = 0;
        invincible = 2;
      }

      function makeRock(size, x, y) {
        const speed = 35 + Math.random() * 35 + wave * 4;
        const angle = Math.random() * Math.PI * 2;
        const points = Array.from({ length: 9 }, (_, i) => ({
          a: (i / 9) * Math.PI * 2,
          r: (0.72 + Math.random() * 0.38) * size,
        }));
        return {
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size,
          spin: (Math.random() - 0.5) * 1.6,
          angle: 0,
          points,
        };
      }

      function spawnWave() {
        rocks.length = 0;
        const count = Math.min(4 + wave, 9);
        for (let i = 0; i < count; i += 1) {
          const edge = Math.floor(Math.random() * 4);
          const x = edge < 2 ? Math.random() * width() : edge === 2 ? -20 : width() + 20;
          const y = edge >= 2 ? Math.random() * height() : edge === 0 ? -20 : height() + 20;
          rocks.push(makeRock(38, x, y));
        }
      }

      function startGame() {
        score = 0;
        lives = 3;
        wave = 1;
        bullets.length = 0;
        running = true;
        overlay.classList.add("hidden");
        overlay.classList.remove("flex");
        resetShip();
        spawnWave();
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = score;
        livesEl.textContent = lives;
        waveEl.textContent = wave;
      }

      function shoot() {
        if (ship.cooldown > 0 || !running) return;
        bullets.push({
          x: ship.x + Math.cos(ship.angle) * ship.radius,
          y: ship.y + Math.sin(ship.angle) * ship.radius,
          vx: Math.cos(ship.angle) * 360 + ship.vx,
          vy: Math.sin(ship.angle) * 360 + ship.vy,
          life: 0.9,
        });
        ship.cooldown = 0.18;
      }

      function distance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
      }

      function splitRock(index) {
        const rock = rocks[index];
        rocks.splice(index, 1);
        score += rock.size > 20 ? 50 : 100;
        if (rock.size > 20) {
          rocks.push(makeRock(rock.size * 0.58, rock.x, rock.y));
          rocks.push(makeRock(rock.size * 0.58, rock.x, rock.y));
        }
        if (rocks.length === 0) {
          wave += 1;
          spawnWave();
        }
        updateHud();
      }

      function loseLife() {
        if (invincible > 0) return;
        lives -= 1;
        updateHud();
        if (lives <= 0) {
          running = false;
          overlayTitle.textContent = "Game Over";
          overlay.classList.remove("hidden");
          overlay.classList.add("flex");
        } else {
          resetShip();
        }
      }

      function update(dt) {
        if (!running) return;
        const turn = (keys.has("ArrowLeft") || keys.has("a") ? -1 : 0) + (keys.has("ArrowRight") || keys.has("d") ? 1 : 0);
        ship.angle += turn * 4.2 * dt;
        if (keys.has("ArrowUp") || keys.has("w")) {
          ship.vx += Math.cos(ship.angle) * 210 * dt;
          ship.vy += Math.sin(ship.angle) * 210 * dt;
        }
        if (keys.has(" ")) shoot();

        ship.vx *= 0.992;
        ship.vy *= 0.992;
        ship.x += ship.vx * dt;
        ship.y += ship.vy * dt;
        ship.cooldown = Math.max(0, ship.cooldown - dt);
        invincible = Math.max(0, invincible - dt);
        wrap(ship);

        for (let i = bullets.length - 1; i >= 0; i -= 1) {
          const bullet = bullets[i];
          bullet.x += bullet.vx * dt;
          bullet.y += bullet.vy * dt;
          bullet.life -= dt;
          wrap(bullet);
          if (bullet.life <= 0) bullets.splice(i, 1);
        }

        rocks.forEach((rock) => {
          rock.x += rock.vx * dt;
          rock.y += rock.vy * dt;
          rock.angle += rock.spin * dt;
          wrap(rock);
        });

        for (let i = rocks.length - 1; i >= 0; i -= 1) {
          for (let j = bullets.length - 1; j >= 0; j -= 1) {
            if (distance(rocks[i], bullets[j]) < rocks[i].size) {
              bullets.splice(j, 1);
              splitRock(i);
              break;
            }
          }
        }

        for (const rock of rocks) {
          if (distance(rock, ship) < rock.size + ship.radius * 0.7) {
            loseLife();
            break;
          }
        }
      }

      function drawShip() {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.strokeStyle = invincible > 0 && Math.floor(invincible * 10) % 2 ? "#94a3b8" : "#34d399";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-12, -10);
        ctx.lineTo(-7, 0);
        ctx.lineTo(-12, 10);
        ctx.closePath();
        ctx.stroke();
        if (keys.has("ArrowUp") || keys.has("w")) {
          ctx.strokeStyle = "#f59e0b";
          ctx.beginPath();
          ctx.moveTo(-12, -5);
          ctx.lineTo(-24, 0);
          ctx.lineTo(-12, 5);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawRock(rock) {
        ctx.save();
        ctx.translate(rock.x, rock.y);
        ctx.rotate(rock.angle);
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 2;
        ctx.beginPath();
        rock.points.forEach((point, index) => {
          const x = Math.cos(point.a) * point.r;
          const y = Math.sin(point.a) * point.r;
          if (index === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, width(), height());
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, width(), height());
        ctx.fillStyle = "#64748b";
        stars.forEach((star) => {
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
        });
        bullets.forEach((bullet) => {
          ctx.fillStyle = "#f8fafc";
          ctx.beginPath();
          ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
          ctx.fill();
        });
        rocks.forEach(drawRock);
        drawShip();
      }

      function frame(time) {
        const dt = Math.min(0.033, (time - lastTime) / 1000 || 0);
        lastTime = time;
        update(dt);
        draw();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
          event.preventDefault();
        }
        if (event.key === "Enter" && !running) startGame();
        keys.add(event.key.length === 1 ? event.key.toLowerCase() : event.key);
      });
      window.addEventListener("keyup", (event) => keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key));
      window.addEventListener("resize", () => {
        resize();
        resetShip();
      });
      restartBtn.addEventListener("click", startGame);

      resize();
      startGame();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
