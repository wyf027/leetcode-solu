<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Fifteen Puzzle</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-cyan-950 text-cyan-50">
  <main class="mx-auto flex min-h-screen max-w-3xl flex-col justify-center px-5 py-8">
    <section class="rounded-lg border border-cyan-700 bg-cyan-900 p-5 shadow-2xl shadow-black/30">
      <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm uppercase tracking-wide text-yellow-200">Classic Games</p>
          <h1 class="text-3xl font-bold">Mini Fifteen Puzzle</h1>
        </div>
        <button id="shuffleBtn" class="rounded bg-yellow-200 px-4 py-2 font-semibold text-cyan-950 hover:bg-yellow-100">
          Shuffle
        </button>
      </div>

      <div class="mb-5 grid gap-3 sm:grid-cols-3">
        <div class="rounded border border-cyan-700 bg-cyan-800 p-4">
          <p class="text-sm text-cyan-200">Board</p>
          <p class="text-3xl font-bold">4 x 4</p>
        </div>
        <div class="rounded border border-cyan-700 bg-cyan-800 p-4">
          <p class="text-sm text-cyan-200">Moves</p>
          <p id="moveCount" class="text-3xl font-bold">0</p>
        </div>
        <div class="rounded border border-cyan-700 bg-cyan-800 p-4">
          <p class="text-sm text-cyan-200">Empty</p>
          <p id="emptySlot" class="text-3xl font-bold">16</p>
        </div>
      </div>

      <div id="board" class="mx-auto grid max-w-md grid-cols-4 gap-2 rounded-lg bg-cyan-950 p-3"></div>

      <p id="statusText" class="mt-5 min-h-6 rounded border border-cyan-700 bg-cyan-950 p-3 font-semibold">
        Slide numbered tiles into order from 1 to 15.
      </p>
    </section>
  </main>

  <script>
    const size = 4;
    const totalTiles = size * size;
    const solvedTiles = Array.from({ length: totalTiles - 1 }, (_, index) => index + 1).concat(0);
    let tiles = [...solvedTiles];
    let moves = 0;

    const board = document.getElementById("board");
    const moveCount = document.getElementById("moveCount");
    const emptySlot = document.getElementById("emptySlot");
    const statusText = document.getElementById("statusText");
    const shuffleBtn = document.getElementById("shuffleBtn");

    function rowOf(index) {
      return Math.floor(index / size);
    }

    function colOf(index) {
      return index % size;
    }

    function isAdjacent(a, b) {
      return Math.abs(rowOf(a) - rowOf(b)) + Math.abs(colOf(a) - colOf(b)) === 1;
    }

    function isSolved() {
      return tiles.every((value, index) => value === solvedTiles[index]);
    }

    function renderBoard() {
      board.innerHTML = "";
      tiles.forEach((value, index) => {
        const tile = document.createElement("button");
        tile.dataset.index = String(index);
        tile.className = "aspect-square rounded text-2xl font-bold transition";
        if (value === 0) {
          tile.classList.add("bg-cyan-950", "border", "border-cyan-700");
          tile.textContent = "";
        } else {
          tile.classList.add("bg-yellow-200", "text-cyan-950", "shadow", "hover:bg-yellow-100");
          tile.textContent = String(value);
        }
        board.appendChild(tile);
      });
      moveCount.textContent = moves;
      emptySlot.textContent = tiles.indexOf(0) + 1;
    }

    function moveTile(index) {
      const emptyIndex = tiles.indexOf(0);
      if (!isAdjacent(index, emptyIndex)) {
        statusText.textContent = "Only tiles beside the empty space can move.";
        return;
      }
      [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
      moves += 1;
      renderBoard();
      statusText.textContent = isSolved() ? `Solved in ${moves} moves.` : "Good move. Keep sliding.";
    }

    function shuffledNeighbors(emptyIndex) {
      return [emptyIndex - size, emptyIndex + size, emptyIndex - 1, emptyIndex + 1]
        .filter((index) => index >= 0 && index < totalTiles && isAdjacent(index, emptyIndex))
        .sort(() => Math.random() - 0.5);
    }

    function shuffleBoard() {
      tiles = [...solvedTiles];
      let emptyIndex = tiles.indexOf(0);
      let previous = -1;
      for (let step = 0; step < 80; step += 1) {
        const options = shuffledNeighbors(emptyIndex).filter((index) => index !== previous);
        const next = options[0] ?? shuffledNeighbors(emptyIndex)[0];
        [tiles[next], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[next]];
        previous = emptyIndex;
        emptyIndex = next;
      }
      moves = 0;
      statusText.textContent = "Slide numbered tiles into order from 1 to 15.";
      renderBoard();
    }

    board.addEventListener("click", (event) => {
      const tile = event.target.closest("[data-index]");
      if (!tile) return;
      moveTile(Number(tile.dataset.index));
    });

    shuffleBtn.addEventListener("click", shuffleBoard);
    shuffleBoard();
  </script>
</body>
</html>
