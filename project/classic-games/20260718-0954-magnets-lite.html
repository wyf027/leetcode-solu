<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Magnets</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100">
  <main class="mx-auto flex min-h-screen max-w-4xl flex-col gap-6 px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-sm uppercase tracking-[0.2em] text-sky-300">Classic Games</p>
        <h1 class="text-3xl font-bold">Mini Magnets</h1>
        <p class="mt-2 max-w-2xl text-sm text-neutral-300">4x4 磁铁逻辑谜题。点击一组磁铁槽循环空白、+-、-+；满足行列正负数量，且正负极不能与同极正交相邻。</p>
      </div>
      <div class="flex gap-2">
        <button id="hintBtn" class="rounded-md bg-sky-300 px-4 py-2 text-sm font-semibold text-neutral-950 hover:bg-sky-200">提示</button>
        <button id="resetBtn" class="rounded-md border border-neutral-600 px-4 py-2 text-sm font-semibold hover:bg-neutral-800">重开</button>
      </div>
    </header>

    <section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_300px]">
      <div class="rounded-lg border border-neutral-700 bg-neutral-900 p-4">
        <div class="mx-auto grid max-w-[560px] grid-cols-[32px_repeat(4,minmax(0,1fr))_32px] gap-1">
          <div></div>
          <div id="topHints" class="contents"></div>
          <div></div>
          <div id="leftHints" class="contents"></div>
          <div id="board" class="col-span-4 grid aspect-square grid-cols-4 gap-1 rounded-md bg-neutral-700 p-1"></div>
          <div id="rightHints" class="contents"></div>
          <div></div>
          <div id="bottomHints" class="contents"></div>
          <div></div>
        </div>
      </div>

      <aside class="rounded-lg border border-neutral-700 bg-neutral-900 p-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-md bg-neutral-800 p-3">
            <p class="text-xs text-neutral-400">已放极</p>
            <p id="filledCount" class="text-2xl font-bold text-sky-300">0/16</p>
          </div>
          <div class="rounded-md bg-neutral-800 p-3">
            <p class="text-xs text-neutral-400">状态</p>
            <p id="stateBadge" class="text-2xl font-bold text-amber-300">进行中</p>
          </div>
        </div>
        <div class="mt-4">
          <h2 class="text-sm font-semibold">规则检查</h2>
          <ul id="checks" class="mt-3 space-y-2 text-sm text-neutral-300"></ul>
        </div>
        <div class="mt-5 rounded-md border border-neutral-700 p-3 text-xs leading-5 text-neutral-400">
          上方和左侧提示是正极数量；下方和右侧提示是负极数量。粗边框内的两个格子属于同一磁铁槽。
        </div>
      </aside>
    </section>
  </main>

  <script>
    const size = 4;
    const dominoes = [
      [[0, 0], [0, 1]], [[0, 2], [1, 2]], [[0, 3], [1, 3]], [[1, 0], [1, 1]],
      [[2, 0], [3, 0]], [[2, 1], [2, 2]], [[2, 3], [3, 3]], [[3, 1], [3, 2]],
    ];
    const solution = [
      ["+", "-", "+", "-"],
      ["-", "+", "-", "+"],
      ["+", "-", "+", "-"],
      ["-", "+", "-", "+"],
    ];
    const rowPlus = [2, 2, 2, 2];
    const rowMinus = [2, 2, 2, 2];
    const colPlus = [2, 2, 2, 2];
    const colMinus = [2, 2, 2, 2];
    let states = Array(dominoes.length).fill(0);
    let hinted = false;

    function resetGame() {
      states = Array(dominoes.length).fill(0);
      hinted = false;
      render();
    }

    function cellToDomino(row, col) {
      return dominoes.findIndex((pair) => pair.some(([r, c]) => r === row && c === col));
    }

    function valueAt(row, col) {
      const index = cellToDomino(row, col);
      if (index < 0 || states[index] === 0) return "";
      const first = dominoes[index][0][0] === row && dominoes[index][0][1] === col;
      return states[index] === 1 ? (first ? "+" : "-") : (first ? "-" : "+");
    }

    function cycleDomino(index) {
      states[index] = (states[index] + 1) % 3;
      render();
    }

    function useHint() {
      for (let i = 0; i < dominoes.length; i += 1) {
        if (states[i]) continue;
        const [[r, c]] = dominoes[i];
        states[i] = solution[r][c] === "+" ? 1 : 2;
        hinted = true;
        render();
        return;
      }
    }

    function countsForLine(kind, index, value) {
      let count = 0;
      for (let i = 0; i < size; i += 1) {
        const row = kind === "row" ? index : i;
        const col = kind === "row" ? i : index;
        if (valueAt(row, col) === value) count += 1;
      }
      return count;
    }

    function polarityReport() {
      const rowOk = rowPlus.every((target, row) => countsForLine("row", row, "+") <= target)
        && rowMinus.every((target, row) => countsForLine("row", row, "-") <= target);
      const colOk = colPlus.every((target, col) => countsForLine("col", col, "+") <= target)
        && colMinus.every((target, col) => countsForLine("col", col, "-") <= target);
      const rowDone = rowPlus.every((target, row) => countsForLine("row", row, "+") === target)
        && rowMinus.every((target, row) => countsForLine("row", row, "-") === target);
      const colDone = colPlus.every((target, col) => countsForLine("col", col, "+") === target)
        && colMinus.every((target, col) => countsForLine("col", col, "-") === target);
      return { rowOk, colOk, rowDone, colDone };
    }

    function adjacentConflicts() {
      const conflicts = new Set();
      const dirs = [[1, 0], [0, 1], [-1, 0], [0, -1]];
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const value = valueAt(row, col);
          if (!value) continue;
          dirs.forEach(([dr, dc]) => {
            const nr = row + dr;
            const nc = col + dc;
            if (nr < 0 || nr >= size || nc < 0 || nc >= size) return;
            if (valueAt(nr, nc) === value) {
              conflicts.add(`${row},${col}`);
              conflicts.add(`${nr},${nc}`);
            }
          });
        }
      }
      return conflicts;
    }

    function puzzleStats() {
      const filled = states.filter(Boolean).length * 2;
      const polarity = polarityReport();
      const conflicts = adjacentConflicts();
      return {
        filled,
        conflicts,
        rowOk: polarity.rowOk,
        colOk: polarity.colOk,
        adjacencyOk: conflicts.size === 0,
        solved: filled === size * size && polarity.rowDone && polarity.colDone && conflicts.size === 0,
      };
    }

    function pairBorders(row, col) {
      const index = cellToDomino(row, col);
      const pair = dominoes[index];
      const sameTop = pair.some(([r, c]) => r === row - 1 && c === col);
      const sameRight = pair.some(([r, c]) => r === row && c === col + 1);
      const sameBottom = pair.some(([r, c]) => r === row + 1 && c === col);
      const sameLeft = pair.some(([r, c]) => r === row && c === col - 1);
      return [
        sameTop ? "border-t border-neutral-300" : "border-t-4 border-neutral-950",
        sameRight ? "border-r border-neutral-300" : "border-r-4 border-neutral-950",
        sameBottom ? "border-b border-neutral-300" : "border-b-4 border-neutral-950",
        sameLeft ? "border-l border-neutral-300" : "border-l-4 border-neutral-950",
      ].join(" ");
    }

    function renderHints() {
      document.getElementById("topHints").innerHTML = colPlus
        .map((value) => `<div class="flex h-8 items-center justify-center text-sm font-bold text-sky-300">+${value}</div>`)
        .join("");
      document.getElementById("bottomHints").innerHTML = colMinus
        .map((value) => `<div class="flex h-8 items-center justify-center text-sm font-bold text-rose-300">-${value}</div>`)
        .join("");
      document.getElementById("leftHints").innerHTML = rowPlus
        .map((value) => `<div class="flex h-full min-h-20 items-center justify-center text-sm font-bold text-sky-300">+${value}</div>`)
        .join("");
      document.getElementById("rightHints").innerHTML = rowMinus
        .map((value) => `<div class="flex h-full min-h-20 items-center justify-center text-sm font-bold text-rose-300">-${value}</div>`)
        .join("");
    }

    function renderBoard(stats) {
      const boardEl = document.getElementById("board");
      boardEl.innerHTML = "";
      for (let row = 0; row < size; row += 1) {
        for (let col = 0; col < size; col += 1) {
          const index = cellToDomino(row, col);
          const value = valueAt(row, col);
          const button = document.createElement("button");
          button.type = "button";
          button.className = [
            "flex aspect-square items-center justify-center rounded-sm bg-neutral-100 text-3xl font-black text-neutral-950 transition hover:bg-sky-100",
            pairBorders(row, col),
            value === "+" ? "text-sky-600" : value === "-" ? "text-rose-600" : "text-neutral-400",
            stats.conflicts.has(`${row},${col}`) ? "ring-4 ring-amber-400" : "",
          ].join(" ");
          button.textContent = value || "·";
          button.addEventListener("click", () => cycleDomino(index));
          boardEl.appendChild(button);
        }
      }
    }

    function renderChecks(stats) {
      const items = [
        ["行提示当前未超标", stats.rowOk],
        ["列提示当前未超标", stats.colOk],
        ["没有同极正交相邻", stats.adjacencyOk],
      ];
      document.getElementById("checks").innerHTML = items
        .map(([label, ok]) => `<li class="${ok ? "text-sky-300" : "text-amber-300"}">${ok ? "OK" : "!"} ${label}</li>`)
        .join("");
    }

    function render() {
      const stats = puzzleStats();
      renderHints();
      renderBoard(stats);
      renderChecks(stats);
      document.getElementById("filledCount").textContent = `${stats.filled}/16`;
      const badge = document.getElementById("stateBadge");
      badge.textContent = stats.solved ? (hinted ? "完成" : "完美") : "进行中";
      badge.className = `text-2xl font-bold ${stats.solved ? "text-sky-300" : "text-amber-300"}`;
    }

    document.getElementById("resetBtn").addEventListener("click", resetGame);
    document.getElementById("hintBtn").addEventListener("click", useHint);
    resetGame();
  </script>
</body>
</html>
