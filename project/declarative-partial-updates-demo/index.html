<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Single HTML Native Document Patching Demo</title>
  <script>
    tailwind = {
      config: {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'PingFang SC', 'Microsoft YaHei', 'Arial'],
            },
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-neutral-50 text-zinc-950 antialiased">
  <main class="mx-auto grid w-full max-w-7xl gap-5 px-4 py-5 sm:px-6 lg:grid-cols-[1.3fr_0.7fr] lg:px-8">
    <header class="lg:col-span-2">
      <div class="flex flex-col gap-3 border-b border-zinc-200 pb-5 sm:flex-row sm:items-end sm:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-cyan-700">Single HTML</p>
          <h1 class="mt-2 text-2xl font-semibold text-zinc-950 sm:text-3xl">单文件原生局部更新</h1>
        </div>
        <div class="flex items-center gap-2">
          <?start name="stream-state">
          <span class="rounded-full border border-amber-200 bg-amber-50 px-3 py-1 text-sm font-medium text-amber-800">本地 HTML 流准备中</span>
          <?end>
        </div>
      </div>
    </header>

    <section class="grid gap-5 md:grid-cols-2">
      <article class="rounded-lg border border-zinc-200 bg-white p-5 shadow-sm md:col-span-2">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
          <div>
            <p class="text-sm font-medium text-zinc-500">订单号</p>
            <h2 class="mt-1 font-mono text-2xl font-semibold text-zinc-950">ORD-2026-SINGLE-HTML</h2>
          </div>
          <div class="flex flex-wrap gap-2">
            <span class="rounded-full border border-zinc-200 bg-zinc-50 px-3 py-1 text-sm font-medium text-zinc-700">无 Node 服务</span>
            <span class="rounded-full border border-cyan-200 bg-cyan-50 px-3 py-1 text-sm font-medium text-cyan-800">原生 patch</span>
          </div>
        </div>
        <dl class="mt-5 grid gap-4 text-sm sm:grid-cols-3">
          <div class="border-t border-zinc-200 pt-4">
            <dt class="text-zinc-500">客户</dt>
            <dd class="mt-1 font-medium text-zinc-950">单文件演示客户</dd>
          </div>
          <div class="border-t border-zinc-200 pt-4">
            <dt class="text-zinc-500">金额</dt>
            <dd class="mt-1 font-medium text-zinc-950">¥ 42,800.00</dd>
          </div>
          <div class="border-t border-zinc-200 pt-4">
            <dt class="text-zinc-500">来源</dt>
            <dd class="mt-1 font-medium text-zinc-950">streamAppendHTMLUnsafe()</dd>
          </div>
        </dl>
      </article>

      <article class="rounded-lg border border-zinc-200 bg-white p-5 shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-base font-semibold text-zinc-950">支付状态</h2>
          <?start name="payment-badge">
          <span class="rounded-full border border-zinc-200 bg-zinc-50 px-2.5 py-1 text-xs font-medium text-zinc-600">等待</span>
          <?end>
        </div>
        <?start name="payment">
        <div class="mt-4 min-h-[138px] rounded-lg border border-dashed border-zinc-300 bg-zinc-50 p-4">
          <div class="h-4 w-28 animate-pulse rounded bg-zinc-200"></div>
          <div class="mt-4 h-3 w-full animate-pulse rounded bg-zinc-200"></div>
          <div class="mt-2 h-3 w-2/3 animate-pulse rounded bg-zinc-200"></div>
        </div>
        <?end>
      </article>

      <article class="rounded-lg border border-zinc-200 bg-white p-5 shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-base font-semibold text-zinc-950">风控结果</h2>
          <?start name="risk-badge">
          <span class="rounded-full border border-zinc-200 bg-zinc-50 px-2.5 py-1 text-xs font-medium text-zinc-600">等待</span>
          <?end>
        </div>
        <?start name="risk">
        <div class="mt-4 min-h-[138px] rounded-lg border border-dashed border-zinc-300 bg-zinc-50 p-4">
          <div class="h-4 w-24 animate-pulse rounded bg-zinc-200"></div>
          <div class="mt-4 h-3 w-full animate-pulse rounded bg-zinc-200"></div>
          <div class="mt-2 h-3 w-3/4 animate-pulse rounded bg-zinc-200"></div>
        </div>
        <?end>
      </article>

      <article class="rounded-lg border border-zinc-200 bg-white p-5 shadow-sm md:col-span-2">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-base font-semibold text-zinc-950">发票与履约</h2>
          <?start name="fulfillment-badge">
          <span class="rounded-full border border-zinc-200 bg-zinc-50 px-2.5 py-1 text-xs font-medium text-zinc-600">等待</span>
          <?end>
        </div>
        <?start name="fulfillment">
        <div class="mt-4 grid min-h-[138px] gap-4 sm:grid-cols-2">
          <div class="rounded-lg border border-dashed border-zinc-300 bg-zinc-50 p-4">
            <div class="h-4 w-24 animate-pulse rounded bg-zinc-200"></div>
            <div class="mt-4 h-3 w-full animate-pulse rounded bg-zinc-200"></div>
            <div class="mt-2 h-3 w-1/2 animate-pulse rounded bg-zinc-200"></div>
          </div>
          <div class="rounded-lg border border-dashed border-zinc-300 bg-zinc-50 p-4">
            <div class="h-4 w-20 animate-pulse rounded bg-zinc-200"></div>
            <div class="mt-4 h-3 w-full animate-pulse rounded bg-zinc-200"></div>
            <div class="mt-2 h-3 w-3/5 animate-pulse rounded bg-zinc-200"></div>
          </div>
        </div>
        <?end>
      </article>
    </section>

    <aside class="rounded-lg border border-zinc-200 bg-white p-5 shadow-sm">
      <div class="flex items-center justify-between gap-3">
        <h2 class="text-base font-semibold text-zinc-950">本地流事件</h2>
        <span class="font-mono text-xs text-zinc-500">native</span>
      </div>
      <ol class="mt-4 grid max-h-[620px] gap-3 overflow-auto pr-1">
        <?start name="events">
        <li class="rounded-lg border border-zinc-200 bg-zinc-50 px-4 py-3 text-sm text-zinc-600">等待本地 HTML 流写入 patch...</li>
        <?end>
      </ol>
    </aside>
  </main>

  <script type="module">
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function patch(target, html) {
      return `
    <template for="${target}">
    ${html}
    </template>`;
        }

        function eventPatch(title, detail, tone) {
          const tones = {
            cyan: 'border-cyan-200 bg-cyan-50 text-cyan-950',
            emerald: 'border-emerald-200 bg-emerald-50 text-emerald-950',
            amber: 'border-amber-200 bg-amber-50 text-amber-950',
            rose: 'border-rose-200 bg-rose-50 text-rose-950',
          };

          return patch(
            'events',
            `<li class="rounded-lg border ${tones[tone]} px-4 py-3">
              <div class="flex items-center justify-between gap-3">
                <span class="text-sm font-semibold">${title}</span>
                <span class="shrink-0 font-mono text-xs text-zinc-500">${new Date().toLocaleTimeString('zh-CN', {
                  hour12: false,
                })}</span>
              </div>
              <p class="mt-1 text-sm text-zinc-600">${detail}</p>
            </li>
            <?marker name="events">`,
          );
        }

        async function runNativeSingleFileDemo() {
          if (!document.body.streamAppendHTMLUnsafe) {
            console.warn('streamAppendHTMLUnsafe() is not available. Enable Chrome Document patching / Experimental Web Platform Features and relaunch Chrome.');
            return;
          }

          const writer = document.body.streamAppendHTMLUnsafe().getWriter();

          await wait(650);
          await writer.write(`
    ${patch('risk-badge', '<span class="rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-800">已完成</span>')}
    ${patch(
      'risk',
      `<div class="mt-4 min-h-[138px] rounded-lg border border-emerald-200 bg-emerald-50 p-4 text-emerald-950">
        <p class="text-sm font-medium text-emerald-800">自动风控通过</p>
        <p class="mt-3 text-3xl font-semibold">低风险</p>
        <p class="mt-3 text-sm text-emerald-800">命中 0 条拦截规则，信用额度充足。</p>
      </div>`,
    )}
    ${eventPatch('风控模块完成', '这个 patch 由单文件脚本写入本地 HTML 流。', 'emerald')}
    `);

          await wait(900);
          await writer.write(`
    ${patch('payment-badge', '<span class="rounded-full border border-cyan-200 bg-cyan-50 px-2.5 py-1 text-xs font-medium text-cyan-800">已支付</span>')}
    ${patch(
      'payment',
      `<div class="mt-4 min-h-[138px] rounded-lg border border-cyan-200 bg-cyan-50 p-4 text-cyan-950">
        <p class="text-sm font-medium text-cyan-800">支付网关回执</p>
        <p class="mt-3 text-3xl font-semibold">¥ 42,800.00</p>
        <p class="mt-3 font-mono text-sm text-cyan-800">TXN-SINGLE-HTML-583021</p>
      </div>`,
    )}
    ${eventPatch('支付状态完成', '这里没有 fetch，也没有手动 DOM 替换。', 'cyan')}
    `);

          await wait(700);
          await writer.write(`
    ${eventPatch('出库预占完成', '同一个 marker 可以被多次追加写入。', 'amber')}
    `);

          await wait(850);
          await writer.write(`
    ${patch('fulfillment-badge', '<span class="rounded-full border border-amber-200 bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-800">已生成</span>')}
    ${patch(
      'fulfillment',
      `<div class="mt-4 grid min-h-[138px] gap-4 sm:grid-cols-2">
        <div class="rounded-lg border border-amber-200 bg-amber-50 p-4 text-amber-950">
          <p class="text-sm font-medium text-amber-800">电子发票</p>
          <p class="mt-3 text-xl font-semibold">INV-SINGLE-HTML-0019</p>
          <p class="mt-3 text-sm text-amber-800">抬头与税号校验通过。</p>
        </div>
        <div class="rounded-lg border border-rose-200 bg-rose-50 p-4 text-rose-950">
          <p class="text-sm font-medium text-rose-800">履约队列</p>
          <p class="mt-3 text-xl font-semibold">待人工复核</p>
          <p class="mt-3 text-sm text-rose-800">大额订单进入 14:30 批次。</p>
        </div>
      </div>`,
    )}
    ${eventPatch('履约模块完成', '最后一个慢模块抵达后，页面没有整页刷新。', 'rose')}
    ${patch('stream-state', '<span class="rounded-full border border-emerald-200 bg-emerald-50 px-3 py-1 text-sm font-medium text-emerald-800">本地 HTML 流已结束</span>')}
    `);

          await writer.close();
        }

        runNativeSingleFileDemo();
  </script>
</body>
</html>
